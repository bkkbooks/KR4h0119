body:
  text: 古樂苑卷三十五明梅鼎祚編雜曲歌辭晉宴飲歌晉書曰髙祖伐公孫淵過溫見父老故舊宴飲纍日悵然有盛為歌曰晉宣帝天地開闢日月重光遭逢際會奉辭遐方將掃羣穢還過故鄉肅清萬里總齊八荒告成歸老待罪武陽羣一作逋輕薄篇樂府解題曰輕薄篇言乘肥馬衣輕裘馳逐經過為樂與少年行同意何遜云城東美少年張正見云洛陽美少年是也晉張華末世多輕薄驕代好浮華志意能放逸資財亦豐奢被服極纎麗肴膳盡柔嘉僮僕餘粱肉婢妾蹈綾羅文軒樹羽蓋乘馬鳴玉珂橫簪刻玳瑁長鞭錯象牙足下金鑮履手中雙莫邪賔從煥絡繹侍御何芬葩朝與金張期暮宿許史家甲第面長街朱門赫嵯峨蒼梧竹葉清宜城九醖醝浮醪隨觴轉素蟻自跳波美女興齊趙妍唱出西巴一顧傾城國千金寧足多北里獻竒舞大陵奏名歌新聲踰激楚妙伎絶陽阿玄鶴降浮雲鱏魚躍中河墨翟且停車展季猶咨嗟淳于前行酒雍門坐相和孟公結重關賔客不得蹉三雅來何遲耳熱眼中花盤桉互交錯坐席咸喧譁簮珥咸墮落冠冕皆傾邪酣飲終日夜明燈繼朝霞絶纓尚不尤安能復顧他留連彌信宿此歡難可過人生若浮寄年時忽蹉跎促促朝露期榮樂遽幾何念此腸中悲涕下自滂沱但畏執法吏禮防且切磋代一作或能一作既傾城國一作城國傾寧一作不同前梁何遜城東美少年重身輕萬億柘彈隨珠九白馬黃金飾長安九逵上青槐蔭道植轂擊晨已喧肩排暝不息走狗通西望牽牛亘南直相期百戲傍去來三市側象牀沓繡被玉盤傳綺食大姊掩扇歌小妹開簾織相看獨隱笑見人還斂色黃鵠悲故羣山枝詠新識烏飛過客盡雀聚行龍匿酌羽方厭厭此時歡未極城東一作長安飾一作勒大姊一作娼女妹一作婦同前陳張正見洛陽美年少朝日正開霞細蹀連錢馬傍趨苜蓿花揚鞭還却望春色滿東家井桃映水落門桞雜風斜綿蠻弄青綺蛺蝶繞承華欲往飛廉館遙駐季倫車石榴傳馬腦蘭肴奠象牙聊持自娛樂未是鬬豪奢莫嫌龍馭晚扶桑復浴鴉遊俠篇漢書遊俠傳曰戰國時列國公子魏有信陵趙有平原齊有孟嘗楚有春申皆藉王公之勢競為遊俠以取重諸侯顯名天下故後世稱遊俠者以四豪為首焉漢興有魯人朱家及劇孟郭解之徒馳騖於閭里皆以俠聞其後長安熾盛街閭各有豪俠時萬章在城西桞市號曰城西萬章酒市有趙君都賈子光皆長安名豪報仇怨養刺客者也魏志曰楊阿若後名豐字伯陽少遊俠常以報仇解怨為事故時人為之號曰東市相斫楊阿若西市相斫楊阿若後世遂有遊俠曲魏陳琳晉張華又有博陵王宫俠曲晉張華翩翩四公子濁世稱賢明龍虎相交爭七國並抗衡食客三千餘門下多豪英遊説朝夕至辨士自從橫孟嘗東出關濟身由雞鳴信陵西反魏秦人不窺兵趙勝南詛楚乃與毛遂行黃歇北適秦太子還入荆美哉遊俠士何以尚四卿我則異於是好古師老彭不窺兵一作開濟強同前題云遊俠一云古意英華作樂府姑從之梁王僧孺青絲控燕馬紫艾飾吳刀朝風吹錦帶落日映珠袍陸離關右客照耀山西豪雖非學詭遇終是任逢遭人生會有死得處如鴻毛寧能偶雞鶩寂寞隱蓬蒿同前周王褒京洛出名謳豪俠競交遊河南期四姓關西謁五侯鬬雞橫大道走馬出長楸桑隂徙將夕槐路轉淹留同前英華作俠客行詩彚併入陳子良隋陳良洛陽麗春色遊俠騁輕肥水逐車輪轉塵隨馬足飛雲影遙臨蓋花氣近薰衣東郊鬬雞罷南陂射雉歸日暮河橋上揚鞭惜晚暉俠客篇梁王筠俠客趨名利劒氣坐相矜黃金塗鞘尾白玉飾鈎膺晨馳逸廣陌日暮返平陵舉鞭向趙李與君方代興博陵王宫俠曲二首晉張華俠客樂幽險築室窮山隂獠獵野獸稀施網川無禽嵗暮飢寒至慷慨頓足吟窮令壯士激安能懷苦心干將坐自佩繁弱控餘音耕佃窮淵陂種粟著劒鐔收秋狹路間一擊重千金棲遲熊羆冗容與虎豹林身在法令外縱逸常不禁雄兒任氣俠聲蓋少年場借友行報怨殺人租市旁吳刀鳴手中利劍嚴秋霜腰間義素戟手持白頭鑲騰超如激電回旋如流光奮擊當手決交尸自縱橫寧為殤鬼雄義不入圜墻生從命子遊死聞俠骨香身沒心不懲勇氣加四方壯士篇燕荆軻歌曰風蕭蕭兮易水寒壯士一去兮不復還壯士篇蓋出於此晉張華天地相震蕩回薄不知窮人物稟常格有始必有終年時俯仰過功名宜速崇壯士懷憤激安能守虗沖乘我大宛馬撫我繁弱弓長劒橫九野髙冠拂玄穹慷慨成素霓嘯吒起清風震響駭八荒奮威曜四戎濯鱗滄海畔馳騁大漠中獨步聖明世四海稱英雄知一作可遊獵篇晉張華嵗暮凝霜結堅氷沍幽泉厲風蕩原隰浮雲蔽昊天玄雲暗􅀈合素雪紛連翩鷹隼始擊鷙虞人獻時鮮嚴駕鳴儔侣攬轡過中田戎車方四牡文軒馭紫燕輿徒既整飭容貌麗且妍武騎列重圍前驅抗修旃倐忽似回飈絡繹若浮煙鼓噪山淵動衝塵雲霧連輕繒拂素霓纎網蔭長川遊魚未暇竄歸鴈不得還由基控繁弱公差操黃間機發應弦倒一縱連雙肩僵禽正狼藉落羽何翻翻積獲被山阜流血丹中原馳騁未及倦曜靈俄移晷結罝彌藪澤囂聲振四鄙鳥驚觸白刃獸駭挂流矢仰手接遊鴻舉足蹴犀兕如黃批狡兔青骹撮飛雉鵠鷺不盡收鳬鷖安足視日冥徒御勞賞勤課能否野饗會衆賓玄酒甘且旨燔炙播遺芳金觴浮素蟻珍羞墜歸雲纎肴出淥水四氣運不停年時何亹亹人生忽如寄居世遽能幾至人同禍福達士等生死榮辱渾一門安知惡與美遊放使心狂覆車難再履伯陽為我誡檢迹投清軌行行且遊獵篇梁劉孝威之罘講射所上林娛獵場選徒驕楚客召狩誇胡王罕車已戒道風烏復起行佽飛具矰繳材官命蹶張髙罝掩月兔徑矢射天狼跖地不遑逸排虛豈及翔日暮勾陳轉風清饒吹揚歸來宴平樂寧肯滯禽荒雲中白子髙行晉傅玄陵陽子來眀意欲作天與仙人遊超登元氣攀日月遂造天門將上謁閶闔闢見紫微綘闕紫宫崔嵬髙殿嵯峨雙闕萬丈玉樹羅童女掣電䇿童男挽雷車雲漢隨天流浩浩如江河因王長公謁上皇鈞天樂作不可詳龍仙神仙教我靈祕八風子儀與遊我祥我心何戚戚思故鄉俯看故鄉二儀設張樂哉二儀日月運移地東南傾天西北馳鶴五氣所補鼇四足所支齊駕飛龍驂赤螭逍遙五嶽間東西馳長與天地並復何為復何為西長安行樂府解題曰西長安行晉傅休奕云所思兮何在乃在西長安其下因敘别離之意也三輔舊事曰長安城似北斗周地圖記曰長安城南為南斗形北為北斗形通典曰漢髙帝自櫟陽徙都長安至惠帝方發人徒築城即長安西北古城是也晉傅玄所思兮何在乃在西長安何用存問妾香橙雙珠環何用重存問羽爵翠琅玕今我兮問君更有兮異心香亦不可燒環亦不可沈香燒日有歇環沈日自深前有一樽酒行晉傅玄置酒結此會主人起行觴玉樽兩楹間絲理東西廂舞袖一何妙變化窮萬方賓主齊德量欣欣樂未央同享千年夀朋來會此堂同前陳後主殿髙絲吹滿日落綺羅鮮莫論朝漏促傾巵待夕筵同前張正見前有一樽酒主人行夀今日合來坐者當令皆富且夀欲令主人三萬嵗終嵗不知老為吏當髙遷賈市得萬倍桑蠶當大得主人宜子孫飛塵篇晉傅玄飛塵穢清流朝雲蔽日光秋蘭豈不芬鮑肆亂其芳河決潰金隄一手不能障秋蘭篇秋蘭本出於楚辭離騷云秋蘭兮􅐘蕪羅生兮堂下緑葉兮素華芳菲菲兮襲豫蘭香草言芳香菲菲上及於我也傅玄秋蘭篇云秋蘭蔭玉池池水且芳香其旨言婦人之託君子猶秋蘭之蔭玉池與楚辭同意晉傅玄秋蘭蔭玉池池水清且芳芙蓉隨風發中有雙鴛鴦雙魚自踴躍兩鳥時回翔君其歷九秋與妾同衣裳清且芳一作且芳香其一作期明月篇藝文作怨詩一作朗月篇晉傅玄皎皎明月光灼灼朝日暉昔為春蠶絲今為秋女衣丹唇列素齒翠彩發蛾眉嬌子多好言歡合易為姿玉顔盛有時秀色隨年衰常恐新間舊變故興細微浮萍本無根非水將何依憂喜更相接樂極還自悲本無根一作無根本眀月子陳謝燮杪秋之遙夜眀月照髙樓登樓一回望望見東陌頭故人眇千里言别歷九秋相思不相見望望空離憂東一作南朗月行宋鮑照朗月出東山照我綺窗前窗中多佳人被服妖且妍靚妝坐帷裏當户弄清弦鬢奪衛女迅體絶飛燕先為君歌一曲當作朗月篇酒至顔自解聲和心亦宣千金何足重所存意氣間當作朗月篇一作堂上朗月篇車遙遙篇一作梁車􅛴今從玉臺晉傅玄車遙遙兮馬洋洋追思君兮不可忘君安遊兮西入秦願為影兮隨君身君在隂兮影不見君依光兮妾所願天行篇晉傅玄天行一何健日月無髙蹤百川皆赴海三辰回泰蒙百川皆赴海藝文作百川赴暘谷三光篇初學作劉孝綽晉傅玄三光垂象表天地有晷度聲和音響應形立影自附素日抱玄烏眀月懷靈兔吳楚歌一曰燕人美篇按漢樂府有吳楚汝南歌詩十五篇晉傅玄燕人美兮趙女佳其室則邇兮限層崖雲為車兮風為馬玉在山兮蘭在野雲無期兮風有止思多端兮誰能理一作思心多端誰能理天行歌晉傅玄天時泰兮照以陽清風起兮景雲翔仰觀兮辰象日月兮運周俯視兮河海百川兮東流日升歌晉傅玄東光升朝陽羲和初攬轡六龍並騰驤逸景何晃晃旭日照萬方皇德配天地神眀鑒幽荒驚靁歌晉傅玄驚靁奮兮震萬里威陵宇宙兮動四海六合不維兮誰能理雲歌晉傅玄白雲翩翩翔天庭流景髣佛非君形白雲飄飄捨我髙翔青雲裴回為我愁腸同前梁王臺鄉玉雲初度色金風送影來全生疑魄暗半去月時開欲知無處所一為上陽臺蓮歌晉傅玄渡江南採蓮花芙蓉增敷曄若星羅緑葉映長波回風容與動纎柯雜歌晉傅玄鳯有翼龍有鱗君不獨興必須良臣歌辭晉傅玄靁師鳴鐘鼓風伯吹笙簧西母出穴聽王父吟東廂昔思君晉傅玄昔君與我兮形影潛結今君與我兮雲飛雨絶昔君與我兮音響相和今君與我兮落葉去柯昔君與我兮金石無虧今君與我兮星滅光離君子有所思行樂府解題曰君子有所思行晉陸機云命駕登北山宋鮑照云西上登雀臺梁沈約云晨策終南首其旨言雕室麗色不足為久歡宴安鴆毒滿盈所宜敬忌與君子行異也晉陸機命駕登北山延佇望城郭㕓里一何盛街巷紛漠漠甲第崇髙闥洞房結阿閣曲池何湛湛清川帶華薄邃宇列綺窗蘭室接羅幕淑貌色斯升哀音承顔作人生盛行邁容華隨年落善哉膏粱士營生奧且博宴安消靈根鴆毒不可恪無以肉食資取笑藜與藿藜一作葵同前宋謝靈運總駕越鍾陵還顧望京畿躑躅周名都遊目倦忘歸市鄽無厄室世族有髙闈密親麗華苑軒甍飾通逵孰是金張樂諒由燕趙詩長夜恣酣飲窮年弄音徽盛往速露墜衰來疾風飛餘生不歡娛何以竟暮歸寂寥曲肱子瓢飲療朝飢所秉自天性貧富豈相譏倦一作卷厄一作夾同前鮑照西上登雀臺東下望雲闕層閣肅天居馳道直如髮繡甍結飛霞璇題納行月築山擬蓬壺穿池類溟渤選色遍齊岱徵聲匝卭越陳鍾陪夕宴笙歌待眀發年貌不可留身意會盈歇蟻壤漏山河絲淚毁金骨器惡含滿欹物忌厚生沒智哉衆多士服理辨昭晰一作昭昧叶末河一作阿同前梁沈約晨策終南首顧望咸陽川戚里遡層闕甲館負崇軒復塗希紫閣重臺擬望仙巴姬幽蘭奏鄭女陽春弦共矜紅顔日俱忘白髮年寂寥茂陵宅照曜未央蟬無以五鼎盛顧嗤三經玄齊謳行漢書曰漢王至南鄭諸將及士卒皆歌謳思東歸顔師古曰謳齊歌也謂齊聲而歌或曰齊地之歌禮樂志曰齊古謳員六人梁元帝纂要曰齊歌曰謳是也陸機齊謳行備言齊地之美亦欲使人推分直進不可妄有所營也晉陸機營丘負海曲沃野爽且平洪川控河濟崇山入髙冥東被姑尤側南界聊攝城海物錯萬類陸産尚千名孟諸吞楚夢百二侔秦京惟師恢東表柦侯定周傾天道有迭代人道無久盈鄙哉牛山歎未及至人情爽鳩茍己徂吾子安得停行行將復去長存非所營同前梁沈約東秦稱右地川隰固夷昶層峯駕蒼雲濁河流素壤青丘良杳鬱雪宫信疏敞王佐改殷命霸功繆周網闕齊歌行齊陸厥黃金徒滿籝不如守章句雪宫紛多士稷下岌成覆同載雙連珠合席懸河注垂帷五行下操筆百金賦華屋大車方髙門駟馬驅玄豹空不食南山隱雲霧覆一作露珠一作璧吳趨行崔豹古今注曰吳趨行吳人以歌其地陸機吳趨行曰聽我歌吳趨趨步也晉陸機楚妃且勿歎齊娥且莫謳四坐並清聽聽我歌吳趨吳趨自有始請從閶門起閶門何峨峨飛閣跨通波重欒承遊極回軒啓曲阿藹藹慶雲被泠泠鮮風過山澤多藏育土風清且嘉泰伯𨗳仁風仲雍楊其波穆穆延陵子灼灼光諸華王迹穨陽九帝功興四遐大皇自富春矯首頓世羅邦彥應運興粲若春林葩屬城咸有士吳邑最為多八族未足侈四姓實名家文德熙淳懿武功侔山河禮讓何濟濟流化自滂沱淑美難窮紀商𣙜為此歌始一作紀峨峨一作嵯峨鮮一作祥首一作手同前樂府不載名氏次陸機後六朝詩彚遂作機詩按此格調必非晉人姑從附入繭滿蓋重簾唯有逺相思藕葉清朝釧何見早歸時歸一作還同前梁元帝水裏生蔥翅池心恆欲飛蓮花逐牀返何時乘𦪙歸悲哉行歌録曰悲哉行魏眀帝造樂府解題曰陸機云遊客芳春林謝惠連云羇人感淑節皆言客遊感物憂思而作也晉陸機遊客芳春林春芳傷客心和風飛清響鮮雲垂薄陰蕙草饒淑氣時鳥多好音翩翩鳴鳩羽喈喈倉庚吟幽蘭盈通谷長莠被髙岑女蘿亦有託蔓葛亦有尋傷哉客遊士憂思一何深目感隨氣草耳悲詠時禽寤寐多逺念緬然若飛沈願託歸風響寄言遺所欽吟一作音同前陸士美集亦載誤宋謝靈運萋萋春草生王孫遊有情差池燕始飛夭裊桃始榮灼灼桃悅色飛飛燕弄聲岩上雲結陰澗下風吹清幽樹雖改觀終始在初生松蔦歡蔓延樛葛欣虆縈眇然遊宦子晤言時未并鼻感改朔氣眼傷變節榮侘傺豈徒然澶漫絶音形風來不可託鳥去豈為聽眼一作心澶一作緬同前鮑照集亦載謝惠連羇人感淑節緣感欲回轍我行詎幾時華實驟舒結覩實情有悲瞻華意無悅覽物懷同志如何復乖别翩翩翔禽羅關關鳴鳥列翔禽常疇偶所歎獨乖絶翔禽一作翔鳴同前梁沈約旅遊媚年春年春媚遊人徐光旦垂彩和露曉凝津時嚶起稚葉蕙氣動初蘋一朝阻舊國萬里隔良辰百年歌十首晉陸機一十時顔如蕣華曄有暉體如飄風行如飛孌彼孺子相追隨終朝出遊薄暮歸六情逸豫心無違清酒漿炙奈樂何清酒漿炙奈樂何二十時膚體彩澤人理成美目淑貌灼有榮被服冠帶麗且清光車駿馬遊都城髙談雅步何盈盈清酒漿炙奈樂何清酒漿炙奈樂何三十時行成名立有令聞力可扛鼎志干雲食如漏巵氣如熏辭家觀國綜典文髙冠素帶煥翩紛清酒漿炙奈樂何清酒漿炙奈樂何四十時體力克壯志方剛跨州越郡還帝鄉出入承眀擁大璫清酒漿炙奈樂何清酒漿炙奈樂何五十時荷旄仗節鎮邦家鼓鐘嘈噆趙女歌羅衣綷粲金翠華言笑雅舞相經過清酒漿炙奈樂何清酒漿炙奈樂何六十時年亦耆艾業亦隆驂駕四牡入紫宫軒冕婀那翠雲中子孫昌盛家道豐清酒漿炙奈樂何清酒漿炙奈樂何七十時精爽頗損膂力愆清水眀鏡不欲觀臨樂對酒轉無歡攬形羞髮獨長歎形一作衣羞一作翛八十時眀已損目聰去耳前言往行不復紀辭官致祿歸桑梓安車駟馬入舊里樂事告終憂事始九十時日告耽瘁月告衰形體雖是志意非言多謬誤心多悲子孫朝拜或問誰指景玩日慮安危感念平生淚交揮百嵗時盈數已登肌肉單四支百節還相患目若濁鏡口垂涎呼吸嚬蹙反側難茵褥滋味不復安女怨詩晉皇甫謐婚禮既定婚禮臨成施襟結帨三命丁寧逸民吟晉潘尼我顧傲世自遺舒志六合由巢是追沐浴池洪迅羽衣陟彼名山採此芝薇朝雲靉靆行露未晞遊魚羣戲翔鳥雙飛逍遙慱觀日晏忘歸嗟哉四士從我者誰嬌女詩按神弦曲有嬌女詩不知此亦同否今附入晉左思吾家有嬌女皎皎頗白晳小字為織素口齒自清厯鬢髮覆廣額雙耳似連璧眀朝弄梳臺黛眉類掃迹濃朱衍丹唇黃吻瀾漫赤嬌語若連瑣忿速乃眀㦎握筆利彤管篆刻未期益執書愛綈素誦習矜所獲其娣字惠芳兩目燦如畫輕粧喜樓邊臨鏡忘紡績舉觶擬京兆立的成復易玩弄眉頰間劇兼機杼役從容好趙舞延袖像飛翮上下絃柱際文史輒卷襞顧盻屏風畫如見已指擲丹青日塵暗眀義為隱賾馳騖翔園林果下皆生摘紅葩掇紫蒂萍實驟抵擲貪華風雨中倐忽數百適務躡霜雪戲重綦常纍積并心注肴饌端坐理盤槅翰墨戢間按相與數離逖動為罏鉦屈屣履任之適止為茶菽據吹吁對鼎䥶脂膩漫白袖煙薰染阿錫衣被皆重池難與沈水碧任其孺子意羞受長者責瞥聞當與杖掩淚俱向壁重池被之心如池也玉臺作衣破皆重施誤織一作紈娣玉臺作姊䥶外編作䥶茶菽一作荼荈思吳江歌一曰秋風歌晉文士傳曰張翰有清名美望大司馬齊王冏辟為東曹掾在洛見秋風起思吳中菰飯蓴羮鱸魚鱠歎曰人生貴得適意爾何能羇宦數千里以要名爵因作此歌遂命駕還晉張翰秋風起兮佳景時吳江水兮鱸魚肥三千里兮家未歸恨難得兮仰天悲山路吟晉夏侯湛夙駕兮待眀陟山路兮遐征冒晨朝兮入大谷道逶迤兮嵐氣清攬轡兮抑馬踟蹰兮曠野曠野驅兮遼落崇嶽兮嵬崿邱陵兮連離卉木兮交錯淥水兮長流驚濤兮拂石江上泛歌晉夏侯湛悠悠兮逺征倐倐兮暨南荆南荆兮臨長江臨長江兮討不庭江水兮浩浩長流兮萬里洪浪兮雲轉陽矦兮奔起驚翼兮垂天鯨魚兮嶽跱􅐘蕪紛兮被臯陸修竹鬱兮翳崖趾望江之南兮遨目桂林桂林蓊鬱兮鵾雞揚音凌波兮願濟舟楫不具兮江水深沈嗟回盼於北夏何歸軫之難尋長夜謡晉夏侯湛日暮兮初晴天灼灼兮遐清披雲兮歸山垂景兮照庭列宿兮皎皎星稀兮月眀亭簷隅以逍遙兮盼太虛以仰觀望閶闔之昭晰兮麗紫微之暉煥寒苦謠晉夏侯湛惟立冬之初夜天慘懍以降寒霜皚皚以被庭氷溏瀩於井幹草槭槭以疏葉木蕭蕭以零殘松隕葉於翠條竹摧柯於緑竿扶風歌九解晉劉琨朝發廣莫門暮宿丹水山左手彎繁弱右手揮龍淵顧瞻望宫闕俯仰御飛軒據鞍長歎息淚下如流泉繫馬長松下發鞍髙嶽頭洌洌悲風起泠泠澗水流揮手長相謝哽咽不能言浮雲為我結飛鳥為我旋去家日已逺安知存與亡慷慨窮林中抱膝獨摧藏麋鹿遊我前猿猴戲我側資糧既乏盡薇蕨安可食攬轡命徒侣吟嘯絶巖中君子道微矣夫子故有窮惟昔李愆期寄在胸奴庭忠信反獲罪漢武不見眀我欲竟此曲此曲悲且長棄置勿重陳重陳令心傷同前宋鮑照昨辭金華殿今次鴈門縣寢臥握秦戈棲息抱越箭忍悲别親知行泣隨征傳寒煙空裴徊朝日乍舒卷同前見太平御覽按北史常景傳曰景嘗因出塞經厯山水悵然懷古乃擬劉琨扶風歌十二首此或其遺句耶耶無名氏南山名嵬嵬松柏何摧摧上枝拂青雲中心大數圍合歡詩五首樂府解題曰合歡詩晉楊方所作也言婦人謂虎嘯風起龍躍雲浮磁石引針陽燧改火皆以同聲相應同氣相求我與君情亦猶形影宫商之不離也常願食共同根穗飲共連理杯衣共雙絲絹寢共無縫禱坐必接膝行必㩦手如鳥同翼如魚比目利斷金石密踰膠􅃮也後三首玉臺題云雜詩郭氏併作合歡詩今按意義實與合歡無涉姑仍舊録晉楊方虎嘯谷風起龍躍景雲浮同聲好相應同氣自相求我情與子親譬如影追軀食共同根穗飲共連理杯衣共雙絲絹寢共無縫禱居願接膝坐行願㩦手趨子靜我不動子遊我不留齊彼同心鳥譬此比目魚情至斷金石膠漆未為牢但願長無别合形作一軀生為併身物死為同棺灰秦氏自言至我情不可儔同一作並此一作彼磁石引長針陽燧下炎煙宫商聲相和心同自相親我情與子合亦如影追身寢共織成被絮共同功綿暑搖比翼扇寒坐併肩氈子笑我必哂子蹙我無歡來與子共迹去與子同塵齊彼蛩蛩獸舉動不相捐唯願長無别合形作一身生有同室好死成併棺民徐氏自言至我情不可陳獨坐空室中愁有數千端悲響答愁歎哀涕應苦言倣徨四顧望白日入西山不覩佳人來但見飛鳥還飛鳥亦何樂夕宿自作羣言一作心飛黃銜長泰翼翼回輕輪俯涉淥水澗仰過九層山修途曲且險秋草生兩邊黃華如沓金白花如散銀青敷羅翠采絳葩象赤雲爰有承露枝紫榮合素芬扶疏重清藻布翹芳且鮮目為艷采回心為竒色旋撫心悼孤客俯仰還自憐踟蹰向壁歎攬筆作此文南鄰有竒樹承春挺素華豐翹被長條緑葉蔽朱柯因風吹微音芳氣入紫霞我心羡此木願徙著豫家夕得遊其下朝得弄其葩爾根深且堅豫宅淺且汙移植良無期歎息將如何鄰玉臺作林堅作固大道曲樂府解題曰謝尚為鎮西將軍常著紫羅襦據胡牀在市中佛國門樓上彈琵琶作大道曲市人不知是三公也晉謝尚青陽二三月桞青桃復紅車馬不相識音落黃埃中懷歸謠晉湛方生辭衡門兮至歡懷生離兮苦辛豈羇旅兮一慨亦代謝兮感人四運兮遒盡化新兮嵗故氛慘慘兮凝晨風悽悽兮薄暮雨雪兮交紛重雲兮四布天地兮一色六合兮同素山木兮摧披津壑兮凝沍感羇旅兮苦心懷桑梓兮增慕胡馬兮戀北越鳥兮依陽彼禽獸兮尚然况君子兮去故鄉望歸塗兮漫漫盼江流兮洋洋思涉路兮莫由欲越津兮無梁曲池歌拾遺在湛方生後詩品作湛詩謝朓有曲池之水未詳與此同否曲池何淡淡芙蓉蔽清源榮華盛壯時見者誰不歡一朝光采落見者不回顔曲池水集云曲池之水齊謝朓緩步遵莓渚披襟待蕙風芙蕖舞輕蒂苞笋出芳叢浮雲自西北江海思無窮鳥去能傳響見我緑琴中緑一作測出歌晉孫楚茱茰出芳樹顚鯉魚出洛水泉白鹽出河東美豉出魯川薑桂茶荈出巴蜀椒橘木蘭出髙山蓼蘇出溝渠秕稗出中田闕别歌晉書曰錢鳯為王敦鎧曹參軍知敦有不臣之心相與朋構專弄威權參軍熊甫諫敦不聽遂告歸臨别歌曰晉熊甫徂風飈起蓋山陵氛霧蔽日玉石焚往事既去可長歎念别惆悵復會難歌一首髙僧傳曰外國名僧佉叱寄名長干寺有張奴者不知何許人不甚見食而常自肥澤冬夏常著單布衣佉叱行見張奴欣然而笑佉叱曰吾東見蔡豚南訊馬生北遇王年今欲就杯度乃與子相見耶張奴乃題槐樹歌曰張奴濛濛大象內照耀實顯彰何事迷昏子縱惑自招殃樂所少人往苦道若翻囊不有松柏志何用擬風霜間豫紫煙表長歌出昊蒼澄虛無色外應見有緣鄉嵗曜毗漢后麗辰傳殷王伊余非二仙晦迹之九方亦見流俗子觸眼致酸傷略謠觀有念寧曰盡矜章酒德歌前秦紀秦王堅與羣臣飲以極醉為限整作歌前秦趙整地列酒泉天垂酒池杜康妙識儀狄先知紂喪殷邦桀傾夏國由此言之前危後則又崔鴻十六國春秋前秦録曰苻堅宴羣臣於釣臺祕書侍郎趙整以堅頗好酒因為酒德之歌穫黍西秦採麥東齊春封夏發鼻納心迷載太平御覽未全諫歌前秦紀與晉孝武帝寧康二年冬十二月秦王堅慕容垂夫人假氏同輦遊於後庭宦官趙整歌曰云云堅改容謝之命夫人下輦前秦趙整不見雀來入燕室但見浮雲蔽白日古樂苑卷三十五
