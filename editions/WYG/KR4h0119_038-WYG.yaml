body:
  text: 古樂苑巻三十八明梅鼎祚編雜曲歌辭梁東飛伯勞歌一云紹古歌玉臺藝文樂府作古辭梁武帝東飛伯勞西飛鷰黄姑織女時相見誰家兒女對門居開顔發豔照里閭南牕北牖桂月光羅帷綺帳脂粉香女兒年幾十五六窈窕無雙顔如玉三春巳暮花從風空留可憐誰與同同前二首英華作紹古歌梁簡文帝翻階蛺蝶戀花情容華飛燕相逢迎誰家總角岐路隂裁紅㸃翠愁人心天牕綺井曖徘徊珠簾玉篋明鏡臺可憐年幾十三四工歌巧舞入人意白日西落楊柳垂含情弄態兩相知西飛迷雀東羈雉倡樓秦女乍相值誰家妖麗鄰中止輕粧薄粉光閭里網户珠綴曲瓊鉤芳茵翠被香氣流少年年幾方三六含嬌聚態傾人目餘香落蕊坐相催可憐絶世誰為媒一作為誰媒同前題云擬古應教英華作簡文帝劉孝威雙棲翡翠兩鴛鴦巫雲洛月乍相望誰家妖冶折花枝衫長釧動任風吹金鋪玉鎖瑠璃扉花鈿寶鏡織成衣美人年幾可十餘含羞騁笑斂風裾珠丸出彈不可追空留可憐持與誰衫長句一作蛾眉􅝇睇使情移金作青玉作緑花鈿句作瓊筵玉笥金縷衣同前陳後主池側鴛鴦春日鶯緑珠絳樹相逢迎誰家佳麗過淇上翠釵綺袖波中漾雕軒繡户花恒發珠簾玉砌移明月年時二七猶未笄轉顧流盻髩鬟低風飛蕊落將何故可惜可憐空擲度將一作時同前陸瑜西王青鳥秦女鸞姮娥婺女慣相看誰家玉顔窺上路粉色衣香雜風度九重樓檻芙蓉華四鄰照鏡菱茭花新粧年幾纔三五隠幔藏羞臨網户然香氣歇不飛煙空留可憐年一年同前一作紹古歌江總南飛烏鵲北飛鴻弄玉蘭香時㑹同誰家可憐出牕牖春心百媚勝楊柳銀牀金屋挂流蘇寶鏡玉釵横珊瑚年時二八新紅臉宜笑宜歌羞更斂風花一去杳不歸秪為無雙惜舞衣同前隋辛德源合歡芳樹連理枝荆王神女乍相隨誰家妖豔蕩輕舟含嬌轉盻騁風流犀栧蘭橈翠羽蓋雲羅霧縠蓮花帶女兒年幾十六七玉面新粧映朝日落花從風俄度春空留可憐何處新河中之水歌藝文作古辭梁武帝河中之水向東流洛陽女兒名莫愁莫愁十三能織綺十四採桑南陌頭十五嫁為盧家婦十六生兒字阿侯盧家蘭室桂為梁中有鬱金蘇合香頭上金釵十二行足下絲履五文章珊瑚掛鏡爛生光平頭奴子擎履箱人生富貴何所望恨不早嫁東家王擎一作提閶闔篇張衡西京賦曰表嶢闕於閶闔閶闔天門也立高闕以象之薛綜云紫微宫門名曰閶闔也閶闔篇蓋出於此梁武帝西漢本佳妍金馬望甘泉衛尉屯兵上期門曉漏傳猶重河東賦欲知追神仙羽騎凌雲轉閶闔帶空懸長旗掃月窟鳯迹輾星躔但使丹砂就能令億萬年上林梁昭明太子統千金騕褭騎萬斤流水車爭遊上林裏高蓋逗春華裏一作苑大言許彦周詩話曰樂府記大言小言詩録昭明辭而不書始於宋玉何也豈誤耶有説耶按此則大言細言在宋時亦巳載樂府矣詩家直説曰宋玉大言賦并吞四夷飲枯河海跂越九州無所容止小言賦無内之中微物生焉比之無象言之無名視之則渺渺望之則㝠㝠離婁為之歎悶神明不能察其情二賦出於列子皆有託寓梁昭明太子大言詩細言詩雖祖宋玉而無謂君臣賡和以文為戲梁昭明太子統下同觀修鵾其若轍鮒視滄海之如濫觴經二儀而跼蹐跨六合以翺翔細言坐卧鄰空塵憑附蟭螟翼越咫尺而三秋度毫氂而九息大言並應令沈約下同隘此大汛庭方知九垓局窮天豈彌指盡地不容足細言開館尺棰餘築榭微塵裏蝸角列州縣毫端建朝市大言王錫下同欲遊五嶽迫不得申杖千里之木鱠横海之鱗細言㝠㝠藹藹離朱不辯其實步蝸角而三伏經針孔而千日大言王規下同俯身望日入下視見星羅嘘八風而為氣吹四海而揚波細言針鋒於焉止息髪杪可以翱翔蚊眉深而易阻蟻目曠而難航大言張纘下同河流既竭日月俱騰罝羅微物動落雲鵬細言遨遊蟻目辨輕塵蚊睫成宇蝨如輪大言殷鈞下同噫氣為風揮汗成雨聊灼戴山龜欲持探邃古細言汎舟毛滴海為政蝸牛國逍遥輕塵上指辰問南北春江行唐郭元振曰春江巴女曲也梁簡文帝客行秪念路相爭渡京口誰知堤上人拭淚空搖手桃花曲一作蕭子顯梁簡文帝但使新花豔得間美人簪何須論後實怨結子瑕心金樂歌通志作今樂歌梁簡文帝槐香欲覆井楊栁正藏鵶山鑪當無比玉構火牕賒牀頭辟繩結鏡上領巾斜鐵鑊種梁子銅樞生棗花開門抛水柱城按特言家當一作好柱一作信同前集云歌曲名詩元帝啼烏怨别偶曙鳥憶離家石闕題書字金燈飄落花東方曉星沒西山晩日斜縠衫迴廣袖團扇掩輕紗暫借青驄馬來送黄牛車沒一作渡同前房篆前溪流碧水後渚映青天登臺臨寶鏡開牕對綺錢玉顔光粉色羅袖拂金鈿春風散輕蝶明月映新蓮摘花競時侣催指及芳年采菊篇梁簡文帝月精麗草散秋株洛陽少婦絶妍姝相喚提筐采菊珠朝起露濕霑羅襦東方千騎從驪駒豈不下山逢故夫喚一作呼豈一作更茱萸女梁簡文帝茱萸生狹斜結子復銜花遇逢纎手摘濫得映鉛華雜與鬟簪挿偶逐鬢鈿斜東西爭贈玉縱横來問家不無夫婿馬空駐使君車愛妾換馬樂府解題曰愛妾换馬舊説淮南王所作疑淮南王即劉安也古辭今不傳以題云和人妾換馬梁簡文帝功名幸多種何事苦生離誰言似白玉定是媿青驪必取匣中釧迴作飾金羈真成恨不巳願得路傍兒同前題云和王竟陵劉孝威驄馬出樓蘭一步九盤桓小史贖金絡良工送玉鞍龍驂來甚易烏孫去實難麟膠妾猶有請為急弦彈同前庾肩吾渥水出騰駒湘川實應圖來從西北道去逐東南隅琴聲悲玉匣山路泣蘼蕪似鹿將含笑千金㑹不俱同前隋僧法宣朱鬛飾金鑣紅粧束素腰似雲來躞蹀如雪去飄颻桃花含淺汗柳葉帶餘嬌騁先將獨立雙絶不俱標行幸甘泉宫漢書武帝太始三年正月行幸甘泉宫梁簡文帝雉歸海水寂裘來重譯通吉行五十里隨處宿離宫鼓聲恒入地塵飛上暗空尚書隨豹尾太史逐相風銅鳴周國鐩旗曳楚雲虹倖臣射覆罷從妓新歌終董桃拜金紫賢妻侍禁中不羨神仙侣排煙逐駕鴻尚一作赦妓一作騎同前題末有歌字劉孝威漢家迎夏畢避暑甘泉宫棧車鳴里鼓駟馬駕相風校尉烏桓騎待制樓煩弓後旌猶五柞前笳度九嵕才人豹尾内御酒屬車中輦迴百子閣扇動七輪風鳴鐘休衛士披圖召後宫材官促校獵涼秋戲射熊凉秋一作秋來名士悦傾城題云和湘東王藝文作昭明非梁簡文帝美人稱絶世麗色譬花叢雖居李城北住在宋家東教歌公主第學舞漢成宫多遊淇水上好在鳯樓中履高疑上砌裾開特畏風衫輕見跳脱珠概雜青蟲垂絲遶帷幔落日度房櫳粧牕隔柳色井水照桃紅非憐江浦珮羞使春閨空住在一作往來江浦一作交甫同前題云敬酬劉長史詠名士悦傾城劉緩不信巫山女不信洛川神何關别有物還是傾城人經共陳王戲曽與宋家鄰未嫁先名玉來時本姓秦粉光猶似面朱色不勝唇遥見疑花發聞香知異春釵長逐鬟髲袜小稱腰身夜夜言嬌盡日日態還新工傾荀奉倩能迷石季倫上客徒留目不見正横陳髲一作鬢獨處怨司馬相如美人賦曰芳香郁烈黼帳高張有女獨處婉然在牀乃歌曰獨處室兮廓無依思佳人兮情傷悲獨處怨蓋取諸此一作獨處愁梁簡文帝獨處恒多怨開幕試臨風彈棊鏡奩上傅粉高樓中自君征馬去音信不曽通只恐金屏掩明年巳復空君一作從樹中草一作蕭子顯梁簡文帝幸有青袍色聊因翠幄凋雖間珊瑚蔕非是合歡條半路溪樂府作元帝梁簡文帝相逢半路溪隔溪猶不渡望望判知是翩翩識行步摘贈蘭澤芳欲表同心句先將動舊情恐君疑妾妬將一作持春情曲詞品曰梁簡文春情曲似七言律而末句又用五言王無功亦有此體又唐律之祖而唐辭瑞鷓鴣格韻似之今按其集題云春情初不言曲且陳隋人亦多春情詩楊氏或别有據聊附于此梁簡文帝蝶黄花紫燕相追楊低柳合露塵飛巳見垂鈎挂緑樹誠知淇水霑羅衣兩童夾車問不巳五馬城南猶未歸鶯啼春欲駛無為空掩扉倡樓怨節宋鄭樵樂府遺聲怨思二十五曲有倡樓怨簡文又有倡婦怨情十二韻詩不録梁簡文帝朝日斜來照户春鳥爭飛出林片光片影皆麗一聲一轉煎心上林紛紛花落淇水漠漠苔浮年馳節流易盡何為忍憶含羞此疑二首金閨思按閨思閨怨或叙棄捐或陳征戍大畧皆懷逺傷離之意魏曹植有閨情詩至梁陳間始為此題唐益多擬作矣郭左諸家俱不見載樂府遺聲有閨思閨怨秋閨怨今從之其他各以類附梁簡文帝遊子久不返妾身當何依日移孤影動羞覩燕雙飛自君之别矣不復染膏脂南風送歸雁聊以寄相思閨思梁范雲春草醉春煙深閨人獨眠積恨顔將老相思心欲然幾囘明月夜飛夢到郎邊同前隋羅愛愛幾當孤月夜遥望七香車羅帶因腰緩金釵逐髩斜春閨思梁蕭子顯金羈遊俠子綺機離思妾春度人不歸望花盡成葉秋閨夜思梁簡文帝非關長信别詎是良人征九重忽不見萬恨滿心生夕門掩魚鑰宵牀悲畫屏迴月臨牕渡吟蟲繞砌鳴初霜霣細葉秋風驅亂螢故粧猶累日新衣製未成欲知妾不寐城外搗砧聲驅一作吹閨怨玉臺作蕭綸題云代秋胡婦閨怨梁元帝蕩子從遊宦思妾守房櫳塵鏡朝朝掩寒衾夜夜空若非新有悦何事久西東知人相憶否淚盡夢啼中同前二首吳均胡笳屢悽斷征蓬未肯還妾坐江之介君戍小長安相去三千里參商書信難四時無人見誰復重羅紈春草可攬結妾心正斷絶緑髩愁中改紅顔啼裏滅非獨淚成珠亦見珠成血願為飛鵲鏡翩翩照離别飛鵲一作雙鵠同前劉孝儀本無金屋寵長作玉階悲一乖西北麗寧復城南期永巷愁無歇應門閉有時空勞織素巧徒為團扇辭匡牀終不共何由横自私歇玉臺作盡同前陸罩自憐斷帶日偏恨分釵時留步惜餘影含意結愁眉徒知今異昔空使怨成思欲以别離思獨向蘼蕪悲同前一云和隂梁州雜怨今從藝文鄧鏗暫别猶添恨何忍别經時叢桂頻銷葉庭樹幾攀枝君言妾貌改妾畏君心移終須一相見併得兩相知同前題云閨怨篇陳江總寂寂青樓大道邊紛紛白雪綺窻前池上鴛鴦不獨自帳中蘇合還空然屏風有意障明月燈火無情照獨眠遼西水凍春應少薊北鴻來路幾千願君關山及早度念妾桃李片時妍同前藝文作江總次閨怨篇下玉臺作梁簡文和蕭子顯眷别蜘蛛作絲滿帳中芳草結葉當行路紅臉脈脈一生啼黄鳥飛飛有時度故人雖故昔經新新人雖新復應故同前陳呉思𤣥金風響洞房佳人心自傷淚隨明月下愁逐漏聲長燈前羞獨鵠枕上怨孤凰自覺鴛帷冷誰憐珠被涼同前周庾信明鏡圓花發空房故怨多幾年留織女還應聽渡河春閨怨梁王僧孺愁來不理鬢春至更攢眉悲看蛺蝶粉泣望蜘蛛絲月映寒蛩褥風吹翡翠帷飛鱗難託意駛翼不銜辭銜一作綴同前呉孜玉關信使斷借問不相諳春光太無意窺牕來見參分與光音絶忽值日東南柳枝皆嬲燕桑葉復催蠶物色頓如此孀居自不堪秋閨怨梁王僧孺斜光隠西壁暮雀上南枝風來秋扇屏月出夜燈吹深心起百際遥淚非一垂徒勞妾辛昔終言君不知同前二首一云閨怨今從玉臺何遜竹葉響南牕月光照東壁誰知夜獨覺枕前雙淚滴閨閣行人斷房櫳月影斜誰能北牕下獨對後園花集作誰知北牕下猶對後園花同前陳隂鏗獨眠雖巳慣秋來只自愁火籠恒煖脚行障鎮牀頭眉含黛俱斂啼將粉共流誰能無别恨唯守一空樓離閨怨題云和蕭諮謙岑梁何遜曉河沒高棟斜月半空庭牕中度落葉簾外隔飛螢含情下翠帳掩涕閉金屏昔期今未返春草寒復青思君無轉易何異北辰星情一作悲涕一作泣空閨怨陳江總蕩妻怨獨守盧姬傷獨居瑟上調絃落機中織素餘自羞淚無燥翻覺夢成虚復嗟長信閣寂寂往來疎南征閨怨陳隂鏗湘水舊言深征客理難尋獨愁無處道長悲不自禁逢人憎解佩來鴻懶聽音唯當有夜鵲南飛似妾心來鴻一作從來山家閨怨陳張正見王孫春好遊雲鬢不勝愁離鴻暫罷曲别路巳經秋山中桂花晩勿為俗人留同前李爽山中多早梅荆扉達曙開竹巾君自拆荷衣誰為裁行雲無處所人住在陽臺晚棲烏文苑英華作樂府姑從之隋虞世基有晚飛烏不録梁元帝日暮連翩翼俱向上林棲風多前鳥駛雲暗後羣迷路逺聲難徹飛斜行未齊應從故鄉返幾過入蘭閨借問倡樓妾何如蕩子妻攜手曲攜手曲梁沈約所制也樂府解題曰攜手曲言攜手行樂恐芳時不留君思將歇也梁沈約捨轡下雕輅更衣奉玉牀聨簪映秋水開鏡比春粧所畏紅顔促君恩不可長鵁冠且容裔豈吝桂枝亡聨一作斜同前呉均豔裔陽之春攜手清洛濵雞鳴上林苑薄暮小平津長裾藻白日廣袖帶芳塵故交一如此新知詎憶人夜夜曲二首北斗一首一作簡文夜夜曲梁沈約所作也樂府解題曰夜夜曲傷獨處也梁沈約河漢縱且横北斗横復直星漢空如此寧知心有憶孤燈曖不明寒機曉猶織零淚向誰道雞鳴徒歎息北斗闌干去夜夜心獨傷月輝横射枕燈光半隠牀同前二首後首樂府無名氏玉臺作簡文題云擬沈隠侯故附約後簡文帝靄靄夜中霜河開向曉光枕啼常帶粉身眠不著牀蘭膏盡更益薫罏滅復香但問愁多少便知夜短長愁人夜獨傷滅燭卧蘭房秪恐多情月旋來照妾牀樂未央梁沈約億舜日萬堯年詠湛露歌採蓮願雜百和氣宛轉金鑪前六憶詩四首梁沈約憶來時灼灼上堦墀勤勤叙離别慊慊道相思相看常不足相見乃忘飢憶坐時㸃㸃羅帳前或歌四五曲或弄兩三弦笑時應無比嗔時更可憐憶食時臨盤動容色欲坐復羞坐欲食復羞食含哺如不飢擎甌似無力憶眠時人眠彊未眠解羅不待勸就枕更須牽復恐傍人見嬌羞在燭前雜憶詩二首見隋遺録題云效劉孝綽雜憶詩按劉集無此詩惟沈約有六憶詞品作煬帝夜飲朝眠曲隋煬帝憶睡時待來剛不來卸粧仍索伴解佩更相催博山思結夢沈水未成灰憶起時投籖初報曉被惹香黛殘枕隠金釵裊笑動林中烏除却司晨鳥笑動林中烏一作笑動上林中征怨梁江淹蕩子從征久鳳樓簫管閒獨枕凋雲鬢孤燈損玉顔何日邊塵淨庭前征馬還同前丘遲清歌自信妍雅舞空僊僊耳中解明月頭上落金鈿雀飛且近逺暮入綺牕前魚戲雖南北終還荷葉邊惟見君行久新年非故年登城怨梁范雲楚妃歌脩竹漢女奏幽蘭獨以閨中笑豈知城上寒登高臺梁王僧孺試出金華殿聊登銅雀臺九路平如掌千門洞巳開軒車映日過簫管逐風來若非邯鄲美便是洛陽才掌一作砥同前題云宫殿名登高臺詩陳祖孫登獨有相思意聊敞鳳皇臺蓮披香稍上月明光正來離鵠將雲散飛花似雪迴遥思竹林友前牕夜夜開鵠一作鶴古通用滄海雀梁張率大雀與黄口來自滄海區清晨啄原粒日夕依野株雖憂鷙鳥擊長懷沸鼎虞況復隨時起翻飛不可拘寄言挾彈子莫賤隋侯珠清涼梁張率登臺待初景帳殿藹餘晨羅帳夕風濟清氣尚波人長簟涼可仰平莞温未親幸願同枕席為君横自陳芳林篇梁柳惲芳林曄兮發朱榮時既晩兮隨風零隨風零兮返無期安得陽華遺所思起夜來樂府解題曰起夜來其辭意猶念疇昔思君之來也梁柳惲城南斷車騎閣道覆青埃露華光翠網月影入蘭臺洞房且莫掩應門或復開颯颯秋桂響非君起夜來獨不見樂府解題曰獨不見傷思而不得見也梁柳惲别島望雲臺天淵臨水殿芳草生未積春花落如霰出從張公子還過趙飛燕奉箒長信宫誰知獨不見同前王訓日晩宜春暮風軟上林朝對酒近初節開樓蕩夜嬌石橋通小澗竹路上青霄持底誰見許長愁成細腰同前劉孝威夫婿結纓簪偏蒙漢寵深中人引卧内副車遊上林綬染瑯琊草蟬鑄武威金分家移甲第留妾住河隂獨寢鴛鴦被自理鳳皇琴誰憐雙玉筯流面復流襟送歸曲梁呉均送子獨南歸攬衣空閔黙關山晝欲暗河氷夜向塞燕至他人鄉鴈去還誰國寄子兩行書分明達濟北秦王巻衣樂府解題曰秦王巻衣言咸陽春景及宫闕之美秦王巻衣以贈所歡也梁呉均咸陽春草芳秦帝巻衣裳玉檢茱萸匣金泥蘇合香初芳薫複帳餘輝耀玉牀當須晏朝罷持此贈龍陽龍一作華妾安所居梁呉均賤妾先有寵蛾眉進不遲一從西北麗無復城南期何因暫豔逸豈為乏妍姿徒有黄昏望寧遇青樓時惟惜應門掩方餘永巷悲匡牀終不共何由横自私因一作用大垂手樂府解題曰大垂于小垂手皆言舞而埀其手也隋江總婦病行曰夫婿府中趨誰能大垂手是也又獨揺手亦與此同此與小垂手二首藝文作簡文帝梁呉均垂手忽迢迢飛燕掌中嬌羅衫恣風引輕帶任情揺詎似長沙地促舞不囘腰小埀手梁呉均舞女出西秦躡影舞陽春且復小埀手廣袖拂紅塵折腰應兩笛頓足轉雙巾蛾眉與曼臉見此空愁人夾樹梁呉均桂樹夾長陂復值清風吹氛氲揉芳葉連綿交密枝能迎春露㸃不逐秋風移願君長惠愛當使嵗寒知城上麻梁呉均麻生滿城頭麻葉落城溝麻莖左右披溝水東西流少年感恩命奉劒事西周但令直心盡何用返封侯邊城將四首梁呉均塞外何紛紛胡騎欲成羣爾時始應募來投霍冠軍刀含四尺影劒抱七星文袖間血灑地車中旌拂雲輕軀如未殯終當厚報君僕本邊城將馳射靈關下箭銜鴈門石氣振武安瓦勲輕賞廢丘名高拜横野留書應鑿楹傳功須勒社徒傾七尺命酬恩終自寡聞君報一飱逺送出平野玉標丹霞劍金絡豔光馬高旗入漢飛長鞭歴地寫曙星海中出曉月山頭下嵗晏坐論功自有思臣者臨淄重蹴踘曲城好撃刺不要身後名專騁眼前智君看班定逺立功不負義掣拽二丈旗躑躅雙鳬騎但問相知否死生無險易春怨梁呉均四時如湍水飛奔兢迴復夜鳥響嚶嚶朝花照煜煜厭見花成子多看筍成竹萬里斷音書十載異栖宿積愁落芳鬢長啼壞美目君去往榆關妾留住函谷唯對昔耶房如愧蜘蛛屋獨喚響相酬還持影自逐象牀易氊簟羅衣變單複幾過度風霜猶能保㷀獨成一作為江潭怨一作贈别新林梁呉均僕本幽并兒抱劒事邊陲風亂青絲絡霧染黄金羈天子既無賞公卿竟不知去去歸去來還傾鸚鵡杯氣為故交絶心為新知開但令寸心是何須銅雀臺邊城思梁何遜柳黄未吐葉水緑半含苔春色邊城動客思故鄉來南征曲梁蕭子顯櫂歌來揚女操舟驚越人圖蛟怯水伯照鷁竦江神同前題云南征陳蘇子卿一朝遊桂水萬里别長安故鄉夢中近邊愁酒上寛劍鋒但須利戎衣不畏單南中地氣暖少婦莫愁寒春思按李白集春思秋思並編入樂府蕭子雲巳有此豈白亦擬梁人邪梁蕭子雲春風蕩羅帳餘花落鏡奩池荷正捲葉庭柳復埀簷竹柏君自改團扇妾方嫌誰能憐故素終為泣新縑簷一作簾秋思顔氏家訓曰蘭陵蕭慤工於篇什嘗有秋思詩云芙蓉露下落楊柳月中疎時人未之賞也吾愛其蕭散宛然在目潁川荀仲舉瑯琊諸葛漢亦以為爾而盧思道之徒雅所不愜北齊蕭慤清波收潦日華林鳴籟初芙蓉露下落楊柳月中疎燕幃緗綺被趙帶流黄裾相思阻音息結夢感離居息玉臺作信雜曲二首梁王筠烏還夜巳逼蟲飛曉尚賒桂月徒留影蘭燈空結花烏一作鳥可憐洛城東芳樹揺春風丹霞映白日細雨帶輕虹同前江摠徐陵同賦陳傅縡新人新寵住蘭堂翠帳金屏玳瑁牀叢星不似珠簾色度月還同粉壁光從來著名推趙子復有丹唇發皓齒一嬌一態本難逢如畫如花定相似樓臺宛轉曲皆通弦管逶迤徹下風此殿笑語長相共傍省歡娯不復同訝許人情太厚薄分恩賦念能斟酌多作繡被為雙鴛長弄綺琴憎别鶴人今投寵要須堅㑹使嵗寒恒度前共取辰星作心抱無轉無移千萬年牀一作梁同作如長相作恒長雙鴛一作鴛鴦同前徐陵傾城得意巳無儔洞房連閣未消愁宫中本造鴛鴦殿為誰新起鳳皇樓緑黛紅顔兩相發千嬌百念情無歇舞衫迴袖勝春風歌扇當牕似秋月碧玉宫妓自翩妍絳樹新聲最可憐張星舊在天河上從來張姓本連天二八年時不憂度傍邊得寵誰應妬立春厯日自當新正月春幡底須故流蘇錦帳挂香囊織成羅幌隠燈光祗應私將琥珀枕暝暝來上珊瑚牀最一作自應一作相同前三首江總行行春逕蘼蕪緑織素郍復解琴心乍愜南階悲緑草誰堪東陌怨黄金紅顔素月俱三五夫壻何在今追虜關山隴月春雪氷誰見人啼花照户氷一作深追一作征殿内一處起金房併勝餘人白玉堂珊瑚挂鏡臨網户芙蓉作帳照雕梁房櫳宛轉埀翠幕佳麗逶迤隠珠箔風前花管颺難留舞處花鈿低不落陽臺通夢太非真洛浦淩波復不新曲中唯聞張女調定有同姓可憐人但願私情賜斜領不願傍人相比竝妾門逢春自可榮君面未秋何意冷併玉臺作便張女調一作張女曲泰山言應可轉移新寵不信更參差合歡錦帶鴛鴦鳥同心綺袖連理枝皎皎新秋明月開早露飛螢暗裏來鯨燈落花殊未盡虬水銀箭莫相催非是神女期河漢别有仙姬入吹臺未眠解著同心結欲醉那堪連理杯後宫不愜茱萸芳夜夜爭開蘇合房寶釵翠鬢還相似朱唇玉面非一行新人未語言如澀新寵無前判不臧願奉更衣蘭麝氣恐君馬到自驚香遺所思樂府遺聲怨思二十五曲有遺所思按楚辭九歌云折芳馨兮遺所思疑本出此梁劉孝綽遺簪彫玳瑁贈綺織鴛鴦未若華滋樹交枝蕩子房别前秋巳落别後春更芳所思不可寄唯憐盈袖香舞就行梁劉孝儀依歌移弱步傍竹艶新粧徐來翻應節亂去反成行雀乳空井中晉傅𤣥詩曰鵲巢丘城側雀乳空井中居不附龍鳳常畏虵與蟲依賢義不恐近暴自當窮雀乳空井中亦非樂府梁劉孝威逺去條支國心知漢德優聊棲丞相府過令黄霸羞挾子須閒地空井共尋求轆轤絲綆絶桔槔冬蘚周將憐羽翼長唯辭各背遊優一作休長一作張半渡溪樂府解題曰半渡溪言戰而半涉溪水見迫所言皆嶺南地理與武溪深相類梁元帝又有半路溪則言相逢隔溪巳識行步辭㫖與此全殊梁劉孝威本厠偏伍伴一戰殄凶渠制賜文犀節驛報紫泥書入營陳御蓋還家乘紫車皇恩空以重丹心恨不紓渡瀘且不畏淩溪嗟有餘空以重一作知巳重寒夜怨樂府解題曰晉陸機獨寒吟云雪夜逺思君寒牕獨不寐但叙相思之意爾陶𢎞景有寒夜怨梁簡文帝有獨處愁亦皆類此詞品曰陶𢎞景寒夜怨後世填辭梅花引格韻似之後換頭微異梁陶𢎞景夜雲生夜鴻驚悽切嘹唳傷夜情空山霜滿高煙平鉛華沈照帳孤明寒月微寒風緊愁心絶愁淚盡情人不勝怨思來誰能忍告遊篇梁陶𢎞景性靈昔既肇縁葉久相因即化非𡨕滅在理淡悲欣冠劒空衣影鑣轡乃仙身去此昭軒侣結彼瀛臺賔儻能踵留轍為子道𤣥津遥夜吟梁宗夬遥夜復遥夜遥夜憂未歇坐對風動帷卧見雲間月荆州樂三首荆州樂蓋出於清商曲江陵樂荆州即江陵也有紀南城在江陵縣東梁簡文帝荆州歌云紀南城里望朝雲雉飛麥熟妾思君是也又有紀南歌亦出於此梁宗夬迢遞樓雉懸參差臺觀雜城闕自相望雲霞紛颯沓章華遊獵去紀郢從禽歸溶溶紫煙合鬱鬱紅塵飛朝發江津路暮宿靈溪道平衢廣且直長楊鬱裊裊迎客曲詞品曰古者宴客有迎客送客曲亦猶祭祀有迎神送神也梁徐勉絲管列舞席陳含聲未奏待嘉賔羅絲管舒舞席斂袖嘿唇迎上客送客曲梁徐勉袖繽紛聲委咽餘曲未終高駕别爵無算景巳流空紆長袖客不留採荷調樂府廣題曰梁太尉從事中郎江從簡年十七有才思為採荷調以刺何敬容敬容覽之不覺嗟賞愛其巧麗敬容時為宰相一作採蓮諷梁江從簡欲持荷作柱荷弱不勝梁欲持荷作鏡荷暗本無光發白馬通典曰白馬春秋時衛國曹邑有黎陽津一曰白馬津酈生云守白馬之津是也發白馬言征戍而發兵於此也梁費昶家本樓煩俗召募羽林兒怖羌角觝戲習戰昆明池弓弢不復挽劒衣恒露鈹一辭豹尾内長别屬車埀白馬今雖發黄河未結凘寄言閨中婦逢春心勿移濟黄河題云應教梁謝微積隂晦平陸淒風結暮序朝辭金谷戍夕逗黄河渚赤徒聨翩青鳬詎容與淚甚聲難發悲多袖未舉虚薄謬君恩方嗟别宛許戍一作樹同前題云奉和濟黄河應教慤本梁人此疑與謝微同作北齊蕭慤大蕃連帝室驂駕奉皇猷未明驅羽騎凌晨方畫舟津城度維錦岸柳夾緹油鐘聲颺别島旗影照蒼流早光生劒服朝風起節樓滔滔細波動裔裔輕舷浮廻橈避近磧放舳下前洲全疑上天漢不異謁蓬丘望知雲氣合聽識水聲秋從君何等樂喜從神仙遊鐘一作鐃同前六朝聲偶作柳顧言陳江總蔥山淪外域鹽澤隠遐方兩源分際逺九道派流長未殫所聞見無待驗詞章留連嗟太史惆悵踐黎陽導波縈地節疏氣耿天潢憫周沈用寶嘉晉肇為梁節一作脈陵雲臺魏志曰文帝黄初元年十二月初營洛陽宫戊午幸洛陽三年築陵雲臺劉義慶世説曰陵雲臺樓觀精巧先秤衆木輕重然後構造無錙銖相負掲臺高峻恒隨風動揺揚龍驤洛陽記曰陵雲臺高二十三丈登之見孟津也梁謝舉綺甍懸桂棟隠曖傍喬柯勢高凌玉井臨迥度金波易覺涼風至早飛秋鴈過高臺相思曲望逺騷人歌幸屬此迢遞知承雲霧多屬一作矚同前周王褒高臺懸百尺中夕殊未窮北臨酸棗寺西眺明光宫城旁抵雙府林裏對相風書題鹿盧牓觀寫飛亷銅牕開神女電梁映美人虹虞捐濫天寵鄭瞀特懷忠莊生埀翠釣昭儀抵鬬熊馳輪有盈缺人道亦汙隆還念西陵舞非復鄴城中抵一作拒伍子胥梁鮑機忠孝誠無報感義本投身日暮江波急誰憐漁丈人楚墓悲猶在呉門恨未申猶一作空恨一作怨建興苑題云遊建興苑梁紀少瑜丹陵抱天邑紫淵更上林銀臺懸百仞玉樹起千尋水流冠蓋影風揚歌吹音踟蹰憐拾翠顧步惜遺簪日落庭光轉方幔屢移隂願言樂未極不道愛黄金幔一作幰願一作終短簫梁張嵊促柱弦始繁短簫吹初亮舞袖拂長席鐘音由簴颺巳落簷瓦間復繞梁塵上時屬清夏隂恩暉亦非望田飲引梁朱异卜田宇兮京之陽面清洛兮背脩邙屬風林之蕭瑟值寒野之蒼茫鵬紛紛而聚散鴻冥冥而逺翔酒沈兮俱發雲沸兮波揚豈味薄於東魯鄙蜜甜于南湘於是客有不速朋自逺方臨清池而滌器闢山牖而飛觴促膝兮道故久要兮不忘間談希夷之理或賦連翩之章闕車馬行梁戴暠鞏洛風塵處冠蓋相填咽多稱魏其冷競隨田蚡熱輪趣白虎第珂聚黄金穴獻酒悉葡萄詶言盡飛鐵東都虵巳鑄西山綬應結朝集類蒸煙晩至如吹雪子雲爾何事門巷無車轍薄暮動弦歌梁沈君攸柳谷向夕沈餘日蕙樓臨砌徙斜光金户半入藂林影蘭徑時移落蘂香絲繩玉壺傳綺席秦箏趙瑟響高堂舞裙拂履喧珠珮歌響出扇繞塵梁雲邊雪飛弦柱促留賔但須羅袖長日暮歌鐘恒不倦處處行樂為時康羽觴飛上苑楚辭曰瑶漿密勺實羽觴張衡西京賦曰促中堂之俠坐羽觴行而無算羽觴謂杯上綴羽以􅄩飲漢書音義曰羽觴作生爵形是也梁沈君攸上路薄晩風塵合禁苑初春氣色華石徑斷絲䦨蔓草山流細沫擁浮花魚文熠爚含餘日鶴蓋低昻照落霞隔樹銀鞍喧寶馬分衢玉軸動香車車馬處處盡成隂班荆促席對芳林藤杯屢動情仍暢翠樽引滿趣彌深山陽倒載非難得宜城醇醖促須斟半醉驪歌應可奏上客莫慮擲黄金浮花一作浮槎桂檝汎河中梁沈君攸黄河曲注通千里濁水分流引八川仙查逐源終未極蘇亭遺跡尚難遷眇眇雲根侵逺樹蒼蒼水氣雜遥天波影雜霞無定色湍文觸岸不成圓赤馬青龍交出浦飛雲蓋海逺凌煙蓮舟渡沙轉不礙桂檝距浪弱難前風急金烏翅自轉汀長錦纜影微懸榜人欲歌先扣枻津吏猶醉强持船河隄極望今如此行杯落葉詎虚傳蘇亭一作漢帝雜一作合龍一作驪晨風行晨風本秦詩也晨風詩曰鴥彼晨風鬱彼北林傳曰鴥疾飛貌晨風鸇也言穆公招賢人賢人往之疾如晨風之入北林也王循霧開九曲瀆沈氏理檝令舟人但歌晨朝之風爾梁王循霧開九曲瀆風起千金堤岸囘分野逕林際成牛蹊鳬隨落潮去日傍綺霞低望目輕舟隠瑟瑟逺寒悽還眺小平急宴語方難齊目一作日同前沈滿願理檝令舟人停艫息旅泊河津念君劬勞冒風塵臨路揮袂淚沾巾飈流勁潤逝若飛山高帆急絶音徽留子句句獨言歸中心㷀㷀將依誰風彌葉落永離索神往形返情錯漠循帶易緩愁難却心之憂矣頗銷鑠一旦歌樂府無名次玉臺卿詩後一旦被頭痛避頭還著牀自無親伴侣誰當給水漿匍匐入山院正逢虎與狼對虎低頭啼埀淚淚千行映水曲梁沈滿願輕鬢學浮雲雙蛾擬初月水澄正落釵萍開理埀髪登樓曲梁沈滿願憑高川陸近望逺阡陌多相思隔重嶺相憶限長河限一作恨越城曲樂府作無名氏與登樓曲相次别怨悽歌響離啼濕舞衣願假烏棲曲翻從南向飛聽鐘鳴梁書曰綜武帝第二子封豫章王綜母齊東昏美人武帝滅齊納之七月而生綜綜自以本東昏子及為都督南兖州刺史聞齊建安王蕭寶寅在魏乃與數騎奔魏以為侍中太尉綜既不得志嘗作聽鐘鳴悲落葉辭以申其志大畧曰云云當時見者莫不悲之南史事同而無其辭洛陽伽藍記曰洛陽城東建陽里有臺高三丈上作二精舍有鐘撞之聞五十里太后移在宫内凝閑室初豫章王蕭綜聞此鐘聲遂造聽鐘歌三首行于世按梁書二辭各三首似與記合但存其畧耳藝文詩彚所載與書頗異今附于後梁蕭綜聽鐘鳴當知在帝城參差定難數歴亂百愁生去聲懸窈窕來響急徘徊誰憐傳漏子辛苦建章臺聽鐘鳴聽聽非一所懷瑾握瑜空擲去攀松折桂誰相許昔朋舊愛各東西譬如落葉不更齊漂漂孤雁何所栖依依别鶴夜半啼聽鐘鳴聽此何窮極二十有餘年淹留在京域窺明鏡罷容色雲悲海思徒揜抑悲落葉梁蕭綜悲落葉連翩下重疊落且飛從横去不歸悲落葉落葉悲人生譬如此零落不可持悲落葉落葉何時還凡昔共根本無復一相關聽鐘鳴此或聽鐘鳴全篇之一歴歴聽鐘鳴當知在帝城西樹隠落月東牕見曉星霧露朏朏未分明烏啼啞啞巳流聲驚客思動客情客思鬱縱横翩翩孤鴈何所栖依依别鶴半夜啼今嵗行已暮雨雪向凄凄飛蓬旦夕起楊柳尚翻低氣鬱結涕滂沱愁思無所託强作聽鐘歌悲落葉此至高下任飄颺或是悲落葉全篇之一後云悲落葉落葉何時還或别一篇悲落葉聨翩下重疊重疊落且飛從横去不歸長枝交䕃昔何密黄鳥關關動相失夕葉雜凝露朝花翻亂日亂春日起春風春風春日此時同一霜兩霜猶可當五晨六旦巳颯黄乍逐驚風舉高下任飄颺悲落葉落葉何時還夙昔共根本無復一相關各隨灰土去高枝難重攀綜終于魏詩紀編入北魏然其本傳在梁今附梁後古樂苑巻三十八
