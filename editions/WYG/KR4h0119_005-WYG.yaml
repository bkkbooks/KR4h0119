body:
  text: 古樂苑巻五明梅鼎祚編郊廟歌辭廟祀梁齊陳北周隋齊太廟樂歌南齊書樂志曰宋昇明中太祖為齊王令司馬禇淵造太廟登歌二章建元初詔黄門侍郎謝超宗造廟樂歌詩十六章永明二年尚書殿中曹奏太祖髙皇帝廟神室奏髙徳宣烈之舞未有歌詩郊應須歌辭穆皇后廟神室亦未有歌辭案傅𤣥云登歌廟異其文饗神十室同辭此議為允又尋漢世歌篇多少無定皆稱亊立文並多八句然後轉韻時有兩三韻而轉其例甚寡張華夏侯湛亦同前式傅𤣥改韻頗數更傷簡節之美近世王韶之顔延之並四韻乃轉得賖促之中顔延之謝莊作二廟歌皆各三章章八句此於序述功業詳畧為宜今宜依之郊配之日改降尊作王禮殊宗廟穆后母儀之化事異經綸此二歌為一章八句别奏事御奉行詔可尚書令王儉造太廟二室及郊配辭古今樂録曰梁何佟之周捨等議以為周禮牲出入奏昭夏而齊氏仍宋儀注迎神奏昭夏牲出入更奏引牲樂乃以牲牢之樂用接祖宗之靈宋季之失禮也肅咸樂夕牲羣臣出入奏謝超宗下同章十六潔誠底孝孝感煙霜夤儀式序肅禮綿張金華樹藻肅哲騰光殷殷升奏嚴嚴階庠匪椒匪玉是降是將懋分神衷翊祐傳昌引牲樂牲出入奏肇祀嚴靈恭禮尊國達敬傳典結孝陳則芬滌既肅犧牷既整聳誠流思端儀選景肆禮佇夜綿樂望晨崇席皇鑒用饗明神傳一作敷嘉薦樂薦豆呈毛血奏清思眑眑閟寢㣲㣲恭言載感肅若有希芬俎具陳嘉薦兼列凝馨煙颺分炤星哲睿靈式憑協我帝道上澄五緯下陶八表右夕牲歌辭昭夏樂迎神奏涓辰選氣展禮恭祗重闈月洞層牖煙施載虚玉鬯載受金枝天歌折饗雲舞罄儀神惟降止汎景凝羲帝華永藹泯藻方摛永至樂皇帝入廟北門奏戲繇惟則姬經式序九司聨事八方承宇鑾迾静陳縵樂具舉凝旒若慕傾璜載佇振振琁衛穆穆禮容載藹皇歩式􅀈帝蹤登歌太祝祼地奏清明既鬯大孝乃熈天儀睟愴皇心儼思既芬房豆載潔牷牲鬱祼升禮鋗玉登聲茂對幽嚴式奉徽靈以享以祀惟感惟誠明一作容玉一作金凱容樂皇祖廟陵丞神室奏國昭惟茂帝穆惟崇登祥緯逺締世景融紛綸睿緒菴蔚王風明進厥始濬哲文終凱容樂皇祖太中大夫府君神室奏琁條夤蔚瓊源浚照懋矣皇烈載挺明劭永言敬思式恭惟教休途良乂榮光有耀凱容樂皇祖淮隂令府君神室奏嚴宗正典崇享肇禋九章既飭三清既陳昭恭皇祖承假徽神貞祐伊協卿藹是鄰凱容樂曾祖即丘令府君神室奏肅惟敬祀潔事參薌環袨像綴緬宻絲簧明明烈祖尚錫龍光粤雅于姬伊頌在商凱容樂皇祖太常卿府君神室奏神宮懋鄴明寢昌基德凝羽綴道鬯容辭假我帝緒懿我皇維昭大之載國齊之祺宣徳凱容樂皇考宣皇帝神室奏道閟期運義開藏用皇矣睿祖至哉攸縱循規烈炤襲矩重芬徳溢軒羲道懋炎雲凱容樂昭皇后神室奏月靈誕慶雲瑞開祥道茂淵柔徳表徽章粹訓宸中儀形宙外容蹈凝華金羽傳藹永祚樂皇帝還東壁上福酒奏構宸抗宇合軫齊文萬靈載溢百禮以殷朱絃繞風翠羽停雲桂罇既滌瑶俎既薫升薦惟誠昭禮惟芬降祉遥裔集慶氤氲肆夏樂送神奏禮既升樂以愉昭序溢幽饗餘人祇鬯敬教敷神光動靈駕翔芬九垓鏡八鄉福無届祚無疆休成樂皇帝詣便殿奏睿孝式鬯饗敬爰徧諦容輟序佾文静縣辰儀聳蹕霄衛浮鑾旒帟雲施翠華景摶恭惟尚烈休明再纒國猷逺藹昌圖聿宣徧一作偏縣一作懸太廟登歌禇淵下同二章惟王建國設廟凝靈月薦流典時祀暉經瞻宸僾思雨露追情簡日筮晷閟奠升文金罍渟桂沖幄舒薫備僚肅列駐景開雲至饗攸極睿孝惇禮具物咸潔聲香合體氣昭扶幽眇慕躔逺迎絲驚促送佾留晚聖衷踐候節改增愴妙感崇深英徽彌亮聲香郭夲作馨聲髙徳宣烈樂太祖髙皇帝神室奏王儉下同三章悠悠草昧穆穆經綸乃文乃武乃聖乃神動龕危亂静比斯民誕應休命奄有八夤握機肇運光啟禹服義滿天淵禮昭地軸澤靡不懷威無不肅戎夷竭歡象來致福偃風裁化暅日􅀈祥信星含曜秬草流芳七廟觀徳六樂宣章惟先惟敬是饗是將穆徳凱容樂穆皇后神室奏太姒嬪周塗山儷禹我后嗣徽重規疊矩肅肅閟宮翔翔雲舞有饗徳馨無絶終古明徳凱容樂髙宗明皇帝神室奏多難固業殷憂啟聖帝宗讚武維時執競起栁獻祥百堵興詠義雖祀夏功符受命逺無不懷邇無不肅其儀濟濟其容穆穆赫矣君臨昭哉嗣服允王惟后膺此多福禮以昭事樂以感靈八簋陳室六舞充庭觀徳在廟象徳在形四海來祭萬國咸寧梁宗廟登歌隋書樂志曰七曲四言皇帝初獻奏按太廟雅歌與郊明堂同用者皇雅滌雅牷雅諴雅第三首並沈約撰沈約功髙禮洽徳尊樂備三獻具舉百司在位誠敬罔諐幽明同致茫茫億兆無思不遂葢之如天容之如地殷兆玉筐周始邠王於赫文祖基我大梁肇土七十奄有四方帝軒百祀人思未忘永言聖烈祚我無疆有夏多罪殷人塗炭四海倒懸十室思亂自天命我殱凶殄難既躍乃飛言登天漢爰饗爰祀福祿攸贊祀郭作格犧象既飾罍俎斯具我鬱載馨黄流乃注峨峨卿士駿奔是務佩上鳴堦纓還拂樹悠悠億兆天臨日煦猗歟至徳光被黔首鑄鎔蒼昊甄陶區有肅恭三獻對揚萬夀比屋可封含生無咎匪徒七百天長地久肅郭作恪有命自天於皇后帝悠悠四海莫不來祭繁祉具膺八神聳衛福至有兆慶來無際播此餘休于彼荒裔祀典昭潔我禮莫違八簋充室六龍觧騑神宫肅肅靈寢㣲㣲嘉薦既饗景福攸歸至徳光被洪祚載輝小廟樂歌隋書樂志曰梁又有小廟太祖太夫人廟非嫡故别立廟皇帝每祭太廟訖諸小廟亦以一太牢如太廟禮舞歌閟宫肅肅清廟濟濟於穆夫人固天攸啟祚我梁徳膺斯盛禮文㮰達嚮重檐丹陛飾我俎彛潔我粢盛躬事奠饗推尊盡敬悠悠萬國具承兹慶大孝追逺兆庻攸詠登歌光流者逺禮貴彌申嘉饗云備盛典必陳追養自夲立愛惟親皇情乃慕帝服來尊駕齊六轡旂耀三辰感兹霜露事彼冬春以斯孝徳永被烝民陳太廟舞辭隋書樂志曰陳初並用梁樂惟改七室舞辭凱容舞皇祖歩兵府君神室奏周𢎞讓下同於赫皇祖宫牆髙嶷邁彼厥初成兹峻極縵樂簡簡閟寢翼翼祼饗若存惟靈靡測凱容舞皇祖正貟府君神室奏昭哉上徳浚彼洪源道光前訓慶流後昆神猷緬邈清廟斯存以享以祀惟祖惟尊惟郭作是凱容舞皇祖懐安府君神室奏選辰崇饗飾禮嚴敬靡愛牲牢兼馨粢盛明明列祖龍光逺映肇我王風形斯舞詠凱容舞皇髙祖安成府君神室奏道遥積慶徳逺昌基永言祖武致享從思九章停列八舞廻墀靈其降止百福來綏凱容舞皇曽祖太常府君神室奏肇迹締基義標鴻篆恭惟載徳瓊源方闡享薦三清筵陳四璉增我堂構式敷帝典景徳凱容舞皇祖景皇帝神室奏皇祖執徳長發其祥顯仁藏用懐道韜光寧斯閟寢合此蕭薌永昭貽厥還符翦商武徳舞皇考髙祖武皇帝神室奏烝哉聖祖撫運升離道周經緯功格𤣥祇方軒邁扈比舜陵媯緝熈是詠欽明在斯雲雷遘屯圖南共舉大定揚越震威衡楚四奥宅心九疇還敘景星出翼非雲入呂徳暢容辭慶昭羽綴於穆清廟載揚徽烈嘉玉既陳豐盛斯潔是將是享鴻猷無絶北齊享廟樂辭陸卬等奉詔撰肆夏樂先祀一日夕牲羣臣入奏三公出進􅌻羣臣入羣官出並奏肆夏辭同霜凄雨暢烝哉帝心有敬其祀肅事惟歆昭昭車服濟濟衣簪鞠躬貢酎磬折奉琛差以五列和以八音式祗王度如玉如金髙明登歌樂迎神奏日卜惟吉辰擇其良奕奕清廟黼黻周張大呂為角應鍾為羽路鼗隂竹徳歌昭舞祀事孔明百神允穆神心乃顧保兹介福昭夏樂牲出入奏大祀云事獻奠有儀既歌既展贊顧迎犧執從伊竦芻飾惟慄俟用於庭將升於室且握且騂以致其誠惠我貽頌降祉千齡昭夏樂薦毛血奏緬彼遐慨悠然永思留連七享纒綿四時神升魄沈靡聞靡見隂陽載俟臭聲兼薦祖考其鍳言萃王休降神敷錫百福是由皇夏樂進熟皇帝入北門奏詣東陛升殿並奏皇夏辭同齊居嚴殿夙駕層闈車輅垂彩旒衮騰輝聳誠載仰翹心有慕洞洞自形斤斤表歩閟宮有邃神道依稀孝心緬􅊬爰屬爰依登歌樂太祝祼地奏太室窅窅神居宿設鬱鬯惟芬珪璋惟潔彛斚應時龍蒲代用藉茅無咎福禄攸降端感㑹事儼思修禮齊齊勿勿俄俄濟濟登歌樂皇帝升殿殿上作我祠我祖永惟厥先炎農肇聖靈祉蟬聨霸圖中造帝業方宣道昌基構撫運承天奄家六合爰光八埏尊神致禮孝思惟纒寒來暑反惕薦在年匪敬伊慕備物不愆設簴設業鞉鼓填填辟公在位有容伊䖍登歌啟佾下管應懸厥容無爽幽明肅然誠帀厚地和達穹𤣥既調風雨載協山川周庭有列湯孫永延教聲惟被邁後光前始基樂恢祚舞皇帝初獻六世祖司空公神室奏克明克俊祖武惟昌業𢎞營土聲被海方有流厥徳終耀其光明神幽贊景祚攸長始基樂恢祚舞五世祖吏部尚書神室奏顯允盛徳隆我前構瑶源彌㵼瓊根愈秀誕惟有族丕緒克茂大業崇新洪基増舊始基樂恢祚舞髙祖秦州使君神室奏祖徳丕顯明喆知機豹變東國鵲起西歸禮申官次命改朝衣敬思孝享多福無違始基樂恢祚舞曽祖太尉武貞公神室奏兆靈有業濳徳無聲韜光戢耀貫幽洞冥道𢎞舒巻施博藏行緬追嵗事夜遽不寧始基樂恢祚舞祖文穆皇帝神室奏皇皇祖徳穆穆其風語嘿自巳明叡在躬荷天之錫聖表克隆髙山作矣寳祚其崇離光旦旦載煥載融感薦惟永神保無窮武徳樂昭烈舞髙祖神武皇帝神室奏天造草昧時難糾紛孰拯斯溺靡救其焚大人利見緯武經文顧指維極吐吸風雲開天闢地峻嶽夷海冥工掩迹上徳不宰神心有應龍化無待義征九服仁兵告凱上平下成靡或不寧匪王伊帝偶極崇靈享親則孝潔祀惟誠禮備樂序肅贊神明文徳樂宣正舞文襄皇帝神室奏聖武丕基叡文顯統眇哉神啟鬱矣天縱道則人𢎞徳云邁種昭冥咸叙崇深畢綜自中徂外經朝庇野政反淪風威還缺雅旁作穆穆格於上下維享維宗來鑒來假文正樂光大舞顯祖文宣皇帝神室𤣥厯巳謝蒼靈告期圖璽有屬揖讓惟時龍升虎變𢎞我帝基對揚穹昊實啟雍熈欽若皇猷永懐王度欣賞斯穆威刑允措軌物俱宣憲章咸布俗無邪指下歸正路茫茫九域振以乾綱混通華裔配括天壤作禮視徳列樂傅響薦祀惟䖍衣冠載仰虎隋書作獸皇夏樂皇帝還東壁飲福酒奏孝心翼翼率禮兢兢時洗時薦或降或升在堂在戸載湛載凝多品斯奠備物攸膺蘭芬敬挹玉俎恭承受祭之祜如彼岡陵髙明樂送神奏仰榱桷慕衣冠禮云罄祀將闌神之駕紛奕奕乗白雲無不適窮昭域極幽塗歸帝祉眷皇都皇夏樂帝詣便殿奏禮行斯畢樂奏以終受嘏先退載暢其衷鑾軒循轍麾旌復路光景徘徊絃歌顧慕靈之相矣有錫無疆國圖日競家厯天長周宗廟歌辭皇夏皇帝入廟門奏庾信下同肅肅清廟巖巖寢門欹器防滿金人戒言應􅉧懸鼓崇牙樹羽階變升歌庭紛象舞閒安象設緝熈清奠春鮪初登新蓱先薦僾然入室儼乎其位悽愴履之非寒之謂其郭作在昭夏降神奏永維祖武濳慶靈長龍圖革命鳳厯歸昌功移上墋徳耀中陽清廟肅肅猛虡煌煌曲髙大夏聲和盛唐牲牷蕩滌蕭合馨香和鑾戾止振鷺來翔永敷萬國是則四方皇夏俎入皇帝升階奏年祥辨日上協龜言奉酎承列來庭駿奔雕禾飾斚翠羽承樽敬殫如此恭惟執燔皇夏皇帝獻皇髙祖奏慶緒千重秀鴻源萬里長無時猶戢翼有道故韜光盛徳必有後仁義終克昌明星初肇慶大電久呈祥皇夏皇帝獻皇曾祖徳皇帝奏克昌光上烈基聖穆西藩崇仁髙渉渭積徳被居原帝圖張徃迹王業茂前尊重芬徳陽廟疉慶夀陵園百靈光祖武千年福孝孫皇夏皇帝獻皇祖太祖文皇帝奏雄圖屬天造宏畧遇羣飛風雲猶聽命龍躍遂乗機百二當天險三分拒樂推函谷風塵散河陽氛霧晞濟弱淪風起扶危頽運歸地紐崩還正天樞落更追原祠乍超忽畢隴或綿㣲終封三尺劍長巻一戎衣皇夏皇帝獻文宣皇太后奏月靈興慶沙祥發源功参禹迹徳贊堯門言容典禮褕狄徽章儀形温徳令問昭陽日月不居嵗時晼晚瑞雲纒心閟宫惟逺皇夏皇帝獻閔皇帝奏龍圖基代徳天歩屬艱難謳歌還受瑞揖讓乃登壇升輿芒刺重入位據關寒巻舒雲汎濫遊揚日浸㣲出鄭終無反居桐竟不歸祀夏今惟舊尊靈諡更追皇夏皇帝獻明皇帝奏若水逢降君窮桑屬惟政丕哉馭帝籙鬱矣當天命方定五雲官先齊八風令文昌氣似珠太史河如鏡南宫學巳開東觀書還聚文辭金石韻毫翰風飈豎清室桂馮馮齊房芝詡詡寧思玉管笛空見靈衣舞皇夏皇帝獻髙祖武皇帝奏南河吐雲氣北斗降星辰百靈咸仰徳千年一聖人書成紫㣲動律定鳳凰馴六軍命西土甲子陳東隣戎衣此一定萬里更無塵煙雲同五色日月並重輪流沙既西静蟠木又東臣凱樂聞朱雁鐃歌見白麟今為六代祀還得九疑賔皇夏皇帝還東壁飲福酒奏禮殫祼獻樂極休成長離前掞宗祀文明縮酌浮蘭澄罍合鬯磬折禮容旋廻靈貺受釐撤俎飲福移樽惟光惟烈文子文孫皇夏皇帝還便坐奏庭闋四始筵終三薦顧歩堦墀徘徊餘奠六龍矯首七萃警途鼓移行漏風轉相烏翼翼從事綿綿四時惟神降嘏永言保之大祫樂歌二首餘同宗廟時享昭夏降神奏律在夾鍾服居蒼衮杳杳清思綿綿長逺就祭於合班神於本來庭有序助祭有章樂舞六代賔歌二王和鈴以節鞗革斯鏘齊宮饌玉鬱斚浮金洞庭鐘鼓龍門瑟琴其樂巳變惟神是臨登歌奠玊帛奏神惟顯思不言而令玉帛之禮敢陳莊敬奉如弗勝薦如受命交於神明慤於言行隋太廟歌隋書樂志曰先是髙祖遣内史侍郎李元操直内使省盧思道等列清廟歌辭十二曲令齊樂人曹妙達於太廟教習以代周歌其初迎神七言象元基曲獻奠登歌六言象傾盃曲送神禮畢五言象行天曲至是𢎞等但改其聲合於鐘律而辭經勑定不敢易之至仁夀元年煬帝初爲太子從饗於太廟聞而非之乃上言曰清廟歌辭文多浮麗不足以述宣功徳請更議定扵是制詔吏部尚書竒章公𢎞開府儀同三司領太子洗馬栁顧言秘書丞攝太常少卿許善心内史舍人虞世基禮部尚書蔡徵等更詳故實創製雅樂歌辭大業元年煬帝又詔修髙廟樂後復難於改作其議竟寢惟新造髙祖廟歌九首今亡迎神歌務本興教尊神體國霜露感心享祀陳則官聨式序奔走在庭几筵結慕祼獻惟誠嘉樂載合神其降止永言保之錫以繁祉登歌孝熈嚴祖師象敬宗惟皇肅肅有來雍雍雕梁霞複繡橑雲重觀徳自感奉璋伊恭彛斚盡飾羽綴有容升歌發藻景福來從俎入歌郊丘社廟同祭本用初祀由功舉駿奔咸㑹供神有序明酌盈樽豐犧實俎幽全既薦繢錯維旅享由明徳香非稷黍載流嘉慶克固鴻緒皇髙祖太原府君歌締基發祥肇源興慶廼仁迺哲克明克令庸宣國圖善流人詠開我皇業七百同盛皇曾祖康王歌皇條俊茂帝系靈長豐功疉軌厚利重光福由善積代以徳彰嚴恭盡禮永錫無疆皇祖獻王歌盛才必達丕基增舊渉渭同符遷邠等構𢎞風邁徳義髙道富神鑒孔昭王猷克懋渭隋書作魏皇考太祖武元皇帝歌深仁冥著至道濳敷皇矣太祖耀名天衢翦商隆祚奄宅隋區有命既集誕開靈符飲福酒歌郊丘社廟同神道正直祀事有融肅雍備禮莊敬在躬羞燔巳具奠酹將終降祥惟永受福無窮送神歌饗禮具利事成佇旒冕肅簮纓金奏終玉俎撤盡孝敬窮嚴潔人祇分哀樂半降景福憑幽贊古樂苑巻五
