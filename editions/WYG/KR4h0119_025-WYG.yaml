body:
  text: 古樂苑巻二十五明梅鼎祚編清商曲辭西曲歌西曲歌古今樂録曰西曲歌有石城樂烏夜啼莫愁樂估客樂襄陽樂三洲襄陽蹋銅蹄採桑度江陵樂青陽度青驄白馬共戲樂安東平女兒子來羅那阿灘孟珠翳樂夜度娘長松標雙行纒黄督黄纓平西樂攀楊枝尋陽樂白附鳩㧞蒲壽陽樂作蠶絲楊叛兒西烏夜飛月節折楊柳枝三十四曲石城樂烏夜啼莫愁樂估客樂襄陽樂三洲襄陽蹋銅蹄採桑度江陵樂青驄白馬共戲樂安東平那阿灘孟珠翳樂夀陽樂並舞曲青陽度女兒子來羅夜黄夜度娘長松標雙行纒黄督黄纓平西樂攀楊枝尋陽樂白附鳩㧞蒲作蠶絲並倚歌孟珠翳樂亦倚歌按西曲歌出於荆郢樊鄧之間而其聲節送和與呉歌亦異故因其方俗而謂之西曲云石城樂五曲唐書樂志曰石城樂者宋臧質所作也石城在竟陵質嘗為竟陵郡於城上眺矚見羣少年歌謡通暢因作此曲古今樂録曰石城樂舊舞十六人左云古辭宋臧質生長石城下開牕對城樓城中諸少年出入見依投陽春百花生摘挿環髻前捥指蹋忘愁相與及盛年布帆百餘幅環環在江津執手雙淚落何時見歡還大艑載三千漸水丈五餘水髙不得渡與歡合生居聞歡逺行去相送方山亭風吹黄蘗藩惡聞苦籬聲烏夜啼八曲唐書樂志曰烏夜啼者宋臨川王義慶所作也元嘉十七年徙彭城王義康於豫章義慶時為江州至鎮相見而哭文帝聞而怪之徴還慶大懼伎妾夜聞烏夜啼聲扣齋閤云明日應有赦其年更為南兖州刺史因此作歌故其和云夜夜望郎來籠牕牕不開今所傳歌辭似非義慶本㫖教坊記曰烏夜啼者元嘉二十八年彭城王義康有罪放逐行次潯陽江州刺史衡陽王義季留連飲宴歴旬不去帝聞而怒皆囚之㑹稽公主姊也嘗與帝宴洽中席起拜帝未逹其㫖躬止之主流涕曰車子歲暮恐不為陛下所容車子義康小字也帝指蔣山曰必無此不爾便負初寧陵武帝葬於蔣山故指先帝陵為誓因封餘酒寄義康旦日曰昨與㑹稽姊飲樂憶弟故附所飲酒往遂宥之使未逹潯陽衡陽家人扣二王所囚院曰昨夜烏夜啼官當有赦少頃使至二王得釋故有此曲按史稱臨川王義康為江州而云衡陽王義季誤古今樂録烏夜啼舊舞十六人李勉琴説曰烏夜啼者何晏之女所作也初晏繫獄有二烏止於舍上女曰烏有喜聲父必免遂撰此操與前義同而事異文獻通考云今所傳歌辭似非義慶本㫖歌舞諸少年娉婷無種迹菖蒲花可憐聞名不曽識少年玉臺作年少長檣鐵鹿子布帆阿那起詫儂安在間一去數千里辭家逺行去儂歡獨離居此日無啼音裂帛作還書可憐烏臼鳥彊言知天曙無故三更啼歡子冒闇去烏生如欲飛飛飛各自去生離無安心夜啼至天曙籠牕牕不開蕩户户不動歡下葳蕤籥交儂那得往逺望千里烟隠當在歡家欲飛無兩翅當奈獨思何巴陵三江口蘆荻齊如麻執手與歡别痛切當奈何同前梁簡文帝緑草庭中望明月碧玉堂裏對金鋪鳴弦撥捩發初異挑琴欲吹衆曲殊不疑三足朝含影直言九子夜相呼羞言獨眠枕下流託道單棲城上烏流字疑誤同前集題云夜聽伎賦得烏夜啼劉孝綽鵾弦且輟弄鶴操暫停徽别有啼烏曲東西相背飛倡人怨獨守蕩子殊未歸忽聞生離唱長夜泣羅衣相背飛一作各自飛殊一作遊同前二首周庾信桂樹懸知逺風竿詎肯低獨憐明月夜孤飛猶未棲虎賁誰見惜御史詎相攜雖言入弦管終是曲中啼促柱繁弦非子夜歌聲舞態異前谿御史府中何處宿洛陽城頭那得棲彈琴蜀郡卓家女織錦秦川竇氏妻詎不自驚長淚落到頭啼烏恒夜啼烏棲曲四首梁簡文帝芙蓉作船絲作䋏北斗横天月將落採蓮渡頭礙黄河郎今欲渡畏風波礙一作擬浮雲似帳月如鉤那能夜夜南陌頭宜城酘酒今行熟停鞍繫馬暫棲宿北堂書抄云宜城九醖酒曰酘酒并引此句郭本作投泊誤青牛丹轂七香車可憐今夜宿倡家倡家髙樹烏欲棲羅帷翠帳任君低帳一作被任一作向織成屏風金屈膝朱唇玉面燈前出相看氣息望君憐誰能含羞不自前同前四首元帝沙棠作船桂為檝夜渡江南採蓮葉復値西施新浣紗共向江干眺月華向玉臺作汎眺玉臺作瞻月華似璧星如佩流影澄明玉堂内邯鄲九枝朝始成金巵玉椀共君傾交龍成錦鬬鳯紋芙蓉為帶石榴裙日下城南兩相望月沒參横掩羅帳七彩隨珠九華玉蛺蝶為歌明星曲蘭房椒閤夜方開那知歩歩香風逐同前三首前二首郭本作梁元帝今從玉臺蕭子顯幄中清酒瑪瑙鍾裾邊襍佩琥珀龍欲持寄君心不惜共指三星今何夕龍一作紅濃黛輕紅㸃花色還欲令人不相識金壺夜水詎能多莫持奢用比懸河水一作永芳樹歸飛聚儔匹猶有殘灮半山日莫憚褰裳不相求漢臯遊女習風流風一作飛誤同前三首郭本棲烏曲陳後主陌頭新花歴亂生葉裏啼鳥送春情長安遊俠無數伴白馬驪珂路中滿啼一作春金鞍向暝欲相連玉靣俱要來帳前含態眼語懸相解翠帶羅裙入為解相解音蟹合歡􅃭薰百和香牀中被織兩鴛鴦烏啼漢沒天應曙只持懐抱送郎去同前二首徐陵卓女紅妝期此夜胡姬沽酒誰論價風流荀令好兒郎偏能傅粉復薫香妝郭本作枌繡帳羅帷隱燈燭一夜千年猶不足唯憎無賴汝南雞天河未落猶爭啼同前岑之敬驄馬直去沒浮雲河渡氷開兩岸分烏藏日暗行人息空棲隻影長相憶明月二八照花新當壚十五晩留賓同前郭云棲烏曲江總桃花春水木蘭橈金羈翠盖聚河橋隴西上計應行去城南美人啼著曙莫愁樂二曲唐書樂志曰莫愁樂者出於石城樂石城有女子名莫愁善歌謡石城樂和中復有忘愁聲因有此歌古今樂録曰莫愁樂亦云蠻樂舊舞十六人梁八人樂府解題曰古歌亦有莫愁洛陽女與此不同容齋三筆曰莫愁者郢州石城人今郢有莫愁村畫工傳其貌好事者多寫寄四逺唐書樂志云石城女子名莫愁古詞莫愁在何處是也李義山詩如何四紀為天子不及盧家有莫愁此莫愁者洛陽人梁武帝河中歌河中之水向東流洛陽女兒名莫愁十五嫁為盧家婦十六生兒似阿侯者是也近世周美成樂府西河一闋專詠金陵所云莫愁艇子曾繫豈非誤指石頭城為石城乎按今金陵亦有莫愁湖莫愁在何處莫愁石城西艇子打兩槳催送莫愁來聞歡下揚州相送楚山頭探手抱腰看江水斷不流估客樂古今樂録曰估客樂者齊武帝之所製也帝布衣時嘗遊樊鄧登阼以後追憶往事而作歌使樂府令劉瑶管弦被之教習卒遂無成有人啓釋寳月善解音律帝使奏之旬日之中便就諧合敕歌者常重為感憶之聲猶行於世寳月又上兩曲帝數乘龍舟遊五城江中放觀以紅越布為帆緑絲為帆縴鍮石為篙足篙榜者悉著鬱林布作淡黄袴列開使江中衣出五城殿猶在齊舞十六人梁八人唐書樂志曰梁改其名為商旅行齊武帝昔經樊鄧役阻潮梅根渚感憶追往事意滿辭不叙阻潮一作假檝同前二首釋寳月郎作十里行儂作九里送拔儂頭上釵與郎資路用有信數寄書無信心相憶莫作瓶落井一去無消息同前二首郭本無名氏詩紀亦附寳月大艑珂峨頭何處發揚州借問艑上郎見儂所歡不初發揚州時船出平津泊五兩如竹林何處相尋博同前陳後主三江結儔侣萬里不辭遥恒隨鷁首舫屢逐雞鳴潮賈客詞集云贈江中賈客姑從郭本周庾信五兩開船頭長橋發新浦懸知岸上人遥振江中鼔㐮陽樂九曲古今樂録曰㐮陽樂者宋隨王誕之所作也誕始為㐮陽郡元嘉二十六年仍為雍州刺史夜聞諸女歌謡因而作之所以歌和中有㐮陽來夜樂之語也舊舞十六人梁八人又有大堤曲亦出於此簡文帝雍州十曲有大堤南湖北渚等曲通典曰裴子野宋畧稱晉安侯劉道産為襄陽太守有善政百姓樂業人户豐贍蠻夷頥服悉縁沔而居由此歌之號襄陽樂盖非此也左云古辭宋隨王誕朝發㐮陽城暮至大堤宿大堤諸女兒花豔驚郎目上水郎擔篙下水揺雙櫓四角龍子幡環環江當柱江陵三千三西塞陌中央但問相隨否何計道里長人言㐮陽樂樂作非儂處乗星冒風流還儂揚州去爛漫女蘿草結曲繞長松三春雖同色嵗寒非處儂黄鵠參天飛中道鬱徘徊腹中車輪轉歡今定憐誰揚州蒲鍰環百錢兩三叢不能買將還空手攬抱儂鍰一作鍜女蘿自㣲薄寄託長松表何惜負霜死貴得相纒繞惡見多情歡罷儂不相語莫作烏集林忽如提儂去大堤女北魏王容寳髻耀明璫香羅鳴玉佩大堤諸女兒一一皆春態入花花不見穿栁栁隂碎東風拂靣來由來亦相愛雍州曲三首通興曰雍州襄陽也禹貢荆河州之南境春秋時楚地魏武始置襄陽郡晉兼置荆河州宋文帝割荆州置雍州號南雍魏晉巳來嘗為重鎮齊梁因之南湖梁簡文帝南湖荇葉浮復有佳期遊銀綸翡翠鉤玉軸芙蓉舟荷香亂衣麝橈聲送急流送一作隨北渚岸隂垂栁葉平江含粉堞好值城傍人多逄蕩舟妾緑水濺長袖浮苔染輕檝大堤宜城斷中道行旅極留連出妻工織素妖姬慣數錢炊彫留上客貰酒逐神仙三洲歌三曲唐書樂志曰三洲商人歌也古今樂録曰三洲歌者商客數遊巴陵三江口往還因共作此歌其舊辭云啼將别共來梁天監十一年武帝於樂夀殿道義竟留十大徳法師設樂敕人人有問引經奉答次問法雲聞法師善解音律此歌何如法雲奉答天樂絶妙非膚淺所聞愚謂古辭過質末審可改以不勑云如法師語音法雲曰應歡㑹而有別離啼將別可改為歡將樂故其歌和云三洲斷江口水從窈窕河傍流歡將樂共來長相思舊舞十六人梁八人按楊慎辭品載法雲三洲歌二首惟愁將別共來與歡將樂共來差異餘辭並同今據樂録則本皆舊曲法雲但承勑改歡將樂共來耳且亦為三洲歌和云詩紀古辭附晉送歡板橋灣相待三山頭遥見千幅帆知是逐風流風流不暫停三山隱行舟願作比目魚隨歡千里遊湘東醽醁酒廣州龍頭鐺玉樽金鏤椀與郎雙杯行同前陳後主春江聊一望細草遍長洲沙汀時起伏畫舸屢掩留採桑度七曲採桑渡一曰採桑唐書樂志曰採桑因三洲曲而生此聲苑也採桑度梁時作水經曰河水過屈縣西南為採桑津春秋僖公八年晉里克敗狄于採桑是也梁簡文帝烏棲曲曰採桑渡頭礙黄河郎今欲渡畏風波古今樂録曰採桑渡舊舞十六人梁八人即非梁時作矣詩紀古辭附晉蠶生春三月春桑正含緑女兒採春桑歌吹當春曲冶遊採桑女盡有芳春色姿容應春媚粉黛不加飾繫條採春桑採葉何紛紛採桑不裝鉤牽壊紫羅裙語歡稍養蠶一日養百塸奈當黒痩盡桑葉常不周春月採桑時林下與歡俱養蠶不滿百那得羅繡襦採桑盛陽月緑葉何翩翩攀條上樹素牽壊紫羅裙偽蠶化作繭爛漫不成絲徒勞無所獲養蠶持底為㐮陽蹋銅蹄三曲隋書樂志曰梁武帝之在雍州有童謡云襄陽白銅蹄反縛揚州兒識者言白銅蹄謂金蹄為馬也白金色也及義師之興實以鐵騎揚州之士皆靣縳果如謡言故即位之後更造新聲帝自為之詞三曲又令沈約為三曲以被管弦古今樂録曰㐮陽蹋銅蹄者梁武西下所製也沈約又作其和云㐮陽白銅蹄聖徳應乾來天監初舞十六人後八人玉臺云襄陽白銅鞮歌梁武帝陌頭征人去閨中女下機含情不能言送别沾羅衣草樹非一香花葉百種色寄語故情人知我心相憶龍馬紫金鞍翠眊白玉羈照耀雙闕下知是㐮陽兒同前三曲一曰白銅蹄歌沈約分手桃林㟁望别峴山頭若欲寄音信漢水向東流望一作送生長宛水上從事㐮陽城一朝遇神武奮翼起先鳴蹀鞚飛塵起左右自生灮男兒得富䝿何必在歸鄉江陵樂四曲古今樂録曰江陵樂舊舞十六人梁八人通典曰江陵古荆州之域春秋時楚之郢地秦置南郡晉為荆州東晉宋齊以為重鎮梁元帝都之有紀南城楚渚宫在焉詩紀古辭附晉不復蹋踶人踶地地欲穿盆隘歡繩斷蹋壊絳羅裙不復出場戲踶場生青草試作兩三回踶場方就好陽春二三月相將蹋百草逄人駐步看揚聲皆言好暫出後園看見花多憶子烏鳥雙雙飛儂歡今何在青陽度三曲古今樂録曰青陽度倚歌凡倚歌悉用鈴鼓無弦有吹玉臺作青陽歌載青荷一首詩紀古辭附晉隱機倚不織尋得爛漫絲成匹郎莫斷憶儂經絞時碧玉擣衣砧七寳金蓮杵髙舉徐徐下輕擣只為汝青荷盖緑水芙蓉發紅鮮下有並根藕上有同心蓮發郭作披上有同心蓮一作上生並頭蓮郭作並目蓮青驄白馬八曲古今樂録曰青驄白馬舊舞十六人詩紀古辭附晉青驄白馬紫絲韁可憐石橋根柏梁汝忽千里去無常願得到頭還故鄉繫馬可憐著長松遊戲徘徊五湖中借問湖中採菱婦蓮子青荷可得否可憐白馬髙纒騣著地躑躅多徘徊問君可憐六萌車迎取窈窕西曲娘問君可憐下都去何得見君復西歸齊唱可憐使人惑晝夜懐歡何時忘共戲樂四曲古今樂録曰共戲樂舊舞十六人梁八人本齊辭齊世方昌書軌同萬㝢獻樂列國風時泰民康人物盛腰鼔鈴柈各相競長袖翩翩若鴻驚纎腰嫋嫋㑹人情觀風採樂徳化昌聖皇萬壽樂未央安東平五曲古今樂録曰安東平舊舞十六人梁八人詩紀古辭附晉凄凄烈烈北風為雪船道不通步道斷絶吴中細布濶幅長度我有一端與郎作袴㣲物雖輕拙手所作餘有三丈與郎作厝制為輕巾以奉故人不持作好與郎拭塵東平劉生復感人情與郎相知當解千齡女兒子二曲古今樂録曰女兒子倚歌也詩紀古辭附晉巴東三峽猿鳴悲夜鳴三聲淚沾衣我欲上蜀蜀水難蹋蹀珂頭腰環環來羅四曲古今樂録曰來羅倚歌也詩紀古辭附晉鬱金黄花標下有同心草草生日已長人生日就老君子防未然莫近嫌疑邉瓜田不躡履李下不正冠此即君子行首四句故人何怨新切少必求多此事何足道聽我歌來羅白頭不忍死心愁皆敖然遊戲泰始世一日當千年那呵灘六曲古今樂録曰那呵灘舊舞十六人梁八人其和云郎去何當還多叙江陵及揚州事那呵盖灘名也詩紀古辭附晉我去只如還終不在道邉我若在道邉良信寄書還㳂江引百丈一濡多一艇上水郎擔篙何時至江陵江陵三千三何足特作逺書疏數知聞莫令信使斷聞歡下揚州相送江津灣願得篙櫓折交郎到頭還篙折當更覔櫓折當更安各自是官人那得到頭還百思纒中心顦顇為所歡與子結終始折約在金蘭孟珠一曰丹陽孟珠歌古今樂録曰孟珠十曲二曲倚歌八曲舊舞十六人梁八人玉臺近代襍曲詩紀古辭附晉人言孟珠富信實金滿堂龍頭銜九花玉釵明月璫陽春二三月草與水同色攀條摘香花言是歡氣息同前人言春復著我言未渠央暫出後湖看蒲菰如許長揚州石榴花摘挿雙襟中葳蕤當憶我莫待豔他儂陽春二三月草與水同色道逄遊冶郎恨不早相識望歡四五年實情將懊惱願得無人處回身與郎抱陽春二三月正是養蠶時那得不相怨其再闕儂來將歡期三更合冥歡如何走馬放蒼鷹飛馳赴郎期適聞梅作花花落已成子杜鵑繞林啼思從心下起可憐景陽山岧嶤百尺樓上有明天子麟鳯戲中州一作遊翳樂古今樂録曰翳樂一曲倚歌二曲舞十六人梁八人詩紀古辭附晉人生歡愛時少年新得意一旦不相見輙作煩冤思同前陽春二三月相將舞翳樂曲曲隨時變持許豔郎目人言揚州樂揚州信自樂總角諸少年歌舞自相逐夜黄古今樂録曰夜黄倚歌也詩紀古辭附晉湖中百種鳥半雌半是雄鴛鴦逐野鴨恐畏不成雙夜度娘古今樂録曰夜度娘倚歌也詩紀古辭附晉夜來冒霜雪晨去履風波雖得叙㣲情奈儂身苦何長松標古今樂録曰長松標倚歌也詩紀古辭附晉落落千丈松晝夜對長風歲暮霜雪時寒苦與誰雙雙行纒二曲古今樂録曰雙行纒倚歌也詩紀古辭附晉朱絲繫腕繩真如白雪凝非但我言好衆情共所稱新羅繡行纒足趺如春妍他人不言好獨我知可憐黄督二曲古今樂録曰黄督倚歌也詩紀古辭附晉喬客他鄉人三春不得歸願看楊栁樹巳復藏斑鵻籠車度蹋衍故人求寄載催牛閉後户無預故人事西平樂古今樂録曰西平樂倚歌也詩紀古辭附晉我情與歡情二情感蒼天形雖胡越隔神交中夜間攀楊枝一曰攀楊柳古今樂録曰攀楊枝倚歌也樂苑曰攀楊枝梁時作詩紀附晉誤自從别君來不復著綾羅畫眉不注口施朱當奈何尋陽樂古今樂録曰尋陽樂倚歌也玉臺近代禖曲詩紀古辭附晋雞亭故儂去九里新儂還送一却迎兩無有暫時閒儂玉臺並作人白附鳩古今樂録曰白附鳩倚歌亦曰白浮鳩本拂舞曲也按宋彭城王忌檀道濟誅之時人歌云可憐白浮鳩枉殺檀江州唐劉夢得過道濟墓詩云萬里長城壤荒雲野草秋秣陵多士女猶唱白浮鳩則此曲始于此事明矣郭氏樂府並不引及詩紀附為晉辭或宋以前舊有此曲邪石頭龍尾彎新亭送君者酤酒不取錢郎能飲幾許白浮鳩梁呉均瑯琊白浮鳩紫翳飄陌頭食飲東莞野栖宿越王樓拔蒲二曲古今樂録曰拔蒲倚歌也詩紀古辭附晉青蒲銜紫茸長葉復從風與君同舟去拔蒲五湖中朝發桂蘭渚晝息桑榆下與君同拔蒲竟日不成把壽陽樂九曲古今樂録曰夀陽樂者宋南平穆王為預州所作也舊舞十六人梁八人按其歌辭盖叙傷別望歸之思左云古辭宋南平王鑠可憐八公山在壽陽別後莫相忘東臺百餘尺凌風雲別後不忘君梁長曲水流明如鏡雙林與郎照辭家逺行去空為君明知嵗月駛籠牕取涼風弹素琴一歎復一吟夜相思望不來人樂我獨愁長淮何爛漫路悠悠得當樂忘憂上我長瀨橋望歸路秋風停欲度銜淚出傷門壽陽去必還當幾載作蠶絲四曲古今樂録曰作蠶絲倚歌也玉臺作蠶絲歌載春蠶一首云近代襍曲詩紀古辭附晉柔桑感陽風阿娜嬰蘭婦垂條付緑葉委體看女手春蠶不應老晝夜常懐絲何惜㣲軀盡纒綿自有時績蠶初成繭相思條女密投身湯水中䝿得共成匹素絲非常質屈折成綺羅敢辭機杼勞但恐花色多楊叛兒八曲唐書樂志曰楊叛兒本童謡歌也齊隆昌時女巫之子曰楊旻少時隨母入内及長為何后寵童謡云楊婆兒其戲來所歡語訛遂成楊叛兒古今樂録曰楊叛兒送聲云叛兒教儂不復相思載玉作手鉤七寳光平天繡沓織成帶嚴帳信可憐暫出白門前楊栁可藏烏歡作沈水香儂作博山罏宋讀曲歌亦載送郎乗艇子不作遭風慮横篙擲去漿顛倒逐流去七寳珠絡鼓教郎拍復拍黄牛細犢兒楊栁映松柏歡欲見蓮時移湖安屋裏芙蓉繞牀生眠卧抱蓮子聞歡逺行去送歡至新亭津邏無儂名落秦中庭生誠知非好草龍頭相鉤連見枝如欲繞楊叛西隨曲栁花經東隂風流隨逺近飄揚悶儂心同前梁武帝桃花初發紅芳草尚抽緑南音多有㑹偏重叛兒曲同前選詩拾遺作隋越王京洛行郭作隋後主楊叛兒歌陳後主青春上陽月結伴戲京華龍媒玉珂馬鳯軫繡香車水映臨橋樹風吹夾路花日昬歡宴罷相將歸狹斜西烏夜飛五曲古今樂録曰西烏夜飛者宋元徽五年荆州刺史沈攸之所作也攸之舉兵發荆州東下未敗之前思歸京師所以歌和云白日缺山還去來送聲云折翅烏飛何處被弹歸左云古辭按此疑非攸之本辭宋沈攸之日從東方出團團雞子黄夫婦恩情重憐歡故在傍暫請半日給徙倚娘店前目作宴瑱飽腹作宛腦饑我昨憶歡時攬刀持自刺自刺分應死刀作離樓僻離一作雜陽春二三月諸花盡芳盛持底喚歡來花笑鶯歌詠感郎﨑嶇情不復自顧慮臂繩雙入結遂成同心去月節折楊栁歌詩紀古辭附晉正月歌春風尚蕭條去故來入新苦心非一朝折楊栁愁思滿腹中歴亂不可數入一作如二月歌翩翩烏入鄉道逄雙燕飛勞君看三陽折楊栁寄言語儂歡尋還不復乆三月歌汎舟臨曲池仰頭看春花杜鵑緯林啼折楊栁雙下俱徘徊我與歡共取四月歌芙蓉始懐蓮何處覔同心俱生世尊前折楊栁捻香散名花志得長相取五月歌菰生四五尺素身為誰珍盛年將可惜折楊栁作得九子粽思想勞歡手六月歌三伏熱如火籠牕開北牖與郎對榻坐折楊栁銅塸貯蜜漿不用水洗溴七月歌織女遊河邉牽牛顧自歎一㑹復周年折楊柳攬結長命草同心不相負八月歌迎歡裁衣裳日月流如水白露凝庭霜折楊栁夜聞擣衣聲窈窕誰家婦流如一作如流九月歌甘菊吐黄花非無杯觴用當奈許寒何折楊栁授歡羅衣裳含笑言不取十月歌大樹轉蕭索天隂不作雨嚴霜半夜落折楊栁林中與松柏嵗寒不相負十一月歌素雪任風流樹木轉枯悴松柏無所憂折楊栁寒衣履薄氷歡詎知儂否十二月歌天寒嵗欲暮春秋及冬夏苦心停欲度折楊栁沈亂枕席間纒綿不覺乆閠月歌成閠暑與寒春秋補小月念子無時閒折楊栁隂陽催我去那得有定主無時一作時無古樂苑巻二十五
