body:
  text: 古樂苑巻三十九明梅鼎祚編雜曲歌辭陳齊北北魏北周獨酌謡四首序曰齊人淳于髠善為十酒偶效之作獨酌謡陳後主獨酌謡獨酌且獨謡一酌豈陶暑二酌斷風飈三酌意不暢四酌情無聊五酌盂易覆六酌歡欲調七酌累心去八酌高志超九酌忘物我十酌忽凌霄凌霄異羽翼任致得飄飄寧學世人醉揚波去我遥爾非浮丘伯安見王子喬獨酌謡獨酌起中宵中宵照春月初花發春朝春花春月正徘徊一罇一弦當夜開聊奏孫登曲仍斟畢卓杯羅綺徒紛亂金翠轉遲囘中心本如水凝志更同灰逍遥自可樂奚語世情哉獨酌謡獨酌酒難消獨酌三兩盌弄曲兩三調調弦忽未畢忽值出房朝更似遊春苑還如逢麗譙衣香逐嬌去眼語送杯嬌餘罇盡復益自得是逍遥獨酌謡獨酌一樽酒樽酒傾未酌明月正當牖是牖非圓甕吾樂非擊缶自任物外歡更齊椿菌久巻舒乃一巻忘情且十斗寧復語綺羅因情即山藪同前陸瑜獨酌謡芳氣饒一傾蕩神慮再酌動神飈忽逢鳳樓下非待鸞弦招窻明影乘入人來香逆飄杯隨轉態盡釧逐畫杯揺桂宫非蜀郡當壚也至宵同前沈炯獨酌謡獨酌謡獨酌獨長謡智者不我顧愚夫余不要不愚復不智誰當余見招所以成獨酌一酌傾一瓢生涯本漫漫神理暫超超再酌矜許史三酌傲松喬頻煩四五酌不覺凌丹霄倐爾厭正鼎俄然賤九韶彭殤無異葬夷跖可同朝龍蠖非不屈鵬鷃但逍遥寄語號呶侣無乃太塵囂獨酌謡一無第二句不要一作未要舞媚娘三首樂苑曰舞媚娘大舞媚娘竝羽調曲也唐書曰高宗永徽末天下歌舞媚娘未幾立武氏為皇后按陳後主巳有此歌則永徽所歌蓋舊曲云陳後主樓上多嬌豔當牕併三五爭弄遊春陌相邀開繡户轉態結紅裙含嬌拾翠羽留賔乍拂弦託意時移柱淇水變新臺春罏當夏開玉面含羞出金鞍排夜來夜一作暗春日好風光尋觀向市傍轉身移佩響牽袖起衣香好一作多向一作戲隋開皇中太子勇嘗以嵗首宴宫臣左庶子唐令則請自奏琵琶歌武媚娘之曲同前周庾信朝來户前照鏡含笑盈盈自看眉心濃黛直㸃額角輕黄細安秪疑落花謾去復道春風不還少年唯有歡樂飲酒那得留殘古曲陳後主桂鉤影桂枝開紫綺袖逐風迴日明珠色偏亮葉盡衫香更來同前周王褒青樓臨大道遊俠任淹留陳王金被馬秦女桂為鉤也馬輪洛陽巷鬭雞南陌頭薄暮風塵起聊為清夜遊任一作盡還臺樂一作陸機題云飲酒樂樂苑曰飲酒樂商調曲也按此格調陸瓊為是楊慎詞品曰唐人之破陳樂何滿子皆祖之陳陸瓊蒲萄四時芳醇瑠璃千鍾舊賔夜飲舞遲銷燭朝醒弦促催人春風秋月恒好驩醉日月言新飲酒樂無名氏飲酒須飲多人生能幾何百年須受樂莫厭管弦歌應龍篇張正見應龍篇言龍未起時乃在淵底藏以喻君子隠居飬志以待時也陳張正見應龍未起時乃在淵底藏非雲足不蹈舉則沖天翔譬彼野蘭草幽居常獨香清風播四逺萬里望芬芳隠居可頤志自見焉得彰羇謡陳孔仲智芳杜觴春酒髣髴傷山時徒歌不成樂空以羇自悲羇悲懷土心遽復還山路迨及春復時無使春光暮内殿賦新詩陳江總影脈脈照金鋪虬水滴滴瀉玉壺綺翼雕甍邇清漢虬梁紫柱麗黄圖風高暗緑凋殘柳雨駛芳紅濕晩芙三五二八佳年少百萬千金買歌笑偏著故人織素詩願奉秦聲采蓮調織女今夕渡銀河當見清秋停玉梭紫一作桂蓮一作菱清一作新燕燕于飛衛莊姜送歸妾詩曰燕燕于飛差池其羽之子于歸逺送于野燕燕于飛蓋出於此若江悤辭詠雙燕而巳題云詠燕燕于飛應詔陳江總二月春暉暉雙燕理毛衣銜花弄􅓂蘼拂葉隠芳菲或在堂間戲多從幕上飛若作仙人履終向日南歸姬人怨陳江總天寒海水慣相知空牀明月不相宜庭中芳桂憔悴葉井上疎桐零落枝寒燈作花羞夜短霜鴈多情恒結伴非為隴水望秦川直置思君腸自斷姬人怨服散篇文苑英華注曰江總姬人怨二詩本集及藝文類聚并是一篇陳江總薄命夫婿好神仙逆愁高飛向紫煙金丹欲成猶百鍊玉酒新熟幾千年妾家邯鄲好輕薄特忿仙童一丸藥自悲行處緑苔生何悟啼多紅粉落莫輕小婦狎春風羅襪也得步河宫雲車欲駕應相待羽衣未去幸須同不學蕭史還樓上㑹逐嫦娥戲月中蓮調陳祖孫登長川落照日深浦漾清風弱柳埀江翠新蓮夾岸紅船行疑汛迥月映似沈空願逐琴高戲乘魚入浪中悲平城北魏王肅悲平城驅馬入雲中隂山常晦雪荒松無罷風悲彭城北史曰尚書令王肅於省中詠悲平城詩彭城王勰甚嗟其美欲使更詠乃失語云公可更為誦悲彭城也勰有慙色瑩在座即云悲彭城王公自未見肅云可為誦之瑩應聲為之肅甚嗟賞勰亦大悦北魏祖瑩悲彭城楚歌四面起屍積石梁亭血流睢水裏安定侯曲北魏温子昇封疆在上地鐘鼓自相和美人當牕舞妖姬掩扇歌燉煌樂通典曰燉煌古流沙地黒水之所經焉秦及漢初為月支匈奴之境武帝開其地後分酒泉置燉煌郡北魏温子昇客從逺方來相隨歌且笑自有燉煌樂不減安陵調同前二首一作燉煌子隋王胄長途望無巳高山斷還續意欲此念時氣絶不成曲極目眺脩塗平原忽超逺心期在何處望望崦嵫晩涼州樂歌二首北魏温子昇逺遊武威郡遥望姑臧城車馬相交錯歌吹日縱横路出玉門關城接龍城坂但事弦歌樂誰道山川逺結襪子帝王世紀曰文王伐崇侯虎至五鳳墟襪係解顧左右無可使者乃俯而結之武王至商郊牧野誓衆左仗黄鉞右秉白旄王襪解莫肯與王結王乃釋旄俯而結之漢書曰王生者善為黄老言處士嘗召居廷中公卿盡㑹立王生老人曰吾韤解顧謂張釋之為我結韤釋之跪而結之既巳人或讓王生獨奈何廷辱張廷尉如此王生曰吾老且賤自度終亡益於張廷尉廷尉方天下名臣吾故聊使結韤欲以重之諸公聞之賢王生而重釋之北魏温子昇誰能訪故劒㑹自逐前魚裁紈終委篋織素空有餘擣衣宋謝惠連有擣衣詩後多擬作不入樂府子昇此篇郭左亦不見載然相傳為樂府也唐劉希夷李白樂府並有擣衣篇北魏温子昇長安城中秋夜長佳人錦石擣流黄香杵紋砧知近逺傳聲遞響何凄涼七夕長河爛中秋明月光蠮螉塞邊絶候鴈鴛鴦樓上望天狼千里思北魏祖叔辨細君辭漢宇王嬙即虜衢寂寂人逕阻迢迢天路殊憂來似懸斾淚下若連珠無因上林鴈但見邊城蕪楊白花梁書曰楊華武都仇池人也少有勇力容貌雄偉魏胡太后逼通之華懼及禍乃率其部曲來降胡太后追思之不能已為作楊白華歌辭使宫人晝夜連臂蹋足歌之聲甚悽惋南史曰楊華本名白花奔梁後名華魏名將楊大眼之子北魂胡太后陽春二三月楊柳齊作花春風一夜入閨闥楊花飄蕩落南家含情出户脚無力拾得楊花淚沾臆秋去春還雙燕子願銜楊花入窠裏野客叢書云今市井人言快樂則有唱楊白花之説阿那瓌北史曰阿那瓌蠕蠕國主也蠕蠕之為國冬則徙渡漠南夏則還居漠北通典曰蠕蠕自拓跋初徙雲中即有種落後魏太武神䴥中彊盛盡有匈奴故地阿那瓌孝明帝時蠕蠕國主辭云匈奴主也聞有匈奴主雜騎起塵埃列觀長平坂驅馬渭橋來永世樂隋書樂志曰後魏太武平河西得西涼樂其歌曲有永世樂北齊魏收綺牕斜影入上客酒須添翠羽方開美鉛華汗不霑關門今可下落珥不相嫌清歌發北齊劉逖扇中通曼臉曲裏奏陽春久應迷座客何啻起梁塵靧面辭虞世南史畧曰北齊盧士深妻崔林義之女有才學春日以桃花靧兒面呪曰北齊崔氏取紅花取白雪與兒洗面作光悦取白雪取紅花與兒洗面作妍華取花紅取雪白與兒洗面作光澤取雪白取花紅與兒洗面作華容勑勒歌樂府廣題曰北齊神武攻周玉壁士卒死者十四五神武恚憤疾發周王下令曰高歡鼠子親犯王壁劒弩一發元兇自斃神武聞之勉坐以安士衆悉引諸貴使斛律金唱勑勒神武自和之其歌本鮮卑語易為齊言故其句長短不齊碧溪漫志云金不知書同於劉項能發自然之妙韓昌黎琴操雖古涉於摹擬未若金出性情爾按此則即為金作矣然其本文特謂神武便金唱自和之耳恐非金所作也勑勒川隂山下天似穹廬籠蓋四野天蒼蒼野茫茫風吹草低見牛羊孀婦吟北周蕭撝寒夜静房櫳孤妾思偏叢悲生聚紺黛淚下浸粧紅蓄恨縈心裏含啼歸帳中㑹須明月落那忍見牀空高句麗通典曰高句麗東夷之國也其先曰朱蒙本出於夫餘朱䝉善射國人欲殺之遂弃夫餘東南走渡普述水至紇升骨城居焉號曰句麗以高為氏按唐亦有高麗曲李勣破高麗所進後改夷則引者是也詞品曰王褒高句驪與陳陸瓊飲酒樂同調蓋疆場限隔而聲調元通也北周王褒蕭蕭易水生波燕趙佳人自多傾杯覆盌漼漼埀手奮袖娑娑不惜黄金散盡只畏白日蹉􅋸步虛辭十首樂府解題曰步虚辭道家曲也備言衆仙縹緲輕舉之美北周庾信渾成空教立元始正塗開赤玉靈文下朱陵真氣來中天九龍館倒景八風臺雲度弦歌響星移空殿迴青衣上少室童子向蓬萊逍遥聞四㑹倐忽度三災無名萬物始有道百靈初寂絶乘丹氣𤣥冥上玉虚三元隨建節八景逐迴輿赤鳳來銜璽青烏入獻書壞机仍成机枯魚還作魚棲心浴日館行樂止雲墟凝真天地表絶想寂寥前有象猶虚豁忘形本自然開經壬子歳值道甲申年迴雲隨舞曲流水逐歌弦石髓香如飯芝房脆似蓮停鸞讌瑶水歸路上鴻天嵗一作世道生乃太一守静即𤣥根中和練九氣甲子謝三元居心受善水教學重香園鳬留報關吏鶴去畫城門更以欣無迹還來寄絶言洞靈尊上德虞石㑹明真要妙思𤣥牝虚無養谷神丹丘乘翠鳳𤣥圃馭班麟移棃付苑吏種杏乞山人自此逢何世從今復幾春海無三尺水山成數寸塵紀一作統東明九芝蓋北屬五雲車飄颻入倒景出沒上煙霞春泉下玉溜青鳥向金華漢帝看桃核齊侯問棗花上元應送酒來向蔡經家陜西石刻云應逐上元酒同來訪蔡家屬一作燭溜一作霤歸心遊太極囘向入無名五香芬紫府千燈照赤城鳳林採珠實龍山種玉榮夏簧三舌響春鐘九乳鳴絳河應逺别黄鵠來相迎夏簧三舌響一作夏笛三山響北闕臨𤣥水南宫生絳雲龍泥印玉策大火練真文上元風雨散中天歌吹分靈駕千尋上空香萬里聞闕一作閣生一作坐大一作天地鏡階基逺天牕影迹深碧玉成雙樹空青為一林鵠巢堪鍊石蜂房得煑金漢武多驕慢淮南不小心蓬萊入海底何處可追尋一一作迥麟洲一海濶𤣥圃半天高浮丘迎子晉若士避盧敖經飱林慮李舊食綏山桃成丹須竹節刻髓用蘆刀無妨隠士去即是賢人逃同前一首隋煬帝洞府凝𤣥液靈山體自然俯臨滄海島囘出大羅天八行分寶樹十丈散芳蓮懸居燭日月天步役風煙躡記書金簡乘空誦玉篇冠法二儀立佩帶五星連瓊軒觶甘露瑜井挹膏泉南巢息雲馬東海戲桑田囘旗遊八極飛輪入九𤣥高蹈虚無外天地乃齊年摠轡行無極相推凌太虚翠霞承鳳輦碧霧翼龍輿輕舉金臺上高㑹玉林墟朝遊度圓海夕宴下方諸楊柳歌北周庾信河邊楊柳百丈枝别有長條踠地埀河水衝激根株危倐忽河中風浪吹可憐巢裏鳯皇兒無故當年生别離流槎一去上天池織女支機當見隨誰言從來䕃數國直用東南一小枝昔日公子出南皮何處相尋𤣥武陂駿馬翩翩西北馳左右彎弧仰月支連錢障泥渡水騎白玉手板落盤螭君言丈夫無意氣試問燕山那得碑鳳皇新管蕭史吹朱鳥春窻玉女窺銜雲酒盃赤瑪瑙照日食螺紫琉璃百年霜露奄離披一旦功名不可為定是懷王作計誤無事翻復用張儀不如飲酒高陽池日暮歸時倒接䍦武昌城下誰見移官渡營前那可知獨憶飛絮鵝毛下非復青絲馬尾埀欲與梅花留一曲共將長笛管中吹當一作將可一作得古樂苑巻三十九
