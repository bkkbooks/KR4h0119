body:
  text: 古樂苑巻四十九明梅鼎祚編襍歌謡辭諺語附南北朝宋歌檀道濟歌異苑曰檀道濟元嘉中鎮尋陽十二年入朝與家分别顧瞻城闕歔欷逾深識者是知道濟之不南旋也故時人為其歌以十三年三月伏誅主人作死别荼毒當奈何宋人歌檀道濟宋之良將有威名為敵所畏宋主疑而殺之時人哀而作歌曰可憐白浮鳩枉殺檀江州謡跋扈謡宋書武帝紀曰諸葛長民貪淫驕縱帝每優容之劉毅既誅長民懼禍及将謀作亂帝自江陵還長民到門引前却人閒語帝巳宻命左右丁旿自幔後於坐拉焉死牀側輿屍付廷尉旿驍勇有力時人語曰勿跋扈付丁旿謝靈運謡宋書五行志曰陳郡謝靈運有逸才每出入自扶接者常數人民間謡曰四人挈衣裾三人捉坐席元嘉中魏地童謡南史曰宋元嘉二十七年魏太武帝圍汝南戍文帝遣臧質北救至盱眙太武巳過淮自廣陵返攻攻盱眙就質求酒質封溲便與之且報書云不聞童謡言耶虜馬飲江水佛狸死卯年冥期使然非復人事爾智識及衆豈能勝苻堅耶頃年展爾陸梁者是爾未飲江太嵗未邜耳時魏地有童謡故質引之云軺車北來如穿雉不意虜馬飲江水虜主北歸石濟死虜欲渡江天不徙大眀中謡南史曰大明中冇奚顯度者為員外㪚騎侍郎孝武嘗使主領人功而苛虐無道動加捶撻暑雨寒雪不聴暫休人不堪命時建康縣考囚或用方材壓額及踝脛故民間有此謡又相戯易反顧付奚度其暴酷如此寧得建康壓額不能受奚度拍王張謡南史曰眀帝以王景文外戚貴盛張永累經軍旅疑其将來難信乃自為謡言一士不可親弓長射殺人泰始中童謡南齊書五行志曰眀帝殺建安王休仁蘇偘云後從帝自東城即位東城出天子武進縣上所居東城里也禾絹謡南史曰宋明帝時阮佃夫楊運長王道隆皆擅威權言為詔敇郡守令長一缺十除内外混然官以賄命王阮家富于宫室中書舍人胡母顥専權奏無不可時人語曰云云禾絹謂上也禾絹閉眼諾胡母大張槖元徽中童謡齊書五行志曰元徽中童謡後沈攸之反雍州刺史張敬兒襲江陵殺攸之子元填等襄陽白銅蹄郎殺荆州兒童謡南史曰齊高帝輔政袁粲劉彦節王藴等皆不同而沈攸之又稱兵反粲藴雖敗攸之尚存卞彬意猶以髙帝事無所成乃謂帝曰比聞謡云云公頗聞不時藴居父憂與粲同死故云尸著服也服衣也孝子不在日代哭者褚子也彬謂沈攸之得志褚彦回當敗故言哭也列管謂簫也髙帝不悦及彬退曰彬自作此可憐可念尸著服孝子不在日代哭列管暫鳴死滅族宋時謠南史曰宋時用人乖實有謡云通典齊梁之末多以貴逰子弟為之當時諺曰上車不落為著作體中何如作秘書隋書作梁世諺為字一並作則諺語南史入闗之功鎮惡為首沈田子與鎮惡爭功武帝將歸留田子與鎮惡私謂田子語曰云云卿等十餘人何懼王鎮惡故二人常有猜心猛獸不如羣狐京邑語宋書安成公何朂臨汝公孟靈休並各奢豪以肴膳器服車馬相尚京邑語曰安成食臨汝飾諺宋書顔延之為庭誥之文引諺曰富則盛貧則病顔竣宋書曰顔竣為吏部尚書留心選舉任遇既隆奏無不可後謝莊代竣意多不行竣容貌嚴毅莊風姿甚美賔客喧訴常懽笑荅之時人語曰顔竣嗔而與人官謝莊笑而不與人官將士語宋書王𤣥謨傳曰𤣥謨性嚴刻少恩而將軍宗越御下更竒酷軍士為之語曰寧作五年徒不逢王𤣥謨𤣥謨猶自可宗越更殺我鬬塲語南史曰有恵嚴恵議道人並住東安寺學行精整為道俗所推時鬬塲寺多禪師都下為之語曰鬬塲禪師窟東安談議林石城語南史曰袁粲謀舉兵誅齊髙帝禇淵發其謀粲兵敗遇害淵獨輔政百姓語曰可憐石頭城寧為袁粲死不作褚淵生南史本傳褚淵作彦囘二王語南史曰宋徳既衰齊高帝輔政朝野之人情懐彼此吏部尚書王延之尚書令王僧䖍中立無所去就時人語曰二王居平不送不迎居齊書作持王逺蕭子顯齊書曰王孫祐父逺為光祿勲宋世為之語曰王逺如屏風屈曲從俗能蔽風露䜟南史宋武帝紀雍州刺史魯宗之負力好亂且慮不為帝容常為䜟曰云云魚登日輔帝室䜟宋書符瑞志二口建戈不能方兩金相刻凝神鋒空冗無主竒入中女子獨立又為雙老子河洛䜟二口建戈劉字也晉氏金行劉姓又有金故曰兩金相刻空宂無主竒入中為寄字女子獨立又為雙奴字按宋武帝姓劉小字寄奴上五盡寄致太平草付合成集羣英劉向䜟武帝小諱寄奴太子諱義符金雌詩大火有心水抱之悠悠百年是其時火宋之分野水宋之徳也云出而兩漸欲舉短如之何乃相岨文哉亂也當何所唯有隱巖殖禾黍西南之朋困桓父兩云𤣥字也短者云祚短也巖隱不見唯應見谷殖禾黍邉則聖諱炳明也易曰西南得朋故能困桓父也武帝名裕起兵討桓𤣥誅之齊歌永眀初歌齊書五行志曰永明初百姓歌後句閒云陶郎來白者金色馬者兵事三年妖賊唐㝢之起言虐來勞也白馬向城啼欲得城邉草東昬時百姓歌金陵志曰齊東昬侯即臺城閲武堂為芳樂苑山石皆塗以彩色跨池水立紫閣諸樓觀又於苑中立店肆以潘妃為市令于時百姓歌云閲武堂種楊桞至尊屠肉潘妃沽酒蘇小小歌一曰錢塘蘇小小歌樂府廣題曰蘇小小錢塘名倡也盖南齊時人西陵在錢塘江之西歌云西陵松柏下是也妾乘油壁車郎騎青驄馬何處結同心西陵松柏下謡永眀中虜中童謡南齊書五行志曰尋而京師人家忽生火赤于常火熱小微貴賤爭取以治病後梁以火徳興黒水流北赤火入齊南史載魏地謡言云赤火南流喪南國是嵗有沙門從北齎此火而至永元元年童謡齊書五行志曰永元元年童謡千里流者江右也東城遥光也遥光夜舉事垣厯生者烏皮袴褶徃奔之跛脚亦遥光老姥子孝字之象徐孝嗣也洋洋千里流流翣東城頭烏馬烏皮袴三更相告訴脚跛不得起誤殺老姥子永元中童謡齊五行志曰永元中童謡云云識者解云陳顯達屬豬崔慧景屬馬非也東昬侯屬豬馬子未詳梁王屬龍蕭頴胄屬虎崔慧景攻臺頓廣莫門死時年六十三烏集傳舍即所謂瞻烏爰止于誰之屋三八二十四起建元元年至中興二年二十四年也摧折景陽樓亦髙臺傾之意也言天下將去乃得休息野豬雖嗃嗃馬子空閭渠不知龍與虎飲食江南墟七九六十三廣莫人無餘烏集傳舍頭今汝得寛休但看三八後摧折景陽樓楊婆兒謡魏書齊主昭業令女巫楊氏禱祝速求天位楊氏子珉亦有美貌何氏猶愛悦之昭業呼楊氏為婆劉氏以來民間作楊婆兒歌葢為此也唐書樂志楊叛兒本童謡歌齊隆昌時女巫之子楊旻隨母入内為何后寵童謡云楊婆兒語訛遂成楊叛兒楊婆兒共戯來所歡鄉里謡南史齊受禪張敬兒厯遷車騎将軍心自疑畏誘説部曲自云貴不可言又使于鄉里為謡言使小兒軰歌云云武帝疑有異志誅之敬兒家在冠軍里宅前地名赤谷天子在何處宅在赤谷口天子是阿誰非猪如是狗山隂謡南史曰邱仲孚為山隂令居職甚有聲稱百姓為此謡前世傅琰父子沈憲劉𤣥眀相繼宰山隂並有政績二傅沈劉不如一丘諺時人語南齊書上嘉荀伯玉盡心愈見親信軍國宻事多委使之時人為之語曰十勑五令不如荀伯玉命夢語南齊書初太祖在淮南荀伯玉假還廣陵夢上廣陵城南樓上有二青衣小兒語伯玉云云伯玉視城下人頭上皆有草草中肅九五相追逐桓康語南史曰桓康蘭陵人也隨武帝起兵摧堅陷陣膂力絶人江南人畏之髙帝鎮東府除武陵王中兵寜朔将軍常侍衛左右帝誅黄囘使康數囘罪然後殺之時人語曰欲侜張問桓康長沙王語南史曰長沙威王晃髙帝四子也少有武力昇眀中為淮南宣城二郡太守晃便弓馬初沈攸之事起長沙威王晃多從武容赫奕都街時人為之語曰煥煥蕭四繖時人語南齊書永明末京邑人士盛為文章談義皆湊竟陵王西邸劉繪為後進領袖時張融音㫖緩韻周顒辭致綺㨗繪言吐又頓挫有風氣時人為之語曰云云言在二家之中也劉繪貼宅别開一門都人語南史曰永明末都下人士盛為文章談義皆湊竟陵西邸劉繪後進領袖時張融言詞辯㨗周顒彌為清綺而繪音采不贍麗雅有風則時人為之語言繪處二人間也三人共宅夾清漳張南周北劉中央俗諺南齊書顧憲之上疏言永興諸暨公私殘盡倘值水旱實不易念俗諺云云㑹稽舊稱沃壤今猶若此吳興本是瘠土因循餘弊誠宜改張㑹稽打鼔送䘏吳興步擔令史諺南史齊卞彬仕既不遂作蚤蝨賦序曰蝨有諺言朝生暮孫都下語南史齊東昬時左右應勑捉刀之徒並専國命人間謂之刀勑都下為之語曰欲求貴職依刀勑須得富豪事御刀差山語南史曰沈麟士隱居餘不吳差山講經敎授從學士數十百人各營屋宇依止其側時人為之語曰差山中有賢士開門敎授居城市一有吳字老子河洛䜟四首年厯七七水滅緒風雲俱起龍虵舉南齊書祥瑞志曰宋水徳王義熙十四年元熙二年永初三年景平二年元嘉三十年孝建三年大明八年永光二年泰始七年泰豫元年元徽昇眀三年凡七十七年故曰七七也肅草成道徳懷書備出身形法治吳出南京上即姓諱也南京南徐州治京口也墥堨河梁塞龍淵消除水災泄山川墥堨河梁為路也路即道也淵塞者譬路成也即太祖諱也消水災言除宋氏患難也上㕘南斗第一星下立草屋為紫庭迎龍之岡梧桐生鳯鳥舒翼翔且鳴南斗第一星吳分也草屋蕭字也又簫管之器像鳯鳥翼也天子何在草中宿宿肅也王子年歌三首後二首書其屋壁金刀治世後遂苦帝王昬亂天神怒災異屢見戒人主三分二叛失州主三王九江悉在吳餘悉稚小早少孤一國二主天所驅金刀劉也三分二叛宋眀帝世也三王九江者孝武于九江興晉安王亦稱大號世祖又於九江基覇跡一在吳謂齊氏桑梓寄治南吳一國二主謂太祖符運潜興為宋氏驅除㓂難三禾椮椮林茂孳金刀利刃齊刈之金刀劉氏刈剪也欲知其姓草肅肅榖中最細低頭熟鱗身甲體永興福榖道熟成又諱也太祖體有龍鱗斑駁成文始謂是黒厯治之甚至而文愈明金雄記二首鑠金作刀在龍里占睡上人相須起當復有作肅入草蕭字也記又云草門可憐乃當入建號不成易運沸梁洛陽歌南史曰大通初武帝遣飇勇将軍陳慶之送魏北海王元顥還北主轉戰而前連破魏軍慶之麾下悉着白袍所向披靡先是洛陽人歌云後果驗名軍大將莫自勞千兵萬馬避白袍梁書云洛陽童謡軍作師勞作牢始興王歌南史曰梁始興忠武王憺為都督荆州刺史時天監初軍旅之後公私匱乏憺厲精為政廣闢屯田減省力役供其窮困辭訟者皆立待符敎決於俄頃曹無留事下無滯獄後徴還朝而民歌之荆土方言謂爹為父故云始興王人之爹赴人急如水火何時復來哺乳我爹徒我反北軍歌南史曰梁臨川靜恵王宏為揚州刺史天監中武帝詔都督諸軍侵魏所領皆器甲精新軍容甚盛軍次洛口前軍尅梁城宏聞魏援近畏懦不敢進欲議還師吕僧珍曰知難而退不亦善乎桞玭等不從魏人知其不武遺以巾幗北軍乃歌云云不畏蕭孃與吕姥但畏合肥有韋武韋武叡也雍州歌南史南平王偉子恰為雍州刺史年少未嫻庶務百姓每通一辭數處輸錢方得聞徹賔客江仲舉蔡薳王臺卿庾仲容並有蓄積民間歌之後達武帝帝因接末句云江千萬蔡五百王新車庾大宅主人憒憒不如客夏侯歌梁書曰夏侯䕫為豫州刺史于蒼陵立堰溉田千餘頃境内賴之䕫兄亶先居此任兄弟並有恩恵百姓歌之我之有州賴彼夏侯前兄後弟布政優優彼一作得賴彼一作頻仍鄱陽歌南史曰陸襄吳郡人為鄱陽内史先是郡人鮮于琮反攻郡襄遣兵破之生獲琮時鄰郡按琮黨與因求貨賄皆不得其實或有善人盡室罹禍唯襄郡枉直無濫人歌之曰鮮于抄後善惡分人無横死賴陸君梁書民無横死賴有陸君抄一作平同前南史曰郡人有彭李二家先用忿爭遂相誣告襄引入内室不加責誚但和言解喻之二人感恩深自悔咎乃為設酒食令其盡歡酒罷同載而還因相親厚人又歌曰陸君政無怨家鬬既罷讐共車瞿塘行人歌南史曰庾子輿新野人有孝性丁母憂哀至輙嘔血父卒於蜀子輿哀痛將絶奉喪還鄉秋水猶壮巴東有淫預石髙出二十許丈及秋至則纔如見次有瞿塘大灘行旅忌之部伍至此石猶不見子輿撫心長呌其夜五更水忽退減安流南下及渡水復舊行人為之歌曰淫預如幞本不通瞿塘水退為庾公一作語謡北方童謡南史曰梁武帝時魏降人王足陳計求堰淮水以灌夀陽足引北方童謡曰云云帝發淮陽户丁及戰士二十萬築之以康絢督其事南起浮山北抵巉石堰成長九里髙二十丈夾堤并樹杞桞軍人安堵其上魏軍竟潰而歸水之所及方數百里魏夀陽城戍稍徙頓八公山荆山為上格浮山為下格潼沱為激溝併灌鉅野澤梁武帝時謡南史曰梁武帝天監元年十一月立長子統為皇太子時民間有謡按鹿子開者反語為來子哭也後太子果薨是時長子歡為徐州刺史以嫡孫次應嗣位而帝意在晉安王猶豫未決及立晉安王為皇太子而歡止封豫章郡王還任謡言心徘徊者未定也城中諸少年逐歡歸去來者復還徐方之象也統即昭眀太子也鹿子開城門城門鹿子開當開復未開使我心裵回城中諸少年逐歡歸去來雍州童謡南史蕭範武帝從子都督雍州刺史時論範欲為賊又童謡云然卒無驗莫怱怱且寛公誰當作天子草覆車邉已大同中童謡南史曰矦景渦陽之敗遣人求錦朝廷給之青布其後皆用為袍色尚青景乘白馬青絲為轡欲以應謡青絲白馬夀陽來侯景時童謡南史曰矦景既尅建鄴修飾臺城及朱雀宣陽等門童謡曰的脰鳥拂朱雀還與吳三國典畧作白頭鳥脱青袍著芒屩荆州天子挺應著侯景即位童謡曰江陵謡南史曰侯景既誅傳首至江陵元帝命梟于市三日然後煮而漆之以付武庫先是江陵謡言景首既至元帝付李季長宅宅東即苦竹町也既加鼎鑊即用市南氷焉苦竹町市南有好井荆州軍殺矦景梁童謡南史曰臨賀王正徳與矦景同逆百姓至聞臨賀郡名亦不欲道童謡云云寧逢五虎入市不欲見臨賀父子北童謡南史曰齊遣桞達摩領兵侵梁陳霸先命矦安都敗之達摩謂衆曰項在北童謡云云矦景服青已倒于此今吾徒衣黄豈謡言驗耶石頭擣兩襠𢷬青復𢷬黄童謡南史曰梁兵既勝齊兵中以賞俘貿酒者一人裁得一醉先是童謡虜萬夫入五湖城南酒家使虜奴梁末童謡南史曰梁末有童謡及王僧辨滅説者以為僧辨本乘巴馬以撃矦景馬上郎王字也塵謂陳也江東謂羖羊角為皁莢隋氏姓楊楊羊也言陳終滅於隋也可憐巴馬子一日行千里不見馬上郎但有黄塵起黄塵汚人衣皁莢相料理府中謡南史徐君蒨為梁湘東王鎮西諮議㕘軍頗好聲色侍妾數十皆佩金翠曵羅綺時襄陽魚𢎞亦以豪侈稱于是府中謡曰北路魚南路徐諺南州語南史曰江革為尋陽太守清嚴為屬城所憚正直自居不與典籖趙道智坐道智還都啟事誣奏革墮事好酒以瑯琊王曇聰代為行事南州士庶為之語曰故人不道智新人佞㪚騎莫知度不度新人不如故省中語南史曰賀琛領尚書左丞㕘禮儀事每進見武帝與語常移晷刻故省中語云上殿不下有賀雅琛容止閒雅故時人呼之王彬語南史曰王彬好文章習篆隸與志齊名時人為之語曰三真六草為天下寶湘東王梁元帝金樓子曰余後為江州副君賜報曰京師有語云論議當如湘東王士宦當如王克克時始為僕射領選也時人語梁書王筠與從兄泰齊名陳郡謝覽覽弟舉亦有重譽時人為之語曰謝有覽舉王有養炬炬是泰養即筠並小字也三何語二首南史曰何思澄與宗人遜及子朗俱擅文名時人語曰云云思澄聞之曰此言誤耳如不然固當歸遜思澄意謂宜在已也東海三何子朗最多人中爽爽有子朗子朗字世明有才思兩雋語南史曰何妥少聰眀時蘭陵蕭昚亦雋才住青陽巷妥住白楊頭時人為之語世有兩雋白楊何妥青陽蕭眘鮑佐語南史曰鮑正為湘東王五佐好交逰無日不適人人為之語曰無處不逢鳥噪無處不逢鮑佐䜟詩隋書五行志曰梁天監三年六月八日武帝講於重雲殿沙門誌公忽然起儛歌樂須㬰悲泣賦五言詩梁自天監至于大同三十餘年江表無事至太清二年臺城䧟帝享國四十八年所言五十裏也太清元年八月十三而矦景自懸弧來降在丹陽之北子地帝惑朱异之言以納景景之作亂始自戊辰之嵗至午年帝憂崩樂哉三十餘悲哉五十裏但看八十三子地妖災起佞臣作欺妄賊臣滅君子若不信吾言龍時矦賊起且至馬中間銜悲不見喜又南史梁武帝紀曰天監中沙門釋寶誌為詩帝使周捨封記之及中大同元年同泰寺災帝啟封捨手迹為之流涕帝生于甲辰三十八尅建鄴之年也遇災嵗實丙寅八十三矣四月十四日而火起始自浮屠第三層三者帝之昆季次也昔年三十八今年八十三四中復有四城北火酣酣又二首南史曰天監十年四月八日誌公於大㑹中作詩狗子景小字山家小兒㺅狀景遂覆䧟都邑初自懸弧來降即昔之汝南也巴陵有地名三湘景奔敗處其言皆驗掘尾狗子自發狂當死未死齧人傷須㬰之間自滅亡起自汝隂死三湘隂一作際兀尾狗子始著狂欲死不死齧人傷須㬰之間自滅亡患在汝隂死三湘横尸一旦無人藏見隋書五行與前小異山家小兒果攘臂太極殿前作虎視詩䜟隋書五行志曰天監中茅山隱士陶𢎞景為五言詩云云及大同之季公卿唯以談𤣥為務夷南平叔朝賢也矦景作亂遂居昭陽殿夷甫任㪚誕平叔坐談空不言昭陽殿忽作單于宫陳歌齊雲觀歌隋書曰陳後主造齊雲觀國人歌之功未畢而為隋師所虜齊雲觀㓂來無際畔謡陳初童謡見李商隱梁詞人麗句御路種竹篠蕭蕭已復起合盤貯蓬塊無復揚塵巳陳初謡言見梁詞人麗句日西夜鳥飛拔劍倚梁柱歸去來兮歸山下江東謡陳書曰初有童謡云云其後陳主果為韓擒虎所敗擒本名擒虎黄斑之謂也破建康之始復乘青驄馬往反時節皆相應黄斑青驄馬發自夀陽涘來時冬氣末去日春風始諺張種語陳書曰張種少恬靜居處雅正不妄交逰傍無造請時人為之語曰宋稱敷演梁則巻充清處學尚種有其風二賀歌唐書曰賀臨仁越州山隂人在陳與兄徳基師事周𢎞正以文辭稱人為語曰學行可師賀徳基文質彬彬賀徳仁北魏歌咸陽王歌北史曰後魏景明中咸陽王禧謀逆伏誅後宫人為之歌其歌遂流于江表北人之在南者聞弦管奏之莫不灑泣可憐咸陽王奈何作事誤金牀玉几不能眠夜踏霜與露洛水湛湛彌岸長行人那得渡夜踏霜與露一作夜起踏霜露裴公歌北史曰裴俠大統中為河北郡守躬履儉素愛民如子郡舊有漁獵夫三十人以供郡守俠曰以口腹役人吾所不為也悉罷之又有丁三十人供郡守役俠亦不私並收庸為市官馬嵗時既積馬遂成羣去職之日一無所取民歌之云肥鮮不食丁庸不取裴公貞恵為世規矩謡虜中謡宋書虜中謡言魏主燾甚惡之瀘水人葢吳於杏城天台舉兵反遣撃之輙敗滅虜者吳也趙郡謡北史曰後魏李曾道武時為趙郡太守令行禁止并州丁零數為山東害知曾能得百姓死力不敢入境賊於常山界得一死鹿賊長謂趙郡地也責之還令送鹿故處其見憚如此郡人為之謡詐作趙郡鹿猶勝常山粟二拔謡北史曰永煕二年竇泰破尒朱榮神武入洛尒朱仲部下都督張子期自滑臺歸命神武斬之斛斯椿由是不安乃與南陽王寶炬等搆神武于魏帝故魏帝心貳于賀抜岳初孝明之時洛下以兩拔相撃謡言云云好事者以二抜謂拓抜賀拔言俱將衰之兆銅拔打鐵拔元家世将末曲堤謡二首北史曰後魏宋世良孝荘時為清河太守才識嫺明尤善政術郡東南有曲堤成公一姓阻而居之羣盗多萃于此人為之語曰云云世良施八條之制盗奔他境人又謡曰云云寧度東吳㑹稽不厯成公曲堤曲堤雖險賊何益但有宋公自屏跡河東謡北史元淑魏宗室為河東太守俗多商賈罕事農桑淑下車勸課謡曰秦州河中杼柚代舂元公至止田疇始理洛中童謡二首北史曰尒朱彦伯節閔帝時封博陵郡王位侍中及張勸等掩襲尒朱世龍神武執彦伯與世龍同斬於閶闔門外懸首於斛斯椿門樹先是洛中謡曰云云至是並驗三月末四月初楊灰簸土覔真珠頭去項脚根齊驅上樹不須梯後魏宣武孝明時謡北史曰孝武帝永熙三年遇酖而崩初宣武孝眀間謡曰云云識者以為索謂魏本索髪焦梨狗子指宇文泰泰小字黒獺也狐非狐貉非貉焦梨狗子齧斷索東魏童謡魏紀曰孝武帝既入闗渤海王高歡議立清河王子善見以奉明帝之後是為孝靜皇帝遷都於鄴為東魏自是軍國政務皆歸相府先是童謡曰云云按青雀子謂靜帝實清河王之世子鸚鵡謂齊神武即髙歡也後竟為齊所滅可憐青雀子飛來鄴城裏羽翮埀欲成化作鸚鵡子東魏鄴都謡隋書五行志曰魏孝靜帝始移都于鄴時有童謡按孝靜帝清河王之子也后則齊神武之女鄴都宫室未備即逢禪代作窠未成之驗也孝靜尋崩文宣以后為太原長公主降於楊愔時神武婁后尚在故言寄書於婦母新婦子斥后也可憐青雀子飛入鄴城裏作窠猶未成舉頭失鄉里寄書與婦母好看新婦子東魏武定中童謡隋書五行志曰武定中有童謡按髙者齊姓也澄文襄名五年神武崩摧折之應七年文襄為盗所害澄滅之徴也百尺髙竿摧折水底然燈澄滅東魏末童謡北史齊本紀曰後魏末文宣未受禪時有童謡按藁然兩頭于文為髙河邉羖䍽為水邉羊指帝名也於是徐之才勸帝受禕一束藁兩頭然河邉羖䍽飛上天謡言北史蕭寶夤本齊眀帝子奔魏厯雍州刺史将有異圗問桞楷楷引謡言遂反被誅鸞生十子九子毈一子不毈闗中亂明帝名子鸞府君頌北史曰吕顯字子明皇始初拜鉅鹿太守清身奉公百姓頌之時惟府君克清克明緝我荒土人胥樂生願夀無疆以享長齡諺詰汾諺北史曰北魏聖武皇帝諱詰汾嘗田于山澤歘見輜軿自天而下既至見美婦人自稱天女受命相偶旦日請還期年復㑹于此言終而别及朞帝至先田處果見天女以所生男授帝曰此君之子也當世為帝王即始祖神元皇帝也故時人諺曰詰汾皇帝無婦家力微皇帝無舅家神元諱力微百姓語北史太武將北征發驢運糧使元軌部調雍州軌令驢主皆加絹一匹民語曰驢無彊弱輔脊自壯皇宗語魏書曰陽平王子欽字思若少好學早有令譽時人語曰皇宗畧畧夀安思若兄頤初名安夀衍字安樂諺魏書曰李彪領御史中丞解著作事後因求復舊職乃表修魏史引諺曰一日不書百事荒蕪三王語後魏書曰濟南王元彧與從兄安豐王延眀中山王熙齊名時人為之語曰三王楚楚盡琳琅未若濟南備圎方王家語魏書曰崔光為肅宗講孝經王道業預講安豐王延明錄義時人語曰英英濟濟王家兄弟崔楷語魏書曰楷字季則仕厯中郎将性嚴烈能摧挫豪强故時人語曰莫􅰑獬付崔楷鄉里語北史房景伯弟亡蔬食終喪朞不内御次弟景先亡㓜弟景逺亦不内寝鄉里語曰有義有禮房家兄弟鄴下語北史李渾與弟繪緯俱為聘使主緯位中㪚大夫聘梁頗為稱職鄴下語曰學則渾繪緯口則繪緯渾俗語北史邢巒仕安東将軍宣武詔巒攻鍾離巒以為必無克状且俗語云云耕則問田奴絹則問織婢貪人語後魏書曰靈太后幸左藏賜布絹儀同陳留公李崇章武王融並以所負多顛仆於地崇乃傷腰融至損脚時人為之語曰陳留章武傷腰折股貪人敗類穢我明主李波小妺語魏書曰廣平人李波宗族强盛殘掠不已公私咸患百姓為之語曰李波小妹字雍容褰裠逐馬如巻蓬左射右射必疊雙婦女尚如此男子安可逢刺史李安世設方畧誘波等殺之州内肅然楊公語魏書曰楊津行定州事賊每來攻津于城中置爐鑄鐵持以灌賊賊相語曰不畏利槊堅城惟畏楊公鐵星袁祖語北史曰祖瑩與陳郡袁翻齊名秀出時人為之語曰京師楚楚袁與祖洛陽翩翩祖與袁李謐語北史曰李謐初師事小學博士孔璠數年後璠還就謐請業同門生為之語曰青出藍藍謝青師何常在眀經中郎語三國典畧曰東魏崔暹子達拏年十三暹令儒者敎其説周易兩字乃集朝貴名流達拏升髙坐開講趙羣眭仲讓陽屈服之暹大恱擢仲讓為司徒中郎鄴下為之語解義兩行得中郎唐將語北史曰唐永有将帥才正光中為北地太守與賊數十戰未嘗敗北時人語曰莫陸梁恐爾逢唐將時人語北史大統初馮翊王元季海領軍獨孤信鎮洛陽于時人物唯桞蚪在陽城裴諏在潁川乃俱徴之以蚪為行臺郎中諏為北府屬並掌文輸時人為之語曰北府裴諏南府桞蚪瑶光寺語洛陽伽藍記曰瑶光寺世宗宣武皇帝所立永安三年中爾朱兆入洛陽縱兵大掠時有秀容胡騎數十人入寺淫穢自此後頗獲譏誚京師語曰洛陽女兒急作髻瑶光寺尼奪女壻下四條並伽藍記白墮語河東有劉白墮善釀飲之香美而醉經月不醒永熙中南青州刺史毛鴻賔齎酒之蕃路逢賊盗飲之即醉皆被擒獲㳺俠語曰不畏張弓挾刀唯畏白墮春醪伊洛語洛水南四通市伊洛之魚多于此賣士庶須膾皆詣取之魚味甚美京師語曰伊洛鯉魴貴於牛羊上髙里語洛陽城東北有上高里殷之頑民所居處也髙祖名聞義里遷京之始朝士住其中迭相譏刺竟皆去之唯有造瓦者止其内京師瓦器出焉世人語曰洛城東北上高里殷之頑民昔所止今日百姓造甕子人皆棄去住者恥京師語白馬寺漢浮屠前柰林葡萄異於餘處味並殊美帝熟時常詣取之京師語曰白馬甜榴一實直牛老嫗語河間王琛婢朝雲善吹篪能為團扇歌隴上聲琛為秦州刺史羗叛屢討不勝令朝雲假為貧女吹篪而乞羗聞之流涕曰何故捨墳井在山谷為㓂耶即降秦民語曰快馬健兒不如老嫗吹篪北齊歌鄭公歌北史鄭述祖天保中為兖州刺史述祖之父道昭嘗為兖州刺史故百姓歌之大鄭公小鄭公相去五十載風教猶尚同邯鄲郭公歌樂府廣題曰北齊後主髙緯雅好傀儡謂之郭公時人戯為郭公歌及將敗果邯鄲髙郭聲相近九十九末數也滕口鄧林也大兒謂周帝太祖子也髙岡後主姓也雉雞類武成小字也後敗於鄧林盡如歌言盖語妖也邯鄲郭公九十九技兩漸盡入滕口大兒緣髙岡雉子東南走不信吾言時當看嵗在酉崔府君歌北齊書崔伯謙除濟北太守乃改鞭用熟皮為之有朝貴過郡境問人太守治政對曰府君恩化因誦民為歌客曰既稱恩化何由復威曰長吏憚威民庶䝉恵崔府君能治政易鞭鞭布威徳民無爭謡恵化謡北齊書神武西討竇泰自潼闗入為周文帝所殺初泰捋發鄴有恵化尼謡云竇行臺去不囘泰為御史中尉童謡北齊書武明太后病内史令呼太后為石婆葢有俗忌故改名初童謡云云徐之才曰跂求伽胡言去已豹祠嫁石婆豈有好事斬冡作媒人但令合𦵏自斬冡唯得紫綖靴者紫之為字此下系經者熟當四月中靴者革旁化寧是久物至四月一日后崩周里跂求伽豹祠嫁石婆斬冡作媒人唯得一量紫綖靴北齊文宣時謡北史本紀曰文宣時謡按帝以午年生故曰馬子三臺石季龍舊居故曰石室三千六百日十年也文宣在位十年果如謡言馬子入石室三千六百日北齊廢帝時童謡三首北史曰楊愔齊文宣時尚太原公主位至驃騎大将軍文宣大漸愔與侍中燕子獻黄門侍郎鄭子黙並受遺詔時常山長廣二王位地親逼愔等與可朱渾天和深相疎忌並為所害先是童謡云羊為愔也角文為用刀道人謂廢帝小名太原公主嘗作尼故曰阿􅐣姑愔子獻天和皆尚帝姑故曰道人姑夫云白羊頭毣秃羖䍽頭生角羊羊喫野草不喫野草逺我道不逺打爾腦阿􅐣姑禍也道人姑夫死也白鳬謡北史曰初孝昭之誅楊愔也謂武成云事成以汝為皇太弟及立子百年為皇太子武成不平欲有異謀先是童謡云云時丞相府在北城中即舊中興寺也鳬翁謂雄雞盖指武成小字步落稽也道人濟南王小名也打鐘言将被撃也孝昭尋崩武帝即位中興寺内白鳬翁四方側聴聲雍雍道人聞之夜打鐘童謡北齊書曰神武穆太后凡孕六男二女皆感夢孕文襄則夢一斷龍孕文宣則夢大龍首尾屬天地張口動目勢狀驚人孕孝昭則夢蠕龍于地孕武成則夢龍浴于海孕魏二后並夢月入懐孕襄城博陵二王夢鼠入衣下后未崩有童謡云云及后崩武成緋袍如故未幾登三臺置酒作樂帝女進白袍帝怒投諸臺下帝于昆季次實九盖其徴騐也九龍母死不作孝魏世謡北齊書曰河間王孝琬武成時和士開祖珽譛之帝初魏世謡言云云珽説曰河南河北河間也金雞鳴孝琬将建金鷄而大赦帝頗惑之後竟殺焉河南種榖河北生白楊樹頭金鷄鳴謡言北齊書陽子術曰謡言云云四八天之大數主上之祚恐不過此武成崩年三十二盧十六稚十四犍子拍頭三十二武成後謡三國典畧曰周平齊齊㓜主胡太后並歸于長安初武成殂後有童謡云調甚悲苦至是應焉一云北齊太上時童謡果作藥劵作家千錢買果園中有芙蓉樹破劵不分眀蓮子隨他去北齊後主武平初童謡隋書五行志曰武平元年童謡按其年四月隴東王胡長仁謀遣刺客殺和士開事露反為士開所譛而死狐截尾你欲除我我除你武平中童謡隋書五行志曰武平二年童謡小兒唱訖一時拍手云殺却至七月二十五日御史中丞瑯琊王儼執士開送於南臺而斬之和士開七月三十日將你向南臺又謡隋書五行志曰是嵗又有童謡七月士開被誅九月琅琊王遇害十一月趙彦深出為西州刺史北史彦深引綦連猛知機事祖珽奏言前推瑯琊王有意出猛定州彦深西兖州七月刈禾傷早九月喫餻正好十月洗蕩飯甕十一月出却趙老北史云七月刈禾太早九月噉餻未好本欲尋山射虎激箭旁中趙老後主時謡北齊書曰斛律光為當時名将與祖珽穆提婆積怨周将韋孝寛忌光英勇乃作謡言令問諜漏其文於鄴曰百升云云又曰髙山云云珽因續之曰盲老公云云穆提婆聞之告其母陸令萱遂相與協謀以謡言啟後主誅光周武帝始有滅齊之志竟平其國按百升者斛也明月光字也髙山謂齊齊姓髙也盲老公謂珽珽先因罪失明也饒舌老母謂令萱即後主乳母百升飛上天眀月照長安髙山不推自崩槲木不扶自竪盲老公背上下大斧饒舌老母不得語升一作斗推一作摧髙山崩槲樹舉盲老公背上下大斧多事老母不得語北齊書祖珽傳載此鄴下童謡北史先是鄴下童謡云云和士開謂入上臺後瑯琊王送士開就臺斬之至是果驗和士開當入臺武平末童謡隋書五行志曰武平末有童謡時穆后母子滛辟干預朝政時人患之穆后小字黄花尋逢齊亡欲落之應也黄花勢欲落清尊但滿酌南史作滿盃酌後主自立穆后昬飲無度故云北齊末鄴中童謡隋書五行志曰北齊末鄴中有童謡未幾齊為周所滅周都闗中故云西家也金作掃帚玉作把淨掃殿屋迎西家諺時人語北史齊文襄入輔居鄴下崔暹崔季舒崔昻等並被任用張亮張㣲纂並為神武待遇然皆出陳元康下時人為之語曰三崔二張不如一康訛言北齊書蘭京子欽害齊王髙澄王自投傷足入于床下賊黨去床因而見殺先是訛言曰軟脱帽床底喘鳯池語北史曰趙彦深諷朝廷以子叔堅為中書侍郎頗招物議時馮子琮子慈眀祖珽子君信並相繼居中書故時語云馮祖及趙穢我鳯池時人言北史北齊武成時唐邕白建方貴時人言云并州赫赫唐與白鄙諺北齊書曰瑯琊王儼執和士開送御史臺斬之遂率京畿軍士屯千秋門帝率宿衛者将出戰斛律光曰小兒軰弄兵與交手即亂鄙諺云云至尊宜自至千秋門瑯琊必不敢動後主從之奴見大家心死親表語北史胡長粲仕趙州刺史性好内有一侍婢其妻王驕妬手刺殺之為此忿恨數年不見親表為之語曰自我不見于今三年此本詩語臺中語北齊書曰宋㳺道廣平人為殿中侍御史臺中語曰見賊能討宋逰道隂生語北齊書曰賈思伯遷南青州刺史初思伯與弟思休師事北海隂鳯受業竟無資酬之鳯遂質其衣服時人為之語及思伯之部送遺鳯因具車馬迎之時人稱歎焉隂生讀書不免癡不識雙鳯脱人衣蘇宋語北史曰宋世軌齊天保中為大理少卿執獄寛平多所全濟大理正蘇珍之以平幹知名時人以為二絶寺中語曰決定嫌疑蘇珍之視表見裏宋世軌蘇珍之北齊書蘇瓊字珍之為廷尉正京師為之語曰斷決無疑蘇珍之陸乂語北史陸乂於五經最精熟館中謂之石經人語曰五經無對有陸乂時人語北史北齊裴讓之與弟諏之及皇甫和弟亮並知名于洛下時人語曰諏勝於讓和不如亮祖裴語三國典畧曰裴讓之十七舉秀才為屯田郎中與祖珽俱聘宋邢邵省中語曰多竒多能祖孝徴能賦能詩裴讓之裴讓之北史讓之魏天平中舉秀才累遷屯田主客郎中省中語曰能賦詩裴讓之陽休之好學愛文藻時人為之語曰能賦詩陽休之崔李語隋書曰武城崔儦與頓丘李若俱見稱重時人為之語曰齊人後入隋京師灼灼崔儦李若䜟詩二首北史陸法和本傳曰法和書其所居屋壁而塗之及剝落有文二首十年天子為尚可百日天子急如火周年天子迭代坐隋書五行志曰時文宣帝享國十年而崩廢帝嗣立百餘日用替厥位孝昭即位一年而崩此其驗也一母生三天兩天共五年婁太后生三天子自孝昭即位至武成傳位後主共五年北周歌周宫歌隋書五行志曰周宣帝與宫人夜中連臂蹋蹀而歌云云帝即位二年崩自知身命促秉燭夜行逰謡周初童謡隋書五行志曰周初有童謡按靜帝隋氏之甥既遜位而崩諸舅强盛白楊樹頭金鷄鳴祗有阿舅無外甥祗一作裁玉漿泉謡隋書曰豆盧勣周武帝時為渭州刺史有恵政華夷悦服大致祥瑞鳥䑕山俗呼為髙武隴其山絶壁千尋由來乏水諸𦍑苦之勣馬足所踐忽飛泉湧出有白鳥翔止㕔前乳子而後去民為之謡後因號其泉曰玉漿泉我有丹陽山出玉漿濟我民夷神鳥來翔民夷一作夷人翔一作出諺裴漢語周書裴漢補墨曹参軍漢善尺牘尤便簿領理識眀贍決斷如流相府為之語曰日下粲爛有裴漢于公語隋書曰于仲文字次武北周時為遷安太守州刺史屈突尚宇文䕶之黨也先坐事下獄無敢繩者仲文至郡窮治遂竟其獄蜀中為之語曰眀斷無雙有于公不避强禦有次武隋歌枯樹歌北史曰王劭隋文帝時為著作郎上表言符命曰陳留老子祠有枯柏世傳云老子将度世云待枯柏生東南枝迴指當有聖人出吾道復行至齊枯柏從下生枚東南上指夜有三童子相與歌曰云云及至尊牧亳州親至祠樹之下自是柏枝回抱其枯枝漸指西北道敎果行考校衆事太平主出于亳州陳留之地皆如所言老子廟前古枯樹東南枝如繖聖主從此去枝隋書作狀長白山歌北史曰來整榮國公䕶兒之子也尤驍勇善撫御射撃羣賊所向皆㨗諸賊歌之長白山頭百戰塲十十五五把長鎗不畏官軍十萬衆只怕榮公第六郎十一作千挽舟者歌海山記曰煬帝御龍舟夜半聞歌者甚悲帝遣人求之不得我兒征遼東餓死青山下今我挽龍舟又困隋堤道方今天下饑路糧無些小前去三千程此身安可保寒骨枕荒沙幽䰟泣煙草悲損門内妻望斷吾家老安得義男兒爛此無主屍引其孤䰟囘負其白骨歸送别詩崔瓊束虚記曰此詩作于大業末年實指煬帝巡㳺無度搢紳瘁怳已甚下逮閭閻而佞人曲士播弄威福欺君上以取榮貴上二句盡之又謂民財窮窘至是方有五子之歌之憂而望其返國也楊桞青青着地埀楊花漫漫攪天飛桞條折盡花飛盡借問行人歸不歸謡煬帝時并州童謡北史曰漢王諒反為楊素所敗幽死先是童謡曰云云時偽署官告身皆一紙别授則二紙諒聞謡喜曰我㓜字阿客量與諒同音吾于皇家最小以為應之一張紙兩張紙客量小兒作天子大業中童謡隋書五行志曰煬帝大業中童謡其後李宻坐楊𤣥感之逆為吏所拘在路逃叛潜結羣盗自陽城山而來襲破洛口倉後復屯兵苑内莫浪語宻也宇文化及自號許國尋亦破滅誰道許者葢驚疑之辭也桃李子鴻鵠遶陽山宛轉花林裏莫浪語誰道許杞州謡北史隋侍御史桞彧上表論上柱國和于子前在趙州闇于職務政由羣小賄賂公行百姓吁嗟歌謡滿道乃云老禾不早殺餘種穢良田童謡北史梁主蕭琮自江陵徴入朝拜柱國後有童謡云云煬帝忌之遂廢于家蕭蕭亦復起諺長安語北史曰崔𢎞度隋仁夀中為太府卿性嚴酷官屬百王莫敢欺隱時有屈突盖為武侯車騎亦嚴刻長安為之語曰寧飲三斗醋不見崔𢎞度寧灸三斗艾不逢屈突葢樊安定語隋書曰樊叔畧陳留人仕周封清鄉縣公隋受禪進爵安定郡公相州刺史政為當時第一百姓為之語曰智無窮清鄉公上下正樊安定貝州語隋書庫狄士文授貝州刺史法令嚴肅吏人股戰有京兆韋焜為貝州司馬河東趙達為清河令二人並苛刻唯長史有恵政時人為之語曰云云上聞而歎曰士文之㬥過于猛獸竟坐死刺史羅刹政司馬蝮虵瞋長史含笑判清河生喫人諸生語北史吕思禮東平夀張人年十四受學於徐遵明長于論難諸生為之語曰講書論易鋒難敵釋奴龍子隋書曰盧昌衡小字龍子風神澹雅容止可法博涉經史工草行書從弟思道小字釋奴宗中俱稱英妙故幽州為之語曰盧家千里釋奴龍子鄙諺隋書曰長孫平為工部尚書時有人告大都督邴紹非毁朝廷者上怒将斬之平進諫曰鄙諺曰云云此言雖小可以喻大上于是赦紹不癡不聾未堪作大家翁北史作不堪前諺隋書冀州俗重氣俠好結朋黨故班志述其上風悲歌慷慨椎剽掘冡亦自古之所患焉前諺云仕宦不偶遇冀部語隋書魏郡鄴都所在浮巧成俗雕刻之工特云精妙士女被服咸以奢麗相髙其所尚習得京洛之風矣語曰云云斯皆輕狡所致魏郡清河天公無奈何古樂苑巻四十九
