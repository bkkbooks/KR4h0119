body:
  text: 古樂苑卷二十六明梅鼎祚編清商曲辭江南弄上雲樂江南弄七首古今樂録曰梁天監十一年冬武帝改西曲製江南上雲樂十四曲江南弄七曲一曰江南弄二曰龍笛曲三曰採蓮曲四曰鳯笛曲五曰採菱曲六曰遊女曲七曰朝雲曲又沈約作四曲一曰趙瑟曲二曰秦箏曲三曰陽春曲四曰朝雲曲亦謂之江南弄云梁武帝江南弄古今樂録曰江南弄三洲韻和云陽春路娉婷出綺羅衆花雜色滿上林舒芳耀緑垂輕隂連手躞蹀舞春心舞春心臨歲腴中人望獨踟蹰龍笛曲古今樂録曰龍笛曲和云江南音一唱直千金馬融長笛賦曰近世雙笛從羌起羌人伐竹未及已龍鳴水中不見已截竹吹之聲相似然則龍笛曲蓋因聲如龍鳴而名曲美人綿眇在雲堂雕金鏤竹眠玉牀婉愛寥亮繞紅梁繞紅梁流月臺駐狂風鬱徘徊紅疑作虹採蓮曲古今樂録曰採蓮曲和云採蓮渚窈窕舞佳人此首與採菱曲英華並作吳均郭從玉臺遊戲五湖採蓮歸發花田葉芳襲衣為君豔歌世所希世所希有如玉江南弄採蓮曲鳯笙曲古今樂録曰鳯笙曲和云弦吹席長袖善留客緑耀尅碧雕琯笙朱唇玉指學鳯鳴流速參差飛且停飛且停在鳯樓弄嬌響間清謳採菱曲古今樂録曰採菱曲和云菱歌女解佩戲江陽江南稚女珠腕繩金翠搖首紅顔興桂棹容與歌采菱歌采菱心未怡翳羅袖望所思遊女曲古今樂録曰遊女曲和云當年少歌舞承酒笑氛氲蘭麝體芳滑容色玉耀眉如月珠佩婐𡛖戲金闕戲金闕遊紫庭舞飛閣歌長生朝雲曲古今樂録曰朝雲曲和云徙倚折耀華宋玉髙唐賦序曰楚襄王與宋玉遊雲夢之臺望髙唐之觀獨有雲氣變化無窮王問玉曰此何氣也玉曰所謂朝雲也王曰何謂朝雲也玉曰昔者先王嘗遊髙唐怠而晝寢夢見一婦人曰妾巫山之女也為髙唐之客聞君遊髙唐願薦枕席王因幸之去而辭曰妾在巫山之陽高丘之阻旦為朝雲暮為行雨朝朝暮暮陽臺之下旦朝視之如言故為立廟號曰朝雲酈道元水經注曰巫山者帝女居焉宋玉謂帝之季女名曰瑶姬未行而亡封于巫山之臺精魂為草實謂靈芝所謂巫山之女髙唐之姬也朝雲曲蓋取於此張樂陽臺歌上謁如寢如興芳暗曖容光既豔復還沒復還沒望不來巫山髙心徘徊江南弄三首玉臺新刻英華樂府並作昭明今從藝文梁簡文帝江南曲和云陽春路時使佳人度枝中水上春併歸長楊掃地桃花飛清風吹人光照衣光照衣景將夕擲黃金留上客龍笛曲和云江南弄真能下翔鳯金門玉堂臨水居一嚬一笑千萬餘遊子去還願莫踈願莫踈意何極雙鴛鴦兩相憶採蓮曲和云採蓮歸渌水好沾衣桂楫蘭橈浮碧水江花玉面兩相似蓮踈藕折香風起香風起白日低採蓮曲使君迷江南弄四首梁沈約趙瑟曲英華作元帝邯鄲竒弄出文梓縈弦急調切流徴玄鶴徘徊白雲起白雲起鬱披香離復合曲未央秦箏曲羅袖飄纚拂雕桐促柱髙張散輕宫迎歌度舞遏歸風遏歸風止流月壽萬春歡無歇陽春曲劉向新序宋玉對楚威王問曰客有歌於郢中者其始曰下里巴人國中屬而和者千人其為陽阿採薇國中屬而和者數百人其為陽春白雪國中屬而和者數十人而已也引裔刻角雜以流徵國中屬而和者不過數人是以其曲彌髙其和彌寡然則陽春所從來亦逺澤樂府解題曰陽春傷也楊柳垂地燕差池緘情忍思落容儀弦傷曲怨心自知心自知人不見動羅裙拂珠殿朝雲曲陽臺氤氲多異色巫山高高上無極雲來雲去長不息長不息夢來遊極萬世度千秋江南弄雜擬採蓮曲二首後首本採蓮賦中歌姑從郭本收入梁簡文帝晚日照空磯採蓮承晚暉風起湖南度蓮多摘未稀棹動芙蓉落船移白鷺飛荷絲傍繞腕菱角逺牽衣常聞蕖可愛採擷欲為裙葉滑不留綖心忙無假薰千春誰與樂唯有妾隨君同前亦是採蓮賦中歌並非樂府元帝碧玉小家女來嫁江南王蓮花亂臉色荷葉雜衣香因持薦君子願襲芙蓉裳同前劉孝威金槳木蘭船戲採江南蓮蓮香隔浦渡荷葉滿江鮮房垂易入手柄曲自臨盤露花時濕釧風莖乍拂鈿同前朱超豔色前後發緩楫去來遲看粧礙荷影洗手畏菱滋摘除蓮上葉拖出藕中絲湖裏人無限何日滿船時同前沈君攸平川映曉霞蓮舟泛浪華衣香隨岸逺荷影向流斜度手牽長柄轉楫避踈花還船不畏滿歸路詎嫌賖曉一作晚同前二首後首初學記作元帝題云賦得涉江采芙蓉吳均錦帶雜花鈿羅衣垂緑川問子今何去出採江南蓮遼西三千里欲寄無因緣願君早旋返及此荷花鮮江南當夏清桂楫逐流縈初疑京兆劒復似漢冠名荷香帶風逺蓮影向根生葉卷珠難溜花舒紅易傾日暮鳬舟滿歸來度錦城夏一作夜楫一作棹同前陳後主相催暗中起粧前日已光隨宜巧注口薄落點花黃風佳疑衫密船小畏裾長波文散動楫菱花拂度航低荷亂翠影採袖新蓮香歸時會被喚且試入蘭芳同前隋盧思道曲浦戲妖姬輕盈不自持擎荷愛圓水折藕弄長絲珮動裙風入粧消粉汗滋菱歌惜不唱須待暝歸時同前殷英童蕩舟無數伴解纜自相催汗粉無庸拭風裙隨意開棹移浮荇亂船進倚荷來藕絲牽作縷蓮葉捧成杯採菱歌七首宋鮑照騖舲馳桂浦息棹偃椒潭簫弄澄湘北菱歌清漢南一作弄弦瀟湘北歌菱清漢南弭榜搴蕙荑停唱紉薰若含傷拾泉花縈念採雲蕚睽濶逢暄新悽怨值妍華秋心殊不那春思亂如麻秋心殊不那一作秋心不可蕩要豔雙嶼裏望美兩洲間裊裊風出浦沈沈日向山沈沈一作溶溶煙曀越嶂深箭迅楚江急空抱琴心悲徒望弦開泣心一作中弦開一作近關緘歎凌珠淵收慨上金堤春芳行歇落是人方未齊思今懷近憶望古懷逺識懷古復懷今長懷無終極採菱曲齊陶功曹朝日映蘭澤乘風入桂嶼棹影已流倡輕舟復容與勿遽佳期移方追明月侣采采詎盈掬還望空延佇同前梁簡文帝菱花落復含桑女罷新蠶桂棹浮星艇徘徊蓮葉南同前陸罩參差雜荇枝田田競荷密轉葉任香風舒花影流日戲鳥波中蕩遊魚菱下出不與文王嗜羞持比萍實同前費昶妾家五湖口采菱五湖側玉面不關粧雙眉本翠色日斜天欲暮風生浪未息宛在水中央空作兩相憶同前江淹秋日心容與涉水望碧蓮紫菱亦可採試以緩愁年參差萬葉下泛漾百流前髙彩隘通壑香氛麗廣川歌出棹女曲舞入江南弦乘黿非逐俗駕鯉乃懷仙衆美信如此無恨在清泉氛一作氣棹一作趙在一作出同前二首藝文作江淹江洪風生緑葉聚波動紫莖開含花復含實正待佳人來白日和清風輕雲雜髙樹忽然當此時採菱復相遇同前徐勉相㩦及嘉月採菱渡北渚微風吹棹歌日暮相容與采采不能歸望望方延佇儻逢遺佩人預以心相許陽春歌一作曲宋吳邁逺百里望咸陽知是帝京邑緑樹搖雲光春城起風色佳人愛華景流靡園塘側妍姿豔月映羅衣飄蟬翼宋玉歌陽春巴人長歎息雅鄭不同賞那令君愴惻生平重愛惠私自憐何極同前齊檀約青春獻初歲白日映雕梁蘭萌猶自短柳葉未能長已見紅花發復聞緑草香乘此試遊衍誰知心獨傷乘一作樂同前梁吳均紫苔初泛水連綿浮且沒若欲歌陽春先歌青樓月同前陳顧野王春草正芳菲重樓啓曙扉銀鞍俠客至柘彈婉童歸池前竹葉滿井上桃花飛薊門寒未歇為斷流黃機同前隋柳辨春鳥一囀有千聲春花一叢千種名旅人無語坐簷楹思鄉懷土志難平唯當文共酒暫與興相迎坐一作出陽春曲無名氏芣苡生前徑含桃落小園春心自搖蕩百舌更多言上雲樂古今樂録曰上雲樂七曲梁武帝製以代西曲一曰鳯臺曲二曰桐柏曲三曰方丈曲四曰方諸曲五曰玉龜曲六曰金丹曲七曰金陵曲又有老胡文康辭隋書樂志曰梁三朝第四十四設寺子導安息孔雀鳯凰文鹿胡舞登連上雲樂歌舞伎鳯臺曲古今樂録曰鳯臺曲和云上雲真樂萬春鳳臺上兩悠悠雲之際神光朝天極華蓋遏延州羽衣昱耀春吹去復留桐柏曲古今樂録曰桐柏曲和云可憐真人遊桐柏真升帝賓戲伊谷遊洛濱參差列鳯管容與起梁塵望不可至徘徊謝時人方丈曲方丈上崚層雲挹八玉御三雲金書發幽會碧簡吐玄門至道虛凝冥然共所遵方諸曲古今樂録曰方諸曲三洲韻和云方諸上可憐歡樂長相思方諸上上雲人業守仁摐金集瑶池步光禮玉晨霞蓋容長嘯清虛伍列真玉龜曲古今樂録曰玉龜曲和云可憐遊戲來玉龜山真長仙九光耀五雲生交帶要分影太華冠晨纓耉如玄羅出入遊太清耉一作夀金丹曲古今樂録曰金丹曲和云金丹會可憐乘白雲紫霜耀絳雪飛追以還轉復飛九真道方微千年不傳一傳裔雲衣金陵曲勾曲仙長樂遊洞天巡會迹六門揖玉板登金門鳯泉回肆鷺羽降尋雲鷺羽一流芳芬鬱氛氲上雲樂古今樂録曰周捨作或曰范雲梁周捨西方老胡厥名文康遨遊六合傲誕三皇西觀濛泛東戲扶桑南泛大蒙之海北至無通之鄉昔與若士為友共弄彭祖扶牀往年暫到崑崙復值瑶池舉觴周帝迎以上席王母贈以玉漿故乃壽如南山志若金剛青眼貿貿白髮長長蛾眉臨髭髙鼻垂口非直能俳又善飲酒簫管鳴前門徒從後濟濟翼翼各有分部鳳皇是老胡家雞獅子是老胡家狗陛下撥亂反正再朗三光澤與雨施化與風翔覘雲候吕志遊大梁重駟修路始屆帝鄉伏拜金闕仰瞻玉堂從者小子羅列成行悉知廉節皆識義方歌管愔愔鏗鼓鏘鏘響震鈞天聲若鵷皇前却中規矩進退得宫商舉技無不佳胡舞最所長老胡寄篋中復有竒樂童齎持數萬里願以奉聖皇乃欲次第説老耄多所忘但願明陛下壽千萬歲歡樂未渠央樂童疑作樂章簫史曲藝文作張華詩紀云此詩辭格不類晉人宋鮑照簫史愛少年嬴女希童顔火粒願排棄霞霧好登攀龍飛逸天路鳯起出秦關身去長不返簫聲時往還少一作長霞霧好登攀一作霞好忽登攀逸一作竟同前齊張融引響猶天外吟聲似地中戴勝噪落景龍噴清霄風同前陳江總弄玉秦家女簫史仙處童來時兔月滿去後鳯樓空密笑開還斂浮聲咽更通相期紅粉色飛向紫煙中滿一作照方諸曲陳謝燮望仙室仰雲光繩河裏扇月傍井公能六著玉女善投壺瓊醴和金液還將天地俱梁雅歌古今樂録曰梁有雅歌五曲三朝樂第十五奏之梁張率應王受圖曲應王受圖荷天革命樂曰功成禮云治定恩𢎞庇臣念昭率性乃眷三才以宣八政愧無則哲臨淵自鏡或戒面從永隆福慶郭茂倩云李白曰梁雅歌有五篇作君道曲按梁無君道曲疑應王受圖曲也臣道曲孝義相化禮讓為風當官無媚司民必公謙謙君子謇譽匪躬諒而不訐和而不同誡之誡之去驕思沖𢎞兹大雅是曰至忠積惡篇積惡在人猶鴆處腹鴆成形亡惡積身覆殷辛再離溫舒五族責必及嗣財豈潤屋斯川既往逝命不復鏡兹餘殃幸修多福積善篇惟德是輔皇天無親抱獄歸舜捨財去邠豚魚懷信行葦留仁先世有作餘慶方因鳴玉承家錫圭于民連城非重積善為珍宴酒篇記稱成禮詩詠飽德卜晝有典厭夜不忒彛酒作民樂飲虧則腐腹遺喪濡首亡國誓彼六馬去兹三惑占言孔昭以求溫克古樂苑卷二十六
