body:
  text: 古樂苑衍録卷三明梅鼎祚編歷代名氏評論辨解上古白帝子皇娥唐堯被衣許由虞舜臯陶八伯夏禹五子關龍逢殷微子箕子伯夷周太王季厯文王武王成王穆王周公旦尹伯奇商陵牧子琴操舊附今從之魯孔子曽參陶嬰伯姬保母次室女衛衛女宋華元韓憑妻齊田齊寧戚晏嬰杞梁妻犢沐子一作牧犢子馮歡楊朱莊周子輿附晉士蒍優施介子推舟之僑女娟燕荆軻楚優孟申包胥漁父扈子商梁卞和接輿孺子王子越人附吳申叔儀紫玉越越王夫人采葛婦秦始皇帝百里奚屠門高琴女西楚項籍垓下之歌出自流離煮豆之詩成於草率命辭慷慨並自奇工談藝録虞美人伯牙以下世次未詳樗里牧恭祝牧漢西漢東漢蜀漢附高帝姓劉氏諱邦字季沛豐邑中陽里人初為亭長起兵破秦滅楚平定天下由漢王即皇帝位國號曰漢十二年崩羣臣尊號曰高皇帝高祖尚武戲儒簡學雖禮律草創詩書未遑然大風鴻鵠之歌亦天縱之英作也文心雕龍大風安不忘危其霸心之存乎秋風樂極悲來其悔心之萌乎文中子藝苑巵言云二語去孔子不逺高祖大風之歌雖止於二十三字而志氣慷慨規模宏達凜凜乎巳有四百年基業之氣史記樂書謂之三侯章令沛得以四時歌舞宗廟蓋欲使後之子孫知其祖創業之勤不可怠於守成爾武帝秋風辭瓠子歌巳無足道及為賦以傷悼李夫人反覆數百言綢繆眷戀於一女子其視高祖豈不愧哉集丹陽漢高帝大風歌不特華藻而氣槩逺大真英主也至武帝秋風辭言固雄偉而終有感慨之語故其末年幾至於變魏武魏文父子橫槊賦詩雖遒壯抑揚而乏帝王之度六朝以後人主言非不工而纖麗不逞無足言也庚溪詩話大風三言氣籠宇宙張千古帝王赤幟高帝哉藝苑巵言武帝諱徹景帝子在位五十四年孝武崇儒潤色鴻業禮樂爭輝辭藻競騖柏梁展朝宴之詩金堤製恤民之詠文心雕龍秋風起兮白雲飛出自大風起兮雲飛揚蘭有秀兮菊有芳懷佳人兮不能忘出自沅有芷兮澧有蘭思公子兮未敢言漢武讀書故有沿襲漢高不讀書多出已意詩家直説李夫人詩是邪非邪立而望之偏僕因曰此則退之走馬來看立不正之所祖述也許彥周詩話漢武故是詞人秋風一章幾於九歌矣思李夫人賦長卿下子雲上是邪非邪三言精絶落葉哀蟬疑是􅎓作幽蘭秀菌的為傳語藝苑巵言昭帝諱弗陵武帝子在位十三年趙幽王友高帝子初封淮陽王吕太后殺趙王如意徙友為趙王朱虛侯章齊悼惠王次子吕太后元年入宿衛封文帝二年以誅諸吕功封城陽王淮南王安厲王長子文帝時封為淮南王好書鼓琴招致賓客方術之士後為反謀事覺帝使宗正以符節治安未至安自刑燕剌王旦武帝第四子李姬生廣陵厲王胥武帝第五子李姬生廣川王去繆王齊太子罪徙國除西京雜記作去疾四皓皇甫謐高士傳曰四皓者皆河內軹人或在汲一曰東園公二曰角里先生三曰綺里季四曰夏黃公陳留志云園公姓唐字宣明居園中因以為號夏黃公姓崔名廣字少通齊人隱居夏里修道故號曰夏黃公甪里先生河內軹人太伯之後姓周名術字元道京師號曰霸上先生一曰甪里先生孔父祕記作祿里會稽續志黃公乃里人晉夏統言黃公為鄞越人崔廣一作廓園公一作名秉襄邑人綺里一作姓朱名暉字文季姓氏書綺里姓季字又一作綺李霍去病大將軍衛青姊子善騎射再從大將軍為票姚校尉封冠軍侯後為驃騎將軍大司馬東方朔字曼倩平原厭次人事孝武帝為郎司馬相如字長卿成都人以訾為郎事孝景帝為武騎常侍後武帝召為郎以辭賦得幸常有消渴病既免家居茂陵史稱其多識博物蔚為辭宗賦頌之首李陵字少卿為騎都尉天漢中將步卒五千擊胸奴轉鬭矢盡遂降虜以女妻之立為右校王在胸奴卒李延年中山人故倡也坐法腐刑給事狗監中善歌為新變聲所造詩謂之新聲曲女弟李夫人得幸於武帝延年由是貴為協律都尉楊惲字子幼宣帝時人以兄忠任為郎霍氏謀反惲先以聞封平通侯遷中郎將與太僕戴長樂相失長樂上書告惲罪免為庶人後坐怨望誅楊惲報孫會宗書初無甚怨怒之語其詩曰田彼南山蕪穢不治種一頃豆落而為萁張晏釋以為言朝廷荒亂百官諂諛可謂穿而廷尉當以大逆無道刑及妻子豫熟味其辭獨有所謂君父至尊親送其終也有時而既蓋宣帝惡其君喪送終之喻耳莊助論汲黯輔少主守成武帝不怒實係於一時禍福云賈誼劉向論説痛切無忌諱文成二帝未嘗問焉容齋四筆唐山夫人高帝姬唐山姓西漢樂章可齊三代舊見漢禮樂志房中樂十七章格韻高嚴規模簡古駸駸乎商周之頌縱使竹竿載馳方之陋矣劉元城語録安世歌質古文雅詩譜或曰唐山夫人房中樂歌何如曰是直可以繼關睢不當以章句摘也曰曹孟德月明星稀嵇叔夜目送歸鴻何如曰此直後世四言耳工則工矣比之三百篇尚隔尋丈也丹鉛餘録唐山夫人雅歌之流調短弱未舒耳藝苑巵言漢書律厯志引古文尚書豫欲聞六律五聲八音七始詠以出納五言今文七始詠作在治忽史繩祖據漢郊祀歌七始華始肅倡和聲而以今文在治忽近於傅會以豫考之此言聲律音詠是一類事但漢書注不注七始之義今之切韻宫商角徵羽之外又有半商半徵蓋牙齒舌喉脣之外有深喉淺喉二音此即所謂七始詠詠即韻也汗簡隸古七始作夾始蓋古文七作忝夵與夾相近而誤尤可驗史氏之説為是由此言之切韻之法自舜世巳然不起于西域胡僧又可知豫特表出之孟康云七始者天地四時人也此説乃意料之言孟丹鉛閏録正揚云本志自明謂注無七始之義康意料之言俱誤七始華始安世房中歌也云郊祀歌又誤戚夫人高帝夫人烏孫公主名細君江都王建女華容夫人燕主夫人趙飛燕本長安宫人屬陽阿主家學歌舞號曰飛燕成帝過主作樂見而説之召入大幸為倢妤後立為后顓寵十餘年卒班倢妤左曹越騎校尉況之女少有才學成帝選入宫以為倢妤後趙飛燕譖其咒詛考問之上善其對遂求供養太后長信宫帝崩充奉園陵薨因葬園中倢妤詩其源出于李陵團扇短章辭旨清捷怨深文綺得匹婦之致侏儒一節可以知其工矣詩品團扇二篇江則假象見意班則貌題直書至如出入君懷袖動搖微風發常恐秋節至涼飈奪炎熱旨婉詞正有潔婦之節但此兩對亦可以掩映江生江生詩曰畫作秦王女乘鸞向煙霧興生於中無有古事假使佳人玩之在手乘鸞之意飄然莫偕雖蕩如夏姬自忘情改節吾許江生情逸詞麗方之班女亦未可減價皎然詩評王昭君名嬙漢宫人元帝時胸奴入朝以嬙配之號寧胡閼氏韋孟詩雅之變也昭君歌風之變也三百篇後二作得體梁太子不取昭君何哉詩家直説卓文君司馬相如妻靈帝諱宏河間孝王曽孫先封解瀆亭侯桓帝薨竇武迎立在位二十二年東平憲王蒼光武子少好經書嘗與公卿共議定制度及廟歌佾舞𢎞農王辨靈帝子立為帝為董卓所廢鴆死馬援字文淵扶風茂陵人建武時為伏波將軍征交趾封新息侯後征武陵蠻卒于軍梁鴻字伯鸞平陵人家貧而尚節介與其妻孟光隱居霸陵山中因東出關適吳依大家臯伯通著書十王吉虎賁郎班固字孟堅顯宗時除蘭臺令史遷為郎後遷玄武司馬以母憂去官永元初大將軍憲黨捕死獄中傅毅字仲武扶風茂陵人為蘭臺令史拜郎中與班固賈逵共典校書張衡字平子南陽西鄂人拜為郎中遷太史令侍中宦官懼其毁已共讒之出為河間王相徵拜尚書卒陶淵明間情賦必有所自乃出張衡同聲歌云邂逅承際會偶得充後房情好新交接揚慓若探湯願思為莞席在下蔽匡牀願為羅衾幬在上衛風霜西溪叢語邊讓章華臺賦歸乎生風之廣厦兮修黃軒之要道攜西子之弱腕援毛嬙之素肘注云黃帝軒轅氏得房中之術於素女握固吸氣還精補腦留年益齡長生忘老張平子詩明燈巾粉卸設圖衾枕張素女為我師天老教軒皇升菴集下同張衡同聲歌灑掃清枕席鞮芬以狄香鞮履也狄香外國之香也謂以香薰履也近刻狄香作秋香謬李尤字伯仁廣漢雒人官諌議大夫樂安相王逸字叔師南郡宜城人為校書郎終侍中蔡雍字伯喈陳圉人建寧中辟司徒橋玄府出補河平長召拜郎中校書東勸遷議郎靈帝崩董卓為司空辟雍遷尚書侍中及卓被誅王允收付廷尉死獄中唐妃𢎞農王妃蔡琰字文姬雍之女也博學有才辨適河東衛仲道夫亡無子興平中天下喪亂姬為胡騎所獲沒於南胸奴左賢王在胡中十二年生二子曹操痛雍無嗣乃遣使者以金璧贖之重嫁陳留董祀竇玄妻辛延年宋子侯孟集有到得重陽日還來就菊花之句刻本脫一就字有擬補者或作醉或作賞或作泛或作對皆不同後得善本是就字乃知其妙唐詩亦有之崔皓玉壺清酒就君家李郢詩聞説故園香稻熟片帆歸去就鱸魚杜工部詩題有秋日泛江就黃家命子而古樂府馮子都詩有就我求清酒青絲係玉壺就我求珍肴金盤鱠鯉魚則前人已道破矣升菴集白狼王唐菆諸葛亮字孔明琅琊人從先主為軍師後為丞相封武鄉侯建興十二年北征卒于渭濱李善陸詩注蔡雍琴頌云梁父悲吟不知名為梁父吟何義張衡四愁詩云欲往從之梁父艱注云泰山東嶽也君有德則封此山願輔佐君王致於有德而為小人讒邪之所阻梁父泰山下小山名諸葛亮好為梁父吟恐取此意西溪叢語龎德公南郡襄陽人隱居峴山之南未嘗入城府司馬德操年小十嵗兄事之故呼龎德公魏武帝名操字孟德沛國譙人漢舉孝廉為郎厯位丞相封魏王後其子丕代漢追諡曰武皇帝廟號太祖魏書云太祖創造大業文武並施御軍三十餘年手不釋書晝則講武策夜則思經傳登高必賦及造新聲被之管絃皆成樂章曹公古直甚有悲涼之句睿不如丕亦稱三祖詩品魏武魏文父子橫槊賦詩雖遒壯抑揚而乏帝王之度庚溪詩話曹孟德樂府如苦笑行猛虎行短歌行膾炙人口久矣其希僻罕傳者若不戚年往憂世不治存亡有命慮之為蚩又云壯盛智慧殊不再來愛時進趣將以惠誰不惟句法高邁識趣近於有道升菴詩話王處仲每酒後輒詠老驥伏櫪志在千里烈士暮年壯心不巳以如意打唾壺口盡缺世説新語古人語自有稚拙不可掩者樂府曰何以銷憂惟有杜康宋景文公筆記魏武帝短歌行全用鹿鳴四句不如蘇武鹿鳴思野草可以喻佳賓點化為妙沈吟至今可接明明如月何必小雅哉蓋以養賢自任而牢籠天下也真西山不取此篇當矣詩家直説魏武帝善哉行七解魏文帝煌煌京洛行五解全用古人事實不可泥於詩法論之詩家直説魏武帝樂府精列篇云造化之陶物莫不有終期聖賢不能免何為懷此憂願螭龍之駕思想崑崙居見欺於迂怪志意在蓬萊周孔聖徂落會稽以墳丘陶陶誰能度君子以弗憂魏文帝折楊柳歌云彭祖稱稱百悠悠安可原老􅔶適西戎於今竟不還王僑假虛辭赤松乘空言達人識真偽愚夫好妄傳追念往古事憒憒千萬端百家多迂怪聖道我所觀二詩不信仙術闢其怪誕誠知道守正之言也録丹鉛餘漢武帝樂府東臨碣石以觀滄海水何淡淡山島疏峙秋風蕭瑟洪波湧起日月之行若出其中星漢燦爛若出其裏其辭亦有本相如上林云視之無端察之無涯日出東沼月生西陂馬融廣城云天地虹洞因無端涯大明出東月生西陂揚雄校獵云出入日月天與地沓然覺揚語奇武帝語壯又月生西陂語有何致而馬融復襲之藝苑巵言文帝諱丕字子桓太祖長子八嵗能屬文為五官中郎將立為魏太子太祖薨嗣位為丞相魏王稱受漢禪即帝位魏文之才洋洋清綺舊談抑之謂去植千里然子建思捷而才俊詩麗而表逸子桓慮詳而力緩故不競於先鳴而樂府清越典論辨要迭用短長亦無懵焉但俗情抑揚雷同一響遂令文帝以位尊減才思王以勢窘益價未為篤論也文心雕龍子桓小藻自是樂府本色藝苑巵言明帝名睿文帝子魏明帝樂府晝作不停手猛燭繼望舒晉庾闡藏􅍐賦督猛炬以增明從因朗而心隔猛炬猛燭蓋大燭大炬也周禮所謂墳燭楚辭所云懸火也杜詩銅盤燒蠟光吐日其猛蠟乎談苑醍醐陳思王植字子建太祖子十嵗餘誦讀詩論及辭賦數十萬言善屬文建安十六年封平原侯尋徙封臨災文帝即位立為鄄城王明帝太和中徙東阿加封陳王薨諡曰思子建才敏於父兄然不如其父兄質漢樂府之變自子建始藝苑巵言謝安壻王國寶專利無檢行安惡其人每抑之武帝末年寶讒諛之計稍行嫌隙遂成帝召桓伊飲宴謝安侍坐帝令伊吹笛伊神色無忤乃放笛云臣於箏分乃不及笛臣有一奴善相便串乃許召之奴既吹笛伊便撫箏而歌曰為君既不易為臣良獨難忠信事不顯乃有見疑患周旦佐文武金縢功不刋為心輔王政二叔反流言其聲慷慨俯仰可觀安泣下沾襟乃越席而就之埒其鬚曰使君於此不凡帝甚有愧色晉書詩不能受瑕工拙之間相去無幾頓自絶殊如塘上行云莫以賢豪故棄捐素所愛莫以魚肉賤棄捐蔥與薤莫以麻枲賤棄捐管與蒯浮萍篇則曰茱萸自有芳不若桂與蘭新人雖可愛無若故所歡本自倫語然佳不如塘上行談藝録洛神賦王右軍大令各書數十本當是晉人極推之耳清徹圓麗神女之流陳王諸賦皆小言無及者然此賦始名感甄又以蒲生當其塘上際此忌兄而不自匿諱何也蒲生實不如塘上令洛神見之未免笑子建傖父耳藝苑巵言七哀詩起曹子建其次則王仲宣張孟陽也釋詩者謂病而哀義而哀感而哀悲而哀耳目聞見而哀口歎而哀鼻酸而哀謂一事而七者具也子建棄之七衷哀在於獨棲之思婦仲宣之七哀哀在於子之婦人張孟陽之七哀哀在於巳毁之園寢唐雍陶亦有七哀詩所謂君若無定雲妾作不動山雲行出山易山逐雲去難是皆以一哀而七者具也韻語陽秋曹植詩鬭雞東郊道走馬長楸間陳沈炯邊馬有歸心詩彌意長楸道金鞍背落暉杜子美玉腕騮詩頓驂飄赤汗局蹐顧長楸畫馬圖詩霜蹄蹴踏長楸間苕溪漁隱云文選注古人種楸於道故曰長楸間録復齋謾厯陽郭次象多聞嘗與僕論唐酒價郭謂前輩引老杜詩速令相就飲一斗恰有三百青銅錢以此知當時酒價然白樂天與劉夢得沽酒間飲詩曰共把十千沽一斗相看七十欠三年當劉白之時酒價何太不廉哉僕謂不然十千一斗乃詩人寓言此曹子建樂府中語耳唐人引此甚多如李白詩曰金樽沽酒斗十千王維詩曰新豐美酒斗十千崔輔國詩云與沽一斗酒恰用十千錢許渾詩云十千沽酒留君醉權德輿詩云十千斗酒不知貴陸龜蒙詩云若得奉君歡十千沽一斗唐人言十千一斗類然一斗三百錢獨見子美所云故引以定當時之價然詩人所言出於一時又未知果否一斗三百別無可據唐食貨志云德宗建平三年禁民酤以佐軍費置四釀酒斛收直三千此可驗乎又觀楊松玠談藪北齊盧思道嘗云長安酒賤斗價三百杜詩引此亦未可知僕因謂郭曰曽知漢酒價否郭無以應僕謂漢酒價每斗一千郭謂出於何書僕曰此見典論云考靈帝末年百司湎酒一斗直千文此可證也王壄野客叢書古書不可妄改聊舉一端如曹子建名都篇膾鯉臇胎蝦寒鱉炙熊膰此舊本也五臣妄改作炮鱉文選李善注云今之時餉謂之寒蓋韓國饌用此法鹽鐵論羊淹雞寒崔駰傳亦有雞寒曹植文寒鶬蒸麑劉熙釋名韓雞為正古字韓與寒通也鱉丹鉛餘録按丹鉛此論誠為有據然詩有云炮膾鯉炮亦通曹子建詩明珠交玉體珊瑚間木難注引南越志云木難金翅鳥沫所成碧色珠也大秦國珍之按其形色則今夷方所謂祖母緑也升菴集王粲字仲宣山陽高平人有異才漢獻帝西遷因徙居長安後之荆州依劉表表卒曹操辟為丞相掾賜爵關內侯拜侍中王仲宣從軍詩館宇充廛里士女滿莊􅠤自非聖賢國誰能享兹休􅠤音求九交之道也字從九從酋為是話升菴詩陳琳字孔璋廣陵人避難冀州袁紹使典文章後歸太祖與阮瑀並為司空軍謀祭酒管記室軍國書檄多琳瑀所作也阮瑀字元瑜陳留人少受學于蔡雍曹操辟為司空軍謀祭酒管記室後為倉曹掾屬建安十七年卒樂府往往敘事故與詩殊蓋敘事辭緩則穴不精翩翩堂前燕疊字極促乃佳阮瑀駕出北郭門視孤兒行大緩弱不逮矣談藝録劉楨字公幹東平人太祖辟為丞相掾屬太子嘗宴諸文學酒酣命夫人甄氏出拜坐中咸伏楨獨平視太祖聞之乃收治罪減死輸作署吏建安二十二年卒應瑒字德璉汝南人漢泰山太守劭之從子也魏太祖辟為丞相掾屬轉平原侯庶子後為五官中郎將文學建安二十二年卒繁欽字休伯潁川人文才朴辨長於書記又善為詩賦為丞相主簿建安二十三年卒繆襲字熙伯東海蘭陵人有才學官至侍中尚書光祿勳厯魏四世左延年晉書樂志曰黃初中左延年以新聲被寵焦先字孝然河東人也常食白石以分與人熟煮如芋食之日日出山伐薪以施人及魏受禪眉河之湄結草為菴獨止其中太守董經往視之不肯語經益以為賢或忽老忽少後與人別去不知所適嵇康字叔夜譙郡銍人好言老莊而尚奇任俠寓居山陽貧鍛以自給拜中散大夫山濤為吏部舉康自代康答書言不堪流俗非薄湯武大將軍司馬昭聞之而怒以鍾會譖殺之阮籍字嗣宗陳留尉氏人司空記室瑀之子容貌壞傑志氣宏放初辟太尉掾進散騎常侍大將軍司馬昭欲為其子炎求婚籍乃醉六十日不得言而止後引為從事中郎籍聞步兵厨多美酒遂求為步兵校尉縱酒昏酣遺落世事又對人能為青白眼由是禮法之士深所讎疾大將軍常保持之甄皇后魏文帝后餘詳塘上行注塘上之作朴茂真至可與紈扇白頭姨姒甄既摧折而芳譽不稱良為可歎藝苑巵言莫以豪賢故棄捐素所愛莫以魚肉賤棄捐蔥與薤莫以麻枲賤棄捐菅與蒯其語意妙絶千古稱之然左傳逸詩巳先道矣云雖有絲麻無棄菅蒯雖有姬薑無棄蕉萃藝苑巵言蹶船常苦沒黃河中行舟常有此患俗云著淺説文艐船著沙不行也尚書大傳云三艐國名亦在黃河側甄后此句正北方之語特表出之而搜音颼古本楚辭風颯颯兮木搜搜今本作蕭音亦叶颼故此詩亦作蕭蕭又作翛翛總不若搜搜字之古也甄后中山無極人為魏文帝后其後為郭嬪譖賜死臨終作此詩魏明帝初為王時納虞氏為妃及即位毛氏有寵而黜虞氏卞太后慰勉之虞氏曰曹氏自好立賤未有能以令終殆必由此亡國矣其後郭夫人有寵毛后愛弛亦賜死魏之兩世家法如此虞氏亡國之言良是詩可以觀不獨三百篇也元人傳奇以明帝為跳槽俗語本此話升菴詩吳孫皓字元宗一名彭祖大皇帝孫也景帝崩皓嗣位為晉所滅封歸命侯韋昭字𢎞嗣吳郡雲陽人本名昭史為晉諱改名曜少好學能屬文仕孫吳官至中書僕射職省為侍中常領左國史撰吳書皓欲父和作紀曜執以和不登帝位宜為傳皓以此責怒收曜付獄誅之晉僭國附宣帝姓司馬諱懿字仲達河內溫縣人仕魏厯事武帝文帝明帝後輔齊王為太傅相國封公孫炎受魏禪追尊為宣帝廟號高祖荀勗字公曽潁川人初辟大將軍曹爽掾武帝受禪封濟北郡公領著作祕書監大康中遷尚書令張華字茂先范陽人晉武帝受禪以為黃門侍郎贊伐吳有功封廣武侯遷尚書後進為侍中中書監加封公元康六年拜司空與趙王倫孫秀有隙為所害成公綏字子安東郡白馬人也少有俊才詞賦甚麗張華雅重綏薦為太常博士厯祕書郎遷中書郎每與華受詔並為詩賦泰始九年卒傅玄字休奕北地泥陽人博學善屬文舉秀才晉王時為常侍及受禪進爵為子武帝初置諫官以玄為之遷侍中轉司𨽻校尉免官卒於家追封清泉侯諡曰剛傅玄豔歌行全襲陌上桑但曰天地正厥位願君改其圖蓋欲辭嚴義正以禆風教然使君自有婦羅敷自有夫巳含此意不失樂府本色詩家直説玄又有日出東南隅一篇汰去精英竊其常語尤有可厭者本詞使君自有婦羅敷自有夫於意巳足綽有餘味今復益以天地正位之語正如低措大記舊文不全時以巳意續貂罰飲墨水一斗可也巵藝苑言皇甫謐字士安安定朝那人博綜典籍沈靜寡欲有高尚之志以著述為務自號玄晏先生郡國舉辟皆不行武帝頻下詔敦逼之謐上表辭太康三年卒陸機字士衡吳郡人大司馬抗之子也少有奇才領父兵為牙門將吳亡入洛太傅楊駿辟為祭酒纍遷太子洗馬著作郎出補吳王郎中令入為尚書郎趙王倫輔政引為參軍大安初成都王穎等起兵討長沙王乂授機後將軍河北大都督因戰敗績為孟玖譖殺陸機謝靈運之詩並祖曹子建故其森蔚璀瑋大率相似自今觀之陸於謝稍為平正他不多辨讀鞠歌行見矣陸云德不孤兮必有鄰唱和之契冥相因譬如虬虎兮來風雲亦如形聲影響陳心歡賞兮嵗易淪玉藏彩疇識真叔牙顯夷吾親郢既沒匠寢斤覽古籍信伊人永言知巳感良辰識云朝雲升應龍攀乘風逺遊騰雲端鼓鐘歇豈自歡急弦高張思和彈時希值年夙愆循巳雖易人知難王陽登貢公歡罕生既沒國子歎嗟千載豈虛言邈矣逺念情悄然鐘嶸詩品謂陸尚規矩不貴綺錯謝尚巧似逸蕩過陳思蓋得之矣學者才不逮謝亦惟仰法乎陸庶乎厭飫膏澤固不失於張公之歎大才也蘭莊詩話凡詩人之作刺針美頌各有源流未嘗混雜善惡同篇也陸機為齊謳篇前敘山川物産風教之盛後章忽鄙山川之情殊失厥體其為吳趨行何不陳子光夫差乎京洛行何不述赧王靈帝乎顔氏家訓潘尼字正叔少與從父嶽俱以文章知名舉秀才為太常博士纍拜太子舍人出為宛令入補尚書郎齊王冏起義兵引為參軍事平封安昌公厯中書令永嘉中遷太常卿左思字太沖齊臨淄人也徵為祕書郎齊王冏命為記室辭疾不就以疾終張翰字季鷹吳郡人有清才縱任不拘時人號為江東步兵齊王冏辟為東曹掾夏侯湛字孝若譙國人幼有盛才文章宏富善搆新詞泰始中舉賢良拜郎中後轉尚書郎出為野王令惠帝即位為散騎常侍元康初卒石崇字季倫渤海人年二十餘為城陽太守伐吳有功封安陽鄉侯纍遷侍中出為南中郎將荆州刺史領南蠻校尉致富不資後拜太僕衛尉有愛妓緑珠孫秀使人求之不得遂勸趙王倫誅族其家石季倫王明君辭云延我於穹廬加我閼氏名閼氏單于妻也上烏前切下章移切前漢胸奴傳曰冒頓後有愛閼氏生少子顔注閼氏胸奴皇后號劉貢父云胸奴單于號其妻閼氏耳顔便以皇后解之大俚俗也西河舊事云失我祁連嶺使我六畜不蕃息失我焉支山使我婦女無顔色蓋北方有焉支山山多紅藍北人採其花染緋取其英鮮者作胭脂婦人粧時用作頰色殊鮮明可愛胸奴名妻閼氏言可愛如胭脂也錢昭度作王昭君詩云閼氏才聞易妻名歸期長似俟河清誤讀氏字為姓氏之氏矣藝苑雌黃孫楚字子荆太原中都人少負才氣多陵傲初為石苞驃騎參軍初至長揖曰天子命我參卿軍事因此搆隙湮廢積年後扶風王駿起為征西參軍遷衛軍司馬惠帝初拜馮翊太守卒劉琨字越石中山人少以雄豪著名永嘉初為并州刺史建興二年加大將軍都督并州三年進司空四年其長史以并州叛降石勒琨遂奔薊段匹磾因與結婚約以共戴晉室元帝渡江復加太尉封廣武侯後其子羣與匹磾有隙遂被害諡曰愍楊方字公回少好學有異才司徒王導辟為掾轉東安太守遷司徒參軍事補高梁太守後熊甫王敦參軍梅陶明帝時為尚書謝尚字仁祖陳郡人纍遷尚書僕射出督江淮厯陽揚豫諸軍事進號鎮西將軍卒於厯陽孫綽字興公統之弟博學善屬文為著作佐郎纍遷散騎常侍轉廷尉卿領著作卒王獻之字子敬羲之子少有盛名而高邁不羈風流為一時之冠起家州主簿祕書丞拜中書令卒王珣字元琳導之孫桓溫辟為主簿纍遷尚書令曹毗字輔佐譙國人善屬詞賦纍遷至光祿勳王廞司徒左長史沈玩車騎將軍陶淵明字元亮入宋名潛潯陽柴桑人太尉長沙公侃之曽孫少有高趣親老家貧起為州祭酒不堪吏職解歸躬耕自資隆安中為鎮軍參軍義熙元年遷建威參軍未幾求為彭澤令在縣八十餘日解歸暨入宋終身不仕顔延年誄之諡曰靖節徵士不立文字見性成佛之宗達磨西來方有之陶淵明時未有也觀其自祭文則曰陶子將辭逆旅之館永歸於本宅其擬挽詩則曰有生必有死早終非命促其作飲酒詩則曰採菊東籬下悠然見南山此中有真意欲辨巳忘言其形影神三詩皆寓意高逺蓋第一達磨也而老杜乃謂淵明避俗翁未必能達道何耶東坡諗陶子自祭文云出妙語於纊息之餘豈涉生死之流哉蓋深知淵明者韻語陽秋詩曰覯閔既多受侮不少此無意於對也十九首云胡馬嘶北風越鳥巢南枝屬對雖切亦自古老六朝惟淵明得之若荒草何茫茫白楊亦蕭蕭是也詩家直説王嘉字子年隴西安陽人清虛服氣不與世人交遊石季龍之末至長安潛隱於終南山苻堅纍徵不赴公侯巳下咸躬往參詣及姚萇入長安禮嘉如苻堅故事後因事為萇所害苻登聞嘉死設壇哭之贈太師諡文定公湛方生張駿字公庭西涼牧張實之世子幼而奇偉十嵗能屬文後嗣位大都督大將軍涼州牧西平公趙整字文業一名正雒陽清水人或曰濟隂人年十道八仕偽秦遷黃門侍郎武威太守後出家更名整張奴詳歌下緑珠石崇妾翔風石崇婢謝芳姿桃葉王獻之妾宋孝武帝姓劉諱駿字休龍文帝第三子封武陵王元凶劭弒逆舉兵誅劭遂即大位在位十一年宋武帝丁都護歌云都護北征時儂亦惡聞許願作石尤風四面斷行旅又云都護北征去相送落星墟帆檣如芒柳都護今何渠唐人用丁都護及石尤風事皆本此二辭絶妙宋武帝征伐武略一代英雄而復風致如此其殆全才乎楊升菴詞品郎士元留盧秦卿詩云知有前期在難分此夜中無將故人酒不及石尤風打頭逆風也行舟遇之則不行此詩意謂行舟遇逆風則住故人置酒而以前期為辭是故人酒不及石尤風矣語意甚工近日吳中刻唐詩不解石尤風為何語遂改作古淳風可笑又可恨也升菴詩話正揚云宋武帝丁都護歌云願作石尤風四面斷行旅似非打頭風也徐幹室思曰浮雲何洋洋願因通我辭一逝不可歸嘯歌久踟蹰人離皆復會我獨無反期自君之出矣明鏡暗不治思君如流水何有窮巳時宋孝武帝擬之曰自君之出矣金翠暗無精思君如日月回環晝夜生一時諸賢共賦遂以為題楊仲𢎞謂五言絶乃古詩末四句所以意味悠長蓋本於此直詩家説明帝諱彧文帝第十一子厯封湘東王殺廢帝而自立江夏王義恭武帝桓美人所生也元嘉中為司徒建武三年為太宰為廢帝所殺後諡曰文獻南平王鑠字休玄文帝第四子未弱冠擬古三十餘首時人以為亞迹陸機然負才狡競孝武殺之汝南王隨王誕王韶之字休泰偉之之子晉義熙中除著作郎復補通直郎領西省事武帝受命加驍騎將軍少帝時出為吳郡太守徵為祠部尚書加給事中何承天東海郯人博通古今尤精厯數仕宋領著作郎官至御史中丞顔延之字延年琅琊臨沂人性疏淡不護細行而文章冠絶當時初為宋公豫章世子參軍及公即帝位補太子舍人廬陵王待之甚厚執政以其搆扇異同因帝崩出為始安太守文帝元嘉三年徵為中書侍郎未幾復出守永嘉孝武登阼以為金紫光祿大夫卒贈特進諡曰憲延之與陳郡謝靈運俱以辭采齊名而遲速懸絶文帝嘗各勑擬樂府北上篇延之受詔便成靈運久之乃就南史本傳謝莊字希逸𢎞微之子仕文帝時為隨王誕記室遷太子中庶子孝武立除侍中厯吏部都官尚書左衛將軍加給事中又領參軍將軍明帝時加金紫光祿大夫謝靈運陳郡陽夏人以祖父並葬始寧縣遂移籍會稽晉孝武時襲封康樂公纍遷黃門侍郎時宋公位相國以為從事中郎遷世子左衛率及宋受禪降爵為侯起為散騎常侍轉太子左衛率武帝崩出為永嘉太守在郡辭歸始寧文帝登祚徵為祕書監遷侍中未幾復稱疾歸好尋山陟險會稽太守孟顗表其有異志帝惜其才授臨川內史復為有司所糾徙廣州尋以事詔就廣州棄市年四十九謝靈運樂府皆模放陸平原而作源流見矣李空同謝惠連丹陽尹方明之子十嵗能屬文元嘉元年為彭城王法曹參軍年三十七卒鮑照一作昭字明逺東海人文詞贍逸尤長於樂府始謁臨川王義慶貢詩言志擢為國侍郎遷秣陵令文帝選為中書舍人上方以文章自高頗多忌由是賦述不敢盡其才後臨海王子頊鎮荆州以為前軍參軍時江外諸王皆拒命子頊敗遂遇害鮑明逺才健其詩乃選之變體李太白專學之如腰鎌刈葵藿倚杖牧雞豚分明説出箇倔強不肯甘心之意如疾風衝塞起砂礫自飄揚馬毛縮如蝟角弓不可張分明説出邊塞之狀語又俊健朱文公明逺行路難壯麗豪放若決江河詩中不可比擬大似賈誼過秦論許彥周詩話鮑照詩秋霜曉驅鴈春雨暗成虹佳句也杜子美詩朔風驅胡鴈慘淡帶沙礫之句本此又楊休之洛陽伽藍記有北風驅鴈千里飛雲之語庾信詩秋風驅亂螢句亦奇甚升菴集鮑照苦熱行含沙射流影吹蠱痛行暉南中畜蠱之家蠱昏夜飛出飲水之光如曳彗所謂行暉也文選注行暉行旅之暉非也升菴集吳邁逺好為篇章宋文帝聞而召之及見曰此人聯絶之外無所復有好自誇而蚩鄙他人每作詩得稱意語輒擲地呼曰曹子建何足數哉孔寧子仕文帝時為鎮西咨議參軍以文義見賞後遷黃門侍郎領步兵校尉袁淑字陽源陳郡陽夏人少有風氣博涉多通元嘉中彭城王起為祭酒纍遷尚書吏部郎轉御史中丞再遷太子左衛率元凶將行弒逆呼淑與蕭斌同力諫不從遂遇害孝武立贈侍中太尉諡曰忠獻顔師伯竣族兄也初隨孝武為徐州主簿帝踐阼纍遷侍中吏部尚書廢帝立與柳元景謀廢立伏誅顔竣字士遜延之之子也初隨孝武為撫軍主簿及踐阼纍遷吏部尚書諫諍懇切下獄賜死臧質字含文東管莒人厯江州刺史以生擒元凶封始興郡公後與南譙王義宣謀反兵敗被誅何偃字仲𢎞廬江人元嘉中位太子中庶子孝武時纍遷吏部尚書遷侍中卒荀昹字茂祖元嘉初以文義至中書郎殷淡字夷逺陳郡長平人厯黃門吏部郎太子中庶子步兵校尉大明中以文章見知為當時才士虞和餘姚人少居貧好學明帝時厯中書令湯惠休字茂逺初入沙門名惠休孝武命使還俗本姓湯位至揚州刺史沈攸之字仲達吳興武康人仕厯都督荆州刺史順帝時舉兵反敗誅孔欣以下爵里無考南朝孔欣樂府云相逢狹路間道狹正踟蹰輟步相與言君行欲焉如淳朴久巳散榮利迭相驅流落尚風波人情多遷渝勢集堂必滿運去庭亦虛競趨嘗不暇誰肯顧桑樞未若及初九攜手歸田廬躬耕東山畔樂道讀玄書狹路安足遊方外可寄娛此詩高趣可並淵明欣早嵗辭榮不負其言矣詩升菴話伍緝之袁伯文許瑶詩品有齊朝詠許瑶之又云許長於短句物或即此也王歆之尋陽漁父鮑令暉詩品曰齊鮑令暉歌詩往往嶄絶清巧擬古猶勝唯百願淫矣昭常答孝武云臣妹才自亞於左芬臣才不及太沖耳華山畿女齊高帝姓蕭氏諱道成字紹伯仕宋封齊王廢宋自立武帝諱頤字宣逺高帝長子初仕宋為江州刺史輔高帝受禪功參佐命後嗣位估客樂齊武帝之所作也其辭曰昔經樊鄧役阻潮梅根渚感意追往事意滿辭不敘阻潮一本作假楫武帝作此曲令釋寶月被之管絃帝遂數乘龍舟遊江中以紝越布為帆緑絲為帆縴鍮石為篙足篙傍者悉著鬱林布作淡黃袴舞此曲用十六人云按史稱齊武帝節儉常自言朕治天下十年當使黃金與土同價然其從流忘返之奢如此貽厥孫謀何怪乎金蓮布地也褚淵字彥回河南陽翟人仕宋厯中書監司空齊高帝立以佐命功進位司徒侍中封南康郡公王儉字仲寶琅琊臨沂人仕宋厯吏部郎侍中齊高帝立改封南昌縣公纍遷中書令國子祭酒諡文憲徐孝嗣字始昌東海郯人也尚宋康樂公主拜駙馬都尉入齊纍遷侍中封枝江縣公東昏失德將謀廢立事覺召入華林省飲藥死王融字元長琅琊人僧達之孫也少警慧博涉多通仕齊武帝遷祕書丞厯中書郎竟陵王子良板為寧朔將軍武帝大漸謀立子良及鬱林郎位下獄賜死王融巫山高煙華乍卷舒行芳時斷續今本行芳作猿鳥猿鳥字逺不及行芳也升菴詩話謝朓字玄暉宋僕射景仁之從孫少有美名齊隨王子隆鎮荆州以為文學未幾求還都除新安王記室尋兼尚書殿中郎宣城王鸞輔政以為驃騎咨議掌中書詔誥轉中書郎出補宣城太守後遷至吏部郎兼衛尉永元初江祏謀立始安王遙光引以為黨不從下獄死謝玄暉鼓吹曲凝笳翼高蓋疊鼓送華輈李善注徐引聲謂之凝小擊鼓謂之疊岑參凱歌鳴笳攂鼓擁回軍急引聲謂之鳴疾擊鼓謂之攂凝笳疊鼓吉行之文儀也鳴笳攂鼓師行之武備也詩人之用字不茍如此觀者不可草草升菴詩話劉繪字士章彭城人雅麗有風則初為齊高帝行參軍歷位中書郎竟陵王開西邸繪為後進領袖梁武起兵朝廷以繪持節督四州軍事東昏殞城內遣繪及范雲送首詣梁王轉大司馬從事中郎卒虞炎會稽人永明中以文學與沈約俱為文惠太子所遇意盻殊常官至驃騎將軍檀約秀才以下四人附見謝朓集江奐朝請陶功曹失名朱孝廉失名謝超宗陳郡陽夏人靈運之孫好學有文辭盛得名舉仕宋厯通直常侍齊太祖拔為驃騎咨議及即位轉黃門郎有司奏立郊廟歌詔司徒禇淵等十人並作超宗辭獨見用世祖初詔徙廣州至豫章自盡張融字思光吳郡人仕宋至儀曹郎入齊纍遷司徒兼右長史卒孔稚圭字德章會稽山隂人少學涉有美譽高帝為驃騎取為記室參軍建武初遷冠軍將軍遷太子詹事散騎常侍卒稚圭風韻清疏好文詠與外兄張融情趣相得居宅盛營山水憑几獨酌傍無雜事門庭之內草茅不剪陸厥字韓卿吳郡人慧曉仲孫也少有風槩好屬文五言詩體甚新州舉秀才少傅主簿遷行參軍永元元年始安王反厥父間被誅感慟而卒朱碩仙朱子尚釋寶月梁武帝姓蕭氏諱衍字叔達初仕齊纍遷隨王鎮西咨議參軍後討東昏而自立四傳五十五年梁氏帝王武帝簡文為勝湘東次之武帝之莫愁簡文之烏棲大有可諷餘篇未免割裂且佻浮淺卞建業江陵之難故不虛也昭明鑒裁有餘自運不足藝苑巵言梁武帝作白紵舞辭四句令沈約改其辭為四時白紵之歌帝辭云朱絃玉柱羅象筵飛管促節舞少年短歌留目未肯前含笑一轉私自憐嗟乎麗矣古今當為第一也許彥周詩話梁武帝江南弄云衆花雜色滿上林舒芳耀彩垂輕隂連手􅞃蹀舞春心舞春心臨嵗腴中人望獨踟蹰此辭絶妙填辭起於唐人而六朝巳濫觴矣其餘若美人聯錦江南稚女諸篇皆是樂府具載不盡録也升菴詞品昭明太子諱統字德施武帝長子也生而聰睿讀書數行並下每遊宴祖道賦詩皆屬思便成無所點易寬和容衆接引才俊喜文章聚書至三萬餘卷著述甚多年三十一薨簡文帝諱綱字世纘武帝第三子也六嵗能屬文讀書十行俱下辭藻豔發雅好賦詩然文傷輕靡時號宫體初封晉安王雲麾將軍丹陽尹厯兖荆南徐雍益五州刺史昭明太子薨立為皇太子及嗣位之後侯景制命期年遇弒元帝諱繹字世誠武帝第七子也初封湘東王為會稽太守入為侍中丹陽尹出為使持節都督荆州刺史鎮西將軍侯景反逆遣王僧辨討誅之遂即位於江陵西魏見伐兵敗出降為梁王察所害邵陵王綸武帝第六子也聰穎博學尤長尺牘為潁州刺史侯景搆逆加征討大都督率衆討景不克死武陵王紀字世詢一字大智武帝第八子也少勤學有文才屬辭不好輕華甚有骨氣天監中封武陵郡王揚州刺史轉益州刺史侯景亂紀不赴援僭號於蜀改元天正明年衆潰為元帝將樊猛所殺沈約字休文吳興武康人宋泰始中蔡興宗引為安西記室參軍入齊為太子家令纍遷吏部郎出為東陽太守明帝徵為五兵尚書及梁武受禪以佐命功除僕射厯尚書令侍中封建昌侯加特進卒諡曰隱江淹字文通濟陽考城人弱冠以五經授宋始安王劉子真為南徐州新安王從事奉朝請始安薨舉南徐州桂陽王秀才轉建平王主簿雅以文章見遇及王移鎮朱方又為鎮軍參軍領柬海郡丞王欲舉兵淹以為諷乃黜為吳興令齊高帝始置史館命淹掌之纍遷御史中丞明帝時出為宣城太守還為祕書監兼衛尉入梁為散騎常侍遷金紫光祿大夫卒諡曰憲范雲字彥龍南鄉舞隂人初為齊竟陵王府主簿厯始興內史遷廣州刺史免官少與梁武帝友善及武帝平建業以雲為黃門郎與約同心翊贊遷散騎常侍吏部尚書卒諡曰文任昉字彥升樂安博昌人雅善屬文尤長載筆沈約一代詞宗深所推挹仕齊為竟陵王記室參軍司徒長史武帝踐阼拜黃門侍郎掌著作出為義興太守轉御史中丞出為新安太守為政清省吏民便之丘遲字希範烏程人靈鞠之子在齊以秀才纍遷殿中郎梁武帝平建業引為主簿及踐阼遷中書郎出為永嘉太守還拜中書侍郎後遷司空從事中郎張率字士簡吳郡人年十二能屬文稍進作賦頌至年十六向二千許首起家齊著作佐郎遷尚書殿中郎太子洗馬武帝霸府建引為相國主簿嘗為待詔賦武帝手勑曰相如工而不敏枚臯速而不工卿兼之矣遂遷祕書丞後遷黃門侍郎出為新安太守卒孝經緯曰酒者乳也梁張率對酒詩如花良可貴似乳更堪珍杜子美山城乳酒下青雲本此柳惲字文暢河東解人也少有志學工為詩善尺牘齊竟陵王引為法曹參軍纍遷太子洗馬試守鄱陽相還除驃騎從事中郎武帝至京邑惲候謁石頭以為冠軍征東府司馬天監初除長史纍遷左民尚書廣州刺史徵為祕書監復為吳興太守為政清靜民吏懷之感疾卒王僧孺東海郯人七嵗能讀十萬言家貧嘗傭書以養母寫畢即諷誦仕齊為太學博士纍遷尚書左部郎出為南康王長史蘭陵太守王錫字公嘏琅琊人梁武令與張纘入宫與昭明為師友纍遷吏部郎中王規字威明琅琊人儉之孫騫之子在武帝時纍遷太子中庶子領步兵校尉張纘字伯緒𢎞策子仕祕書郎遷太子舍人歷寧蠻校尉為嶽陽王察所執兵敗害之殷鈞一作均字季和陳郡長平人歷東宫學士國子祭酒庾肩吾字子慎新野人八嵗能賦詩初為晉安王常侍王為太子兼通事舍人除安西湘東二王録事參軍纍遷中庶子初簡文帝在藩雅好文士肩吾亦預其選簡文即位肩吾為度支尚書侯景矯詔遣肩吾喻當陽公大心尋舉州降肩吾因逃赴江陵未幾歷江州刺史領義陽太守卒吳均字叔庠吳興故章人也好學有俊才天監初柳惲為吳興召補主簿日引與賦詩均文體清拔有古氣好事者效之謂為吳均體建安王引為記室尋為國侍郎還除奉朝請奉詔撰通史未就而卒何遜字仲言東海郯人承天曽孫也天監中起家奉朝請遷建安王水曹參軍王愛文學日與宴遊及遷江州遜猶掌書記復為安西安成二王參軍事兼尚書水部郎除廬陵王記室復隨府江州未幾而卒銅爵妓云曲終相顧起日暮松柏聲句殊雄古而顔黃門謂其每病辛苦饒貧寒氣無乃太貶乎東觀餘論蕭子範字景則齊高帝之孫豫章王嶷之子永明中封岐陽侯拜太子洗馬梁天監初位司徒主簿纍遷南平王從事中郎復為臨賀王長史簡文即位召為光祿大夫蕭子顯字景暢子範弟好學工屬文七嵗封定都縣侯梁天監初遷邵陵王友除黃門郎兼侍中國子祭酒武帝愛其才以為吏部尚書為吳興太守蕭子雲字景喬子顯弟齊建武四年封新浦縣侯梁天監初遷丹陽郡丞大通三年復遷臨川內史還除散騎常侍歷侍中國子祭酒出為東陽太守性沈靜不樂仕進風神間曠任性不羣侯景亂奔晉陵卒王籍字文海琅琊臨沂人博涉有才氣為任昉沈約所稱賞天監中除安成王主簿歷餘姚錢塘令並以放免除湘東王參軍隨府會稽郡還為中散大夫王訓字懷範暕長子幼聰警有識量文章之美為後進領袖為宣城王文學官至侍中王泰字仲通琅琊人僧虔之孫慈之子梁天監中為祕書丞歷中書侍郎又為廷尉卿遷吏部尚書王筠字元禮一字德柔琅琊人僧虔之孫楫之子幼清靜好學與從兄泰齊名歷仕尚書殿中郎纍遷太子洗馬中書舍人與殷鈞並以方雅為昭明太子所禮王筠楚妃吟句法極異其辭云窗中曙閨花早飛林中明鳥早歸庭中日暖春香氣亦霏霏嬌香氣漂蘭當軒清唱調輕獨顧慕裙含怨復含蝶飛復熏裊裊風入翠春可遊率歌聲梁上浮華春遊方有樂短沈沈下羅幕大六朝人詩風情致若作長句即是辭也宋人長短句雖盛而其究皆有曲詩曲論之弊終非辭之本色升菴詞品王筠詠征婦裁衣行路難其略云裲襠雙心共一抹袙腹兩邊作八撮襻帶雖安不忍縫開孔才穿猶未達胸前却月兩相連本照君心不照天數句敘裁衣曲折纖微如出縫婦之口詩至此可謂細密矣遺詩話補段成式漢上題襟集與溫庭筠倡和詩章皆務用僻事其中一絶云柳煙梅雪隱青樓殘日黃鸝語未休見説自能裁袙腹不知誰更著帩頭按梁王筠詩詠裁衣有云裲襠雙心共一抹袙腹兩邊作八撮襻帶雖安不忍縫開孔裁穿猶未達袙腹者今之裹肚也羅敷行云少年見羅敷脫帽著帩頭菴升集劉孝綽字孝綽本名冉彭城人七嵗能屬文梁天監初起家為著作佐郎遷祕書丞甚為武帝及昭明所禮纍遷尚書吏部郎坐事左遷臨賀王長史卒孝綽雖負才陵忽前後五免然辭藻為後進所宗也劉孝儀字子儀本名潛字孝儀孝綽之弟寬厚有內行舉秀才纍遷尚書殿中郎補太子洗馬陽羡令甚有稱績纍官御史中丞出為臨海太守遷都官尚書復為豫州內史侯景逼建業孝儀遣子勵率兵入援及宫城不守失郡卒劉孝勝孝儀之弟歷官邵陵王法曹湘東王記室武陵王長史信義蜀郡太守武陵王僭號以為尚書僕射兵敗被執元帝宥之起為司徒右長史劉孝威字孝威孝勝之弟氣調爽逸初為晉安王法曹太清中遷太子中庶子通事舍人侯景亂孝威於圍中得出西上至安陸卒劉孝標本名峻平原人年八嵗與母沒於魏齊永明中奔江南為蕭遙欣刑獄梁天監初召入西省典校祕閣普通三年卒門人諡曰玄靜先生劉遵字孝陵孺之弟也清雅有學行工屬文為晉安王宣德雲麾二府記室甚見賓禮王入為皇太子除中庶子卒劉邈彭城人曽為侯景所得景攻臺城不克邈勸景乞和全師景然之陶𢎞景字通明丹陽秣陵人弱冠齊高帝引為諸王侍讀永明十年上表辭祿止於句曲山自號華陽隱居梁武帝即位屢加禮聘不出卒諡曰貞白先生宗夬字明敡南陽涅陽人世居江陵齊竟陵王集學士於西邸並見圖畫夬與焉明帝即位以為郢州刺史仕梁至五兵尚書周捨字升逸汝南安成人起家齊太學博士纍遷至太常丞武帝即位拜尚書祠部郎遷吏部郎太子詹事卒徐勉字修仁東海郯人仕齊纍遷領軍長史梁武帝即位纍官吏部尚書加中書令雖居顯職不營産業大通中復授侍中中衛將軍卒諡曰簡肅徐勉迎客曲云絲管列舞曲陳含聲未奏待嘉賓羅絲管陳舞席斂袖默脣迎上客送客曲云袖繽紛聲委咽餘曲未終高駕別爵無算景巳流空紆長袖客不留徐勉在梁為賢臣其為吏部日宴客酒酣有求詹事者勉曰今宵且可談風月其嚴正而又藴藉如此江左風流宰相豈獨謝安王儉邪文升菴集徐悱字敬業勉之第二子也聰敏能屬文位太子舍人纍遷洗馬出為湘東王友遷晉安內史先勉卒徐防侍晉安王隨府在雍州號高齋學士徐摛字士繢東海郯人初為晉安王侍讀及王為皇太子轉家令出為新安太守遷太子左衛率簡文嗣位進授左衛將軍固辭不受簡文被閉摛不獲朝謁感氣而卒摛文體既別春宫盡學之宫體之號自斯而起劉緩按劉綬平原人為湘東王記室未知是否史云劉緩清虛逺有氣調風流迭宕名高一府陸罩字洞元吳郡人仕梁為太子中庶子掌管記大同十年以母老求去母殁後位終光祿卿江從簡濟陽考城人革之子少有文名位司徒從事中郎侯景亂為任約所害虞義按本集序曰字子陽會稽人七嵗能屬文齊始安王引為侍郎尋兼建安征虜府主簿功曹又兼記室參軍事天監中卒南史云羲字士光餘姚人有才藻卒於晉安王侍郎江洪濟陽人工屬文為建陽令坐事死詩品曰洪詩雖無多亦能自迥出謝微梁書作謝徵字玄度陳郡陽夏人好學善屬文初為安成王法曹纍遷中書鴻臚出為豫章王長史蘭陵太守謝舉字言揚陳郡陽夏人莊之孫幼好學與兄覽齊名仕武帝時纍遷尚書令何思澄字元靜東海郯人少勤學工文辭為安成王記室遷治書侍御史通事舍人武陵王參軍孔翁歸會稽人工為詩為南平王記室費昶江夏人善為樂府嘗作鼓吹曲武帝重之勑曰才氣新拔有足嘉異賜絹十匹鮑機北史鮑宏傳父機以才學知名仕梁位侍書御史紀少瑜字幼瑒秣陵人為晉安國中尉大同七年升為東宫學士復除武陵王記室參軍褚翔字世舉河南陽翟人終武帝世纍遷吏部尚書母喪以毁卒張􅌘字四山吳郡人起家祕書郎纍遷為吳興太守死於侯景之難朱異字彥和吳郡錢塘人始為揚州議曹從事召直西省纍遷中領軍勸納侯景降及侯景反城內文武咸尤之因慙憤發病卒王臺卿梁南平王世子恪除雍州刺史賓客有江仲舉蔡薳王臺卿庾仲容四人俱被接遇按臺卿詩多與簡文倡和廣𢎞明集曰州民前臣刑獄參軍王臺卿王冏以下爵里未詳朱超朱超朱超道朱越各詩集所載名多互見疑是一人之作戴皓戴皓從軍行云長安夜刺閨胡騎犯銅鞮刺閨夜有急報投刺於宫門也南史陳文帝每夜刺閨取外事分判者前後相續勑雞人司漏傳籤於殿中令投籤於階石上蹌然有聲隋煬帝詩投籤初報曉隋時此制猶存也升菴詩話沈君攸後梁人施榮泰玉臺作施泰榮高允生樂府列梁人中王循房篆裴憲伯庾成師車􅛴姚翻阮研一作妍吳孜鄧鏗釋寶志不知何許人有人於宋太始中見之齊宋之交稍顯靈迹被髮徒跣語默不倫預言未兆言多玄驗梁武帝尤深敬事天監十三年卒王金珠包明月王叔英妻劉氏叔英琅琊人妻劉氏繪之女孝綽之妹孝綽三妹並有才學一適張􅌘一適徐悱徐悱妻劉氏孝綽之妹稱劉三娘姊妹二人並有才學悱妻文尤清拔悱為晉安郡卒喪還建鄴劉為祭文辭甚悽愴范靜妻沈氏唐藝文志有范靜妻沈滿願集三卷陳後主諱叔寶字元秀宣帝子即位之後荒于酒色不恤政事而盛修宫室刑罰酷濫隋文帝命將南征兵敗入隋見宥給賜甚厚仁壽四年終於洛陽陳後主於清樂中造黃驪留及玉樹後庭花金叉兩鬢垂等曲與幸臣等製其歌詞綺艷相高極於輕蕩男女唱和其音甚哀隋書樂志隂鏗字子堅武威人五嵗能誦詩賦日千言尤善五言詩為當時所重仕梁為湘東王法曹行參軍陳大嘉中為始興王軍録事參軍纍遷晉陵太守員外散騎常侍卒徐陵字孝穆東海郯人摛之子初為梁晉安王參軍纍遷至散騎常侍仕陳歷侍中安右將軍光祿大夫太子少傅南徐州太中正建昌縣開國侯氣局深逺清簡寡欲為一代文宗徐陵長相思云長相思好春節夢裏恆啼悲不泄帳中起窗前咽柳絮飛還聚遊絲斷復結欲見洛陽花如君隴頭雪蕭淳和之云長相思久離別新燕參差條可結狐關逺雁書絶對雲恆憶陳看花復愁雪猶有望歸心流黃未剪截二辭可謂勍敵升菴集沈炯字初明吳興武康人約之後有雋才仕梁為吳令侯景之亂景將宋子仙據吳興逼令掌書記及景東奔炯妻子皆為景害元帝立封原鄉侯領尚書左丞魏剋荆州被虜授儀同以母在東求歸陳武帝以為御史中丞文帝立加明威將軍周𢎞讓𢎞正之弟隱居茅山晚仕侯景為中書侍郎承聖初為國子祭酒陳天嘉中領太常卿陸瓊字伯玉吳郡人幼聰慧有思理仕陳纍官吏部尚書性謙儉不自封殖以母憂去職哀慕過毁卒陸瑜字幹玉吳郡人瓊之從父弟也仕陳纍官太子洗馬中舍人與兄琰並以才學侍東宫時人比之二應張正見字見賾清河東武城人幼好學有清才梁太清初射策高第除邵陵王國常侍梁元帝立拜通直散騎侍郎遷彭澤令屬亂避地匡俗山陳武受禪除鄱陽王參軍衡陽王長史纍遷散騎侍郎太建中卒江總字總持濟陽考城人初仕梁纍官至尚書僕射陳天嘉中轉太子詹事後主嗣位歷任尚書令不持政務但日與後主隨宴後庭多為艷詩國政日頽君臣昏亂陳亡入隋拜上開府開皇中卒江總折楊柳云塞北寒膠折江南楊柳結不悟倡園花遙同蔥嶺雪春心既駘蕩春樹聊攀折共此依依情無奈年年別唐張説詩亦云塞上綿應折江南草可結欲持梅嶺花逺競榆關雪微變數字不妨雙美沈滿願詩征人久離別故國音塵絶夢裏洛陽花覺來蔥嶺雪劉方平梅詩嵗晚芳梅樹繁苞四面同春風吹漸落一夜幾枝空小婦今如此長城恨不同莫將遼海雪來此後庭中升菴集何彼穠矣之詩美王姬而作也周姬姓故皇女皆稱姬如陳媯楚芊齊薑之類是也後世凡婦人皆稱姬誤矣南朝人士皆謂姬人如蕭綸見姬人詩所謂狂夫不妬妾隨意晚還家劉孝綽詠姬人未出詩所謂帷開見叉影簾動聞釧聲王僧孺為姬人怨詩所謂還君與妾扇歸妾與君裘江總為姬人怨服藥詩所謂妾家邯鄲好輕薄特忿仙童一丸藥是也韻語陽秋按稱姬不始於南朝如蔡文姬之類顧野王字希馮吳郡吳人也少以篤學至性知名梁大通初除太學博士歷臨賀宣城琅琊三王官入陳歷撰史學士後主東宫管記光祿卿宗懍春望詩曰日暮春臺望徙倚愛餘光都尉新移棗司空始種楊一枝猶桂馥十步有蘭香望望無萱草沈憂竟不忘顧野王芳樹詩曰上林通建章雜樹偏林芳日影桃蹊色風吹梅徑香幽山桂葉落馳道柳條長折榮疑路逺用表莫相忘二詩前首五用草木名後首四用草木名在後人則不勝其贅矣而清麗脫灑如此宗詩前聯都尉移棗蓋用漢藝文志有尹都尉移植棗杏梅李法司空種楊則用淮南子時則訓三月其官司空其樹楊也用字頗僻故須詮詁始見其妙升菴集傅縡字宜事北地靈州人梁太清末攜母南奔避亂王琳引為記室琳亡陳文帝召為撰史學士後主立纍遷祕書監右衛將軍兼中書通事舍人性木強負才使氣施文慶等譖之後主收下獄縡憤恚於獄中上書極諫後主怒賜死褚玠字溫理河南陽翟人起家王府法曹為山隂令去官之日貧不堪自致皇太子賜粟米二百斛得還都令入直殿省纍遷御史中丞岑之敬字思禮南陽人年十六對策擢高第纍遷晉安王中記室陳太建初授東宫學士轉南臺侍御史征南府咨議參軍性謙謹士君子以篤行稱之古有三句之詩意足詞膽盤屈於二十一字之中最為難工遍檢前賢詩不過四五首而巳岑之敬當壚曲云明月二八照花新當壚十五晚留賓回眸百萬橫自陳最為絶倡詩話補遺徐伯陽字隱忍東海人大同中為侯官令甚得人和陳天嘉中為侯安都記室參軍纍遷鎮安新安王府咨議參軍蔡君知凝之子頗知名阮卓陳留尉氏人幼聰敏篤志經籍尤工五言性至孝有廉節仕陳為新安王府記室纍遷德教殿學士聘隋還除南海王府咨議參軍陳亡入隋陳昭義興國山人慶之之子慶之在梁以軍功封永興侯卒昭嗣位陳暄眧之弟學不師受而文才俊逸後主在東宫引為學士及即位遷通直散騎常侍與王叔達孔範等入禁中陪宴號為狎客暄通脫以俳優自居為後主侮虐悸死祖孫登仕為陳記室侯安都引以為客謝燮陳書大建十二年吏部侍郎缺所司屢舉謝燮等宣帝不用乃中召用蕭引蕭詮南史蕭詮仕陳為黃門郎賀徹仕陳為左戶郎李爽仕陳為中記室蕭賁字文奐齊竟陵王子良之孫神識耿介幼好學有文才起家梁湘東王法曹參軍王瑳與江總孔範等並為狎客刻薄貪鄙忌害才能陳亡入隋被流逺裔蘇子卿陽縉賀力牧伏知道陳伏知道從軍五更轉隋煬帝效之作龍舟五更轉升菴集毛處約陸系獨孤嗣宗江暉李燮何楫蕭淳孔仲智徐堪一作徐湛吳思玄殷謀賈馮吉北魏胡武靈后安定臨涇人司徒國珍女宣武召入為承華世婦生明帝尊為皇太后後爾朱榮沈于河楊華既奔梁元魏胡武靈后作楊白花歌令宫人連臂踏之聲甚悽斷柳子厚樂府云楊白華風吹渡江水坐令宫樹無顔色搖蕩春心幾千里回看落日下長楸哀歌未斷城烏起言婉而情深古今絶唱也魏舊歌云陽春二三月楊柳齊作花春風一夜入閨闥楊花飄落入南家含情出戶腳無力拾得楊花淚霑臆秋去春來雙燕子願銜楊花入窠裏此辭亦自奇麗録之以存古出樂府廣題云詩許彥周話蕭綜字世謙梁武帝第二子封豫章王普同初為都督南兖州刺史鎮彭城奔魏歷司徒太尉尚壽陽公主在魏不得志嘗作聽鐘鳴悲落葉以申其志高允字伯恭渤海蓚人少好學博通經史神麚初參樂平王軍事獻文末授懷州刺史太和二年拜鎮軍大將軍領中祕書事加光祿大夫歷事五帝出入三省五十餘年初無譴咎王肅字恭懿琅琊臨沂人仕齊為祕書丞父奐及兄弟並為南齊武帝所殺太和中奔魏孝文虛襟待之纍遷尚書令宣武時尚陳留公主後以破齊進位開府儀同三司封昌國縣侯揚州刺史祖瑩字元珍范陽遒人孝文時拜太學博士纍遷國子祭酒領給事黃門侍郎孝武登阼封文安縣子天平初進爵為伯溫子升字鵬舉其先太原人祖避難家於濟隂博覽百家文章清婉熙平初舉高第擢御史孝莊即位補南主客郎中遷散騎常侍侍中大將軍領本州大中正齊文襄引為咨議後以事下晉陽獄死高孝緯王容祖叔辨北齊邢邵字子才河間鄭人十嵗能屬文日誦萬餘言文章典麗既贍且速釋巾為魏武挽郎纍除國子祭酒齊宣武輔政徵為賓客除黃門侍郎遷太常卿授特進邵率情簡素博覽墳籍公私咨稟為世指南焉魏收字伯起巨鹿下曲陽人仕魏典起居注兼中書舍人與溫子升邢子才齊名世號三才天保初除中書令兼著作郎後除光祿大夫尚書右僕射特進諡文貞收有才無行在京洛輕薄尤甚人號為驚蛺蝶祖珽字孝徵瑩之子神清機警詞藻遒逸少馳令譽為當世所推起家祕書郎後主時佞于陸媪拜尚書左僕射封燕國公專主機衡後以罪出為北徐州刺史裴讓之字士禮河東聞喜人少好學有文情魏天平中舉秀才遷主客郎歷中書舍人散騎常侍及齊受禪封宜都縣男尋除清和太守後被罪賜死劉逖字子長彭城人齊文襄以為永安公參軍至武成時遷散騎常侍未幾與崔季舒等同戮盧詢名見顔氏家訓云范陽盧詢即疑盧詢祖也樂府作陳人高昂字敖曹北海蓨人齊神武起因成霸業除侍中司徒兼西南道都督酷好為詩雅有情致時人稱焉荀仲舉字士高潁川人世江南仕梁為南沙令後至北齊入文林館以年老家貧出為義寧太守樂府玉臺俱作陳人蕭慤字仁祖蘭陵人梁宗室上黃侯曄之子太保中入齊武定中為太子洗馬後主時為齊州録事參軍待詔文林館後入隋蕭轂樂府英華並作蕭轂苑詩類選作蕭慤陸卬字雲駒齊之郊廟諸歌多卬所制顔之推字介卿琅琊臨沂人初為梁湘東王常侍元帝即位以為散騎侍郎後為周軍所破奔齊纍官黃門侍郎平原太守齊人入周為御史上士隋開皇中太子召為文學以疾終陸法和不知何許人隱於江陵百里洲妙解神術預見萌兆再為元帝破賊帝以法和為都督郢州刺史封江乘縣公元帝敗入齊文宣以為大都督荆州刺史湘郡公無病而終盧士深妻崔氏北周趙王招字豆盧突文帝第七子幼聰穎博涉羣書好屬文學庾信體武成初封趙國公歷大司馬進爵為王隋文將遷周鼎招欲圖之會謀泄隋文陷以謀反見害國除蕭撝字智遐梁安成王秀之子封永豐侯歷黃門侍郎及侯景作亂從武陵王紀為征西大將軍守成都以周文帝見討遂歸西魏授侍中武帝時為文學博士歷少傅改封蔡陽郡公徐謙王褒字子深琅琊臨沂人儉之曽孫規之子也仕梁歷吏部尚書右僕射荆州破入長安為車騎大將軍明帝即位特加親待尋加開府儀同三司武帝時為太子少保遷少司空出為宜州刺史庾信字子山新野人幼而俊邁博覽羣書父肩吾為梁太子中庶子東海徐摛為左衛率摛子陵及信並為抄撰學士父子東宫出入禁闥既文並綺豔故世號為徐庾體焉纍遷通直散騎常侍聘于東魏文章辭令甚為鄴下所稱梁元帝稱制除御史中丞及即位轉右衛將軍江陵平纍遷開府儀同三司庾信之作如玉臺九成瓊樓數仭規模崇麗氣象清新步虛諸什並懸絶塵境竹林詩評尚法師隋煬帝諱廣隋文皇第二子立為晉王後隂謀得為太子弒父自立在位十二年荒淫暴虐為宇文化及所弒隋書文苑傳敘曰煬帝初習藝文有非輕側之論暨乎即位一變其體與越公書建東都詔冬至受朝詩及擬飲馬長城窟並存雅體歸於典制雖意在驕淫而詞無浮蕩故當時綴文之士遂得依而取正焉蕭岑字智逺梁宣帝第八子封河間王改吳郡王位至太尉及琮嗣位自以望重屬尊頗有不法隋文帝徵入朝拜大將軍封懷義郡公遂留不遣王通字仲淹河汾人既冠西見隋文帝獻太平十二策不用東歸其後纍徵不起講道河汾之上卒諡曰文中子牛𢎞字里仁安定鶉觚人仕周歷內史下大夫入隋進封奇章郡公大業初歷右光祿大夫從幸江東卒李德林字公輔博陵安平人初仕齊儀同三司及周武帝克齊授內史上士宣帝大漸屬隋高祖受顧命德林叶贊謀猷禪代之文皆德林辭也初受內史令安平縣公出為湖州刺史楊素字處道𢎞農華隂人仕周以平齊加上開府封成安縣公隋高祖受禪加上柱國進封越國公纍官右僕射晉王廣弒立素之謀也大業初遷尚書令拜太師改封楚公卒何妥字棲鳯西城人少機敏以技巧事梁湘東王江陵陷周武帝尤重之隋高祖受禪奉詔考正鍾律纍遷國子祭酒盧思道字子行范陽人才學兼著齊天保中直中書省待詔文林館周武帝平齊授儀同三司隋開皇間為散騎侍郎薛道衡字玄卿河東汾隂人專精好學甚著才名為齊尚書左外兵郎齊亡周武引用為御史二命士隋受禪除內史纍遷上儀同三司出檢校襄州煬帝嗣位道衡上文皇帝頌帝覽之不悅尋以論時政見害李孝貞字元操以字行趙郡人齊黃門侍郎周平齊轉下大夫隋開皇初參典文翰歷金州刺史辛德源字孝基隴西狄道人仕北齊歷遷郎中齊滅仕周隋受禪隱林慮山中著幽居賦刺史崔武奏之謫從軍討南寧還牛𢎞薦修國史轉咨議參軍卒柳辨字顧言襄陽人初仕梁梁亡入隋為東宫學士俊辨嗜酒言雜俳諧為太子所親狎煬帝即位拜祕書監從幸江都卒虞世基字茂世會稽餘姚人博學有高才仕陳歷尚書左丞入隋為通直郎直內史省煬帝顧遇彌隆幸江都時天下大亂世基唯諾取容郡縣兵敗不敢以聞及宇文化及弒逆亦遇害虞茂隋史無虞茂虞世基字茂世諸集多以二名互載虞世南字伯施世基弟文章婉縟陳至德初除西陽王友陳滅與兄世基同入隋時人以方二陸纍至祕書郎煬帝雅愛其才然疾峭正十年不徙後入唐纍官祕書監諸葛穎字漢丹陽建康人起家梁邵陵王參軍侯景之亂奔齊遷太子舍人入隋晉王廣引為參軍及即帝位遷著作郎從駕北巡卒王胄字承基少有逸才仕陳鄱陽王法曹參軍太子舍人東陽王文學陳滅晉王引為學士大業初為著作佐郎楊玄感敗胄坐交遊徙邊亡匿江左捕誅孔紹安大業末為監察御史入唐拜內史舍人祕書監岑德潤南陽人之敬子有父風位中軍吳興王記室陳子良吳人在隋未有考入唐為太子學士貞觀中卒陳良庾抱仕隋為元德太子學士入唐貞觀初徙趙王友袁朗雍州長安人在陳為祕書郎纍遷太子洗馬德教殿學士入隋歷尚書儀曹郎後入唐轉給事中明餘慶平原鬲人官至司門郎越王侗稱制為國子祭酒柳莊字思敬河東解人事梁主纍遷太府卿梁廢入隋授開府儀同除給事黃門侍郎樂府作陳人李巨仁𢎞執恭王由禮徐伯陽傳伯陽大建初與中記室李爽記室張正見左戶郎賀徹學士阮卓黃門郎蕭銓三公郎王由禮處士馬樞記室祖孫登比部郎賀循長史劉刪等為文會友魯范殷英童僧法宣續高僧傳云常州𢎞業寺沙門法宣隋人後入唐釋慧淨沸大見禪藻集杭靜江都宫人丁六娘羅愛愛仙西王母法嬰三上元夫人雙田四妃元夫人馮禮雲林右英夫人媚蘭紫微夫人青娥南英王夫人人中候夫人妃昭靈李夫人極紫元夫九華安東華上房靈妃太微玄清左夫人張麗英衛羅女配瑛東王公玉童太極真人方諸青童扶桑神王清虛真人周採薪人赤松子王子喬蘇耽丁令威車子侯裴玄成杜廣平敬玄子郭四朝李桓桓凱武夷君鬼郭長生劉惠明女青溪小姑蔣氏廬山夫人女婉陳阿登陵欣聶包古樂苑衍録卷三
