body:
  text: 古樂苑卷二十九明梅鼎祚編舞曲歌辭雜舞雜舞二拂舞歌詩晉拂舞歌詩晉書樂志曰拂舞出自江左舊云吳舞檢其歌非吳辭也亦陳于殿庭晉曲五篇一曰白鳩二曰濟濟三曰獨祿四曰碣石五曰淮南王齊多刪舊辭而因其曲名古今樂録曰梁拂舞歌並用晉辭樂府解題曰除白鳩一曲餘並非吳歌未知所起白鳩篇南齊書樂志曰白符鳩舞出江南吳人所造其歌本云平平白符思我君惠集我金堂言白者金行符合也鳩亦合也符鳩雖異其義是同晉書樂志曰晉楊泓舞序云自到江南見白符舞或言白鳬鳩舞云有此來數十年矣察其辭旨乃是吳人患孫皓虐政思屬晉也晉辭曰翩翩白鳩載飛載鳴懷我君德來集君庭蓋晉人改其本歌云翩翩白鳩載飛載鳴懷我君德來集君庭白雀呈瑞素羽明鮮翔庭舞翼以應仁乾交交鳴鳩或丹或黃樂我君惠振羽來翔東壁餘光魚在江湖惠而不費敬我微軀䇿我良駟習我驅馳與君周旋樂道亡餘我心虛靜我志霑濡彈琴鼓瑟聊以自娛凌雲登臺浮遊太清扳龍附鳳目望身輕交交晉書作皎皎亡餘晉書作忘飢目晉書作自宋書作日濟濟篇暢飛暢舞氣流芳追念三五大綺黃去失有時可行去來同時此未央時冉冉近桑榆但當飲酒為歡娛衰老逝有何期多憂耿耿內懷思淵池廣魚獨希願得黃浦衆所依恩感人世無比悲歌且舞無極已暢飛暢舞晉書作暢暢飛舞同時晉書作時同有何期作何有期淵池廣作深地廣獨漉篇獨漉一作獨祿南齊書樂志曰古辭明君曲後云勇安樂無慈不問清與濁清與無時濁邪交與獨祿伎録曰求祿求祿清白不濁清白尚可貪汙殺我晉歌為鹿字古通用也疑是風刺之辭獨漉獨漉水深泥濁泥濁尚可水深殺我雍雍雙鴈遊戲田畔我欲射鴈念子孤散翩翩浮萍得風搖輕我心何合與之同并空牀低帷誰知無人夜衣錦繡誰别偽真刀鳴鞘中倚牀無施父寃不報欲活何為猛虎斑斑遊戲山間虎欲齧人不避豪賢獨漉獨漉晉書作獨獨祿祿虎晉書作獸碣石篇南齊書樂志曰碣石魏武帝辭晉以為碣石舞其歌四章一曰觀滄海二曰冬十月三曰土不同四曰龜雖夀樂府解題曰碣石篇晉樂奏魏武帝辭首章言東臨碣石見滄海之廣日月出入其中二章言農功畢而商賈往來三章言鄉土不同人性各異四章言老驥伏櫪志在千里烈士暮年壯心不已也按相和大曲步出夏門行亦有碣石篇與此並同東臨碣石以觀滄海水何淡淡山島竦峙樹木藂生百草豐茂秋風蕭瑟洪波湧起日月之行若出其中星漢粲爛若出其裏幸甚至哉歌以詠志右觀滄海孟冬十月北風徘徊天氣肅清繁霜霏霏鵾雞晨鳴鴈過南飛鷙鳥濳藏熊羆窟棲錢鎛停置農收積場逆旅整設以通賈商幸甚至哉歌以詠志錢晉書作耨鏄一作鑮右冬十月鄉土不同河朔隆寒流澌浮漂舟船行難錐不入地豐藾深奧水竭不流冰堅可蹈士隱者貧勇俠輕非心常歎怨戚戚多悲幸甚至哉歌以詠志右土不同神龜雖夀猶有竟時騰蛇乘霧終為土灰老驥伏櫪志在千里烈士暮年壯心不已盈縮之期不但在天養恬之福可得永年幸甚至哉歌以詠志右龜雖夀淮南王篇崔豹古今注曰淮南王淮南小山之所作也淮南王服食求仙遍禮方士遂與八公相攜俱去莫知所往小山之徒思戀不巳乃作淮南王曲焉班固漢武帝故事曰淮南王安好神仙招方術之士能為雲雨百姓傳云淮南王得天子夀無極帝心惡之使覘王云能致仙人與共遊處變化無常又能隱形飛行服氣不食帝聞而喜欲受其道王不肯傳帝怒將誅焉王知之出令與羣臣因不知所之樂府解題曰古辭淮南王自言尊實言安仙去淮南王自言尊百尺髙樓與天連後園鑿井銀作牀金瓶素綆汲寒漿汲寒漿飲少年少年窈窕何能賢揚聲悲歌音絶天我欲渡河河無梁願化雙黃鵠還故鄉還故鄉入故里裴徊故鄉苦身不已繁舞寄聲無不泰徘徊桑梓遊天外化晉書作作寄聲作竒歌齊拂舞第五曲用之而刪其半齊拂舞歌白鳩辭晉白鳩舞歌七解齊樂所奏是最前一解翩翩白鳩再飛再鳴懷我君德來集君庭濟濟辭南齊書樂志曰晉濟濟舞歌六解齊樂所奏是最後一解按晉書樂志是最前一解疑齊書之誤暢飛暢舞氣流芳追念三五大綺黃獨祿辭南齊書樂志曰晉獨漉歌六解齊樂所奏是最前一解獨祿獨祿水深泥濁泥濁尚可水深殺我碣石辭南齊書樂志曰晉碣石舞歌四章齊樂所奏是前一章東臨碣石以觀滄海水何淡淡山島竦峙樹木叢生百草豐茂秋風蕭瑟洪波涌起日月之行若出其中星漢粲爛若出其裏幸甚至哉歌以言志淮南王辭南齊書樂志曰晉淮南王舞歌六解齊樂所奏前是第一解後是第五解淮南王自言尊百尺髙䄛與天連我欲渡河河無梁願作雙黃鵠還故鄉梁拂舞歌古今樂録曰梁三朝樂第十九設拂舞此歌刪晉白鳩篇而改曖曖鳴球一句翩翩白鳩再飛再鳴懷吾君德來集君庭曖曖鳴球或丹或黃樂我君恩振羽來翔雜擬臨碣石沈約碣石送返潮登罘禮朝日溟漲無端倪山島玄崇崒驥老心未窮酬恩豈終畢小臨海劉孝威碣石望山海留連降尊極秦帝枉鈎陳漢家增禮秩石橋終不成桑田竟難測蜃氣逺生樓鮫人近濳織空勞帝女填詎動波神色淮南王朱門以下玉臺别作一首鮑照淮南王好長生服食錬氣讀仙經琉璃作碗牙作盤金鼎玉七合神丹合神丹戲紫房紫房綵女弄明璫鸞歌鳳舞斷君腸朱門九重門九閨願逐明月入君懷入君懷結君佩怨君恨君恃君愛築城思堅劒思利同盛同衰莫相棄朱門一作朱城闕陽春白日風花香趨步鳴玉舞瑤璫聲發金石媚笙簧羅袿徐轉紅袖揚清歌流響繞鳳梁如矜若思凝且翔轉盼遺精艷輝光將流將引雙雁行歡來何晚意何長明君御世永歌昌宋白紵舞歌宋書樂志曰白紵舞歌詩舊新合三篇二篇與晉辭同其一稍互髙舉兩手白鵠翔輕軀徐起何洋洋凝停善睞容儀光宛若龍轉乍低昂隨世而變誠無方如推若引留且行宋世方昌樂未央舞以盡神安可忘愛之遺誰贈佳人質如輕雲色如銀袍以光軀巾拂塵制以為袍餘作巾四座歡樂胡可陳清歌徐舞降祇神同前南平王鑠仙仙徐動何盈盈玉腕俱凝若雲行佳人舉袖耀青蛾摻摻擢手映鮮羅狀似明月泛雲河體如輕風動流波耀一作輝同前鮑照啓曰侍郎臣鮑照啓被教作白紵舞歌辭謹竭庸陋裁為四曲附啓上呈識方淟悴思塗猥局言既無雅聲未能文不足以宣贊聖旨抽拔妙實謹遣簡餘慙隨悚盈謹啓吳刀楚製為佩褘纎羅霧縠垂羽衣含商咀徵歌露晞珠履颯沓紈袖飛凄風夏起素雲回車殆馬煩客忘歸蘭膏明燭承夜輝履一作屣桂宫柏寢擬天居朱爵文窗韜綺疏象牀瑤席鎮犀渠雕屏鉿匝組帳舒秦箏趙瑟挾笙竽垂璫散珮盈玉除停觴不御欲誰須鉿一作匼帳一作帷珮一作綬御一作語三星參差露沾濕弦悲管清月將入寒光蕭條候蟲急荆王流歎楚妃泣紅顔難長時易戢凝華結藻久延立非君之故豈安集藻一作綵池中赤鯉庖所捐琴髙乘去騰上天命逢福世丁溢恩簪金藉綺升曲筵思君厚德委如山潔誠洗志期暮年烏白馬角寧足言騰一作飛命逢福世一作徼命逢福思君厚德一作恩厚德深朱蜃動素腕舉洛陽少童邯鄲女古稱渌水今白紵催弦急管為君舞窮秋九月荷葉黃北風驅鴈天雨霜夜長酒多樂未央腕一作袖童一作年春風淡蕩俠思多天色淨緑氣妍和含桃紅蕚蘭紫牙朝日灼爍發園花卷幌結帷羅玉筵齊謳秦吹盧女弦千金顧笑買芳年蘭一作連同前湯惠休琴瑟未調心已悲任羅勝綺強自持忍思一舞望所思將轉未轉恆如疑桃花水上春風出舞袖逶迤鸞照日徘徊鶴轉情豔逸君為迎歌心如一少年窈窕舞君前容華豔豔將欲然為君嬌凝復遷延流目送笑不敢言長袖拂面心自煎願君流光及盛年齊白紵舞辭五曲即晉辭末首王儉陽春白日風花香趨步明月舞瑤裳情發金石媚笙簧羅袿徐轉紅袖揚清歌流響繞鳳梁如驚若思凝且翔轉盼流精豔輝光將流將引雙鴈行一作雙度行歡來何晚意何長明君馭世永歌昌梁白紵辭古今樂録曰梁三朝樂第二十設巾舞并白紵蓋巾舞以白紵四解送也二首藝文作簡文帝今從玉臺武帝朱絲玉柱羅象筵飛琯促節舞少年短歌流目未肯前含笑一轉私自憐纎腰嫋嫋不任衣嬌怨獨立特為誰赴曲君前未忍歸上聲急調中心飛同前張率歌兒流唱聲欲清舞女趂節體自輕歌舞並妙會人情依弦度曲婉盈盈揚蛾為態誰目成依一作調妙聲屢唱輕體飛流津染面散芳菲俱動齊息不相違令彼嘉客淡忘歸時久玩夜明星稀日暮搴門望所思風吹庭樹月入帷涼陰既滿草蟲悲誰能離别長夜時流歎不寢淚如絲與君之别終何知知一作如秋風鳴條露垂葉空閨光盡坐愁妾獨向長夜淚承睫山髙水深路難涉望君光景何時接鳴一作蕭獨向長夜一作獨問長安遙夜方逺時既寒秋風蕭瑟白露團佳期不待嵗欲闌念此遲暮獨無歡鳴弦流管增長歎夜寒湛湛夜未央華燈空爛月懸光從風衣起發芬香為君起舞幸不忘列坐華筵紛羽爵清曲未終月將落歌舞及時酒常酌無令朝露坐銷鑠愁來夜遲猶歎息撫枕思君終反仄金翠叉環稍不飾霧縠流黃不能織但坐空閨思何極欲以短書寄飛翼來一作多遙夜忘寐起長歎但望雲中雙飛翰明月入牖風吹幔終夜悠悠坐申旦誰能知我心中亂終然有懷嵗方晏四時白紵歌古今樂録曰沈約云白紵五章勑臣約造武帝造後兩句春白紵沈約蘭葉參差桃半紅飛芳舞縠戲春風如嬌如怨狀不同含笑流盼滿堂中翡翠羣飛飛不息願在雲間長比翼佩服瑤草駐容色舜日堯年歡無極夏白紵英華作梁武帝朱光灼爍照佳人含情送意遙相親嫣然一轉亂心神非子之故欲誰因翡翠羣飛飛不息願在雲間長比翼佩服瑤草駐容色舜日堯年歡無極一一作宛秋白紵白露欲凝草已黃金琯玉柱響洞房雙心一意俱回翔吐情寄君君莫忘翡翠羣飛飛不息願在雲間長比翼佩服瑤草駐容色舜日堯年歡無極冬白紵寒閨晝寢羅幌垂婉容麗色心相知雙去雙還誓不移長袖拂面為君施翡翠羣飛飛不息願在雲間長比翼佩服瑤草駐容色舜日堯年歡無極夜白紵秦箏齊瑟燕趙女一朝得意心相許明月如規方襲豫夜長未央歌白紵翡翠羣飛飛不息願在雲間長比翼佩服瑤草駐容色舜日堯年歡無極隋四時白紵歌東宫春隋煬帝洛陽城邊朝日暉天淵池前春燕歸含露桃花開未飛臨風楊栁自依依小苑花紅洛水緑清歌宛轉繁弦促長袖逶迤動珠玉千年萬嵗陽春曲江都夏梅黃雨細麥秋輕楓樹蕭蕭江水平飛樓倚觀軒若驚花簟羅幃當夏清菱潭落日雙鳬舫緑水紅粧兩搖漾還似浮桑碧海上誰肯空歌採蓮唱梅黃一作黃梅夏一作夜誰一作詎江都夏虞茂長洲茂苑朝夕池映日含風結細漪坐當伏檻紅蓮披雕軒洞户青蘋吹輕幌芳煙鬱金馥綺簷花簟桃李枝蘭苕翡翠但相逐桂樹鴛鴦恆並宿長安秋露寒臺前曉露清昆明池水秋色明搖環動珮出曽城鵾弦鳳管奏新聲上林蒲桃合縹眇甘泉竒樹尚蔥青玉人當歌理清曲倢妤恩情斷還續杯槃舞歌詩宋書樂志曰槃舞漢曲也張衡舞賦云厯七槃而縱躡王粲七釋云七槃陳於廣庭顔延之云遞間關於槃扇鮑照云七槃起長袖皆以七槃為舞也晉杯槃舞歌詩搜神記曰晉太康中天下為晉世寧舞矜手以接杯槃而反覆之此則漢世唯有柈舞而晉加之以杯反覆也五行志曰其歌云晉世寧舞杯槃言接杯槃於手上而反覆之至危也杯槃者酒食之器也而名曰晉世寧者言晉世之士偷茍於酒食之間而其知不及逺晉世之寧猶杯槃之在手也唐書樂志曰漢有槃舞晉世謂之杯槃舞樂府詩云妍袖陵七槃言舞用盤七枚也晉世寧四海平普天安樂永大寧四海安天下歡樂治興隆舞杯槃舞杯槃何翩翩舉坐翻覆夀萬年天與日終與一左回右轉不相失箏笛悲酒舞疲心中慷慨可健兒樽酒甘絲竹清願令諸君醉復醒醉復醒時合同四坐歡樂皆言工絲竹音可不聽亦舞此槃左右輕自相當合坐歡樂人命長人命長當結友千秋萬嵗皆老夀齊世昌辭南齊書樂志曰晉杯槃舞歌十解第三解云舞杯槃何翩翩舉坐反覆夀萬年其第一解首句云晉世寧宋改為宋世寧惡其杯槃翻覆辭不復取齊改為齊世昌後一解辭同唐書樂志曰梁謂之舞槃伎隋書樂志曰梁三朝樂第二十一設舞槃伎齊世昌四海安樂齊太平人命長當結友千秋萬嵗皆老夀宋泰始歌舞曲辭古今樂録曰宋泰始歌舞十二曲一曰皇業頌二曰聖祖頌三曰明君大雅四曰通國風五曰天符頌六曰明德頌七曰帝圖頌八曰龍躍大雅九曰淮祥風十曰宋世大雅十一曰治兵大雅十二曰白紵篇大雅皇業頌此歌自堯至楚元王髙祖世載聖德明帝皇業沿德建帝運資勳融胤唐重盛軌胄楚載休風堯帝兆深祥元王衍遐慶積善傳上業胙福啓聖聖衰數隨金祿登厯昌永命維宋垂光烈世美流舞咏融一作庸聖聖一作英聖聖祖頌聖祖維髙德積勳代晉厯永建享鴻基萬古盛音册睿文纘宸馭廣運崇帝聲衍德被仁祉留化洽民靈孝建締孝業允協天人謀宇內齊政軌宙表燭威流鐘管騰列聖彞銘賁重猷明君大雅虞和明君應乾數撥亂紐頽基民慶來蘇日國頌薰風詩天步或暫艱列蕃扇迷慝廟勝敷九伐神謨洞七德文教洗昏俗武誼清祲埏英勳冠帝則萬夀永齊天齊宋書作衍通國風明帝開寶業資賢昌謨明盛弼諧光烈武惟略景王勳南康華容變政文猛績爰著有左軍三王到氏文武贊丞相作輔屬伊旦沈柳宗矦皆殄亂泰始開運超百王司徒驃騎勳德康江安謨效殷誠彰劉沈承規功名揚慶歸我后祚無疆業宋書作國謨效作謀效天符頌天符革運世誕英皇在館神炫既壯龍驤六鍾集表四緯駢光於穆配天永休厥祥明德頌明德孚教幽符麗紀山鼎見竒醴液涵祉鵷雛耀儀騶虞遊趾福延億胙慶流萬祀帝圖頌帝圖凝逺瑞美昭宣濟流月鏡鹿毳霜鮮甘露降和花雪表年孝德載衍芳風永傳龍躍大雅豫章王龍躍戎府王耀蕃宫嵗淹豫野璽屬嬪中江波徹映石柏開文觀育花蕊樓凝景雲白烏三獲甘液再呈嘉穟表沃連理協成德充動物道積通神宋業允大靈瑞方臻戎府宋書作式符淮祥風北都尉淮祥應賢彥生翼贊中興致太平宋世大雅虞和宋世寧在泰始醉酒歡飽德喜萬國朝上夀酒帝同天惟長久治兵大雅明帝王命治兵有征無戰巾拂以淨醜類革面王儀振旅載戢在辰中虛巾拂四表靜塵白紵篇大雅在心曰志發言詩聲成于文被管絲手舞足蹈欣泰時移風易俗王化基琴角揮韻白雲舒簫韶協音神鳳來拊擊和節詠在初章曲乍畢情有餘文同軌一道德行國靖民和禮樂成四縣庭響美勳英八列陛唱貴人聲舞飾麗華樂容工羅裳皎日袂隨風金翠列輝蕙麝豐淑姿委體允帝𠂻皎一作映委一作秀齊明王歌辭齊明王歌辭七曲王融應司徒教而作也一曰明王曲二曰聖君曲三曰淥水曲四曰採菱曲五曰清楚引六曰長歌引七曰散曲明王曲一曲二解王融明王日月照至樂天地和幸息雲門吹復歇咸池歌桂序金匏轉瑤軒絲石羅朱騏步躑躅玄鶴舞蹉跎露凝嘉草秀煙度醴泉波皇基方萬祀齊民樂如何序一作房聖君曲一曲三解聖君應昌厯景祚啓休期龍樓神睿道兔園仁義基海蕩萬川集山崖百草滋盤苗成萃止渝韎異來思清明動離軫威惠被殊辭大哉君為后何羡唐虞時惠一作懷淥水曲一曲三解湛露改寒司交鶯變春旭瓊樹落晨紅瑤塘水初淥日霽沙溆明風泉動華燭遵渚泛蘭觴乘漪弄清曲斗酒千金輕寸隂百年促何用盡歡娛王度式如玉動一作暗弄一作舞採菱曲一曲三解炎光銷玉殿涼風吹鳳樓雕輜傃平隰朱棹泊安流金華粧翠羽鷁首畫飛舟荆姫採菱曲越女江南謳騰聲翻葉靜發響谷雲浮良時時一遇佳人難再求雕輜一作青輅飛一作龍發一作散清楚引一曲三解平原數千里飛觀鬱岧岧清月冏將曙浩露零中宵轉葉渡沙海别羽自冰遼四面涌寒色左右竟嚴飈崤澠多榛梗京索久塵苗逝將憑神武奮劒蕩遺妖涌通作長歌引一曲三解周雅聽休明齊德覯升平紫煙四時合黃河萬里清翠栁蔭通街朱闕臨髙城方轂雷塵起接袖風雲生酣笑爭日夕絲管牙逢迎徂年無促慮長歌有餘聲牙疑作互散曲一曲三解金枝湛明燎繡幕裂芳然層閨橫緑綺曠席緬朱纒楚調廣陵散瑟柱秋風弦輕裙中山麗長袖邯鄲妍徐歌駐行景迅節籥浮煙言願聖明主永永萬斯年散樂附周禮曰旄人教舞散樂鄭康成云散樂野人為樂之善者若今黃門倡即漢書所謂黃門名倡丙疆景武之屬是也漢有黃門鼓吹天子所以宴羣臣然則雅樂之外又有宴私之樂焉唐書樂志散樂者非部伍之聲俳優歌舞雜奏秦漢巳來又有雜伎其變非一名為百戲亦總謂之散樂自是厯代相承有之俳歌辭一曰侏儒導自古有之蓋倡優戲也説文曰俳戲也榖梁曰魯定公會齊侯于夾谷罷會齊人使優施舞於魯君之幕下范寧云優俳施其名也樂記子夏對魏文侯問曰新樂進俯退俯俳優侏儒獶雜子女王肅云俳優短人也則其所從來亦逺矣南齊書樂志曰侏儒導舞人自歌之古辭俳歌八曲前一篇二十二句今侏儒所歌擲取之也古今樂録梁三朝樂第十六設俳伎伎兒以青布囊盛竹篋貯兩踒子負束寫地歌舞小兒二人提沓踒子頭讀俳云見俳不語言俳澀所俳作一起四坐敬止馬無懸蹄牛無上齒駱駝無角奮迅兩耳半折薦博四角恭跱隋書樂志曰魏晉故事有侏儒導引隋文帝以非正典罷之古辭俳不言不語呼俳吸所俳適一起狼率不止生拔牛角摩斷膚耳馬無懸蹄牛無上齒駱駝無角奮迅兩耳宋鳳皇銜書伎辭隋書樂志曰鳯皇銜書伎自宋齊巳來有之三朝用之南齊書樂志曰蓋魚龍之流也元曽日侍中於殿前跪取其書以授舍人舍人受書升殿跪奏宋世有辭齊初詔江淹改造至梁武帝普通中下詔罷之大宋興隆膺靈符鳳鳥感和銜素書嘉樂之美通玄虛惟新濟濟邁唐虞巍巍蕩蕩道有餘齊鳳皇銜書伎辭江淹皇齊啓運從瑤璣靈鳳銜書集紫微和樂既洽神所依超商卷夏耀英輝永世夀昌聲華飛古樂苑卷二十九
