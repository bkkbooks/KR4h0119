body:
  text: 古樂苑巻二十一明梅鼎祚編相和歌辭瑟調曲豔歌何嘗行四解二曰飛鵠行别有一篇語小異鵠二作鶴鵠鶴古通用飛來雙白鶴本此古今樂錄曰王僧䖍技録云豔歌何嘗行歌文帝何嘗雙白鵠二篇又古辭云何嘗快獨無憂不復為後人所擬古辭飛來雙白鵠乃從西北來十十五五羅列成行一解妻卒被病行不能相隨五里一反顧六里一徘徊二解吾欲銜汝去口噤不能開吾欲負汝去毛羽何摧頺三解樂哉新相知憂來生别離躇躊顧羣侣淚下不自知四解念與君離别氣結不能言各各重自愛逺道歸還難妾當守空房閉門下重闗若生當相見亡者㑹黄泉今日樂相樂萬嵗期延年一作延年萬嵗期樂念與下為趨右一曲晉所奏飛來雙飛鵠行從廣文選所載將五五羅列行不齊白鵠乃西北來十十忽然卒疲病不能飛相隨五里一返顧六里一徘徊吾欲銜汝去口噤不能開吾欲負汝去羽毛日摧頺樂哉新相知憂來生别離踟躊顧羣侣涙落縱横垂今日樂相樂延年萬嵗期同前五解按宋書作古辭魏文帝何嘗快獨無憂但當飲醇酒炙肥牛一解長兄為二千石中兄被貂裘二解小弟雖無官爵鞍馬􅀈􅀈往來王矦長者遊三解但當在王矦殿上快獨樗蒲六博對坐彈碁四解男兒居世各當努力䠞迫日暮殊不久留五解少小相觸抵寒苦常相隨忿恚安足諍吾中道與卿共别離約身奉事君禮節不可虧上慙倉浪之天下顧黄口小兒奈何復老心皇皇獨悲誰能知少小下為趨曲前為豔右一曲晉樂所奏飛來雙白鵠宋吴邁逺可憐雙白鵠雙雙絶塵氛連翩弄光景交頸遊青雲逢羅復逢繳雌雄一旦分哀聲流海曲孤呌出江濆豈不慕前侣為爾不及羣步歩一零淚千里猶待君樂哉新相知悲來生别離持此百年命共逐寸隂移譬如空山草零落心自知出一作絶又作去來一作矣飛來雙白鶴梁元帝紫葢學仙成能令吴市傾逐舞隨踈節聞琴應別聲集田遥赴影隔霧近相鳴時從洛浦渡飛向遼東城同前陳後主朔吹已蕭瑟愁雲屢合開𤣥冬辛苦地白鶴從風催音響已清切毛羽復殘摧飛來進闕但為失雙回儻逢闕噲徳當共銜珠來同前隋虞世南飛來雙白鶴奮翼逺凌煙雙棲集紫葢一舉背青田颺影過伊洛流聲入管絃鳴羣倒景外刷羽閬風前映海疑浮雪拂澗瀉飛泉燕雀寧知去蜉蝣不識還何言别儔侣從此間山川顧步已相失徘徊各自憐危心猶警露哀響詎聞天無因振六翮輕舉復隨仙今日樂相樂陳江總綺殿文雅遒玳筵歡趣宻鄭態逶迤舞齊弦窈窕瑟金罍送縹觴玉井沈朱實願此北堂宴長奉南山日豔歌行古今樂録行豔歌行非一有直云豔歌即豔歌行技録云豔歌雙鴻行豔歌福鍾行荀錄所載不傳豔歌羅敷行相和中歌之今不歌古辭翩翩堂前燕冬藏夏來見兄弟兩三人流宕在他縣故衣誰當補新衣誰當綻賴得賢主人覽取為吾綰夫婿從門來斜柯西北盼語卿且勿盼水清石自見石見何纍纍逺行不如歸誰當一作誰為同前古辭南山石嵬嵬松柏何離離上枝拂青雲中心十數圍洛陽發中梁松柏竊自悲斧鋸截是松松樹東西摧持作四輪車載至洛陽宫觀者莫不歎問是何山材誰能刻鏤此公輸與魯班被之用丹漆薰用蘇合香本自南山松今為宫殿梁同前宋江夏王義恭江南遊湘妃窈窕漢濵女淑問流古今蘭音媚鄭楚瑶顔映長川善服照通滸求思望襄澨歎息對衡渚中情未相感搔首増企子悲鴻失良匹俯仰戀儔侣徘徊忘寢食羽翼不能舉傾首佇春燕為我津辭語同前二首前首玉臺作有女篇後首集云豔歌曲梁簡文帝凌晨光景麗倡女鳯樓中前瞻削成小傍望巻旌空分粧開淺靨繞臉傅斜紅張琴未調軫飲吹不全終自知心所愛出入仕秦宫誰言連尹屈更是莫敖通輕軺綴皂葢飛轡轢雲驄金鞍隨繫尾銜璅映纒騣戈鏤荆山玉劒飾丹陽銅左把蘇合彈傍持大屈弓控弦因鵲血挽彊用牛螉弋獵多登隴酣歌毎入豐暉暉隠落日冉冉還房櫳燈生陽燧火塵散鯉魚風流蘇時下帳象簟復韜筒霜暗牕前栁寒踈井上桐女蘿託松際甘𤓰蔓井東拳拳恃君寵嵗暮望無窮雲楣桂成户飛棟杏為梁斜牕通蕊氣細隟引塵光裁衣魏后尺汲水淮南牀青驪暮當返預使羅裙香同前三首陳顧野王夕臺行雨度朝梁照日輝東城採桑返南市數錢歸長歌挑碧玉羅塵笑洛妃欲知歡未盡栖烏已夜飛齊倡趙女盡妖妍珠簾玉砌併神仙莫笑人來最落後能使君恩得度前豈知洛渚羅塵步詎减天河秋夕渡妖姿巧笑能傾城那思他人不憎妬蓮花藻井推芰荷採菱妙曲勝陽阿燕姬妍趙女麗出入王宫公主第倚鳴瑟歌未央調弦八九弄度曲兩三章唯欣春日永詎愁秋夜長歌未央倚鳴琴輕風飄落蘂乳燕巢蘭室結羅帷翫朝日牕開翠幔巻粧罷金星出争攀四照花競戲三條術豔歌行有女篇晉傅𤣥有女懷芬芳媞媞步東廂蛾眉分翠羽明眸發清揚丹唇翳皓齒秀色若珪璋巧笑露權靨衆媚不可詳令儀希世出無乃古毛嬙頭安金步揺耳繫明月璫珠環約素腕翠羽垂鮮光文袍綴藻黼玉體映羅裳容華既已豔志節擬秋霜徽音冠青雲聲響流四方妙哉英媛徳宜配矦與王靈應萬世合日月時相望媒氏陳束帛羔鴈鳴前堂百兩盈中路起若鸞鳳翔凡夫徒踴躍望絶殊參商頭安金步揺一作首戴金步揺徽一作微煌煌京洛行五解煌古今樂録曰王僧䖍技錄云煌京洛行歌文帝園桃一篇樂府解題曰晉樂奏文帝夭夭園桃魏文帝夭夭園桃無子空長虚美難假偏輪不行一解淮隂五刑鳥得弓藏保身全名獨有子房大憤不收褒衣無帶多言寡誠秪令事敗二解蘇秦之說六國以亡傾側賣主車裂固當賢矣陳軫忠而有謀楚懷不從禍卒不救三解禍夫吴起智小謀大西河何健伏尸何劣四解嗟彼郭生古之雅人智矣燕昭可謂得臣峨峨仲連齊之髙士北辭千金東蹈滄海五解樂右一曲晉所奏同前二首集云代陳思王京洛行後首一作梁簡文宋鮑照鳳樓十二重四户八綺牕繡桷金蓮花桂柱玉盤龍珠簾無隔路羅幌不勝風寶帳三千所為爾一朝容揚芬紫烟上垂綵綠雲中春吹回白日霜歌落塞鴻但懼秋塵起盛愛逐衰蓬坐視青苔滿卧對錦筵空琴瑟縱横散舞衣不復縫古來共歇薄君意豈獨濃唯見雙黄鵠千里一相從南遊偃師縣斜上霸陵東迴瞻龍首堞遥望徳陽宫重門逺照耀天閣復穹隆城旁疑複道樹裏識松風黄河入洛水丹泉繞射熊夜輪懸素魄朝光蕩碧空秋霜曉驅鴈春雨暮成虹曲陽造甲第髙安還禁中劉蒼歸作相竇憲出臨戎此時車馬合兹晨冠葢通誰知兩京盛歡宴遂無窮河一作沙光一作天誤暮一作暗同前梁戴暠欲知佳麗地為君陳帝京由來稱俠窟争利復争名鑄銅門外馬刻石水中鯨黑龍過飲渭丹鳳俯臨城羣公邀郭解天子問黄瓊詔幸平陽地騎指伏波營五矦同拜爵七䝿各垂纓衣風飄颻起車塵暗浪生舞見淮南法歌聞齊后聲揮金留客坐饌玉待鐘鳴獨有文園客偏嗟武騎輕同前陳張正見千門儼西漢萬户擅東京凌雲霞上起鳷鵲月中生風塵暮不息簫筦夜恒鳴唯當賣藥處不入長安城同前集云京洛篇隋李巨仁京洛類神仙藹藹却雲煙漸臺臨太液玉樹並甘泉車喧平樂外騎擁濯龍前競結蕭朱綬争攀李郭船獨悲韓長孺死灰猶未然帝王所居篇郭本置襍曲歌辭今移補陳張正見崤函惟帝宅宛雒壯皇居紫㣲臨複道丹水亘通渠沈沈飛雨殿藹藹承明廬兩宫分槩日雙闕並凌虚休氣充青𤨏榮光入綺疏霞明仁夀鏡日照陵雲書鳴鸞背鳷鵲詔蹕幸儲胥長楊飛玉輦御宿徙金輿栁葉飄緹騎槐花影屬車薄暮歸平樂歌鐘滿玉除門有車馬客行古今樂録曰王僧䖍技録云門有車馬客行歌東阿王置酒一篇樂府解題曰曹植等門有車馬客行皆言問訊其客或得故舊郷里或駕自京師備叙市朝遷謝親友彫喪之意又門有萬里客亦與此同晉陸機門有車馬客駕言發故鄉念君久不歸濡跡涉江湘投袂赴門塗攬衣不及裳拊膺㩦客泣掩淚叙温涼借問邦族閒惻愴論存亡親友多零落舊齒皆凋喪市朝互遷易城闕或丘荒墳壟日月多松柏鬱芒芒天道信崇替人生安得長慷慨惟平生俛仰獨悲傷同前一作鮑照然此格調多是華作華詩別載小畧張華門有車馬客問君何鄉士捷步往相訊果得舊鄰里悽悽聲中情慊慊増下俚語昔有故悲論今無新喜清晨相訪慰日暮不能已歡戚競尋緒談調何終止辭端竟未究忽唱分塗始前悲尚未弭後戚方復起嘶聲盈我口談言在我耳手跡可傳心願爾篤行李得一作遇後戚一作感同前陳張正見飛觀霞光啓重門平旦開北闕髙箱過東方連騎來紅塵揚翠轂赭汗染龍媒桃花夾逕聚流水傍池回投鞭聊接電捐軫暫停雷非闗萬里客自有六奇才琴和朝雉操酒汎夜光杯舞袖飄金谷歌聲遶鳳臺良時不可再騶馭鬱相催安知太行道失路車輪摧投一作揮接一作静同前英華作何遜隋何妥門前車馬客言是故鄉來故鄉有書信縱横印檢開開書看未極行客屢相識借問故鄉人潺湲淚不息上言離别久下道望應歸寸心將夜鵲相逐向南飛道一作言同前虞世南財雄重交結戚里擅豪華曲臺臨上路髙門抵狹斜赭汗千金馬繡轂五香車白鶴隨飛葢朱鷺入鳴笳夏蓮開劒水春桃發露花輕裙染囘雪浮蟻汎流霞髙談辯飛兎摛藻握靈蛇逢恩借羽翼失路委泥沙曖曖風煙晩路長歸騎逺日袤青𤨏第塵飛金谷苑危弦促柱奏巴渝遺簮墮珥解羅襦如何守直道翻使谷名愚門有萬里客魏陳思王植門有萬里客問君何鄉人褰裳起從之果得心所親挽裳對我泣太息前自陳本自朔方士今為吳越民行行將復行去去適西秦牆上難為趨古今樂錄曰王僧䖍技録云牆上難為趨行荀錄所載牆上一篇今不傳晉傅𤣥門有車馬客驂服若騰飛華組結玉佩蘩藻紛葳蕤馮軾垂長纓顧盼有餘輝貧生屣敝履整此藍縷衣客曰嘉病乎正色意無疑吐言若履氷揺舌不可追渭濵漁釣翁乃為周所諮顔回處陋巷大聖稱庶幾茍富不知度千駟賤采薇季孫由儉顯管仲病三歸夫差耽淫侈終為越所圍遺身外榮利然後享巍巍迷者一何衆孔難知徳希甚美致憔悴不如豚豕肥楊朱泣路岐失道令人悲子貢欲自矜原憲知其非屈伸各異勢窮達不同資夫唯體中庸先天天不違同前周王褒昔稱梁孟子兼聞魯孔丘訪政聊為述問陳豈相詶末代多僥倖卿相自經由臺郎百金價台司千萬求當朝少直筆趨代皆曲鈎廷尉十年不得調將軍百戰未封矦夜伏擁門作常伯自有蒲萄得涼州白璧求善價明珠難暗投髙牆不可踐井水自難浮風胡有年嵗銛利比吳鈎日重光行古今樂録曰王僧䖍技錄有日重光行今不傳崔豹古今注曰日重光月重輪羣臣為漢明帝作也明帝為太子樂人作歌詩四章以贊太子之徳一曰日重光三曰月重輪三曰星重輝四曰海重潤漢末喪亂後二章亡舊說云天子之徳光明如日䂓輪如月衆輝如星霑潤如海太子比徳故云重也晉陸機日重光奈何天回薄日重光冉冉其遊如飛征日重光今我日華華之盛日重光倐忽過亦安停日重光盛往衰亦必來日重光譬如四時固恒相催日重光惟命有分可營日重光但惆悵才志日重光身沒之後無遺名但一作常月重輪行魏文帝三辰垂光照臨四海煥哉何煌煌悠悠與天地久長愚見目前聖覩萬年明闇相絶何可勝言同前魏明帝天地無窮人命有終立功揚名行之在躬聖賢度量得為道中同前晉陸機人生一時月重輪盛年焉可持月重輪吉凶倚伏百年莫我與期臨川曷悲悼兹去不從肩月重輪功名不勗之善哉古人揚聲敷聞九服身名流何穆既自才難既嘉運亦易愆俛仰行老存沒將何所觀志士慷慨獨長歎獨長歎持一作恃一無所字同前初學記作戴嵩梁戴暠皇基屬明兩副徳表重輪重輪非是暈桂滿自恒春海珠舍更滅階蓂翳且新婕妤比團扇曹王譬洛神浮川疑滚璧入户類燒銀從來看顧兎不曽聞鬬麟北堂豈盈手西園偏照人滚一作讓蜀道難二首古今樂録曰王僧䖍技録有蜀道難行今不歌樂府解題曰蜀道難備言銅梁玉壘之阻與蜀國絃頗同梁簡文帝建平督郵道魚復永安宫若奏巴渝曲時當君思中巫山七百里巴水三回曲笛聲下復髙猿啼㫁還續同前一首文苑英華辨證曰此篇文苑與類聚同唯郭氏樂府分前五言後七言各為一首中闕六句今從文苑為一首劉孝威玉壘髙無極銅梁不可攀雙流逆巘道九坂澀陽闗鄧矦束馬去王生歛轡還歛轡懼身尤叱馭奉王猷若恡千金重誰為萬里矦獻馬吞珠界揚舲濯錦流沈犀厭怪水握鏡表靈丘禺山金碧有光輝遷停車馬正輕肥彌思王褒擁節反復憶相如乘傳歸君平子雲寂不嗣江漢英靈已信稀巘一作巇停一作亭正一作尚復一作更寂一作聞已信稀一作信已衰同前陳隂鏗王尊奉漢朝靈闗不憚遥髙岷長有雪隂棧屢經燒輪摧九折路騎阻七星橋蜀道難如此功名詎可要櫂歌行五解歌古今樂録曰王僧䖍技録云櫂歌行明帝王者布大化一篇或云左延年作今不歌梁簡文帝在東宫更製歌少異此也樂府解題曰晉樂奏魏明帝辭云王者布大化備言平吴之勲魏明帝王者布大化配乾稽后祇陽育則隂殺晷景應度移一解文徳以時振武功伐不隨重華儛干戚有苗服從媯二解蠢爾吴蜀虜憑江棲山阻哀哀王士民瞻仰靡依怙三解皇上悼愍斯宿昔奮天怒發我許昌宫列舟于長浦四解翌日乘波揚棹歌悲且涼太常拂白日旗幟紛設張五解將抗旄與鉞曜威於彼方伐辠以弔民清我東南疆將抗下為趨吴右一曲晉樂所奏蜀一作吴中同前晉陸機遲遲暮春日天氣柔且嘉元吉隆初已濯穢遊黄河龍舟浮鷁首羽旗垂藻葩乘風宣飛景逍遥戲中波名謳激清唱榜人從櫂歌投綸沈洪川飛繳入紫霞從一作縱同前宋孔寗子君子樂和節品物待陽時上位降繁祉元已命水嬉倉武戒橋梁旄人樹羽旗髙檣抗飛帆羽葢翳華枝佽飛激逸響娟娥吐清辭泝洄緬無分欣流愴有思仰瞻翳雲繳俯引沈泉絲委羽漫通渚鮮染中填坻鷁鳥威江使揚波駭馮夷夕影雖已西闕終無期同前鮑照羇客離嬰時飄颻無定所昔秋寓江介兹春客河滸往戢于役身願令永懷楚泠泠鯈疏潭邕邕鴈循渚飂唳長風振遥曳髙帆舉驚波無留連舟人不躊竚兹一作今遥曳一作飄遥同前吴邁逺十三為漢使孤劒出臯蘭西南窮天險東北畢地闗岷山髙以峻燕水清且寒一去千里孤邉馬何時還遥望煙嶂外障氣鬱雲端始知身死處平生從此殘同前梁簡文帝妾家住湘川菱歌本自便風生解刺浪水深能捉船葉亂由牽荇絲飄為折蓮濺粧疑薄汗霑衣似故湔浣沙流暫濁汰錦色還鮮參同趙飛燕借問李延年從來入絃管誰在櫂歌前誰一作詎同前劉孝綽日暮楚江上江深風復生所思竟何在相望徒盈盈舟子行催棹無所喝流聲同前阮研芙蓉始出水綠荇葉初鮮且停白雪和共奏激楚絃平生此遭遇一日當千年同前王籍揚舲横大江乘流任蕩蕩輕橈莫不息復逐夜潮上時見湘水仙恒聞解佩響同前蕭岑桂酒既潺湲輕舟亦乘駕鼓枻何吟吟吟我皇唐化容與滄浪中淹留明月夜同前北齊魏收雪溜添春浦花水足新流桃發武陵岸栁拂武昌樓同前隋盧思道秋江見底清越女復傾城方舟共採摘最得可憐名落花流寶珥微吹動香纓帶垂連理濕櫂舉木蘭輕順風傳細語因波寄逺情誰能結錦纜薄暮隠長汀順風一作避人蒲坂行古今樂録曰王僧䖍技録有蒲坂行今不歌通典曰河東唐虞所都蒲坂也漢為蒲坂縣春秋時秦晉戰於河曲即其地齊陸厥江南風已春河間栁已把鴈返無南書寸心何由寫流泊祁連山飄颻髙闕下同前梁劉遵漢使出蒲坂去去往交河間諜敢虧對驂馬脫鳴珂乍作渡瀘怨何辭上隴歌白楊行古今樂録曰王僧䖍技録有白楊行今不歌晉傅𤣥青雲固非青當雲奈白雲驥從西北馳來吾何憶驥來對我悲鳴舉頭氣凌青雲當奈此驥正龍形踠足蹉跎長坡下蹇驢慷愾敢與我争馳躑躅鹽車之中流汗兩耳盡下垂雖懷千里之逸志當時一得施白雲彯彯舍我髙翔青雲徘徊戢我愁啼上眄増崖下臨清池日欲西移既來歸君君不一顧仰天太息當用生為青雲乎飛時悲當奈何耶青雲飛乎古樂苑巻二十一
