body:
  text: 古樂苑卷八明梅鼎祚編鼓吹曲辭鼓吹曲一曰短簫鐃歌劉瓛定軍禮曰鼓吹未知其始也漢班一雄朔野而有之矣鳴笳以和簫聲非八音也騷人云鳴箎吹竽是也宋書樂志曰鼓吹蓋短簫鐃歌蔡雍曰軍樂也黃帝歧伯所作以揚德建武勸士諷敵也周官曰師有功則愷樂左傳曰晉文公勝楚振旅凱而入司馬法曰得意則愷樂愷歌雍門周說孟嘗君鼓吹于不測之淵說者云鼓自一物吹自竽籟之屬非簫鼓合奏别為一樂之名也然則短簫鐃歌此時未名鼓吹矣應劭漢鹵簿圖惟有騎執箛箛即笳不云鼓吹而漢世有黃門鼓吹漢享宴食舉樂十三曲與魏世鼓吹長簫同長簫短簫伎録竝云絲竹合作執節者歌又建初録云務成黃爵𤣥雲逺期皆騎吹曲非鼓吹曲此則列於殿庭者為鼓吹今之從行鼓吹為騎吹二曲異也又孫權觀魏武軍作鼓吹而還此又應是今之鼓吹魏晉世又假諸將帥及牙門曲蓋鼓吹斯則其時謂之鼓吹矣魏晉世給鼓吹甚輕牙門督將五校悉有鼓吹晉江左初臨川太守謝摛每寢輒夢聞鼓吹有人為其占之曰君不得生鼓吹當得死鼓吹爾摛擊杜韜戰沒追贈長水校尉葬給鼓吹焉謝尚為江夏太守詣安西將軍庾翼於武昌咨事翼與尚射曰卿若破的當以鼓吹相賞尚射破的便以其副鼓吹給之今則甚重矣西京雜記曰漢大駕祠甘泉汾隂僃千乘萬騎有黃門前後部鼓吹則不獨列於殿庭者名鼓吹也漢逺如期曲辭有雅樂陳及增壽萬年等語無馬上奏樂之意則逺期又非騎吹曲也晉中興書曰漢武帝時南越加置交趾九真日南合浦南海鬱林蒼梧七郡皆假鼓吹東觀漢記曰建初中班超拜長史假鼓吹麾幢則短簫鐃歌漢時巳名鼓吹不自魏晉始也崔豹古今注曰漢樂有黃門鼓吹天子所以宴樂羣臣也短簫鐃歌鼓吹之一章爾亦以賜有功諸侯齊武帝時壽昌殿南閣置白鷺鼓吹二曲以為宴樂隋志陳後主常遣宫女習北方簫鼓謂之代北酒酣則奏之此又施於燕私矣古今樂録有梁陳時宫懸圖四隅各有鼓吹樓而無建鼓鼓吹樓者昔蕭史吹簫於秦秦人為之築鳳臺故鼓吹陸則樓車水則樓船其在庭則以簨簴為樓也梁又有鼓吹熊羆十二按其樂器有龍頭太棡鼓中鼓獨揭小鼓亦隨品秩給賜焉周武帝每元正大㑹以梁按架列於懸間與正樂合奏隨又於按下設熊羆貙豹騰倚承之以象百獸之舞楊慎升菴詞品曰鼓吹曲其昉黃帝記里鼓之制乎後世有鼓吹騎吹雲吹之名建初録云列於殿廷者名鼓吹列於行駕者名騎吹又云鼓吹陸則樓車水則樓船其在庭則以簨簴為樓水行則謂之雲吹朱鷺臨高臺諸篇則鼓吹曲務成黃爵則騎吹曲水調河傳則雲吹曲宋之問詩稍看朱鷺轉尚識紫騮驕此言鼓吹也謝朓詩鳴笳翼高蓋疊鼓送華輈此言騎吹也梁簡文詩廣水浮雲吹江風引夜衣此言雲吹也郭茂倩左克明竝曰鼓吹短簫鐃歌與橫吹曲得通名鼓吹但所用異耳漢有朱鷺等二十二曲列於鼓吹謂之鐃歌及魏受命使繆襲改其十二曲而君馬黃雉子班聖人出臨高臺逺如期石留務成𤣥雲黃爵釣竿十曲竝仍舊名是時吳亦使韋昭改製十二曲其十曲亦因之而魏吳歌辭存者唯十二曲餘皆不傳晉武帝受禪命傅𤣥製二十二曲而𤣥雲釣竿之名不改舊漢宋齊竝用漢曲又充庭十六曲梁高祖乃去其四留其十二更制新歌合四時也北齊二十曲皆改古名其黃爵釣竿略而不用後周憲帝革前代鼓吹制為十五曲竝述功德受命以相代隋制列鼓吹為四部漢鐃歌漢鼓吹鐃歌十八曲一曰朱鷺二曰思悲翁三曰艾如張四曰上之回五曰擁離六曰戰城南七曰巫山高八曰上陵九曰將進酒十曰君馬黃十一曰芳樹十二曰有所思十三曰雉子班十四曰聖人出十五曰上邪十六曰臨高臺十七曰逺如期十八曰石留又有務成𤣥雲黃爵釣竿亦漢曲也其辭亡或云漢鐃歌二十二無釣竿古今樂録曰漢鐃歌皆聲辭艷相雜不復可分沈約云樂人以音聲相傳訓詁不可復解凡古樂録皆大字是辭細字是聲聲辭合寫故致然耳藝苑巵言曰鐃歌中有難解及迫詰屈曲者如絲如魚乎悲矣堯羊蜚從王孫行之類或謂有缺文斷簡妃呼豨收中吾之類或謂曲調之遺聲或謂兼正辭填調大小混録至有直以為不足觀者巫山高芝為車非三言之始乎臨高臺以軒桂樹雙珠青絲玳瑁非五言之神足乎駕六飛龍四時和江有香草目以蘭黃鵠高飛離哉翻非七言之妙境乎其誤處既不能曉佳處又不能識以為不足觀宜也朱鷺隋書樂志曰建鼓殷所作又棲翔鷺於其上不知何代所加或曰鵠也取其聲揚而逺聞也或曰鷺鼓精也或曰皆非也詩云振振鷺鷺于飛鼓咽咽醉言歸言古之君子悲周道之衰頌聲之息飾鼓以鷺存其風流孔穎達曰楚威王時有朱鷺合沓飛翔而來舞舊鼓吹朱鷺曲是也漢曲蓋因飾鼓以鷺而名曲焉丹鉛續録曰朱鷺曲解云因飾鼓以鷺而名曲又云朱鷺呪鼓飛於雲末徐陵詩有鳬鍾鷺鼓之句宋之問詩稍看朱鷺轉尚識紫騮驕皆用此事益鷺色本白漢初有朱鷺之瑞故以鷺形飾鼓又以朱鷺名鼓吹曲也梁元帝放生池碑云𤣥龜夜夢終見取於宋王朱鷺晨飛尚張羅於漢后與朱鷺飛雲末事相叶可以證補樂府解題之缺古辭朱鷺魚以烏路訾邪鷺何食食茄下不之食不以吐將以問誅者誅一作諫升菴詩話曰朱鷺魚以烏鷺何食食茄下烏古與雅同叶音作雅蓋古字烏也鴉也雅也本一字也雅與下相叶始得其音魚以雅者言朱鷺之威儀魚魚雅雅也韓文元和聖德詩魚魚雅雅本此丹鉛四録曰茄音荷𤣥中記黃帝之臣有荆茄豐左傳注楚有茄人城張楫音荷藝苑巵言曰烏轉為鴉鴉轉為雅茄下當作荷莖思悲翁思悲翁唐思奪我美人侵以遇悲翁也但我思蓬首狗逐狡兔食交君梟子五梟毌六拉沓高飛暮安宿首一作蕞艾如張艾與刈同說文云艾草也如讀為而榖梁傳曰艾蘭以為防置旃以為轅門謂因搜狩以習武事也蘭香草也言艾草以為田之大防是也艾而張羅夷於何行成之四時和山出黃雀亦有羅雀以高飛奈雀何為此倚欲誰肯礞室上之回漢書曰孝武十四年胸奴入朝那蕭關遂至彭陽使騎兵入燒回中宫候騎至雍甘泉回中地在安定其中有宫也武帝紀元封四年冬十月行幸雍祠五畤通回中道遂北出蕭關吳競樂府解題曰漢武通回中道後數出遊幸焉沈建廣題曰漢曲皆美當時之事按石關宫闕名近甘泉宫相如上林賦蹶石關歷封巒是也上之回所中益夏將至行將北以承甘泉宫寒暑德游石關望諸國月支臣胸奴服令從百官疾驅馳千秋萬歲樂無極翁離一曰擁離又曰雍離􅗙離趾中可築室何用葺之蕙用蘭􅗙離趾中戰城南戰城南死郭北野死不葬烏可食為我謂烏且為客豪野死諒不葬腐肉安能去子逃水深激激蒲葦冥冥梟騎戰鬬死駑馬裴回鳴梁築室何以南梁何北禾黍不穫君何食願為忠臣安可得思子良臣良臣誠可思朝行出攻暮不夜歸不穫宋書作而穫巫山高樂府解題曰古辭言江淮水深無梁可度臨水逺望思歸而巳又有演巫山高不詳所起巫山高高以大淮水深難以逝我欲東歸害梁不為我集無高曳水何梁湯湯回回臨水逺望泣下霑衣逺道之人心思歸謂之何上陵古今樂録曰漢章帝元和中有宗廟食舉六曲加重來上陵二曲為上陵食舉後漢書禮儀志曰正月上丁祠南郊次北郊明堂高廟世祖廟謂之五供禮畢以次上陵西都舊有上陵東都之儀太官上食太常樂奏食舉古辭大略言神仙事不知與食舉曲同否上陵何美美下津風以寒問客從何來言從水中央桂樹為君船青絲為君笮木蘭為君櫂黃金錯其間滄海之雀赤翅鴻白鴈隨山林乍開乍合曾不知日月明醴泉之水光澤何蔚蔚芝為車龍為馬覽遨遊四海外甘露初二年芝生銅池中仙人下來飲延壽千萬歲將進酒樂府解題曰古辭將進酒乘大白大略以飲酒放歌為言將進酒乘大白辨加哉詩審博放故歌心所作同隂氣詩悉索使禹良工觀者苦加一作佳博宋書作搏記曰不學博依不能安詩博為是君馬黃君馬黃臣馬蒼二馬同逐臣馬良易之有騩蔡有赭美人歸以南駕車馳馬美人傷我心佳人歸以北駕車馳馬佳人安終極芳樹芳樹日月君亂如於風芳樹不上無心溫而鵠三而為行臨蘭池心中懷我悵心不可匡目不可顧妬人之子愁殺人君有他心樂不可禁王將何以如孫如魚乎悲矣愁宋書作悲以一作似有所思古今樂録漢太樂食舉第七曲亦用之不知與此同否有所思乃在大海南何用問遺君雙珠玳瑁簪用玉紹繚之聞君有它心拉雜摧燒之摧燒之當風揚其灰從今巳往勿復相思相思與君絶雞鳴狗吠兄嫂當知之妃呼豨秋風肅肅晨風颸東方須㬰高知之談藝録曰樂府中有妃呼豨伊阿那諸語本自亡義但補樂中之音雉子班雉子班如此之干雉梁無以吾翁孺雉子知得雉子高蜚止黃鵠蜚之以重王可思雄來蜚從雌視子趨一雉雉子車大駕馬騰被王送行所中堯羊蜚從王孫行聖人出聖人出隂陽和美人出遊九河佳人來騑離哉何駕六飛龍四時和君之臣明護不道美人哉宜天子免甘星筮樂甫始美人子含四海上邪一作雅上邪我欲與君相知長命無絶衰山無陵江水為竭冬靁震震夏雨雪天地合乃敢與君絶臨高臺臨高臺以軒下有清水清且寒江有香草目以蘭黃鵠高飛離哉翻關弓射鵠令我主壽萬年收中吾劉履云收中吾三字其義未詳疑曲調之餘聲如樂録所謂羊無夷伊那阿之類逺如期一曰逺期宋書樂志有晚芝曲沈約言舊史云詁不可解疑是漢逺期曲也古今樂録云漢大樂食舉曲有逺期至魏省之逺如期益如壽處天左側大樂萬歲與天無極雅樂陳佳哉紛單于自歸動如驚心虞心大佳萬人還來謁者引鄉殿陳纍世未嘗聞之增壽萬年亦誠哉石流宋書作石留以上宋書並冇曲字石流涼陽涼石水流為沙錫以微河為香向始􅀈冷將風陽北逝肯無敢與于揚心邪懷蘭志金安薄北方開留離蘭古樂苑卷八
