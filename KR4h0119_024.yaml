body:
  text: 古樂苑卷二十四明梅鼎祚編清商曲辭吳聲歌曲神弦歌吳聲歌曲二上聲歌八首古今樂録曰上聲歌者此因上聲促柱得名或用一調或用無調名如古歌辭所言謂哀思之音不及中和梁武因之改辭無復雅句晉宋齊辭齊一作梁儂本是蕭草持作蘭桂名芬芳頓交盛感郎為上聲郎作上聲曲柱促使弦哀譬如秋風急觸遇傷儂懷初歌子夜曲改調促鳴箏四座暫寂靜聽我歌上聲三鼓染烏頭聞鼓白門裏攬裳抱履走向冥不輕紀三月寒暖適楊栁可藏雀未言涕交零如何見君隔新衫繡兩襠迮著羅裳裏行步動微塵羅裙從風起襠一作端裳一作裙從一作隨裲襠與郎著反繡持貯裏汗汙莫濺浣持許相存在春月暖何太生裙迮羅襪曖曖日欲暝從儂門前過同前郭本作王金珠梁武帝花色過桃杏名稱重金瓊名歌非下里含笑作上聲歡聞歌古今樂録曰歡聞歌者晉穆帝升平初歌畢輒呼歡聞不以為送聲後因此為曲名今世用莎特乙子代之語稍訛異也迢遙天無柱流漂萍無根單身如螢火持底報郎恩迢郭作遙同前二首梁武帝豔豔金樓女心如玉池蓮持底報郎恩俱期遊梵天南有相思木合影復同心遊女不可求誰能息空隂一作識得音此首郭本作王金珠歡聞變歌歡聞變歌六首古今樂録曰歡聞變歌者晉穆帝升平中童子輩忽歌於道曰阿子聞曲終輒云阿子汝聞不無幾而穆帝崩褚太后哭阿子汝聞不聲既悽苦因以名之金瓦九重墻玉壁珊瑚柱中夜來相尋喚歡聞不顧歡來不徐徐陽窗都鋭户耶婆尚未眠肝心如推櫓張罾不得魚不櫓罾空歸君非鸕鷀鳥底為守空池刻木作斑鷦有翅不能飛搖著帆檣上望見千里磯鍥臂飲清血牛羊持祭天沒命成灰土終不罷相憐駛風何曜曜帆上牛渚磯帆作繖子張船如侣馬馳前溪歌七首宋書樂志曰前溪歌者晉車騎將軍沈玩所制郗昻樂府解題曰前溪舞曲也左云古辭苕溪漁隱叢話曰于兢大唐傳湖州德清縣南前溪村則南朝集樂之處今尚有數百家習音樂江南聲伎多自此出所謂舞出前溪者也復齊漫録言陳劉刪詩山邉歌落日池上舞前溪唐崔皓詩舞愛前溪妙歌憐子夜長按智匠古今樂録曰車騎將軍沈玩作前溪歌而非舞也蓋復齊不曽見于競大唐傳故不知舞出前溪耳晉沈玩憂思出門倚逄郎前溪度莫作流水心引新都捨故為家不鑿井擔瓶下前溪開穿亂漫下但聞林鳥啼前溪滄浪映通波澄渌清聲弦傳不絶千載寄汝名永與天地并逍遙獨桑頭北望東武亭黃瓜被山側春風感郎情逍遙獨桑頭東北無廣親黃瓜是小草春風何足歎憶汝涕交零黃葛結蒙籠生在洛溪邉花落隨流去何見逐流還還亦不復鮮隨流郭本作逐水何見逐流一作何當順流當又作嘗玉臺無末句黃葛生爛熳誰能斷葛根寧斷嬌兒乳不斷郎殷勤同前梁包明月當曙與未曙百鳥啼窗前獨眠抱被歎憶我懷中儂單情何時雙阿子歌三首宋書樂志曰阿子歌者亦因升平初歌云阿子汝聞不後人演其聲為阿子歡聞二曲樂死曰嘉興人養鴨兒鴨兒既死因有此歌禾知孰是阿子復阿子念汝好顔容風流世希有窈窕無人雙春月故鴨啼獨雄顛倒落工知悅弦死故來相尋博野田草欲盡東流水又暴念我雙飛鳬飢渴常不飽同前梁王金珠可憐雙飛鳬飛集野田頭飢食野田草渴飲清河流丁督護歌六首一曰阿督護宋書樂志曰督護歌者彭城內史徐逵之為魯軒所殺宋高祖使府內直都護丁旿收斂殯埋之逵之妻高祖長女也呼旿至閣下自問斂送之事每問輒歎息曰丁督護其聲哀切後人因其聲廣其曲焉唐書樂志曰丁督護晉宋問曲也今歌是宋武帝所製云宋孝武帝督護北征去前鋒無不平朱門垂髙蓋永世揚功名洛陽數千里孟津流無極辛苦戎馬間别易㑹難得督護北征去相送落星墟帆檣如芒柳督護今何渠督護初征時儂亦惡聞許願作石尤風四面斷行旅聞歡去北征相送直瀆浦只有淚可出無復情可吐黃河流無極洛陽數千里轗軻戎旅間何由見歡子此首郭本作王金珠團扇郎樂府集曰晉中書令王珉好捉白團扇侍人謝芳姿歌之因以為名一說珉與嫂婢有愛情好甚篤嫂鞭撻過苦婢素善歌而珉好持白團扇嫂令芳姿歌一曲當赦之芳姿歌曰白團扇辛苦五流離是郎眼所見珉曰奈何遺却芳姿應聲又歌曰團扇復團扇許持自遮靣憔悴無復理羞與郎相見按古今樂録與後說同末云後人因而歌之但所言芳姿應聲又歌云白團扇憔悴非昔容羞與即相見郭氏從之然不作正録前載團扇復團扇一首玉臺作桃葉答團扇歌馮惟訥云團扇歌事本如此郭茂倩樂府所載犢車薄不乘四首乃晉宋古辭失其名氏楊慎以為芳姿本辭誤也晉謝芳姿白團扇辛苦五流連是郎眼所見白團扇憔悴非昔容羞與郎相見同前三首前二首樂府作古辭後首梁王金珠今從玉臺桃葉七寶畫團扇燦爛明月光餉郎却暄暑相憶莫相忘餉玉臺作與青青林中竹可作白團扇動搖郎玉手因風托方便團扇復團扇持許自遮靣憔悴無復理羞與郎相見同前四首無名氏犢車薄不乘步行耀玉顔逢儂都共語起欲著夜半團扇薄不搖窈窕搖蒲葵相憐中道罷定是阿誰非御路薄不行窈窕決橫塘團扇鄣白日面作芙蓉光白練薄不著趣欲著錦衣異色都言好清白為誰施同前梁武帝手中白團扇淨如秋團月清風任動生嬌香承意發一作嬌聲任意發七日夜女郎歌九首詩紀晉辭三春怨離泣九秋欣期歌駕鸞行日時月明濟長河長河起秋雲漢渚風涼發含欣出霄路可笑向明月金風起漢曲素月明河邉七章未成匹飛燕起長川燕一作鸞春離隔寒暑明秋暫一㑹兩歎別日長雙情若飢渴婉孌不終夕一別周年期桑蠶不作繭晝夜長懸絲靈匹怨離處索居隔長河𤣥雲不應雷是儂啼歎歌振玉下金階拭眼矚星蘭惆悵登雲軺悲恨兩情殫風驂不駕纓翼人立中庭簫管且停吹展我叙離情紫霞煙翠蓋斜月照綺窗銜悲握離袂易爾還年容長史變歌三首宋書樂志曰長史變歌者晉司徒左長史王廞臨敗所制左云古辭晉王廞出儂吳閶門清水緑碧色徘徊戎馬間求罷不能得日和狂風扇心故清白節朱門前世榮千載素忠烈朱桂結貞根芬芬溢帝庭凌霜不改色枝葉永流榮芬一作菲黃生曲三首詩紀晉辭黃生無誠信冥彊將儂期通夕出門望至曉竟不來崔子信桑條餒去都餒還為歡復催折命生絲髮間松柏葉青蒨石榴花葳蕤迮置前後事歡今定憐誰黃鵠曲四首列女傳曰魯陶嬰者少寡養幼孤魯人或聞其義將求焉嬰聞之恐不得免乃作黃鵠歌明巳之不更二庭也按黃鵠本漢橫吹曲名西曲襄陽樂略同首曲黃鵠參天飛半道鬱徘徊腹中車輪轉君知思憶誰黃鵠參天飛半道還哀鳴三年失羣侣生離傷人情黃鵠參天飛凝融爭風回髙翔入𤣥闕時復乘雲頽黃鵠參天飛半道還後渚欲飛復不飛悲鳴覓羣侣碧玉歌三首古苑曰碧玉歌者宋汝南王所作也碧玉汝南王妾名以寵愛之甚所以歌之按玉臺新詠載二首為孫綽作題云情人碧玉歌則又似不始宋矣左本古辭今姑仍郭氏之舊而各注孫綽梁武于曲下碧玉破瓜時郎為情顛倒芙蓉淩霜榮秋容故尚好碧玉小家女不敢攀貴德感郎千金意慙無傾城色玉臺作孫綽碧玉小家女不敢貴德攀感郎意氣重遂得結金蘭同前二首碧玉破瓜時相為情顛倒感郎不羞郎回身就郎抱感郎不羞郎一云感君不羞赧玉臺作孫綽杏梁日始照蕙席歡末極碧玉奉金杯渌酒助花色玉臺作梁武帝同前碧玉上宫妓出入千花林珠被玳瑁牀感郎情意深桃葉歌古今樂録曰桃葉歌者晉王子敬之所作也桃葉子敬妾名緣於篤愛所以歌之隋書五行志曰陳時江南盛歌王獻之桃葉詞云桃葉復桃葉渡江不用楫但渡無所苦我自迎接汝後隋晉王廣伐陳置將桃葉山下及韓㩦虎渡江大將任蠻奴至新亭以導北軍之應子敬獻之字也左克明云古辭今從玉臺王獻之作樂府集云桃葉獻之妾妹曰桃根今秦淮口有桃葉渡即其事古人載桃葉答獻之乃團扇歌蓋傳者誤也今按桃葉映紅花二首云是桃葉答歌晉王獻之桃葉復桃葉渡江不用楫但渡無所苦我自迎接汝藝文作我自來迎接桃葉復桃葉桃樹連桃根相憐兩樂事獨使我殷勤藝文作我纒綿同前左本作古辭今從彤管新編桃葉桃葉映紅花無風自婀娜春花映何限感君獨採我桃葉復桃葉渡江不待櫓風波了無常沒命江南渡長樂佳七首詩紀晉辭小庭春映日四角佩琳琅玉枕龍鬚席郎瞑首何當雎鳩不集林體潔好清流貞節曜竒世長樂戲汀洲鴛鴦翻碧樹皆以戲蘭渚寢食不相離長莫過時許欲知長樂佳中陵羅淑女媚蘭雙情諧欲知長樂佳中陵羅雎鳩美死兩心齊比翼交頸遊千載不相離偕情欣歡念長樂佳欲知長樂佳中陵羅背林前溪長相隨同前紅羅復斗帳四角垂珠璫玉枕龍鬚席郎眠何處牀歡好曲三首詩紀晉辭淑女總角時喚作小姑子空豔初春花人見誰不闕窈窕上頭歡那得及破瓜但看脫葉蓮何如芙蓉花逶迤總角年華豔星間月遙見情傾庭不覺喉中噦懊儂歌本一首古今樂録曰懊儂歌者晉石崇緑珠所作唯絲布澀難縫一曲而已後皆隆安初民間訛謡之曲宋少帝更制新歌三十六曲齊太祖常謂之中朝曲梁天監十一年武帝敦法雲改為相思曲宋書五行志曰晉安帝隆安中民間作懊惱曲其曲中有草生可攬結女兒可攬抱之言桓𤣥既篡居天位義旗以三月二日掃定京師𤣥之宫女及逆黨之家子女妓妾悉為軍賞東及甌越北流淮泗人皆有所穫焉時則草可結事則女可抱信矣晉緑珠絲布澀難縫令儂十指穿黃牛細犢車遊戲出孟律同前十三首無名氏江中白布帆烏布禮中帷潭如陌上鼓許是儂歡歸江陵去揚州三千三百里已行一千三所有二千在寡婦哭城頽此情非虛假相樂不相得抱恨黃泉下內心百際起外形空殷勤既就頽城感敢言浮花言我與歡相憐約誓底言者常歎負情人郎今果成詐我有一所歡安在深閣裏桐樹不結花何由得梧子長檣鐵鹿子布帆阿那起詫儂安在間一去三千里暫薄牛渚磯歡不下廷板水深沾儂衣白黑何在浣愛子好情懷傾家科理亂攬衣未結帶落托行人斷月落天欲曙能得幾時眠悽悽下牀去儂病不能言髮亂誰科理託儂言相思還君華豔去催送實情來山頭草歡少四靣風趣使儂顛倒懊惱奈何許夜聞家中論不得儂與汝華山畿一曲略同懊儂曲歌南齊書王敬則傳曰敬則繇功封尋陽郡公出為㑹稽太守明帝既多殺害自以髙武舊臣心懷憂恐諸子在都上遣敬則世子仲雄入東安慰之仲雄善彈琴當時新絶江左有蔡雍焦尾琴在主衣庫上敕五日一給仲雄仲雄於御前鼓琴作懊儂曲歌帝愈猜愧後敬則竟以反誅齊王仲雍常歎負情儂郎今果行許疑即前曲我與歡一首韻語陽秋又有後二句皆闕文也君行不淨心那得惡人題華山畿本曲一首古今樂録曰華山畿者宋少帝時懊惱一曲亦變曲也少帝時南徐一士子從華山畿往雲陽見客舍有女子年十八九悅之無因遂感心疾母問其故具以啓母母為至華山尋訪見女具說女聞感之因脫蔽膝令母密置其席下卧之當巳少日果差忽舉席見蔽膝而抱持遂吞食而死氣欲絶謂母曰葬時車載從華山度母從其意比至女門牛不肯前打拍不動女曰且待須史粧點沐浴既而出歌曰華山畿君既為儂死獨活為誰施歡若見憐時棺木為儂開棺應聲開女透入棺家人叩打無如之何乃合葬呼曰神女冡華山畿女華山畿君既為儂死獨活為誰施歡若見憐時棺木為儂開活一作生同前二十四首宋辭聞歡大養蠶定得幾許絲所得何足言奈何黑瘦為夜相思投壺不停箭憶歡作嬌時開門枕水渚三刀治一魚歷亂傷殺汝未敢便相許夜聞儂家論不持儂與汝懊惱不堪止上牀解要繩自經屏風裏啼著曙淚落枕將浮身沈被流去將懊惱石闕晝夜題碑淚常不燥别後常相思頓書千丈闕題碑無罷時奈何許所歡不在間嬌笑向誰緒隔津歎牽牛語織女離淚溢河漢歎一作歡啼相憶淚如漏刻水晝夜流不息著處多遇羅的的往年少豔情何能多無故相然我路絶行人斷夜夜故望汝一坐復一起黃昏人定後許時不來已摩可濃巷巷相羅截終當不置汝不能久長離中夜憶歡時抱被空中啼腹中如湯灌肝腸寸寸斷教儂底聊賴相送勞勞渚長江不應滿是儂淚成許奈何許天下人何限慊慊只為汝郎情難可道歡行豆挾心見荻多欲繞松上蘿願君如行雲時時見經過夜相思風吹窗簾動言是所歡來長鳴雞誰知儂念汝獨向空中啼腹中如亂絲憒憒適得去愁毒已復來讀曲歌八十九首宋書樂志曰讀曲歌者民間為彭城王義康所作也其歌云死罪劉領軍誤殺劉第四是也古今樂録曰讀曲歌者元嘉十七年袁后崩百官不敢作聲歌或因酒謙止竊聲讀曲細吟而已以此為名按義康被徙亦是十七年花叉芙蓉髻雙鬢如浮雲春風不知著好來動羅裙念子情難有已惡動羅裙聽儂入懷不紅藍與芙蓉我色與歡敵莫案石榴花歷亂聽儂摘千葉紅芙蓉照灼緑水邉餘花任郎摘慎莫罷儂蓮思歡久不愛獨枝蓮只惜同心藕打壞木棲牀誰能坐相思三更書石闕憶子夜啼碑奈何不可言朝看莫牛跡知是宿蹄㾗娑拖何處歸道逄播掿郎口朱脫去盡花叉復低昻所歡子蓮從胸上度刺憶庭欲死攬裳踱跣把絲織履故交白足露上知所所歡不見憐憎狀從前度思難忍絡罌語猶壺倒寫儂頓盡上樹摘桐花何梧枝枯燥迢迢空中落遂為梧子道桐花特可憐願天無霜雪梧子解千年栁樹得春風一低復一昻誰能空相憶獨眠度三陽玉臺載作獨曲折楊栁百鳥園林啼道歡不離口縠衫兩袖裂花叉鬢邉低何處分別歸西上古餘啼所歡子不與他人別啼是憶郎耳披被樹明燈獨思誰能忍欲知長寒夜蘭燈傾壺盡坐起歎汝好願他甘叢香傾筐入懷抱通髮不可料憔悴為誰睹欲知相憶時但看裙帶緩幾許逋舊作通誤憶歡不能食徘徊三路間因風覔消息朝日光景開從君良燕遊願如卜者策長與千嵗龜所歡子問春花可憐摘插兩襠裏芳萱初生時知是無憂草雙眉畫未成那能就郎抱百花鮮誰能懷春日獨入羅帳眠聞歡得新儂四支懊如垂鳥散放行路井中百翅不能飛憐歡敢喚名念歡不喚字連喚歡復歡兩誓不相棄奈何許石闕生口中銜碑不得語白門前烏帽白帽來白帽郎是儂良不知烏帽郎是誰初陽正二月草木鬱青青躡履步前園時物感人情青幡起御路緑栁䕃馳道歡贈玉樹箏儂送千金寶桃花落已盡愁思猶未央春風難期信託情明月光計約黃昏後人斷猶未來聞歡開方局已復將誰期自從别郎後卧宿頭不舉飛龍落藥店骨出只為汝日光沒巳盡宿鳥縱橫飛徙倚望行雲躞蹀待郎歸百度不一回千書信不歸春風吹楊栁華豔空徘徊音信濶弦朔方悟千里遙朝霜語白日知我為歡消合冥過藩來向曉開門去歡取身上好不為儂作慮五鼓起開門正見歡子度何處宿行還衣被有霜露本自無此意誰交郎舉前視儂轉邁邁不復來時言自我別歡後歡音不絶響茱茰持捻泥龕有殺子像家貧近店肆出入引長事郎君不浮華誰能呈實意念日行不遇道逄播掿郎查滅衣服壞白肉亦黯瘡歔欷暗中啼斜日照帳裏無油何所苦但使天明爾後有二首與此略同黃絲咡素琴泛彈弦不斷百弄任郎作唯莫廣陵散思歡不得來抱被空中語月沒星不亮持底明儂緒詐我不出門冥就他儂宿鹿轉方相頭丁倒欺人目歡但且還去遺信相參伺契兒向髙店須㬰儂自來欲行一過心誰我道相憐摘菊持飲酒浮華著口邉語我不遊行常常走巷路敗橋語方相欺儂那得度濶面行負情詐我言端的畫背作天圖子將負星歷君行負憐事那得厚相於麻紙語三葛我薄汝粗踈黃天不滅解甲夜曙星出漏刻無心腸復令五更畢打殺長鳴雞彈去烏臼鳥願得連暝不復曙一年都一曉空中人住在髙檣深閣裏書信了不通故使風往爾儂心常慊慊歡行由預情霧露隱芙蓉見蓮詎分明非歡獨慊慊儂意亦驅驅雙燈俱時盡奈許兩無由誰交彊纒綿常持罷作慮作生隱藕葉蓮儂在何處相憐兩樂事黃作無趣怒合散無黃連此事復何苦誰交彊纒綿常持罷作意走馬織懸簾薄情奈當駛執手與歡別合㑹在何時明燈照空局悠然未有期百憶却欲噫兩眼常不燥蕃師五鼓行離儂何太早合笑來向儂一抱不能置領後千里帶那頓誰多媚歡相憐今去何時來裲襠别去年不忍見分題歡相憐題心共飲血流頭入黃泉分作兩死計嬌笑來向儂一抱不能已湖燥芙蓉萎蓮汝藕欲死歡心不相憐慊苦竟何已芙蓉腹裏萎蓮汝從心起下帷掩燈燭明月照帳巾無油何所苦但使天明儂執手與歡別欲去情不忍餘光照巳藩坐見離日盡種蓮長江邉藕生黃蘖浦必得蓮子時流離經辛苦人傳我不虛實情明把納芙蓉萬層生蓮子信重沓聞乖事難懷况復臨别離伏龜語石板方作千嵗碑鈐蕩與時競不得尋傾慮春風扇芳條常念花落去坐倚無精魂使我生百慮方局十七道期㑹是何處暫出白門前楊栁可藏烏歡作沈水香儂作博山罏此亦見楊叛兒曲十期九不果常抱懷恨生然燈不下炷有油那得明自從近日來了不相尋博竹簾裲襠題知子心情薄下帷燈火盡朗月照懷裏無油何所苦但令天明爾近日蓮違期不復尋博子六籌翻雙魚都成罷去已一夕就郎宿通夜語不息黃蘖萬里路道苦真無極登店賣三葛郎來買丈餘合匹與郎去誰解斷粗踈儂亦粗經風罷頓葛帳裏敗許粗踈中紫草生湖邉悮落芙蓉裏色分都未獲空中染蓮子閨閣斷信使的的兩相憶譬如水上影分明不可得逍遙待曉分轉側聽更鼓明月不應停特為相思苦罷去四五年相見論故情殺荷不斷藕蓮心已復生辛苦一朝歡須㬰情易厭行膝點芙蓉深蓮非骨念慊苦憶儂歡書作後非是五果林中度見花多憶子吳聲讀曲南齊時朱碩仙善歌吳聲讀曲武帝出遊鍾山幸何美人墓碩仙歌帝神色不悅曰小人不遜弄我時朱子尚亦善歌後為一曲於是俱被賞賚齊朱碩仙二憶所歡時緣山破芿荏山神感儂意盤石鋭鋒動同前朱子尚曖曖日欲冥歡騎立踟蹰太陽猶尚可且願停須㬰春江花月夜二首晉書樂志曰春江花月夜玉樹後庭花堂堂並陳後主所作後主常與宫中女學士及朝臣相和為詩太常令何胥又善於文詠採其尤豔麗者以為此曲按此則隋煬是擬作隋煬帝暮江平不動春花滿正開流波將月去潮水帶星來帶玉臺作共夜露含花氣春潭漾月暉漢水逄遊女湘川值兩妃同前諸葛頴張帆渡栁浦結纜隱梅洲月色含江樹花影覆船樓玉樹後庭花隋書樂志曰陳後主於清樂中造黃鸝留及玉樹後庭花金叉兩鬢垂等曲與幸臣等製其歌辭綺豔相髙極於輕蕩男女唱和其音甚哀五行志曰禎明初後主作新歌辭甚哀怨令後宫美人習而歌之其辭曰玉樹後庭花花開不復久時人以歌䜟此其不久兆也南史曰後主張貴妃名麗華與龔孔二貴嬪王李二美人張薛二淑媛袁昭儀何倢妤江修容等並有寵乂以宫人袁大捨等為女學士每引賔客遊宴則使諸貴人女學士與狎客共賦新詩采其尤豔麗者以為曲調被以新聲選宫女干數歌之其曲有玉樹後庭花臨春樂等其略云璧月夜夜滿瓊樹朝朝新大抵皆美張貴妃孔貴嬪之容色按大業拾遺記壁月句益江總辭也陳後主麗宇芳林對髙閣新粧豔質本傾城映戶凝嬌乍不進出帷含態笑相迎妖姬臉似花含露玉樹流光照後庭泛龍舟隋書樂志曰煬帝大製豔篇辭極淫綺令樂正白明逹造新聲創萬嵗樂藏鉤樂七夕相逄樂舞席同心髻玉女行觴神仙留客擲磗續命斷雞子鬭百草泛龍舟還舊官長樂花十二時等曲掩抑摧藏哀音斷絶唐書樂志曰泛龍舟隋煬帝江都宫作隋書本紀曰大紫元年二月開通濟渠引河通淮造龍舟鳯䑵黃龍赤艦樓船等數萬艘八月上御龍舟幸江都舳艫相接二百餘里隋煬帝軸轤千里泛歸舟言旋舊鎮下揚州借問揚州在何處淮南江北海西頭六轡聊停御百丈暫罷開山歌棹謳詎似江東掌閒地獨自稱言鑑裏遊黃竹子歌唐李康成曰黃竹一歌江陵女歌皆今吳吳歌也詩紀列為晉辭江邉黃竹子堪作女兒箱一船使兩槳得娘還故鄉江陵女歌玉臺作隋煬帝雨從天上落水從橋下流拾得娘裙帶同心結兩頭神弦歌古今樂録曰神弦歌十一曲一曰宿阿二曰道君三曰聖郎四曰嬌女五曰白石郎六曰青溪小姑七曰湖就姑八曰姑恩九曰採蓮童十曰明下童十一曰同生按詩紀並載晉後左克明云古辭宿阿曲一曲蘇林開天門趙尊閉地户神靈亦道同真官今來下道君曲一曲中庭有樹自語梧桐推枝布葉聖郎曲一曲左亦不佯佯右亦不翼翼仙人在郎傍玉女在郎側酒無沙糖味為他通顔色嬌女詩二曲晉左思有嬌女詩未詳與此同否北遊臨河海遙望中菰菱芙蓉發盛華渌水清且澄弦歌奏聲節髣佛有餘音蹀躞越橋上河水東西流上有神仙居下有西流魚行不獨自三三兩兩俱神仙一作聖仙白石郎曲二曲白石郎臨江居前導江伯後從魚積石如玉列松如翠郎豔獨絶世無其二青溪小姑曲干寶搜神記曰廣陵蔣子文嘗為秣陵尉因擊賊傷而死吳孫權時封中都侯立廟鍾山異苑曰青溪小姑蔣侯第三妹也齊諧記所載趙文韶遇青溪神女事見後鬼詩開門白水側近橋梁小姑所居獨處無郎湖就姑曲一曲赤山湖就頭孟陽二三月緑蔽賁荇藪湖就赤山磯大姑大湖東仲姑居湖西姑恩曲二首明姑遵八風蕃謁雲日中前導陸離獸後從朱鳥麟鳯皇苕苕山頭柏冬夏葉不衰獨當被天恩枝葉華葳㽔採蓮童曲二曲泛舟採菱葉過摘芙蓉花如楫命童侣齊聲採蓮歌東湖扶菰童西湖採菱芰不持歌作樂為持解愁思明下童曲二曲走馬上前阪石子彈馬蹄不惜彈馬蹄但惜馬上兒陳孔驕赭白陸郎乘班騅徘徊射堂頭望門不欲歸同生曲二曲人生不滿百常抱千嵗憂早知人命促秉燭夜行遊隋書五行志曰周宣帝與宫人半夜連臂踏踶而歌自知身命促秉燭夜行遊即位二年崩嵗月如流邁行已及素秋蟋蟀鳴空堂感悵令人憂古樂苑卷二十四
