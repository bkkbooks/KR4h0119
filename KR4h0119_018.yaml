body:
  text: 古樂苑卷十八明梅鼎祚編相和歌辭清調曲清調曲二塘上行五解鄴都故事曰魏文帝甄皇后中山無極人袁紹據鄴與中子熙娶后為妻後太祖破紹文帝時為太子遂以后為夫人后為郭皇后所譛賜死臨終為詩樂府解題曰晉樂奏魏武帝蒲生篇而諸集録皆言甄后所作歎以讒訴見棄猶幸得新好不遺故惡焉今詳詩意蓋初見棄所作似非臨終詩也魏甄后蒲生我池中蒲生我池中其葉何離離傍能行人儀莫能縷自知衆口鑠黃金使君生别離一解念君去我時念君去我時獨愁常苦悲想見君顔色感結傷心脾今悉夜夜愁不寐二解莫用豪賢故莫用豪賢故棄捐素所愛莫用魚肉貴棄捐蔥與薤莫用麻枲賤棄捐菅與蒯三解倍恩者苦枯倍恩者苦枯蹶船常苦沒教君安息定慎莫致倉卒念與君一共離别亦當何時共坐復相對四解出亦復苦愁入亦復苦愁邊地多悲風樹木何蕭蕭今日樂相樂延年壽千秋五解書右一曲晉樂所奏宋每解首疊二句蒲生我池中其葉何離離傍能行仁義莫若妾自知衆口鑠黃金使君生别離念君去我時獨愁常苦悲想見君顔色感結傷心脾念君常苦悲夜夜不能寐莫以豪賢故棄捐素所愛莫以魚肉賤棄捐蔥與薤莫以麻枲賤棄捐菅與蒯出亦復苦愁入亦復苦愁邊地多悲風樹木何翛翛從軍致獨樂延年壽千秋右一曲本辭蒲生我池中緑葉何離離豈無蒹葭艾與君生别離念君去我時獨愁常苦悲想見君顔色感結傷心脾念君常苦意夜夜不能寐莫以豪賢故棄捐素所愛莫以魚肉賤棄捐蔥與薤莫以麻枲賤棄捐菅與蒯倍恩者苦枯蹶船常苦沒教君安息定慎莫致倉卒與君一别離何時復相對出亦復苦愁入亦復苦愁邊地多悲風樹木何欃欃從君致獨樂延年壽千秋同前沈約有江蘺生幽渚出此晉陸機江蘺生幽渚微芳不足宣被蒙風雲會移居華池邊發藻玉臺下垂影滄浪泉霑潤既已渥結根奧且堅四節逝不處繁華難久鮮淑氣與時殞餘芳隨風捐天道有遷易人理無常全男歡智傾愚女愛衰避妍不惜微軀退恆懼蒼蠅前願君廣末光照妾薄暮年雲一作雨泉一作淵同前宋謝惠連芳萱秀陵阿菲質不足營幸有忘憂用移根託君庭垂穎臨清池擢彩仰華甍霑渥雲雨潤葳㽔吐芳馨願君春傾葉留景惠餘明塘上行苦辛篇梁劉孝威蒲生伊何陳曲中多苦辛黃金坐銷鑠白玉遂淄磷裂衣工毁嫡掩袖切讒新嫌成迹易已愛去理難申秦雲猶變色魯日尚回輪妾歌已唱斷君心終未親蒲生行浮萍篇魏陳思王植浮萍寄清水隨風東西流結髮辭嚴親來為君子仇恪勤在朝夕無端獲罪尤在昔蒙恩惠和樂如瑟琴何意今摧穨曠若商與參茱茰自有芳不若桂與蘭新人雖可愛無若故所歡行雲有返期君恩儻中還慊慊仰天歎愁心將何訴日月不恆處人生忽若寓悲風來入懷淚下如垂露發篋造裳衣裁縫紈與素懷一作帷裳一作新蒲生行本集不載齊謝朓蒲生廣湖邊託身洪波側春露惠我澤秋霜縟我色根葉從風浪常恐不永植攝生各有命豈云智與力安得遊雲上與爾同羽翼蒲生我池中梁元帝池中種蒲葉葉影蔭池濱未好中宫薦行堪隱士輪為書聊可截匹栁復宜春瑞葉生苻苑鏤碧獻周人江蘺生幽渚一作塘上行梁沈約澤蘭被荒徑孤芳豈自通幸逢瑶池曠得與金芝叢朝承紫臺露夕潤緑池風既美修嫮女復恱繁華童夙昔玉霜滿旦暮翠條空葉飄儲胥右芳歇露寒東紀化尚盈昃俗志信穨隆財殫交易絶華落愛難終所惜改歡眄豈恨逐征蓬願回昭陽景持照長門宫持一作時秋胡行二首遊西京雜記曰魯人秋胡娶妻三月而宦三年休還家其婦採桑於郊胡至郊而不識其妻也見而恱之乃遺黃金一鎰妻曰妾有夫遊宦不返幽閨獨處三年于兹未有被辱於今日也採桑不顧胡慙而退至家問妻何在曰行採桑於郊未返既歸還乃向所挑之婦也夫妻並慙妻赴沂水而死列女傳曰魯秋潔婦者魯秋胡之妻也既納之五日去而宦於陳五年乃歸未至其家見路傍有美婦人方採桑而説之下車謂曰力田不如逢豐年力桑不如見國卿今吾有金願以與夫人婦曰探桑力作紡績織絍以供衣食奉二親養夫子已矣不願人之金秋胡遂去歸至家奉金遺母使人呼其婦婦至乃嚮採桑者也婦汙其行去而東走自投於河而死樂府解題曰後人哀而賦之為秋胡行若魏文帝辭云堯任舜禹當復何為亦題曰秋胡行曹植秋胡行但歌魏德而不取秋胡事與文帝辭同魏武帝晨上散關山此道當何難晨上散關山此道當何難牛頓不起車墮谷間坐盤石之上彈五弦之琴作為清角韻意中迷煩歌以言志晨上散關山一解有何三老公卒來在我傍有何三老公卒來在我傍負掩被裘似非恆人謂卿云何困苦以自怨徨徨所欲來到此間歌以言志有何三老公二解我居崑崙山所謂者真人我居崑崙山所謂者真人道深猶可得名山歷觀遨遊八極枕石潄流飲泉沈吟不決遂上升天歌以言志我居崑崙山三解去去不可追長恨相牽攀去去不可追長恨相牽攀夜夜安得寐惆悵以自憐正而不譎辭賦依因經傳所過西來所傳歌以言志去去不可追四解一猶一作有辭作乃願登泰華山神人共逺遊願登泰華山神人共逺遊經歷崑崙山到蓬萊飄颻八極與神人俱思得神藥萬嵗為期歌以言志願登泰華山一解天地何長久人道居之短天地何長久人道居之短世言伯陽殊不知老赤松王喬亦云得道得之未聞庶以壽考歌以言志天地何長久二解明明日月光何所不光昭明明日月光何所不光昭二儀合聖化貴者獨人不萬國率土莫非王臣仁義為名禮樂為榮歌以言志明明日月光三解四時更逝去晝夜以成嵗四時更逝去晝夜以成嵗大人先天而天弗違不戚年往憂世不治存亡有命慮之為蚩歌以言志四時更逝去四解戚戚欲何念歡笑意所之戚戚欲何念歡笑意所之壯盛智慧殊不再來愛時進趨將以惠誰泛泛放逸亦同何為歌以言志戚戚欲何念五解右二曲魏晉樂所奏同前三首魏文帝堯任舜禹當復何為百獸率舞鳳皇來儀得人則安失人則危唯賢知賢人不易知歌以詠言誠不易移鳴條之役萬舉必全明德通靈降福自天右曲一作歌魏德朝與佳人期日夕殊不來嘉肴不嘗旨酒停杯寄言飛鳥告余不能俯折蘭英仰結桂枝佳人不在結之何為從爾何所之乃在大海隅靈若道言貽爾明珠企豫望之步立躊躇佳人不來何得斯須右曲一作佳人期泛泛緑池中有浮萍寄身流波隨風靡傾芙蓉含芳菡蓞垂榮朝采其實夕佩其英采之遺誰所思在庭雙魚比目鴛鴦交頸有美一人婉如清揚知音識曲善為樂方右曲一作浮萍篇有美四句又見善哉行同前七首本集題云重作四言詩晉嵇康富貴尊榮憂患諒獨多富貴尊榮憂患諒獨多古人所懼豐屋蔀家人害其上獸惡網羅惟有貧賤可以無他歌以言之富貴憂患多貧賤易居貴盛難為工貧賤易居貴盛難為工耻佞直言與禍相逢變故萬端俾吉作凶思牽黃犬其計莫從歌以言之貴盛難為工其計莫從樂府作其莫之從勞謙寡悔忠信可久安勞謙寡悔忠信可久安天道害盈好勝者殘強梁致災多招禍患欲得安樂獨有無愆歌以言之忠信久安害一作惡多下一有事字役神者弊極欲疾枯役神者弊極欲疾枯顔回短折不及童烏縱體淫恣莫不早徂酒色何物今自不辜歌以言之酒色令人枯絶智棄學遊心於玄默絶智棄學遊心於玄默遇過而悔當不自得垂釣一壑所樂一國被髮行歌和者四塞歌以言之遊心於玄默思與王喬乘雲遊八極思與王喬乘雲遊八極凌厲五嶽忽行萬億授我神藥自生羽翼呼吸太和鍊形易色歌以言之思行遊八極之下一無思字徘徊鍾山息駕於層城徘徊鍾山息駕於層城上蔭華蓋下采若英受道王母遂升紫庭逍遙天衢千載長生歌以言之徘徊於層城同前二首後首題云和秋胡一云和班氏詩晉傅玄秋胡子娶婦三日會行仕宦既享顯爵保兹德音以祿頥親韞此黃金覩一好婦採桑路傍遂下黃金誘以逢卿玉磨逾潔蘭動彌馨源流潔清水無濁波奈何秋胡中道懷邪美此節婦髙行巍峩哀哉可愍自投長河秋胡納令室三日宦他鄉皎皎潔婦姿泠泠守空房燕婉不終夕别如參與商憂來猶四海易感難可防人言生日短愁者苦夜長百草揚春華攘腕採柔桑素手尋繁枝落葉不盈筐羅衣翳玉體回目流綵章君子倦仕歸車馬如龍驤精誠馳萬里既至兩相忘行人恱令顔借息此樹傍誘以逢卿喻遂下黃金裝烈烈貞女忿言辭厲秋霜長驅及居室奉金升北堂母立呼婦來歡情樂未央秋胡見此婦愓然懷探湯負心豈不慙永誓非所望清濁必異源鳬鳳不並翔引身赴長流果哉潔婦腸彼夫既不淑此婦亦太剛至一作去借一作情同前陸機道雖一致塗有萬端吉凶紛藹休咎之源人鮮知命命未易觀生亦何惜功名所歎同前九首集云秋胡詩文選不在樂府宋顔延之椅梧傾髙鳳寒谷待鳴律影響豈不懷自逺每相匹婉彼幽間女作嬪君子室峻節貫秋霜明豔侔朝日嘉運既我從欣願自此畢燕居未及好良人顧有違脫巾千里外結綬登王畿戒徒在昧旦左右來相依驅車出郊郭行路正威遲存為久離别沒為長不歸好五臣作歡嗟余怨行役三陟窮晨暮嚴駕越風寒解鞍犯霜露原隰多悲涼回飈卷髙樹離獸起荒蹊驚鳥縱橫去悲哉遊宦子勞此山川路超遙行人逺宛轉年運徂良時為此别日月方向除孰知寒暑積僶俯見榮枯嵗暮臨空房涼風起坐隅寢興日已寒白露生庭蕪時五臣作人勤役從歸願反路遵山河昔辭秋未素今也嵗載華蠶月歡時暇桑野多經過佳人從所務窈窕援髙柯傾城誰不顧弭節停中阿歡一作觀年往誠思勞路逺濶音形雖為五載别相與昧平生捨車遵往路鳬藻馳目成南金豈不重聊自意所輕義心多苦調密比金玉聲髙節難久淹朅來空復辭遲遲前途盡依依造門基上堂拜嘉慶入室問何之日暮行采歸物色桑榆時美人望昏至慙歎前相持采一作來有懷誰能已聊用申苦難離居殊年載一别阻河關春來無時豫秋至恆早寒明發動愁心閨中夜長歎慘悽嵗方晏日落遊子顔難補注作艱夜一作起髙張生絶絃聲急由調起自昔枉光塵結言固終始如何久為别百行愆諸已君子失明義誰與偕沒齒愧彼行露詩甘之長川泛心一作言同前二首宋謝惠連春日遲遲桑何萋萋紅桃含妖緑栁舒荑邂逅粲者遊渚戲蹊華顔易改良願難諧遊一作遵繫風捕影誠知不得念彼奔波意慮回惑漢女倐忽洛神飄揚空勤交甫徒勞陳王同前七首題云和南海王殿下詠秋胡妻不云樂府齊王融日月共為照松筠俱以貞佩分甘自逺結鏡待君明且協金蘭好方愈琴瑟情佳人忽千里空閨積思生空一作幽景落中軒坐悠悠望城闕髙樹升夕煙曽樓滿初月光隂非或異山川屢難越輟泣掩鉛姿搔首亂雲髮傾魄屬徂火搖念待方秋涼氣承宇結明熠傃階流三星亦虛映四屋慘多愁思君如萱草一見乃忘憂杼軸鬱不諧契濶迷新故朔風欄上發寒鳥林間度客逺乏衣裘嵗晏饒霜露參差興别緒依遲起離慕杼軸一作襟袖遲一作違願言如可信行邁亦云反睇景不告勞瞻途寧遽逺何以淹歸轍蠶妾事春晚送目亂前華馳心迷舊婉椒佩容有結振芳岐路隅黃金徒以賦白圭終不渝明心良自皎安用久踟蹰遄車及枌巷流日下西虞日一作因披帷悵有望出門遲所欲彼美復來儀慙顔變欣矚蘭艾隔芳蕕涇渭分清濁去去夫人子請徇川之曲悵一作愓蕕一作臭古樂苑卷十八
