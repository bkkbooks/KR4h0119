body:
  text: 古樂苑巻三十六明梅鼎祚編襍曲歌辭宋自君之出矣漢徐幹室思詩自君之出矣明鏡暗不治思君如流水無有窮巳時自君之出矣盖起於此一作擬室思詩齊虞羲亦謂之思君去時行宋孝武帝一作許瑶自君之出矣金翠闇無精思君如日月回還晝夜生同前江夏王義恭自君之出矣笥錦廢不開思君如清風曉夜常徘徊同前顔師伯自君之出矣芳帷低不舉思君如回雪流亂無端緒同前本題云題詩後寄行人姑從郭本鮑令暉自君之出矣臨軒不解顔砧杵夜不發髙門晝恒關帷中流熠燿庭前華紫蘭物枯識節異鴻歸知客寒遊取暮春盡餘思獨君還一作遊用暮冬盡除春待君還帷一作帳歸一作來同前二首集云奉和代徐齊王融自君之出矣芳藇絶瑶巵思君如形影寢興未曽離自君之出矣金爐香不然思君如明燭中宵空自煎同前虞羲自君之出矣楊桞正依依君去無消息唯見黄鶴飛關山多險阻士馬少光輝流年無止極君去何時歸同前梁范雲自君之出矣羅帳咽秋風思君如蔓草連延不可窮同前六首陳後主自君之出矣霜暉當夜明思君若風影來去不曽停自君之出矣房空帷帳輕思君如晝燭懷心不見明自君之出矣不分道無情思君若寒草零落故心生自君之出矣塵網暗羅帷思君如落日無有暫還時自君之出矣綠草遍階生思君如夜燭垂淚著雞鳴自君之出矣愁顔難復覩思君如蘖條夜夜只交苦同前賈馮吉自君之出矣紅顔轉憔悴思君如明燭煎心且銜淚同前隋陳叔達自君之出矣明鏡罷紅妝思君如夜燭煎淚幾千行秋歌藝文無題在秋部宋南平王鑠昊天清且髙秋氣發初涼白露下微津明月流素光凝煙汎城闕凄風入軒房朱華先零落緑草就芸黃纎羅還笥篋輕紈改衣裳遊子移宋江夏王義恭三河遊蕩子麗顔邁荆寳携持玉柱箏懷挾忘憂草綢繆甘泉中馳逐邯鄲道春服候時製秋紈迎涼造珍魄暉素腕玉迹滿襟抱常歎樂日晏恒悲歡不早揮吹傳舊美趨謡盡新好仲尼為輟餐秦王足傾倒懷園引宋謝莊鴻飛從萬里飛飛河岱起辛勤越霜霧聮翩遡江汜去舊國違舊鄉舊海悠且長廻首瞻東路延翮向秋方登楚都入楚關楚地蕭瑟楚山寒嵗去氷未已春來鴈不還風肅幌兮露濡庭漢水初緑桞葉青朱光靄靄雲英英離禽喈喈又晨鳴菊有秀兮松有蕤憂來年去容髮衰流隂逝景不可追臨堂危坐悵欲悲試託意兮向芳蓀心綿綿兮屬荒樊想緑蘋兮既冒沼念幽蘭兮已盈園夭桃晨暮發春鶯旦夕喧青苔蕪石路宿草塵蓬門山夜憂宋謝莊庭光盡山明歸流風乘軒巻明月縁河飛澗鳥鳴兮夜蟬清橘露靡兮蕙煙輕凌别浦兮値泉躍經喬木兮遇猨驚南臯别鶴行佇漢東鄰孤管入青天沈痾白髮共急日朝露過隟詎賒年年既去兮髪不還金膏玉液豈留顔廻舲柘繩户収棹掩荆關㑹吟行樂府解題曰㑹吟行其致與吳趨同㑹曰㑹稽宋謝靈運六引緩清唱三調佇繁音列筵皆靜寂咸共聆㑹吟㑹吟自有初請從文命敷敷績壺冀始刋木至江汜列宿炳天文負海横地理連峰競千仞背流各百里滮池溉粳稻輕雲曖松杞兩京愧佳麗三都豈能似層臺指中天髙墉積崇雉飛燕躍廣途鷁首戲清沚肆呈窈窕容路曜㛹娟子自來彌世代賢達不可紀句踐善廢興越叟識行止范蠡出江湖梅福入城市東方就旅逸梁鴻去桑梓牽綴書土風辭殫意未已容五臣作客世一作年松柏篇并序余患脚上氣四十餘日知舊先借傅𤣥集以余病劇遂見還開袠適見樂府詩龜鶴篇於危病中見長逝詞惻然酸懷抱如此重病彌時不差呼吸之喘舉目悲矣火藥間缺而擬之宋鮑照松柏受命獨歴代長不衰人生浮且脆鴥若晨風悲東海迸逝川西山𨗳落暉南郭悦籍短蒿里収永歸諒無疇昔時百病起盡期志士惜牛刀忍勉自療治傾家行藥事顚沛去迎醫徒備火石苦奄至不得辭龜齡安可獲岱宗限已迫睿聖不得留為善何所益捨此赤縣居就彼黃壚宅永離九原親長與三辰隔屬纊生望盡闔棺世業埋事痛存人心恨結亡者懷祖葬既云及壙𡑞亦已開室族内外哭親䟽同共哀外姻逺近至名列通夜臺扶輿出殯宫低廻戀庭室天地有盡期我去無還日居者今已盡人事從此畢火歇煙既沒形銷聲亦滅鬼神來依我生人永辭訣大暮杳悠悠長夜無時節鬱湮重㝠下煩寃難具說安寢委沈寞戀戀念平生事業有餘結刋述未及成資儲無擔石兒女皆孩嬰一朝放捨去萬恨纒我情追憶世上事束教以自拘明發靡怡悆夕歸多憂虞撤閒晨逕流輟宴式酒濡知今暝日苦恨失爾時娛遥遥逺民居獨埋深壤中墓前人跡滅冡上草日豐空林響鳴蜩髙松結悲風長寐無覺期誰知逝者窮生存處文廣連榻舒華裀已沒一何苦楛哉不容身昔日平居時晨夕對六親今日掩奈何一見無諧因禮席有降殺三齡速過隙几筵就収撤室宇改疇昔行女遊歸途仕子復王役家世本平常獨有亡者劇時祀望歸來四節靜塋丘孝子撫墳號父子知來不欲還心依戀欲見絶無由煩寃荒隴側肝心盡崩抽郭一作郊限一作恨夕歸一作乆歸鳴鴈行衛匏有苦葉詩曰雝雝鳴鴈旭日始旦鳴鴈行盖出於此宋鮑照雝雝鳴鴈鳴始旦齊行命侣入雲漢中夜相失羣離亂留連徘徊不忍散憔悴容儀君不知辛苦霜雪亦何為霜雪一作風霜同前隋李孝貞聽琴旋蔡子張羅避翟公夕宿寒林上朝飛空井中既竝𤣥雲曲復變海魚風一報黃苑惠還遊萬嵗宫詩紀云此詩本詠雀樂府題曰鳴雁行或有誤也北風行北風本衛詩也北風詩曰北風其涼雨雪其雱傳云北風寒涼病害萬物以喻君政㬥虐百姓不親也鮑照傷北風雨雪而行人不歸與衛詩異矣集作北風凉行宋鮑照北風涼雨雪雱京洛女兒多妍粧遙豔帷中自悲傷沈吟不語若為忘問君何行何當歸苦使妾坐自傷悲慮年至慮顔衰情易復恨難追沈吟不語若為忘一作沈吟不語若有忘慮年至一作慮年來春日行宋鮑照獻嵗發吾將行春山茂春日明園中鳥多嘉聲梅始發桞始青汎舟艫齊棹驚奏採菱歌鹿鳴風微起波微生弦亦發酒亦傾入蓮池折桂枝芳袖動芬葉披兩相思兩不知梅始發桞始青一作梅始發桃始榮風微起波微生一作微波起微風生入蓮池折桂枝一作入蓮花援桂枝代少年時至衰老行此下五首樂府諸家不載按鮑照集題上並有代字則此必舊有是作而照擬之也大抵為嗟老傷窮羇旅無聊之意而已宋鮑照憶昔少年時馳逐好名晨結友多貴門出入富兒鄰綺羅豔華風車馬自揚塵歌唱青琴女彈筝燕趙人好酒多芳氣餚味厭時新今日每相念此事邈無因寄語後生子作樂當及春代陽春登荆山行宋鮑照旦登荆山頭﨑嶇道難遊早行犯霜露苔滑不可留極眺入雲表窮目盡帝州方都列萬室層城帶髙樓奕奕朱軒馳紛紛縞衣流日氛映山浦暄霧逐風収花木亂平原桑柘盈平疇攀條弄紫莖藉露折芳柔遇物雖成趣念者不解憂且共傾春酒長歌登山丘桑柘盈平疇一作桑柘緜平疇代貧賤愁苦行宋鮑照湮没雖死悲貧苦即生劇長歎至天曉愁苦窮日夕盛顔當少歇鬢髮先老白親友四面絶朋知斷三益空庭慙樹萱樂餌愧過客貧年忘日時黯顔就人惜俄頃不相酬恧怩靣已赤或以一金恨便成百年隙心為千條計事未見一獲運圯津塗塞遂轉死溝洫以此窮百年不如還窀穸代邊居行宋鮑照少年逺荆陽遥遥萬里方陋巷絶人徑茅屋摧山岡不覩車馬迹但見麋鹿場長松何落落丘隴無復行邊地無髙木蕭蕭多白楊盛年日月盡一去萬恨長悠悠世中人爭此錐刀忙不憶貧賤時富貴輒相忘紛紛徒滿目何關慨予傷不如一畝中髙㑹挹清漿遇樂便作樂莫使候朝光荆一作京方一作行代邽街行宋鮑照竚立出門衢遥望轉蓬飛蓬去舊根在連翩逝不歸念我捨鄉俗親好乆乖違慷慨懷長想惆悵戀音徽人生隨事變遷化焉可祈百年難必果千慮易盈虧中興歌十首宋鮑照千冬遲一春萬夜視朝日生平値中興歡起百憂畢遲一作逄中興太平運化清四海樂祥景照玉臺紫煙遊鳯閣碧樓含夜月紫殿爭朝光綵池散蘭麝風起自生芳白日照前牕玲瓏綺羅中美人掩輕扇含思歌春風三五容色滿四五妙華歇已輸春日歡分隨秋光没北出湖邊戲前還苑中遊飛縠繞長松馳管逐波流九月秋水清三月春花滋千金逐良日皆兢中興時窮泰已有分夀夭復屬天既見中興樂莫持憂自煎襄陽是小地夀陽非帝城今日中興樂遥冶在上京梅花一時豔竹葉千年色願君松柏心採照無窮極行路難十八首樂府解題曰行路難備言世路艱難及離别悲傷之意多以君不見為首按陳武别傳云武常牧羊諸家牧竪有知歌謠者武遂學行路難則所起亦逺矣宋鮑照奉君金巵之美酒瑇瑁玉匣之彫琴七綵芙蓉之羽帳九華蒲萄之錦衾紅顔零落嵗將暮寒光宛轉時欲沈願君裁悲且減思聽我抵節行路吟不見柏梁銅雀上寧聞古時清吹音巵一作匜瑇一作玳洛陽名工鑄為金博山千斵復萬鏤上刻秦女攜手仙承君清夜之歡娛列置幃裏明燭前外發龍鱗之丹綵内含麝芬之紫煙如今君心一朝異對此長歎終百年歡娛一作娛樂璿閨玉墀上椒閣文牕繡户垂綺幕中有一人字金蘭被服纎羅藴芳藿春燕差池風散梅開帷對影弄春爵含歌攬涕不能言人生幾時得為樂寧作野中之雙鳬不願雲間之别鶴藴一作采春一作禽不能言一作恒抱愁瀉水置平地各自東西南北流人生亦有命安能行歎復坐愁酌酒以自寛舉杯斷絶歌路難心非木石豈無感吞聲躑躅不敢言君不見河邊草冬時枯死春滿道君不見城上日非暝没山去明朝復更出今我何時當得然一去永滅入黄泉人生苦多懽樂少意氣敷腴在盛年且願得志數相就牀頭恒有酤酒錢功名竹帛非我事存亡貴賤委皇天非暝一作今暝山一作盡委一作付對案不能食㧞劒撃柱長歎息丈夫生世能幾時安能蹀躞垂羽翼棄檄罷官去還家自休息朝出與親辭暮還在親側弄兒牀前戲看婦機中織自古聖賢盡貧賤何況我輩孤且直能一作㑹檄一作置愁思忽而至跨馬出北門舉頭四顧望但見松柏園荆棘鬱蹲蹲中有一鳥名杜鵑言是古時蜀帝魂聲音哀苦鳴不息羽毛憔悴似人髠飛走樹間啄蟲蟻豈憶往日天子尊念此死生變化非常理中心惻愴不能言蹲蹲集作撙撙啄一作逐中庭五株桃一株先作花陽春沃若二三月從風簸蕩落西家西家思婦見悲惋零淚沾衣撫心歎初我送君出户時何言淹留節廻換牀席生塵明鏡垢纎腰痩削髮蓬亂人生不得恒稱意惆悵徙倚至夜半沃若二三月一作妖冶二月中見悲一作見之剉蘖染黄絲黄絲歴亂不可治我昔與君始相値爾時自謂可君意結帶與我言死生好惡不相置今日見我顔色衰意中索寞與先異還君金釵瑇瑁簮不忍見之益愁思結帶與我言死生好惡不相置一作結帶與君同死生好惡不擬相棄置索寞一作錯亂金一作玉見之一作見此君不見蕣華不終朝須㬰淹冉零落銷盛年妖豔浮華輩不乆亦當詣冡頭一去無還期千秋萬嵗無音詞孤魂煢煢空隴間獨魄徘徊遶墳基但聞風聲野鳥吟豈憶平生盛年時為此令人多悲悒君當縱意自熈怡君不見枯籜走階庭何時復青著故莖君不見亡靈蒙享祀何時傾盃竭壺罌君當見此起憂思寧及得與時人爭生人倐忽如絶電華年盛徳幾時見但令縱意存髙尚㫖酒佳肴相胥讌持此從朝竟夕暮差得忘憂消愁怖胡為惆悵不得已難盡此曲令君忤得一作能今年陽初花滿林明年冬末雪盈岑推移代謝紛交轉我君邊戍獨稽沈執袂分别已三載邇來淹寂無分音朝悲慘慘遂成滴暮思遶遶最傷心膏沐芳餘乆不御蓬首亂鬢不設簮徒飛輕埃舞空帷粉筐黛噐靡復遺自生留世苦不幸心中惕惕恒懷悲春禽喈喈旦暮嗚最傷君子憂思情我初辭家從軍僑榮志溢氣干雲霄流浪漸冉經三齡忽有白髮素髭生今暮臨水㧞已盡明日對鏡復已盈但恐羈死為鬼客客思寄滅生空精每懷舊鄉野念我舊人多悲聲忽見過客問何我寧知我家在南城答云我曽居君鄉知君遊宦在此城我行離邑已萬里今方羇旅去逺征來時聞君婦閨中孀居獨宿有貞名亦云朝悲泣閒房又聞暮思淚沾裳形容憔悴非昔悦蓬鬢衰顔不復粧見此令人有餘悲當念君懷不暫忘君不見少壯從軍去白首流離不得還故鄉窅窅日夜隔音塵斷絶沮河關朔風蕭條白雲飛胡笳哀急邊氣寒聽此愁人兮奈何登山逺望得留顔將死胡馬跡寧見妻子難男兒生世轗軻欲何道綿憂摧抑起長歎君不見柏梁臺今日丘墟生草萊君不見阿房宫寒雲澤雉棲其中歌伎舞女今誰在髙墳壘壘滿山隅長袖紛紛徒競世非我昔時千金軀隨酒逐樂任意去莫令含歎下黄壚君不見氷上霜表裏隂且寒雖蒙朝日照信得幾時安民生故如此誰令摧折彊相看年去年來自如削白髮零落不勝冠君不見春鳥初至時百草含青俱作花寒風蕭條一旦至竟得幾時保光華日月流邁不相饒令我愁思怨恨多蕭條一作蕭索諸君莫歎貧富貴不由人丈夫四十彊而仕余當二十弱冠辰莫言草木委大雪㑹應蘓息遇陽春對酒叙長篇窮途運命委皇天但願金樽九醖滿莫惜牀頭百箇錢直須優游卒一嵗何勞辛苦事百年大一作冬金樽一作樽中同前詩品曰行路難是東陽柴廓所造寳月嘗憇其家㑹廓亡因竊而有之廓子齎手本出都欲訟此事乃厚賂止之一本云東陽太守柴廓選詩外編作柴廓詩齊僧寳月君不見孤鴈關外發酸嘶度揚越空城客子心腸斷幽閨思婦氣欲絶凝霜夜下拂羅衣浮雲中斷開明月夜夜遥遥度相思年年望望情不歇寄我匣中青銅鏡倩人為君除白髪行路難行路難夜聞南城漢使度使我流淚憶長安同前四首梁吳均洞庭水上一株桐經霜觸浪困嚴風昔時抽心曜白日今旦臥死黄沙中洛陽名工見咨嗟一剪一刻作琵琶白璧規心學明月珊瑚映靣作風花帝王見賞不見忘提攜把握登建章掩抑摧藏張女彈殷勤促柱楚明光年年月月對君子遥遥夜夜宿未央未央綵女棄鳴篪爭先拂拭生光儀茱茰錦衣玉作匣安念昔日枯樹枝不學衡山南嶺桂至今千載猶未知青𤨏門外安石榴連枝接葉夾御溝金墉城西合歡樹垂條照彩拂鳯樓遊俠少年遊上路傾心顚倒想戀慕摩頂至足買片言開胷瀝膽取一顧自言家在趙邯鄲翩翩舌杪復劍端青驪白駮的盧馬金羈綠控紫絲鞶躞蹀横行不肯進夜夜汗血至長安長安城中諸貴臣爭貴儒者席上珍復聞梁王好學問輕棄劒客如埃塵吾丘夀王始得意司馬相如適被申大才大辯尚如此何況我輩輕薄人君不見西陵田從横十字成陌阡君不見東郊道荒涼蕪没起寒煙盡是昔日帝王處歌姬舞女達天曙今日翩妍少年子不知華盛落前去吐心吐氣許他人今旦廻惑生猶豫山中桂樹自有枝心中方寸自相知何言嵗月忽若馳君之情意與我離還君玳瑁金雀釵不忍見此使心危君不見上林苑中客氷羅霧縠象牙席盡是得意忘言者探腸見膽無所惜白酒甜鹽甘如乳綠觴皎鏡華如碧少年持名不肯嘗安知白駒應過隙博山鑪中百和香鬱金蘓合及都梁逶迤好氣佳容貎經過青𤨏歴紫房已入中山馮后帳復上皇帝班姬牀班姬失寵顔不開奉箒供養長信臺日暮耿耿不能寐秋風切切四面來玉階行路生細草金罏香炭變成灰得意失意須㬰頃非君方寸逆所裁馮一作隂頃一作間同前二首前首一作吳均今從玉臺梁費昶君不見長安客舍門倡家少女名桃根貧窮夜紡無燈燭何言一朝奉至尊至尊離宫百餘處千門萬户不知曙唯聞啞啞城上烏玉欄金井牽轆轤丹梁翠柱飛屠蘇香薪桂火炊雕胡當年翻覆無常定薄命為女何必麤屠一作流雕胡一作彫苽君不見人生百年如流電心中坎壈君不見我昔初入椒房時詎滅班姬與飛燕朝踰金梯上鳯樓暮下瓊鉤息鸞殿柏梁晝夜香錦帳自飄颺笙歌棗下曲琵琶陌上桑過蒙恩所賜餘光曲沾被既逢隂后不自專復植程姬有所避黄河千年始一清微軀再逢永無議蛾眉偃月徒自妍傅粉施朱欲誰為不如天淵水中鳥雙去雙飛長比翅棗下曲一作席上吹同前一作詠征婦裁衣行路難梁王筠千門皆閉夜何央百憂俱集斷人腸探揣箱中取刀尺拂拭機上斷流黄情人逐情雖可恨復畏邊逺乏衣裳已繰一繭催衣縷復𢷬百和薰衣香猶憶去時腰大小不知今日身短長裲襠雙心共一袜衵複兩邊作八撮襻帶雖安不忍縫開孔裁穿猶未達胷前却月兩相連本照君心不照天願君分明得此意勿復流蕩不如先含悲含怨判不死封情忍思待明年同前題云從軍與相州刺史孫騰行路難北齊髙昻春甲長驅不可息六日六夜三度食初時止言作虎牢更被處置河橋此廻首絶望便蕭條悲來雪涕還自抑空城雀鮑照此篇言輕飛近集茹腹辛傷免羅網而已宋鮑照雀乳四鷇空城之阿朝拾野粟夕飲氷河髙飛畏鴟鳶下飛畏網羅辛傷伊何言怵迫良已多誠不及青鳥逺食玉山禾猶勝吳宫燕無罪得焚窠賦命有厚薄長歎欲如何拾一作食同前北魏髙孝緯百雉何寥廓四靣風雲上紈素乆為塵池臺尚可仰啾啾雀噪城鬱鬱無歡賞日暮勞心曲横琴聊自奬勞一作縈夜坐吟夜坐吟鮑照所作言聽歌逐音因音託意也宗夬又有遥夜吟則言永夜獨吟憂思未歇與此不同宋鮑照冬夜沈沈夜坐吟含情未發已知心霜入幕風度林朱燈滅朱顔尋體君歌逐君音不貴聲貴意深情一作聲長相思古詩曰客從逺方來遺我一書札上言長相思下言乆離别李陵詩曰行人難乆留各言長相思言行人乆戍寄書以遺所思也古詩又曰客從逺方來遺我一端綺文綵雙鴛鴦裁為合歡被著以長相思縁以結不解謂被中著綿以致相思緜緜之意故曰長相思也又有千里思與此相類宋吳邁逺晨有行路客依依造門端人馬風塵色知從河塞還時我有同棲結宦遊邯鄲將不異客子分飢復共寒煩君尺帛書寸心從此殫道妾長憔悴豈復歌笑顔簷隠千霜樹庭枯十載蘭經春不舉袖秋落寧復看一見願道意君門已九關虞卿棄相印檐笠為同歡閨隂欲早霜何事空盤桓道一作遣笠一作簦同前梁昭明太子統相思無終極長夜起歎息徒見貎嬋娟寧知心有憶寸心無所因願附歸飛翼嬋一作㛹所一作以同前二首張率長相思乆離别美人之逺如雨絶獨延佇心中結望雲雲去逺望鳥鳥飛滅空望終若斯珠淚不能雪長相思乆離别所思何在若天垂鬱陶相望不得知玉階月夕映羅帷風夜吹長思不能寢坐望天河移同前二首陳後主長相思乆相憶關山征戍何時極望風雲絶音息上林書不歸廻紋徒自織羞將别後靣還似初相識長相思怨成悲蝶縈草樹連絲庭花飄散飛入帷帷中看隻影對鏡歛雙眉兩見同望月兩别共春時同前二首徐陵長相思望歸難傳聞奉詔戍臯蘭龍城逺鴈門寒愁來痩轉劇衣帶自然寛念君今不見誰為抱腰看奉詔一作傳制念君今不見一作君今念不見長相思好春節夢裏恒啼悲不洩帳中起牕前髻桞絮飛還聚遊絲斷復結欲見洛陽花如君隴頭雪同前蕭淳長相思乆離别新燕參差條可結壺關逺鴈書絶對雲恒憶陣看花復愁雪猶有望歸心流黄未剪截同前陸瓊長相思乆離别一罷鴛文綺薦絶鴻已去栁堪結室冷鏡疑氷庭幽花似雪容貎朝朝改書字看看滅同前王瑳長相思乆離别兩心同憶不相徹悲風悽愁雲結桞葉眉上銷菱花鏡中滅鴈封歸飛斷鯉素還流絶悽一作凄同前二首江總長相思乆離别征夫去逺芳音滅湘水深隴頭咽紅羅斗帳裏緑綺清弦絶逶迤百尺樓愁思三秋結芳音一作芳幽長相思乆别離春風送燕入簷窺暗開脂粉弄花枝紅樓千愁色玉筯兩行垂心心不相照望望何由知同前無名氏罷秋有餘慘還春不覺温詎知玉筵側長挂銷愁人長别離楚辭曰悲莫悲兮生别離古詩曰行行重行行與君生别離相去萬餘里各在天一涯後蘇武使匈奴李陵與之詩曰良時不可再離别在須㬰故後人擬之為古別離梁簡文帝又為生别離宋吳邁逺有長别離今按三曲原本同義而宋在梁前聊以為次宋吳邁逺生離不可聞況復長相思如何與君别當我盛年時蕙華每揺蕩妾心長自持榮乏草木歡悴極霜露悲富貴貎難變貧窮顔易衰持此斷君腸君亦宜自疑淮隂有逸將折羽謝翻飛楚有扛鼎士出門不得歸正為隆準公仗劒入紫微君才定何如白日下爭暉長一作空貎一作身古别離襍體詩第一首梁江淹逺與君别者乃至鴈門關黄雲蔽千里遊子何時還送君如昨日簷前露已團不惜蕙草晚所悲道里寒君在天一涯妾身長别離願一見顔色不異瓊樹枝兔絲及水萍所寄終不移生别離梁簡文帝别離四弦聲相思雙笛引一去十三年復無好音信滛思古意宋顔竣春風飛逺方紀轉流思堂貞節寄君子窮閨妾所藏裁書露微疑千里問新知君行過三稔故心乆當移楊花曲三首宋湯惠休葳蕤華結情宛轉風含思掩涕守春心折蘭還自遺江南相思引多歎不成音黄鶴西北去銜我千里心深堤下生草髙城上入雲春人心生思思心長為君秋思引宋湯惠休秋寒依依風過河白露蕭蕭洞庭波思君末光光已滅𦕈眇悲望如思何勞歌二首宋伍緝之㓜童輕嵗月謂言可乆長一朝見零悴歎息向秋霜迍邅已窮極疢痾復不康每恐先朝露不見白日光庶及盛年時暫遂情所望吉辰既乖越來期𦕈未央促促嵗月盡窮年空悲傷女蘿依附松終已冠髙枝浮萍生託水至死不枯萎傷哉抱關士獨無松與期月色似冬草居身苦且危幽生重泉下窮年氷與澌多謝負郭生無所事六竒勞為社下宰時無魏無知同前周蕭撝百年能幾許公事罷平生寄言任立政誰憐李少卿答孫緬歌南史曰漁父者不知姓名亦不知何許人太康孫緬為潯陽太守落日逍遥渚際見一輕舟淩波隠顯俄而漁父至神韻蕭灑垂綸長嘯緬甚異之褰裳渉水與之論用世之道漁父曰僕山海狂人不達世務未辨賤貧無論榮貴乃歌曰云云於是攸然鼓棹而去宋漁父竹竿籊籊河水浟浟相忘為樂貪餌吞鈎非夷非惠聊以忘憂古樂苑巻三十六
