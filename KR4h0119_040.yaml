body:
  text: 古樂苑卷四十明梅鼎祚編雜曲歌辭隋江都宫樂歌隋煬帝揚州舊處可淹留臺榭高明復好遊風亭芳樹迎早夏長皋麥隴送餘秋渌潭桂楫浮青雀果下金鞍駕紫騮緑觴素蟻流霞飲長袖清歌樂戲州駕一作躍喜春遊歌二首隋煬帝禁苑百花新佳期遊上春輕身趙皇后歌曲李夫人步緩知無力臉慢動餘嬌錦袖淮南舞寶襪楚宫腰錦石搗流黃二首隋煬帝漢使出燕然愁閨夜不眠易製殘燈下鳴砧秋月前今夜長城下雲昏月應暗誰見倡樓前心悲不成撡紀遼東二首通典曰高句麗自東晉以後居平壤城亦曰長安城隨山屈曲南臨浿水在遼東南復有遼東玄莬等數十城隋書曰大業八年煬帝復高麗度遼水大戰于東岸擊賊破之進圍遼東是也隋煬帝遼東海北翦長鯨風雲萬里清方當銷鋒散馬牛旋師宴鎬京前歌後舞振軍威飲至解戎衣判不徒行萬里去空道五原歸秉旄仗節定遼東俘馘變夷風清歌凱捷九都水歸宴雒陽宫策功行賞不淹留全軍籍智謀詎似南宫復道上先封雍齒侯同前和帝作二首王胄遼東浿水事龔行俯拾信神兵欲知振旅旋歸樂為聽凱歌聲十乘元戎才渡遼扶濊巳氷消詎似百萬臨江水按轡空回鑣天威電邁舉朝鮮信次即言旋還笑魏家司馬懿迢迢用一年鳴鑾詔蹕發淆潼合爵及疇庸何必豐沛多相識比屋降堯封持楫篇隋遺録曰帝幸江都至汴帝御龍舟蕭妃乘鳳舸每舟擇妙麗女子千人執雕板鏤金楫號為殿腳女中有吳絳仙者柔麗不與羣輩齒因有寵於帝帝每倚簾視絳仙移時不去因吟持楫篇以賜之隋煬帝下同舊曲歌桃葉新粧豔落梅將身倚輕楫知是渡江來鳳艒歌廣五行志曰隋煬帝三月三日江上作鳳艒歌乃唐興之兆三月三日向江頭正見鯉魚波上遊意欲埀鈎往撩取恐是蛟龍還復休迷樓歌迷樓記曰大業九年帝將再幸江都有迷樓宫人夜歌云云帝聞其歌披衣起聽召宫女問之云孰使汝歌也汝自為之邪宫女曰臣有弟在民間曰道途兒童多唱此帝默然久之曰天啓之也因索酒自歌云云後帝幸江都唐帝起兵入京焚迷樓火經月不滅前謡前詩皆見矣隋煬帝宫木隂濃燕子飛興衰自古漫成悲它日迷樓更好景宫中吐豔變紅輝迷樓宫人歌杭靜河南楊柳樹河北李花營楊柳飛綿何處去李花結果自然成李花營一作李桃榮楊柳飛綿何處去一作楊花飛去去何處望江南海山記曰煬帝闢地周二百里為西苑內為十六院聚巧石為山鑿池為五湖四海又鑿北海周回四十里中有三山效蓬萊方丈瀛洲上皆臺榭回廊水深數丈開溝通五湖北海盡通行龍鳳舸帝多泛東湖因制湖上曲望江南八闋云樂府雜録曰望江南者朱崖李太尉鎮關西日為亡妓謝秋娘所撰本名謝秋娘後改此名亦曰夢江南西溪叢語曰李太尉鎮關西日為亡姬謝秋娘作後進入教坊楊慎詞品曰傳竒有煬帝望江南數曲不類六朝人語傳疑可也隋煬帝湖上月遍照列仙家水浸寒光鋪枕簟浪攪晴影走金蛇偏稱泛靈槎光景好輕彩望中斜清露冷侵銀影西風吹落桂枝花開宴思無涯湖上柳煙裏不勝埀宿霧洗開明媚眼東風搖弄好腰肢煙雨更相宜環曲岸隂覆畫橋低線拂行人春晚後絮飛晴雪暖風時幽意更依依湖上雪風急墮還多輕片有時敲竹户素華無韻入澄波望外玉相磨湖水逺天地色同和仰面莫思梁苑賦朝來且聽玉人歌不醉擬如何湖上草碧翠浪通津修帶不為歌舞緩濃鋪堪作醉人茵無意襯香衾晴霽後顔色一般新遊子不歸生滿地佳人逺意寄青春留咏卒難伸湖上花天水浸靈芽淺蕊水邊勻玉粉濃苞天外剪明霞只在列仙家開爛漫插鬢若相遮水殿春寒幽冷豔玉軒晴照暖添華清賞思何賒湖上女精選正輕盈猶恨乍離金殿侣相將盡是採蓮人清唱謾頻頻軒內好嬉戲下龍津玉管朱絃聞盡夜踏青鬬草事青春玉輦從羣真湖上酒終日助清歡檀板輕聲銀甲緩醅浮香米玉蛆寒醉眼暗相看春殿晚仙豔奉杯盤湖上風光真可愛醉鄉天地就中寬帝主正清安湖上水流繞禁園中斜日影搖清翠動落花香暖衆紋紅蘋末起清風間縱目魚躍小蓮東泛泛輕搖蘭棹穩沈沈寒影上仙宫逺意更重重東征歌文中子世家曰隋仁壽三年文中子西遊長安見文帝奏太平十有二策帝下其議於公卿公卿不悅文中子知謀之不用賦東征之歌而歸帝聞而再徵之不至隋王通我思國家兮逺遊京畿忽逢帝王兮降禮布衣遂懷古人之心兮將興太平之基時異事變兮志乖願違吁嗟道之不行兮埀翅東歸皇之不斷兮勞身西飛河曲遊魏文帝與吳質書曰時駕而遊北遵河曲隋盧思道鄴下盛風流河曲有名遊應徐託後乘車馬踐芳洲丰茸雞樹密遙裔鶴煙稠日上疑高蓋雲起類重樓金羈自沃若蘭棹成夷猶懸匏動清吹采菱轉豔謳還珂響金埒歸袂拂銅溝唯畏三春晚勿言千載憂城南隅宴曹植與丁儀詩曰吾與二三子曲宴此城隅則此本詩也疑非樂府姑從郭本隋盧思道城南氣初新才王邀故人輕盈雲映日流亂鳥啼春花飛北寺道弦散南漳濵舞動淮南袖歌揚齊后塵駢鑣歇夜馬接軫限歸輪公孫飲彌月平原宴浹旬即是消聲地何須逺避秦聽鳴蟬篇北史本傳曰周武帝平齊授思道儀同三司追赴長安與同輩陽休之等數人作聽鳴蟬篇思道所為詞意清切為時人所重新野庾信遍覽諸同作者而歎美之此與顔之推並在周時作隋盧思道聽鳴蟬此聽悲無極羣嘶玉樹裏回噪金門側長風送晚聲清露供朝食晚風朝露實多宜秋日高鳴獨見知輕身蔽數葉哀鳴抱一枝流亂罷還續酸傷合更離暫聽别人心即斷才聞客子淚先埀故鄉已超忽空庭正蕪沒一夕復一朝坐見涼秋月河流帶地從來嶮峭路干天不可越紅塵早蔽陸生衣明鏡空悲潘掾髮長安城裏帝王州鳴鐘列鼎自相求西望漸臺臨太液東瞻甲觀距龍樓説客恆持小冠出越使常懷寶劒遊學仙未成便尚主尋源不見巳封侯富貴功名本多豫繁華輕薄盡無憂詎念嫖姚嗟木梗誰憶田單倦土牛歸去來青山下秋菊離離日堪把獨焚枯魚宴林野終成獨校子雲書何如還驅少遊馬門一作提田單一作蘭皋同前題云和陽訥言聽鳴蟬篇同盧思道賦北齊顔之推聽秋蟬秋蟬非一處細柳高飛夕長楊明月曙歷亂起秋聲參差攪人慮單吟如轉簫羣噪學調笙逺飄流曼響多含斷絶聲埀隂自有樂飲露獨為清短緌何足貴薄羽不羞輕螳蜋翳下偏難見翡翠竿頭絶易驚容止由來桂林苑無事淹留南斗城城中帝皇里金張及許史權勢熱如湯意氣誼城市劒影奔星落馬色浮雲起鼎俎陳龍鳳金石諧宫徵關中滿季心關西饒孔子詎用虞公立國臣誰愛韓王遊説士紅顔宿昔同春花素鬢俄頃變秋草中腸自有極那堪教作轉輪車見初學記紅顔以下脫誤昔昔鹽樂苑曰昔昔鹽羽調曲唐亦為舞曲昔一作析小説舊聞曰隋煬帝善屬文不欲人出其右薛道衡由是得罪後因事誅之曰更能作空梁落燕泥否洪邁容齋續筆曰昔昔鹽凡十韻唐趙嘏廣之為二十章玄怪録載籧篨三娘工唱阿鵲鹽又有突厥鹽黃帝鹽白鴿鹽神雀鹽疏勒鹽滿座鹽歸國鹽唐詩媚賴吳娘唱是鹽更奏新聲刮骨鹽然則歌詩謂之鹽者如吟行曲引之類云今南嶽廟獻神樂曲有黃帝鹽而俗傳以為黃帝炎韋縠編唐才調詩以趙詩為劉長卿而題為别宕子怨誤矣丹鉛餘録曰梁樂府夜夜曲或名昔昔鹽昔即夜也列子昔昔夢為君鹽亦曲之别名按此則薛詩當附沈約夜夜曲矣然其説未見他出仍從舊録隋薛道衡垂柳覆金堤蘼蕪葉復齊水溢芙蓉沼花飛桃李蹊採桑秦氏女織錦竇家妻關山别蕩子風月守空閨恆斂千金笑長垂雙玉啼盤龍隨鏡隱彩鳳逐帷低飛魂同夜鵲倦寢憶晨雞暗牖懸蛛網空梁落燕泥前年過代北今嵗往遼西一去無消息那能惜馬蹄同前無名氏名落風煙外瑶臺道路賒何如連御苑别自有仙家此地回鸞駕緣溪滿翠華洞中明月夜窗下發煙霞芙蓉花隋辛德源洛神挺凝素文君拂豔紅麗質徒相比鮮彩兩難同光臨照波日香隨出岸風涉江良自逺託意在無窮浮遊花樂府無名氏左克明作辛德源隋辛德源窗中斜日照池上落花浮若畏春風晚當思秉燭遊西園遊上才沈約詠月詩曰月華臨靜夜夜靜滅氛埃方暉竟户入圓影隙中來高樓切思婦西園遊上才因以為題也按此亦非樂府隋王胄樂府無名氏西園遊上才清夜可徘徊月桂臨樽上山雲影蓋來飛花隨燭度疏葉向帷開當軒顧應阮還覺賤鄒枚登名山行一作篇隋李巨仁名山本鎮地迢遞上凌霄雲開金闕迥霧起石梁遙翠微橫鳥路珠樹拂星橋風急清溪晚霞散赤城朝寓目幽棲地駕言尋綺季迹絶桃源士忘情漆園吏抽簪傲九辟脫屣輕千駟沈冥負俗心疏索凌雲意蒼蒼聳極天伏眺盡山川疊峰如積浪分崕若斷煙淺深聞度雨輕重聽飛泉采藥逢三島尋真遇九仙藏書凡幾代看博已經年逝將追羽客千載一來旋金闕回一作金澗近尋一作追胥臺露按蘇臺一名胥臺此詩意惜其頽圮耳樂府遺聲時景二十五曲有胥臺露未知所據隋庾抱胥臺既落構荆棘稍侵扉棟拆連雲影梁摧照日暉翔鶤遂不反巢燕反無歸唯有團階露承睫共霑衣委靡辭意義可疑隋僧沸大宿心嘉爾故固良媒問名諧帥占相良時慘慘惕惕懼爾不來既覩爾顔我心怡怡今不合歡豈徒費哉斯誓為定淑女何疑十索四首樂苑曰十索羽調曲也隋丁六娘裙裁孔雀羅紅緑相參對映以蛟龍錦分明竒可愛粗細君自知從郎索衣帶為性愛風光偏憎良夜促曼眼腕中嬌相看無厭足歡情不耐眠從郎索花燭君言花勝人人今去花近寄語落花風莫吹花落盡欲作勝花粧從郎索紅粉二八好容顔非意得相關逢桑欲採折尋枝倒懶攀欲呈纎纎手從郎索指環同前二首郭本無名氏選詩拾遺併作丁六娘含嬌不自轉送眼勞相望無那關情伴共入同心帳欲防人眼多從郎索錦障蘭房下翠帷蓮帳舒鴛錦歡情宜早暢密意須同寢欲共作纒綿從郎索花枕古樂苑卷四十
