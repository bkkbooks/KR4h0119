body:
  text: 古樂苑卷三十七明梅鼎祚編雜曲歌辭齊塞客吟齊書曰髙帝在淮上取蘇侃為冠軍録事參軍是時新失淮北遣帝北戍每嵗秋冬間邉淮騷動帝廣遣偵候安集荒餘又營繕城府帝在兵中久見疑於時乃作塞客吟以喻志侃達此旨更自勸勵委以府事深見知待按此詩見蘇侃傳外編逸軌皆作侃詩非也齊髙帝寶緯紊宗神經越序德晦河晉力宣江楚雲雷兆壯天山繇武直髮指河關凝精越漢渚秋風起寒草衰雕鴻思邊馬悲平原千里顧但見轉蓬飛星嚴海淨月徹河明清輝映幕素液凝庭金笳夜厲羽轊晨征斡晴潭而悵泗枻松洲而悼情蘭涵風而瀉豔菊籠泉而散英曲繞首燕之歎吹軫絶越之聲欷園琴之孤弄想庭藿之餘馨青關望斷白日西斜恬源靚霧壠首暉霞戒旋鷁躍還波情綿綿而方逺思裊裊而遂多粵擊秦中之築因為塞上之歌歌曰朝發兮江泉日夕兮陵山驚飈兮瀄汨淮流兮潺湲胡埃兮雲聚楚斾兮星懸愁墉兮思宇惻愴兮何言定寰中之逸鑒審雕陵之迷泉悟樊籠之或纍悵遐心以栖玄河關一作秦關永明樂十首南齊書樂志曰永明樂歌者竟陵王子良與諸文士造奏之人為十曲道人釋寶月辭頗美武帝常被之管弦而不列於樂官按此曲永明中造故曰永明樂齊謝朓帝圖開九有皇風浮四溟永明一為樂咸池無復靈民和禮樂富世清歌頌徽鴻名軼卷領稱首邁垂衣朱臺鬱相望青槐紛馳道秋雲湛甘露春風散芝草龍樓日月照淄館風雲清儲光溫似玉藩度式如瓊化洽鯷海君恩變龍庭長西北騖環裘東南盡龜象出車長洲苑選旅朝夕川絡絡結雲騎奕奕泛戈船燕駟遊京洛趙服麗有輝清歌留上客妙舞送將歸實相薄五禮妙花開六塵明祥已玉燭寶瑞亦金輪生蔑􅀢蘿性身與嘉惠隆飛纓入華殿屣步出重宫彩鳯鳴朝陽玄鶴舞清商瑞此永明曲千載為金皇同前十首王融玄符昭景歷茂實偶英聲長為南山固永與朝日明靈丘比翼栖芳林合條起兩代分憲章一朝會書軌二離金玉相三衮蘭蕙芳重儀文世子再奉東平王空谷返逸驂隂山響鳴鶴振玉屣丹墀懷芳步青閣崇文晦已明膠庠雜復整弱臺留折巾沂川詠芳穎定林去喧俗鹿野出埃霞香風流梵琯澤雨散雲花楚望傾澠滌日館仰鑾鈴已晞五雲發方照兩河清幸哉明盛世壯矣帝王居髙門夜不柝飲帳曉長舒總棹金陵渚方駕玉山阿輕露炫珠翠初風搖綺羅西園抽蕙草北沼掇芳蓮生逢永明樂死日生之年同前梁沈約聮翩貴遊子侈靡千金客華轂起飛塵珠履竟長陌江上曲齊謝朓易陽春草出踟蹰日已暮蓮葉尚田田淇水不可渡願子淹桂舟時同千里路千里既相許桂舟復容與江上可採菱清歌共南楚邯鄲故才人嫁為厮養卒婦楊慎樂府序曰豫觀樂府有邯鄲才人嫁為厮養卒婦篇特亡其辭亦失其解及考史記張耳傳洎楚漢春秋并云趙王武臣為燕軍所獲囚於燕獄先後使者往請輒為燕所殺趙有厮養卒謝其舍中曰吾將載趙王歸舍中人笑之乃走燕壁以利害説燕將燕以為然乃歸趙王厮養卒御王以歸武臣歸趙以美人妻養卒以報之是其事也李蓘曰張耳傳祇云厮養卒並無才人嫁為婦語曷以知所嫁者即此卒邪陳耀文正揚曰此事史漢并同注中俱無楚漢春秋字齊謝朓生平宫閣裏出入侍丹墀開笥方羅縠窺鏡比蛾眉初别意未解去久日生悲憔悴不自識嬌羞餘故姿夢中忽髣佛猶言承宴私王孫遊楚辭招隱士曰王孫遊兮不歸春草生兮萋萋王孫遊蓋出於此齊謝朓緑草蔓如絲雜樹紅英發無論君不歸君歸芳已歇蔓一作夢同前王融置酒登廣殿開襟望所思春草行已歇何事久佳期一本辭同思公子金谷聚齊謝朓渠碗送佳人玉杯要上客車馬一東西别後思今夕石崇金谷妓梁庾肩吾蘭堂上客至綺席清絃撫自作明君辭還教緑珠舞法夀樂十二首一云法樂辭齊王融天長命自短世促道悠悠禪衢開逺駕愛海亂輕舟纍塵曽未極積樹豈能籌情埃何用洗正水有清流積一作心右歌本起百神肅以虔三靈震且越恆耀掩芳霄薰風鏡蘭月丹榮藻玉墀翠羽文珠闕皓毳非虛來交輪豈徒發薰風鏡蘭月一作微風動蘭月藻一作落恆一作常右歌靈瑞韶年春已仲明星夜未央千祀鍾休歷萬國會嘉祥金容函夕景翠鬢佩晨光表塵維淨覺泛俗乃輪皇右歌下生襲氣變離宫重柝警曽殿曼響感心神修容展歡宴生老終已榮死病行當薦方為淨國遊豈結危城戀展歡一作轉惟右歌在宫春木多病夭秋葉少欣榮心骸終委滅親愛暫平生長風吹北壟迅影急東瀛知三既情竭得一乃身貞木一作枝竭一作暢右歌四遊飛策辭國門端儀偃郊樹慈愛徒相思閨中空戀慕夙𨽻乖往塗駿足獨歸路舉袂謝時人得道且還顧一作去右歌出國明心𢎞十力寂慮安四禪青禽承逸軌文驪鏡重川鷲嵓標逺勝鹿野究清玄不有希世寶何以遵蒙泉安一作通驪一作鑣右歌得道亭亭宵月流朏朏晨霜結川上不裴回條間亟渝滅靈知湛常然符應有盈缺感運復來儀且厭人間世亟渝滅一作問生滅符一作俯世音泄右歌寶樹一作雙樹春山玉所府檀林鸞所栖引火歸炎隧挹水自青隄菴園無異轍祗館有同躋比肩非今古接武豈燕齊舂一作春鸞一作芳右歌賢衆昔余輕嵗月兹也重光隂閨中屏鉛黛闕下挂纓簮禪悅兼芳旨法言戀清琴一異非能辨寵辱誰為心戀一作忘寵辱一作空有右歌學徒峻宇臨層穹迢迢疏逺風騰芳清漢裏響梵髙雲中金華紛冉若瓊樹鬱青蔥貞心延淨景邃業嗣天宫宇一作岸冉若一作冉弱延一作逸右歌供具影響未嘗隔晦明殊復親𢎞慈邈已逺睿后扇髙塵區中禔景福宇外沐深仁萬祀留國祚億兆慶唐民右歌福應江臯曲齊王融林斷山更續洲盡江復開雲峰帝鄉起水源桐柏來望城行齊王融金城十二重雲氣出表裏萬户如不殊千門反相似車馬若飛龍長衢無極已簫鼓相逢迎信哉佳城市思公子楚辭九歌曰雷填填兮雨冥冥猿啾啾兮狖夜鳴風颯颯兮木蕭蕭思公子兮徒離憂思公子蓋出於此齊王融春盡風颯颯蘭凋木修修王孫久為客思君徒自憂同前梁費昶公子才氣饒凌雲自飄飄東出鬭雞道西登飲馬橋夕宴銀為燭朝燔桂作樵虞卿亦何命窮極苦無聊同前北齊邢劭綺羅日減帶桃李無顔色思君君未歸歸來豈相識陽翟新聲隋書樂志曰西涼樂曲陽翟新聲神自馬之類皆出於胡戎歌非漢魏遺曲也齊王融懷春發下蔡含笑向陽城耻為飛雉曲好作鵾雞鳴秋夜長魏文帝詩曰漫漫秋夜長烈烈北風涼展轉不能寐披衣起倣徨秋夜長其取諸此集云奉和秋夜長玉臺作秋夜齊王融秋夜長夜長樂未央舞袖拂花燭歌聲繞鳯梁白日歌序曰懸象著明莫大乎日月而彼日月不能不謝固知無凖衰為盛之終盛為衰之始故為白日歌齊張融白日白日舒天昭暉數窮則盡盛滿則衰憂且吟齊張融鳴琴當春夜春夜當鳴琴羈人自不樂何似千里心邯鄲行通典曰邯鄲戰國時趙國所都自敬矦始都之有叢臺洪波臺在焉邯山名鄲盡也樂府廣題曰邯鄲舞曲也齊陸厥趙女擫鳴琴邯鄲紛屣步長袖曵三街兼金輕一顧有美獨臨風佳人在遐路相思欲褰衽叢臺日已暮邯鄲歌詩彚列在晉無名氏梁武帝回顧灞陵上北指邯鄲道短衣妾不傷南山為君老南郡歌齊陸厥江南可採蓮蓮生荷已大旅鴈向南飛浮雲復如蓋望美積風露踈麻成襟帶雙珠惑漢臯蛾眉迷下蔡玉齒徒粲然誰與啓含貝京兆歌通典曰京兆馮翊扶風皆古雍州之域秦始皇以為內史漢景帝二年分置左右內史武帝改左內史為左馮翊右內史為右扶風後與京兆號三輔齊陸厥兔園夾池水修竹復檀欒不如黃山苑儲胥與露寒邐迤傍無界岑崟鬱上干上干入翠微下趾連長薄芳露浸紫莖秋風搖素萼鴈起宵未央雲間月將落照梁柱兮影裴回承露盤兮光照灼夀陵之街走狐兔金巵玉碗會銷鑠願奉蒲萄花為君實羽爵岑崟一作嶔岑左馮翊歌齊陸厥上林潏紫泉離宫赫千户飛鳴亂鳬鴈參差雜蘭杜比翼獨未羣連葉誰為伍一物或難致無云泣易覩中山孺子妾歌二首漢書曰詔賜中山靖王子噲及孺子妾氷未央才人歌詩四篇如淳曰孺子幼少稱孺子妾宫人也顔師古曰孺子王妾之有品號者妾王之衆妾也氷其名才人天子內官按此謂以歌詩賜中山王及孺子妾未央才人等爾纍言之故云及也而陸厥作歌乃謂之中山孺子妾失之逺矣藝文志又曰臨江王及愁思節士歌詩四篇李夫人及幸貴人歌詩三篇亦皆纍辭也齊陸厥未央才人中山孺子一笑傾城一顧傾市傾城不自美傾市復為容願把陵陽袖披雲望九重如姬寢臥內班媫坐同車洪波陪飲帳林光宴秦餘嵗暮寒飈及秋水落芙蕖子瑕矯後駕安陵泣前魚賤妾終已矣君子定焉如媫一作妾賤妾終已矣一作賤妾恩已畢未央才人歌梁庾肩吾從來守未央轉欲訝春芳朝風凌日色夜月奪燈光相逢儻遊豫暫為卷衣裳臨江王節士歌齊陸厥木葉下江波連秋月照浦雲歇山秋思不可裁復帶秋風來秋風來已寒白露驚羅紈節士慷慨髮衝冠彎弓挂若木長劒竦雲端李夫人及貴人歌齊陸厥屬車桂席塵豹尾香煙滅彤殿向蘼蕪青蒲復萎絶坐萎絶對蘼蕪臨丹階泣椒塗寡鶴羈雌飛且止雕梁翠壁網蜘蛛洞房明月夜對此淚如珠丹一作玉古樂苑卷三十七
