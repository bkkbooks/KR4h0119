body:
  text: 古樂苑卷四十八明梅鼎祚編雜歌謠辭晉國附諸歌束晳歌晉書曰束晳陽平元城人太康中郡界大旱晢為邑人請雨三日而雨注衆為作歌束先生通神明請天三日甘雨零我黍以育我稷以生何以疇之報束長生育一作萌徐聖通歌藝文列晉人中㑹稽典録曰徐𢎞字聖通為汝隂令誅鉏姦桀道不拾遺民乃歌之徐聖通政無雙平刑罰姦宄空醇酒歌拾遺記曰張華為九醖酒以三薇漬麴蘖出西羌麴出北胡胡中有指星麥四月火星出麥熟穫之糵用水潰麥三夕而萌芽雞鳴而用之俗呼為雞鳴麥釀酒醇美久含令人齒動若大醉不呌笑搖蕩令人肝腸消爛俗人謂為消腸酒或云醇酒可為長宵之樂閭里歌曰寧得醇酒消腸不與日月爭光應詹歌晉書曰王澄惠帝末為荆州牧假應詹督南平天門武陵三郡軍事天下大亂詹境獨全百姓歌之亂離既普殆為灰朽僥幸之運賴兹應后歲寒不凋孤境獨守拯我塗炭惠隆丘阜潤同江海恩猶父母并州歌見趙書樂府廣題曰晉汲桑清河貝丘人力能扛鼎殘忍少恩六月盛暑重裘纍裀使十餘人扇之忽不清涼便斬扇者并州大姓田蘭薄盛斬於平原士女慶賀奔走道路而歌之士為將軍何可羞六月重茵被狐裘不識寒暑斷人頭雄兒田蘭為報讐中夜斬首謝并州狐一作豹襄陽兒童歌晉書曰山簡字季倫永嘉初為南征將軍出鎮襄陽于時四方冦亂朝野危懼簡優游卒歲惟酒是耽諸習氏者荆土豪族有佳園池簡每出嬉遊多之池上置酒輒醉名之曰髙陽池時有兒童歌曰山公出何許往至髙陽池日夕倒載歸酩酊無所知時時能騎馬倒著白接䍦舉鞭向葛彊何如并州兒彊家在并州簡愛將也吳人歌晉書曰鄧攸元帝時為吳郡太守刑政清明百姓歡悅後稱疾去百姓數千人留牽攸船不得進攸乃少停夜中發去吳人歌之紞如打五鼓雞鳴天欲曙鄧侯挽不留謝令推不去豫州歌晉書曰祖逖元帝時為豫州刺史躬自儉約督課農桑克巳務施不畜資産子弟耕耘負擔樵薪又收葬枯骨為之祭醊百姓感悅嘗置酒大㑹耆老中坐流涕曰吾等老矣更得父母死將何恨乃歌曰祖逖别傳作童謠附後幸哉遺黎免俘虜三辰既朗遇慈父𤣥酒忘勞甘瓠脯何以詠思歌且舞幸哉遺民免豺虎三辰既朗遇慈父𤣥酒清醪甘瓠脯亦何報思歌且舞幸宣城歌晉書陶汪咸康中為宣城內史招隱逸廣學舍士民知嚮方者辟為掾史百姓歌之人當勤學得主簿誰復為之陶明府三明歌中興書曰諸葛恢字道明避難過江與潁川荀道明闓陳留蔡道明謨俱有名譽號曰中興三明時人歌之曰京都三明各有名蔡氏儒雅荀葛清都一作師晉書作語庾公歌二首晉書五行志曰庾亮初鎮武昌出至石頭百姓於岸上歌之後連徴不入及薨於鎮以喪還都葬皆如謠言庾公上武昌翩翩如飛鳥庾公還揚州白馬牽旒旐庾公初上時翩翩如飛烏庾公還揚州白馬牽流蘇一作旒車阿子聞歌晉書五行志曰穆帝升平中童兒輩忽歌於道曰阿子聞曲終輒云云無幾而帝崩太后哭之曰阿子汝聞不阿子汝聞不亷歌晉書五行志曰升平末俗間忽作亷歌有扈謙者聞之曰亷者臨也歌云云內外悉臨國家其大諱乎少時而穆帝晏駕白門亷宫庭亷郗王歌世說曰郗超王珣並以俊才為桓大司馬所眷珣為主簿超為記室參軍超為人多鬚珣形狀短小時人為之歌曰髯參軍短主簿能令公喜能令公怒晉書作府中語御路楊歌晉書五行志曰晉海西公太和中民為此歌白者金行馬者國族紫為奪正之色明以紫間朱也海西公尋廢三子非海西公之子縊以馬韁死之明日南方獻甘露青青御路楊白馬紫游韁汝非皇太子那得甘露漿鳯皇歌晉書五行志曰晉海西公生皇子百姓歌之其歌甚美其㫖甚微海西公不男使左右向龍與內侍接生子以為己子一言桓溫將廢海西使為此歌鳯凰生一雛天下莫不喜本言是馬駒今定成龍子黃曇歌晉書曰桓石民為荆州鎮上明百姓忽歌曰黃曇子曲終又曰云云頃之而桓石民死王帎為荆州黃曇子乃是王忱字也忱小字佛大是大佛來上明也黃曇英揚州大佛來上明歷陽歌晉書五行志曰庾楷鎮歷陽百姓歌之後楷南奔桓𤣥為𤣥所殺重羅黎重羅黎使君南上無還時樊氏陂歌樊氏陂庾氏取之時人歌曰陂汪汪下田良樊子失業庾公昌桓𤣥時小兒歌吳均續齊諧記曰桓𤣥篡位後朱雀門中忽見兩小兒通身如墨相和作籠歌云云路邊小兒從而和之者數十人聲甚哀楚日既夕二小兒入建康縣至閣下遂成雙漆鼓槌明年春而桓敗車無軸倚孤木桓字也荆州送𤣥首用敗籠茵包之又芒繩束縳其尸沈諸江中悉如所歌焉芒籠茵繩縛腹車無軸倚孤木從者歌續安帝紀曰司馬休之兄尚為桓𤣥所敗休之奔淮泗頗得彼之人心從者為之歌可憐司馬公作性甚溫良憶昔水邊戲使我不能忘懊憹歌晉書五行志曰安帝隆安中百姓忽作懊憹之歌其曲曰云云尋而桓𤣥篡位義旗以三月二日掃定京都誅之𤣥之宫女及逆黨之家子女妓妾悉為軍賞東及歐越北流淮泗皆人有所獲故言時則草可結事則女可擷也草生可攬結女兒可攬擷歌三首晉書本傳曰嘉死之日人有壟上見之其所造三章歌䜟事過皆驗金陵志曰初王子年著䜟至安帝果為劉氏所代王嘉帝諱昌明運當極特申一期延其息諸馬渡江百年中當值卯金折其鋒欲知其姓草肅肅穀中最細低頭熟鱗身甲體永興福南史曰齊太祖髙皇帝諱道成姓蕭氏未受命時王子年作此歌按穀中精細者稻也即道也熟猶成也金刀利刃齊刈之金刀劉字刈猶剪也涼州大馬歌晉書曰張軌永寧初為涼州刺史王彌寇洛陽軌遣北宫屯張篡馬魴隂濬等率州軍擊破之又敗劉聰于河東京師歌之曰涼州大馬橫行天下涼州鴟苕寇賊消鴟苕翩翩怖殺人麴游歌晉紀曰麴允金城人也與游氏世為豪族西州為之歌曰麴與游牛羊不數頭南開朱門北望青樓晉書作語隴上歌晉書載記曰劉曜圍陳安于隴城安敗南走陜中曜使將軍平先丘中伯率徑騎追安安與壯士十餘騎於陜中格戰安左手奮七尺大刀右手執丈八蛇矛近交則刀矛俱發輒害五六逺則雙帶鞬服左右馳射而走平先亦壯健絶人與安搏戰三交奪其蛇矛而退遂追斬于澗曲安善於撫綏吉凶夷險與衆同之及其死隴上為之歌曜聞而嘉傷命樂府歌之隴上壯士有陳安軀幹雖小腹中寬愛養壯士同心肝䯀驄父馬鐵煆鞍七尺大刀奮如湍丈八蛇矛左右盤十蕩十決無當前戰始三交失蛇矛棄我䯀驄竄巖幽為我外援而懸頭西流之水東流河一去不還奈子何隴上健兒曰陳安軀幹雖小腹中寬愛養壯士同心肝騄驄駿馬鐵煆鞍七尺大刀配齊鐶丈八蛇矛左右盤十蕩十決無當前百騎俱出如雲浮追者千萬騎悠悠戰始三交失蛇矛十騎俱蕩九騎留棄我騄驄攀巖幽天非降雨逮者休阿呵嗚呼奈子何嗚呼阿呵奈子何趙書曰劉曜討陳安於隴城安下小將多堅戍不下城內得安死力謠曰云云與前小異關隴歌拾遺作苻秦時童謠晉書曰苻堅時關隴清宴百姓豐樂自長安至於諸州皆夾路樹槐栁二十里一亭四十里一驛旅行者取給於途工商貿販於道百姓歌之崔鴻前奏録曰王猛化洽六州人移風變百姓歌之曰長安大街夾樹楊槐下走朱輪上有鸞栖英彥雲集誨我萌黎苻秦鳯凰歌崔鴻前秦録曰永興三年九月鳯皇翔于東郊民因歌之鳯凰于飛其羽翼翼淵哉聖后饗齡萬億一作翊我聖后其齡萬億苻堅時長安歌晉書載記曰苻堅既滅燕慕容沖姊僞清河公主年十四有殊色堅納之寵冠後庭沖年十二亦有龍陽之姿堅又幸之姊弟專寵宫人莫進長安歌之咸懼為亂王猛切諫堅乃出沖後竟為沖所敗一雌復一雄雙飛入紫宫此本漢紫宫諺索稜歌崔鴻十六國春秋前秦録曰索稜字孟則燉煌人好學博聞姚萇甚重之委以機密文章詔檄皆稜之文也後為平原太守以德化民民畏而愛之歌曰懿矣明守庶績允釐剖符作宰實獲我思謠泰始中謠晉書曰泰始中人為賈充等謠言亡魏而成晉也賈裴王亂紀綱王裴賈濟天下賈充裴秀王沈南土謠晉書曰杜預都督荆州舊水道惟沔漢違江陵千數百里無通路又巴丘湖沅湘之㑹表裏山川實為險固荆蠻之所恃也預乃開楊口起夏口水道洪洞達巴陵千餘里內瀉長江之險外通零桂之漕南土美而謠曰後世無叛由杜翁孰識智名與勇功軍中謠晉書曰扯預遣周㫖伍巢等伏兵樂鄉城外孫歆遣軍出拒㫖等發伏兵隨㰴軍而入直至帳下虜㰴而還故軍中為之謠曰以計代戰一當萬閣道謠晉書曰潘嶽才名冠世為衆所疾泰始十年出為河陽令而鬱鬱不得志時尚書僕射山濤領吏部王濟裴楷等並為帝所親遇嶽內非之乃題閣道為謠閣道東有大牛王濟鞅裴楷鞦和嶠刺促不得休閣東有大牛和嶠鞅裴楷鞦王濟剔嬲不得休世說曰山公以器重朝望年踰七十猶知管時任貴勝年少若和裴王之徒並共宗詠有署閣柱云云或云潘尼作之竹林七賢論曰濤之處選非望路絶故貽是言蜀民謠許遜晉武帝太康初為蜀郡旌陽縣令屬歲大疫死者十七八遜以所授神方拯治之符呪所及登時而愈蜀民為之謠曰人無盜竊吏無奸欺我君活人病無能為童謠晉書曰石苞既定壽春以威惠服物淮南監軍王環輕苞素微又聞童謠因是密表苞與吳人交通宫中大馬幾作驢大石壓之不得舒武帝平吳後童謠三首宋書五行志曰武帝太康後江南童謠于時吳人皆謂在孫氏子孫故竊發為亂者相繼按橫目者四字自吳亡至晉元帝興幾四十年皆如童謠之言元帝懦而少斷局縮肉直斥之也局縮肉數橫目中國當敗吳當復宫門柱且莫朽吳當復在三十年後雞鳴不拊翼吳復不用力惠帝時兒童謠襄陽耆舊傳曰晉惠帝即位兒童謠曰云云乂河內溫縣有人如狂造書曰云云楊濟以問蒯欽欽垂泣曰皇太后諱季蘭兩火武皇帝諱炎字也此言武皇崩而太皇失尊罹大禍辱終始不以道不得附山陵乃歸於非所也及太后之見滅葬於街郵亭皆如其言晉書志曰楊駿居內府以㦸為衛死時又為㦸所害傷楊后被廢賈后絶其膳八日而崩崩葬街郵亭百姓哀之也兩火沒地哀哉秋蘭歸形街郵終為人歎晉書並作溫縣狂書溫縣狂書光光文長以㦸為墻毒藥雖行㦸還自傷以一作大雖一作即㦸一作刃惠帝永熙中童謠晉書五行志曰惠帝永熙中童謠時楊駿專權楚王用事故言荆筆楊版二人不誅則君臣禮悖故云幾作驢也二月末三月初荆筆楊版行詔書宫中大馬幾作驢大一作人王隱晉書云二月盡三月初桑生闕雪柳葉舒下同惠帝元康中京洛童謠二首晉書五行志曰惠帝元康中京洛童謠南風賈后字也白晉行也沙門太子小字也魯賈謐國也言賈后將與謐為亂以危太子而趙王因釁咀嚼豪賢以成篡奪不得其死之應也南風起兮吹白沙遙望魯國何嵯峨千歲髑髏生齒牙一無兮字南風烈烈吹黃沙遙望魯國鬱嵯峨前至三月滅汝家賈后傳有此謡與五行志所載不同其後賈謐既誅賈后尋亦廢死宋書五行志是時愍懷頗失衆望卒以廢黜不得其死焉城東馬子莫嚨哅比至來年纒汝􅐢東宫馬子莫聾空前至臘月纒汝􅐢愍懷太子傳紀此謠惠帝大安中童謠晉書五行志曰晉惠帝大安中童謠其後中原大亂宗藩多絶唯琅琊汝南西陽南頓彭城同至江東而元帝嗣統矣五馬浮渡江一馬化為龍浮宋書作游元康中童謠晉書五行志曰元康中天下啇農通著大鄣日時童謠曰云云及趙王倫篡位其目實眇焉屠蘇鄣日覆兩耳當見瞎兒作天子元康中洛中童謠晉書五行志曰晉元康中趙王倫既篡洛中有童謠數月而齊王成都河間義兵同㑹誅倫按成都西藩而在鄴故曰虎從北來齊東藩而在許故曰龍從南來河間水區而在關中故曰水從西來齊留輔政居于宫西有無君之心故曰登城看也虎從北來鼻頭汗龍從南來登城看水從西來河灌灌著布謠晉書曰齊王冏字景治趙王倫篡位冏起義兵誅之拜大司馬加九錫政皆決之而恣用羣小不復朝覲時人謠曰云云遂為長沙王所誅著布袙腹為齊持服洛下謠晉書曰長沙王乂武帝第六子也三王舉義乂率國應之後見冏專權奉天子攻冏斬之河間王顒與成都王穎同伐京師詔以乂為大都督以距顒相持數月東海王越慮事不濟潛收乂送金墉城密告張方方遣兵就金墉收乂炙殺之初乂執權之始洛下謠曰云云以正月二十五日廢後二日死如謠言草木萌牙殺長沙惠帝時洛陽童謠晉書曰惠帝時洛陽童謠明年而胡賊石勒劉羽反鄴中女子莫千妖前至三月抱胡腰蜀郡童謠元康三年正月歘一夜有火光地仍震童謠曰郫城堅盎底穿郫中細子李特細又江橋頭闕下市成都北門十八字又及羅尚在巴郡也又曰尚梁州刺史巴郡葛當下美巴郡字疑有誤又皮素之西上也又曰素益州刺史有客有客來侵門陌其氣欲索蜀人謠二首晉書曰羅尚字敬之一名仲太康未為荆州刺史及趙廞反于蜀乃假尚節為平西將軍益州刺史尚性貪少斷蜀人謠曰尚之所愛非邪則佞尚之所憎非忠則正富擬魯衛家成市里貪如豺狼無復極已晉書作蜀人言曰蜀賊尚可羅尚殺我懷帝永嘉初童謠晉書五行志曰司馬越還洛時童謠也按列傳越既與茍晞搆怨尋詔越為丞相領兖州牧督兖豫司冀幽并六州越辭丞相不受自許遷于鄄城移屯濮陽又遷于滎陽後自滎陽還洛懷帝紀曰永喜三年三月丁巳東海王越歸京師是也洛中大鼠長尺二若不早去天狗至天宋書作大同前晉書五行志曰茍晞將破汲桑時有此謠司馬越由是惡晞奪其兖州隟難遂搆焉按列傳東海孝獻王越字元超懷帝永嘉初出鎮許昌自許昌率茍晞及冀州刺史丁邵討汲桑破之越還于許長史潘滔說之曰兖州天下樞要公宜自牧乃轉茍晞為青州刺史由是與晞有隙元超兄弟大洛度上桑打椹為茍作王彭祖謠晉書曰王浚永嘉中進大司馬侍中大都督督幽冀諸軍事㑹京洛傾覆浚大樹威令專權橫恣時童謠曰幽州城門似藏户中有伏尸王彭祖有狐踞府門翟雉入聽事棗郎謠見王浚傳棗嵩浚之子壻浚聞責嵩而不能罪之也十囊五囊入棗郎愍帝初童謠晉書五行志曰愍帝初童謠至建興四年帝降劉曜在城東豆田壁中天子何在豆田中一作天子在何許近在豆田中王浚在幽州以豆有藿殺隱士霍原建興中江南謠晉書五行志曰建興中江南謠歌按白者晉行坑器有口屬瓮瓦瓮質剛亦金之類也訇如白坑破者言二都傾覆王室大壞也合集持作甒者元帝鳩集遺餘以主社稷未能尅復中原但偏王江南故其喻也及石頭之事六軍大潰兵人抄掠京邑爰及二宫其後三年錢鳯復攻京邑阻水而守相持月餘日焚燒城邑井堙木刋矣鳯等敗退沈充將其黨還吳興官軍踵之蹈藉郡縣充父子授首黨與誅者以百數所謂揚州破換敗吳興覆瓿甊瓿甊瓦器又小於甒也訇如白坑破合集持作甒揚州破換敗吳興覆瓿甊訇呼宏反坑宋書作坑甒音武瓿音部甊盧斗反童謠晉書曰溫嶠滅王敦先是童謠云云以為賊如韭柳尋得復生也剪韭剪韭斷楊柳河東小子令我與子明帝太寧初童謠晉書五行志曰明帝太寧初童謠及明帝崩成帝幼為蘇峻所逼遷于石頭御膳不足此大馬死小馬餓也髙山峻也言峻尋死石峻弟蘇石也峻死後石據石頭尋為諸公所破是亦山崩石破之應也惻惻力力放馬山側大馬死小馬餓髙山崩石自破成帝末童謠晉書五行志曰成帝之未童謠少日而宫車晏駕􅐀􅐀何隆隆駕車入梓宫咸康二年童謠晉書五行志曰咸康二年十二月河北謠言後如其言麥入土殺石虎晉起居注作麥如土虎晉書作武吳中童謠宋書五行志曰晉庾義在吳郡時吳中童謠無幾而庾義王洽相繼亡按晉史穆帝時庾羲為吳興內史王洽為吳郡內史徴拜領軍後皆卒於官義疑即羲也寧食下湖荇不食湖上蓴庾吳沒命喪復殺王領軍哀帝隆和初童謠晉書五行志曰哀帝隆和初童謠朝廷聞而惡之改年曰興寧民復歌曰云云哀帝尋崩升平五年而穆帝崩不滿斗不至十年也升平不滿斗隆和那得久桓公入石頭陛下徒跣走雖復改興寧亦復無聊生太和末童謠晉書五行志曰太和末童謠及海西公被廢百姓耕其門以種小麥犂牛耕御路白門種小麥京口民間謠二首晉書五行志曰王恭在京口民間忽有此謠按黃字上恭字頭也小字恭字下也尋如謠言黃頭小兒欲作賊阿公在城下指縛得黃頭小人欲作亂賴得金刀作蕃扞京口謠晉書五行志曰王恭鎮京口誅王國寶百姓為此謠按昔年食白飯言得志也今年食麥麩麥麩粗穢其精巳去明將敗也天公將加譴謫而誅之也捻嚨喉氣不通死之祥也敗復敗丁寧之辭也恭尋死京都人行咳疾而喉並喝焉昔年食白飯今年食麥麩天公誅謫汝教汝捻嚨喉嚨喉喝復喝京口敗復敗孝武帝太元末京口謠晉書五行志曰孝武帝太元末京口謠尋王恭起兵誅王國寶旋為劉牢之所敗故言拉颯棲也黃雌雞莫作雄父啼一旦去毛衣衣被拉颯棲荆州童謠晉書五行志曰殷仲堪在荆州時童謠未幾而仲堪敗桓𤣥遂有荆州芒籠目繩縛腹殷當敗桓當復柦𤣥時小兒歌首二句同安帝元興初童謠宋書五行志曰晉桓𤣥既篡有此童謠及𤣥敗走至江陵五月中誅如其期焉安帝紀桓𤣥篡位在安帝元興二年十二月也草生及馬腹鳥啄桓𤣥目民謠志曰時又有民謠云征鐘至穢之服桓四體之下稱𤣥自下居上猶征鐘之厠歌謠下體之詠民口也而云落地墜地之祥迸走之言其驗明矣征鐘落地桓迸走安帝元興中童謠宋書五行志曰晉安帝元興中桓𤣥既得志而有童謠及𤣥敗走諸柦悉誅焉郎君司馬元顯也長干巷巷長干今年殺郎君明年斬諸桓此歌亦見晉書桓𤣥傳明字作後司馬元顯時民謠二首宋書五行志曰司馬元顯時民謠詩此詩云襄陽道人竺曇林所作多所道行於世孟顗釋之曰十一口者𤣥字象也木亘桓也桓氏當悉走入關洛故云浩浩鄉也金刀劉也倡義諸公多姓劉娓娓美盛貌也當有十一口當為兵所傷木亘當北度走入浩浩鄉金刀既以刻娓娓金城中安帝義熙初童謠晉書五行志曰安帝義熙初童謠時官養盧龍寵以金紫奉以名州養之已極而龍不能懷我好音舉兵內伐遂成讐敵也及敗斬伐其黨如草木之成積焉按列傳盧循小字元龍元興二年寇廣州逐刺史吳隱之攝州事號平南將軍安帝乃假循征虜將軍廣州刺史義熙中劉裕破循于豫章循走交州為刺史杜慧度所殺官家養蘆化成荻蘆生不止自成積安帝義熙初謠二首晉書五行志曰盧龍據有廣州民間有謠云云後擁上流數州之地內逼京輦應天半之言時復有謠言云云龍後果敗不得入石頭蘆生漫漫竟天半蘆橙橙逐水流東風忽如起那得入石頭永嘉中長安謠晉書曰張實軌之子也軌卒授實涼州刺史進大都督劉曜逼遷天子實遣太府司馬韓璞東赴國難璞次南安諸羌斷軍路實擊破之斬級數千時焦嵩陳安寇隴右東與劉曜相持雍秦之人死者十八九初永嘉中長安語曰云云至是驗矣秦州中血沒腕唯有凉川倚柱觀腕一作踠觀一作看西土謠晉書曰張茂實之弟太興三年實既遇害州人推茂平西將軍凉州牧凉州大姓賈摹實之妻弟也勢傾西土先是謠曰云云茂以為信誘而殺之於是豪右屏迹威行凉域手莫頭圖凉州姑臧謠晉書曰張駿實之子茂卒駿嗣位大都督大將軍凉州牧西平公駿之立也姑臧謠曰云云至是而收復河南之地鴻從南來雀不驚誰謂孤雛尾翅生髙舉六翮鳯皇鳴張沖謠崔鴻前涼録曰張沖字長思燉煌人家財巨萬施之鄉閭時人為之謠曰推財不疑張長思龎世謠趙書曰燕人龎世為光祿勳奏案豪强苛尅人物咸懼疾之及卒門無弔客時人為之謠曰龎家之巷車馬鱗鱗泥丸之日無弔賓弔賓不來何所因由性苛尅寡所親張樓謠崔鴻後趙録曰張樓為臨水長嚴政酷刑殘忍無惠人謠之曰陽平張樓頭如箱見人切齒劇虎狼洪水謠亦見崔鴻前秦録晉書曰苻洪字廣世略陽臨渭氐人也先是隴右大雨百姓苦之謠曰云云故因名洪自稱大單于三秦王死僞諡惠武帝雨若不止洪水必起苻生時長安謠二首晉書曰苻生洪之孫嗣父健位僭稱帝初生夢大魚食蒲又長安謠曰云云東海苻堅封也時為龍驤將軍第在洛門之東生不知是堅以謠言之故誅其侍中魚遵及其子孫時又謠曰云云於是悉壞空城以􅓙之東海大魚化為龍男便為王女為公問在何所洛門東百里望空城鬱鬱何青青瞎兒不知法仰不見天星生闕一目苻堅時長安謠晉書載記曰苻堅時長安有此謠堅以鳳皇非梧桐不棲非竹實不食乃植桐竹數十萬株于阿房城以待之沖小字鳯皇至是終為堅賊入止阿房城焉鳯凰鳯凰止阿房苻堅時長安謠晉書曰秦之未亂也長安謠曰云云秦人呼鮮卑為白虜慕容垂之起于關東歲在癸未長鞘馬鞭擊左股太歲南行當復虜復一作避苻堅初童謠晉書五行志及堅敗於淝水為姚萇所殺在僞位凡三十年阿堅連牽三十年後若欲敗時當在江湖邊傳作江淮間苻堅時童謠晉書載記曰苻堅彊盛之時國有童謠云云堅聞而惡之每征伐戒軍候云地有名新城者避之後因壽陽之敗其國大亂竟死於新城佛寺河水清復清苻詔死新城復一作且秦人稱其君曰詔鮮卑謠晉書五行志曰時復有謠歌云識者以為魚羊鮮也田斗卑也堅自號秦言滅之者鮮卑矣其羣臣諫堅令盡誅鮮卑堅不從及淮南初為慕容沖所攻又為姚萇所殺身死國滅魚羊田斗當滅秦國中謠晉書桓豁聞苻堅國中謠有子二十人皆名石應之及堅敗淝水謝石為都督誰謂爾堅石打碎謠言魏書苻堅南伐至項城弟陽平公融攻夀春克之馳使白堅宜速進軍堅捨大軍於項城兼道赴之遂大敗單騎遁還淮北初謠言曰云云羣臣勸堅停項為六軍聲鎮堅不從堅不出項將謠魏書姚萇與慕容沖合攻苻堅於長安先是謠曰云云堅大信之至五將山姚萇執而縊殺之堅入五將山萇得朔馬謠晉書苻堅故將吕光僭即三河王位光徙西海郡人於諸郡謠曰云云復徙之西河朔馬心何悲念舊中心勞燕雀何徘徊意欲還故巢關東謠晉書初關東謠曰云云缺慕容垂之本名與苻丕相持經年百姓死幾絶幽州缺生當滅若不滅百姓絶燕童謠晉書曰慕容熙為政㬥虐其將馮跋張興皆坐事奔亡結盟推慕容雲為主因熙出城閉門距守熙夜至龍城攻北門不尅為雲所執弒之時義熙二年也初童謠曰云云藁字上有草下有禾兩頭然則禾草俱盡而成髙字雲父名拔小字禿頭三子而雲季也熙竟為雲所滅一束藁兩頭然禿頭小兒來滅燕大風謠晉書載記曰慕容寶嗣位以慕容德為都督冀兖六州諸軍事鎮鄴㑹魏師入中山寶出奔于薊時有謠曰云云於是德之羣臣勸德僭號稱元大風蓬勃揚塵埃八井三刀卒起來四海鼎沸中山頽惟有德人據三臺諺王公語王祥别傳曰晉受禪時廊廟之士莫不歡容而祥色不加怡時人為之語曰王公悢悢有送故之情也裴秀語虞預晉書曰秀字季彥河東聞喜人父潛魏太常秀有風操八歲能著文叔父徽有聲名秀年十餘歲有賓客詣徽出則過秀時人為之語曰後進領袖有裴秀進一作來石仲容晉書曰石苞字仲容渤海南皮人也雅曠有知局容儀偉麗故時人為之語曰石仲容姣無雙渤海晉書曰歐陽建字堅石世為冀方碩族雅有理思才藻美贍擅名北州人為之語曰渤海赫赫歐陽堅石劉功曹王隱晉書曰劉毅字仲雄僑居平陽太守杜恕逼迫舉毅為功曹月餘日沙汰郡吏百餘人三魏稱焉為之語曰但聞劉功曹不聞杜府君諺晉書陳留相樂安孫尹表曰劉毅前為司隸直法不撓當朝之臣多所按劾諺曰受堯之誅不能稱堯語晉書劉頌字子雅廣陵人漢廣陵厲王胥之後也世為名族同郡有雷蔣穀魯四姓皆出其下時人為之語曰雷蔣穀魯劉最為祖崔左丞語晉書曰崔洪字伯良博陵安平人以清厲顯名武帝世為御史治書朝廷憚之尋為尚書左丞時人為之語曰叢生棘刺來自博陵在南為鷂在北為鷹舊作歌諺晉書元康之後魯褒傷時貪鄙乃著錢神論引諺曰錢無耳可暗使成公綏亦有錢神論引諺曰錢無耳可使鬼貂不足晉書曰趙王倫僭位諸黨皆登卿相並列大封其餘同謀者咸超階越序不可勝紀至於奴卒厮役亦加爵位每朝㑹貂蟬盈坐時人諺曰貂不足狗尾續四部司馬魏略曰成都王頴伐長沙王乂募免奴為軍自稱四部司馬市郭人素謬語奴為尚故里語曰三部司馬階下兵四部司馬尚長明欲知太平須石鱉鳴江應元晉書曰江統字應元陳留圉人也靜默有逺志時人為之語曰嶷然稀言江應元二王晉書羊祜傳曰王衍嘗詣祜陳事辭甚俊辨祜不然之衍拂衣而起祜顧謂賓客曰王夷甫方以盛名處大位然敗俗傷化必此人也步闡之役祜以軍法將斬王戎故戎衍並憾之每言論多毁祜時人為之語曰二王當國羊公無德衛玠晉書曰琅琊王澄有髙名少所推服每聞衛玠言輒歎息絶倒故時人為之語曰衛玠談道平子絶倒玠别傳前後三聞為之三倒時人語曰衛君談道平子三倒慶孫越石晉書曰劉輿字慶孫雋朗有才局與弟琨名著當時京都為之語曰洛中奕奕慶孫越石越石琨字洛中諺三首洛中雅雅有三嘏世說曰劉粹字純嘏宏字終嘏漠字沖嘏是親兄弟王安豐甥並是王安豐女壻宏真長祖也洛中錚錚馮惠卿惠卿名蓀是播子蓀與邢喬俱司徒李𦙍外孫及𦙍子順並知名時稱馮才清李才明純粹邢洛中英英荀道明晉書曰荀闓字道明有名稱京都為之語英英晉中興書作奕奕王與馬晉書曰元帝以王敦為揚州刺史加廣武將軍尋進左將軍都督征討諸軍事假節帝初鎮江東威名未著敦與從弟導同心翼戴以隆中興時人為之語曰王與馬共天下幼輿語晉書列傳曰謝鯤字幼輿通簡有髙識任達不拘鄰家髙氏女有美色鯤嘗挑之女投梭折其兩齒時人為之語曰云云鯤聞之慠然長嘯曰猶不廢我嘯歌任達不已幼輿折齒郗王語晉書曰王坦之字文度弱冠與郗超俱有重名時人為之語曰云云嘉賓超小字也盛德絶倫郗嘉賓江東獨步王文度一作揚州獨步王文度後來出人郗嘉賓大才槃槃謝家安江東獨步王文度盛德日新郗嘉賓王羊語沈約云羊敬元尤長𨽻書子敬之後可以獨步時人語曰敬元羊欣字買王得羊不失所望王僧珍晉書曰王珉字季琰少有才藝善行書與兄珣並有名聲出珣右故時人為之語曰法護非不佳僧珍難為兄法護珣小字僧珍珉小字殷往嗣殷典通語曰殷禮字往嗣七歲就官學書在師未嘗戲弄行在舟車手不釋卷從曲阿往返遂不知隄瀆廣狹及行旅喧閙時人語曰竒才强記殷往嗣諺晉書凉從事中郎張顯上疏諫後主歆引諺曰云云今狐上南門亦災之大也又狐者胡也天意若曰將有胡人居於此城南面而居者也野獸入家主人將去五龍一門崔鴻前凉録曰辛攀字懷逺隴西狄道人父奭尚書郎兄鑒曠弟寶迅皆以才識知名泰雍為之語曰五龍一門金友玉昆長安語魏書初堅之未亂也關中土然無火而煙氣大起方數十里月餘不滅堅每臨聽訟觀令民冇怨者舉煙於城北觀而録之長安為之語曰欲得必存當舉煙二梁崔鴻前秦録曰梁讜字伯言博學有雋才與弟熙俱以文藻清麗見重一時人為之語曰關東堂堂二申兩房未若二梁瓌文綺章苻雅語秦書曰尚書令苻雅為人樂施乞人填門嘗曰天下物何常吾今日富後日貧耳忽一日不施則意不泰時人為之語曰不為權異富寧作苻雅貧五權晉書載記曰慕容越時公孫五樓為侍中尚書專總朝政王公內外無不憚之尚書都令史王儼諂事五樓遷尚書郎出為濟南太守入為尚書左丞時人為之語曰欲得侯事五樓太保語崔洪蜀李雄録曰雄異母兄始字伯敬為太保善撫士衆衆多歸之時人為之語曰欲養老屬太保書版語蜀書咸熙二年夏巴郡文立從洛陽還蜀見譙周周語次因書版示立曰云云典午者謂司馬也月酉者謂八月也至八月而文王果崩典午忽兮月酉沒兮䜟晉書初元明世郭璞為䜟曰云云謂成帝有子而以國祚傳弟君非無嗣兄弟代禪又有人姓李兒專征戰譬如車軸脫在一面兒者子也李去子木存車去軸為亘合成桓字也又爾來爾來河內大縣爾來謂自爾已來為元始溫字元子也故河內大縣溫也成康既崩桓氏始大故連言之又賴子之薨延我國祚痛子之隕皇運其暮二子者元子道子也溫志在篡奪事未成而死幸之也㑹稽王道子雖首亂晉國而其死亦晉衰之由也故云痛也父老書魏書世祖以沮遜牧健在凉州雖稱蕃致貢而內多乖戾於是親征城敗釋之初太延城中有一父老投書於敦煌城東門忽然不見其書一紙八字文曰云云又於震電之所得石丹書曰云云牧健立果七年而滅凉王三十年若七年河西河西三十年破帶石樂七年帶石山名在姑臧南山祀傍玉版文晉書慕容雋以永和八年僭即皇帝位初石季龍使人探䇿於華山得玉版文云云及此燕人咸以為俊之應也歲在申酉不絶如線歲在壬子真人乃見䜟文晉書姚興太史令髙魯遣其甥王景暉送玉璽一紐并圖䜟祕文與慕容德羣臣因勸德即尊號有德者昌無德者亡德受天命柔而復剛譙周䜟魏書賓人李特與弟流據蜀自稱大都督特少子雄僭稱帝傳至勢為晉桓溫所滅先是譙周云我死後三十年當有異人入蜀由之而亡蜀亡之歲去周亡三十二年周又著䜟曰云云卒如其言廣漢城北有大賊曰流曰特攻難得歲在𤣥宫自相尅時人語髙僧傳曰釋道溫姓皇甫安定朝那人髙士謐之後也年十六入廬山依逺公受學大明中敕為都邑僧主纍當講任稟位之賓填委相屬精勤導物數感神異帝悅之賜錢五十萬時人為之語曰疑按大明是宋孝武帝詩紀附晉誤帝王傾財溫公率則上天懷感神靈降德時人語又曰釋慧靜姓王東阿人少游學伊洛之間晚歷徐兖容甚黑而識悟清逺時洛中有沙門道經亦解邁當世與靜齊名而耳甚長大故時人語曰洛下長大耳東阿黑如墨有問無不酬有酬無不答詩紀附晉古樂苑卷四十八
