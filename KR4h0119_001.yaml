body:
  text: 古樂苑卷一明梅鼎祚編郊廟歌辭樂記曰王者功成作樂治定制禮是以五帝殊時不相沿樂三王異世不相襲禮明其有損益也然自黃帝以來至于三代千有餘年而其禮樂之備可以考而知者唯周而已周昊天有成命乃郊祀天地之樂歌也清廟祀太廟之樂歌也我將祀明堂之樂歌也載芟良耜藉田社稷之樂歌也然則祭樂之有歌其來尚矣兩漢巳後世有制作其所以用於郊廟朝廷以接神人之歡者其金石之響歌舞之容亦各因其功業治亂之所起而本其風俗之所由武帝時詔司馬相如等造郊祀歌詩十九章五郊互奏之又作安世歌詩十七章薦之宗廟至明帝乃分樂為四品一曰大豫樂典郊廟上陵之樂郊樂者易所謂先王以作樂崇德殷薦上帝宗廟樂者虞書所謂琴瑟以詠祖考來格詩云肅雍和鳴先祖是聽也二曰雅頌樂典六宗社稷之樂社稷樂者詩所謂琴瑟擊鼓以御田祖禮記曰樂施于金石越于音聲用乎宗廟社稷事乎山川鬼神是也永平三年東平王蒼造光武廟登歌一章稱述功德而郊祀同用漢歌魏歌辭不見疑亦用漢辭也武帝始命杜夔創定雅樂時有鄧靜尹商善訓雅歌歌師尹胡能習宗廟郊祀之曲舞師馮肅服養曉知先代諸舞夔總領之魏復先代古樂自夔始也晉武受命百度草創泰始二年詔郊廟明堂禮樂權用魏儀遵周室肇稱殷禮之義但使傅玄改其樂章而已永嘉之亂舊典不存賀循為太常始冇登歌食舉之樂明帝太寧末又詔阮孚增益之至孝武太元之世郊祀遂不設樂宋文帝元嘉中南郊始設登歌廟舞猶闕乃詔顔延之造天地郊登歌三篇大抵依倣晉曲南齊梁陳初皆沿襲後更創制以為一代之典元魏宇文繼有朔漢宣武已後雅好胡曲郊廟之樂徒有其名隋文平陳始獲江左舊樂乃調五音為五夏二舞登歌房中等十四調賓祭用之唐髙祖受禪未遑改造樂府尚用前世舊文武德九年乃命祖孝孫修定雅樂而梁陳盡吳楚之音周齊雜胡戎之伎於是斟酌南北考以古音作為唐樂漢郊祀歌漢書禮樂志曰武帝定郊祀之禮祠太乙于甘泉就乾位也祭后土于汾陰澤中方丘也乃立樂府采詩夜誦有趙代秦楚之謳以李延年為協律都尉多舉司馬相如等數十人造為詩賦略論律呂以合八音之調作十九章之歌以正月上辛用事草泉圜丘使童男女七十人俱歌昏祠至明夜嘗有神光如流星止集于祠壇天子自竹宫而望拜百官侍祠者數百人皆肅然動心焉其餘巡狩福應之事不序郊廟是時河間獻王獻所集雅樂天子下太樂官常存肄之歲時以備數然不常御常御及郊廟皆非雅聲今漢郊廟詩歌未有祖宗之事八音調均又不協于鐘律而內有掖庭材人外有上林樂府皆以鄭聲施于朝廷哀帝即位下詔罷樂府官郊祭樂及古兵法武樂在經非鄭衛之樂者條奏别屬他官丞相孔光大司空何武奏郊祭樂六十二人給祠南北郊宋書樂志曰漢武頗造新歌然不以光揚祖考崇述正德但多詠祭祀及祥瑞而巳今按其首練時日曰靈之來靈之至迎神也帝臨五章歌五帝也泰元三章統頌天地而日出入言人命不能安固武帝願乘黃之徠下如黃帝之升而仙也其後或紀瑞應或祝神釐赤蛟曰禮樂成靈將歸則送神之曲也後代郊祀樂府多倣之大都本騷九歌招魂故其詞幽深峻絶練時日練時日侯有望焫膋蕭延四方九重開靈之斿垂惠恩鴻祜休靈之車結玄雲駕飛龍羽旄紛靈之下若風馬左倉龍右白虎靈之來神哉沛先以雨般裔裔靈之至慶陰陰相放怫震淡心靈已坐五音飭虞至旦承靈億牲繭栗粢盛香尊桂酒賓八鄉靈安留吟青黃遍觀此眺瑶堂衆嫭並綽奇麗顏如荼兆逐靡被華文厠霧縠曳阿錫被珠玉俠嘉夜茝蘭芳淡容與獻嘉觴般與班同放怫音昉弗俠與挾同帝臨張晏云此后土之歌也土數五故稱數以五坤為母故稱媪土色黃故稱上黃劉攽云帝指武帝改服色尚黃數用五富媪者由漢以土德王也按青陽四歌則后土當在中壇張説是矣帝臨中壇四方承宇繩繩意變備得其所清和六合制數以五海內安寧興文匽武后土富媪昭明三光穆穆優遊嘉服上黃媪一云當作煴如作煴則坤母之説鑿矣青陽史記樂書曰春歌青陽夏歌朱明秋歌西皓冬歌玄冥四首漢書並云鄒子樂青陽開動根荄以遂膏潤并愛跂行畢逮霆聲發榮壧處頃聽枯稿復産乃成厥命衆庶熙熙施及夭胎羣生啿啿惟春之祺頃讀如傾啿音湛朱明朱明盛長敷與萬物桐生茂豫靡有所詘敷華就實既阜既昌登成甫田百鬼迪嘗廣大建祀肅雍不忘神若宥之傳世無疆顔師古云桐讀為通劉攽云桐幼稚也西皓西皓沆碭秋氣肅殺含秀垂穎續舊不廢姦偽不萌祅孽伏息隅辟越逺四貉咸服既畏兹威惟慕純德附而不驕正心翊翊廢叶音發玄冥玄冥陵陰蟄蟲蓋臧屮木零落抵冬降霜易亂除邪革正易俗兆民反本抱素懷朴條理信義望禮五嶽籍斂之時掩收嘉穀惟泰元漢書禮樂志曰建始元年丞相匡衡奏罷鸞路龍鱗更定詩曰涓選休成惟泰元尊媪神蕃釐經緯天地作成四時精建日月星辰度理陰陽五行周而復始雲風靁電降甘露雨百姓蕃滋咸循厥緒繼統共勤順皇之德鸞路龍鱗罔不肸飭嘉籩列陳庶幾宴享滅除凶災烈騰八荒鐘鼓竽笙雲舞翔翔招搖靈旗九夷賓將釐讀如僖共讀如恭享叶音鄉天地匡衡奏罷黻繡周張更定詩曰肅若舊典天地並況惟豫有慕爰熙紫壇思求厥路恭承禋祀緼豫為紛黻繡周張承神至尊千童羅舞成八溢合好效歡虞泰一九歌畢奏斐然殊鳴琴竽瑟會軒朱璆磬金鼓靈其有喜百官濟濟各敬厥事盛牲實爼進聞膏神奄留臨須搖長麗前掞光耀明寒暑不忒況皇章展詩應律琄玉鳴含宮吐角激徴清發梁揚羽申以商造兹新音永久長聲氣逺調鳳鳥鴹神夕奄虞蓋孔享溢與佾同軒朱即朱軒鴹古翔字明章以後叶音日出入日出入安窮時世不與人同故春非我春夏非我夏秋非我秋冬非我冬泊如四海之池遍觀是耶謂何吾知所樂獨樂六龍六龍之調使我心若訾黃其何不徠下天馬漢書武帝紀曰元鼎四年秋馬生渥窪水中作天馬之歌禮樂志作元狩三年李棐曰南陽新野有暴利長武帝時遭刑屯田燉煌界數於渥窪水旁見羣野馬中冇竒者與凡馬異來飲此水利長先作土偶持勒靽於水旁馬玩習久之代土偶持勒靽收得獻之欲神異之云從水中出也太初四年春二師將軍李廣利斬大宛王首獲汗血馬來作西極天馬之歌西域傳曰大宛國多善馬馬汗血言其先天馬子也應劭曰大宛有天馬種蹄踏石汗血踏石者謂踏石而有迹言其蹄堅利汗血者謂汗從前肩髆出如血號一日千里也張騫傳曰漢武帝初發書易曰神馬當從西北來得烏孫馬好名曰天馬及得宛馬汗血益壯更名烏孫馬曰西域馬宛馬曰天馬云史記樂書别有二歌與此小異今載於後太一況天馬下霑赤汗沫流赭志俶儻精權奇籋浮雲暗上馳體容與迣萬里今安匹龍為友天馬歌逝籋音躡迣音古迾字師古云迣與厲同天馬徠從西極涉流沙九夷服天馬徠出泉水虎脊兩化為鬼天馬徠歷無草徑千里循東道天馬徠執徐時將搖舉誰與期天馬徠開逺門竦豫身逝昆侖天馬徠龍之媒遊閶闔觀玉臺西極天馬歌馬應劭云辰曰執徐言得天時歲在辰也天門天門開詄蕩蕩穆並騁以臨饗光夜燭德信著靈寖平而鴻長生豫大朱塗廣夷石為堂飾玉梢以舞歌體招搖若永望星留俞塞隕光照紫幄珠熉黃幡比翅回集二雙飛常羊月穆穆以金波日華耀以宣明假清風軋忽激長至重觴神裴徊若留放殣冀親以肆章函蒙祉福常若期寂漻上天知厥時泛泛滇滇從髙斿殷勤此路臚所求佻正嘉吉𢎞以昌休嘉砰隱溢四方專精厲意逝九閡紛云六幕浮大海詄讀如迭殣音覲閡叶音改景星一曰寶鼎歌漢書武帝紀曰元鼎四年夏六月得寶鼎后土祠旁作寶鼎之歌禮樂志曰景星元鼎五年得鼎汾陰作景星顯見信星彪列象載昭庭日親以察參侔開闔爰推本紀汾脽出鼎皇祜元始五音六律依韋響昭雜變並會雅聲逺姚空桑琴瑟結信成四興遞代八風生殷殷鐘石羽籥鳴河龍供鯉醇犧牲百味旨酒布蘭生泰尊柘漿析朝酲微感心攸通修名周流常羊思所并穰穰復正直往寧馮蠵切和疏寫平上天布施后土成穰穰豐年四時榮脽音誰寧叶音寧齊房一曰芝房歌漢書武帝紀曰元封二年夏六月甘泉宮內中産芝九莖連葉作芝房之歌故詔書曰上帝溥臨不異下房賜朕𢎞休是也禮樂志曰齊房元封二年芝生甘泉齊房作古辭别有靈芝歌一首載後齊房産草九莖連葉宮童效異披圖按諜玄氣之精回復此都蔓蔓日茂芝成靈華后皇后皇嘉壇立玄黃服物發冀州兆蒙祉福沇沇四塞徦狄合處經營萬億咸遂厥宇沇音兖徦即遐華燁燁華燁燁固靈根神之斿過天門上千乘敦昆侖神之出排玉房周流雜拔蘭堂神之行旌容容騎沓沓般傱傱神之徠泛翊翊甘露降慶雲集神之揄臨壇宇九疑賓夔龍舞神安坐鴹吉時共翊翊合所思神嘉虞申二觴福滂洋邁延長沛施祐汾之阿揚金光橫泰河莽若雲增揚波遍臚歡騰天歌敦讀如屯五神五神相包四鄰土地廣揚浮雲扢嘉壇椒蘭芳璧玉精垂華光益億年美始興交於神若有承廣宣延咸畢觴靈輿位偃蹇驤卉汨臚析奚遺淫淥澤􅓭然歸朝隴首一曰白麟歌漢書武帝紀曰元狩元年冬十月行幸雍獲白麟作朝隴首覽西垠靁電尞獲白麟爰五止顯黃德圖胸虐熏鬻殛闢流離抑不詳賔百僚山河饗掩回轅鬗長馳騰雨師灑路陂流星隕感惟風籋歸雲撫懷心尞古燎字象載瑜一曰赤雁歌漢書禮樂志曰太始三年行幸東海獲赤鴈作象載瑜白集西食甘露飲榮泉赤鴈集六紛員殊翁雜五采文神所見施祉福登蓬萊結無極西叶音先赤蛟赤蛟綏黃華蓋露夜零晝暗濭百君禮六龍位勺椒漿靈已醉靈既享錫吉祥芒芒極降嘉觴靈殷殷爛揚光延壽命永未央杳冥冥塞六合澤汪濊輯萬國靈禗禗象輿轙票然逝旗逶蛇禮樂成靈將歸託玄德長無衰太一歌史記樂書曰武帝得神馬渥窪水中次以為太一之歌後伐大宛得千里馬馬名蒲梢次作以為歌中尉汲黯進曰凡王者作樂上以承祖宗下以化兆民今陛下得馬詩以為歌協於宗廟先帝百姓豈能知其音邪上默然不説太一貢兮天馬下霑赤汗兮沫流赭騁容與兮跇萬里今安匹兮龍與友蒲梢歌天馬徠兮從西極經萬里兮歸有德承靈威兮降外國涉流沙兮四夷服靈芝歌太平御覽作班固郊祀靈芝歌古辭因露寢兮産靈芝象三德兮瑞應圖延壽命兮光此都配上帝兮象太微參日月兮揚光輝瑞應一作應瑞古樂苑卷一
