body:
  text: 古樂苑卷三十三明梅鼎祚編雜曲歌辭漢無名氏並蝶蝶行古辭蝶蝶之遨遊東園奈何卒逢三月養子燕接我苜蓿間持之我入紫深宫中行纏之傳欂櫨間雀來燕燕子見銜哺來搖頭鼓翼何軒奴軒持一作披同前梁李鏡逺青春己布澤微蟲應節歡朝出南園裏暮依華葉端菱舟追或易風池渡更難羣飛終不逺還向玉階蘭春一作年驅車上東門行此與冉冉孤生竹並漢十九首中詩古辭驅車上東門遙望郭北墓白楊何蕭蕭松柏夾廣路下有陳死人杳杳即長暮潛寐黃泉下千載永不寤浩浩隂陽移年命如朝露人生忽如寄夀無金石固萬嵗更相送賢聖莫能度服食求神仙多為藥所誤不如飲美酒被服紈與素駕言出北闕行藝文題云驅車上東門則此擬作晉陸機駕言出北闕躑躅遵山陵長松何鬱鬱丘墓互相承念昔殂沒子悠悠不可勝安寢重冥廬天壤莫能興人生何所促忽如朝露凝辛苦百年間戚戚如履氷仁知亦何補遷化有明徵求仙鮮克仙太虛安可凌良會罄美服對酒宴同聲安可凌一作不可凌傷歌行傷歌行側調曲也古辭傷日月代謝年命遒盡絶離知友傷而作歌也玉臺作魏明帝古辭昭昭素明月輝光燭我牀憂人不能寐耿耿夜何長微風吹閨闥羅帷自飄揚攬衣曳長帶屣履下髙堂東西安所之徘徊以倣徨春鳥翻南飛翩翩獨翺翔悲聲命儔匹哀鳴傷我腸感物懷所思泣涕忽霑裳佇立吐髙吟舒憤訴穹蒼翻一作向悲歌古辭悲歌可以當泣逺望可以當歸思念故鄉鬱鬱纍纍欲歸家無人欲渡河無船心思不能言腸中車輪轉前緩聲歌按緩聲本為歌聲之緩非言命也陸機前緩聲歌言將前慕仙遊冀命長緩謝惠連後緩聲歌大略戒居髙位而為讒諂所蔽與前歌異古辭水中之馬必有陸地之船但有意氣不能自前心非木石荆根株數得覆蓋天當復思東流之水必有西上之魚不在大小但有朝於復來長笛續短笛欲今皇帝陛下三千萬同前晉陸機遊仙聚靈族髙會曾城阿長風萬里舉慶雲鬱嵯峨宓妃興洛浦王韓起太華北徵瑶臺女南要湘川娥肅肅霄駕動翩翩翠蓋羅羽旗棲瓊鸞玉衡吐鳴和太容揮髙弦洪崖發清歌獻酬既已周輕舉乘紫霞總轡扶桑枝濯足暘谷波清輝溢天門垂慶惠皇家枝一作底同前宋孔寧子供帳設玄宫衆仙胥旅亞照照二儀曠雍容風雲暇北伐太行鼓南整九疑駕笙歌興洛川鳴簫起秦榭鈞天異三代廣樂非韶夏滿堂皆人靈列筵必羽化烏可循日留兔自延月夜弱水時一濯扶桑聊暫舍兆旬方履端千齡配八蠟同前梁沈約羽人廣宵宴帳集瑤池東開霞泛綵靄澄霧迎香風龍駕出黃苑帝服起河宫九疑轥煙雨三山馭螭鴻玉鑾乃排月瑤軷信凌空神行燭玄漠帝斾委曾虹簫歌美嬴女笙吹悅姬童瓊漿且未洽羽轡已騰空息鳳曾城曲滅景清都中隆祐集皇代委祚溢華嵩後緩聲歌一作前緩聲歌羲和纖阿去嵯峨覩物知使命余轉欲悲歌憂戚人心胸處山勿居峰在行勿為公居峰太阻鋭為公遇讒蔽邪琴自踈越雅韻能揚揚滑滑相混同終始福祿豐緩歌行宋謝靈運飛客結靈友凌空萃丹丘習習和風起采采彤雲浮娥皇發湘浦霄明出河洲宛宛連螭轡裔裔振龍旒浮一作流旒一作輈此首闕枯魚過河泣古辭枯魚過河泣何時悔復及作書與魴鱮相教慎出入古咄唶歌潘安仁笙賦曰詠園桃之夭夭歌棗下之纂纂歌曰棗下纂纂朱實離離宛其死矣化為枯枝纂纂棗花也棗之纂纂盛貌實之離離將哀言榮謝之各有時也棗下何纂纂出此古辭棗下何纂纂榮華各有時棗欲初赤時人從四邊來棗適今日賜誰當仰視之闕誤棗下何纂纂梁簡文帝垂花臨碧澗結翠依丹巘非直入遊宫兼期植靈苑落日芳春暮遊人歌吹晚弱刺引羅衣朱實凌還幰且歡洛浦詞無羡安期逺同前二首隋王胄栁黃知節變草緑識春歸復道含雲影重簷照日輝御栁長條翠宫槐細葉開還得聞春曲便逐鳥聲來古八變歌選詩拾遺云古歌有八變九曲之名未詳其義古辭下同北風初秋至吹我章華臺浮雲多暮色似從崦嵫來枯桑鳴中林絡緯響空階翩翩飛蓬征愴愴遊子懷故鄉不可見長望始此回豔歌又謂之妍歌辭曰妍歌展妙聲發曲吐令辭又泛泛江漢萍飄蕩永無根又庭中有竒樹上有悲鳴蟬又青青陵中草傾葉晞朝日陽春被惠澤枝葉可纜結皆妍歌之遺句今日樂上樂相從步雲衢天公出美酒河伯出鯉魚青龍前鋪席白虎持榼壺南叶工鼓瑟北叶吹笙竽姮娥垂明璫織女奉瑛琚蒼霞揚東謳清風流西歈垂露成帷幄奔星扶輪輿樂府行胡從何方列國持何來氍毺㲮􅚊五木香迷迭艾蒳及都梁五木御覽作五味古樂府蘭草自然香生於大道傍腰鐮八九月俱在束薪中雜歌一作離歌晨行梓道中梓葉相切磨與君别交中繣如新縑維裂之有餘絲吐之無還期維一作羅古歌上金殿著玉樽延貴客入金門入金門上金堂東厨具肴膳椎牛烹豬羊主人前進酒彈瑟為清商投壺對彈棊博奕並復行朱火揚煙霧博山吐微香清樽發朱顔四座樂且康今日樂相樂延年夀千霜古歌秋風蕭蕭愁殺人出亦愁入亦愁座中何人誰不懷憂令我白頭故地多飈風樹木何修修離家日趨送衣帶日趨緩心思不能言腸中車輪轉古歌太平御覽終久作稴穇焉作安高田種小麥終久不成穗男兒在他鄉焉得不憔悴古歌銅雀辭太平御覽作魏文帝歌長安城西雙員闕上有一雙銅雀宿一鳴五穀生再鳴五穀熟文選注所引遺宿字古絶句四首藁砧今何在山上復有山何當大刀頭破鏡飛上天藁砧砆也謂夫也山上有山出也大刀頭刀上環也破鏡言半月當還也日暮秋雲隂江水清且深何用通音信蓮花玳瑁簪莵絲從長風根莖無斷絶無情尚不離有情安可别南山一樹桂上有雙鴛鴦千年長交頸歡慶不相忘古五雜組詩古辭五雜組岡頭草往復還車馬道不獲已人將老同前齊王融五雜組慶雲發往復還經天月不獲巳生胡越同前梁范雲五雜組會塗山往復還兩崤關不得巳孀與鰥古兩頭纎纎詩古辭下同兩頭纎纎月初生半白半黑晴中睛腷腷膊膊雞初鳴磊磊落落向曙星同前兩頭纎纎青玉玦半白半黑頭上髮腷腷膊膊春氷裂磊磊落落桃初結同前齊王融兩頭纎纎綺上紋半白半黑鷦翔羣腷腷膊膊烏迷星磊磊落落玉石分古樂苑卷三十三
