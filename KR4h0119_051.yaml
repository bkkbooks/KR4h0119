body:
  text: 古樂苑卷五十一眀梅鼎祚編仙歌曲辭謡諺附霞唱雲謡丹圗緑字列仙真誥具有其文即不無後世依托而其指緣祕檢語率𤣥超亦被管弦是名天樂今取其為歌吟者附録于斯若彼神仙步虛鳯簫龍笛之屬代多作者前已類次方回語列仙傳曰方回堯時隱人也堯聘以為閭士練食雲母亦與民人冇病者隱於五柞山中夏啓末為宦士為人所劫閉之室中從求道因化而得去更以方回掩封其户時人曰桀夏啓一作夏時得方回一丸泥塗門户終不可開綏山謡列仙傳曰葛由者羌人也周成王時好刻木羊賣之一旦騎羊而入西蜀蜀中王矦貴人追之上綏山隨之者不復還皆得仙道故里諺曰得綏山一桃雖不得仙亦足以豪周宣王時採薪人歌列仙傳曰周宣王時郊聞採薪之人行歌時人莫能知之老君曰此活國中人其語祕矣斯皆修習無上真正之道也巾金巾入天門呼長精歙𤣥泉鳴天鼓養泥丸真仙通鑑曰長桑公子者常散髮行歌曰巾金巾入天門呼長精吸𤣥泉鳴天鼓養丹田柱下史聞之曰彼長桑公子所歌之詞得服五星守洞房之道乞食公歌三一經曰楚莊公時市長宋來子常灑掃一市時有乞食公入市經日乞而歌一市人無解歌者獨來子忽悟疑是仙人乃師乞食公棄官追逐積十三年公遂授以中仙之道來子今在中嶽乞食公者西嶽真人馮延夀周宣王時史官也手為天馬鼻下為山源天庭發雙華山源障隂邪清晨按天馬來詣太真家真人無郍隱又以滅百魔天庭是兩眉之間眉之角也山源是鼻下人中之本側在鼻下小入谷中也華庭在兩眉之下是徹視之津梁天真是引靈之上房旦中暮怕咽液三九過急以手三九隂按之以為常令致靈徹視杜遏萬邪之道也漢初童謡雲笈七籖西王母傳曰漢初有四五小兒戲于路中一兒歌曰云云時人莫知唯張子房知之乃往拜焉曰此乃東玉公之玉童也仙人得道升天當揖金母而拜木公也自非冲虛登真之子莫知其津矣著青裙入天門揖金母拜木公赤雀辭列仙傳曰陶安公者六安鑄冶師也數行火火一旦散上行紫色衝天安公伏冶下求哀須㬰朱雀止冶上曰云云至期赤龍到大雨而安公騎之東南上安公安公冶與天通七月七日迎汝以赤龍長安中謡列仙傳曰隂長生者長安中渭橋下乞兒也常止于市中乞市人厭苦以糞灑之旋復在里中衣不見汚長吏知之械收繫著桎梏而續在市中乞又械欲殺之乃去灑者之家室自壞殺十餘人故長安中謡曰見乞兒與美酒以免破屋之咎西王母宴漢武帝命法嬰歌𤣥靈之曲二首漢武帝內傳曰元封元年七月七日西王母降于漢宫王母自設天厨精妙非常酒觴數遍王母命諸侍玉女作樂命法嬰歌𤣥靈之曲乃遣侍女招上元夫人夫人至自彈雲琳之琴歌步𤣥之曲大象雖廓廖我把天地户披雲沈靈輿倐忽適下土空洞成𤣥音至靈不容冶太真噓中唱始知風塵苦頤神三田中納精六關下遂乘萬龍椿馳騁盼九野𤣥圃遏北臺五城煥嵳峩啓彼無涯津泛此織女河仰止升綘庭下逰月窟阿顧盼八落外指招九雲遐忽不覺心榮豈吾少與多撫璈命衆女詠歌發中和妙暢自然樂為此𤣥雲歌韶盡至韻存真音辭無邪上元夫人歌步𤣥之曲上元夫人道君弟子也亦𤣥古以來得道總統其真籍亞于龜臺金母所降之處多使侍女相聞以為賔侣焉昔涉𤣥真道騰步登太霞負笈造天關借問大上家忽過紫薇垣真人列如麻渌景清飈起雲蓋映朱葩蘭宫敞朱闕碧空起璚沙丹臺結空構暐曄生光華飛鳯踶甍峙燭龍倚委蛇玉胎來綘芝九色紛相拏挹景練仙骸萬劫方童牙唯言夀有終扶桑不為查空起藝文作室啓西王母又命侍女田四妃答歌晨登太霞宫挹泚把玉蘭夕入𤣥元闕采蘂掇琅玕濯足匏瓜河織女立津盤吐納挹景雲味之當一餐紫微何濟濟璚輪服朱丹朝發汗漫府暮宿勾陳垣去去道不同且吝體所安二儀設猶存奚疑億萬椿莫與世人說行尸言此難漢武帝車子矦歌洞仙傳曰車子矦者扶風人漢武帝愛其清淨稍遷其位至侍中一朝語家云我今補仙官此春應去至夏中當暫還還少時復去如其言武帝思之乃作歌漢武帝集曰奉車子矦暴病一日死上甚悼之乃自為歌詩藝苑巵言曰幽蘭秀菌的為傳語嘉幽蘭兮延秀菌妖媱兮中溏華斐斐兮麗景風裴回兮流芳皇天兮無慧至人逝兮仙鄉天路逺兮無期不覺涕下兮霑裳蘇耽歌蘇耽桂陽人少以至孝著稱一日白母道杲巳圎升舉有日母曰吾獨恃爾爾去吾何依耽乃留一匱封鑰甚固若有所需告之如所願也預為植橋鑿井及郡人大疫但食一橋葉飲一泉水即愈而後一鶴降郡屋久而不去郡僚子弟彈之鶴乃舉足畫屋若書字焉辭曰鄉原一别重來事非甲子不記陵谷遷移白骨蔽野青山舊時翹足髙屋下見羣兒我是蘇仙彈我何為翻身雲外却返吾居一云耽騎白鶴來止郡城東北樓上人或挾彈彈之鶴以爪攖樓板似漆書云城郭雖是人民非二百甲子一來歸我是蘇仙彈我何為丁令威歌見雲笈七籖搜神記曰遼東城門有華表柱忽有一白鶴集柱頭時有少年舉弓欲射之鶴乃飛裴回空中而言遂髙上冲天今遼東諸丁云其先世冇升仙者不知名字有鳥有鳥丁令威去家千嵗今來歸城郭如故人民非何不學仙塜壘壘洞仙傳曰丁令威者遼東人少隨師學得仙道分身任意所欲嘗暫歸化為白鶴集郡城門華表柱頭言曰我是丁令威去家千嵗今來歸城郭如舊人民非何不學仙離塜纍遼東諸丁譜載令威漢初學道得仙修文殿御覽所引云城郭是人民非何不學仙去空伴冢纍纍張麗英石鼓歌金精山記曰漢時張芒女名麗英面有竒光不照鏡但對白紈扇如鑑焉長沙王吳芮聞其異質領兵來聘女時年十五聞芮來乃登此山仰卧坡髮覆于石鼓之下人謂之死芮使人往視之忽見紫雲鬱起遂失女所在石上留歌一首至今石鼓一處黑色直下狀女垂髮時人號為張女髮石鼓石鼓悲哉下土自我來觀民生實苦哀哉世事悠悠我意我意不可辱兮王威不可奪余志有鸞有鳯自歌自舞凌雲厯漢逺絶塵羅世人之子其如我何暫來期㑹運往即乖父兮母兮無傷我懷歌舞二字疑倒衛羅國王女配瑛靈鳯歌洞𤣥本行經曰西方衛羅國王有女字曰配瑛與鳯共處于是靈鳯常以羽翼扇女面後十二年中女忽冇胎王意怪之因斬鳯頭埋著長林丘中女後生女名曰皇妃王女思靈鳯之逰好駕而臨之長林丘中歌曰云云是鳯鬱然而生抱女俱飛徑入雲中杳杳靈鳯綿錦長歸悠悠我思永與願違萬劫無期何時來飛葛仙公歌三首真仙通鑑仙公諱𤣥字孝先句容人生而秀頴天才超軼名振江左州郡辟為掾固辭乃入赤城山精思學道赤烏七嵗八月十五日白日升天弟子鄉朋攀戀不巳于是仙公駐駕空中賦五言歌詩三篇降付鄉朋普令歌誦開悟方來真人昔遺教愍念孤癡子嬖邪不信道禍亂由斯起身隨朝露晞悔恨何有巳罪大不可掩流毒將誰理𡨕𡨕未出期劫盡方當止轉輪貧賤家仍復為役使四體或不完䠥􅍷行乞市不知積罪報怨天神不恃大道常無為𢎞之由善始吾今獲輕舉修行立功爾三界盡稽首從容紫宫裏停駕虛元中人生如流水臨别屬素翰粗標靈妙記我今便升天愍念諸儒英大道體虛無寂寂中有精視之若冥昧窈窈中昭眀莫言道虛誕所患不至誠奚不登名山誦是洞真經一諷而一詠𤣥音徹太清太上輝金容衆仙齊應聲十方散香花燔煙栴檀馨皇娥奏九韶鸞鳯諧和鳴龍駕翳空迎華蓋曜杳冥翛間劫仞臺帝釋歘降庭八王奉丹液挹潄身騰輕逍遙有無間流朗絶形名神童俠侍側自然朝萬靈飄飄八景輿逰衍白玉京七祖升福堂先亡悉超生王矦能篤信必為天下貞大人體至德一切䝉其成散誕逰山水吐納靈和津鍊氣同希夷靜詠道德篇至心宗𤣥一冥感今乃宣飛駕御九龍飄飄乘紫煙華景曜空衢紅雲擁帝前暫迂蓬萊宫倐忽已賔天偉偉衆真㑹渺渺凌重𤣥體固無終劫金顔隨日鮮歡樂太上境悲念一切頑誰能離死壞結是冥中緣悠悠成至道無有入無間微妙良難測智者謂我賢若能𢎞衆妙輕舉升神仙太一作亡頑一作人四真人降魏夫人歌真仙通鑑曰魏夫人齊于别寢忽有太極真人方諸青童扶桑神王清虛真人來降授夫人八索隱書黃庭等經于是四真吟唱各命玉女彈琴擊鐘吹簫合節而發太極發排空之歌青童吟太霞之曲神王諷晨啓之章清虛詠駕歘之辭太極真人歌丹明煥上清八風鼓太霞回我神霄輦遂造玉嶺阿咄嗟天地外九圍皆吾家上採日中精下飲黃月華靈觀空無中鵬路無間邪顧見魏賢安濁氣傷爾和勤研𤣥中思道成更相過九圍一作圉圉賢安夫人字更一作矢方諸青童歌太霞扇晨暉九氣無常形𤣥轡飛霄外八景乘髙清手把玉皇袂攜我晨中生盼觀七曜房朗朗亦冥冥超哉魏氏子有心復有精𤣥挺自嘉㑹金書東華名賢安密所研相期暘谷汧太霞扇晨暉一作七霞扇晨曜暘谷汧一作洛陽宫扶桑神王歌晨啓太帝室夕越匏瓜水碧海飛翠波連峯亦嶽峙浮輪雲濤際九龍同轡起虎旗鬱霞津靈風幡然理華存久樂道遂致髙神擬拔徙三緣外感㑹乃方始相期陽洛宫道成攜魏子虎一作羽華存夫人名清虛真人歌二首歘駕控清虛裴回西華館瓊林既神杪虎旗逐煙散慧風振丹旍明燭朗八煥解襟墉房裏神鈴鳴蒨粲棲景若林柯九絃𤣥中彈遺我積世憂釋此千年歎怡􅌓無極巳於夜復待旦瓊林既神杪一作華館璞輪張墉一作仙柯一作阿絃一作氣紫霞儛𤣥空神風無綱領歘然滿八區侁爾豁靈境八窗無常朗有冥亦有炅洞觀三丹田寂寂生形景凝神泥丸內紫房何蔚炳大帝命我來有以應神挺相遇女弟子雲姿卓鑠整愧無郢石運益彼自然頴勤密攝生道泄替結災眚靈期自有時攜袂陟松嶺風一作方侁一作祝靈境一作虛靜丹一作景王母贈魏夫人歌西王母傳曰紫虛元君魏華存夫人清齊于陽洛隱元之臺西王母與金闕聖君降于臺中乘八景輿同詣清虛上宫傳玉清隱書四卷授華存是時三元夫人馮雙禮紫陽左仙石路成太極髙仙伯延蓋公子西成真人王方平太虛真人南嶽赤松子桐柏真人王子喬等並降夫人小有清虛上宫絳房之中時夫人與王君為賔主焉設瓊酥緑酒金觴四奏各命侍女陳曲成之鈞于是王母擊節而歌駕我八景輿歘然入玉清龍旌拂霄漢虎旗攝朱兵逍遙𤣥津際萬流無暫停哀此去留㑹劫盡天地傾當盡無中景不死亦不生體彼自然道寂觀合太冥南嶽挺真幹玉映輝頴精有任靡期事虛心自受靈嘉㑹絳河曲相與樂未央漢一作上精一作闕期一作其雙禮珠彈雲璈而答歌玉清出九天神館飛霞外霄臺煥嵳峩靈夏秀蔚翳五華興翠華八風扇緑氣仰吟消魔詠俯研智與慧萬真啓晨景唱期絳房㑹挺頴德音子神映乃拂沛天嶽凌空樣洞臺深幽邃逰海悟井隘履真覺世穢儛輪宴重空筌魚自然廢回我大椿羅長謝朝生世髙仙盼逰洞靈之曲玉皇又命歘生入隱室見上清元君龜山君于是二真乃各命侍女王延賢于廣運等彈雲林琅玕之璈安德音范四珠擊昆明之筑左抱容韓賢賔吹鳯鸞之簫趙運子李慶玉拊流金之石辛白鵠鄭辟方燕婉來田雙連等四人合歌玉室煥東霞紫輦浮絳晨華臺何盼目此宴飛天元清靜太無中眇眇躡景遷吟詠大洞章唱此三九篇曲寢大漠內神王方寸間寂室思靈暉何事苦林山須㬰變衰翁回為孩中顔太上宫中歌此歌正言耳目之經也南嶽夫人喻許長史手把八雲氣英明守二童太真握眀鏡鑒合日月鋒雲儀拂髙闕驕女坐𤣥房愈行愈鮮盛英靈自爾通雲林與衆真吟詩十首真誥翼真檢曰併襟接景楊安以灼然顯說凡所興有待無待諸詩及辭喻諷㫖皆是雲林應降嬪仙矦事義並亦表著而南真自是訓授之師紫微則下教之匠並不關儔結之例但中侯昭靈亦似别有所在既事末一時故不正的的爾其餘男真或陪從所引或職司所任至如二君最為領據之主今人讀此辭事若不悟斯理者永不領其㫖故略標大意宜共密之駕歘敖八虛佪宴東華房阿母延軒觀朗嘯躡靈風我為有待來故乃越滄浪右英王夫人歌乘飈遡九天自駕三秀嶺有待裴回盼無待故當淨滄浪奚足勞孰若越𤣥井右紫微夫人答英歌寫我金庭館鮮駕三秀畿夜芝披華鋒咀嚼充長飢髙唱無逍遙各興無待歌空同酬靈音無待將如何鋒謂應作峰字右桐柏山真人歌王子喬朝逰鬱絶山夕偃髙暉堂振轡步靈鋒無近於滄浪𤣥井三仞際我馬無津梁倏歘九萬間八維巳相望有待非至無靈音有所喪鋒謂應作峯字右清靈真人歌裴𤣥仁龍旗舞太虛飛輪五嶽阿所在皆逍遙有感興冥歌無待愈有待相遇故得和滄浪奚足遼𤣥井不為多鬱絶尋步間俱㑹四海羅豈若絶明外三劫方一過右中侯夫人歌縱酒觀羣惠倐忽四落周不覺所以然實非有待逰相遇皆歡樂不過亦不憂衆影𤣥空中兩㑹自然疇右昭靈李夫人歌駕歘發西華無待有待間或眄五嶽峯或濯天河津釋輪尋虛舟所在皆纒綿芥子忽萬頃中有須彌山小大固無殊逺近同一緣彼作有待來我作無待親右九華安妃歌無待太無中有待大有際大小同一波逺近齊一㑹鳴絃𤣥霄顛吟嘯運八氣奚不酣靈液眄目娛九裔有無得𤣥運二待亦相益右太虛南嶽真人歌赤松子偃息東華靜揚軿運八方俯眄丘垤間莫覺五嶽崇靈阜齊淵泉大小互相從長短無少多大椿須㬰終奚不委天順縱神任空同右方諸青童君歌控飈扇太虛八景飛髙清仰浮紫宸外俯看絶落冥𤣥心空同間上下弗流停無待兩際中有待無所營體無則能死體有則攝生東賔㑹髙唱二待奚足爭命駕玉錦輪儛轡仰裴回朝逰朱火宫夕宴夜光池浮景清霞杪八龍正參差我作無待逰有待輒見隨髙㑹佳人寢二待互是非有無非有定待待各自歸東賔東嶽上卿大茅君也右南極紫元夫人歌紫微夫人歌真誥翼真檢曰紫微夫人名青娥字愈音王母第二十女也晉興寧三年降楊羲之家按紫微夫人詩共十七首而此下三首為歌故聊摘入龜闕鬱巍巍墉臺落月珠列坐九靈房叩璈吟太無玉簫和我神金醴釋我憂九月三日又宴酣東華內陳鈞千百聲青君呼我起折腰希林庭羽帔扇翠暉玉佩何鏗零俱指髙宸寢相期象中冥紫微歌此二篇紫微夫人歌此考真誥當是丙寅二月三十日此亦叙方諸東華之勝也褰裳濟渌河遂見扶桑公髙㑹太林墟賞宴𤣥華宫信道茍淳篤何不棲東峯四月十四日夕右英夫人吟歌此曲雲林右英夫人名媚蘭字申林王母第十三女受書為雲林宫右英夫人晉興寧三年諸真同降于楊君按共詩二十五首今亦僅取為歌者𤣥波振滄濤洪津鼓萬流駕景眄六虛思與佳人逰妙唱不我對清音與誰投雲中騁瓊輪何為塵中趨方諸宫東華上房靈妃歌曲楊君記曰東方赤氣中有言曰小鮮未烹鼎言我巖下悲當以此事咨啓司命故答稱此詩仍及下篇也紫桂植瑶園朱華聲悽悽月宫生蘂淵日中有瓊池左拔員靈曜右掣丹霞暉流金煥綘庭八景絶煙回緑蓋浮明朗控節命太微鳯精童華顔琳腴充長飢控晨揖太素乘歘翔玉墀吐納六虛氣玉嬪把巾隨彈璈南雲扇香風鼓錦披叩商百獸舞六天攝神威倐忽億萬椿齡紀鬱巍巍小鮮未烹鼎言我巖下悲太微𤣥清左夫人北停宫中歌曲停一作淳年晉興寧三乙丑十二月十七日夜太元真人司命君書出此詩云是青童宫中內房曲恆吟讃此和神鬱藹非真墟太無為我館𤣥公豈有懷縈䝉孤所難落鳯控紫霞矯轡登晨岸寂寂無濠涯暉暉空中觀隱芝秀鳯丘逡巡瑶林畔龍胎嬰爾形八瓊回素旦琅華繁玉宫結葩凌巖粲鵬扇絶億領拊翮扶霄翰西庭命長歌雲璈乘虛彈八風纒緑宇叢煙豁然散靈童擲流金太微啓璧案三元折腰舞紫皇揮袂讚朗朗扇景曜曄曄長庚煥超軿聳明刃下眄使我惋顧哀地仙輩何為棲林澗庭一作度杜廣平常喜歌一章杜契字廣平京兆杜陵人建安初渡江依孫策黃武二年學道隱居華陽淳景翳廣林曖日東霞升晨風舞六煙勃鬱八道騰五嶽何必秀名山亦足陵矯首躡洞阜棲心潜中興吐納胎精氣𤣥白誰能勝保命君告許虎牙思保命者三官保命司茅和敬𤣥子歌洞仙傳曰敬𤣥子者修行中部之道存道守三一常歌曰遙望崑崙山下有三頃田借問田者誰赤子字元先上生烏靈木雙闕夾兩邉日月互相照神路帶中間採藥三微嶺飲潄華池泉遨逰十二樓偃蹇步中原意欲觀綘宫正值子丹眠金樓憑玉几華蓋與相連顧見雙使者博著太行山長谷何崢嶸齊城相接鄰縱我飛龍轡忽臨無極淵黃精生泉底芝草披岐川我欲將黃精流丹在眼前裴徊飲流丹羽翼奮迅鮮意猶未策外子喬提臂牽所經信自險所貴得神仙烏一作二間一作天郭四朝扣船歌四首苻秦時人見雲笈七籖洞仙傳曰郭四朝者燕人也秦時得道來句曲山南所住處作塘遏澗水令深基墌垣墻今猶有可識處四朝乘小船逰戲其中每扣船歌曰清池帶靈岫長林鬱青葱𤣥鳥翔幽野悟言出從容鼓楫乘神波稽首希晨風未獲解脫期逍遙丘林中晨風謂上清玉晨之風非毛詩所稱鴧彼晨風之鳥也浪神九陔外研道逐全真戢此靈鳯羽藏我華龍鱗髙舉方寸物萬吹皆垢塵顧哀朝生蟪孰盡汝車輪女寵不蔽席男愛不盡輪朝生蜉蝣也以喻人之在世易致消歇蟪一作輩逰空落飛飈靈步無形方圎景煥眀霞九鳯唱朝陽揮翮扇天津暗藹慶雲翔遂造太微宇挹此金梨漿逍遙𤣥陔表不存亦不亡𤣥陔九陔也皆八極之外九霞之頂名也飛登木星亦云朗東陽之陔故若士語廬敖云與汗漫期于九陔之上也駕歘舞神霄披霞帶九日髙皇齊龍輪遂造九華室神虎洞瓊林風雲合成一開闔幽冥户靈變𤣥跡滅四朝為玉臺執蓋郎故云髙皇齊龍輪風雲一作香風李仙君歌見桓真人升仙記蜀華蓋山李桓仙君授道桓凱真人仙君一日謂凱曰金丹大藥子得之矣飛步隱身諸訣汝皆洞曉但未聞大道耳遂歌曰金鼎天門開反童復嬰孩日月照崑崙真君自然來三年結黃雲千日成聖胎九年登金闕一紀升三台龍虎自然交上帝安金臺衆神仰天表欣慕心裴回子今受靈文専心如死灰積功十二年功畢登雲梯白光生圎象紫氣冲雲霓端虛念太乙浩劫天地齊桓真人唱詩桓真人升仙記曰陶隱居先生謂弟子曰子夜夢神光滿室彩雲連霄有金甲神人謂子曰明日有異人至汝當掃門待之日午桓凱真人果至披髮跣足唱詩曰黃花生紫雲日月周天輪混混太虛中不與衆生羣崑崙十二峯上帝朝萬巡一日功行滿升空謁元君武夷君人間可哀之曲陸鴻漸武夷山記云武夷君地官也相傳每于八月十五日大㑹村人于武夷山上置幔亭化虹橋通山下村人既往是日太極玉皇太姥魏真人武夷君三座空中告呼村人為曾孫汝等若男若女呼坐乃命鼓師張安凌等作樂行酒令歌師彭令昭唱人間可哀之曲其詞曰天上人間兮㑹合踈稀日落西山兮夕鳥歸飛百年一餉兮志與願違天宫咫尺兮恨不相隨內經真諺子欲夜書當修常居眉後小穴中為上元六合之府主化生眼暉如瑩精光長珠徹童保鍊目神是真人坐起之上道一名曰真人常居長生諺真誥曰楊羲夢逰蓬萊山㑹蓬萊仙公洛廣休既下山半見許主簿相逢於夾石之間公語主簿曰吾為汝置酒四升在山上可往飲之此太平家酒治人腸也諺曰欲得長生飲太平古樂苑卷五十一
