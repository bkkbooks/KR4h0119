body:
  text: 古樂苑卷五十明梅鼎祚編雜曲歌辭歌謡語附此既不屬諸調且世代莫詳亦無名氏都為一卷附志闕疑古艷歌詩紀題云古詩收漢行行髓道經厯山陂馬啖柏葉人啖柏脂不可長飽聊可遏飢古豔歌孔雀東飛苦寒無衣為君作妻中心惻悲夜夜織作不得下機三日載匹尚言吾遲雞鳴歌樂府廣題曰漢有雞鳴衛士主雞唱宫外舊儀宫中與臺並不得畜雞畫漏盡夜漏起中黃門持五夜甲夜畢傳乙乙夜畢傳丙丙夜畢傳丁丁夜畢傳戊戊夜是為五更未明三刻雞鳴衛士起唱漢書曰髙帝圍項羽垓下羽是夜聞漢軍四面皆楚歌應劭曰楚歌者雞鳴歌也晉太康地記曰後漢固始鮦陽公安細陽四縣衛士習此曲于闕下歌之今雞鳴歌也然則此歌蓋漢歌也按周禮雞人掌大祭祀夜呼旦以嘂百官則所起亦逺矣東方欲明星爛爛汝南晨雞登壇喚曲終漏盡嚴具陳月沒星稀天下旦千門萬户遞魚鑰宫中城上飛烏鵲黃門倡歌漢書禮樂志曰成帝時鄭聲尤甚黃門名倡丙彊景武之屬富顯于世隋書樂志曰漢樂有黃門鼓吹天子宴羣臣之所用也佳人俱絶世握手上春樓㸃黛方初月縫裙學石榴君王入朝罷爭競理衣裘此似齊梁問語樂辭祝穆曰窮袴襦也蓋漢人語吳競編此在十九首後詩紀此與西洲長干休洗紅附晉繡幕圍香風耳節朱絲桐不知理何事淺立經營中愛惜加窮袴防間託守宫今日牛羊上邱隴當年近前面發紅西洲曲樂府作古辭玉臺新本作江淹非憶梅下西洲折梅寄江北單衫杏子紅雙鬢鴉雛色西洲在何處兩槳橋頭渡日暮伯勞飛風吹烏臼樹樹下即門前門中露翠鈿開門郎不至出門採紅蓮採蓮南塘秋蓮花過人頭低頭弄蓮子蓮子青如水置蓮懷袖中蓮心徹底紅憶郎郎不至仰首望飛鴻鴻飛滿西洲望郎上青樓樓髙望不見盡日欄干頭闌干十二曲埀手眀如玉卷簾天自髙海水搖空緑海水夢悠悠君愁我亦愁南風知我意吹夢到西洲長干曲逆浪故相邀菱舟不怕搖妾家揚子住便弄廣陵潮于闐採花于闐古于闐國居葱嶺北二百餘里漢唐以來皆入貢山川雖異所草木尚同春亦如溱洧地自有採花人沐浴子澡身經蘭汜濯髮傃芳洲折榮聊躑躅攀桂且淹留澤雉古今樂録曰鳯將雛以澤雉送曲擅場延繡頸朝飛㺯綺翼飲啄常自在驚雄恆不息舍利佛金繩界寶地珍木䕃瑶池雲間妙音奏天際法蠡吹摩多樓子從戎向邉北逺行醉密親借問隂山候還知塞上人休洗紅二首休洗紅洗多紅色淡不惜故縫衣記得初按茜人夀百年能幾何後來新婦今為婆休洗紅洗多紅在水新紅裁作衣舊紅畨作裏回黃轉緑無定期世事返復君所知歎疆場樂苑曰歎疆場宫調曲也詩紀云此下三首考樂府前後皆唐人之詩或唐作也聞道行人至妝梳對鏡臺淚痕猶尚在笑靨自然開塞姑昨日盧梅塞口整見諸人鎮守都護三年不歸折盡江邉楊桞回紇曲樂苑曰回紇商調曲也楊慎云其詞纒綿含蓄有長歌之哀過於痛哭之意惜不見作者名氏必陳隋初唐之作也隂山瀚海信難通幽閨少婦罷裁縫緬想邊庭征戰苦誰能對鏡冶愁容久戍人將老須㬰變作白頭翁第二句闕二字信一作使冶一作治石州辭自從君去逺巡邊終日羅帷獨自眠看花情轉切攬涕淚如泉一自離君後啼多雙臉穿何時狂虜滅免得更留連淫豫歌此下至僰道謡並雜歌謡詩紀附在晉後云世代莫詳古今樂録曰晉宋以後有淫預歌酈道元水經注曰白帝山城水門之西江中有孤石名淫預石水冬出二十餘大夏則沒亦有裁出焉江水東徑廣溪峽乃三峽之首也峽中有瞿塘黃龕二灘夏水回復㳂泝所忌國史補曰蜀之三峽最號峻急四月五月尤險故行者歌之淫豫或作豔豫灩澦大如馬瞿塘不可下灧澦大如牛瞿塘不可流同前淫預大如馬瞿唐不可下淫預大如象瞿唐不可上同前灩預大如襆瞿唐不可觸金沙浮轉多桂浦忌經過升菴詩話曰此舟人商估刺水行舟之歌樂府以為梁簡文所作非也蜀江有瞿唐之患桂江有桂浦之險故涉瞿唐者則凖灩襆涉桂浦者則凖金沙今樂府桂浦作桂楫非也按樂府本為桂浦上說原載通志巴東三峽歌二首酈道元水經注曰巴東三峽謂廣溪峽巫峽西陵峽也三峽七百里中兩岸連山略無闕處重巖叠嶂隱蔽天日非亭午夜分不見日月宜都山川記曰自黃牛灘東入西陵界至峽口一百許里山水紆曲林木髙茂猿鳴至清山谷傳響泠泠不絶行者聞之莫不懷土故漁者歌曰巴東三峽巫峽長猿鳴三聲淚沾裳巴東三峽猿鳴悲猿鳴三聲淚沾衣同前見水經注灘頭白勃堅相持倐忽淪沒别無期武陵人歌黃閣武陵記曰有緑羅山側巖垂水懸蘿百里許得明月池碧潭鏡徹百尺見底素巖若雪松如插翠流風叩阿有絲桐之韻土人為之歌曰仰兹山兮迢迢層石構兮嵯峩朝日麗兮陽巖落景梁兮隂阿鄣壑兮生音吟籟兮相和敷芳兮緑林恬淡兮潤波樂茲潭兮安流緩爾櫂兮詠歌梁一作陽綿州巴歌豆子山打瓦鼓揚平山撒白雨下白雨取龍女織得絹二丈五一半屬羅江一半屬𤣥武三峽謡水經注曰峽中有灘名曰黃牛灘南岸重嶺疊起最外髙崖間有色如人負刀牽牛人黑牛黃既人跡所絶莫得究焉此巖既髙加湍江紆回雖途徑信宿猶望見此物故行者謡曰云云言水路行深回望如一矣朝見黃牛暮見黃牛三朝三暮黃牛如故水經注作朝發黃牛暮宿黃牛僰道謡益州記曰瀘水源出四羅雨峯有殺氣暑月舊不行故武矦以夏渡為艱瀘水又下合諸水而總其日焉故有瀘江之名矣自朱提至僰道有水步道有黑水羊官水至嶮難三津之阻行者苦之故俗為之語曰楢溪赤水盤蛇七曲盤羊烏櫳氣與天通三秦記民謡武功太白去天三百孤雲兩角去天一握山水險阻黃金子午蛇盤烏櫳勢與天通華陽國志注黃金谷在洋縣本漢黃金戍張魯築西魏置黃金縣子午道在洋縣東百六十里舊在金州梁王神念别開此道諺云山水險阻黃金子午隴西謡郎樞女樞十馬九駒安陽大角十牛九犢四地名皆在隴西言宜畜牧也紇其語郡國志云望之數百里內夏恆積雪故彼人語曰云云又有神泉人歌曰云云紇其山頭凍死雀何不飛去生處樂紇其山頭有神井入地千尺絶骨冷古樂苑卷五十
