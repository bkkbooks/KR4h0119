body:
  text: 古樂苑卷十二明梅鼎祚編橫吹曲辭一橫吹曲其始亦謂之鼓吹馬上奏之蓋軍中之樂也北狄諸國皆馬上作樂故自漢已來北秋樂總歸鼓吹暑其後分為二部有簫笳者為鼓吹用之朝㑹道路亦以給賜漢武帝時南越七郡皆給鼓吹是也有鼓角者為橫吹用之軍中馬上所奏者是也晉書樂志曰橫吹有鼓角又有胡角按周禮云以鼖鼓鼓軍事舊說云蚩尤氏帥魑魅與黃帝戰於涿鹿帝乃始命吹角為龍鳴以禦之其後魏武北征烏丸越沙漠而軍士思歸於是减為半鳴尤更悲矣橫吹有雙角即胡樂也漢博望侯張騫入西域傳其法於西京唯得麾訶兜勒一曲李延年因胡曲更造新聲二十八解乘輿以為武樂後漢以給邊將和帝時萬人將軍得用之魏晋以來二十八解不復具存而世所用者有黃鵠等十曲其辭後亡又有關山月等八曲後世之所加也後魏之世有簸邏回歌其曲多可汗之辭皆燕魏之際鮮卑歌歌辭虜音不可曉解蓋大角曲也乂古今樂録有梁鼓角橫吹曲多叙慕容垂及姚泓時戰陳之事其曲有企喻等歌三十六曲樂府胡吹舊曲又有隔谷等歌三十曲總六十六曲未詳時用何篇也自隋以後始以橫吹用之鹵簿與鼓吹列為四部總謂之鼓吹並以供大駕及皇太子王公等一曰棡鼓部其樂器有棡鼓金鉦大鼓小鼓長鳴角吹鳴角大角七種棡鼓金鉦一曲夜警用之大鼓十五曲小鼓九曲大角七曲其辭並本之鮮卑二曰鐃鼓部其樂器有歌鼓簫笳四種几十二曲三曰大橫吹部其樂器有角節鼓笛簫篳篥笳桃皮篳篥七種凡二十九曲四曰小橫吹部其樂器有角笛簫篳篥笳桃皮篳篥六種凡十二曲夜警亦用之漢橫吹曲擬漢樂府解題曰漢橫吹曲二十八解李延年造魏晉已來唯傳十曲一曰黃鵠二曰隴頭三曰出關四曰入關五曰出塞六曰入塞七曰折楊柳八曰黃覃子九曰赤之楊十曰望行人役又有關山月洛陽道長安道梅花落紫騮馬驄馬雨雪劉生八曲合十八曲其辭並亡惟出塞一曲諸本載云古辭今列諸家擬者于後隴頭一曰隴頭水通典曰天水郡有大阪名曰隴坻亦曰隴山即漢隴關也辛氏三秦記曰其坂九回上者七日乃越上有清水四注下所謂隴頭水也陳後主隴頭征戍客寒多不識春驚風起嘶馬苦霧雜飛塵投錢積石水斂轡交河津四面夕氷合萬里望佳人隴頭水梁元帝銜悲别隴頭關路漫悠悠故鄉迷逺近征人分去留沙飛曉成幕海氣旦如樓欲識秦川處隴水向東流同前劉孝威從軍戍隴頭隴水帶沙流時觀胡騎飲常為漢國羞釁妻成兩劒殺子祀雙鉤頓取樓蘭頸就解郅支裘勿令如李廣功遂不封侯一作功多遂不酬同前車􅛴隴頭征人别隴水流聲咽只為識君恩甘心從苦節雪凍弓弦斷風鼓旗竿折獨有孤雄劒龍泉字不滅同前二首陳後主塞外飛蓬征隴頭流水鳴漠處揚沙暗波中燥葉輕地風氷易厚寒深溜轉清登山一回顧幽咽動邊情髙隴多悲風寒聲起夜叢禽飛暗識路鳥轉逐征蓬落葉時驚沫移沙屢擁空回頭不見望流水玉門東同前徐陵别塗聳千仞離川懸百丈攢荆夏不通積雪冬難上枝交隴底暗石礙坡前響回首咸陽中唯言夢時往同前顧野王隴底望秦川迢遞隔風煙蕭條落野樹幽咽響流泉瀚海波難息交河氷未堅寧知蓋山水逐節赴危絃同前謝燮隴坂望咸陽征人慘思腸咽流喧斷岸遊沫聚飛梁鳬分斂氷彩虹飲照旗光試聽鐃歌曲唯吟君馬黃同前二首張正見隴頭鳴四注征人逐二師羌笛含流咽胡笳雜水悲湍髙飛轉駛澗淺蕩還遲前旌去不見上路杳無期隴頭流水急流急行難渡逺入隗囂營傍侵酒泉路心交賜寶刀小婦成紈袴欲知别家久戎衣今已故同前二首江總隴頭萬里外天崖四面絶人將蓬共轉水與啼俱咽驚湍自湧沸古樹多摧折傳聞博望矦苦辛提漢節霧暗山中日風驚隴上秋徒傷幽咽響不見東西流無期從此别更度幾年幽遙聞玉關道望入杳悠悠幽一作鳴咽入關梁吳均羽檄起邊庭烽火亂如螢是時張博望夜赴交河城馬頭要落日劒尾掣流星君恩未得報何論身命傾身命傾一作身是傾同前詩彚作庾信隋虞茂隴雲低不散黃河咽復流關山多道里相接幾重愁幾重愁一作萬里愁出塞晉書樂志曰出寨入塞曲李延年造曹嘉之晉書曰劉疇嘗避亂塢壁賈胡百數欲害之疇無懼色援笳而吹之為出塞入塞之聲以動其遊客之思於是羣胡皆垂泣而去西京雜記髙帝戚夫人善鼓瑟擊筑帝常擁夫人倚瑟而絃歌畢每泣下流漣夫人善為翹袖折腰之舞歌出塞入塞望歸之曲侍婦數百皆習之後宫齊首髙唱聲入雲霄則髙帝時巳有之疑不起於延年也唐又有塞上塞下曲蓋出於此古辭候騎出甘泉奔命入居延旗作浮雲影陳如明月弦同前梁劉孝標薊門秋氣清飛將出長城絶漠衝風急交河夜月明陷敵摐金鼓摧鋒揚斾旌去去無終極日暮動邊聲同前一作塞下曲周王褎飛蓬似征客千里自長驅塞禽唯有鴈關樹但生榆背山看故壘繫馬識餘蒲還因麾下騎來送月支圖三齊略記秦始皇至東海蟠蒲繫馬至今其地蒲生皆紏結同前薛道衡虞世基和隋楊素漠南胡未空漢將復臨戎飛狐出塞北碣石指遼東冠軍臨瀚海長平翼大風雪橫虎落陳氣抱龍城虹橫行萬里外胡運百年窮兵寢星芒落戰解月輪空嚴鐎息夜斗騂角罷鳴弓北風嘶朔馬胡霜切塞鴻休明大道暨幽荒日用同方就長安邸來謁建章宫幽荒日用同一作幽荒日照同漢虜未和親憂國不憂身握手河梁上窮涯北海濱據鞍獨懷古慷慨感良臣歷覽多舊迹風日慘愁人荒塞空千里孤城絶四鄰樹寒偏易古草衰恆不春交河明月夜隂山苦霧辰雁飛南入漢水流西咽秦風霜久行役河朔備艱辛薄暮邊聲起空飛胡騎塵同前二首薛道衡髙秋白露團上將出長安塵沙塞下暗風月隴頭寒轉蓬隨馬足飛霜落劒端凝雲迷代郡流水凍桑乾烽微桔橰逺橋峻轆轤難從軍多惡少招募盡材官伏堤時卧鼓疑兵作解鞍柳城擒冒頓長坂納呼韓受降今更築燕然巳重刋還嗤傅介子辛苦刺樓蘭柳城擒冒頓一作龍城擒冒頓邊庭烽火驚插羽夜徴兵少昊騰金氣文昌動將星長驅鞮汗北直指夫人城絶漠三秋暮窮隂萬里生寒夜哀笳曲霜天斷鴈聲連旗下鹿塞疉鼓向龍庭妖雲墜虜陳暈月繞胡營左賢皆頓顙單于巳繫纓絏馬登𤣥闕釣鯤臨北溟當知霍驃騎髙第起西京同前二首後首一作虞世南按世基與道衡並和楊素作各二首句數亦同則此似非世南矣虞世基窮秋塞草腓塞外胡塵飛徴兵廣武至候騎隂山歸廟堂千里䇿將軍百戰威轅門臨玉帳大斾指金微摧朽無勍敵應變有先機銜枚壓曉陳卷甲解朝圍瀚海波瀾靜王庭氛霧晞鼓鼙嚴朔氣原野曀寒暉勳庸震邊服歌吹入京畿待拜長平坂鳴騶入禮闈卷甲解朝闈一作卷甲掩宵闈上將三略逺元戎九命尊緬懷古人節思酬明主恩山西多勇氣塞北有遊魂揚桴度隴坂勒騎上平原誓將絶沙漠悠然去玉門輕齎不遑舍驚䇿騖戎軒懍懍邊風急蕭蕭征馬煩雪暗天山道氷塞交河源霧烽黯無色霜旗凍不翻耿介倚長劒日落風塵昏度隴一作上隴勒騎上一作勒馬下入塞周王褎戍久風塵色勳多意氣豪建章樓閣迥長安陵樹高度氷傷馬骨經寒墜節旄行當見天子無假用錢刀同前隋何妥桃林千里險候騎亂紛紛問此將何事嫖姚封冠軍回旌引流電歸蓋轉行雲待任蒼龍傑方當論次勳方當一作何當折楊柳唐書樂志曰梁樂府有胡吹歌云上馬不捉鞭反拗楊柳枝下馬吹橫笛愁殺行客兒此歌辭元出北國即鼓角橫吹曲折楊柳枝是也宋書五行志曰晉太康末京洛為折楊柳之歌其曲有兵革苦辛之辭按古樂府又有小折楊柳相和大曲有折楊柳行清商四曲有月節折楊柳歌十三曲與此不同梁元帝山髙巫峽長垂柳復垂楊同心且同折故人懷故鄉山似蓮花艷流如明月光寒夜猿聲徹遊子淚霑裳同前一本作簡文帝柳惲楊柳亂成絲攀折上春時葉密鳥飛礙風輕花落遲城髙短簫發林空畫角悲曲中别無意併是為相思別無意一作無别意同前劉邈髙樓十載别楊柳濯絲枝摘葉驚開駛攀條恨久離年年阻意息月月减容儀春來誰不望相思君自知同前二首陳後主楊柳動春情倡園妾屢驚入樓含粉色依風雜管聲武昌識新種官渡有殘生還將出塞曲仍共胡笳鳴仍共一作仍作長條黃復緣垂絲密且繁花落幽人徑步隱將軍屯谷暗宵鉦響風高夜笛喧聊持暫攀折空足憶中園空足一作空是同前岑之敬將軍始見知細栁繞營垂懸絲拂城轉飛絮上宫吹塞門交度葉谷口暗橫枝曲成攀折處唯言怨别離同前徐陵嫋嫋河堤樹依依魏主營江陵有舊曲洛下作新聲妾對長楊苑君登髙栁城春還應共見蕩子太無情同前張正見楊栁半垂空裊裊上春中枝疏董澤箭葉碎楚臣弓色映長河水花飛髙樹風莫言限宫掖不閉長楊宫同前王瑳塞外無春色上林柳巳黃枝影侵宫暗葉彩亂星光陌頭藏戲鳥樓上掩新粧攀折思為贈心期别路長同前江總萬里音塵絶千條楊栁結不悟倡園花遙同天嶺雪春心自浩蕩春樹聊攀折共此依依情無奈年年别天一作羌關山月樂府解題曰關山月傷離别也古木蘭詩曰萬里赴戎機關山度若飛朔氣傳金柝寒光照鐵衣按相和曲有度關山亦類此梁元帝朝望清波道夜上白登臺月中含桂樹流影自徘徊寒沙逐風起春花犯雪開夜長無與晤衣單誰為裁同前二首陳後主秋月上中天回照關城前暈缺隨灰減光滿應珠圓帶樹還添桂銜峰乍似弦復教征戍客長怨久連翩戍邊嵗月久恆悲望舒耀城遙接暈高澗風連影搖寒光帶岫徙冷色含山峭看時使人憶為似嬌娥照同前陸瓊邊城與明月俱在關山頭焚烽望别壘擊斗宿危樓團團婕妤扇纎纎秦女鈎鄉園誰共此愁人屢益愁同前張正見巖間度月華流彩映山叉暈逐連城璧輪隨出寒車唐萱遙合影秦桂逺分花欲驗盈虛駛方知道路賖駛一作理同前二首徐陵關山三五月客子憶秦川思婦髙樓上當窗應未眠星旗映疏勒雲陳上祁連戰氣今如此從軍復幾年月出栁城東微雲掩復通蒼茫縈白暈蕭瑟帶長風羌兵燒上郡胡騎獵雲中將軍擁節起戰士夜鳴弓同前賀力牧重關斂暮煙明月下秋前照石疑分鏡臨弓似引弦霧暗迷旗影霜濃濕劒蓮此處離鄉客遙心萬里懸霧一作雷同前阮卓關山陵漢開霜月正徘徊映林如璧碎侵塞似輪摧楚師隨晦盡胡兵逐暖來寒笳將夜鵲相亂晚聲哀同前江總免月半輪明狐關一路平無期造此别復欲幾年行映光書漢奏分影照胡兵流落今如此長戍受降城同前周王褒關山夜月明秋色照孤城影虧同漢陳輪滿逐胡兵天寒光轉白風多暈欲生寄言亭上吏遊客解雞鳴洛陽道梁簡文帝洛陽佳麗所大道滿春光遊童時挾彈蠶妾始提筐金鞍照龍馬羅袂拂春桑玉車爭曉入潘果溢髙箱時一作初同前梁元帝洛陽開大道城北達城西青槐隨幔拂緑栁逐風低玉珂鳴戰馬金爪鬬場雞桑萎日行暮多逢秦女妻同前沈約洛陽大道中佳麗實無比燕裙傍日開趙帶隨風靡領上蒲桃繡腰中合歡綺佳人殊未來薄暮空徙倚同前庾肩吾徼道臨河曲曾城傍洛川金門才出栁桐井半含泉日起罘罳外車回雙闕前潘生時未返遙心徒眷然同前車􅛴洛陽道八逹洛陽城九重重關如隱起雙闕似芙蓉王孫重行樂公子好遊從别有傾人處佳麗夜相逢同前五首陳後主喧譁照邑里遨遊出洛京霜枝嫩栁發水塹薄苔生停鞭回去影駐軸敞前甍臺上經相識城下屢逢迎踟蹰還借問只重未知名日光朝杲杲照耀東京道霧帶城樓開啼侵曙色早佳麗嬌南陌香氣含風好自憐叉上纓不歎河邊草建都開洛汭中城乃城陽縱橫肆八達左右闢康莊銅溝飛栁絮金谷落花光忘情伊水側稅駕河橋傍百尺瞰金埒九衢通玉堂栁花塵裏暗槐色露中光遊俠幽并客當罏京兆妝向夕風煙晚金羈滿洛陽青槐夾馳道御水映銅溝逺望凌霄闕遙看廾幹樓黃金彈俠少朱輪盛徹侯桃花雜渡馬紛披聚陌頭同前二首徐陵緑栁三春暗紅塵百戲多東門向金馬南陌接銅駝華軒翼葆吹飛蓋響鳴珂潘郎車欲滿無奈擲花何洛陽馳道上春日起塵埃濯籠望如水河橋度似雷聞珂知馬蹀傍幰見甍開相看不得語密意眼中來水一作霧同前岑之敬喧喧洛水濱鬱鬱小平津路傍桃李節陌上採桑春聚車看衛玠連手望安仁復有能留客莫愁嬌態新同前陳暄洛陽九逵上羅綺四時春路傍避驄馬車中看玉人鎮西歌豔曲臨淄逢麗神欲知雙璧價潘夏正連茵逵一作衢同前王瑳洛陽夜漏盡九重平旦開日照蒼龍闕煙繞鳳凰臺浮雲翻似蓋流水到成雷曹王鬬雞返潘仁載果來同前張正見曾城啓旦扉上洛滿春暉栁影緣溝合槐花夾岸飛蘇合彈珠罷黃間負翳歸紅塵暮不息相看連騎稀同前二首江總德陽穿洛水伊闕邇河橋仙舟李膺棹小馬王戎鑣杏堂歌吹合槐路風塵饒緑珠含淚舞孫秀彊相邀小平路四達長秋聽五鐘玉節迎司隸錦車歸濯龍絃歌聲不息環佩響相從花障蕩舟笑日映下山逢路一作臨長安道梁簡文帝神臯開隴右陸海實西秦金捶抵長樂復道向宜春落花依度㦥垂栁拂行人金張及許史夜夜尚留賓金捶一作椎輸同前元帝西接長楸道南望小平津飛甍臨綺翼輕軒影畫輪雕鞍承赭汗槐路起紅塵燕姬雜趙女淹留重上春同前庾肩吾桂宫延復道黃山開廣路逺聽平陵鍾遙識新豐樹合殿生光彩離宫起煙霧日落歌吹回塵飛車馬度回一作還同前陳後主建章通未央長樂屬明光大道移甲第甲第玉為堂遊蕩新豐裏戲馬渭橋傍當壚晚留客夜夜苦紅妝同前顧野王鳳樓臨廣路仙掌入煙霞章臺京兆馬逸陌富平車東門疏廣餞北闕東賢家渭橋縱觀罷安能訪狹斜同前阮卓長安馳道上鍾鳴宫寺開殘雲銷鳳闕宿霧斂章臺騎轉金吾度車鳴丞相來藹藹東都晚羣公騶御回同前蕭賁前登灞陵道還瞻渭水流城形類北斗橋勢似牽牛飛軒駕良駟寶劒雜輕裘經過狹斜裏日暮與淹留裏一作里同前徐陵輦道乘雙闕豪雄被五都橫橋象天漢法駕應坤圖韓康賣良藥董偃鬻明珠喧喧擁車騎非但執金吾同前陳暄長安開繡陌三條向綺門張敞車單馬韓嫣乘副軒寵深來借殿功多競買園將軍夜夜返絃歌著曙喧同前江總翠蓋乘承露金羈照落暉五矦新拜罷七貴早朝歸轟轟紫陌上藹藹紅塵飛日暮延平客風花拂舞衣同前周王褒槐衢臨北第馳道度西宫樹隂連袖色塵影雜衣風採桑逢五馬停車對兩童喧喧許史座鐘鳴賓未窮同前隋何妥長安狹斜路縱橫四達分車輪鳴鳳轄箭服耀魚文五陵多任狹輕騎自連羣少年皆重氣誰識故將軍梅花落梅花落本笛中曲也按唐大角曲亦有大單于小單于大梅花小梅花等曲今其聲猶有存者宋鮑照中庭雜樹多偏為梅咨嗟問君何獨然念其霜中能作花露中能作實搖蕩春風媚春日念爾零落逐風飈徒有霜華無霜質同前梁吳均終冬十二月寒風西北吹獨有梅花落飄蕩不依枝流連逐霜彩散漫下氷澌何當與春日共映芙蓉池同前二首陳後主金砌落芳梅飄零上鳳臺拂粧疑粉散逐溜似萍開映日花光動迎風香氣來佳人早插髻試立且徘徊金一作春楊栁春樓邊車馬飛風煙連娉烏孫伎屬客單于氊鴈聲不見書蠶絲欲斷弦欲持塞上蕊試立將軍前同前徐陵對戶一株梅新花落故栽燕拾還蓮井風吹上鏡臺倡家怨思妾樓上獨徘徊啼看竹葉錦篸罷未成裁怨一作愁同前蘇子卿中庭一樹梅寒多葉未開祗言花是雪不悟有香來上郡春恆晚髙樓年易催織書偏有意教逐錦文回是一作似同前張正見芳樹映雪野發早覺寒侵落逺香風急飛多花徑深周人歎初摽魏帝指前林邊城少灌木折此自悲吟雪一作雲同前三首末一首文苑英華作徐陵玉臺新詠作總江總縹色動風香羅生枝巳長妖姬墜馬髻未插江南璫轉袖花紛落春衣共有芳羞作秋胡婦獨採城南桑胡地少春來三年驚落梅偏疑粉蝶散乍似雪花開可憐香氣歇可惜風相摧金鐃且莫韻玉笛幸徘徊臘月正月早驚春衆花未發梅花新可憐芬芳臨王臺朝攀晚折還復開長安少年多輕薄兩兩常唱梅花落滿酌金巵催玉柱落梅樹下宜歌舞金谷萬株連綺甍梅花密處藏嬌鶯桃李佳人欲相照摘葉牽花來竝笑楊栁條青樓上輕梅花色白雪中明橫笛短簫凄復切誰知柏梁聲不絶紫騮馬古今樂録曰紫騮馬古辭云十五從軍征八十始得歸道逢鄉里人家中有阿誰又梁曲曰獨柯不成樹獨樹不成林念娘錦裲襠恆長不忘心蓋從軍久戍懷歸而作也梁簡文帝賤妾朝下機正值良人歸青絲懸玉鐙朱汗染香衣驟急珂彌響􅘠多塵亂飛雕菰幸可薦故君心莫違君一作人同前郭本遺後四句元帝長安美少年金絡錦連錢宛轉青絲鞚照耀珊瑚鞭依槐復依栁蹀躞復隨前方逐幽并去西北共聫翩同前二首陳後主嫖姚紫塞歸蹀躞紅塵飛玉珂鳴廣路金絡耀晨輝蓋轉時移影香動屢驚衣禁門猶未閉連騎恣相追一作莫相違蹀躞紫騮馬照耀白銀鞍直去黃龍外斜趨𤣥菟端垂鞬還細栁揚塵歸上蘭紅臉桃花色客别重羞看同前李燮紫燕忽踟蹰紅塵起路隅園人移苜蓿騎士逐􅐘蕪三邊追黠虜一鼓定彊胡安用珂為玉自有汗成珠同前徐陵玉鐙繡纒鬃金鞍錦覆幪風驚塵未起草淺埒猶空角弓穿兩兔珠彈落雙鴻日斜馳逐罷連翩還上東穿一作連同前張正見將軍入大宛善馬出從戎影絶乾河上聲流水窟中似鹿猶疑草如龍欲向空須還十萬里試為一追風水一作入同前陳暄天馬汗如紅嗚鞭度九嵕飲傷城下凍嘶依北地風笳寒芳樹歇笛怨栁枝空橫行意未巳羞住轂車中住一作往同前一作蘇子卿祖孫登候騎陌樓蘭長城回路難嘶從風處斷骨住水中寒飛塵暗金勒落淚灑銀鞍抽鞭上關路誰念客衣單回一作回同前獨孤嗣宗倡樓望早春寶馬度城闉照耀桃花徑牒躞採桑津金羈麗初景玉勒染輕塵逺聽珂驚急猶是畫眉人猶一作知同前江總春草正萋萋蕩婦出空閨識是東方騎猶帶北風嘶揚鞭向栁市細蹀上金堤願君憐織素殘妝尚有啼驄馬一曰驄馬驅皆言關塞征役之事梁車􅛴驄馬鏤金鞍柘彈落金凡意欲䟃𧽼走先作野遊盤平明發下蔡日中過上蘭路逺行須疾非是畏人看同前題一有曲字劉孝威十五宦期門二十屯邊徼犀羈玉鏤鞍寶刀金錯鞘一隨驄馬驅分受青蠅弔且令都護知願被將軍照誓使氊衣鄉掃地無遺噍同前隋庾抱櫪上浮雲驄本出吳門中發跡來東道長鳴起北風回鞍拂柱白赭汗類塵紅滅沒徒留影無因圖漢宫同前王由禮善馬金羈飾躡影復凌空影入長城水聲隨胡地風控斂青門外珂喧紫陌中行行若不倦唯當御史驄驄馬驅梁元帝朔方寒氣重胡關饒苦霧白雪畫凝山黃雲宿埋樹連翩行役子終朝征馬驅試上金微山還看玉關路驅都故切同前劉孝威翩翩驄馬驅橫行復斜趨先救遼城危後拂燕山霧風傷易水湄日入隴西樹未得報君恩聫翩終不住趨去聲同前陳徐陵白馬號龍駒雕鞍名鏤渠諸兄二千石小婦字羅敷倚端輕掃史召募擊休屠塞外多風雪城中絶詔書空憶長楸下連蹀復連􅘠渠一作衢史一作吏同前江總長城兵氣寒飲馬詎為難暫解青絲轡行歇鏤衢鞍白登圍轉急黃河凍不乾萬里朝飛電論功易走丸雨雪采薇詩曰昔我往矣楊栁依依今我來思雨雪霏霏穆天子傳曰天子遊于黃室之曲筮獵萍澤天子乃休日中大寒北風雨雪有凍人天子作詩三章以哀之曰我徂黃竹是也雨雪曲蓋取諸此陳後主長城飛雪下邊關地籟吟濛濛九天暗霏霏千里深樹冷月恆少山霧日偏沈况聽南歸鴈切思胡笳音雨雪曲陳江暉邊城風雪至客子自心悲風哀笳弄斷雪暗馬行遲輕生本為國重氣不關私恐君猶不信撫劒一揚眉同前張正見胡關辛苦地雲路逺漫漫含氷踏馬足雜雨凍旗竿沙漠飛恆暗天山積轉寒無因辭日逐團扇掩齊紈同前江總雨雪隔榆溪從軍度隴西繞陳看狐迹依山見馬蹄天寒旗彩壞地暗鼓聲低漫漫愁雲起蒼蒼別路迷同前陳暄都尉出祁連雨雪滿雞田雕陵持抵鵲屬國用和氊氷合軍應渡樓寒烽未然花迷差未著疏勒復經年同前謝燮朔邊昔離别寒風復凄切峩峩六尺氷飄飄千里雪术塞袁安户行封蘇武節應隨隴水流幾過空嗚咽空一作疑劉生樂府解題曰劉生不知何代人齊梁已來為劉生辭者皆稱其任俠豪放周遊五陵三秦之地或云抱劍專征為符節官所未詳也按古今樂録梁鼓角橫吹曲有東平劉生歌疑即此劉生也梁元帝任俠有劉生然諾重西京扶風好驚坐長安恆借名榴花聊夜飲竹葉解朝酲結交李都尉遨遊佳麗城同前吳均結客少年歸翩翩駿馬肥報恩殺人競賢君賜錦衣握蘭登建禮拖玉入含暉顧看草𤣥者功名終自微同前陳後主遊俠長安中置驛過新豐擊鐘蒲璧磬鳴弦栁葉弓孟公正驚客朱家始賣僮羞作荆卿笑捧劒出遼東栁一作楊同前張正見劉生絶名價豪俠恣遊陪金門四姓聚繡轂五矦來塵飛馬腦勒酒映硨磲杯别有追遊夜秋窗向月開矦一作香同前江暉五陵多美選六郡盡良家劉生代豪蕩標舉獨榮華寶劒長三尺金樽滿百花唯當重意氣何處有驕奢同前徐陵劉生殊倜儻任俠遍京華戚里驚鳴筑平陽吹怨笳俗儒排左氏新室忌漢家髙才被擯壓自古共憐嗟同前外編作隋王由禮題云贈俠侶江總劉生負意氣長嘯且徘徊髙論明秋水命賞陟春臺干戈倜儻用筆硯縱橫才置驛無年限遊俠四方來高一作辨同前隋栁莊座驚稱字孟豪雄道姓劉廣陌通朱邸大路起青樓要賢驛已置留賓轄且投光斜日下霧庭隂月上鈎且一作仍同前𢎞執恭英名振關右雄氣逸江東遊俠五都內去來三秦中劒照七星彩馬空千金驄縱橫方未息因兹定武功古樂苑卷十二
