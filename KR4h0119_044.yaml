body:
  text: 古樂苑卷四十四明梅鼎祚編雜歌謠辭漢歌平城歌漢書曰髙祖自將兵三十二萬擊韓王信帝先至平城步兵未盡到冒頓縱精兵三十餘萬圍帝於白登七日漢兵中外不得救餉樊噲時為上將軍不能解圍天下皆歌之後用陳平祕計得免白登在平城東南去平城十餘里平城之下亦誠苦七日不食不能彀弩下一作圍畫一歌一作百姓歌漢書曰惠帝時曹參代蕭何為相國初髙帝與何定天下法令既明具及參守職舉事無所變更一遵何之約束於是百姓歌之蕭何為法講若畫一曹參代之守而勿失載其清靖民以寧一講史記作顜義一作覯又一作較靖史記作淨淮南民歌漢書曰淮南厲玉長髙帝少子也長廢法不軌文帝不忍置於法乃載以輜車處蜀嚴道卭郵遣其子子母從居長不食而死後民有作歌歌淮南王帝聞之乃追尊淮南王為厲王置園如諸侯儀一尺布尚可縫一斗粟尚可舂兄弟二人不相容一尺繒好童童一升粟飽蓬蓬兄弟二人不能相容髙誘作鴻烈解敘及許叔重注其辭云衛皇后歌漢書曰衛子夫為皇后弟青貴震天下天下歌之生男無喜生女無怒獨不見衛子夫霸天下鄭白渠歌史記曰韓聞秦之好興事欲罷無令東伐乃使水工鄭國間説秦令鑿涇水自中山西邸瓠口為渠並北山東注洛溉舄鹵之地四萬餘頃因名曰鄭國渠漢書云大始二年趙中大夫白公復秦穿渠引涇水首起谷口尾入櫟陽注渭中袤二百里溉田四千五百餘頃名曰白渠民得其饒歌之曰田於何所池陽谷口鄭國在前白渠起後舉鍤如雲決渠為雨涇水一石其泥數斗且溉且糞長我禾黍衣食京師億萬之口漢紀為雨下有二句云水流竈下魚跳入釡起作為億萬之口作百萬餘口潁川歌漢書曰灌夫不好文學喜任俠已然諾諸所與交通無非豪傑大猾家纍數千萬食客日數十百人陂池田園宗族賓客為權利橫潁川潁川兒歌之潁水清灌氏寧潁水濁灌氏族匡衡歌漢書曰衡字稚圭東海承人也世農夫至衡好學家貧傭作以供資用尤精力過絶人諸儒為之語無説詩匡鼎來匡説詩解人頥牢石歌一作印綬歌漢書佞幸傳曰元帝時宦官石顯為中書令與僕射牢梁少府五鹿克宗結為黨友諸附倚者皆得寵位民歌之言其兼官據勢也牢邪石邪五鹿客邪印何纍纍綬若若邪五侯歌漢書曰成帝河平二年悉封舅大將軍王鳯庶弟談為平阿侯商為成都侯立紅陽侯根曲陽侯逢時髙平侯五人同日封故世謂之五侯時五侯羣弟爭為奢侈後庭姬妾各數十人羅鐘磬舞鄭女作優倡狗馬逐馳大治第室起土山漸臺洞門髙廊暗道連屬彌望百姓歌之言其奢僭如此按傳稱成都侯穿長安城引內灃水注第中大陂曲陽侯第園中土山漸臺類白虎殿則穿城引水非曲陽與歌辭不同髙都外杜皆長安里名五侯初起曲陽最怒壤決髙都連竟外杜土山漸臺西白虎樓護歌漢書曰樓護字君卿為京兆吏數年甚得名譽與谷永俱為五侯上客母死送葬者致車二三千兩問里歌之曰五侯治喪樓君卿尹賞歌漢書曰賞字子心巨鹿楊氏人永始元延間上怠於政貴戚驕恣交通輕俠藏匿亡命長安中姦猾浸多羣輩殺吏受賕報讐賞以三輔髙第選守長安賞至修治長安獄穿地方深各數丈致令辟為郭以大石覆其口名為虎穴乃收捕輕薄少年惡子得數百人內穴中覆以大石百日後令死者家自發取親屬號哭道路歔欷長安歌之曰安所求子死桓東少年場生時諒不謹枯骨後何葬上郡歌漢書曰成帝時馮野王為上郡太守其後弟立亦自五原太守徙西河上郡立居職公亷治行略與野王相似而多知有恩貸好為條教吏民嘉美野王立相代為太守歌之曰大馮君小馮君兄弟繼踵相因循聰明賢知惠吏民政如魯衛德化鈞周公康叔猶二君張君歌後漢書曰張堪光武時為漁陽太守捕擊姦猾賞罰必信吏民皆樂為用乃於狐奴開稻田八千餘頃勸民耕種以致殷富百姓歌之桑無附枝麥穗兩岐張君為政樂不可支朱暉歌後漢書曰暉字文季建武中再遷臨淮太守好節槩有所拔用皆厲行士諸報怨以義犯率皆為求其理多得生濟其不義之囚即時僵仆吏人畏愛為之歌曰強直自遂南陽朱季吏畏其威民懷其惠涼州歌一作樊曄歌後漢書曰曄光武時為天水太守政嚴猛好申韓法善惡立斷人有犯其禁者率不生出獄吏人及羌胡畏之道不拾遺涼州為之歌遊子常苦貧力子天所富寧見乳虎穴不入冀府寺大笑期必死忿怒或見置嗟我樊府君安可再遭值董宣歌後漢書曰董宣字少平光武時為洛陽令搏擊豪強莫不震栗京師號為卧虎歌之云枹鼓不鳴董少平郭喬卿歌後漢書曰郭賀字喬卿建武中為尚書令在職六年拜荆州刺史到官有殊政百姓歌之厥德仁明郭喬卿中正朝廷上下平上下一作天下費貽歌常璩華陽國志曰費貽字奉君南安人也公孫述時漆身為厲佯狂避世述破為合浦守蜀中歌之曰節義至仁費奉君不仕亂世不避惡君修身於蜀紀名亦足後世為大族三句疑非歌語鮑司𨽻歌列異傳曰鮑宣宣子永永子昱三世皆為司𨽻而乘一驄馬京師人歌之云鮑氏驄三人司𨽻再入公馬雖瘦行步工通博南歌一題作行者歌後漢書西南夷傳曰永平十二年哀牢王栁貌遣子率種人內屬顯宗以其地置哀牢博南二縣割益州郡西部都尉所領六縣合為永昌郡始通博南山度蘭倉水行者苦之作歌漢德廣開不賓度博南越蘭津度蘭倉為它人漢書注倉作滄亷范歌後漢書曰亷范字叔度建初中為蜀郡太守成都民物阜盛邑宇逼側舊制禁民夜作以防火災而更相隱蔽燒者日屬范乃毀削前令但嚴使儲水而已百姓為便乃歌之云亷叔度來何暮不禁火民安作平生無襦今五袴民安作東觀記作人安堵平生無襦今五袴華陽國志作來時我單衣去時重五袴又一作昔無襦今五袴喻猛歌和帝時蒼梧太守以清白為治郡頌之曰於惟蒼梧交址之域大漢唯宗逺以仁德陳紀山歌華陽國志曰巴郡陳紀山為漢司𨽻校尉嚴明正直西虜獻眩工廷試之分公卿以為嬉紀山獨不視京師稱之巴人歌曰紀山陳禪字築室載直梁國人以貞貞邪娛不揚目枉行不動身姦軌僻乎逺理義協乎民黎陽令張公頌見故迹遺文公與守相駕蜚魚往來倐忽逺熹娛慰此屯民寧厥居魏郡輿人歌岑熙為魏郡太守招聘隱逸與參政事無為而化視事二年輿人歌之我有枳棘岑君伐之我有蟊賊岑君遏之狗吠不驚足下生氂含哺鼓腹焉知凶災我喜我生獨丁斯時美矣岑君於戲休兹吳資歌常璩華陽國志曰太山吳資字元約孝順帝永建中為巴郡太守屢獲豐年人歌之曰云云及資遷去人思資乂歌曰吳資習習晨風動澍雨潤禾苗我后恤時務我人以優饒望逺忽不見惆悵當徘徊恩澤實難忘悠悠心永懷范史雲歌後漢書曰范丹字史雲桓帝時為萊蕪長遭母喪不到官後遁身於梁沛之問徒行敝服賣卜於市遭黨人禁錮遂推鹿車載妻子捃拾自資所止卑陋有時絶粒窮居自若言貌無改閭里歌之冉袁山松後漢書作丹甑中生塵范史雲釡中生魚范萊蕪陳臨歌謝承後漢書曰陳臨字子然為蒼梧太守人遺腹子報父怨捕得繫獄傷其無子令其妻入獄遂産得男人歌曰蒼梧陳君恩廣大令死罪囚有後代德參古賢天報施又蒼梧府君惠及死能令死人不絶嗣劉君歌後漢書曰劉陶字子竒潁川潁隂人濟北貞王勃之後桓帝時舉孝亷除順陽長縣多姦猾陶到官宣募吏民有氣力勇猛能以死易生者得數百人皆嚴兵待命於是覆案姦軌所按發若神以病免吏民思而歌之邑然不樂思我劉君何時復來安此下民賈父歌後漢書曰中平元年交址屯兵執刺史及合浦太守靈帝敕三府精選能吏有司舉賈琮為交址刺史琮到部訊其反狀咸言賦斂過重民不聊生故聚為盜琮即移書告示各使安其資業招撫荒散蠲復徭役誅斬渠帥為大害者簡選良吏試守諸縣百姓以安巷路為之歌賈父來晚使我先反今見清平吏不敢飯皇甫嵩歌後漢書曰皇甫嵩字義真安定朝那人靈帝時黃巾作亂以嵩為左中郎將討賊數有功拜左車騎將軍領冀州牧封槐里侯嵩請冀州一年田租以贍飢民百姓歌曰天下大亂兮市為墟母不保子兮妻失夫賴得皇甫兮復安居董逃歌一作靈帝中平中京都歌後漢書五行志曰按董謂董卓也言雖拔扈縱其殘暴終歸逃竄至於滅族也風俗通云卓以董逃之歌主為已發大禁絶之楊孚董卓傳曰卓改董逃為董安永樂世董逃遊四郭董逃蒙天恩董逃帶金紫董逃行謝恩董逃整車騎董逃垂欲發董逃與中辭董逃出西門董逃瞻宫殿董逃望京城董逃日夜絶董逃心摧傷董逃布歌華嶠後漢書曰王允與吕布及士孫瑞謀董卓有人書回字於布上負而行於市歌曰云云有告卓者卓不悟獻帝春秋曰有書三尺布幡上作兩口相銜之字及布殺卓負布者不復見布乎布乎洛陽令歌長沙耆舊傳曰祝良字石卿為洛陽令歲時亢旱天子祈雨不得良乃暴身階庭告誠引罪自晨至申紫雲沓起甘雨登降人為之歌天久不雨蒸人失所天王自出祝令特苦精符感應滂沱下雨崔瑗歌崔氏家傳曰崔瑗為汲令開溝造稻田蒲鹵之地更為沃壤民賴其利長老歌之曰上天降神明錫我仁慈父臨民布德澤恩惠施以序穿溝廣溉灌決渠作甘雨爰珍歌陳留耆舊傳曰爰珍除六令吏人訟息教誨其子弟歌之曰我有田疇爰父殖置我有子弟爰父教誨髙孝甫歌陳留耆舊傳曰髙慎字孝甫敦質少華默而好沈深之謀為從事號曰臥虎故人謂之曰嶷然不語名髙孝甫襄陽太守歌襄陽耆舊傳曰襄陽太守胡烈有惠化百姓歌曰美哉明后雋哲惟嶷陶廣乾坤周孔是則文武播暢威振遐域兩黃歌襄陽耆舊記曰黃穆字伯開博學養門徒為山陽太守有德政致甘露白神雀白鳩之瑞弟奐字仲開為武陵太守貪穢無行武陵人歌曰云云言不同也天有冬夏人有兩黃樊惠渠歌并序陽陵縣東其地衍隩土氣辛螫嘉穀不植而涇水長流光和五年京兆尹樊君勤恤民隱乃立新渠曩之鹵田化為甘壤農民怡悅相與謳談疆畔變然成章謂之樊惠渠云蔡雍我有長流莫或閼之我有溝澮莫或達之田疇斥鹵莫修莫釐飢饉困悴莫恤莫思乃有樊君作人父母立我畎畝黃潦膏凝多稼茂止惠乃無疆如何勿喜我壤既營我疆斯成泯泯我人既富且盈為酒為釀蒸彼祖靈貽福惠君壽考且寧茅山父老歌見雲笈七籖外編作大茅君誤茅君內傳曰茅盈咸陽人也得道隱句曲鄉人因改句曲為茅君之山時盈二弟俱貴衷為五官大夫西河太守固為執金吾各棄官渡江求兄於東山後咸得仙道太上命固治丹陽句曲山衷治常良之山盈為司命真君東嶽上卿於是盈與二弟訣别俱去固𠂻留治此山漢平帝元壽二年也內法既融外教坦平爾乃風雨以時五禾成熟疾癘不起暴害不行父老歌曰茅山連金陵江湖據下流三神乘白鶴各在一山頭佳雨灌畦稻陸田亦復周妻子保堂室使我無百憂白鶴翔青天何時復來遊在一作治青天一作金穴此本仙詩舊編靈寶巴謠入古此從附漢蜀國風華陽國志曰漢安帝時巴郡太守連失道國人風之曰按此下二篇志不云為歌謠然亦不明云詩下篇頗類樂府今附于後明明上天下土是觀帝選元后求定民安孰可不念禍福由人願君奉詔惟德日親蜀國刺華陽國志曰孝桓帝時河南李盛仲和為郡守貪財重賦國人刺之曰狗吠何喧喧有吏來在門披衣出門應府記欲得錢語窮及請期吏怒反見尤旋步顧家中家中無可與思往往鄰貸鄰人以言遺錢錢何難得令我獨憔悴隴頭歌秦川記曰隴西郡隴山其上懸巖吐溜於中嶺泉渟因名萬石泉泉溢漫散而下溝澮皆注故北人升此而歌曰隴頭按漢橫吹曲有隴頭而亡其辭此或其遺也梁鼓角橫吹亦載此與胸奴歌舊編在漢今附從隴頭流水流離四下念我行役飄然曠野登髙望逺涕零雙墮又歌隴頭流水鳴聲幽咽遙望秦川肝腸斷絶胸奴歌十道志曰焉支祁連二山皆美水草胸奴失之乃作此歌失我焉支山令我婦女無顔色失我祁連山使我六畜不蕃息亦載西河舊事失我祁連山二句在前古樂苑卷四十四
