body:
  text: 古樂苑巻二十二明梅鼎祚編相和歌辭楚調曲楚調曲古今樂録曰王僧䖍技錄楚調曲有白頭吟行泰山吟行梁甫吟行東武琵琶吟行怨詩行其器有笙笛弄節琴筝琵琶瑟七種張永録云未歌之前有一部弦又在弄後又有但曲七曲廣陵散黄老彈飛引大胡笳鳴小胡笳鳴鵾雞遊弦流楚窈窕並琴筝笙筑之曲王錄所無也其廣陵散一曲今不傳白頭吟二首五解行古今樂録曰王僧䖍技録云白頭吟歌古皚如山上雪篇西京雜記曰司馬相如將聘荗陵人女為妾卓文君作白頭吟以自絶相如乃止樂府解題曰古辭云皚如山上雪皎若雲間月又云願得一心人白頭不相離始言良人有兩意故來與之相决絶次言别於溝水之上叙其本情終言男兒重意氣何用於錢刀若鮑照張正見虞世南皆自傷清直芬馥而遭鑠金玷玉之謗君恩以薄與古文近焉一說云白頭吟疾人相知以新間舊不能至於白首故以為名漢卓文君皚如山上雪皎若雲間月聞君有兩意故來相決絶一解平生共城中何嘗斗酒㑹今日斗酒㑹明旦溝水頭蹀躞御溝上溝水東西流二解郭東亦有樵郭西亦有樵兩樵相推與無親為誰驕三解淒淒重淒淒嫁娶亦不啼願得一心人白頭不相離四解竹竿何嫋嫋魚尾何簁簁男兒欲相知何用錢刀為􅀈如馬噉萁川上髙士嬉今日相對樂延年萬嵗期五解􅀈右一曲晉樂所奏如下或有五字皚如山上雪皎若雲間月聞君有兩意故來相決絶今日斗酒㑹明旦溝水頭蹀躞御溝上溝水東西流淒淒復淒淒嫁娶不須啼願得一心人白頭不相離竹竿何嫋嫋魚尾何簁簁男兒重意氣何用錢刀為右一曲本辭同前陳徐堪有班去趙姬升出此宋鮑照直如朱絲繩清如玉壺氷何慙宿昔意猜恨坐相仍人情賤恩舊世路逐衰興毫髮一為瑕丘山不可勝食苖實碩䑕㸃白信蒼蠅鳬鵠逺成美薪芻前見凌申黜褒女進班去趙姬升周王日淪惑漢帝益嗟稱心賞固難恃貌恭豈易憑古來共如此非君獨撫膺同前陳張正見平生懐直道桂松比貞風語黙妍蚩際沈浮毁譽中讒新恩易盡情去寵難終彈珠金市側抵玉崑山東含香老顔駟執㦸異揚雄惆悵崔亭伯幽憂馮敬通王嬙沒故塞班女棄深宫春苔封履跡秋葉奪粧紅顔如花落槿鬢似雪飄蓬此時積長歎傷年誰復同崑一作舂積一作即班去趙姬升陳徐堪班姬與飛燕俱侍漢王宫不意恩情歇偏將衰草同香飛金輦外苔上玉階中今日悲團扇非是為秋風泰山吟古今樂録曰王僧䖍技錄有泰山吟行今不歌樂府解題曰泰山吟言人死精魄歸於泰山亦薤露蒿里之類也晉陸機泰山一何髙迢迢造天庭峻極周已逺曽雲鬱冥冥梁甫亦有館蒿里亦有亭幽塗延萬鬼神房集百靈長吟泰山側慷慨激楚聲同前宋謝靈運岱宗秀維岳崔崒刺雲天岞崿既嶮巇觸石輒芊緜登封瘞崇壇降禪藏肅然石閭何晻藹明堂祕靈篇芊緜一作千眠梁甫吟古今樂録曰王僧䖍技録有梁甫吟行今不歌謝希逸琴論曰諸葛亮作梁甫吟陳武别傳曰武常騎驢牧羊諸家牧豎十數人或有知歌謠者武遂學泰山梁甫吟幽州馬客吟及行路難之屬蜀志曰諸葛亮好為梁甫吟然則不起於亮矣李勉琴説曰梁甫吟曽子撰琴操曰曽子耕泰山之下天雨雪凍旬月不得歸思其父母作梁山歌蔡邕琴頌曰梁甫悲吟周公越裳注梁甫山名在泰山下梁甫吟葢言人死𦵏此山亦葬歌也又有泰山梁甫吟與此頗同按晏子曰公孫捷田開疆古冶子事景公勇而無禮晏子言於公餽之二桃曰三子計功而食桃公孫捷曰吾再搏隠虎功可以食田曰吾杖兵而御三軍者再功可以食古冶子曰君當濟河黿銜左驂冶潜行水底逆流百歩從流九里得黿頸功可以食二子曰吾勇不若子功不逮子取桃不讓是貪也然而不死無勇也刎頸而死冶曰二子死之冶獨不逮又刎頸而死西溪叢語曰李善陸詩註蔡邕琴頌云梁甫悲吟不知名為梁父吟何義張衡四愁詩云欲往從之梁甫艱注云泰山東嶽也君有徳則封此山願輔佐君王致於有徳而為小人讒邪之所阻梁父泰山下小山名諸葛亮好為梁父吟恐取此意蜀諸葛亮步出齊城門遥望蕩隂里里中有三墳纍纍正相似問是誰家墓田疆古冶子力能排南山文能絶地紀一朝被讒言二桃殺三士誰能為此謀國相齊晏子遙望蕩隂里解題作追望隂陽里青州有隂陽里田疆古治子解題作田强固野子墳一作墓子一作民紀一作理同前晉陸機玉衡既已驂羲和若飛凌四運循環轉寒暑自相承冉冉年時暮迢迢天路徴招揺東北指大火西南升悲風無絶響𤣥雲互相仍豐氷憑川結零露彌天凝年命時相逝慶雲鮮克乘履信多愆期思順焉足憑慷慨臨川響非此孰為興哀吟梁甫巔慷慨獨撫膺既一作固氷一作水零一作寒又作霜慷慨一作愾愾同前梁沈約龍駕有馳䇿日御不停隂星籥亟迴變氣化坐盈侵寒光稍眇眇秋塞日沈沈髙牕久餘火傾河駕騰參飈風折暮草驚籜霣層林時雲靄空逺淵水結清深奔樞豈易紐珠庭不可臨懷仁每多意履順孰能禁露清一唯促緩志且移心哀歌步梁甫歎絶有遺音塞一作色籜一作竿雲集作雨同前陳陸瓊臨淄佳麗地年少習名倡似笑唇朱動非愁眉翠揚掩抑隨竽轉和柔㑹瑟張輕扇屢迴指飛塵亟繞梁寄言諸葛相此曲乍難忘年少一作少小泰山梁甫行樂府解題曰曹植改泰山梁甫為八方魏陳思王植八方各異氣千里殊風雨劇哉邉海民寄身於草墅妻子象禽獸行止依林阻柴門何蕭條狐兎翔我宇後闕東武吟行古今樂録曰王僧䖍技錄有東武吟行今不歌左思齊都賦注云東武太山皆齊之土風弦歌謳吟之曲名也通曲曰漢有東武郡今髙宻諸城縣是也晉陸機投跡短世間髙步長生闈濯髪冒雲冠浣身被羽衣飢從韓衆餐寒就佚女棲浣一作洗同前宋鮑照主人且勿喧賤子歌一言僕本寒鄉士出身蒙漢恩始隨張校尉召募到河源後逐李輕車追虜出塞垣宻途亘萬里寧嵗猶七奔肌力盡鞍甲心思歴涼温將軍既下世部曲亦罕存時事一朝異孤績誰復論少壯辭家去窮老還入門腰鐮刈葵藿倚杖牧雞豚昔如韝上鷹今似檻中猿徒結千載恨空負百年怨弃席思君幄疲馬戀君軒願垂晉主恵不愧田子魂召一作占牧一作收結一作積同前梁沈約天徳深且曠人世賤而浮東枝裁拂景西壑已停輈逝辭金門寵去飲玉池流霄轡一永矣俗累從此休怨詩行琴操卞和得玉璞以三獻楚封為陵陽矦辭不受而作怨歌班婕妤怨詩行序漢成帝班媫妤失寵求供養太后於長信宫乃作怨詩以自傷託辭於紈扇云郭本分怨詩行怨詩怨歌行為三類今從之怨詩行古辭言人命難常不如遊心恣欲也一曰怨詩行歌陳思而下多言弃妻怨女大畧祖班婕妤怨歌行之意惟阮瑀怨詩與此意合古辭天徳悠且長人命一何促百年未幾時奄若風吹燭嘉賔難再遇人命不可續齊度遊四方各繫太山録人間樂未央忽然歸東嶽當須盪中情遊心恣所欲同前二首七解王古今樂録曰怨詩行歌東阿明月照髙樓一篇魏陳思王植明月照髙樓流光正徘徊上有愁思婦悲歎有餘哀一解借問歎者誰自云宕子妻夫行踰十載賤妾常獨棲二解念君過於渴思君劇於飢君為髙山柏妾為濁水泥三解北風行蕭蕭烈烈入吾耳心中念故人淚隨不能止四解浮沈各異路㑹合當何諧願作東北風吹我入君懷五解君懷常不開賤妾當何依恩情中道絶流止任東西六解我欲竟此曲此曲悲且長今日樂相樂别後莫相忘六解右一曲晉樂所奏作君為一作君作相一桐明月照髙樓流光正徘徊上有愁思婦悲歎有餘哀借問歎者誰言是宕子妻君行踰十年孤妾常獨栖君若清路塵妾若濁水泥浮沈各異勢㑹合何時諧願為西南風長逝入君懷君懷時不開妾心當何依右一曲本辭即七哀詩同前晉梅陶庭植不材栁苑育能鳴鶴鼓枝遊畦畝栖釣一丘壑最恱朝敷榮夕乘南音客晝立薄遊景暮宿漢隂魄庇身䕃王猷罷蹇反幻迹同前明月照髙樓含君千里光巷中情思滿斷絶孤妾腸悲風盪帷帳瑶翠坐自傷妾心依天末思與浮雲長嘯歌視秋草幽葉豈再揚暮蘭不待嵗離華能幾芳願作張女引流悲繞君堂君堂嚴且祕絶調徒飛揚明月照髙樓梁武帝圓魄當虚闥清光流思延延思照孤影悽怨還自憐臺鏡早生塵匣琴又無弦悲慕屢傷節離憂亟華年君如東扶景妾似西栁煙相去既路迥明晦亦殊懸願為銅鐵轡以感長樂前怨詩魏阮瑀民生受天命漂若河中塵雖稱百齡夀孰能應此身猶獲嬰凶禍流落恒苦辛流落一作流離同前王子年拾遺記曰石季倫有愛婢曰朔風魏末於胡中得之年十五無有比其容貌最以文辭擅愛年三十妙年者爭嫉之崇退翔風為房老使主羣少乃懐怨而作詩晉翔風春華誰不美卒傷秋落時突煙還自低鄙退豈所期桂芳徒自蠧失愛在蛾眉坐見芳時歇憔悴空自嗤同前集云怨詩楚調示龎主簿鄧治中陶潜天道幽且逺鬼神茫昧然結髪念善事僶俛五十年弱冠逢世阻始室喪其偏炎火屢焚如螟蜮恣中田風雨縱横至收歛不盈廛夏日常抱飢寒夜無被眠造夕思雞鳴及晨願烏遷在已亦何怨離憂悽目前吁嗟身後名於我若浮煙慷慨激悲歌鍾期信為賢五十一作六九亦何怨一作何怨天激一作獨同前梁簡文帝秋風與白團本自不相安新人及故愛意氣豈能寛黄金肘後鈴白玉案前盤誰堪空對此還成無嵗寒同前劉孝威退寵辭金屋見譴斥甘泉枕席秋風起房櫳明月懸燭避牕中影香迴爐上煙丹庭斜草逕素壁㸃苔錢歌起蒲生曲樂奏下山弦新聲昔廣宴餘杯今自傳王嬙向絶漠宗女入祁連鴈書猶未返角馬無歸年昭臺省媵御曽坂無棄捐後薪隨復積前魚誰更憐同前陳張正見新豐妖冶地遊俠競驕奢池臺間羅綺桃李雜煙霞葢影分連騎衣香合並車艷粉驚飛蝶紅粧映落花舞衫飄冶袖歌扇掩團紗玉牀珠帳巻金樓鏡月斜還疑簫史鳳不及季倫家同前二首江總採桑歸路河流深憶昔相期柏樹林奈許新縑傷妾意無由故劒動君心新梅嫩栁未障羞情去思移那可留團扇篋中言不分纎腰掌上詎勝愁分選詩拾遺作盡怨歌行漢書曰孝成班倢伃初入官為少使俄而大幸為倢伃居増成舍其後趙飛燕姊弟亦從微賤興班倢伃失寵稀復進見趙氏姊弟驕妬倢伃恐久見危求供養太后長信宫帝許焉樂府解題曰倢伃怨者為漢成帝班倢伃作也倢伃徐令彪之姑况之女美而能文初為帝所寵愛後幸趙飛燕姊弟冠於後宫倢伃自知見薄乃退居東宫作賦及紈扇詩以自傷悼後人傷之而為倢伃怨也歌錄曰怨歌行古辭樂府作顔延年漢班倢伃新裂齊紈素鮮潔如霜雪裁為合歡扇團團似明月出入君懷袖動揺微風發常恐秋節至凉飈奪炎熱弃捐篋笥中恩情中道絶裂一作製鮮一作皎為一作成團團一作團圓飈一作風同前樂録作古辭王僧䖍技録曰荀録所載古為君一篇今不傳樂府解題曰古辭言周公推心輔政二叔流言致有雷雨抜木之變若梁簡文十五頗有餘自言姝豔以讒見毁與古文意同而體異傳休奕盖傷十五入君門一別終華髪不及偕老猶望死而同穴也魏陳思王植為君既不易為臣良獨難忠信事不顯乃有見疑患周公佐成王金縢功不刋推心輔王室二叔反流言待罪居東國泣涕常留連皇靈大動變震雷風且寒拔樹偃秋稼天威不可干素服開金縢感悟求其端公旦事既顯成王乃哀難吾欲竟此曲此曲悲且長今日樂相樂别後莫相忘右一曲晉樂所奏同前梁簡文帝十五頗有餘日照杏梁初蛾眉本多嫉掩鼻特成虚持此傾城貌翻為不肖軀秋風吹海水寒霜依玉除月光臨户駛荷花依浪舒望簷悲雙翼窺沼泣前魚苔生履處没草合行人踈裂紈傷不盡歸骨恨難袪早知長信别不避後園輿前魚一作王餘魚名同前集雜體詩云班倢伃詠扇江淹紈扇如團月出自機中素畫作秦王女乘鸞向煙霧彩色世所重雖新不代故竊悲涼風至吹我玉陛樹君子恩未畢零落委中路圜一作團同前沈約時屯寕易犯俗險信難羣坎壈元叔賦頓挫敬通文遽淪班姬寵夙窆賈生墳短俗同如此長歎何足云同前周庾信家住金陵縣前嫁得長干少年回頭望鄉淚落不知何處天邉胡塵㡬日應盡漢月何時更圓為君能歌此曲不覺心隨㫁弦同前隋虞世南紫殿秋風冷彫甍白日沈裁紈悽㫁曲織素別離心掖庭羞改畫長門不惜金寵移恩稍薄情踈恨轉深香銷翠羽帳弦㫁鳳凰琴鏡前紅粉歇堦上緑苔侵誰言掩歌扇翻作白頭吟怨歌行朝時篇晉傅𤣥昭昭朝時日皎皎晨明月十五入君門一别終華髪同心忽異離曠如胡與越胡越有㑹時參辰遼且濶形影雖髣髴音聲寂無達纎弦感促桂觸之哀聲發情思如循環憂來不可遏塗山有餘恨詩人詠采葛蜻蛚吟牀下回風起幽闥春榮隨路落芙蓉生木末自傷命不遇良辰永乖别已爾可奈何譬如紈素裂孤雌翔故巢星流光景絶魂神馳萬里甘心要同宂晨一作最如一作若班倢伃一曰倢伃怨晉陸機倢伃去辭寵淹留終不見寄情在玉階託意唯團扇春苔暗階除秋草蕪髙殿昬黄履綦絶愁來空雨面昬黄一作黄昬同前梁元帝婕妤初選入含媚向羅幃何言飛燕寵青苔生玉墀誰知同輦愛遂作裂紈詩以兹自傷苦終無長信悲同前集云班倢伃怨劉孝綽應門寂已閉非復後庭時况在青春日萋萋緑草滋妾身似秋扇君恩絶履綦詎憶遊輕輦徒令賤妾辭徒令一作從今同前此與下首並云奉和湘東王教何思澄寂寂長信晩雀聲喧洞房蜘蛛網髙閣駮蘚被長廊虚殿簾幃静閒堦花蘂香悠悠視日暮還復拂空牀拂一作守同前孔翁歸長門與長信日暮九重空雷聲聴隠隠車響絶瓏瓏恩光隨妙舞團扇逐秋風鈆華誰不慕人意自難終同前郭本作玉叔英妻沈氏今從玉臺藝文劉令􅈺日落應門閉愁思百端生況復昭陽近風傳歌吹聲寵移終不恨讒枉太無情只言争分理非獨舞腰輕同前陳隂鏗柏梁新寵盛長信昔恩傾誰謂詩書巧翻為歌舞輕花月分牕進苔草共階生妾淚衫前滿單眠夢裏驚可惜逢秋扇何用合歡名眠一作暝同前何楫齊紈既逐篋趙舞即凌人履跡隨恩故階苔逐恨新獨卧銷香炷長啼費手巾庭草何聊賴也持秋當春手一作錦玉階怨漢書曰班倢伃為趙飛燕譛退處東宫作賦自悼云華殿塵兮玉階苔此曲舊列長門怨後今移附班倢伃齊謝朓夕殿下珠簾流螢飛復息長夜縫羅衣思君此何極同前詩品亦作謝朓虞炎紫藤拂花樹黄鳥度青枝思君一歎息苦淚應言垂長門怨漢武帝故事曰武帝為膠東王時長公主嫖有女欲與王㛰景帝未許後長主還宫膠東王數嵗長主抱置膝上問曰兒欲得婦否長主指左右長御百餘人皆云不用指其女問曰阿嬌好否笑對曰好若得阿嬌作婦當作金屋貯之長主乃苦要帝遂成㛰焉漢書曰孝武陳皇后長公主嫖女也擅寵驕貴十餘年而無子聞衛子夫得幸幾死者數焉元光五年廢居長門宫樂府解題曰長門怨者為陳皇后作也后退居長門宫愁悶悲思聞司馬相如工文章奉黄金百斤令為解愁之辭相如為作長門賦帝見而傷之復得親幸後人因其賦而為長門怨也梁栁惲玉壺夜愔愔應門重且深秋風動桂樹流月搖輕隂綺簷清露溽網户思蟲吟歎息下蘭閣含愁奏雅琴何由鳴曉佩復得抱宵衾無復金屋念豈照長門心溽一作滴同前費昶向夕千愁起自悔何嗟及愁思且歸牀羅襦方掩泣絳樹揺風軟黄鳥弄聲急金屋貯嬌時不言君不入大曲宋書樂志曰大曲十五曲一曰東門二曰西山三曰羅敷四曰西門五曰黙黙六曰園桃七曰白鵠八曰碣石九曰何嘗十曰置酒十一曰為樂十二曰夏門十三曰王者布大化十四曰洛陽令十五曰白頭吟東門東門行羅敷豔歌羅敷行西門西門行黙黙折楊栁行白鵠何嘗並豔歌何嘗行為樂滿歌行洛陽令鴈門太守行白頭吟並古辭碣石步出夏門行武帝辭西山折楊栁行園桃煌煌京洛行並文帝辭夏門步出夏門行王者布大化櫂歌行並明帝辭置酒野田黄爵行東阿王辭白頭吟與櫂歌同調其羅敷何嘗夏門三曲前有豔後有趨碣石一篇有豔白鵠為樂王者布大化三曲有趨白頭吟一曲有亂古今樂録曰凡諸大曲竟黄老彈獨出舞無亂按王僧䖍技録櫂歌行在瑟調白頭吟在楚調而沈約云同調未知孰是滿歌行三首四解零樂府解題曰古辭其始言逢此百罹丁荼毒古人遜位躬耕遂我所願次言窮逹天命智者不憂莊周遺名名垂千載終言命如鑿石見火宜自娛以頤養保此百年也古辭為樂未幾時遭世險巇逢此百罹零丁荼毒愁懣難支遙望辰極天曉月移憂來填心誰當我知一解戚戚多思慮耿耿不寧禍福無形唯念古人遜位躬耕遂我所願以兹自寧自鄙山棲守此一榮二解暮秋烈風起西蹈滄海心不能安攬衣起瞻夜北斗䦨干星漢照我去去自無他奉事二親勞心可言三解窮達天所為智者不愁多為少憂安貧樂正道師彼莊周遺名者貴子熙同巇往者二賢名垂千秋四解飲酒歌舞不樂何須善哉照觀日月日月馳驅轗軻世間何有何無貪財惜費此一何愚命如鑿石見火居世竟能幾時但當歡樂自娛盡心極所嬉怡安善養君徳惟百年保此期頤飲酒下為趨所右一曲晉樂奏為樂未幾時遭時嶮巇逢此百罹伶丁荼毒愁苦難為遥望極辰天曉月移憂來填心誰當我知戚戚多思慮耿耿殊不寧禍福無形惟念古人遜位躬耕遂我所願以兹自寧自鄙棲棲守此末榮莫秋烈風昔蹈滄海心不能安攬衣瞻夜北斗䦨干星漢照我去自無他奉事二親勞心可言窮達天為智者不愁多為少憂安貧樂道師彼莊周遺名者貴子遐同遊往者二賢名垂千秋飲酒歌舞樂復何須照視日月日月馳驅轗軻人間何有何無貪財惜費此一何愚鑿石見火居代㡬時為當歡樂心得所喜安神養性得保遐期右一曲本辭古樂苑巻二十二
