body:
  text: 古樂苑巻十三明梅鼎祚編横吹曲辭二梁陳梁鼓角横吹曲古今樂錄曰梁鼓角横吹曲有企喻瑯琊王鉅鹿公主紫騮馬黄淡思地驅樂雀勞利慕容垂隴頭流水等歌三十六曲二十五曲有歌有聲十一曲有歌是時樂府胡吹舊曲有大白浄皇太子小白浄皇太子雍臺㯓臺胡遵利羝女淳于王捉搦東平劉生單廸歴魯爽半和企喻北敦胡度來十四曲三曲有歌十一曲亡又有隔谷地驅樂紫騮馬折楊栁幽州馬客吟慕容家自魯企由谷隴頭魏髙陽王樂人等歌二十七曲合前三曲凡三十曲總六十六曲江淹横吹賦云奏白臺之二曲起關山之一引採菱謝而自罷綠水慙而不進則白登闕山又是三曲按歌辭有木蘭一曲不知起於何代也企喻歌辭古今樂錄曰企喻歌四首本北歌唐書樂志曰北狄樂其可知者鮮卑吐谷渾部落稽三國皆馬上樂也後魏樂府始有北歌即所謂真人代歌是也大都時命掖庭宫女晨夕職之周隋世與西涼樂雜奏今存者五十三章其名可解者六章慕容可汗吐谷渾部落稽鉅鹿公主白浄皇太子企喻也其不可解者咸多可汗之辭北虜之俗呼主為可汗吐谷渾又慕容别種如此歌是燕魏之際鮮卑歌也其詞虜音竟不可曉梁胡吹又有大白浄皇大子小白浄皇太子企喻等曲隋鼓吹有白浄皇太子曲與北歌校之其音皆異又有半和企喻北敦盖曲之變也四曲曲四解男兒欲作健結拌不須多鷂子經天飛羣雀兩向波放馬大澤中草好馬著臕牌子鐡裲襠􅰷鉾鸐尾條前行看後行齊著鐡裲襠前頭看後頭齊著鐡􅰷鉾男兒可憐蟲出門懷死憂尸喪狹谷中白骨無人收古今樂錄云是符融詩本云深山解谷口把谷無人收頭毛墮落魄飛揚百草頭或云後又有此二句瑯琊王歌辭八曲曲四解新買五尺刀懸著中梁柱一日三摩娑劇於十五女瑯琊復瑯琊瑯琊大道王陽春二三月單衫繡裲襠東山看西水水流盤石間公死姥更嫁孤兒甚可憐瑯琊復瑯琊瑯琊大道王鹿鳴思長草愁人思故鄉長安十二門光門最妍雅渭水從壟來浮遊渭橋下瑯琊復瑯琊女郎大道王孟陽三四月移鋪逐陰涼或又有云盛冬十一月就女覔凍漿客行依主人願得主人彊猛虎依深山願得松柏長懀馬髙纒鬃遥知身是龍誰能騎此馬唯有廣平公晉書載記廣平公姚弼興之子泓之弟也鉅鹿公主歌辭唐書樂志曰梁有鉅鹿公主歌似是姚萇時歌其詞華音與北歌不同三曲曲四解官家出遊雷大鼓細乘犢車開後户車前女子年十五手彈琵琶玉節舞鉅鹿公主殷照女皇帝陛下萬幾主紫騮馬歌辭吳競曰此詩晉宋人樂奏之首増四句名紫騮焉十五從軍征以下是古詩六曲曲四解燒火燒野田野鴨飛上天童男娶寡婦壯女笑殺人髙髙山頭樹風吹葉落去一去數千里何當還故處十五從軍征八十始得歸道逄鄉里人家中有阿誰遥看是君家松柏冡纍纍兎從狗竇入雉從梁上飛中庭生旅榖井上生旅蔡舂榖持作飯採葵持作羮羮飯一時熟不知飴阿誰出門東向看淚落沾我衣紫騮馬歌古今樂錄曰與前曲不同獨柯不成樹獨樹不成林念郎錦裲襠恒長不忘心黄淡思歌辭古今樂錄曰思音相思之思按李延年造横吹曲二十八解有黄覃子不知與此同否四曲曲四解歸歸黄淡思逐郎還去來歸歸黄淡百逐郎何處索心中不能言復作車輪旋與郎相知時但恐傍人聞江外何鬱拂龍洲廣州出象牙作帆檣綠絲作幃繂綠絲何葳蕤逐郎歸去來地驅樂歌辭古今樂錄曰側側力力以下入句是今歌有此曲四曲曲四解青青黄黄雀石穨唐槌殺野牛押殺野羊驅羊入谷自羊在前老女不嫁蹋地喚天側側力力念君無極枕郎左臂隨郎轉側摩捋郎鬚看郎顔色郎不念女不可與力或云各自努力地驅樂歌古今樂錄曰與前曲不同月明光光星欲墮欲來不來早語我雀勞利歌辭一曲曲四解雨雪霏霏雀勞利長胔飽滿短胔飢慕容垂歌辭晉書載記曰慕容本名缺尋以䜟記乃去夬以垂為名慕容雋僣號封垂為吳王徙鎮信都太元八年自稱燕王三曲曲四解慕容攀墻視吳軍無邊岸我身分自當枉殺墻外漢慕容愁憤憤燒香作佛㑹願作墻裏燕髙飛出墻外慕容出墻望吳軍無邊岸咄我臣諸佐此事可惋歎隴頭流水歌辭古今樂錄曰樂府有此歌曲解多於此按漢横吹曲有隴頭而亡其辭三曲曲四解隴頭流水流離西下念吾一身飄曠野西上隴阪羊腸九回山髙谷深不覺脚酸手攀弱枝足踰弱泥隴頭歌辭隴頭流水流離山下念吾一身飄然曠野朝發欣城暮宿隴頭寒不能語舌巻入㗋隴頭流水鳴聲幽咽遥看秦川心肝斷絶隔谷歌古今樂錄曰前云無辭樂工有辭如此兄在城中弟在外弓無弦箭無括食糧乏盡若為活救我來救我來隔谷歌郭本别列在後今從左本附此古辭兄為俘虜受困辱骨露力疲食不足弟為官吏馬食粟何惜錢刀來我贖淳于王歌肅肅河中育育熟須含黄獨坐空房中思我百媚郎百媚在城中千媚在中央但使心相念髙城何所妨東平劉生歌東平劉生安東子樹木稀屋裏無人看阿誰捉搦歌四曲粟榖難舂付石臼敝衣難護付巧婦男兒千凶飽人手老女不嫁只生口誰家女子能行歩反著裌襌後裙露天生男女共一處願得兩箇成翁嫗華陰山頭百丈井下有流水徹骨冷可憐女子能照影不見其餘見斜領黄桑柘屐蒲子履中央有系兩頭繫小時憐母大憐婿何不早嫁論家計系一作絲折楊柳歌辭瑟調有折楊柳行左克明云舊本五解後又有三解非也乃别曲耳上馬不捉鞭反折楊柳枝蹀座吹長笛愁殺行客兒腹中愁不樂願作郎馬鞭出入擐郎臂蹀座郎膝邊放馬兩泉澤忘不著連羈擔鞍逐馬走何得見馬騎遥看孟津河楊柳鬱婆娑我是虜家兒不解漢兒歌健兒須快馬快馬須健兒䟤䟦黄塵下然後别雄雌折楊柳枝歌郭本別列在後四曲曲四解上馬不捉鞭反抝楊柳枝下馬吹長笛愁殺行客兒門前一株棗歲歲不知老阿婆不嫁女那得孫兒抱敕敇何力力女子臨牕織不聞機杼聲唯聞女歎息此與下問女二句木蘭詩中語問女何所思問女何所憶阿婆許嫁女今年無消息幽州馬客吟歌辭五曲曲四解快馬常苦瘦勦兒常苦貧黄禾起羸馬有錢始作人熒熒帳中燭燭滅不久停盛時不作樂春花不重生南山自言髙只與北山齊女兒自言好故入郎君懷郎著紫袴褶女著綵裌裙男女共燕遊黄花生後園黄花鬱金色綠蛇銜珠丹辭謝牀上女還我十指環慕容家自魯企由谷歌一曲四解郎在千重樓女在九重閣郎非黄鷂子那得雲中雀髙陽樂人歌古今樂録曰魏髙陽王樂人所作也又有白鼻騧出此二曲曲四解可憐白鼻騧相將入酒家無錢但共飲畫地作交賖何處䑜觴來兩頰色如火自有桃花容莫言人勸我白鼻騧後魏溫子昇少年多好事攬轡向西都相逄狹斜路駐馬詣當壚雍臺梁武帝日落登雍臺佳人殊未來綺牕蓮花掩網户琉璃開䒠茸臨紫桂蔓延交青苔月歿光陰盡望子獨悠哉同前吳均雍臺十二樓樓樓鬱相望隴西飛狐口白日盡無光木蘭詩二首古今樂錄曰木蘭不知名詐作男子代父征行其辭最苦言萬里赴戎機關山度若飛相和曲有度關山類此浙江西道觀察使兼御史中丞韋元甫續附入唧唧復唧唧木蘭當户織不聞機杼聲唯聞女歎息問女何所思問女何所憶女亦無所思女亦無所憶昨夜見軍帖可汗大㸃兵軍書十二巻巻巻有爺名阿爺無大兒木蘭無長兄願為市鞍馬從此替爺征東市買駿馬西市買鞍韉南市買轡頭北市買長鞭旦辭爺孃去暮宿黄河邊不聞爺孃喚女聲但聞黄河流水鳴濺濺旦辭黄河去暮至黒山頭不聞爺孃喚女聲但聞燕山胡騎鳴啾啾萬里赴戎機關山度若飛朔氣傳金柝寒光照鐡衣將軍百戰死壯士十年歸歸來見天子天子坐明堂策勲十二轉賞賜百千彊可汗問所欲木蘭不用尚書郎願馳千里足送兒還故鄉爺孃聞女來出郭相扶將阿姊聞妹來當户理紅粧小弟聞姊來磨刀霍霍向猪羊開我東閣門坐我西間牀脫我戰時袍著我舊時裳當牕理雲鬢挂鏡帖花黄出門看火伴火伴皆驚忙同行十二年不知木蘭是女郎雄兎脚撲朔雌兎眼迷離雙兎傍地走安能辨我是雄雌唧唧復唧唧一作促織何唧唧旦一作朝至一作宿賞賜一作賜物可汗問所欲木蘭不用尚書郎一作欲與木蘭賞不願尚書郎願馳千里足酉陽襍俎云願借明駝千里足阿姊聞妺來一作阿妺聞姊來挂一作對皆作始朔作握迷作彌雙作兩木蘭抱杼嗟借問復為誰欲聞所慽慽感激彊其顔老父隸兵籍氣力日衰耗豈足萬里行有子復尚少胡沙沒馬足朔風裂人膚老父舊羸病何以彊自扶木蘭代父去秣馬僃戎行易却紈綺裳洗却鈆粉粧馳馬赴軍幕慷慨㩦干將朝屯雪山下暮宿青海傍夜襲燕支虜更㩦于闐羌將軍得勝歸士卒還故鄉父母見木蘭喜極成悲傷木蘭能承父母顔却卸巾鞲理絲簧昔為列士雄今復嬌子容親戚持酒賀父母始知生女與男同門前舊軍都十年共﨑嶇本結兄弟交死戰誓不渝今也見木蘭言聲雖是顔貎殊驚愕不敢前歎重徒嘻吁世有臣子心能如木蘭節忠孝兩不渝千古之名焉可滅古文苑作唐人木蘭詩横吹曲陳江總簫聲鳯臺曲洞吹龍鍾管鏜鎝漁陽摻怨抑胡笳斷古樂苑巻十三
