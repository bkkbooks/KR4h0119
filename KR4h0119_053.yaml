body:
  text: 古樂苑衍録卷一明梅鼎祚編總論樂府文心雕龍梁劉協樂府者聲依永律和聲也鈞天九奏既其上帝葛天八闋爰乃皇時自咸英以降亦無得而論矣至於塗山歌於候人始為南音有娀謠乎飛燕始為北聲夏甲歎於東陽東音以發殷氂思于西河西音以興音聲推移亦不一槩矣及夫庶婦謳吟土風詩官採言樂盲被律志感絲篁氣變金石是以師曠覘風於盛衰季札鑒微於興廢精之至也夫樂本心術故響浹肌髓先王慎焉務塞淫濫敷訓胄子必歌九德故能情感七始化動八風自雅聲浸微溺音騰沸秦燔樂經漢初紹復制氏紀其鏗鏘叔孫定其容與於是武德興乎髙祖四時廣於孝文雖摹韶夏而頗襲秦舊中和之響閴其不還暨武帝崇禮始立樂府總趙代之音撮齊楚之氣延年以曼聲協律朱馬以騷體製歌桂華雜曲麗而不經赤鴈羣篇靡而非典河間薦雅而罕御故汲黯致譏於天馬也至宣帝雅頌詩效鹿鳴邇及元成稍廣淫樂正音乖俗其難也如此暨後郊廟惟雜雅章辭雖典文而律非䕫曠至于魏之三祖氣爽才麗宰割辭調音靡節平觀其北上衆引秋風列篇或述酣宴或傷羈戍志不出於滔蕩辭不離於哀思雖三調之正聲實韶夏之鄭曲也逮於晉世則傳𤣥曉音創定雅歌以詠祖宗張華新篇亦充庭萬然杜䕫調律音奏舒雅荀勗改懸聲節哀急故阮咸譏其離聲後人驗其銅尺和樂精妙固表裏而相資矣故知詩為樂心聲為樂體樂體在聲瞽師務調其器樂心在詩君子宜正其文好樂無荒晉風所以稱逺伊其相謔鄭國所以云亡故知季札觀辭不直聽聲而巳若夫豔歌婉孌怨志詄絶淫辭在曲正響焉生然俗習飛馳職競新異雅詠溫恭必缺伸魚睨竒辭切至則拊髀雀躍詩聲俱鄭自此階矣凡樂辭曰詩詩聲曰歌聲來被辭辭繁難節故陳思稱李延年間於增損古辭多者則宜減之明貴約也觀髙祖之詠大風孝武之歎來遲歌童被聲莫敢不協子建士衡咸有佳篇並無詔伶人故事謝絲管俗稱乖調蓋未思也至於斬疑軒伎鼓吹漢世鐃挽雖戎喪殊事而並總入樂府繆襲所致亦有可算焉昔子政品文詩與歌别故略具樂篇以標區界樂府總序通志宋鄭樵古之達禮三一曰燕二曰享三曰祀所謂吉凶軍賓嘉皆主此三者以成禮古之達樂三一曰風二曰雅三曰頌所謂金石絲竹匏土革木皆主此三者以成樂禮樂相須以為用禮非樂不行樂非禮不舉自后䕫以來樂以詩為夲詩以聲為用八音六律為之羽翼耳仲尼編詩為燕享祀之時用以歌而非用以說義也古之詩今之辭曲也若不能歌之但能誦其文而說其義可乎不幸腐儒之說起齊魯韓毛四家各為序訓而以說相髙漢朝又立之學官以義理相授遂使聲歌之音湮沒無聞然當漢之初去三代未逺雖經生學者不識詩而太樂氏以聲歌肄業往往仲尼三百篇瞽史之徒例能歌也奈義理之說既勝則聲歌之學日微東漢之末禮樂蕭條雖東觀石渠議論紛紜無補於事曹孟德平劉表得漢雅樂郎杜䕫䕫老矣久不肄習所得於三百篇者惟鹿鳴騶虞伐檀文王四篇而巳餘聲不傳太和末又失其三左延年所得惟鹿鳴一笙每正旦大㑹太尉奉璧羣臣行禮東廂雅樂常作者是也古者歌鹿鳴必歌四牡皇皇者華三詩同節故曰工歌鹿鳴之三而用南陔白華華黍三笙以贊之然後首尾相承節奏有屬今得一詩而如此用可乎應知古詩之聲為可貴也至晉室鹿鳴一篇又無傳矣自鹿鳴一篇絶後世不復聞詩矣然詩者人心之樂也不以世之汙隆而存亡豈三代之時人有是心心有是樂三代之後人無是心心無是樂乎繼三代之作者樂府也樂府之作宛同風雅但其聲散佚無所紀繫所以不得嗣續風雅而為流通也按三百篇在成周之時亦無所紀繫有季札之賢而不别國風所在有仲尼之聖而不知雅頌之分仲尼為此患故自衛返也問於太師氏然後取而正焉列十五國風以明風土之音不同分大小二雅以明朝廷之音有間陳周魯商三頌之音所以侑祭也定南陔白華華黍崇丘由庚由儀六笙之音所以叶歌也得詩而得聲者三百篇則繫於風雅頌得詩而不得聲者則置之謂之逸詩如河水祈招之類無所繫也今樂府之行於世者章句雖存聲樂無用崔豹之徒以義說名吳競之徒以事解目蓋聲失則義起其與齊魯韓毛之言詩無以異也樂府之道或幾乎息矣臣今取而繫之千載之下庶無絶紐一曰短簫鐃歌二十二曲二曰鞞舞歌五曲三曰拂舞歌五曲四曰鼓角橫吹十五曲五曰胡角十曲六曰相和歌三十曲七曰吟歎四曲八曰四絃一曲九曰平調七曲十曰瑟調三十八曲十一曰楚調十曲十二曰大曲十五曲十三曰白紵歌五曲十四曰清商八十四曲凡二百五十一曲繫之正聲即風雅之聲也一曰郊祀十九章二曰東都五詩三曰梁十二雅四曰唐十二和凡四十八曲繫之正聲即頌聲也一曰漢三侯之詩一章二曰漢房中之樂十七章三曰隋房內二曲四曰梁十曲五曰陳四曲六曰北齊二曲七曰唐五十五曲凡九十一曲繫之别聲而非正樂之用也正聲之餘則有琴琴五十七曲别聲之餘則有舞舞二十三曲古者絲竹與歌相和故有譜無辭所以六詩在三百篇中但存名耳漢儒不知謂為六亡詩也琴之九操十二引以音相授並不著辭琴之有辭自梁始舞與歌相應歌主聲舞主形自六代之舞至于漢魏並不著辭也舞之有辭自晉始今之所繫以詩繫於聲以聲繫於樂舉三逹樂行三逹禮庶不失乎古之道也古調二十四曲征戍十五曲遊俠二十一曲行樂十八曲佳麗四十七曲别離十八曲怨思二十五曲歌舞二十一曲絲竹十一曲觴酌七曲宫苑十九曲都邑三十四曲道路六曲時景二十五曲人生四曲人物十曲神仙二十二曲梵竺四曲蕃胡四曲山水二十四曲草木二十一曲車馬六曲魚龍六曲鳥獸二十一曲雜體六曲總四百十九曲不得其聲則以義類相屬分為二十五門曰遺聲遺聲者逸詩之流也庶幾來者復得其聲則不失其所繫矣然三代既沒漢魏嗣興禮樂之來陵夷有漸始則風雅不分次則雅頌無别次則頌亡次則禮亡按上之回聖人出君子之作也雅也艾如張雉子班野人之作也風也合而為鼓吹曲燕歌行其音本幽薊則列國之風也煌煌京洛行其音本京華則都人之雅也合而為相和歌風者鄉人之用雅者朝廷之用合而用之是為風雅不分然享大禮也燕私禮也享則上兼用下樂燕則下得用上樂是則風雅之音雖異而享燕之用則通及明帝定四品一曰大豫樂郊廟上陵用之二曰雅頌樂辟雍享射用之三曰黃門鼓吹樂天子宴羣臣用之四曰短簫鐃歌樂軍中用之古者雅用於人頌用於神武帝之立樂府采詩雖不辨風雅至於郊祀房中之章未嘗用於人事以明神人不可以同事也今辟雍享射雅頌無分應用頌者而改用大豫應用雅者而改用黃門不知黃門大豫於古為何樂乎風雅通歌猶可以通也雅頌通歌不可以通也曹魏凖鹿鳴作於赫篇以祀武帝凖騶虞作巍巍篇以祀文帝凖文王作洋洋篇以祀明帝且清廟祀文王執競祀武王莫非頌聲今魏家三廟純用風雅此頌之所以亡也頌亡則樂亡矣是時樂雖亡禮猶存宗廟之禮不用之天明有尊親也鬼神之禮不用之人知有幽明也梁武帝作十二雅郊廟明堂三朝之禮展轉用之天地之事宗廟之事君臣之事同其事矣樂之失也自漢武始其亡也自魏始禮之失也自漢明始其亡也自梁始禮樂淪亡之所由不可不知也正聲序論古之詩曰歌行後之詩曰古近二體歌行主聲二體主文詩為聲也不為文也浩歌長嘯古人之深趣今人既不尚嘯而又失其歌詩之㫖所以無樂事也凡律其辭則謂之詩聲其詩則謂之歌作詩未有不歌者也詩者樂章也或形之歌詠或散之律吕各隨所主而命主於人之聲者則有行有曲散歌謂之行入樂謂之曲主於絲竹之音者則有引有操有吟有弄各有調以主之攝其音謂之調總其調亦謂之曲凡歌行雖主人聲其中調者皆可以被之絲竹凡引操吟㺯雖主絲竹其有辭者皆可以形之歌詠蓋主於人者有聲必有辭主於絲竹者取音而巳不必有辭其有辭者通可歌也近世論歌行者求名以義彊生分别正猶漢儒不識風雅頌之聲而以義論詩也且古有長歌行短歌行者謂其聲歌之短長耳崔豹吳競大儒也皆謂人壽命之短長當其時巳有此說今之人何獨不然嗚呼詩在於聲不在於義猶今都邑有新聲巷陌競歌之豈為其辭義之美哉直為其聲新耳禮失則求諸野正為此也孔子曰吾自衛反魯然後樂正雅頌各得其所亦謂雅頌之聲有别然後可以正樂又曰關雎樂而不淫哀而不傷亦謂關雎之聲和平聞之者能令人感發而不失其度若誦其文習其理能有哀樂之事乎二體之作失其詩矣縱者謂之古拘者謂之律一言一句窮極物情工則工矣將如樂何樂府在漢初雖有其官然采詩入樂自漢武始武帝定郊祀乃立樂府采詩夜誦則有趙代秦楚之謳莫不以聲為主是時去三代未逺猶有雅頌之遺風及後人泥於名義是以失其傳故吳競譏其不覩本章便斷題取義贈利涉則述公無渡河慶載誕乃引烏生八九子賦雉子班者但美繡頸錦臆歌天馬者惟叙驕馳亂踏其間有如劉猛李餘輩賦出門行不言離别將進酒乃叙烈女事用古題不用古義知此意者蓋鮮矣然使得其聲則義之同異又不足道也自永嘉之亂禮樂日微日替暨隋平陳得其一二則樂府之清商也文帝聽而善之曰此華夏正聲也乃置清商府博采舊章以為樂之所本在此自隋之後復無正聲至唐能合于管絃者明君楊叛兒驍壺春歌秋歌白雪堂堂春江花月夜八曲而巳不幾於亡乎臣謹考托古今編繫節奏庶正聲不墜於地矣漢短簫鐃歌二十二曲亦曰鼓吹曲按漢晋謂之短簫鐃歌南北朝謂之鼓吹曲觀李白作鼓吹入朝曲亦曰鐃歌列騎次颯沓引公卿則知唐時猶有遺音但大樂氏失職耳朱鷺鷺惟白色漢有朱鷺之祥因而為詩梁元帝放生碑云𤣥龜夜夢終見取於宋王朱鷺晨飛尚張羅於漢后謂此也魏曰楚之平吳曰炎精缺晉曰靈之祥梁曰木紀謝北齊曰水德謝言魏謝齊興也後周曰𤣥精季言魏道陵遲太祖肇開王業也思悲翁魏曰戰滎陽吳曰漢之季晉曰宣受命梁曰賢首山北齊曰出山東言神武戰廣阿破爾朱兆也後周曰征隴西言太祖誅侯莫陳悅掃清隴右也艾如張魏曰獲吕布吳曰攄武師晉曰征遼東梁曰桐柏山北齊曰戰韓陵言神武滅四胡定京洛也後周曰迎魏帝言武帝西幸太祖奉迎宅關中也上之回魏曰克官渡吳曰烏林晉曰宣輔政梁曰道亡極北齊曰殄關隴言神武遣侯莫陳悅誅賀拔嶽定關隴也後周曰平竇泰言太祖計平竇泰也擁離魏曰舊邦吳曰秋風晉曰時運多難梁曰抗威北齊曰滅山胡言神武屠蠡升高車而蠕蠕向化也後周曰復𢎞農言太祖收復陕城關東震懼也戰城南魏曰定武功吳曰克皖城晉曰景龍飛梁曰漢東流北齊曰立武定言神武立魏主遷都於鄴而定天下也後周曰克沙苑言太祖俘齊軍十萬於沙苑神武脫身遁也巫山髙魏曰屠栁城吳曰關背德晉曰平玉衡梁曰鶴樓峻北齊曰戰芒山言神武克周師也後周曰戰河陰言太祖破神武於河上斬其三將也上陵漢章帝元和三年帝自作詩四篇一曰思齊姚皇二曰六麒麟三曰竭蕭雍四曰陟屺與鹿鳴承元氣二曲為宗廟食舉又以重來上陵二曲合八曲為上陵食舉據此所言則上陵自是八曲之一名或作于章帝之前亦不可知蓋因上陵而為之也魏曰平南荆吳曰通荆州晉曰文皇統百揆梁曰昏主恣淫慝北齊曰禽蕭明言梁遣明來寇為清河王嶽所禽也後周曰平漢東言太祖命將平隨羣安陸也將進酒魏曰平關中吳曰章洪德晉曰因時運梁曰石首篇北齊曰破侯景言凊河王嶽破侯景復河南也後周曰取巴蜀言太祖遣軍平定蜀地也有所思亦曰嗟佳人漢太樂食舉十三曲第七曰有所思漢人亦以此樂侑食魏曰應帝期吳曰順厯數晉曰惟庸蜀梁曰期運集北齊曰嗣丕基言文宣帝也後周曰拔江陵言太祖命將禽蕭繹平南土也芳樹魏曰雍熙吳曰承天命晉曰天序梁曰於穆北齊曰克淮南言文宣遣清河王嶽禽梁司徒陸法和克夀春盡取江北之地也後周曰受魏禪言閔帝受魏禪作周也上邪魏曰太和吳曰元化晉曰大晉承運期梁曰惟大梁北齊曰平瀚海言文宣命將滅蠕蠕國也後周曰宣重光言明帝入承大統也君馬黃晉曰金靈運北齊曰定汝潁言文襄遣清河王嶽禽周將王思政於長葛汝潁悉平也後周曰哲皇出言髙祖之聖德也如張正見蔡知君之流只言馬而巳按謝燮云或聽鐃歌曲惟吟君馬黃古人知音别曲見於賦詠者如此後世只於言語上計較此道無聞雉子班晉曰於穆我皇北齊曰聖道洽言文宣之德無思不服也後周曰平東夏言髙祖禽齊王於青州一舉定山東也按吳競所引古辭云雉子高飛北黃鵠高飛巳千里雄來飛從雌視以為始作之辭然樂府之題亦如古詩題所謂關雎葛覃之類只取篇中一二字以命詩初無義也後人即物即事而賦故於題有義據此古詞無雉子班之語往往雉子之班作復在此古辭之前吳競未之見也如吳均可憐雉子班又後人所作也聖人出晉曰仲春振旅北齊曰受魏禪言文宣受禪應天順人後周曰禽明徹言高祖遣將克陳將吳明徹而俘之也臨髙臺晉曰夏苗田北齊曰服江南言梁主蕭繹來附化也逺如期亦曰逺期漢太樂食舉十三曲一曰鹿鳴二曰重來三曰初造四曰俠安五曰來歸六曰逺期七曰有所思八曰明星九曰淸涼十曰涉大海十一曰大置十二曰承元氣十三曰海淡淡魏時以逺期承元氣海淡淡三曲多不通利故省之及晉荀勗傅𤣥之流並為歌辭晉曰仲秋獮田北齊曰刑罰中言孝昭舉直措枉獄訟無怨也石流晋曰順天道北齊曰逺夷至言至海外西夷諸國遣使朝貢也務成晉曰唐堯北齊曰嘉瑞臻言聖王應期河清龍見符瑞總至也𤣥雲北齊曰成禮樂言功成化洽制禮作樂也黃爵行晉曰伯益釣竿篇伯常子避仇河濵為漁父其妻思之而為釣竿篇每至河側輒歌之後司馬相如作釣竿詩遂傳以為樂曲漢鞞舞歌五曲關中一作東有賢女魏曰明明魏皇帝晉曰洪業篇章和二年中漢章帝所造魏曰太和有聖帝晉曰天命篇樂久長魏曰魏厯長晉曰景皇篇四方皇魏曰天生蒸民晋曰大晉篇殿前生桂樹魏曰為君既不易晉曰明君篇拂舞歌五曲白鳩篇亦曰白鳬舞以其歌且舞也亦入清商曲濟濟篇獨祿篇李白作獨漉碣石篇晉樂奏魏武帝分為四篇一曰觀滄海二曰冬十月三曰土不同四曰龜雖壽淮南王篇舊說准南王安求仙遂與八公相攜而去其家臣小山之徒思戀不巳乃作是歌此則恢誕家為此說耳不然亦是後人附㑹也按拂舞五篇並晉人採集三國之前所作惟白鳬不用吳舊歌而更作之命以白鳩焉鼓角橫吹十五曲黃鵠一作鶴吟隴頭吟亦曰隴頭水望行人折楊栁關山月洛陽道長安道豪俠行亦曰俠客行梅花落胡笳曲紫騮馬驄馬復有驄馬驅非橫吹曲雨雪劉生古劔行洛陽公子行按此有十五曲後之角工所傳者只得梅花耳今太常所試樂工第三等五十曲抽試十五曲及鳴角人習到大梅花小梅花可汗曲是梅花又有小大之别也然角之制始於胡中國所用鼓角蓋習胡角而為也黃帝之說多是謬悠况鼓角與胡角聲類既同故其曲亦相參用而梅花之辭本於胡笳今人謂角鳴為邉聲初由邉徼所傳也關山月洛陽道長安道豪俠行梅花落紫騮馬驄馬八曲後代所加也胡角十曲黃鵠吟隴頭角吟亦曰隴頭水出關入關出塞入塞折楊栁黃覃子赤之楊望行人右胡角者本以應胡笳之聲後漸用之故橫吹有雙角即胡樂也漢博望侯張騫入西域傳其法惟得摩訶兜勒二曲是為胡曲之本摩訶兜勒皆胡語也協律校尉李延年因胡曲更新聲二十八解其法乘輿以為武樂後漢以給邉將魏晉以來二十八解不復具存但用十曲而巳鼓角之本出於胡角相和歌三十曲江南曲度關山亦曰度關曲長歌行薤露歌亦曰薤露行亦曰天地喪歌亦曰挽柩歌蒿里傳亦曰蒿里行亦曰泰山吟行雞鳴亦曰雞鳴髙樹巔對酒行烏生八九子平陵東陌上桑亦曰豔歌羅敷行亦曰日出東南隅行亦曰日出行亦曰採桑曲曹魏改曰望雲曲短歌行亦曰蝦鱔燕歌行秋胡行亦曰陌上桑亦曰採桑亦曰在昔苦寒行亦曰吁嗟董逃行塘上行亦曰塘上辛苦行善哉行亦曰日苦短東門行西門行煌煌京洛行豔歌何嘗行亦曰飛鶴行步出夏東門行亦曰隴西行野田黃雀行滿歌行櫂歌行鴈門太守行白頭吟氣出唱精列東光右漢舊歌也曰相和歌者並漢世街陌謳謠之辭絲竹更相和合執節者歌之按詩南陔之三笙以和鹿鳴之三雅由庚之三笙以和魚麗之三雅者相和歌之道也本一部魏明帝分為二部更遞夜宿始十七曲魏晉之世朱生善琵琶宋識善擊節列和善吹曲等復為十三曲自短歌行以下晉荀勗採撰舊詩施用以代漢魏故其數廣焉相和歌吟漢四曲大雅吟王昭君楚妃歎王子喬右張永元嘉技録四曲相和曲四絃一曲蜀國四絃右張永元嘉技録有四弦一曲相和歌平調七曲長歌行短歌行亦曰蝦䱉猛虎行君子行燕歌行從軍行鞠歌行右宋王僧䖍大明三年宴樂技録相和歌清調六曲三婦豔詩一曲附苦寒行豫章行董逃行相逢狹路閒行亦曰長安有狹斜行亦曰相逢行三婦豔詩亦曰大婦織綺羅中婦織流黃塘上行秋胡行右王僧䖍技録清調六曲也其三婦豔詩技録不載張氏云非管弦音聲所寄似是命笛理弦之餘相和歌瑟調三十八曲善哉行亦曰日苦短步出夏門行亦曰隴西行折楊栁西門行東門行東西門行却東西門行順東西門行飲馬長城窟行亦曰飲馬行上留田行新城安樂宫行婦病行孤子生行亦曰孤兒行亦曰放歌行大牆上蒿行野田黃雀行釣竿行臨髙臺行長安城西行武舍之中行鴈門太守行豔歌何嘗行亦曰飛鵠行豔歌福鍾行豔歌雙鴻行煌煌京洛行帝王所居行門有車馬客行牆上難為趨行日重光行月重輪行蜀道難櫂歌行有所思行蒲坂行採梨橘行白楊行胡無人行青龍行公無渡河行亦曰箜篌行右王僧䖍技録相和歌楚調十曲白頭吟行泰山吟行梁甫吟行東武吟亦曰東武琵琶吟行怨詩行亦曰怨歌行亦曰明月照髙樓長門怨亦曰阿嬌怨班婕妤亦曰婕妤怨娥眉怨玉階怨雜怨右王僧䖍技録五曲自長門怨以下五曲續附大田十五曲東門東門行西山折楊栁行羅敷豔歌羅敷行西門西門行默默折楊栁行園桃煌煌京洛行白鵠豔歌何嘗行碣石步出夏門行何嘗艷歌何嘗行置酒野田黃爵行為樂滿歌行夏門步出夏門行王者布大化櫂歌行洛陽令雁門太守行白頭吟白紵歌一曲古辭梁武改為子夜吳聲四時歌四曲共五曲白紵歌白紵歌有白紵舞白鳬歌有白鳬舞並吳人之歌舞也吳地出紵又江鄉水國自多鳬鶩故興其所見以寓意焉始則田野之作後乃大樂氏用焉其音入清商調故清商七曲有子夜者即白紵也在吳歌為白紵在雅歌為子夜梁武令沈約更制其辭焉右白紵與子夜一曲也在吳為白紵在晉為子夜故梁武夲白紵而為子夜四時歌後之為此歌者曰白紵則一曲曰子夜則四曲今取白紵於白紵取四時歌於子夜其實一也清商曲七曲附五十曲并實樂四十一曲除內七曲同實計八十四曲子夜亦曰子夜吳聲四時歌亦曰子夜吳歌子夜之音同於白紵皆清商調也故梁武夲白紵而為子夜吳聲四時歌明此子夜亦有晉聲者其實不離清商前溪晉車騎將軍沈玩所作舞曲烏夜啼宋臨川王義慶所作蓋詠其妾也石城樂宋臧質所作石城在景陵莫愁樂出於石城之作古又有莫愁洛陽女非此襄陽樂宋隨王誕始為襄陽郡元嘉末仍為雍州夜聞諸女歌謠因為之辭焉宋劉道彥為雍州有惠化百姓歌之謂之襄陽樂非此也王昭君亦曰王嬙亦曰王明君若以為延夀畫圖之說則委巷之談流入風騷人口中故供其賦詠至今不絶右按清商曲亦謂之清樂出於清商三調所謂平調清調瑟調是也三調者乃周房中樂之遺聲漢魏相繼至晉不絶永嘉之亂中朝舊曲散落江右而清商舊樂猶傳江左所謂梁宋新聲是也元魏孝文篡漢收其所獲南音謂之清商樂即此等是也隋平陳因置清商府傳採舊曲若巴渝白紵等曲皆在焉自此漸廣雖經喪亂至唐武后時猶存六十三曲其傳者有焉白雪楚曲也或云周曲唐顯慶三年十月太常寺奏按張華博物志云白雪是黃帝使素女鼓五十絃瑟曲名以其調髙人和遂寡自宋玉以來迄今千祀未有能歌白雪者臣今准敕依琴中舊曲定其宫商然後教習並合於歌輒以御製雪詩為白雪歌辭又樂府奏正曲之後皆有送聲君唱臣和事彰前史輒取侍中許敬宗等奏和雪詩十六首以為送聲各十六節上善之乃付太常編於樂府公莫舞即巾舞也巴渝夲舞名即鞞舞也明君明之君漢鞞舞曲梁武改其曲辭以歌君德鐸舞漢曲白鳩吳拂舞曲白紵吳舞子夜晉曲吳聲四時歌梁曲前溪晉曲阿子歌亦曰歡聞歌晉穆帝升平初童子輩或歌於道歌畢輒呼阿子汝聞否又呼歡聞否以為送聲後人演其聲為二曲宋齊間用莎乙子之語稍訛異也團扇郎懊憹憹亦作惱齊高帝謂之中朝歌長史變晉司徒左長史王廞臨敗所作丁督護亦曰丁都護亦曰督户歌讀曲烏夜啼宋臨川王義慶作客樂齊武帝所作也石城樂宋臧質作莫愁出於石城襄陽亦曰襄陽樂宋隨王誕作烏夜飛亦曰棲烏夜飛宋荆州刺史沈攸之所作楊叛兒亦曰西曲楊叛兒夲童謠也雅歌未詳所起驍壺投壺樂也隋煬帝所造以投壺有躍矢為驍壺今謂之驍壺是常林歡常林聚長林也今之荆門長林縣是也樂人誤以長為常此則梁宋間曲也宋代以荆雍為南方重鎮皆王子為之牧江左辭詠莫不稱之以為樂土故宋隨王誕作襄陽樂齊武追憶樊鄧作佑客樂是也三洲商人之歌也採桑度三洲曲所出也與羅敷秋胡行所謂採桑者異矣玉樹後庭花堂堂陳後主所作者唐髙宗朝常歌之泛龍舟隋煬帝幸江都宫作春江花月夜隋煬帝所作右三十三曲明之君雅歌各二首四時歌四首凡三十八曲又有四曲上林鳳雛平折命嘯其聲與辭皆訛失又有三曲曰平調清調瑟調有聲無辭又蔡雍云清商曲其詩不足採有出郭西門陸地行車俠鐘朱堂寢奉法五曲往往在漢時所謂清商者但尚其音爾晉宋間始尚辭觀吳競所纂七曲皆晉宋間曲也故知梁宋新聲有自來矣因隋文帝篤好清樂以為華夏正聲故特盛於隋焉大業中煬帝乃定清樂西凉龜兹天竺康國疏勒安國髙麗禮畢以為九部西凉五曲楊澤新聲豐神白馬闐永世樂萬世解于佛舞龜兹萬嵗樂藏鉤樂七夕相逢樂席玉女行觴泛神仙留客雞擲磚續命草投壺樂舞同心髻龍舟鬪子鬪百解善善伽還舊宫小長樂花聖十二時曲勒摩尼婆兒舞天舞明樂疏鹽天竺二曲沙石彊歌天曲樂舞康國四曲戢殿農和正歌扳末奚波地舞曲前地舞曲舞惠地曲疏勒三曲兀利死遜歌解逺服舞監曲安國三曲附薩單時歌末居和祇解奚舞髙麗二曲芝栖歌芝栖舞禮畢二曲單交路行散花舞禮畢者九部樂終則陳之唐髙祖即位仍隋制亦設九部樂曰燕樂伎曰清商伎曰西涼伎曰天竺伎曰髙麗伎曰龜兹伎曰安國伎曰疏勒伎曰康國伎其實皆主於清商焉琴操五十七曲九引六十二操三十雜曲思歸引亦曰離拘操舊說衛賢女之所作也但有聲至晉石崇始作辭但述其思歸河陽所居而巳劉孝威胡地憑良馬亦只言思歸之狀走馬引樗里牧恭所作也又張敞為京兆尹無威儀時罷朝㑹走馬章臺街時人鄙笑之有毆君馬者路傍兒之語故張率詩曰吾畏路傍兒霹靂引亦曰吟白虎亦曰舞𤣥鶴楚商梁所作商梁出遊九臯之澤遇風靁霹靂懼而歸作此引又晉平公召師矌援琴而鼓清徵一奏有𤣥鶴二八來集再奏而列三奏延頸而鳴舒翼而舞所謂舞𤣥鶴者蓋本於此往往其音不殊故合為一不然則夲舞𤣥鶴之聲而為霹靂引列女引亦曰操楚樊姬作也伯妃引魯伯妃作琴引秦時屠髙門作楚引亦曰龍丘引楚龍丘子髙引貞女引魯女所作箜篌引亦曰公無渡河亦曰箜篌謡朝鮮津卒霍里子髙妻麗玉所作麗玉以其聲傳鄰女麗容名曰箜篌引舊史稱漢武帝滅南粵祠太一后土令樂人侯暉依琴造坎侯坎者聲也侯者工人姓也後語坎訛為空然以臣所見今大樂有箜篌器何得如此說右九引將歸操世言孔子作猗蘭操亦曰幽蘭操世言孔子作今此操只言猗蘭蓋省辭也龜山操世言孔子作越裳操世言周公作拘幽操世言文王拘於羑里而作岐山操世言周公為大王作述古豳公之績患時黯武也或云周人為文王所作履霜操世言尹吉甫子伯竒作雉朝飛操世言齊宣王時處士犢牧子作魏武帝有宫人盧女者隂叔之妹七嵗入漢宫學鼓琴琴特鳴異為新聲能傳此曲至魏明帝崩出降為尹更生妻故得此聲不絶按揚雄琴清英曰雉朝飛操者衛女傳母之所作也據雄所記大槩與思歸操之言相類恐是訛易别鶴操商陵牧子作此曲或云其時亦冇雙鶴悲鳴故因以命操殘形操世言曽子夢一狸不見其首以為不祥而作此曲水仙操世言伯牙所作懷陵操世言伯牙所作右十二操韓愈取十操以為文王周公孔子曾子伯竒犢牧子所作則聖賢之事也故取之水仙懷陵二操皆伯牙所作則工技之為也故削之嗚呼尋聲狥迹不識其所由者如此九流之學皆有義所述者無非聖賢之事然而君子不取焉者為多誣言飾事以實其意所貴乎儒者為能通今古審是非胸中了然異端邪說無得而惑也退之平日所以自待為如何所以作十操以貽訓後世者為如何臣有以知其為邪說異端所襲愚師瞽史所移也琴操所言者何嘗有是事琴之始也有聲無辭但善音之人欲寫其幽懷隱思而無所憑依故取古之人悲憂不遇之事而以命操或有其人而無其事或有其事又非其人或得古人之影響又從而滋蔓之君子之所取者但取其聲而巳取其聲之義而非取其事之義君子之於世多不遇小人之於世多得志故君子之於琴瑟取其聲而寫所寓焉豈尚於事辭哉若以事辭為尚則自有六經聖人所說之言而何取於工伎所志之事哉琴工之為是說者亦不敢鑿空以厚誣於人但借古人姓名而引其所寓耳何獨琴哉百家九流皆有如此惟儒家開大道紀實事為天下後世所取正也蓋百家九流之書皆載理無所繫著則取古之聖賢之名而以巳意納之於其事之域也且以卜筮家論之最與此相近也如以文王拘羑里而得明夷文王拘羑里或有之何嘗有明夷乎又何嘗有箕子遇害之事乎孔子問伯牛而得益孔子問伯牛實有之何嘗有益乎又何嘗有過其祖之語乎琴操之所紀者皆此類也又如稗官之流其理只在唇舌間而其事亦有紀載虞舜之父杞梁之妻於經傳所言者數十言耳彼則演成萬千言東方朔三山之求諸葛亮九曲之勢於史籍無其事彼則肆為出入琴操之所紀者又此類也顧彼亦豈欲為此誣罔之事乎正為彼之意向如此不得不如此不說無以暢其胸中也又如兔園之學其來巳久其所言者無非周孔之事而不得為正學不為學者所取信者以意卑淺而言陋俗也今觀琴曲之言正兔園之流也但其遺聲流雅不與他樂並肩故君子所尚焉或曰退之之意不為其事而作也為時事而作也曰如此所言則白樂天之諷諭是矣若懲古事以為言則隋堤栁可以戒亡國若指今事以為言則井底引銀瓶可以止淫奔何必取異端邪說街談巷語以寓其意乎同是誕言同是飾說伯牙何誅焉臣今論此非好攻古人也正欲憑此開學者見識之門使是非不雜揉其間故所得則精所見則明無古無今無愚無智無是無非無彼無巳無異無同概之以正道爍爍乎如太陽正照妖氛邪氣不可干也河間雜弄二十一章蔡氏五弄雙鳳雜鸞歸風送逺幽蘭白雪太常丞吕才以唐髙宗雪詩為白雪歌被之以琴長清短清長側短側清調大遊小遊明君胡笳白魚歎廣陵散嵇康死後此曲遂絶往往後人夲舊名而别出新聲也楚妃歎風入松烏夜啼楚明光石上流泉臨汝侯子安之流漸涸雙燕離陽春弄悅人弄連珠弄甲揮清暢志清蟹行清看客清便僻清婉轉清右三十六雜曲遺聲序論遺聲者逸詩之流也今以義類相從分二十五正門二十附門總四百十八曲無非雅言幽思當採其目以俟可考今採其詩以入系聲樂府古調二十四曲古辭十九曲無名氏擬行行重行行陸機古意李白淫思古意顔竣古樂府權德輿征戍十五曲將帥校獵城塞戎行曲逺征人南征曲老將行將軍行霍將軍行司馬將軍歌長城築城古築城曲塞上曲塞下曲古塞曲邉思校獵曲游俠二十一曲遊俠篇俠客行博陵王宫俠曲臨江王節士歌少年子少年行刺少年邯鄲少年行長安少年行羽林郎輕薄篇劔客結客結客少年場沐浴子結襪子結援子壯士吟公子行燉煌子扶風豪士歌行樂十八曲遊子移遊子吟嘉遊亦曰喜春遊王孫遊棗下何纂纂㩦手曲樂未央永明樂今樂歌吾生作宴樂今日樂相樂苦樂相倚曲唐元稹作合歡詩晉陽方作定情篇漢繁欽作還臺樂河曲遊行幸甘泉宫中行樂佳麗四十七曲女功貞節才慧美女篇亦曰齊瑟行亦曰齊吟美人織女辭錦石搗流黃丹陽孟珠歌錢塘蘇小小歌孫綽情人碧玉歌中山王孺子妾歌吳王夫差女紫玉歌董嬌嬈烏孫公主情人桃葉歌亦曰千金意桃葉者王獻之妾名緑於篤愛所以作歌或云童謡李夫人漢武帝喪李夫人今寫真甘泉殿又令方士合靈藥曰反魂香以降夫人之魂髣佛其狀背燈隔帳不得語楚妃吟楚妃歎楚明妃曲杜秋娘金陵女年十五為李錡妾錡叛滅籍之入宫有寵於景陵穆宗立命為皇子傅母皇子封漳王鄭注事被罪放還故鄉其辭云勸君莫惜金縷衣勸君須惜少年時花開堪折直須折莫待無花空折枝女秋蘭木蘭辭昭君歎劉勳妻焦仲卿妻杞梁妻歌杞殖妻之妹朝日所作湘夫人亦曰湘君亦曰湘妃未央才人歌邯鄲才人嫁為厮卒婦愛妾換馬胡姬年十五黃門倡舞媚娘舞亦作武唐則天朝常歌此田五媚娘妾薄命亦曰惟日月妾安所居皚如山上雪燕美人映水曲蠶絲歌貞女孀婦吟麗人行上陽白髮人唐天寶五載巳後楊貴妃專寵後宫人稀復進幸矣六宫有美色者輒置别所上陽是其一也貞元中尚存焉繚綾時世粧王家少婦委舊命秦王卷衣靜女辭别離十九曲迎客生别離離歌長别離河梁别春别曲自君之出矣送歸曲思歸篇送逺曲母别子寄衣曲迎客曲送客曲逺别離久别離古離别怨别離怨一作雜怨井底引銀瓶怨思二十五曲傷歌行怨辭青樓怨春女怨秋閨怨閨怨寒夜怨征婦怨綵書怨鳯樓怨緑墀怨四愁七哀長相思憂且吟獨處愁思公子思君去時行洛陽夫七思詩湘妃怨娼樓怨西宫秋怨西宫春怨遺所思獨不見歌舞二十一曲技能浩歌行緩歌行前緩聲歌㑹吟行同聲歌勞歌悲歌行上聲歌此因上聲促柱得名或用一調或用無調名如古歌辭所謂哀思之音不合中和梁武因之改辭無復雅句大埀手舞而垂手也小垂手獨搖手亦然小埀手鈞天曲豔歌行古辭有翩翩堂前燕冬藏夏來見言兄弟流宕他之或言魏武始作童謠入朝曲清歌發獨舞調嘯辭急聲也至今猶存正古樂三臺辭舞辭也今猶存齊謳行吳趨曲齊謳者齊人之歌吳趨者吳人之舞故陸機所引牛山陸厥所言稷下皆齊地閶門乃吳門闔閭所行亦名破楚門千載而下欲為齊謳者必夲齊音欲為吳趨者必夲吳調絲竹十一曲挾琴歌相如琴薄暮動絃歌鼓瑟有所思趙琴秦箏龍笛曲短簫鳳笙華原磬唐天寶中始廢泗濵磬用華原石代之詢諸磬人則曰故老云泗濱磬石調之不能和得華原石考之乃和由是不改五絃彈觴酌七曲羽觴飛上苑前有一樽酒城南隅燕當置酒當壚獨酌謠山人勸酒宫苑十九曲樓臺門闕魏宫辭玉華宫長信宫連昌宫楚宫行雍臺凌雲臺新成長樂宫登樓曲青樓曲建興苑芳林篇上林閶闔篇駕言出北闕坐玉堂內殿賦新詩西園逰上才春宫曲都邑三十四曲名都篇亦曰齊瑟行京兆歌左馮翊歌扶風歌荆州樂燉煌樂凉州之地也青陽樂今青州潯陽樂今江州壽陽樂南平穆王為荆河州作涼州樂今屬西夏按今之樂有伊州涼州甘州渭州之類皆西地也又按隋煬帝所定九部夷樂西涼龜兹天竺康居之類皆西夷也觀詩之雅頌亦自西周始凡是清歌妙舞未有不從西出者八音之音以金為主五方之樂惟西是承雖曰人為亦莫非禀五行之精氣而然邯鄲歌今趙州長平行秦白起所坑趙降兵處故絳行晉雖遷新田以舊地為故絳西長安行臨碣石平州之地臨北海禹所導河從此入海故曰碣石送反潮白銅鞮歌亦曰襄陽踏銅鞮南郡歌今南陽也荆州歌今荆南府陳歌吳歌鄴都引蔡歌行越城曲越謠孟門行燕支行汾隂行新昌里洛陽陌大堤曲出自薊北門行江南行江南思長千行道路六曲隂山道太行路行路難變行路難沙路曲沙隄行時景二十五曲陽春歌楚曲青陽歌春日行秋風辭北風行苦熱行秋歌朝歌晨風歌朝來曲夜夜曲夜坐吟遙夜吟春旦有所思𤣥雲朝雲雷歌驚雷歌雪歌胥臺露白日歌明月篇明月子日出行日與月人生四曲百年歌陸機作十年為一章共十章言句泛濫無可採人生老年行老詩人物九曲大禹成連湘東王祖龍行百里奚項王亦曰蓋世楚王曲安定侯曲李延年曲歌神仙二十二曲隱逸漁父步虛詞神仙篇外仙篇升仙歌升天行仙人篇遊仙篇仙人覽六著篇海漫漫桃源行上雲樂亦曰洛濱曲武溪深行一曰武陵深行招隱夲楚辭漢淮南王安小山所作言山中不可久留或言即安所作也後人改為五言若晉左思杖䇿招隱數篇是也晉王康琚又作反招隱舊說淮南書有小山亦有大山亦猶詩有小雅有大雅反招隱四皓蕭史曲方諸曲王喬歌元丹丘歌紫溪翁歌序云紫溪翁過甪里先生舉酒相屬醉而歌漁父歸去來引梵竺四曲舍利弗法壽樂阿那瓌摩多樓子蕃胡四曲于闐採花高句麗紀遼東隋煬帝為遼東之役而作是詩出蕃曲山水二十四曲登臨泛渡桐柏山山在唐州桐柏縣准水發源之處華陰山在華州西嶽巴東三峽歌淫豫歌亦曰灔豫歌其辭云淫豫大如幞瞿唐不可觸金沙浮轉多桂浦忌經過此舟人商客刺水行舟之歌亦非簡文所作也蜀江有瞿唐之患桂江有桂浦之難故過瞿唐者則準灔豫涉桂浦者則凖金沙又有灔豫如馬瞿唐莫下灔豫如象瞿唐莫上之語是單言瞿唐也河中之水歌曲池之水歌東海小臨海歌江上曲江臯曲方塘含白水歌日暮望涇水曲江登山曲巫山中流曲濟黃河渡易水曲桂楫泛河中登名山行昆明春水滿此唐貞元中作也自唐後不都長安昆明池遂為民田矣半路溪泛水曲幽澗泉草木二十一曲採種花菜赤白桃李花亦曰桃李唐高祖時歌秋蘭篇芙蓉花採蓮曲採菱曲採菊茱萸篇蒲生歌城上麻夾樹夾樹有緑竹緑竹樹中草冉冉孤生竹取古詩弟一句作題按何偃作此詩所言者㛰姻之事楊花曲桃花曲隋堤栁種葛江蘺生幽渚浮萍篇桑條太史迦葉志忠上桑條歌十二篇言韋后當受命車馬六曲蟲豸車遙遙篇髙軒過白馬篇亦曰齊瑟行驅車天馬歌八駿圖魚龍六曲尺蠖應龍篇飛龍篇飛龍引枯魚捕蝗鳥獸二十一曲白虎行鳥栖曲東飛伯勞歌擬東飛伯勞雙燕燕燕于飛澤雉滄海雀空城雀雀乳空井中鬬雞晨雞髙樹鳴鴛鴦鳴雁行鴻雁生塞北行黃鸝飛上苑飛來雙白鶴雙翼隻翼鳯凰曲秦吉了雜體六曲隱語雜曲五雜爼曲寓言雜體藁砧亦曰藁砧今何在兩頭纎纎祀饗正聲序論仲尼所以為樂者在詩而巳漢儒不知聲歌之所在而以義理求詩别撰樂詩以合樂殊不知樂以詩為夲詩以雅頌為正仲尼識雅頌之㫖然後取三百篇以正樂樂為聲也不為義也漢儒謂雅樂之聲世在太樂樂工能紀其鏗鏘鼓舞而不能言其義以臣所見正不然有聲斯有義與其逹義不逹聲無寧逹聲不逹義若為樂工者不識鏗鏘鼓舞但能言其義可乎談河安能止渴畫餅豈可充飢無用之言聖人所不取或曰郊祀大事也神事也燕饗常事也人事也舊樂章莫不先郊祀而後燕饗今所采樂府反以郊祀為後何也曰積風而雅積雅而頌猶積小而大積卑而髙也所積之序如此史家編次失古意矣安得不為之釐正乎漢武帝郊祀之歌十九章練時日一帝臨二青陽三朱明四西皓五𤣥冥六惟泰元七天地八日出入九天馬十天門十一景星十二齊房十三皇后十四華燁燁十五五神十六朝隴首十七象載瑜十八赤蛟十九班固東都五詩明堂辟雍靈臺寶鼎白雉臣謹按古詩風雅皆無序惟頌有序者以風雅者所采之詩也不得其始兼所用之時隨其事宜亦無定著或於一篇之中但取一二句以見意而巳不必序也頌者係乎所作而獨用之廟樂不可用於郊天柴望不可用於講武所以蔡雍獨斷惟載頌序以為祀典而風雅夲無序也自齊魯韓毛四家之說起各為風雅之序度其初意只欲放頌詩之序而為之其實不知風雅無用於序有序適足以惑頌聲也今觀漢武十九章郊祀歌即詩可見者則無序非憑詩可見者必言所作之始可謂得古頌詩之意矣風雅之詩皆不得其始其間有得於甘棠之美召伯常棣之思周公豈無一二以用之不繫於其始不必序也樂府之詩亦皆不得其始其間有得於採桑之女子渡河之狂夫豈無一二亦以用之不繫於其始不必序焉觀誦詩與郊祀之詩皆言所作之始風雅詩與樂府所採之詩不言其始之作則可以知漢人之迹近於三代故詩章相襲自然相應如此後之人則逺矣按郊祀十九章皆因一時之盛事為可歌也而作是詩各有其名然後隨其所用故其詩可采魏晉則不然但即事而歌如夕牲之時則有夕牲歌降神之時則有降神歌既無偉績之可陳又無題命之可紀故其詩不可得而採如隋廟立舞酌獻登歌各逐時代而匪流通亦不可得而援也惟梁武帝夲周九夏之名以作十二雅庶可僃編采之後梁武帝雅樂十二曲俊雅皇雅𦙍雅寅雅介雅需雅雍雅滌雅牷雅諴雅獻雅禋雅有宗廟之樂有天地之樂有君臣之樂尊親異制不可以不分幽明異位不可以無别按漢叔孫通始定廟樂有降神納俎登歌薦祼等曲武帝始定郊祀之樂有十九章之歌明帝始定黃門鼓吹之樂天子所以宴羣臣也嗚呼風雅三者不同聲天地宗廟君臣三者不同禮自漢之失合雅而風合頌而雅其樂巳失而其禮猶存至梁武十二曲成則郊廟明堂三朝之禮展轉用之天地宗廟君臣之事同其事矣此禮之所以亡也雖曰夲周九夏而為十二雅然九夏自是樂奏亦如九淵九莖可以播之絲竹有譜無辭而非雅頌之流也唐雅樂十二和曲豫和順和永和肅和雍和壽和太和舒和昭和休和正和承和祖孝孫夲梁十二雅以作十二和故可采也周太祖迎魏帝入關平荆州大獲梁氏之樂乃更為九夏之奏皇帝出入奏皇夏賓出入奏昭夏蕃國客出入奏納夏有功臣出入奏章夏皇后進羞奏齊夏宗室㑹聚奏族夏上酒宴樂奏陔夏諸侯相見奏驁夏雖曰夲於成周賓祭之樂抑亦取於梁氏十二雅有其議而未能行後復變更大抵自兩朝以來祀饗之章隨時改易任理不任音任情不任樂明樂之人不能主樂主樂之司未必明樂所行非所作所作非所行惟梁武帝自曉音律又詔百司各陳所聞帝自紏擲前違裁成十二雅付之大樂自此始定雖制作非古而音聲有倫準十二律以法天之成數故世世因之而不能易也祀饗别聲序論正聲者常祀饗之樂也别聲者非常祀饗之樂也出於一時之事為可歌也故僃於正聲之後漢三侯之章大風歌亦曰風起之詩右髙祖既定天下過沛與故人父老飲極歡哀之情而作是詩令沛中童兒百二十人習而歌之至孝惠時以沛宫為原廟令歌兒習吹以相和得以四時歌舞於廟常以百二十人為之文景之間禮官亦肄業漢房中祠樂十七章房中樂夲周樂秦改曰壽人漢惠改曰安世樂右房中樂者婦人禱祠於房中也故宫中用之漢房中祠樂乃髙祖唐山犬人所作也髙祖好楚聲故房中樂楚聲也孝惠二年使樂府令夏侯寬備其簫管更名曰安世樂隋房內曲二首地厚天髙右髙祖龍潜時頗好音樂常倚琵琶作歌二首名曰地厚天髙託言夫婦之義因即取之為皇后房內曲命婦人并登歌上壽並用之梁武帝述佛法十曲善哉大樂大歡天道仙道神王龍王滅過惡除愛水斷苦轉陳後主四曲黃鸝留玉樹後庭花金叉兩臂埀或言隋煬帝作堂堂北齊後主二曲無愁伴侣唐七朝五十五曲舞曲夷樂並不在此傾杯曲樂社樂曲英雄樂曲黃驄疊曲右四曲太宗因內宴詔無忌等作之皆宫調也景雲河清歌慶善樂破陳樂承天樂一戎大定樂八紘同軌樂夷美賓曲右七曲髙宗朝所作也立部伎八曲一安舞二太平樂三破陳樂四慶善樂五大定樂六上元樂七聖壽樂人光聖樂坐部伎六曲一燕樂二長壽樂三天授樂四鳥歌萬嵗樂五龍池樂六小破陳樂夜半樂還京樂文成曲霓裳羽衣曲𤣥真道曲大羅天曲紫清上聖道曲景雲九真紫極小長壽承天樂順天樂君臣相遇樂曲荔枝香梨園法曲凉州伊州甘州千秋節右三十四曲並明皇朝所作也寶應長寧樂廣平太一樂右二曲代宗朝所作也定難曲中和樂繼天誕聖樂孫武順聖樂右四曲德宗朝所作也雲韶法曲霓裳羽衣舞曲右二曲文宗詔太常卿馮定采開元雅樂作也臣下功髙者賜之樂又改法曲為仙韶曲萬斯年曲右一曲武宗朝李德裕命樂工作萬斯年以獻播皇猷曲右一曲宣宗每宴羣臣僃百戲帝自製新曲故有播皇猷之作文武舞序論古有六舞後世所用者韶武二舞而巳後世之舞亦隨代皆有制作每室各有形容然究其所常用及其制作之宜不離是文武二舞也臣疑三代之前雖有六舞之名往往其事所用者亦無非是文武二舞故孔子謂韶盡美矣又盡善也武盡美矣未盡善也不及其他誠以舞者聲音之形容也形容之所感發惟二端而已自古制治不同而治具亦不離文武之事也然雲門大咸大韶大夏大濩大武凡六舞之名南陔白華華黍崇丘由庚由儀凡六笙之名當時皆無辭故簡籍不傳惟師工以譜奏相授耳古之樂惟歌詩則有辭笙舞皆無辭故大武之舞秦始皇改曰五行之舞大韶之舞漢髙帝改曰文始之舞魏文帝復文始曰大韶舞五行舞曰大武舞並有譜無辭雖東平王蒼有武德舞之歌未必用之大抵漢魏之世舞詩無聞至晉武帝泰始九年荀朂曾典樂更文舞曰正德武舞曰大豫使郭夏宋識為其舞節而張華為之樂章自此以來舞始有辭舞而有辭失古道矣文武舞二十曲晉文舞曰正德舞武舞曰大豫舞宋文舞曰前舞武舞曰後舞梁武舞曰大壯舞文舞曰大觀舞隋文舞武舞唐文舞曰治康舞武舞曰凱安舞唐三大舞七德舞九功舞上元舞右三大舞唐之盛樂也然後世所行者亦惟二舞而巳神功破陳樂有武事之象功成慶善樂有文事之象五代因之晉用九功舞改曰觀象舞用七德舞改曰講功舞周用觀象改為崇德舞用講功改為象成舞按唐人降神用文舞送神用武舞其餘即奏十二和之樂每室酌獻一曲則别立舞名至今不替焉然每室之舞蓋夲於梁自梁以來紛然出於私意莫得而紀古樂苑衍録卷一
