body:
  text: 古樂苑卷七明梅鼎祚編燕射歌辭二梁北齊北周隋梁三朝雅樂歌俊雅三曲四言衆官出入奏隋書樂志曰宋元徽三年儀注奏肅咸樂齊及梁初亦同至是改為俊雅取禮記王制云司徒選士之秀者升之學曰俊士也二郊太廟明堂三朝同用焉沈約下同設官分職髦俊攸俟髦俊伊何貴德尚齒唐乂咸事周寧多士區區衛國猶賴君子漢之得人帝猷乃理開我八襲闢我九重珩珮流響纓紱有容衮衣前邁列辟雲從義兼東序事美西雍分階等肅異列齊恭重列北上分庭異陛百司揚職九賔相禮齊宋舅甥魯衛兄弟思皇藹藹羣龍濟濟我有嘉賔實惟愷悌𦙍雅一曲四言皇太子出入奏隋書樂志曰𦙍雅取詩君子萬年永錫祚𦙍也三朝用之皇昔殷代哲王迭有降及周成惟器是守上天乃眷大梁既受灼灼重明仰承元首體乾作二命服斯九置保置師居前居後前星比耀克隆萬夀寅雅一曲三言王公出入奏隋書樂志曰寅雅取尚書周官云二公𢎞化寅亮天地也三朝用之禮莫違樂具舉延藩辟朝帝所執桓蒲列齊莒垂衮毳紛容與升有儀降有序齊簮紱忘笑語始矜嚴終酣醑介雅三曲五言上夀酒奏隋書樂志曰介雅取詩大雅云君子萬年介爾景福也三朝用之百福四象初萬夀三元始拜獻惟衮職同心協卿士北極永無窮南山何足擬夀隨百禮洽慶與三朝升惟皇集繁祉景福互相仍申錫永無遺穰簡必來應百味既含馨六飲莫能尚玉罍信湛湛金巵頗搖漾敬舉發天和祥祉流嘉貺需雅八曲七言食舉奏隋書樂志曰需雅取易象曰雲上於天需君子以飲食宴樂也三朝用之實體平心待和味庶羞百品多為貴或鼎或鼒宣九沸楚桂胡鹽芼芳卉加籩列俎雕且蔚五味九變兼六和令芳甘㫖庶且多三危之露九期禾圎按方丈粲星羅皇舉斯樂同山河九州上腴非一族𤣥芝碧樹夀華木終朝采之不盈掬用拂腥羶和九穀既甘且飫致遐福人欲所大味為先興和盡敬咸在旃碧鱗朱尾獻嘉鮮紅毛緑翼墜輕翾臣拜稽首萬斯年擊鐘以俟惟大國况乃御天流至德侑食斯舉揚盛則其禮不愆儀不忒風猷所被深且塞膳夫奉職獻芳滋不麛不夭咸以時調甘適苦别澠淄其德不爽受福釐於焉逸豫永無期備味斯饗惟至聖咸降人神禮為盛或風或雅流歌詠負鼎言歸啓殷命悠悠四海同兹慶道我六穗羅八珍洪鼎自爨匪勞薪荆包海物必來陳滑甘􅎵瀡味和神以斯至德被無垠雍雅三曲四言撤饌奏隋書樂志曰雍雅取禮記仲尼燕居云大饗客出以雍撤也三朝用之明明在上其儀有序終事靡愆收鉶撤俎乃升乃降和樂備舉天德莫違人謀是與敬行禮達兹焉宴語我餕惟阜我肴孔庶嘉味既充食㫖斯飫屬厭無爽沖和在御擊壤齊歡懷生等豫蒸庶乃粒實由仁恕百司警列皇在在陛既飫且醑卒食成禮其容穆穆其儀濟濟凡百庶僚莫不愷悌奄有萬國抑由天啓同前說見梁雅樂歌注俊雅三曲蕭子雲下同惟王建國辨方正位於赫有梁向明而治知人則哲聰明文思思皇多士俊乂咸事弗惟其官惟人乃備訓迪庶工位以德序恭已而治垂旒當寧或以言揚或以事舉春朝秋覲圭幣惟旅翼翼酆郇峨峨齊楚客入金奏賔至縣興威儀有則是降是升百辟卿士元首是承左右秩秩終敬且矜彛倫攸序王猷以凝𦙍雅一曲天下為家大梁受命眷求一德惟烈無競儀刑哲王元良誕慶灼灼明兩作離承聖英華外發溫文成性立師立保左右惟政休有烈光前星比盛求一作永寅雅一曲車同軌行同倫來萬國相九賔延羣后朝藎臣禮時行樂日新摐夷則奏雅寅衮衣曜玉帛陳儀抑抑皇恂恂介雅三曲明君創洪業大同登頌聲開元洽百禮來儀奏九成申錫南山祚赫赫復明明三朝禮樂和百福隨春酒玉樽湛而獻聰明作元后安樂享延年無疆臣拜手四氣新元旦萬夀初今朝趨拜齊衮玉鐘石變簫韶日升等皇運洪基邈且遙需雅八曲農用八政食為元播時百穀民所天禘嘗郊社盡潔䖍宴饗饋食禮節宣九功惟序登頌絃感物而動物靡遂太羮不和有遺味非極口腹而行氣節之民心殺攸貴寧為禮本饔與餼始諸飲食物之初設卦觀象受之需蒸民乃粒有牲芻自衛反魯刪詩書弋不射宿殺已袪在昔哲王觀民志庶羞百品因時備為善不同同歸治蔬膳菲食化始至率物以躬行尊位雅有泂酌風采蘋蕰藻之菜非八珍澗溪沼沚貴先民明信之德感人神譬諸禴祭在西鄰行葦之微猶勿踐寧惟血氣無身剪聖人之心微而顯千里之應出言善况遂豚魚革前典春酸夏苦冬有宜筐筥錡釜備糗馳逡巡揖讓詔司儀卑髙制節明等差君臣之序正在斯日月光華風四塞規饗有序儀不忒匪天私梁乃佑德光被四表自南北長世綴旒為下國雍雅三曲穆穆天子時惟聖敬濟濟羣公恭為德柄為撤有典膳夫是命禮行禘嘗義光朝聘神饗其德民洽其慶尚有和羮既戒且平亦有其餕亦惟克明其餕惟旅其􅀈惟成百禮斯洽三宥已行明哉元首遹駿其聲戒食有章卒食惟序庭鳴金奏凱收籩筥客出以雍撤以振羽離磬乃作和鐘備舉濟濟威儀喤喤簨簴北齊元㑹大饗歌隋書樂志曰北齊元㑹大饗協律不得升陛黃門舉麾於殿上肆夏賔入門四箱奏昊蒼眷命興王統天業髙帝始道邈皇先禮成化穆樂合風宣賔朝荒夏揚對穹𤣥揚對一作對揚皇夏皇帝出閣奏夏正肇旦周物充庭具僚在位俯伏無聲大君穆穆宸儀動睟日煦天回萬靈胥萃皇夏皇帝當扆羣臣奉賀奏天子南靣乾覆離明三千咸列萬國填并猶從禹㑹如次湯庭奉兹一德上下和平皇夏皇帝入寧變服黃鍾太簇二箱奏我應天厯四海為家協同內外混一戎華鶴蓋龍馬風垂雲車夏章夷服其㑹如麻九賔有儀八音有節肅肅於位飲和在列四序氤氲三光昭晣君哉大矣軒唐比轍皇夏皇帝變服移幄坐於西箱帝出升御坐姑洗箱奏皇運應籙廓定區㝢受終以文構業以武堯昔命舜舜亦命禹大人馭歷重規沓矩欽明在上昭納八夤從靈體極誕聖窮神化生羣品陶育蒸人展禮肆樂協此元春肆夏王公奠璧奏萬方咸暨三揖以申垂旒馮玉五瑞交陳拜稽有章升降有節聖皇負扆虞唐比烈上夀曲上夀黃鍾箱奏仰三光奏萬夀人皇御六氣天地同長久登歌皇太子入至坐位酒至御殿上奏三曲大齊統厯道化光明馬圖呈寶龜籙告靈百蠻非衆八荒非逖同作堯人俱包禹迹天覆地載成以四時惟皇是則比大於兹羣星拱極衆川赴海萬㝢駿奔一朝咸在齊之以禮相趨帝庭應規蹈矩玊色金聲動之以樂和風四布龍申鳳舉鸞歌麟步食舉樂食至御前奏十曲三端正啓萬方觀禮具物充庭二儀合體百華照曉千門洞晨或華或裔奉贄惟新悠悠亘六合圓首莫不臣仰施如雨晞和猶日風化表笙鏞歌謳被琴瑟誰言文軌異今朝混為一彤庭爛景丹陛流光懷黃綰白鵷鷺成行文贊百揆武鎮四方折衝鼓雷電獻替協隂陽大矣哉道邁上皇陋五帝狹三皇窮禮物該樂章序冠帶垂衣裳天壤和家國穆悠悠萬類咸孕育契冥化侔大造靈效珍神歸寶興雲氣飛龍蒼麟一角鳳五光朱雀降黃玉表九尾馴三足擾化之定至矣哉瑞感德四方來囹圄空水火菽粟求賢振滯棄珠玉衣不靡宮以卑當陽端默垂拱無為云云萬有其樂不訾嗟此舉時逢至道肖形咸自持賦命無傷天行氣進皇輿遊龍服帝皂聖主寧區宇乾坤永相保牧野征鳴條戰大齊家萬國拱揖應終禪奧主廓清都大君臨赤縣髙居深視當扆正殿旦暮之期今一見兩儀分牧以君陶有象化無垠大齊德邈誰羣超鳳火冠龍雲露以潔風以薰榮光至氣氤氲神化逺人靈協寒暑調風雨燮披泥檢受圖諜圖諜啓期運昌分四序綴三光延寶祚眇無疆惟皇道升平日河水清海不溢雲干吕風入律驅黔首入仁夀與天髙並地厚刑以厝頌聲揚皇情邈眷汾襄岱山髙配林壯亭亭聳云云望斾葳蕤駕騤騤刋金闕奠玉龜皇夏皇帝入鐘鼓奏禮終三爵樂奏九成允也天子穹壤和平載色載笑反寢宴息一人有祉百神奉職周五聲調曲序曰元正饗㑹大禮賔至食舉稱觴薦玉六律既從八風斯暢以歌大業以舞成功宫調曲五首庾信下同氣離清濁割元開天地分三才初辨正六位始成文繼天爰立長安民乃樹君其明廣如日其澤厚如雲惟昔我文祖撥亂拒謳歌三分未撫運八百不陵河禮敷天下信樂正神人和風塵行息警江海欲無波我皇承下武革命在君臨膺圖當舜玉嗣德受堯琴沈首多推運陽城有讓心就日先知逺觀淵早見深𤣥精實委御蒼正乃皆平履端朝萬國年祥慶百靈玉帛咸觀禮華戎各在庭鳳響中夷則天文正玉衡皇基自天保萬物乃由庚祥一作期握衡平地紀觀象正天樞祺祥鍾赤縣靈瑞炳皇都更受昭華玊還披蘭葉圖金波來白兔弱水下蒼烏玉斗調元協金沙富國租青丘還擾圃丹穴更巢梧安樂新咸慶長生百福符明明九族序穆穆四門賔隂陵朝北附蟠木引東臣澗途求板築溪源取釣綸多士歸賢戚維城屬茂親貴位連南斗髙榮據北辰迎時乃推策司職且班神日月之所照霜露之所均永從文軌一長無外戶人鬱盤舒棟宇峥嶸侔大壯拱木詔林衡全模徵梓匠千櫨綺翼浮百栱長虹抗北去邯鄲道南來偃師望龍首載文㮰雲楣承武帳居者非求隘卑宫豈難尚壯麗天下觀是以從蕭相變宫調二首帝遊光出震君明擅在離巖廊惟眷顧欽若尚無為龍穴非難附鸞巢欲可窺具茨應不逺汾陽寧足隨蒸民播殖重溝洫劬勞多桑林還注雨積石遂開河明徵逢永命平秩值年和更有薰風曲方聞晨露歌移風廣軒厯崇德盛唐年成文興大雅出豫動鈞天黃鍾六律正閶闔八風宣孤竹調陽管空桑節雅弦舞林鸞更下歌山鳳欲前聞音能辨俗聼曲乃思賢感物觀治亂心恆防未然君子得其道太平何有焉商調曲四首君以宫唱寬大而謨明臣以商應聞義則可行有熊為政訪道於容成殷湯受命委任於阿衡忠其敬事有罪不逃刑誦其針諫言之無隱情有剛有斷四方可以寧既頌既雅天下乃升平專精一致金石為之開動其兩心妻子恩情乖茍利社稷無有不盡懷昊天降祐元首惟康哉百川俱㑹大海所以深羣材既聚故能成鄧林猛虎在山百獸莫敢侵忠臣處國天下無異心昔我文祖執心且危慮驅剪豺狼經營此天步今我受命又無敢逸豫惟爾弼諧各可知兢懼禮樂既正人神所以和玊帛既序志欲靜干戈各分符瑞俱誓裂山河今日相樂對酒且當歌道德以喻聽撞鐘之聲神姦不若觀鑄鼎之形酆宫既朝諸侯於是穆岐陽或狩淮夷自此平若涉大川言憑於舟楫如和鼎實有寄於鹽梅君臣一體可以靜氛埃得人則治何世無竒才風力是舉而台階序平重黎既登而天地位成功無與讓銘太常之旌世不失職受騂毛之盟輯瑞班瑞穆穆於堯門惟翰惟屏膴膴於周原功成而治定禮樂斯存復子而明辟姬旦何言角調曲二曲止戈見於絶轡之野稱伐聞於丹水之征信義俱存乃先忘食五材並用誰能去兵雖聖人之大寶曰位實天地之大德曰生涇渭同流清濁異能琴瑟並御雅鄭殊聲擾擾蒸人聲教不一茫茫禹跡車軌未并志在四海而尚恭儉心包宇宙而無驕盈言而無文行之不逺義而無立勤則無成惻隱其心訓以慈惠流宥其過哀矜典刑匡贊之士或從漁釣雲雨之才乍歎幽谷尋芳者追深徑之蘭識韻者探窮山之竹克明其德貢以三事樹之風聲言於九牧協用五紀風若從時農用八政甘作其穀殊風共軌見之周南異畝同穎聞之康叔祁寒暑雨是無胥怨天覆雲油滋焉滲漉幸無謝上古之淳人庶可以封之於比屋探一作採徵調曲六首乾川以含養覆載日月以貞明照臨達人以四海為務明君以百姓為心水波瀾者源必逺樹扶踈者根必深雲雨取施無不洽廊廟求才多所任淳風布政常無欲至道防人能變俗求仁義急於水火用禮讓多於菽粟屈軼無佞人可指獬豸無繁刑可觸王道蕩蕩用無為天下四人誰不足聖人千年始一生黃河千年始一清攝提以之而從紀玉燭於是而文明東南可以補地缺西北可以正天傾浮黿則東海可厲運鍤則南山可平衆仙就朝於瑶水羣帝受享於明庭懷和則韎任並奏功烈則鐘鼎俱銘三光以記物呈形四時以裁成正位雷風大山嶽之響寒暑通隂陽之氣武功則六合攸同文教則二儀經緯有道則咸浴其德好生則各繁其類白日經天中則移明月橫漢滿而虧能虧能缺既無為雖盈雖滿則不危開信義以為苑囿立道德以為城池周監二代所損益郁郁乎文其可知庖犧之親臨佃漁神農之躬秉耕稼湯則救旱而憂勤禹則正冠而無暇草上之風無不偃君子之氓知而化將欲比德於三皇未始追蹤於五霸纖纖不絶林薄成㳙㳙不止江河生事之毫髮無謂輕慮逺防微乃不傾雲官乃垂拱大君鳳厯惟欽明元首類上帝而禋六宗望山川而朝羣后地鏡則山澤俱開河圖則魚龍合負我之天綱莫不該閶闔九關天門開卿相則風雲𤣥感匡贊則星辰下來既興周室之三聖乃舉唐朝之八才莘臣參謀於左相大老教政於中台其宜作則於明哲故無崇信於姦回正陽和氣萬類繁君王道合天地尊黎人耕植於義圃君子翺翔於禮園落其實者思其樹飲其流者懷其源咎繇為謀不仁逺士㑹為政羣盜奔克寬則昆蟲內向彰信則殊俗宅心桴橋有月支抱馬上苑有烏孫學琴赤玉則南海輸賮白環則西山獻琛無勞鑿空於大夏不待蹶角於蹛林羽調曲五首樹君所以牧人立法所以靜亂首惡既其南巢元凶於是北竄居休氣而四塞在光華而兩旦是以雨施作解是以風行惟涣周之文武洪基光宅天下文思千載克聖咸熙七百在我應期實昊天有成命惟四方其訓之運平後親之俗時亂先踈之雄踰桂林而驅象濟弱水而承鴻既浮干吕之氣還吹入律之風錢則都內貫朽倉則常平粟紅火中乃寒乃暑年和一風一雨聽鐘磬念封疆聞笙竽思畜聚瑶琨篠簜既從怪石鉛松即序長樂善馬成厩水衡黃金為府百川乃宗巨海衆星是仰北辰九州攸同禹跡四海合德堯臣朝陽栖於鳴鳳靈畤牧於般麟雲玉葉而五色月金波而兩輪涼風迎時北狩小暑戒節南巡山無藏於紫玉地不受於黃銀雖南征而北怨實西略而東賔既永清於四海終有慶於一人定律零陵玉管調鍾始平銅尺龍門之下孤桐泗水之濵鳴石河靈於是讓圭山精所以奉璧滌九川而賦稅刊三危而納錫北里之禾六穗江淮之茅三脊可以玉檢封禪可以金繩探册終永保於鴻名足揚光於載籍太上之有立德其次之謂立言樹善滋於務本除惡窮於塞源沖深其智則厚昭明其道乃尊仁義之財不匱忠信之禮無繁動天無有不届惟時無幽不徹作德心逸日休作僞心勞日拙自非剛克掩義無所離於勦絶隋元㑹大饗歌皇夏皇帝出入殿庭奏郊丘社廟同用深哉皇度粹矣天儀司陛整蹕式道先馳八屯霧擁七萃雲披退揚進揖步矩行規句陳乍轉華蓋徐移羽旗照耀圭組陸離居髙念下處安思危照臨有度紀律無虧肆夏皇太子出入奏惟熙帝載式固王猷體乾建本是曰孟侯馳道美漢寢門稱周德心既廣道業惟優傅保斯導賢才與遊瑜玉發響畫輪停輈皇基方峻匕鬯恆休食舉歌食舉奏八曲燔黍設教禮之始五味相資火為紀平心和德在甘㫖牢羞既陳鐘石俟以斯而御揚盛軌養身必敬禮食昭時和嵗阜庶物饒鹽梅既濟鼎鉉調持以膚臘加臐膮威儀濟濟懋皇朝饔人進羞樂侑作川濳之膾雲飛臛甘酸有宜芬勺藥金敦玉豆盛交錯御鼓既聲安以樂玉食惟后膳必珍芳菰既潔重秬新是能安體又調神荆包畢至海貢陳用之有節德無垠嘉羞入饋猶化謐沃土名滋帝臺實陽華之菜雕陵栗鼎俎芬芳豆籩溢通幽致逺車書一道髙物備食多方山膚既善水豢良桓蒲在位簨業張加籩折俎爛成行恩風下濟道化光禮以安國仁為政具物必陳饔牢盛罝罘斤斧順時令懷生熙熙皆得性於兹宴喜流嘉慶皇道四達禮樂成臨朝日舉表時平甘芳既飫醑以清揚休玊巵正性情隆我帝載永明明上夀歌上夀酒奏俗已乂時又良朝玉帛㑹衣裳基同北辰久夀共南山長黎元鼓腹樂未央宴羣臣登歌燕饗羣臣奏登歌並文舞武舞皇明馭歷仁深海縣載擇良辰式陳髙宴顒顒卿士昂昂侯甸車旗煜爚衣纓葱蒨樂正展懸司宮飾殿三揖稱禮九賔為傳圓鼎臨碑方壺在靣鹿鳴成曲嘉魚入薦筐篚相輝獻酬交遍飲和飽德恩風長扇大射登歌道謐金科照時乂玉條明優賢饗禮洽選德射儀成鑾旗鬱雲動寶軑儼天行巾車整三乏司裘飾五正鳴球響髙殿華鐘震廣庭烏號傳昔美淇衛著前名揖讓皆時傑升降盡朝英附枝觀體定杯水覩心平豐觚既來去燔炙復從橫欣看禮樂盛喜遇黃河清皇后房內歌隋書樂志曰髙祖龍濳時頗好音樂嘗倚琵琶作歌二章名曰地厚天髙託言夫婦之義牛𢎞修皇后房內之樂因取之為房內曲命婦入并登歌上夀並用之煬帝大業初栁顧言議以為房內樂者主為皇后弦歌諷誦以事君子故以房室為名其樂必有鐘磬乃益歌鐘歌磬土革絲竹副之并升歌下管總名房內之樂女奴肄習朝燕用焉至順垂典正內𢎞風母儀萬國訓範六宫求賢啓化進善宣功家邦載序道業斯融古樂苑卷七
