body:
  text: 古樂苑巻四十二明梅鼎祚編雜歌謠辭古謠誦附康衢謠一作康衢歌列子曰堯治天下五十年不知天下治與不治與億兆願戴已與乃微服遊於康衢聞童兒謠云云堯喜問曰誰教爾為此言童兒曰聞之大夫大夫曰古詩也立我烝民莫匪爾極不識不知順帝之則殷末謠帝惑妲己玉馬走叶養里反黄澤謠穆天子傳曰天子東遊于黄澤使宫樂謠云黄之池其馬歕沙皇人威儀黄之澤其馬歕玉皇人受榖池一作陀歕䮧也善問切沙叶音莎儀叶音俄澤叶達各反玉叶音珏受補註作壽穀叶同玉穀生也白雲謠三章穆天子傳曰乙丑天子觴西王母于瑤池之上西王母為天子謠曰白雲天子答之曰予歸天子遂驅升于弇山乃紀丌跡于弇山之石而樹之槐眉曰西王母之山還歸丌世民作憂以吟曰比徂弇弇兹山日入所也白雲在天山䧙自出道里悠逺山川間之將子無死尚能復來䧙音陵出叶尺為反間音諫將請也尚庶幾也來叶陵之反予歸東土和治諸夏萬民平均吾顧見女比及三年將復而野治一作洽夏叶後五反顧還也復反此野而見汝也野叶上與反比徂西土爰居其野虎豹為羣於鵲與處嘉命不遵我惟帝天子大命而不可稱顧世民之恩流涕芔隕吹笙鼓簧中心翔翔世民之子唯天之望徂往也於讀曰烏嘉命不遵言守此一方帝天帝也中心翔翔憂無薄也唯天之望所瞻望也徂彼西土爰居其所虎豹為羣烏鵲與處嘉命不遷我惟帝女彼何世民又將去予吹笙鼓簧中心翺翔世民之子維天之望西王母吟見海外經即前辭小異周宣王時童謠史記作童女謠史記曰夏后氏之衰也有二龍止于帝庭而言曰予褒之二君夏帝卜藏其漦歴夏殷莫敢發至厲王之末發而觀之漦化為𤣥黿以入后宫童女遭之而孕生女懼而棄之宣王之時童女謠曰云云適有夫婦賣是器者宣王使執之逃于道見鄉者所棄妖子哀而收之犇於褒褒人有罪請入棄女于王是為褒姒幽王嬖之竟為戎滅檿弧箕服實亡周國服叶山桑曰檿弧弓也箕本名服矢房也舊説以為簸箕之箕非鸜鵒謠漢書五行志曰左氏傳魯文成之世童謠也至昭公時有鸜鵒來巢公攻季氏敗出奔齊居外野次乾侯八年死於外歸葬魯昭公名禂公子宋立是為定公鸜之鵒之公出辱之鸜鵒之羽公在外野往饋之馬鸜鵒跦跦公在乾侯徵褰與襦鸜鵒之巢逺哉遥遥禂父喪勞宋父以驕鸜鵒鸜鵒往歌來哭野叶馬叶牡跦跦音誅叶周跳行貎褰袴也襦在外短衣也禂父昭公死外故喪勞宋父定公代立故以驕往歌來哭謂昭公生出歌死還哭也魯童謠家語曰齊有一足之鳥飛集於公朝止於殿前舒翅而跳齊侯怪之使使聘魯問於孔子孔子曰此鳥名商羊水祥也昔童兒屈脚振肩而跳且謠云云今齊有之其應至矣急告民趨治溝渠修隄防將有大水為災頃之大霖雨水溢汎諸國傷害民人唯齊有備不敗天將大雨商羊鼓儛晉獻公時童謠左氏傳曰晉獻公伐虢圍上陽問於卜偃曰吾其濟乎偃以童謠對曰克之十月丙子旦日在尾月在策鶉火中必是時也冬十二月内子朔晉滅虢虢公醜奔京師漢書五行志曰周十二月夏十月也言天者以夏正丙之晨龍尾伏辰均服振振取虢之旗鶉之賁賁天策焞焞火中成軍虢公其奔龍尾尾星也日月之㑹曰辰日在尾故尾星伏不見均同也戎事上下同服振振盛貎鶉鶉火星也賁賁烏星之體也天䇿傳説星時近日星㣲焞焞無光耀也言丙子平旦鶉火中軍事有成功也晉惠公時童謠漢書五行志曰晉惠公賴秦力得立立而背秦内殺二大夫國人不説及更葬其兄恭太子申生而不敬故詩妖作也後與秦戰為秦所獲立十四年而死晉人絶之更立其兄重耳是為文公遂伯諸侯恭太子更葬兮後十四年晉亦不昌昌乃在其兄葬叶滋即反兄叶虛王反趙童謠史記趙幽繆王遷五年代地大動六年大饑民譌言曰云云七年秦人攻趙趙大將李牧將軍司馬尚將擊之李牧誅司馬尚免趙忽及齊將顔聚代之趙忽軍破顔聚亡去以王遷降風俗通曰趙遷信秦反問之言殺其良將李牧而任趙括遂為所滅趙為號秦為笑以為不信視地上生毛笑平聲上一作之楚昭王時童謠家語曰楚昭王渡江江中有物大如斗圓而赤直觸王舟舟人取之王怪之使使聘於魯問於孔子孔子曰此萍實也可剖而食之吉祥也唯霸者為能獲焉使者反王遂食之大美使來以告魯大夫大夫因子游問曰夫子何以知其然曰吾昔之鄭過乎陳之野聞童謠云云此楚王之應也是以知之楚王渡江得萍實大如斗赤如日剖而食之甜如蜜楚人謠史記曰楚懷王為張儀所欺客死於秦到王負芻遂為秦所滅百姓哀之為之語曰楚雖三户亡秦必楚亡秦漢髙帝楚人也呉夫差時童謠述異記呉王夫差立春宵宫為長夜之飲造千石酒鍾又作天池池中造青龍舟日與西施為水嬉又有别館在句容楸梧成林樂府云云是也梧宫秋呉王愁靈寶謠靈寶要畧曰昔太上以靈寶五篇真文以授帝嚳帝嚳將仙封之於鍾山至夏禹巡狩度弱水登鍾山遂得是文後復封之包山洞庭之室呉王闔閭出遊包山見一人自言姓山名隠居闔閭扣之乃入洞庭取素書一巻呈闔閭其文不可識令人齎之問孔子孔子曰丘聞童謠云云闔閭乃尊事之呉王出遊觀震湖龍威文人山隠居北上包山入靈墟乃入洞庭竊禹書天地大文不可舒此文長傳百六初若强取出喪國廬包山謠見楊方呉越春秋沈懷逺南越志曰牛女之分揚州之末土也爰有太山實曰秦望又有石簣峻起立内有金簡玉字禹得金簡玉字書藏洞庭包山湖攻狄謠戰國䇿曰田單攻狄三月而不克齊嬰兒謠曰大冠若箕脩劍拄頥攻狄不能下壘枯丘能叶年題反壘字下一有子字丘叶祛其反大冠武冠也壘枯丘謂空寸一丘為壘説苑作梧丘地名也通鑑云攻狄不能下壘枯骨成丘秦人謠見張衡西京賦注虞喜志林曰秦穆公夢之天帝所奏鈞天樂賜以金䇿祚世之業當時有謠曰天帝醉秦㬥金誤隕石墜風雅逸篇註曰張平子曰昔者天帝説秦穆公而覲之饗以鈞天廣樂帝有醉焉乃為金䇿賜用此土而翦諸鶉首即此説也葢憤亂疾世若詩所謂視天夢夢者泗上謠水經注周顯王四十二年九鼎淪沒泗淵秦始皇時見於泗水始皇大喜使數千人入水系而行未出龍齒嚙斷其系故泗上為之謠曰稱樂太早絶鼎系巴謠歌芧君内傳曰秦始皇三十一年九月庚子茅盈髙祖濛於華山之中乘雲駕鶴白日昇天先是時有巴謠歌始皇聞謠歌而問其故父老具對曰此仙人之謠歌勸帝求長生之術於是始皇欣然乃有尋仙之志因改臘曰嘉平神仙得者茅初成駕龍上昇入太清時下𤣥洲戲赤城繼世而往在我盈帝若學之臈嘉平秦世謠異苑曰秦世有謠云云始皇既坑儒焚典乃發孔子墓欲取諸經傳壙既啟於是悉如謠者之言又言謠文刋在塚壁政甚惡之及達沙丘而修别路見一羣小兒輦沙為阜問云沙丘從此得病秦始皇奄僵開吾户據吾牀飲吾酒唾吾漿飡吾飲以為糧張吾弓射東墻前至沙丘當滅亡不知何一男子自稱秦始皇上我堂踞我牀顛倒衣裳至沙丘而亡王充論衡孔子遺秘書云云不謂謠也河圖引蜀謠汶阜之山江出其腹帝以㑹昌神以建福列女傳引古謠食石食金鹽可以支常久食石食玉䜴可以得長壽誦有焱氏頌莊子天運篇北門成問於黄帝曰帝張咸池之樂於洞庭之野吾始聞之懼復聞之怠卒聞之而惑蕩蕩黙黙乃不自得帝曰天機不張而五官皆備此之謂天樂無言而心就故有焱氏為之頌曰云云女欲聽之而無接焉而故惑也註此乃無樂之樂樂之至也聽之不聞其聲視之不見其形充滿天地苞裹六極輿人誦國語曰晉惠公入而背内外之賂輿人誦之曰惠公獻公庶子夷吾也外秦内里丕也輿衆也不歌曰誦佞之見佞果喪其田詐之見詐果喪其賂得國而狃終逢其咎喪田不懲禍亂其興佞謂里丕受惠公賂田而納之見佞謂惠公入而不予里丕不得其賂田詐謂秦以詐立惠公見詐謂惠公入而背之秦不得其賂地狃忕也咎謂惠公敗於韓丕鄭不得田不懲艾復欲與秦共納重耳惠公殺之佞叶稱因反田音與陳同詐叶莊助反恭世子誦國語晉惠公改葬共世子臭達于外國人誦之曰共世子申生也獻公時申生葬不如禮故改葬之惠公烝於獻公夫人賈君故申生臭達於外不欲為無禮者所葬也貞之無報也孰是人斯而有是臭也貞為不聽信為不誠國斯無刑媮居幸生不更厥貞大命其傾威兮懷兮各聚爾有以待所歸兮猗兮違兮心之哀兮歲之二七其靡有微兮若翟公子吾是之依兮鎮撫國家為王妃兮貞正也以正葬之而不見聽也信心行之不見誠也刑法也言惠公偷竊居位徼幸而生威畏也懷思也言國人畏惠公思重耳也倚歎也違去也二七十四歲也微亡也靡有徼者亦亡謂子圉也翟公子指重耳時出居於翟也言重耳當霸諸侯為王妃耦報叶敷救反懷叶胡威反哀叶於希反輿人誦一作歌左傳晉侯宋公齊國歸父崔夭秦小子憖次於城濮楚師背酅而舍晉侯患之聽輿人之誦曰險酅尸圭反丘陵險阻名晉侯恐衆畏故聽其歌誦原田每每舍其舊而新是謀每平聲謀音媒髙平曰原喻晉軍美盛若原田之草每毎然可以謀立新功不足念舊惠朱儒誦一作歌左傳襄公四年邾人莒人伐鄫臧紇救鄫敗于狐駘國人誦之曰臧之狐裘敗我於狐駘我君小子朱儒是使朱儒朱儒使我敗於邾狐裘大夫之服襄公㓜弱故曰小子臧紇短小故曰朱儒裘叶渠之反駘叶盈之反子產誦二章一作歌左傳曰鄭子産從政一年輿人誦之曰取我衣冠而禇之取我田疇而伍之孰殺子産吾其與之禇衣囊也衣冠非法者收之不敢服及三年又誦之曰我有子弟子産誨之我有田疇子産殖之子産而死誰其嗣之誨古叶志殖叶時吏反孔子誦二章辭亦見家語孔叢子吕氏春秋曰孔子始用於魯魯人鷖誦之曰鷖人名也麛裘而鞞投之無戾鞞之麛裘投之無郵麛鹿子也其皮以為裘加裼衣以朝天子也鞞小貎投棄也戾郵皆罪也鞞叶毗臂反孔叢子作芾下同及三月政成化既行又作誦曰衮衣章甫實獲我所章甫衮衣惠我無私衮衣公侯服也章甫儒冠也齊人誦七畧作齊語史記茍卿趙人年五十始來遊學於齊騶衍術迂大而閎辨奭也文具難施淳于髠久與處時有得善言故齊人誦曰天口駢談天衍雕龍奭炙轂過髠史記無天口駢三字駢田駢也騶衍所言五徳終始天地廣大故曰談天騶奭脩衍之文飭若雕鏤龍文故曰雕龍過字作輠輠者車之盛膏器也炙之雖盡猶有餘流言淳于髠智不盡如炙輠也古樂苑巻四十二
