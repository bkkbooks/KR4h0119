存其本牛𢎞傳曰開皇九年奉詔改定雅樂又作樂府歌辭撰定圜丘五帝凱樂仁壽元年詔牛𢎞栁顧言許善心虞世基蔡徴等更詳故實創制雅樂歌辭其辭圜丘皇帝入至版位定奏昭夏之樂以降天神升壇奏皇夏之樂受玉帛登歌奏昭夏之樂皇帝降南陛詣壘洗洗爵訖升壇並奏皇夏初升壇俎入奏昭夏之樂皇帝初獻奏諴夏之樂皇帝既獻作文舞之舞皇帝飲福酒作需夏之樂皇帝反爵於坫還本位奏皇夏之樂武舞出作肆夏之樂送神作昭夏之樂就燎位還大次並奏皇夏昭夏降神奏肅祭典協良辰具嘉薦俟皇臻禮方成樂已變感靈心回天眷闢華闕下乾宫乘精氣御祥風望爟火通田燭膺介圭受瑄玉神之臨慶陰陰煙衢洞宸路深善既福德斯輔流鴻祚遍區宇皇夏皇帝升壇奏於穆我君昭明有融道濟區域功格𤣥穹百神警衛萬國承風仁深德厚信洽義豐明發思政勤憂在躬鴻基惟永福祚長隆君一作后登歌德深禮大道髙饗穆就陽斯恭陟配惟肅血膋升氣冕裘標服誠感清𤣥信陳史祝祗承靈貺載膺多福諴夏皇帝初獻奏肇禋崇祀大報尊靈因髙盡敬掃地推誠六宗隨兆五緯陪營雲和發韻孤竹揚清我粢既潔我酌惟明五神是鑒百祿來成大報一作式奉盡郭作就清一作聲文舞皇帝既獻奏皇矣上帝受命自天睿圖作極文教遐宣四方監觀萬國陶甄有苗斯格無得稱焉天地之經和樂具舉休徵咸萃要荒式序正位履端秋霜春雨需夏皇帝飲福酒奏禮以恭事薦以饗時載清𤣥酒僃潔薌萁回旒分爵思媚軒墀惠均撤俎祥降受釐十倫以具百福斯滋克昌厥德永祚鴻基武舞御歷膺期乘乾表則成功戡亂順時經國兵暢五材武𢎞七德憬彼遐裔化行充塞三道僃舉二儀交泰情發自中義均莫大祀敬恭肅鐘鼓繁㑹萬國斯歡兆民斯賴享兹介福康哉元首惠我無疆天長地久民隋書作人昭夏送神奏享序洽祀禮施神之駕嚴將馳奔精驅長離耀牲煙達潔誠照騰日馭鼓電鞭辭下土升上𤣥瞻寥廓杳無際淡羣心留餘惠五郊歌隋書樂志曰五郊歌辭青郊奏角音赤郊奏徵音黃郊奏宫音白郊奏商音黑郊奏羽音迎送神登歌與圓丘同青帝歌角音震宫初動木德惟仁龍精戒旦鳥歷司春陽光煦物溫風先導巗處載驚膏田已冒犧牲豐潔金石和聲懷柔備禮明德惟馨赤帝歌徵音長嬴開序炎上為德執禮司萌持衡御國重離得位芒種在時含櫻薦實木槿垂蕤慶賞既行髙明可處順時立祭事昭福舉黃帝歌宫音爰稼作土順位稱坤孕金成德履艮為尊黃本內色宫實聲始萬物資生四時咸紀靈壇汛掃盛樂髙張威儀孔僃福履無疆白帝歌商音西成肇節盛德在秋三農稍已九穀行收金氣肅殺商威飂戾嚴風鼓莖繁霜隕蒂厲兵詰㬥勑法慎刑明神降嘏國步惟寧黑帝歌羽音𤣥英啓候冥陵初起虹藏於天雉化於水嚴關重閉星回日窮黃鍾動律廣莫生風𤣥樽示本天産惟質恩覃外區福流京室京隋書作景感帝歌隋書樂志曰祀感帝奏諴夏迎送神登歌與圓丘同諴夏禘祖垂典郊天有章以春之孟於國之陽繭栗惟誠陶匏斯尚人神接禮明幽交暢火靈降祚火歷載隆蒸哉帝道赫矣皇風以春之孟郭作以孟之春雩祭歌隋書樂志曰雩祭蠟祭朝日夕月並奏諴夏其迎送神登歌並與圓丘同諴夏朱明啓候時載陽肅若舊典延五方嘉薦以陳盛樂奏氣序和平資靈祐公田既雨私亦濡民殷俗富政化敷民隋書作人蠟祭歌諴夏四方有祀八蠟酬功收藏既畢榛葛送終使之必報祭之斯索三時告勞一日為澤神祇必來鱗羽咸致惟義之盡惟仁之至年成物阜罷役息民皇恩已洽靈慶無垠民隋書作人朝日夕月歌朝日諴夏扶木上朝暾嵫山沈暮景寒來逰晷促暑至馳輝永時和合璧耀俗泰重輪明執圭盡昭事服冕罄䖍誠夕月諴夏澄輝燭地域流耀鏡天儀歷草隨弦長珠胎逐望虧成形表蟾兔竊藥資王母西郊禮既成幽壇福惟厚方丘歌隋書樂志曰祭方丘惟此四首異餘並同圓丘昭夏迎神奏柔功暢陰德昭陳瘞典盛𤣥郊篚幂清膋鬯馥皇情䖍具寮肅笙頌合鼓鼗㑹出桂旗屯孔蓋敬如在肅有承神胥樂慶福膺旗郭作作旌登歌奠玉帛奏道惟生育器乃包藏報功稱範殷薦有常六瑚已饋五齊流香貴誠尚質敬洽義章神祚惟永帝業增昌諴夏獻皇地祇奏厚載垂德崑丘主神陰壇吉禮北至良辰鑒水呈潔牲粟表純樽壺夕視幣玉朝陳羣望咸秩精靈畢臻祚流於國祉被於人昭夏送神奏奠既徹獻已周竦靈駕逝逺逰洞四極匝九縣慶方流祉恆遍埋玉氣掩牲芬晰神理顯國文神州歌隋書樂志曰祭神州奏社稷先農並奏諴夏其迎送神登歌並與方丘同諴夏四海之內一和之壤地曰神州物賴生長咸池既降泰坼斯饗牲牷尚黑圭玉實兩九㝢載寧神功克廣社稷歌四首春祈社諴夏厚地開靈方壇崇祀達以風露樹之松梓勾萌既申芟柞伊始恭祈粢盛載膺休祉春祈稷諴夏粒食興教播厥有先尊神致潔報本惟䖍瞻榆束耒望杏開田方慿戩福佇詠豐年秋報社諴夏北墉申禮單出表誠豐犧入薦華樂在庭原隰既平泉流又清如雲已望髙廩斯盈秋報稷諴夏民天務急農亦勤止或蓘或藨惟穈惟芑涼風戒時歲云秋矣物成則報功施必祀民隋書作人先農歌諴夏農祥晨晰土膏初起春原俶載青壇致祀斂蹕長阡回旌外壝房俎飾薦山罍沈滓親事朱紘躬持黛耜恭神務穡受禧降祉先聖先師歌諴夏經國立訓學重教先三墳肇冊五典留篇開鑿理著陶鑄功宣東膠西序春誦夏弦芳塵載仰祀典無騫古樂苑卷三
