body:
  text: 古樂苑卷三明梅鼎祚編郊廟歌辭郊祀北齊梁北周隋梁雅樂歌隋書樂志曰梁初郊禋宗廟及三朝之樂並用宋齊元徽永明儀注唯改嘉祚為永祚又去永至之樂何佟之周捨議按周禮王出入奏王夏大祭祀與朝會同而漢制皇帝在廟奏永至朝會别奏皇夏二樂有異於禮為乖乃除永至還用皇夏及武帝定國樂並以雅為稱取詩序云言天下之事形四方之風謂之雅雅止乎十二則天數也乃至階步之樂增撤食之雅焉其辭並沈約所製普通中薦蔬之後改諸雅歌勑蕭子雲製辭既無牲牢遂省滌雅牷雅云南史曰梁初郊廟未革牲牷樂辭皆沈約撰至是承用子雲啓宜改之勑答曰此是主者守株宜急改也仍使子雲撰定敕曰郊廟歌辭應須典誥大語不得雜用子史文章淺言而沈約所撰亦多舛謬子雲作成勑並施用隋書樂志曰梁天監初時議又以為周禮云若樂六變天神皆降神居上𤣥去還恍忽降則自至迎則無所可改迎為降而送依前式又周禮云若樂八變則地祗皆出可得而禮地宜依舊為迎神從之皇雅三曲五言皇帝出入奏隋書樂志曰宋孝建起居注奏永至至是改為皇雅取詩皇矣上帝臨下有赫也二郊太廟同用沈約下同首十一帝德實廣運車書靡不賓執瑁朝羣后垂旒御百神八荒重譯至萬國婉來親華蓋拂紫微勾陳繞太一容裔被緹組參差羅罕畢星回昭以爛天行徐且謐清蹕朝萬㝢端冕臨正陽青絇黃金繶衮衣文繡裳既散華蟲采復流日月光滌雅一曲四言牲出入宋元徽儀注奏引牲至是改為滌雅取禮記帝牛必在滌三月也二郊明堂太廟同用將修盛禮其儀孔熾有腯斯牲國門是置不黎不痼靡愆靡忌呈肌獻體永言昭事俯休皇德仰綏靈志百福具膺嘉祥允洎駿奔伊在慶覃遐嗣牷雅一曲四言薦毛血宋元徽三年儀注奏嘉薦至是改為牷雅取春秋左氏傳牲牷肥腯也二郊明堂太廟同用反本興敬復古昭誠禮容宿設祀事孔明華俎待獻崇碑麗牲充哉繭握肅矣簪纓其膋既啓我豆既盈庖丁遊刃葛盧驗聲多祉攸集景福來并諴雅一曲三言南郊降神用宋元徽儀注奏昭夏至是改為諴雅取尚書至諴感神也懷忽慌瞻浩蕩盡誠潔致䖍想出杳冥降無象皇情肅具僚仰人禮盛神途敞僾明靈申敬享感蒼極洞𤣥象諴雅一曲三言北郊迎神用地德溥崑丘峻揚羽翟鼓應􅉧出尊祇展誠信招海瀆羅嶽鎮惟福祉咸昭晉諴雅一曲四言南北郊明堂太廟送神同用我有明德馨非稷黍牲玉孔備嘉薦惟旅金懸宿設和樂具舉禮達幽明敬行尊俎鼓鐘云送遐福是與獻雅一曲四言皇帝飲福酒宋元徽儀注奏嘉祚梁初改為永祚至是改為獻雅取禮記祭統尸飲五洗玉爵獻卿今之福酒亦古獻之義也二郊明堂同用神宫肅肅天儀穆穆禮獻既同膺兹釐福我有馨明無愧史祝禋雅一曲四言就燎位用宋元徽儀注奏昭逺就埋位齊永明儀注奏隸幽至是燎埋俱奏禋雅取周禮大宗伯以禋祀祀昊天上帝也紫宫昭煥太一微𤣥降臨下土尊髙上天載陳圭幣式備牲牷雲箛清引栒簴髙懸俯昭象物仰致髙煙肅彼靈祉咸達皇䖍禋雅一曲四言就埋用盛樂斯舉協徵調宫靈饗慶洽祉積化融八變有序三獻已終坎牲瘞玉酬德報功振垂成吕投壤生風道無虛致事由感通於皇盛烈比祚華嵩二郊登歌隋書樂志曰大戴云清廟之歌懸一磬而尚搏拊在漢之世獨有登歌近代巳來始用絲竹舊三朝設樂皆有登歌梁武以為登歌者頌祖宗功業非元日所奏于是去之後以其說非通復用於嘉慶梁二郊宗廟皇帝初獻及明堂遍歌五帝德並奏登歌又曰南郊舞奏黃鍾取陽始化也北郊舞奏林鍾取陰始化也明堂宗廟所尚者惟蕤賔是為敬之名復有陰主之義故同奏焉其南北郊明堂宗廟之禮加有登歌南郊登歌二曲三言皇帝初獻奏沈約暾既明禮告成惟聖祖主上靈爵巳獻罍又盈息羽籥展歌聲僾如在結皇情禮容盛尊俎列𤣥酒陳陶匏設獻清㫖致䖍潔工既升樂巳闋降蒼昊垂芳烈北郊登歌二曲四言皇帝初獻奏沈約方壇既坎地祇已出盛典弗愆羣望咸秩乃升乃獻敬成禮卒靈降無兆神饗載謐允矣嘉祚其升如日至哉坤元實惟厚載躬兹奠饗誠交顯晦或升或降搖珠動佩德表成物慶流皇代神嘏不愆祺福是賚成物郭作萬物明堂登歌五曲四言隋書樂志曰梁天監初明堂設樂大略與南郊不殊惟壇堂異名而無就燎之位明堂則遍歌五帝其餘同於郊式焉歌青帝沈約下同帝居在震龍德司春開元布澤含和尚仁羣居既散歲云陽止飭農分地民粒惟始雕梁繡栱丹楹玉墀靈威以降百福來綏民隋書作人歌赤帝炎光在離火為威德執禮昭訓持衡受則靡草既凋溫風以至嘉薦惟旅時羞孔備齊緹在堂笙鏞在下匪惟七百無絶終始歌黃帝鬱彼中壇含靈闡化回環氣象輪無輟駕布德焉在四序將收音宫數五飯稷驂駵宅屏居中旁臨外宇升為帝尊降為神主歌白帝神在秋方帝居西皓允兹金德裁成萬寶鴻來雀化參見火斜幕無𤣥鳥菊有黃華載列笙磬式陳彛俎靈罔常懷惟德是與歌黑帝德盛乎水𤣥冥紀節陰降陽騰氣凝象閟司智􅊩坎駕鐵衣𤣥祁寒拆地晷度回天悠悠四海駿奔奉職祚我無疆永隆民極閟隋書作閉民隋書作人北齊大禘圜丘歌隋書樂志曰齊武成時始定四郊宗廟三朝之樂大禘圜丘及北郊並同祀感帝用圜丘樂肆夏樂夕牲羣臣入門奏陸卬等奉詔撰肇應靈序奄字黎民乃朝萬國爰徴百神祗展方望幽顯咸臻禮崇聲協贄列圭陳翼差鱗次端笏垂紳來趨動色式贊天人民隋書作人笏郭作拱髙明樂迎神奏登歌辭同惟神鑒矣皇靈肅止圓璧展事成文即始士備八能樂合六變風湊伊雅光華襲薦宸衛騰景靈駕霏煙嚴壇生白綺席凝𤣥昭夏樂牲出入並奏剛柔設位惟皇配之言肅其禮念暢在兹飭牲舉獸載歌且舞既設伊腯致精靈府物色惟典齊沐加恭宗族咸暨罔不率從昭夏樂薦毛血奏展禮上月肅事應時繭栗為用交暢有期弓矢斯發瓫簝將事圓神致祀率由先志和以鑾刀臭以血膋至哉敬矣厥義孔髙羣臣出進熟羣臣入並奏肆夏辭同初入皇夏樂初入進熟皇帝入門奏帝敬昭宣皇誠肅致玉帛齊軌屏攝咸次三垓上列四陛㫄升龍陳萬騎鳳動千乘神儀天藹晬容離曜金根停軫奉光先導皇夏樂皇帝升丘奏壇上登歌辭同紫壇雲曖紺幄霞褰我其陟止載致其䖍百靈竦聽萬國咸仰人神咫尺𤣥應肸蠁髙明樂皇帝初獻奏上下眷㫄午從爵以質獻以恭咸斯暢樂惟雍孝敬闡臨萬邦髙明樂皇帝奠爵訖奏髙明樂覆幬之舞辭自天子之㑹昌神道丘陵肅事克光天保九關洞開百靈環列八尊呈備五聲投節武德樂皇帝獻太祖配饗神座奏武德之樂昭烈之舞辭配神登聖主極尊靈敬宣昭燭咸達窅冥禮𢎞化定樂贊功成穰穰介福下被羣生皇帝小退當昊天上帝靈座前奏皇夏皇夏樂皇帝飲福酒奏皇心緬且感吉蠲奉至誠赫哉光盛德乾川詔百靈報福歸昌運承祐播休明風雲馳九域龍蛟躍四溟浮幕呈光氣儷象燭華精濩武方知恥韶夏僅同聲皇帝詣東陛還便座又奏皇夏辭同初入髙明樂送神降丘南陛奏獻享畢懸佾周神之駕將上遊超斗極絶河流懷萬國寧九州欣帝道心顧留匝上下荷皇休皇帝之望燎位奏皇夏辭同上昭夏樂紫壇既燎奏𤣥黃覆載元首照臨合德致禮有契其心敬申事闋潔誠云報玉帛載升棫朴斯燎寥廓幽曖播以馨香皇靈惟監降福無疆皇帝自望燎位還本位奏皇夏辭同上云一作共皇夏樂皇帝還便殿奏天大親嚴匪敬伊孝永言肆饗宸明增耀陽丘既暢大典逾光乃安斯息欽若舊章天回地旋鳴鑾引警且萬且億皇厯惟永羣臣出奏肆夏辭同上北郊樂歌八首隋書樂志曰齊北郊迎神奏髙明樂登歌辭同薦毛血奏昭夏進熟皇帝入門及升丘並奏皇夏奠爵訖奏髙明樂覆幬舞送神降丘南陛奏髙明樂既瘞奏昭夏還便殿奏皇夏餘並同南郊按隋書南北樂合載其文異者即注句下今從郭本分列髙明樂惟祗監矣皇靈肅止方琮展事即陰成理士備八能樂合八變風湊伊雅光華襲薦象衛騰景靈駕霏煙嚴壇生白綺席凝𤣥昭夏樂展禮上月肅事應時繭栗為用交暢有期弓矢斯發瓫簝將事方祗致祀率由先志和以鑾刀臭以血膋至哉敬矣厥義孔髙皇夏樂帝敬昭宣皇誠肅致玉帛齊軌屏攝咸次重垓上列分陛㫄升龍陳萬騎鳳動千乘神儀天藹晬容離曜金根停軫奉光先導皇夏樂層壇雲曖嚴幄霞褰我其陟止載致其䖍百靈竦聽萬國咸仰人神咫尺𤣥應肸蠁髙明樂自天子之㑹昌神道方澤祇事克光天保九關洞開百靈環列八尊呈備五聲投節髙明樂獻享畢懸佾周神之駕將下逰超荒極憩崑丘懷萬國寧九州欣帝道心顧留匝上下荷皇休昭夏樂𤣥黃覆載元首照臨合德致禮有契其心敬申事闋潔誠云報牲玉載陳棫朴斯燎寥廓幽曖播以馨香皇靈惟鑒降福無疆皇夏樂天大親嚴匪敬伊孝永言肆饗宸明增耀陰澤云暢大典逾光乃安斯息欽若舊章天回地旋鳴鑾引警且萬且億皇歷惟永五郊樂歌隋書樂志曰齊五郊迎氣降神並奏髙明樂又禮五方上帝並奏髙明之樂為覆幬之舞按此五歌亦如宋謝莊用五行數青帝髙明樂三言以下詩彚作祖珽撰歲云獻谷風歸斗東指雁北飛電鞭激雷車遽虹旌靡青龍馭和氣洽具物滋翻降止應帝期赤帝髙明樂七言婺女司旦中吕宣朱精御節離景延根荄俊茂溫風發柘火風水應炎月執衡長物德孔昭赤旗霞曳㑹今朝霞郭本作電黃帝髙明樂五言居中匝五運乘衡畢四時含養滋羣物協德固皇基嘽緩契王風持載符君德良辰動靈駕承祀昌邦國白帝髙明樂九言風涼露降馳景揚寒精山川搖落平秩在西成蓋藏成積蒸民被嘉祉從享來儀鴻休溢千祀民隋書作人黑帝髙明樂六言虹藏雉化告寒氷壯地坼年殫日次月紀方極九州萬邦獻力叶光是紀歲窮微陽潛兆方融天子赫赫明聖享神降福惟敬祠五帝於明堂樂歌辭肆夏樂先一日夕牲羣臣入門奏羣臣出奏進熟羣臣入並奏肆夏辭同以下詩彚作祖珽撰國陽崇祀嚴恭有聞荒華胥暨樂我太君冕瑞有列禽帛恭敘羣后師師威儀容與執禮辨物司樂考章率由靡墜休有烈光恭敘一作載敘髙明樂太祝令迎神奏髙明樂覆幬舞辭祖德光國圖昌祗上帝禮四方闢紫宫動華闕龍虎奮風雲發飛朱雀從𤣥武攜日月帶雷雨耀宇內溢區中眷帝道感皇風帝道康皇風扇粢盛列椒醑薦神且寧㑹五精歸福祿幸閭亭虎隋書作獸武德樂太祖配饗奏武德樂昭烈舞辭五方天帝奏髙明之樂覆幬之舞辭同迎氣於惟我祖自天之命道被歸仁時屯啓聖運鍾千祀授手萬姓夷凶掩虐匡頽翼正載經載營庶士咸寧九功以洽七德兼盈丹書入告𤣥玉來呈露甘泉白雲郁河清聲教咸往舟車畢㑹仁加有形化浹無外嚴親惟重陟配惟大既祐斯歌率土攸賴昭夏樂牲出八奏孝享不匱精潔臨年滌牢委溢形色博牷于以用之言承歆祀肅肅威儀敢不敬止載飭載省惟牛惟羊明神有察保兹萬方昭夏樂薦毛血奏我將宗祀夤獻厥誠鞠躬如在側聽無聲薦色斯純呈氣斯臭有滌有濯惟神其祐五方來格一人多祉明德惟馨於穆不已皇夏樂進熟皇帝入門奏皇帝升壇奏皇夏辭同象乾上構儀坤下基集靈崇祖永言孝思室陳簋豆庭羅懸佾夙夜畏威保兹貞吉舞貴其夜歌重其升降斯百祿惟饗惟應髙明樂皇帝初獻奏髙明樂覆幬舞辭度几筵闢牖户禮上帝感皇祖酌惟潔滌以清薦心欵達神明髙明樂皇帝祼獻奏髙明樂覆幬舞辭帝精來降應我明德禮殫義展流祉邦國既受多祉實資孝敬祀致其誠荷天休命皇