body:
  text: 古樂苑卷九明梅鼎祚編鼓吹曲辭二擬漢鐃歌朱鷺梁王僧孺因風弄玉水映日上金堤猶持畏羅繳未得異鳬鷖聞君愛白雉兼因重碧雞未能聲似鳳聊變色如圭願識昆明路乘流飲復棲同前裴憲伯秋來懼寒徑歲去畏氷堅羣飛向葭下奮羽欲南遷暫戲龍池側時往鳳樓前所歎恩光歇不得久聯翩同前陳後主參差蒲未齊沈漾若浮緑朱鷺戲蘋藻徘徊流澗曲澗曲多巖樹逶迤復斷續振振雖以明湯湯今又矚同前陳張正見金堤有朱鷺刷羽望滄瀛周詩振雅曲漢鼓發竒聲時將赤鴈竝乍逐彩鸞行别有翻潮處異色不相驚同前陳蘇子卿玉山一朱鷺容與入王畿欲向天池飲還繞上林飛金堤曬羽翮丹水浴毛衣非貪葭下食懷恩自逺歸艾如張蘇子卿誰在間門外羅家諸少年張機蓬艾側結網槿籬邊若能飛自勉豈為繒所纒黃雀儻為誡朱絲猶可延上之回梁簡文帝前斾拂回中後車隅桂宫輕絲臨雲罕春色繞川風桃林方灼灼柳路日曈曈笳聲駭胡騎清磬讋山戎微臣今拜手願帝永無窮同前陳張正見林光稱避暑回中乃吉行龍媒躡影駛玉輦御雲輕風烏繞鳷鵲綵鷁照昆明欲知鍾箭逺遙聽寶雞聲同前選詩拾遺題云巡省北齊蕭慤發軔城西畤回輿事北遊山寒石道凍葉下故宫秋朔路傳清景邉風卷畫旒歲餘巡省畢擁仗返皇州擁伏一作按節同前隋陳子良承平重遊樂詔蹕上之回屬車響流水清笳轉落梅嶺雲蓋道轉巖花映綬開下輦便高宴何如在瑤臺戰城南三首後二首藝文失題列戰城南後英華從之陌上一首六朝詩作胡無人行梁吳均躞蹀青驪馬往戰城南畿五歷魚麗陳三入九重圍名懾武安將血汙秦王衣為君意氣重無功終不歸前有濁樽酒憂思亂紛紛小來重意氣學劍不學文忽值胡關靜胸奴遂兩分天山巳半出龍城無片雲漢世平如此何用李將軍樽酒一作酒尊小來一作少年陌上何喧喧胸奴圍塞垣黑雲藏趙樹黃塵埋隴垠天子羽書勞將軍在玉門闕同前陳張正見薊北馳胡騎城南接短兵雲屯兩陳合劒聚七星明旗交無復影角憤有餘聲戰罷披軍策還嗟李少卿巫山高齊虞羲南國多竒山荆巫獨靈異雲雨麗以佳陽臺千里思勿言可再得特美君王意高唐一斷絶光隂不可遲同前王融想像巫山高薄暮陽臺曲煙華乍卷舒行芳時斷續彼美如可期寤言紛在矚憮然坐相思秋風下庭緑想像一作髣佛煙華一作煙雲卷舒一作舒卷行芳一作猿鳥又作蘅芳思一作望同前劉繪高唐與巫山參差鬱相望灼爍在雲間氛氲出霞上散雨收夕臺行雲卷晨障出沒不易期嬋娟似惆悵霞一作雲似一作以同前梁元帝巫山高不窮迥出荆門中灘聲下濺石猿鳴土逐風樹雜山如畫林暗澗疑空無因謝神女一為出房櫳同前范雲巫山高不極白日隱光輝靄靄朝雲去冥冥暮雨歸巖懸獸無跡林暗鳥疑飛枕席竟誰薦相望空依依空一作徒同前費昶巫山光欲晚陽臺色依依彼美巖之曲寧知心是非朝雲觸石起暮雨潤羅衣願解千金佩請逐大王歸晚一作曉同前王泰迢遞巫山竦逺天新霽時樹交凉去逺草合影開遲谷深流響咽峽近猿聲悲只言雲雨狀自有神仙期同前陳後主巫山巫峽深峭壁聳春林風巖朝蕊落霧嶺晚猿吟雲來足薦枕雨過非感琴仙姬將夜月度影自浮沈同前蕭詮巫山映巫峽高高殊未窮猿聲不辨處雨色詎分空懸崖下桂月深澗響松風别有仙雲起時向楚王宫同前隋李孝貞荆門對巫峽雲夢邇陽臺燎火如奔電墜石似驚雷天寒秋水急風靜夜猿哀枕席無由薦朝雲徒去來同前凌敬巫岫鬱岧嶤高高入紫霄白雲間危石𤣥猿挂迥條懸崖激巨浪脆葉殞驚飈别有陽臺處風雨共飄颻危一作抱挂迥一作迥挂將進酒梁昭明太子統洛陽輕薄子長安遊俠兒宜城溢渠碗中山浮羽巵君馬黃陳蔡君知君馬徑西極臣馬出東方足策浮雲影珂連明月光水凍恆傷骨蹄寒為踐霜躊躇嗟伏櫪空想欲從良同前二首張正見幽并重騎射征馬正盤桓風去長嘶逺氷堅度足寒出關聊變色上坂屢停鞍即今隨御史非復在樓蘭五色乘馬黃追風時滅沒血汗染龍花胡鞍抱秋月唯騰渥窪水不飲長城窟詎待燕昭王千金市駿骨芳樹同沈約王融范雲劉繪賦齊謝朓早玩華池隂復鼓滄洲枻椅柅芳若斯葳蕤紛可結霜下桂枝銷怨與飛蓬折不厠玉盤滋誰憐終委絶鼓一作影同前王融相望早春日煙華雜如霧復比佳麗人含情結芳樹綺羅巳自憐萱風多有趣去來徘徊者佳人不可遇同前梁武帝緑樹始搖芳芳生非一葉一葉度春風芳芳自相接色雜亂參差衆花終重疊重疉不可思思此誰能愜同前元帝芬芳君子樹交柯御宿園桂影含秋月桃花染春源落英逐風聚輕香帶蕊翻叢枝臨北閣灌木隱南軒交讓良宜重成蹊何用言月一作色同前費昶幸被夕風吹屢得朝光照枝偃疑欲舞花開似含笑長夜路悠悠所思不可召行人早旋返賤妾猶年少偃一作低猶年少一作年猶少同前沈約發蕚九華隈開跗寒路側氤氲非一香參差多異色宿昔寒飈舉摧殘不可識霜雪交橫至對之長歎息路一作露同前丘遲芳葉巳漠漠嘉實復離離發景傍雲屋凝暉覆華池輕蜂掇浮􅀈弱鳥隱深枝一朝容色茂千春長不移同前陳李爽芳樹千株發搖蕩三陽時氣軟風來易枝繁度鳥遲春至花如錦夏近葉成帷欲寄邊城客路逺詎能持詎一作誰同前顧野王上林通建章雜樹遍林芳日影桃蹊色風吹梅徑香幽山桂葉落馳道柳條長折榮疑路逺用表莫相忘同前張正見竒樹舒春苑流芳入綺錢合歡分四照同心影萬年香浮佳氣裏葉映彩雲前欲識揚雄賦金玉滿甘泉影一作彰同前江總朝霞映日殊未妍珊瑚照水定非鮮千葉芙蓉詎相似百枝燈花復羞然暫欲寄根對滄海大願移華側綺錢井上桃蟲誰可雜庭中桂蠧豈見憐有所思齊劉繪别離安可再而我更重之佳人不相見明月空在帷共銜滿堂酌獨斂向隅眉中心亂如雪寧知有所思同前集云同王主簿有所思謝朓佳期期未歸望望下鳴機徘徊東陌上月出行人稀同前梁武帝誰言生離久適意與君别衣上芳猶在握裏書未滅腰中雙綺帶夢為同心結常恐所思露瑶華未忍折同前四首簡文帝昔未離長信金翠奉乘輿何言人事異夙昔故恩踈寂寞錦筵靜玲瓏玉殿虛掩閨泣團扇羅幌詠䕷蕪可歎不可思可思不可見餘絃斷瑟柱殘朱染歌扇寂寂暮檐響黯黯垂簾色唯有瓴甋苔如見蜘蛛織入林看碚􅓓春至定無賖何時一可見更得似梅花同前玉臺庾肩吾昭明太子統公子逺于隔乃在天一方望望江山阻悠悠道路長别前秋葉落别後春花芳雷嘆一聲響雨淚忽成行悵望情無極傾心還自傷公子一作佳人同前郭本作王融誤范雲如何有所思而無相見時宿昔夢顔色階庭尋履綦高張更何巳引滿終自持欲知憂能老為視鏡中絲同前五言律祖作吳均王筠丹墀生細草紫殿納輕隂曖曖巫山逺悠悠湘水深徒歌鹿盧劒空貽玳瑁簪望君終不見屑淚且長吟長一作微同前庾肩吾佳期竟不歸春日坐芳菲拂匣看離鏡開箱見别衣井梧生未合宮槐卷復稀不及銜泥燕從來相逐飛鏡一作扇同前題云鼓瑟曲有所思王僧孺夜風吹熠耀朝光照昔邪幾銷䕷蕪葉空落蒲桃花不堪長織素誰能獨浣紗光隂復何極望促反成賖知君自蕩子奈妾亦倡家昔邪一作辟邪桃一作萄同前吳均薄暮有所思終持淚煎骨春風驚我心秋露傷君髮同前沈約西征登隴首東望不見家關樹抽紫葉塞草發青芽昆明當欲滿蒲萄應作花垂淚對漢使因書寄狹邪同前費昶上林烏欲栖長門日行暮所思鬱不見空想丹墀步簾動意君來雷聲似車度北方佳麗子窈窕能回顧夫君自迷惑非為妾心妬烏欲栖一作烏欲飛行一作將同前三首一題云望逺陳後主蕩子好蘭期留人獨自思落花同淚臉初月似愁眉階前看草蔓窗中對網絲不言千里望復是三春時望一作别杳杳與人期遙遙有所思山川千里間風月兩邊時相待春那劇相望景偏遲當由分别久夢來還自疑佳人在北燕相望渭橋邊團團落日樹耿耿曙河天愁多明月下淚盡鴈行前别心不可寄唯餘琴上弦同前顧野王賤妾有所思良人久征戍笳鳴塞城表花開落芳樹白登澄月色黃龍起煙霧還聞雉子班非復長征賦笳鳴塞城表一作笳鳴胡塞表同前張正見深閨久離别積怨轉生愁徒思裂帛鴈空上望歸樓看花憶塞草對月想邊秋相思日日暮淚臉年年流暮一作度同前陸系别念限城闉還思樓上人淚想離前落愁聞别後新月來疑舞扇花度憶歌塵只看今夜裏那似隔河津同前北齊裴讓之夢中雖暫見及覺始知非展轉不能寐徙倚獨披衣悽悽曉風急暗暗月光微室空常達旦所思終不歸同前隋盧思道長門與長信憂思竝難任洞房明月下空庭緑草深怨歌裁潔素能賦受黃金復聞隔湘水猶言限桂林悽悽日巳暮誰見此時心潔一作紈雉子班古今樂録曰梁三朝樂第四十一設辟雅伎鼓吹作雉子班引去來梁吳均可憐雉子班羣飛集野甸文章始陸離意氣巳驚狷幽并遊俠子直心亦如箭生死報君恩誰能孤恩盻生死報君恩一作以死報君恩又一作死節同前陳後主四野秋原暗十步啄方前雊聲風處逺翅影雲間連箭射妖姬笑裘值盛明然巳足南皮賞復㑹北宮篇同前張正見陳倉雉未飛斂翮依芳甸朱冠色尚淺錦臆毛初變雊麥且專場排花聊勇戰唯當渡弱水不怯如臯箭同前毛處約春物始芳菲春雉正相追澗響連朝雊花光帶錦衣竄跡時移影驚媒或亂飛能使如臯路相逢巧笑歸同前江總麥壟新秋來澤雉屢徘徊依花似協妬拂草乍驚媒三春桃照李二月柳爭梅暫往如臯路當令巧笑開臨高臺魏文帝臨臺行高高以軒下有水清且寒中有黃鵠往且翻行為臣當盡忠願令皇帝陛下三千歲宜居此宮鵠欲南遊雌不能隨我欲躬銜汝口噤不能開欲負之毛衣摧頽五里一顧六里徘徊詩紀云此曲三假辭不相屬鵠欲南遊以下乃古辭飛鵠行也同前齊謝朓千里常思歸登臺臨綺翼才見孤鳥還未辨連山極四面動春風朝夜起寒色誰知倦遊者嗟此故鄉憶春一作清同前王融遊人欲騁望積步上高臺井蓮當夏吐窗桂逐秋開花飛低不入鳥散逺時來還看雲棟影含月共徘徊棟一作陳同前郭本作簡文帝今從玉臺梁武帝高臺半行雲望望高不極草樹無參差山河同一色髣佛洛陽道道逺難别識玉階故情人情來共相憶同前沈約高臺不可望望逺使人愁連山無斷續河水復悠悠所思曖何在洛陽南陌頭可望不可至何用解人憂同前陳後主晚景登高臺迥望春光來霧濃山後暗日落雲傍開煙裏看鴻小風來望葉回臨窗巳響吹極眺且傾杯迥一作回同前張正見曾臺邇清漢出迥架重棼飛棟臨黃鶴高窗度白雲風前朱幌色霞處綺疏分此中多怨曲地逺詎能聞幌一作幔同前北齊蕭慤崇臺高百尺迥出望仙宮畫栱浮朝氣飛梁照晚虹小衫飄霧縠豔粉拂輕紅笙吹汶陽篠琴奏嶧山桐舞逐飛龍引花隨少女風臨春今若此極燕豈無窮朝一作雲逺期梁張率逺期終不歸節物坐將變白露愴單衫秋風息團扇誰能久離别他鄉且異縣浮雲蔽重山相望何時見寄言逺期者空閨淚如霰將一作遷同前庾成師憶别春花飛巳見秋葉稀淚粉羞明鏡愁帶減寬衣得書言未反夢見道應歸坐使紅顔歇獨掩青樓扉𤣥雲梁張率壞陳壓峨壟遮窗暗思扉映日斜生海跨樹似鵬飛夢山妾巳去落靨何由歸釣竿崔豹古今注云釣竿者伯常子避仇河濱為漁者其妻思之而作也每至河側輒歌之後司馬相如作釣竿詩遂傳為樂曲其辭今亡魏文帝東越河濟水遙望大海涯釣竿何珊珊魚尾何篩篩行路之好者芳餌欲何為同前梁沈約桂舟既容與緑浦復回紆輕絲動弱芰微楫起單鳬叩舷急日暮卒歲以為娛同前戴皓試持𤣥渚釣暫罷池陽獵翠羽飾長綸蕖花裝小緤鈎利斷蓴絲泛舉牽菱葉聊載前魚童還看後舟妾同前一作劉孝威劉孝綽釣舟畫采鷁魚子服氷紈金轄茱茰網銀鈎翡翠竿斂橈隨水脉急槳渡江湍湍長自不辭前浦有佳期船交棹影合浦深魚出遲荷根時觸餌菱芒乍罥絲蓮渡江南手衣渝京兆眉垂竿自來樂誰能為太師釣竿篇陳張正見結宇長江側垂釣廣川潯竹竿橫翡翠桂髓擲黃金人來水鳥沒楫渡岸花沈蓮搖見魚近綸盡覺潭深渭水終須卜滄浪徒自吟空嗟芳餌下獨見有貪心同前隋李巨仁潺湲面江海滉漾矚波瀾不惜黃金餌唯憐翡翠竿斜綸控急水定楫下飛湍潭迥風來易川長霧歇難寄言朝市客滄浪余自安佳期竟不歸庾肩吾有所思曰佳期竟不歸因以為題陳張正見良人萬里向河源娼婦三秋思柳園路逺寄詩空織錦宵長夢返欲驚魂飛蛾屢繞帷前燭衰草還侵階上玉銜啼拂鏡不成粧促柱繁弦還亂曲時分年移竟不歸偏憎寒急夜縫衣流螢映月明空帳疏葉從風入斷機自對孤鸞向影絶終無一雁帶書回古樂苑卷九
