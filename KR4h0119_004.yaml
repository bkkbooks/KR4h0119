body:
  text: 古樂苑卷四明梅鼎祚編郊廟歌辭廟祀魏漢晉宋漢安世房中歌儀禮曰燕歌鄉樂周南關睢葛覃卷耳召南鵲巢采蘩采蘋鄭康成云王后國君夫人房中之樂歌也周南召南風化之本故謂之鄉樂用之房中以及朝廷饗燕鄉射飲酒也周官磬師掌教燕樂之鐘磬傳云燕樂房中之樂所謂隂聲也詩傳曰國君有房中之樂天子以周南諸侯以召南漢書曰房中祠樂髙祖唐山夫人所作也周有房中樂至秦名曰夀人凡樂樂其所生禮不忘本髙祖樂楚聲故房中樂楚聲也孝惠二年使樂府令夏矦寬僃其簫管更名安世樂宋書樂志曰魏文帝黃初二年議者以房中歌后妃之德所以風天下正夫婦乃改為正始之樂明帝太和初繆襲奏魏國初建王粲所作登歌安世詩專以思詠神靈及説神靈鑒享之意晉書樂志曰魏明帝時侍中繆襲奏漢安世歌詠亦説髙張四縣神來燕享嘉薦令儀永受厥福無有二南后妃風化天下之言今思惟往者謂房中為后妃之歌恐失其意方祭祀娛神登堂歌先祖功德下堂歌詠燕享無事歌后妃之化也於是改安世樂曰享神歌唐書禮樂志曰平調清調瑟調皆周房中之遺聲按漢書云房中歌十七章然止列為九章宋劉敞注云疑本十二章誤為十七章因分列為十七章之數馬端臨文獻通考亦同而郭茂倩樂府作十六章今從劉氏為正文漢書郭本分列于下唐山夫人大孝僃矣休德昭清髙張四縣樂充宮庭芬樹羽林雲景杳冥金支秀華庶旄翠旌劉敞云大孝僃矣一章八句七始華始肅倡和聲神來宴娭庶幾是聽粥粥音送細齊人情忽乘青玄熙事僃成清思眑眑經緯冥冥七始華始一章十句漢書郭本粥粥至冥冥一章我定厯數人告其心敇身齋戒施教申申乃立祖廟敬明尊親大矣孝熙四極爰轃我定厯數一章十句郭本同漢書至樂民人為一章轃與臻字同王侯秉德其鄰翼翼顯明昭式清明鬯矣皇帝孝德竟全大功撫安四極王侯秉德一章七句郭本同海內有姦紛亂東北詔撫成師武臣承德行樂交迸簫勺羣慝肅為濟哉蓋定燕國海內有姦一章八句郭本同簫舜樂勺周樂勺讀曰酌大海蕩蕩水所歸髙賢愈愈民所懷大山崔百卉殖民何貴貴有德大海蕩蕩一章六句郭本同安其所樂終産樂終産世繼緒飛龍秋遊上天髙賢愈樂民人安其所一章八句郭本同蘇林曰秋飛貌也師古曰莊子有秋駕之法者亦言駕馬騰驤秋秋然也揚雄賦曰秋秋蹌蹌入西園其義亦同讀者不曉秋義或改此秋字為秫稷之秫失之逺矣豐草葽女羅施譱何如誰能回大莫大成教德長莫長被無極豐草葽一章八句漢書郭本並同靁震震電耀耀明德鄉治本約治本約澤𢎞大加被寵咸相保施德大世曼夀靁震震一章十句漢書郭本並同都荔遂芳窅窊桂華孝奏天儀若日月光乘玄四龍回馳北行羽旄殷盛芬哉芒芒孝道隨世我署文章桂華一章十句孟康曰窅出窊入都良薜荔之香鼓動桂華也晉灼曰桂華殿名樹此香草以潔齊其芳氣達於宮殿也臣瓉曰茂陵中書歌都孋桂英美芳鼓行不得為殿師古曰都良薜荔俱有芬芳桂華之形窅窊然也桂華馮馮翼翼承天之則吾易久逺燭明四極慈惠所愛美若休德杳杳冥冥克綽永福桂華一章十句劉敞曰馮馮翼翼此桂華前章之名也古詩皆有篇名今此獨兩章存郭本至山則一章美芳磴磑即即師象山則嗚呼孝哉案撫戎國蠻夷竭歡象來致福兼臨是愛終無兵革美芳一章八句郭本嗚呼至兵革一章漢書桂華馮馮翼翼至兵革為一章劉奉世曰桂華美芳皆二詩章名本側注在前篇之末傳寫之誤遂以冠後後詞無美芳亦當作美若矣嘉薦芳矣告靈饗矣告靈既饗德音孔臧惟德之臧建侯之常承保天休令問不忘嘉薦芳矣一章八句漢書郭本並同皇皇鴻明蕩蕩休德嘉承天和伊樂厥福在樂不荒惟民之則皇皇鴻明一章六句浚則師德下民咸殖令聞在舊孔容翼翼浚則師德一章四句郭本皇皇至翼翼為一章孔容之常承帝之明下民之樂子孫保康承順溫良受帝之光嘉薦令芳壽考不忘孔容之常一章八句郭本同承帝明德師象山則雲施稱民永受厥福承容之常承帝之明下民安樂受福無疆承帝明德一章八句郭本同漢書皇皇鴻明至受福無疆為一章魏太廟頌三章建安十八年曹操為魏公加九錫始立宗廟令粲作此頌以享其先始名曰顯廟頌後人更今名王粲思皇烈祖時邁其德肇啓洪源貽燕我則我休厥成聿先厥道丕顯丕欽允時祖考綏庶邦和四宇九功僃彛樂序建崇牙設璧羽六佾奏八音舉昭大孝衎妣祖念武功收純祜於穆清廟翼翼休徵祁祁髦士厥德允升懷想成位咸奔在宮無思不若允觀厥崇晉祠廟歌南齊書樂志曰晉泰始中傅玄造玄云登歌歌盛德之功烈故廟異其文饗神猶周頌之有瞽及雍但説祭饗神明禮樂之盛七廟皆用之夏矦湛又造宗廟歌十三篇宋書樂志曰元康中荀蕃受詔成父勗業金石四縣用之郊廟夕牲歌傅玄下同首十一我夕我牲猗歟敬止嘉豢孔時供兹享祀神鑒厥誠博碩斯歆祖考降饗以虞孝孫之心迎送神歌嗚呼悠哉日鑒在兹以時享祀神明降之神明既降既祐饗之胙我無疆受天之祜赫赫太上巍巍聖祖明明烈考丕承繼序征西將軍登歌經始宗廟神明戾止申錫無疆祗承享祀假哉皇祖綏豫孫子燕及後昆錫兹繁祉豫章府君登歌嘉樂肆庭薦祀在堂皇皇宗廟乃祖先皇濟濟辟公相豫蒸嘗享祀不忒降福穰穰肆郭本作在庭晉書作筵先晉書作乃辟一作羣潁川府君登歌於邈先后實司於天顯矣皇祖帝祉肇臻本支克昌資始開元惠我無疆享祀永年祀晉書作祚京兆府君登歌於惟曾皇顯顯令德髙明清亮匪兢柔克保乂命祜基命惟則篤生聖祖光濟四國祜晉書作祐宣皇帝登歌於鑠皇祖聖德欽明勤施四方夙夜敬止載敷文教載揚武烈匡定社稷龔行天罰經始大業造創帝基畏天之命于時保之景皇帝登歌執競景皇克明克哲旁作穆穆惟祗惟畏纂宣之緒耆定厥功登此俊乂糾彼羣凶業業在位帝既勤止維天之命於穆不已文皇帝登歌於穆時晉允文文皇聰明睿智聖敬神武萬幾莫綜皇斯清之虎兕放命皇斯平之柔逺能邇簡授英賢創業垂統勳格皇天虎兕晉書作蛇豕饗神歌二篇曰晉是常享祀時序宗廟致敬禮樂具舉惟其來祭普天率土犧樽既奠清酤既載亦有和羮􅏪羞斯備蒸蒸永慕感時興思登歌奏舞神樂其和祖考來格祐我邦家敷天之下罔不休嘉敷天晉書作溥天肅肅在位濟濟臣工四海來格禮儀有容鐘鼓振管絃理舞開元歌永始神胥樂兮肅肅在位臣工濟濟小大咸敬上下有禮理管絃振鼓鐘舞象德歌詠功神胥樂兮肅肅在位有來雍雍穆穆天子相維辟公禮有儀樂有則舞象功歌詠德神胥樂兮江左宗廟歌晉書樂志曰永嘉之亂海內分崩伶官樂器皆沒於劉石江左初立宗廟尚書下太常祭祀所用樂名太常賀循答云魏氏增損漢樂以為一代之禮未審大晉樂名所以為異遭離喪亂舊典不存然此諸樂皆和之以鐘律文之以五聲詠之以歌亂陳之於舞列宫懸在庭琴瑟在堂八音迭奏雅樂並作登歌下管各有常詠周人之舊也自漢氏巳來依倣此禮自造新詩而巳舊京荒廢今既散亡音韻曲折又無識者則於今難以意言於時以無雅樂器及伶人省太樂並鼓吹令是後頗得登歌食舉之樂猶有未備太寧末明帝又詔阮孚等增益之咸和中成帝乃復置太樂官鳩集遺逸而尚未有金石也庾亮為荆州與謝尚循復雅樂未具而亮薨庾翼桓溫專事軍旅樂器在庫遂至朽壞焉及慕容雋平冉閔兵戈之際而鄴下樂人亦頗有來者永嘉十一年謝尚鎮夀陽於是採拾樂人以備太樂并制石磬雅樂始頗具而王猛平鄴慕容氏所得樂聲又入關右太元中破苻堅又獲其樂工楊蜀等間習舊樂於是四箱金石始備焉乃使曹毗王珣等增造宗廟歌詩然郊祀遂不設樂隋書樂志曰梁武帝云著晉宋史者皆言太元元嘉四年四箱金石大備今檢樂府止冇黃鍾姑洗蕤賔太簇四格而巳六律不具何謂四箱備樂之文其義焉在歌髙祖宣皇帝曹毗下同十首於赫髙祖德協靈符應運撥亂釐整天衢勳格宇宙化動八區肅以典刑陶以玄珠神石吐瑞靈芝自敷肇基天命道均唐虞歌世宗景皇帝景皇承運纂隆洪緒皇維重抗天暉再舉蠢矣二寇擾我揚楚乃整元戎以膏齊斧亹亹神算赫赫王旅鯨鯢既平功冠帝宇歌太祖文皇帝太祖齊聖王猷誕融仁教四塞天基纍崇皇室多難嚴清紫宮威厲秋霜惠過春風平蜀夷楚以文以戎奄有參墟聲流無窮歌世祖武皇帝於穆武皇允龔欽明應斯登禪龍飛紫庭百揆時序聽斷以情殊域既賔偽吳亦平晨流甘露宵映朗星野有擊壤路垂頌聲歌中宗元皇帝運屯百六天羅解貫元皇勃興網籠江漢仰齊七政俯平禍亂化若風行澤猶雨散淪光更耀金輝復煥德冠千載蔚有餘粲網籠郭本作網羅歌肅宗明皇帝明明肅祖闡𢎞帝祚英風夙發清暉載路姦逆縱忒罔式皇度躬振朱旗遂豁天步宏猷淵塞髙羅雲布品物咸寧洪基永固歌顯宗成皇帝於休顯宗道澤玄播式宣德音暢物以和邁德蹈仁匪禮弗過敷以純風濯以清波連理映阜鳴鳳棲柯同規放勛義蓋山河歌康皇帝康帝穆穆仰嗣洪德為而不宰雅音四塞間邪以誠鎮物以默威靜區宇道宣邦國歌孝宗穆皇帝孝宗肅哲休音允臧如彼晨離曜景扶桑垂訓華幄流潤八荒幽讚玄妙爰該典章西平僭蜀北靜舊疆髙猷逺暢朝有遺芳歌哀皇帝於穆哀皇聖心虛逺雅好玄古大庭是踐道尚無為治存易簡化若風行民猶草偃雖曰登遐徽音彌闡愔愔雲韶盡美盡善民一作時歌太宗簡文皇帝王珣下同二首皇矣簡文於昭于天靈明若神周淡如淵沖應其來實與其遷亹亹心化日用不言易而有親簡而可傳觀流彌逺求本逾玄歌烈宗孝武皇帝天鑒有晉欽哉烈宗同規文考玄默允龔威而不猛約而能通神鉦一震九域來同道積淮海雅頌自東氣陶淳露化協時雍四時祠祀歌曹毗肅肅清廟巍巍聖功萬國來賔禮儀有容鐘鼓振金石熙宣兆胙武開基神斯樂兮理管絃有來斯和説功德吐清歌神斯樂兮洋洋玄化潤被九壤民無不恱道無不往禮有儀樂有式詠九功永無極神斯樂兮宋宗廟登歌宋書樂志曰武帝永初元年七月有司奏皇朝肇建廟祀廟設雅樂太常鄭鮮之等八十八人各撰立新歌黃門侍郎王韶之所撰歌辭七首並合施用詔可又有七廟饗神登歌一首併以歌章太后孝建二年十月辛未有司又奏郊廟舞樂皇帝親奉初登壇及入廟詣東壁並奏登歌不及三公行事左僕射建平王宏重參議公卿行事亦宜奏登歌有司又奏元會及二廟齊祠登歌伎舊並於殿庭設作尋廟祠依新儀注登歌人上殿弦管在下今元會登歌人亦上殿弦管在下並詔可北平府君登歌王韶之下同八篇綿綿遐緒昭明載融漢德未逺堯有遺風於穆皇祖永世克隆本支惟慶貽厥靡窮相國掾府君登歌乃立清廟清廟肅肅乃備禮容禮容穆穆顯允皇祖昭是嗣服錫兹繁祉聿懷多福備一作修開封府君登歌四縣既序簫管既舉堂獻六瑚庭萬八羽先王有典克禋皇祖丕顯洪烈永介休祜武原府君登歌鐘鼓喤喤威儀將將溫恭禮樂敬享曾皇邁德垂仁係軌重光天命純嘏惠我無疆敬郭本作致東安府君登歌鑠矣皇祖帝度其心永言配命播兹徽音思我茂猷如玉如金駿奔在陛是鑒是歆孝皇帝登歌蒸哉孝皇齊聖廣淵發祥誕慶景祚自天德敷金石道被管絃有命既集徽風永宣髙祖武皇帝登歌惟天有命眷求上哲赫矣聖武撫運桓撥功並敷土道均汝墳止戈曰武經緯稱文鳥龍失紀雲火代名受終改物作我宋亰至道惟王大業有劭降德兆民升歌清廟七廟享神登歌奕奕寢廟奉璋在庭笙籥既列犧象既盈黍稷匪芳明祀惟馨樂具禮充潔羞薦誠神之格思介以休禎濟濟羣辟永觀厥成七廟迎神辭宋書不載按志竣嘗同荀萬秋竟陵建平王等議樂則此亦當時所製或未施用耳顔竣敬恭明祀孝道感通合樂維和展禮有容六舞肅列九變成終神之來思享兹潔衷靈之往矣綏我家邦世祖廟歌二章世祖孝武皇帝廟歌謝莊下同帝錫二祖長世多祜於穆睿考龔聖承矩玄極弛馭乾紐墜緒闢我皇維締我宗宇刷定四海肇構神京復禮輯樂散馬隳城澤牣九有化浮八瀛慶雲承掖甘露飛甍肅肅清廟徽徽閟宮舞蹈象德笙磬陳風黍稷非盛明德惟崇神其歆止降福無窮龔一作襲宗一作宋宣皇太后廟歌稟祥月輝育德軒光嗣徽媯汭思媚周薑母臨萬宇訓藹紫房朱玄玉籥式載瓊芳章廟舞樂歌辭宋書樂志曰文帝章太后廟未有樂章孝武大明中使尚書左丞殷淡造新歌明帝又自造昭太后宣太后歌詩又曰章廟樂舞雜歌悉同用太廟辭惟三后别撰隋書樂志曰梁天監元年周捨議曰禮尸出入奏肆夏賔入大門奏肆夏牲出入奏昭夏宋季失禮神入廟門遂奏昭夏乃以牲牢之樂用接祖宗之靈斯皆前代之深疵當今所宜改也肅咸樂夕牲賔出入奏殷淡下同九首彛承孝典恭事嚴聖浹天奉賮罄壤齊慶司儀具序羽容夙彰芬枝揚烈黼構周張助寶奠軒酎珍充庭璆縣凝會琄朱佇聲先期選禮肅若有承祗對靈祉皇慶昭膺禮一作會尊事威儀輝容昭敘迅恭神明粢盛牲爼肅肅嚴宮藹藹崇基皇靈降祉百祇具司戒誠望夜端列承朝依微昭旦物色輕宵鴻慶遐鬯嘉薦令芳翊帝明德永祚流光引牲樂牲出入奏維誠潔饗維孝奠靈敬芬黍稷敬滌犧牲騂繭在豢載溢載豐以承宗祀以肅皇衷蕭芳四舉華火周傳神監孔昭嘉是柔牷嘉薦樂薦豆呈毛血奏肇禋戒祀禮容咸舉六典飭文九司昭序牲柔既昭犧剛既陳恭滌惟清敬事惟神加籩再御兼俎重薦節動軒越聲流金縣奕奕閟幄亹亹嚴闈潔誠夕鑒端服晨暉聖靈戾止翊我皇則上綏四宇下洋萬國永言孝饗孝饗有容儐僚贊列肅肅雍雍齊樂用此分奕奕為一章昭夏樂迎神奏閟宮黝黝復殿微微璿除肅照釭璧彤輝黼帟神凝玉堂嚴馨圜火夕耀方水朝清金枝委樹翠鐙佇縣停波澄宿華漢浮天恭事既夙虔心有慕仰降皇靈俯寧休祚永至樂皇帝入廟北門奏漢書禮樂志曰皇帝入廟門奏永至以為行步之節猶古采齊肆夏也皇明鬯矣孝容以昭鑾華羽迾拂漢涵滈申申嘉夜翊翊休朝行金景送步玉風韶師承祀則肅對禋祧明一作朝滈一作登歌太祝祼地奏帝容承祀練時涓日九重徹關四靈賔至肅倡函音庶旄委佾休靈告饗嘉薦尚芬玉瑚飾列桂簋昭陳具司選禮翼翼振振祼崇祀典酎恭孝時禮無爽物信靡愧辭精華孚鬯誠監昭通升歌翊節下管調風皇心履變敬明尊親大哉孝德至矣交神章德凱容樂舞歌章太后神室奏幽瑞浚靈表彰嬪聖翊載徽文敷光崇慶上緯纒祥中維飾詠永屬輝猷聨昌景命昭德凱容樂舞歌昭太后神室奏明帝下同二首表靈躔象纘儀緯風膺華丹耀登瑞紫穹訓形霄宇武彰宸宮騰芬金會寫德聲容宣德凱容樂舞歌宣太后神室奏天樞凝耀地紐麗輝聨光騰世炳慶翔機薰藹中宇景躔上微玉頌縷德金籥傳徽嘉胙樂舞辭皇帝還東壁受福酒奏殷淡下同四首禮薦洽福時昌皇聖膺嘉祐帝業凝休祥居極乘景運宅德瑞中王澄明臨四表精華延八鄉洞海周聲惠徹宇麗乾光靈慶纒世祉鴻烈永無疆時齊作祚昭夏樂舞歌送神奏二章大孝備盛禮豐神安留嘉樂充旋駕聳泛青穹延八虛闢四空藹流景肅行風昭融教緝風度戀皇靈結深慕解羽縣輟華樹偕琁除端玉輅流汪濊慶國步偕一作背休成樂歌皇帝詣便殿奏漢書禮樂志曰登歌再終下奏休成之樂美神明既饗也釃醴具登嘉俎咸薦饗洽誠陳禮周樂遍祝辭罷祼序容輟縣蹕動端庭鑾回嚴殿神儀駐景華漢亭虛八靈業衛三祇解途翠蓋耀澄罼奕凝宸玉鑣息節金輅懷音式誠逺孝底心肅感追憑皇鑒思承淵範神錫懋祉四緯昭明仰福帝徽俯齊庶生耀澄齊書作澄耀凝宸作凝晨古樂苑卷四
