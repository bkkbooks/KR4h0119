body:
  text: 古樂苑衍録卷二明梅鼎祚編總論原古聲律體例品藻名義九代詠歌志合文財黃歌斷竹質之至也唐歌在昔則廣於黃世虞歌卿雲文於唐時夏歌雕墻縟於虞代商周篇什麗於夏年至於序志述時其揆一也文心雕龍以下原古昔在陶唐德盛化鈞野老吐何力之談郊童含不識之歌有虞繼作政阜民安南風詩於元后爛雲歌於列臣盡其美者何乃心樂而聲泰也同上卿雲江水開雅頌之源蒸民麥秀建國風之始覽其事迹興廢如存占彼民情困舒在目則知詩者所以宣玄鬱之思光神妙之化者也先王協之於宫徵被之於簧絃奏之於郊社頌之於宗廟歌之於燕會諷之於房中蓋以之可以格天地感鬼神揚風教通庶情此古詩之大約也漢祚鴻朗文章作新安世楚聲溫純厚雅孝武樂府壯麗宏竒縉紳先生咸從附作雖規迹古風各懷剞劂美哉歌詠漢德雍揚可為雅頌之嗣也及夫興懷觸感民各有情賢人逸士呻吟於下里棄妻思婦歎詠於中閨鼓吹奏乎軍曲童謠發於閭巷亦十五國風之次也東京繼軌大演五言而歌詩之聲微矣至於含氣布詞質而不采七情雜遣並自悠圓或間有微疵終難毁玉兩京詩法譬之伯仲塤箎所以相成其音調也魏氏之學獨專其盛然國運風移古朴易解曹王數子才氣慷慨不詭風人而特立之功卒亦未至故時與之暗化矣徐禎卿談藝録虞之賡歌夏五子之歌此三百篇之權輿也困學紀聞夏侯太初辨樂論伏羲有網罟之歌神農有豐年之詠黃帝有龍衮之頌元次山補樂歌有網罟豐年二篇文心雕龍云二言肇於黃世竹彈之謠是也同上劉協云鈞天九奏既其上帝葛天八闋爰乃皇時咸英以降塗山歌於候人始為南音有娀謠乎飛燕始為北音夏甲歎於東陽東音攸發殷釐思于西河西音以興又寧封南風沙瀾方回諸篇皆音樂之祖也仲尼學文王伯牙作水仙操亦不始於漢魏矣解頥新語古詩三百可以博其源遺篇十九可以約其趣樂府雄髙可以厲其氣離騷深永可以禆其思談藝録以時而論則有建安體漢末年號曹子建父子及鄴中七子之詩黃初體魏年號與建安相接其體一也正始體魏年號嵇阮諸公之詩太康體晉年號左思潘嶽二張二陸諸公之詩元嘉體宋年號顔鮑謝諸公之詩永明體齊年號齊諸公之詩齊梁體通兩朝而言之南北朝體通魏周而言之與齊梁體一也陶體淵明也謝體靈運也徐庾體徐陵庾信也又有所謂選體選詩時代不同體制隨異今人例用五言古詩為選體非也柏梁體漢武帝與羣臣共賦七言每句用韻後人謂此體為柏梁體玉臺體玉臺集乃徐陵所序漢魏六朝之詩皆有之或者但謂􅊏豔者為玉臺體其實則不然宫體梁簡文傷於輕靡時號宫體其他體製尚或不一然大概不出此耳有三句之歌高祖大風歌是也古華山畿二十五首多三句之詩其他古人詩多如此者有兩句之歌荆卿易水歌是也又古詩青驄白馬共戲樂女兒子之類皆兩句之嗣也有一句之歌漢書枹鼓不鳴董少平一句之歌也又漢童謠千乘萬騎上北邙梁童謠青絲白馬壽陽來皆一句也有歌行古有鞠龍行放歌行長歌行短歌行又有單以歌名者不可枚述有樂府漢武帝定郊祀立樂府採齊楚趙魏之聲以入樂府以其音詞可被於絃歌也樂府俱備衆體兼統衆名也有楚辭屈原以下倣楚詞者皆謂之楚詞有琴操古有水仙操辛德源所作别鶴操髙陵牧子所作有謠沈炯冇獨酌謠王昌齡有箜篌謠穆天子傳有白雲謠也曰吟古辭有隴頭吟孔明有梁父吟相如有白頭吟曰辭選有漢武秋風辭樂府有木蘭辭曰引古曲有霹靂引走馬引飛龍引曰詠選有五君詠唐儲光羲有羣鳩詠曰曲古有大堤曲梁簡文有烏棲曲曰篇選有名都篇京洛篇白馬篇曰唱魏明帝有氣出唱曰弄古樂府有江南㺯又有以歎名者古辭有楚妃歎明君歎以愁名者文選有四愁樂府有獨處愁以哀名者選有七哀少陵有八哀以怨名者古詞有寒夜怨玉階怨以思名者太白有靜夜思以樂名者齊武帝有估客樂宋臧質有石城樂有古詩一韻兩用者文選曹子建美女篇有兩難字謝康樂述祖德詩有兩人字其後多有之有古詩一韻三用者文選任彥升哭范僕射詩三用情字也有古詩三韻六七用者古焦仲卿妻是也有古詩重用二十許韻者焦仲卿妻詩是也有古詩旁取六七許韻者韓退之此日足可惜篇是也凡雜用東冬江陽庚青六韻歐陽公謂退之遇寬韻則故旁入他韻非也此乃用古韻耳於集韻自見之有古詩全不押韻者古採蓮曲是也論雜體則有風人上句述一語下句釋其義如古子夜歌讀曲歌之類則多用此體藁砧古樂府藁砧今何在山上復有山何當大刀頭破鏡飛上天僻辭隱語也五雜俎見樂府兩頭纎纎亦見樂府下滄浪詩法以體例尋二言肇於黃世竹彈之謠是也三言興於虞時元首之詩是也四言廣於夏年洛汭之歌是也五言見於周代行露之章是也六言七言雜出詩騷而體之篇成於兩漢文心雕龍黃帝彈歌斷竹兏木飛土逐肉二言之始也詩頌振振鷺鷺于飛鼓咽咽醉言歸三言之始也鬱陶乎豫心顔厚有忸怩五言之始也詩雅我不敢效我友自逸八言之始也杜詩男兒生不成名身已老九言也李太白黃帝鑄鼎於荆山鍊丹砂丹成騎龍飛上太清家十言也東坡詩山中故人應有招我歸來篇十一言也我不敢效我友自逸亦可作兩句若長吉酒不到劉伶墳上土八言一句渾全升菴集又曰江有汜乃三言之始逮天馬歌體製僃矣嚴滄浪謂創自夏侯湛蓋泥於白氏六帖困學紀聞始馮惟訥曰按三言天馬似矣江有泛亦非純體曷謂始耶又曰四言體始於康衢歌滄浪謂起於韋孟誤矣同上馮惟訥曰按四言詩三百五篇在前而嚴云起於韋孟蓋其敘事布辭自為一體漢魏以來遞相師法故云始於韋非徒言也或又引康衢以為權輿又烏知康衢之謡非列子因雅頌而為之者邪然明良五子之歌載在典謨可徴也漢初四言韋孟首唱匡諫之義繼軌周人孝武愛文相梁列韻嚴馬之徒屬辭無方至成帝品録三百餘篇朝章國采亦云周僃而辭人遺翰莫見五言所以李陵班婕妤見疑於後代也按召南行露始肇半章孺子滄浪亦有全曲暇豫優歌逺見春秋邪徑童謠近在成世閲時取證則五言久矣文心雕龍李文選注五言自陵始麈史曰王得仁謂七言始於垓下歌柏梁篇祖之劉氏以交交黃鳥止於桑為七言之始合兩句為一誤矣大雅曰維昔之富不如時頌曰學有緝熙於光明此七言之始王氏亦誤矣蓋始於擊壤歌帝力於我何有哉雅頌之後有南山歌子産歌採葛婦歌易水歌皆有七言而未成篇及大招百句小招七十句七言巳盛於楚矣詩家直説皆馮惟訥曰按諸家所論七言詩始惟垓下為近之他雜出一二言未為全體至於如寧戚扣牛所歌高誘注國語以為碩鼠之詩雖未必然亦足以明南山白石之篇誘時未嘗有也他如列子擊壤孔叢子大道歌續博物志狄水歌拾遺記寧封子詩皇娥歌白帝子答歌皆出於著書者之手其文義各自為體而辭義深淺居然有别至吳越春秋所載窮劫之曲采葛婦歌河梁之詩尤淺劣不足道而近時論詩者遂引以為據辨七言不始於柏梁亦何以稱知言也胡致堂云古樂府者詩之旁行也辭曲者古樂府之末造也困學紀聞陸務觀云倚聲製詞起於唐之季世同上古今詩體不一太師之職掌教六詩風雅頌賦比興僃焉三代而下雜體互出漢唐以來鐃歌鼓吹拂舞矛俞因斯而興晉宋以降又有回文反復寓憂思輾轉之情雙聲疉韻狀連駢嬉戲之態郡縣藥石名六甲八卦之屬不勝其變古有采詩官命曰風人以見風俗喜怒好惡皮日休云踈杉低通灘冷鷺立亂浪此雙聲也陸龜蒙嘗曰膚愈吳都姝眷戀便殿宴此疉韻也劉禹錫曰東邉日出西邉雨道是無情却有情杜詩曰俱飛蛺蝶元相逐並蒂芙蓉夲自雙又曰滿目飛明鏡歸心折大刀此皆風人類也珊瑚鈎詩話詩曰我歌且謠樂府載歌謠而不及諺語如夏諺齊語皆有聲韻三字如爰清靜作符命能賦詩裴讓之四字如雖有智慧不如乘勢寧為雞口亡為牛後之類五字如城中好髙髻四方髙一尺城中好廣眉四方且半額城中好大袖四方全匹帛之類七字如嘉言逆耳利於行良藥苦口利於病欲之仲桓問任安居今行古任定祖甑中生塵范史雲釡中生魚范萊蕪之類並詩之流也解頥新語釋家者流東國結韻以成詠西方作偈以和聲奏歌於金石則謂之為樂纘法於管絃則稱之為唄曹子建既通般遮之瑞響復感漁山之神製厥後玄師梵唱赤鷹愛而不移比丘流響青鳥悅而忘翥曇憑動韻猶令象馬踡局僧辨折調尚使鴻鶴停飛又若道家鈞天之奏瓊笈之章詞著步虛歌成遍疉皆詩之餘也同上詩迄于周離騷迄于楚是後之流為二十四名賦頌銘贊誄針詩行詠吟題怨歌章篇操引謠謳歌曲詞調皆詩人六義之餘劉補闕云樂府肇於漢魏按仲尼學文王操伯牙作水仙操則不於漢魏而後始亦以明矣元禎自序樂府又馮惟訥曰按琴操肇於上古如神人暢南風歌之類在仲尼前但今所傳之曲未必盡出於古耳樂府之名自興於漢何得以此相掩耶以下名義守法度曰詩載始末曰引體如行書曰行放情曰歌行間之曰歌行悲如蟲螿曰吟通乎俚俗曰謠委曲盡情曰曲白石詩説詩家名號區别種種原其大義固自同歸歌聲雜而無方行體疏而不滯吟以呻其鬱曲以導其微引以抽其意詩以言其情故名因昭象合是而觀則情之體僃矣夫情既異其形故辭當因其勢譬如寫物繪色倩眄各以其狀隨規逐矩圓方巧獲其則此乃因情立格持守圍環之大略也若夫神工哲匠顛倒經樞思若連絲應之杼軸文如鑄冶逐手而遷從衡參互恆度自若此心之伏機不可強能也談藝録刺美風化緩而不迫謂之風采托事物摛華布體謂之賦推明政治莊語得失謂之雅形容盛德揚厲休功謂之頌幽憂憤悱寓之比興謂之騷感觸事物託於文章謂之辭程事較功考實定名謂之銘援古刺今針戒得失謂之針猗迂抑揚永言謂之歌非鼓非鐘徒歌謂之謠步驟馳騁斐然成章謂之行品秩先後敘而推之謂之引聲音雜比髙下短長謂之曲吁嗟慨歎悲憂深思謂之吟吟詠情性總而言志謂之詩蘇李而上髙簡古淡謂之古沈宋而下法律精切謂之律此詩之衆體也珊瑚鈎詩話由操而下八名引謠謳歌曲辭調皆起於郊祭軍賓吉凶苦樂之際審聲以度詞審調以節唱句度長短之數聲律平上之差莫不由之凖度而又區别其在琴瑟者為操引採民氓者為謳謠備曲度者總為之新曲詞調斯皆由樂以定詞非選詞以配樂也由詩而下九名行詠吟題怨歎章篇皆屬事而作雖題號不同悉謂之詩可也後之審樂者往往採取其詞度為新曲蓋選詞以配樂非由樂以定詞也纂撰者盡編為樂府解頥新語梁元帝賦得蘭澤多芳草詩古詩為題見於此困學紀聞馮惟訥曰今按劉琨有胡姬年十五沈約有江籬生幽渚皆在元帝前擬古題如西北有髙樓青青河畔草之類樂府題冉冉孤生竹棗下何纂纂之類省試題用事如吳宫教戰湘靈鼓瑟之類用句如風動萬年枝玉水記方流之類即景如御溝新栁龍池春早之類又如薛道衡昔昔鹽沈休文東陽八詠後人每句賦之矣解頥新語樂府則郊廟燕射鼓吹橫吹樂則有雅樂凱樂散樂俳樂舞則有文舞武舞雅舞雜舞又鼙鐸羽籥巾帗干旄白紵皇人之舞歌則有倚歌雜歌豔歌踏歌相和之歌曲則有今曲舞曲文曲清商調則有平調側調清調商調楚調瑟調聲則有正聲送聲間絃契注同上古今樂録曰傖歌以一句為一解中國以一章為一解王僧虔啓曰古曰章今曰解解有多少當是先詩而後聲詩敘事聲成文必使志盡於詩音盡於曲是以作詩有豐約制解有多少又諸曲調皆有辭有聲而大曲又有豔有趨有亂辭者其歌詩也聲者若羊吾夷伊那何之類也豔在曲之前趨與亂在曲之後亦有吳聲西曲前有和後有送也楊慎曰按豔在曲之前與吳聲之和若今之引子趨與亂在曲之後與吳聲之送若今之尾聲羊吾夷伊那何皆聲之餘音嫋嫋有聲無字雖借字作譜而無義若今之哩囉嗹唵唵吽也知此可以讀古樂府矣古者詩頌皆被之金竹故非調五音無以諧會若置酒髙堂上明月照髙樓為韻之首三祖之詞文或不工而韻入歌唱此重音韻之義也與世之言宫商異矣今既不被管絃亦何取於聲律耶齊有王元長者嘗謂余云宫商與二儀俱生自古辭人不知之唯顔憲子乃云律吕音調而其實大謬唯見范曄謝莊頗識之耳常欲進知音論未就王元長創其首謝朓沈約揚其波三賢或貴公子孫幼有文辨於是士流景慕務為精密襞積細微專相凌架故使文多拘忌傷其真美余謂文製本須諷讀不可蹇礙但令清濁通流口吻調利斯為足矣文心雕龍律以下聲鄭漁仲謂樂以詩為本詩以聲為用又謂古之詩今之辭曲也若不能歌之但能誦其文而説其義可乎不幸世儒義理之説日勝而聲歌之學日微馬貴與則謂義理布在方册聲則湮沒無聞其言皆有見而朱文公亦謂聲氣之和有不可得而聞者此讀詩之所以難也夫樂之義理詩詞是也聲歌猶後世之腔調也兩者俱詣乃為大成漁仲又謂樂之失自漢武始蓋言亡其聲耳漢世樂府如朱鷺君馬黃雉子班等曲其辭皆存而不可讀想當時自有節拍短長髙下故可合于律吕後來擬作者但詠其名物詞雖有倫恐非樂府之全也且唐世之樂章即今之律詩而李太白立進清平調與王維之陽關曲于今皆在不知何以被之弦索宋之小詞今人亦不能歌矣今人能歌元曲南北詞皆有腔拍如月兒髙黃鶯兒之類亦有律吕可按一入于耳即能辨之恐後世一失其聲亦但詠月詠鶯而已此樂之所以難也求元審聲宿悟神解者世合有異材耳陸文裕公外集周官鞮鞻氏掌四夷之樂與其聲歌東方曰韎南方曰任西方曰侏離北方曰禁文心雕龍云塗山歌於候人始為南音有娀謠乎飛燕始為北聲夏甲歎於東陽東音以發殷氂思於西河西音以興是四方皆有音也今歌曲但統為南北二音如伊州涼州甘州渭州夲是西音今並以為北曲由是觀之則擊壤康衢卿雲南風白雲黃澤之類詩之篇什漢之樂府下逮關鄭白馬之撰雖詞有雅鄭並北音也若南音則孺子接輿越人紫玉吳歈楚艷以及今之戲文皆是然三百篇無南音周南召南皆北方也真珠船漢樂府真情自然但不能中節爾纍度乃是好景詩譜以下品藻三國六朝樂府猶有真意勝於當時文人之詩同上古辭之不可讀者莫如巾舞歌文義漫不可解又古將進酒芳樹石流豫章行等篇皆使人讀之茫然又朱鷺雉子班艾如張思悲翁上之回等只二三句可解豈非歲久文字舛訛而然耶晉書樂志古辭紫騮馬歌曰燒火燒野田野鴨飛上天折楊栁行曰默默施行違厥罰隨事來魏武帝陌上桑曰駕虹霓乘赤雲登彼九疑厯玉門嵇康秋胡行曰思與王喬乘雲遊八極古人命題措辭如此歐陽公曰小雅雨無正之名據序所言與詩絶異當闕其所疑詩家直説齊梁以來文士喜為樂府辭然沿襲之久往往失其命題本意烏將八九子但詠烏雉朝飛但詠雉雞鳴髙樹巔但詠雞大抵類此而甚有併其題失之者如相府蓮訛為想夫憐楊婆兒訛為楊叛兒之類是也蓋辭人例多事語言不復詳研考雖李白亦不免此惟老杜兵車行悲青坂無家别等數篇皆因事自出巳意立題略不更蹈前人陳迹真豪傑也同上魏文帝曰梧桐攀鳳翼雲雨散洪池曹子建曰遊魚潛緑水翔鳥薄天飛阮籍曰存亡有變化日月有浮沈張華曰洪鈞陶萬類大塊稟羣生左思曰皓天舒白日靈景耀神州張協曰金風扇素節丹霞啓隂期潘嶽曰南陸迎修景朱明送末埀陸機曰逝矣經天日悲哉帶地川以上雖為律句全篇髙古及靈運古律相半至謝朓全為律矣升菴詩話五言律起句最難六朝人稱謝朓工於發端如大江流日夜客心悲未央雄壓千古矣唐人多以對偶起雖森嚴而乏髙古宋周伯弜選唐三體詩取起句之工者二酒渴愛江清餘酣潄晚汀又江天清更愁風栁入江樓是也語誠工而氣衰颯余愛栁惲汀洲采白蘋日落江南春吳均咸陽春草芳秦帝捲衣裳又春從何處來拂水復驚梅梁元帝山髙巫峽長埀栁復垂楊唐蘇頲北風吹早雁日日渡河飛張柬之淮南有小山嬴女隱其間王維風徑角弓鳴將軍獵渭城杜子美將軍膽氣雄臂懸兩角弓孟浩然八月湖水平涵虛混太清雖律也而含古意皆起句之妙可以為法何必效晚唐哉伯弜之見誠小兒也同上古今詩人以詩名世者或只一句或只一聫或只一篇雖其餘别有好詩不專在此然播傳後世膾炙於人口者終不出此夫豈在多哉如池塘生春草則謝康樂也澄江靜如練則謝宣城也壠首秋雲飛則栁吳興也風定花猶落則謝元正也鳥鳴山更幽則王文海也空梁落燕泥則薛道衡也楓落吳江冷則崔信明也庭草無人隨意緑則王胄也凡此皆以一句名世者苕溪漁隱叢話古樂府暫出白門前楊栁可藏烏歡作沈水香儂作博山罏李白用其意衍為楊叛兒歌曰君歌楊叛兒妾勸新豐酒何許最關情烏啼白門栁烏啼隱楊花君醉留妾家博山罏中沈香火雙煙一氣凌紫霞古樂府朝見黃牛暮見黃牛三朝三暮黃牛如故李白則云三朝見黃牛三暮行太遲三朝又三暮不覺鬢成絲古樂府云郎今欲渡畏風波李白云郎今欲渡緣何事如此風波不可行古樂府云春風復多情吹我羅裳開李反其意云春風復無情吹我夢魂散古人謂李詩出自樂府古選信矣其楊叛兒一篇即暫出白門前之鄭箋也因其拈用而古樂府之意益顯其妙益見如李光弼將子儀軍旗幟益精明又如神僧拈佛祖語信口無非妙道豈若後世生吞義山拆洗杜詩者比乎升菴詩話古樂府如護惜加窮袴防間托守宫朔氣傳金柝寒光透鐵衣殺氣朝朝衝塞門胡風夜夜吹邉月全是唐律藝范巵言上山採蘼蕪四坐且莫喧悲與親友别穆穆清風至橘柚垂華實十五從軍征青青園中葵雞鳴髙樹顛日出東南隅相逢狹路間昭昭素明月昔有霍家奴洛陽城東路飛來雙白鵠翩翩堂前燕青青河邉草悲歌緩聲八變豔歌紈扇篇白頭吟是兩漢五言神境可與十九首蘇李並驅同上次有輕薄之徒笑曹劉為古拙謂鮑照羲皇上人謝朓今古獨步而師鮑照終不及日中市朝滿鮑照結客少年場行學謝朓劣得黃鳥度青枝虞炎玉偕怨徒自棄於髙聽無涉於文流矣詩品擬古樂府如郊祀房中須極古雅發以峭峻鐃歌諸曲勿便可解勿遂不可解須斟酌淺深質文之間漢魏之辭務尋古色相和瑟曲諸小調係北朝者勿使勝質齊梁以後勿使勝文近事毋俗近情毋纎拙不露態巧不露䀶寧近無逺寧朴無虛有分格有來委有實境一涉議論便是鬼道藝苑巵言七言歌行靡非樂府然至唐始暢其發也如千鈞之弩一舉透革縱之則文漪落霞舒卷絢爛一入促節則凄風急雨窈冥變幻轉折頓挫如天驥下坂明珠走盤收之則如櫜聲一擊萬騎忽斂寂然無聲古樂府選體歌行有可入律者有不可入律者句法字法皆然惟近體必不可入古耳同上剽竊模擬詩之大病亦有神與境觸師心獨造偶合古語者如客從逺方來白楊多悲風春水船如天上坐不妨俱美定非竊也其次裒覽既富機鋒亦圓古語口吻間若不自覺如鮑明逺客行有苦樂但問客何行之於王仲宣從軍有苦樂但問所從誰陶淵明雞鳴桑樹顛狗吠深巷中之於古樂府雞鳴髙樹顛狗吠深宫中王摩詰白鷺黃鸝近世獻吉用修亦時失之然尚可言又有全取古文小加裁剪如黃魯直宜州用白樂天諸絶句王半山山中十日雨雨晴門始開坐看蒼苔色欲上人衣來後二句全用輞川已是下乘然猶彼我趣合未致足厭乃至割綴古語用文巳漏痕迹宛然如河分岡勢春入燒痕之類斯醜方極摹擬之妙者分岐逞力窮勢盡態不唯敵手兼之無迹方為得耳若陸機辨亡傅玄秋胡近日獻吉打鼓鳴鑼何處船語令人一見匿笑再見匿噦皆不免為盜跖優孟所訾同上古樂苑衍録卷二
