body:
  text: 古樂苑卷十五明梅鼎祚編相和歌辭相和曲四弦曲吟歎曲相和曲二雞鳴樂府題解曰古詞雞嗚初言天下方太平次言置酒作樂終言桃傷李仆喻兄弟當相為表裏三人近侍榮耀道路與相逢狹路間行同詩紀云此詩前後辭不相屬蓋采詩入樂合而成章邪抑有錯簡紊誤也又有雞鳴髙樹巔出此古辭雞鳴髙樹巔狗吠深宮中蕩子何所之天下方太平刑法非有貸柔協正亂名此上疑别一曲黃金為君門碧玉為軒堂上有雙樽酒作使邯鄲倡劉王碧青甓後出郭門王舍後有方池池中雙鴛鴦鴛鴦七十二羅列自成行鳴聲何啾啾聞我殿東廂兄弟四五人皆為侍中郎五日一時來觀者滿路傍黃金絡馬頭熲熲何煌煌桃生露井上李樹生桃傍蟲來齧桃根李樹代桃殭樹木身相代兄弟還相忘右一曲魏樂所奏雞鳴篇郭左並作劉孝威藝文作簡文帝劉孝威塒雞識將曙長鳴髙樹巔啄葉疑障羽桃花強欲前意氣多驚舉飄揚獨無侣陳思助鬬協狸膏郈昭妬敵安金距丹山可愛有鳳皇金門飛舞有鴛鴦何如五德美豈勝千里翔同前隋岑德潤鐘響應繁霜晨雞錦臆張簾迥猶侵露枝髙巳映光排空下朝揭奮翼上花場雨晦思君子關開脫孟嘗既得依雲外安用集陳倉雞鳴髙樹巔梁簡文帝碧玉好名倡夫壻侍中郎桃花全覆井金門半隱堂時欣一來下復比雙鴛鴦雞鳴天尚早東烏定未光晨雞髙樹鳴詩紀云阮籍詠懷詩晨雞鳴髙樹命駕起旋歸則此非樂府也解題亦云出雞鳴古辭似誤陳張正見晨雞振翮鳴出迥擅竒聲蜀郡隨金馬天津應玉衡摧冠驗逺石繫火出連營爭棲斜揭暮解翼橫飛度試飲淮南藥翻上仙都樹枝低且候潮葉淺還承露承露觸嚴霜華淺伺朝陽猜羣怯寶劒勇戰出花場當損黃金距誰論白玉璫長鳴逢晉帝恃氣遇周王流名説魯國分影入陳倉不復愁苻朗猶能感孟嘗烏生一曰烏生八九子樂府解題曰古辭言烏母子本在南山巖石間而來為秦氏彈丸所殺白鹿在苑中人得以為脯黃鵠摩天鯉在深淵人得而烹煮之則夀命各有定分死生何待前後也古辭烏生八九子端坐秦氏桂樹間唶我秦氏家有遊遨蕩子工用睢陽強蘇合彈左手持強彈兩丸出入烏東西唶我一丸即發中烏身烏死魂魄飛揚上天阿母生烏子時乃在南山巖石間唶我人民安知烏子處蹊徑窈窕安從通白鹿乃在上林西苑中射工尚復得白鹿脯唶我黃鵠摩天極髙飛後宮尚復得烹煮之鯉魚乃在洛水深淵中釣鈎尚得鯉魚口唶我人民生各各有夀命死生何須復道前後右一曲魏晉樂所奏烏生八九子城上烏出此梁劉孝威城上烏一年生九雛枝輕巢本狹風多葉早枯氄毛不自暖張翼強相呼金柝嚴兮翠樓肅蜃壁光兮椒泥馥虞機衡網不得施猜鷹鷙隼無由逐永願共栖曾氏冠同瑞周王屋莫啼城上寒猶賢野間宿羽成翮備各西東丁年賦命有窮通不見髙飛帝輦側逺託日輪中尚逢王吉箭猶嬰夏羿弓豈如變彩救燕質入夢祚昭公留聲表師退集幕示營空靈臺已鑄像流蘇時候風城上烏梁吳均嗚嗚城上烏翩翩尾畢逋凡生八九子夜夜啼相呼質微知慮少體賤毛衣粗陛下三萬嵗臣至執金吾同前朱超朝飛集帝城猶帶夜啼聲近日毛雖暖聞弦心尚驚平陵東崔豹古今注曰平陵東漢翟義門人所作樂府解題曰義丞相方進少子為東郡太守以王莽方篡漢舉兵誅之不克見害門人作歌以怨之也古辭平陵東松柏桐不知何人劫義公劫義公在髙堂下交錢百萬兩走馬兩走馬亦誠難顧見追吏心中惻心中惻血出漉歸告我家賣黃犢右一曲魏晉樂所奏同前魏陳思王植閶闔開天衢通被我羽衣乘飛龍乘飛龍與仙期東上蓬萊採靈芝靈芝採之可服食年若王父無終極若一作與陌上桑一曰豔歌羅敷行古今樂録曰陌上桑歌瑟調古辭豔歌羅敷行日出東南隅篇崔豹古今注曰陌上桑者出秦氏女子秦氏邯鄲人有女名羅敷為邑人千乘王仁妻王仁後為趙王家令羅敷出採桑於陌上趙王登臺見而恱之因置酒欲奪焉羅敷乃彈箏作陌上桑之歌以自明趙王乃止樂府解題古詞言羅敷採桑為使君所邀盛誇其夫為侍中郎以拒之與前説不同又有採桑亦出於此古辭日出東南隅照我秦氏樓秦氏有好女自名為羅敷羅敷喜蠶桑採桑城南隅青絲為籠係桂枝為籠鈎頭上倭墮髻耳中明月珠緗綺為下裙紫綺為上襦行者見羅敷下擔捋髭鬚少年見羅敷脫帽著帩頭耕者忘其犂鋤者忘其鋤來歸相怨怒但坐觀羅敷一解使君從南來五馬立踟蹰使君遣吏往問是誰家姝秦氏有好女自名為羅敷羅敷年幾何二十尚不足十五頗有餘使君謝羅敷寧可共載不羅敷前置辭使君一何愚使君自有婦羅敷自有夫二解東方千餘騎夫壻居上頭何用識夫壻白馬從驪駒青絲繫馬尾黃金絡馬頭腰中鹿盧劒可直千萬餘十五府小史二十朝大夫三十侍中郎四十専城居為人潔白晳鬑鬑頗有鬚盈盈公府步冉冉府中趨坐中數千人皆言夫壻殊三解後前有豔歌曲有辭右一曲魏晉樂所奏宋書作大曲同前楚辭鈔今有人山之阿被服薜荔帶女蘿既含睇又宜笑子戀慕豫善窈窕乘赤豹從文狸辛夷車駕結桂旗被石蘭帶杜衡折芳拔荃遺所思處幽室終不見天路險艱獨後來表獨立山之上雲何容容而在下杳冥冥羌晝晦東風飄颻神靈雨風瑟瑟木㮴㮴思念公子徒以憂右一曲魏晉樂所奏同前魏武帝駕虹霓乘赤雲登彼九疑歷玉門濟天漢至崑崙見西王母謁東君交赤松及羡門受要祕道愛精神食芝英飲醴泉柱杖桂枝佩秋蘭絶人事遊渾元若疾風遊歘飄飄景未移行數千夀如南山不忘愆飄一作翩所右一曲晉樂奏同前魏文帝棄故鄉離室宅逺從軍旅萬里客披荆棘求阡陌側足獨窘步路局苲虎豹嘷動雞驚禽失羣鳴相索登南山奈何蹈盤石樹木叢生鬱差錯寢蒿草蔭松柏涕泣雨面霑枕席伴旅單稍稍日零落惆悵竊自憐相痛惜右一曲魏晉樂所奏同前見太平御覽陳思王植望雲際有真人安得輕舉繼清塵執電鞭騁飛麟闕同前梁吳均嫋嫋陌上桑蔭陌復垂塘長條映白日細葉隱鸝黃蠶飢妾復思拭淚且提筐故人寧知此離恨煎人腸同前一作周王褒王筠人言陌上桑未曉已含光重重相蔭映軟軟自芬芳秋胡方倚馬羅敷未滿筐春蠶朝已老安得久倣徨軟軟一作軟弱方一作始同前二首一云採桑郭本前首作王臺卿左本後作王筠蕭子顯令月開和景處處動春心挂筐須葉滿息倦重枝陰日出秦樓明條垂露尚盈蠶飢心自急開奩粧不成同前四首王臺卿鬱鬱陌上桑盈盈陌上女送君上河梁拭淚不能語鬱鬱陌上桑遙遙山下蹊君去戍萬里妾來守空閨鬱鬱陌上桑皎皎雲間月非無巧笑姿皓齒為誰發鬱鬱陌上桑裊裊機頭絲君行亦宜返今夕是何時豔歌行晉傅玄日出東南隅照我秦氏樓秦氏有好女自字為羅敷首戴金翠飾耳綴明月珠白素為下裾丹霞為上襦一顧傾朝市再顧國為虛問女居安在堂在城南居青樓臨大巷幽門結重樞使君自南來駟馬立踟蹰遣吏謝賢女豈可同行車斯女長跪對使君言何殊使君自有婦賤妾有鄙夫天地正厥位願君改其圖同前陳張正見城隅上朝日斜暉照杏梁併倦茱茰帳爭移翡翠牀縈環聊向牖拂鏡且調粧裁金作小靨散麝起微黃二八秦樓女三十侍中郎執戟超丹地豐貂入建章未安文史閣獨結少年場彎弓貫月影學劒動星芒翠蓋飛城曲金鞍橫道傍調鷹向新市彈雀往睢陽行行稍有極暮暮歸蘭房前瞻富羅綺左顧足鴛鴦蓮舒千葉氣燈吐百枝光滿酌胡姬酒多燒荀令香不學幽閨妾生離怨採桑月一作葉羅敷行梁蕭子範城南日半上微步弄妖姿含情動燕俗顧景笑齊睂不憂桑葉盡還憶畏蠶飢春風若有顧惟願落花遲同前陳顧野王東隅麗春日南陌採桑時樓巾結梳罷提筐候早期風輕鶯韻緩霜灑落花遲五馬光長陌千騎絡青絲使君徒遣信賤妾畏蠶飢同前北魏髙允邑中有好女姓秦字羅敷巧笑美回盼鬢髮復凝膚腳著花文履耳穿明月珠頭作墮馬髻倒枕象牙梳姌姌善趨步襜襜曳長裾王矦為之顧駟馬自踟蹰日出東南隅行一云羅敷豔歌晉陸機扶桑升朝暉照此髙臺端髙臺多妖麗濬房出清顔淑貌耀皎日惠心清且間美目揚玉澤蛾睂象翠翰鮮膚一何潤秀色若可餐窈窕多容儀婉媚巧笑言莫春春服成粲粲綺與紈金雀垂藻翹瓊佩結瑶璠方駕揚清塵濯足洛水瀾藹藹風雲會佳人一何繁南崖充羅幕北渚盈軿軒清川含藻景髙岸被華丹馥馥芳袖揮冷冷纎指彈悲歌吐清響雅韻播幽蘭丹脣含九秋妍迹凌七盤赴曲迅驚鴻蹈節如集鸞綺態隨顔變沈姿無定源俯仰紛阿那顧步咸可歡遺芳結飛飈浮景映清湍冶容不足詠春遊良可歎韻一作舞定一作乏同前宋謝靈運柏梁冠南山桂宮耀北泉晨風拂幨幌朝日照閨軒美人卧屏席懷蘭秀瑶璠皎潔秋松氣淑德春景暄疑闕同前梁沈約朝日出邯鄲照我叢臺端中有傾城豔顧景織羅紈延軀似纎約遺視若回瀾瑶裝映層綺金服炫雕欒幸有同匡好西仕服秦官寶劒垂玉具汗馬飾金鞍縈場類轉雪逸控寫騰鸞羅衣夕解帶玉叉暮垂冠寫一作似同前張率朝日照屋梁夕月懸洞房専遽自稱豔獨立伊覽光雖資自然色誰能棄薄粧施著見朱粉點畫示頳黃含貝開丹吻如羽發清揚金碧既簪珥綺縠復衣裳方領備蟲彩曲裙雜鴛鴦手操獨繭緒唇凝脂燥黃同前蕭子顯大明上迢迢陽城射凌霄光照窗中婦絶世同阿嬌明鏡盤龍刻簪羽鳳凰雕逶迤梁家髻冉弱楚宮腰輕紈雜重錦薄縠間飛綃三六前年暮四五今年朝蠶籠拾芳翠桑陌採柔條出入東城里上下洛西橋忽逢車馬客飛蓋動襜軺單衣鼠毛織寶劒羊頭鞘丈夫疲應對從者輟銜鑣柱間徒脈脈垣上幾翹翹女本西家宿君自上宮要漢馬三萬匹夫聓仕嫖姚鞶囊虎頭綬左珥鳬盧貂橫吹龍鐘管奏鼓象牙簫十五張內侍十八賈登朝皆笑顔郎老盡訝董公超丈一作大從一作御公一作生同前一云豔歌行陳後主重輪上瑞暉西北照南威南威年二八開牖敞重闈當爐送客去上苑逐春歸鬢下珠勝月窗前雲帶衣紅裙結未解緑綺自難徽同前徐伯陽丹城璧日映朱扉青樓含照本暉暉逺映陌上春桑葉斜入秦家緗綺衣羅敷粧粉能佳麗鏡前新梳倭墮髻圓籠裊裊挂青絲鐡鈎冉冉勝丹桂蠶飢日晚暫生愁忽逢使君南陌頭五馬停珂遣借問雙臉含嬌特好羞妾壻府中輕小吏即今來往専城裏欲識東方千騎歸藹藹日暮紅塵起丹一作朱映一作啓同前殷謀秦樓出佳麗正值朝日光陌頭能駐馬花處復添香同前一題云陌上桑周王褒曉星西北沒朝日東南隅陽窗臨玉女蓮帳照金鋪鳳樓稱獨立絶世良所無鏡懸四龍網枕畫七星圖銀鏤明光帶金地織成襦調絃大垂手歌曲鳳將雛採桑三市路賣酒七條衢道逢五馬客夾轂來相趨將軍多事藝夫聓好形模髙箱照雲母壯馬飾當顱單衣火浣布利劒水精珠自知心所愛仕宦執金吾飛甍雕翡翠繡桷畫屠蘇銀燭附彈映雞羽黃金步搖動襜褕兄弟五日時來歸髙車竟道生光輝名倡兩行堂上起鴛鴦七十階前飛少年任俠輕年月珠丸出彈遂難追藝一作勢同前郭本日出行蕭撝昏昏隱逺霧團團乘陳雲正值秦樓女含嬌酬使君同前隋盧思道初月正如鈎懸光入綺樓中有可憐妾如恨亦如羞深情出豔語密意滿橫眸楚腰寧且細孫睂本未愁青玉勿當取雙銀詎可留會待東方騎遙居最上頭可留一作肯留採桑宋鮑照季春梅始落工女事蠶作採桑淇洧間還戲上宮閣早蒲時結陰晚篁初解籜藹藹雲滿閨融融景盈幕乳燕逐草蟲巢蜂拾花藥是節最媗妍佳服又新爍斂歎對回塗揚歌弄場藿抽琴試紓思薦佩果成託承君郢中美服義久心諾衛風古愈絶鄭俗舊浮薄靈願悲渡湘宓妃笑瀍洛盛明難重來淵意為誰涸君其且調絃桂酒妾行酌篁一作竹雲滿一作霧灑斂一作綿迥一作回瀍一作景同前郭本未全梁簡文帝春色映空來先發院邊梅細萍重疊長新花歷亂開連珂往淇上接幰至叢臺叢臺可憐妾當窗望飛蝶忌趺行衫領尉斗成褫褶下牀著珠珮捉鏡安花鑷薄晚畏蠶飢競採春桑葉寄語採桑伴訝今春日短枝髙攀不及葉細籠難滿年年將使君歷亂遣相聞欲知瑟裏意還贈錦中文何當照梁日還作入山雲重門皆已閉方知留客袂可憐黃金絡復以青絲繫必也為人時誰令畏夫壻淇上一作河上褫褶一作裙褶同前集云同郭侍郎採桑姚翻鴈還髙栁北春歸洛水南日照茱茰領風搖翡翠篸桑間視欲暮閨裏遽飢蠶相思君助取相望妾那堪同前沈君攸南陌落花移蠶妾畏桑萎逐便牽低葉爭多避小枝摘駛籠行滿攀髙腕欲疲看金怯舉意求心自可知同前英華題云和洗馬古意吳均賤妾思不堪採桑渭城南帶減連枝繡髮亂鳳凰篸花舞依長薄蛾飛愛緑潭無由報君信流涕向春蠶同前集題云萬山見採桑人姑從郭本收入劉邈倡妾不勝愁結束下青樓逐伴西城路相攜南陌頭葉盡時移樹枝髙任易鈎絲繩提且脫金籠寫復收蠶飢日欲暮誰為使君留城一作郊提一作挂復一作仍欲一作已同前陳後主春樓髻梳罷南陌競相隨去後花叢散風來香處移廣袖承朝日長鬟礙聚枝柯新攀易斷葉嫩摘前萎採繁鈎手弱微汗雜粧垂不應歸獨早堪為使君知同前張正見春樓曙鳥驚蠶妾候初晴迎風金珥落向日玉叉明徙顧移籠影攀鈎動釧聲葉髙知手弱枝軟覺身輕人多羞借問年少怯逢迎恐疑夫壻逺聊復答専城同前賀徹蠶妾出房櫳結伴類花叢度水春衫緑映日晚粧紅釧聲時動樹衣香自入風鈎長從枝曲葉盡細條空競採須盈手爭歸欲滿籠自憐公府步誰與少年同同前傅縡羅敷試採桑出入城南傍綺裙映珠珥絲繩提玉筐度身攀葉聚聳腕及枝長空勞使君問自有侍中郎吟歎曲古今樂録曰張永元嘉技録吟歎四曲一曰大雅吟二曰王明君三曰楚妃歎四曰王子喬大雅吟王明君楚妃歎並石崇辭王子喬古辭其明君一曲今有歌大雅吟楚妃歎二曲今無能歌者古有八曲其小雅吟蜀琴頭楚王吟東武吟四曲闕大雅吟晉石崇堂堂太祖淵𢎞其量仁格宇宙義風遐暢啓土萬里志在翼亮三分有二周文是尚於穆武王奕世載聰欽明沖默文思允恭武則不猛化則時雍庭有儀鳳郊有遊龍啓路千里萬國率從蕩清吳會六合乃同百姓仰德良史書功超越三代唐虞比蹤右一曲晉樂所奏王明君一曰王昭君漢書曰竟寧元年呼韓邪來朝言願壻漢氏以後宮良家子王嬙妃之生一子株纍立復妻之生二女范曄書曰昭君入宮久不見御積怨因掖庭令請行單于臨辭大會豐容靚飾顧影徘徊悚動左右帝驚悔欲復留而重失信夷狄遂與之生二子西京雜記曰漢元帝後宮既多不得常見乃使畫工圖其形按圖召幸宮人皆賂畫工多者十萬少者亦不減五萬昭君自恃其貌獨不與乃惡圖之及後胸奴入朝選美人配之昭君之圖當行及入辭光彩射人悚動左右天子方重信外國悔恨不及窮按其事畫工有杜陵毛延夀為人形醜好老少必得其真安陵陳敞新豐劉白龔寬並工為牛馬飛鳥衆藝人形好醜不逮延夀下杜陽望樊青尤善布色同日棄市籍其家資皆巨萬昭君在胡作詩以怨思云琴操曰昭君本齊國王穰女端正間麗穰以其有異人求之不與年十七進之帝以地逺不幸欲賜單于美人嬙對使者越席請往後不願妻其子吞藥而卒韓子蒼云其事雜出無所考正言不願妻其子而詔使從胡俗此是烏孫公主非昭君也要之琴操最抵牾矣唐書樂志曰明君漢曲也石崇自序曰王明君本名昭君以觸文帝諱故晉人謂之明君初武帝以江都王建女細君為公主嫁烏孫王昆莫令琵琶馬上作樂以慰其道路之思送明君亦然也其造新之曲多哀怨之聲晉宋以來明君止以弦隸少許為上舞而已梁天監中斯宣達為樂府令與諸樂工以清商兩相間弦為明君上舞傳之至今王僧虔技録云明君有間弦及契注聲又有送聲謝希逸琴論曰平調明君三十六拍胡笳明君二十六拍清調明君十三拍間弦明君九拍蜀調明君十二拍吳調明君十四拍杜瓊明君二十一拍凡有七曲琴集曰胡笳明君四弄有上舞下舞上間弦下間弦明君三百餘弄其善者四焉又胡笳明君别五弄辭漢跨鞍望鄉奔雲入林是也晉石崇我本漢家子將適單于庭辭訣未及終前驅已抗旌僕御涕流離轅馬悲且鳴哀鬱傷五內泣淚沾朱纓行行日已逺遂造胸奴城延我於穹廬加我閼氏名殊類非所安雖貴非所榮父子見陵辱對之慙且驚殺身良不易默默以茍生茍生亦何聊積思常憤盈願假飛鴻翼乘之以遐征飛鴻不我顧佇立以屏營昔為匣中玉今為糞上英朝華不足嘉甘與秋草并傳語後世人逺嫁難為情嘉一作歡所右一曲晉樂奏王昭君宋鮑照既事轉蓬逺心隨鴈路絶霜鞞旦夕驚邊笳中夜咽同前施榮泰垂羅下椒閣舉袖拂胡塵唧唧撫心歎蛾眉誤殺人同前玉臺題云昭君辭周庾信拭啼辭戚里回顧望昭陽鏡失菱花影叉除却月梁圍腰無一尺垂淚有千行緑衫承馬汗紅袖拂秋霜别曲真多恨哀弦須更張緑衫一作衫身同前無名氏猗蘭恩寵歇昭陽幸御稀朝辭漢闕去夕見胡塵飛寄信秦樓下因書秋鴈歸明君詞英華題云昭君怨梁簡文帝玉艷光搖質金鈿婉黛紅一去蒲萄觀長别披香宮秋簷照漢月愁帳入胡風妙工偏見詆無由情恨通同前一曰昭君辭武陵王紀塞外無春色邊城有風霜誰堪覽明鏡持許照紅粧同前沈約朝發披香殿夕濟汾陰河於兹懷九折自此斂雙蛾沾粧疑湛露繞臆狀流波日見奔沙起稍覺轉蓬多胡風犯肌骨非直傷綺羅銜涕試南望關山鬱嵯峨始作陽春曲終成苦寒歌唯有三五夜明月暫經過折一作逝狀一作比同前集題云昭君怨陳後主圖形漢宮裏遙聘單于庭狼山聚雲暗龍沙飛雪輕笳吟度隴咽笛轉出關鳴啼妝寒葉下愁眉塞月生只餘馬上曲猶作别時聲同前集作王明君張正見寒樹暗胡塵霜樓明漢月淚染上春衣憂變華年髮同前藝文作陳明陰鏗集載云昭君怨郭本作唐誤陳昭跨鞍今永訣垂淚别親賓漢地隨行盡胡關逐望新交河擁塞霧隴日暗沙塵唯有孤明月猶能送逺人隨行盡一作行將逺同前周王褒蘭殿辭新寵椒房餘故情鴻飛漸南陸馬首倦西征寄書參漢使銜涕望秦城唯餘馬上曲猶作出關聲同前集題云昭君辭應詔庾信斂眉光祿塞遙望夫人城片片紅顔落雙雙淚眼生氷河牽馬渡雪路抱鞍行胡風入骨冷夜月照心明方調琴上曲變入胡笳聲入一作作同前一云昭君辭英華作何遜隋何安昔聞别鶴弄已自軫離情今來昭君曲還悲秋草并同前薛道衡我本良家子充選入椒庭不蒙女史進更無畫師情蛾眉非本質蟬鬢改真形専由妾命薄誤使君恩輕啼落渭橋路歎别長安城今夜寒草宿明朝轉蓬征卻望關山迥前瞻沙漠平胡風帶秋月嘶馬雜笳聲毛裘易羅綺氊帳代帷屏自知蓮臉歇羞看菱鏡明叉落終應棄髻解不須縈何用單于重詎假閼氏名駃騠聊強食挏酒未能傾心隨故鄉斷愁逐塞雲生漢宮如有憶為視旄頭星今夜一作夜依明朝一作朝逐帷一作金桐一作筒昭君歎二首范靜婦沈氏早信丹青巧重貨洛陽師千金買蟬鬢百萬寫蛾眉貨一作賂今朝猶漢地明旦入胡關情寄南雲反思逐北風還一作髙堂歌吹寂遊子夢中還楚王吟梁張率章臺迎夏日夢逺感春條風生竹籟響雲垂草緑饒相看重束素唯欣爭細腰不惜同從理但使一聞韶楚妃歎劉向列女傳曰楚姬楚莊王夫人也莊王好狩獵畢弋樊姬諫不止乃不食禽獸之肉王嘗與虞丘子語以為賢樊姬笑之王曰何笑也對曰虞丘子賢矣未忠也妾充後宮十一年而所進者九人賢於妾者二人與妾同列者七人虞丘子相楚十年而所薦者非其子孫則族昆弟未聞進賢退不肖也妾之笑不亦宜乎王於是以孫叔敖為令尹治楚三年而莊王以霸樂府解題曰陸機吳趨行云楚妃且莫歎明非近題也謝希逸琴論有楚妃歎七拍晉石崇蕩蕩大楚跨土萬里北據方城南接交趾西撫巴漢東被海涘五矦九伯是疆是理矯矯莊王淵渟嶽峙冕旒垂精充纊塞耳韜光戢曜潛默恭已內委樊姬外任孫子猗猗樊姬體道履信既絀虞丘九女是進杜絶邪佞廣啓令胤割歡抑寵居之不吝不吝實難可謂知幾化自近始著於閨闈光佐霸業邁德揚威羣后列辟式瞻洪規譬彼江海百川咸歸萬邦作歌身沒名飛右一曲晉樂所奏同前一云楚妃引宋袁伯文玉墀滴淒露羅幌已依霜逢春每先絶爭秋欲幾芳同前梁簡文帝幽閨情脈脈漏長宵寂寂草螢飛夜戶絲蟲繞秋壁薄笑未為欣微歎還成戚金簪鬢下垂玉筯衣前滴楚妃吟梁王筠花早飛林中明鳥早歸庭前日暖春閨香氣亦霏霏香氣漂當軒清唱調獨顧慕含怨復含嬌蝶飛蘭復裊裊輕風入裙春可遊歌聲梁上浮春遊方有樂沈沈下羅幕楚妃曲吳均春粧約春黛如月復如蛾玉叉照繡領金薄厠紅羅王子喬劉向列仙傳曰王子喬者周靈王太子晉也好吹笙作鳳鳴遊伊洛之間道人浮丘公接以上嵩髙山三十餘年後求之於山上見桓良曰告我家七月七日待我於緱氏山頭至時果乘白鶴駐山頭望之不得到舉手謝時人數日而去為立祠於緱氏山下及嵩髙之首焉古辭王子喬參駕白鹿雲中遨參駕白鹿雲中遨下遊來王子喬參駕白鹿上至雲戲遊遨上建逋陰廣里踐近髙結仙宮過謁三台東遊四海五嶽山過蓬萊紫雲臺三王五帝不足令令我聖朝應太平養民若子事父明當究天祿永康寧玉女羅坐吹笛簫嗟行聖人遊八極鳴吐銜福翔殿側聖主享萬年悲吟皇帝延夀命右一曲魏晉樂所奏同前集云王太子贊姑從郭本收入梁江淹子喬好輕舉不待鍊銀丹控鶴去窈窕學鳳對巑岏山無一春草谷有千年蘭雲衣下躑躅龍駕何時還去一作上同前一題有行字髙允生仙化非常道其義出自然王喬誕神氣白日忽升天暗曖御雲氣飄颻乘長煙寄想崆洞外翺翔宇宙間七月有佳期控鶴崇崖巔永與時人别一去不復旋飄颻一作飄飄同前北魏髙允王少卿王少卿超升飛龍翔天庭遺儀景雲漢光騖電逝忽若浮騎日月從列星跨騰入廓踰窅冥尋元氣出天門窮覽有無究道根四弦曲古今樂録曰張永元嘉技録有四弦一曲蜀國四弦是也居相和之末三調之首古有四曲其張女四弦李延年四絃嚴卯四絃三曲闕蜀國四絃節家舊有六解宋歌有五解今亦闕蜀國絃集題蜀國絃歌篇十韻梁簡文帝銅梁指斜谷劒道望中區通星上分野作固下為都雅歌因良守妙舞自巴渝陽城嬉樂盛劒騎鬱相趨五婦行難至百兩好遊娛牲祈望帝祀酒酹蜀矦姝江妃納重聘卓女愛將雛停絃時繫爪息吹治脣朱脫衫湔錦浪回扇避陽烏聞君握節返賤妾下城隅指斜谷玉臺作望絶國望中區英華作臨中區盛一作所爪一作介治脣朱一作更治水同前隋盧思道西蜀稱天府由來擅沃饒雲浮玉壘夕日映錦城朝南尋九折路東上七星橋琴心若易解令客豈難要古樂苑卷十五
