body:
  text: 古樂苑卷四十三明梅鼎祚編襍歌謠辭古諺夏諺越絶書曰禹廵狩大越見耆老納詩書審銓衡平斗斛夏諺云云見太平御覽按今越絶無此諺吾王不遊吾何以休吾王不豫吾何以助一遊一豫為諸矦度劉熈曰春行曰遊秋行曰豫左傳季氏有嘉樹韓宣子譽之服䖍曰譽與豫同遊於樹下也唐宋之問詩春豫臨池近太公兵法引黄帝語賈子書引止日中必彗操刀必割二句其餘見太公兵法即漢蓻文志黄帝巾机銘也日中不彗是謂失時操刀不割失利之期執斧不伐賊人將来涓涓不塞將為江河熒熒不救炎炎奈何兩葉不去將用斧柯為虺弗摧行將為蛇来叶陵之反蛇叶唐何反六韜天下攘攘皆為利往天下熈熈皆為利来叶左傳周諺魯隱公十一年滕矦薛矦来朝爭長公使羽父請于薛矦曰周諺有之云云周之宗盟異姓為後乃長滕矦山有木工則度之賓有禮主則擇之度音宅周諺初虞矦有玉虞公求旃弗獻既而悔之曰周諺有之云云吾焉用此乃獻之匹夫無罪懐璧其罪晉士蒍引諺晉獻公為太子申生城曲沃士蒍曰太子不得立矣不如逃之無使罪至且諺曰云云天若祚太子其無晉乎心苟無瑕何恤乎無家虢宫之竒引諺晉假道於虞以伐虢宮之奇諫曰虢虞之表也虢亾虞必從之諺所謂云云者其虞虢之謂也不聽晉㓕虞輔車相依唇亾齒寒輔頰也車牙車又曰頷車上牙骨之名也輔為外表車是内骨鄭孔叔引諺齊人伐鄭孔叔言於鄭伯曰諺有之云云既不能彊又不能弱所以病也請下齊以救國鄭殺齊矦以說于齊心則不競何憚於病宋樂豫引諺宋昭公欲去羣公子樂豫曰公族公室之枝葉也葛藟猶能庇其本根况君子乎諺所謂云云者也庇焉而縱尋斧焉八尺曰尋所以量木也借木之庇而縱放尋以量之斧以伐之鄭子家引言晉矦不見鄭伯以為貳於楚也鄭子家使執訊而與之書以告趙宣子曰古之人有言曰云云又曰云云小國之事大國也德則其人也不德則其鹿也鋌而走險急何能擇將悉敝賦以待於儵晉鞏朔行成於鄭畏首畏尾身其餘幾鹿死不擇音音當作蔭茠蔭也申叔時引人言楚人伐陳因縣陳陳矦在晉申叔時曰夏徵舒弑其君其罪大矣抑人亦有言曰云云諸矦之從也曰討有罪也今縣陳貪其富也無乃下可乎牽牛以蹊人之田而奪之牛牽牛以蹊者信有罪矣而奪之牛罸已重矣晉伯宗引古言楚子圜宋宋告急於晉晉矦欲救之伯宗曰不可古人有言曰云云天方授楚未可與爭諺曰髙下云云天之道也君其待之乃止雖鞭之長不及馬腹髙下在心川澤納汚山藪藏疾瑾瑜匿瑕國君含垢漢書亦引此無髙下在心一句晉羊舌職引諺晉命士㑹將中軍于是晉國之盗逃歸于秦羊舌職曰善人在上則國無幸民諺曰民之多幸國之不幸也晉韓厥引古言晉欒書中行偃執厲公召韓厥厥辭曰古之人有言曰云云而况君乎殺老牛莫之敢尸劉子引諺天王使劉定公勞趙孟於潁館於洛汭劉子曰子盍亦逺績禹功而大庇民乎對曰吾儕偷食朝不謀夕何其長也劉子歸以語王曰諺所謂老將知而耄及之者其趙孟之謂乎何以能久老將知而耄及之衛矦引古言衛矦入使讓太叔文子曰寡人淹恤在外二三子皆使寡人聞衛國之言吾子獨不在寡人古人有言曰云云寡人怨矣非所怨勿怨齊晏子引諺初景公欲更晏子之宅辭曰君之先臣容焉臣不足以嗣之及晏子如晉公更其宅反則成矣既拜乃毁之而為里室皆如其舊則使宅人反之且諺曰云云二三子先卜鄰矣卒復其舊宅非宅是卜惟鄰是卜魯謝息引言晉人来治杞田季孫將以成與之謝息為孟孫守不可曰人有言曰雖有挈缾之智守不假器鄭子産引古言子產為鄭豐施歸州田於韓宣子曰日君以公孫叚為能任其事而賜之州田其子弗敢有古之人有言曰云云敢以為請宣子受之其父析薪其子弗克負荷子服惠伯引諺晉人執季孫意如子服惠伯私於中行穆子曰魯兄弟也土地猶大所命能具若為夷棄之使事秦楚其何瘳於晉諺曰臣一主二吾豈無大國乃歸季孫臣一主二子產引諺子產適晉趙景子問曰伯有猶能為鬼乎子產曰良霄我先君穆公之胄子良之孫子耳之子敝邑之卿從政三世矣抑諺曰云云能為鬼不亦宜乎蕞爾國而三世執其政柄子產引諺鄭駟偃卒其父兄立偃叔父子瑕晉人使問故子產對曰其子㓜弱其一二父兄私族於謀而立長親寡君與其二三老曰抑天實剝亂是吾何知焉諺曰云云民有兵亂猶或過之而况敢知天之所亂無過亂門宋對楚薳越人有言曰惟亂門之無過子瑕引諺楚靈王執呉王弟蹶由以歸令尹子瑕言于楚子曰彼何罪諺所謂云云者楚之謂矣舍前之忿可也乃歸蹶由室於怒市於色戰國䇿怒於室者色於市范獻子引言鄭伯如晉子大叔相見范獻子獻子曰若王室何對曰老夫其國家不能恤敢及王室抑人亦有言曰云云今王室實蠢蠢焉吾小國懼矣然大國之憂也吾子其圖之嫠不恤其緯而憂宗周之隕為將及焉魏子引諺梗陽人有獄賂以女樂魏子將受之魏戊謂閻設女寛曰吾子必諫饋入召之比食三歎既食魏子曰吾聞諸伯叔諺曰云云吾子置食之間三歎何也同辭而對曰饋之始至恐其不足是以歎中置自咎曰豈將軍食之而有不足是以再歎及饋之畢願以小人之腹為君子之心屬厭而已獻子辭梗陽人惟食忘憂國語作惟食可以忘憂戲陽速引諺衛矦為夫人南子召宋朝大子蒯瞶羞之謂戲陽速曰從我而朝少君我顧乃殺之速不進大子奔宋速告人曰大子無道使余殺其母許而弗為以紓予死諺曰云云吾以信義民保於信楚文子引諺司馬子良生子越椒子文曰必殺之是子也熊虎之狀而豺狼之聲弗殺必滅若敖氏矣諺曰云云是乃狼也其可畜乎子良不可狼子野心語飛失在上走驛在下兵交使在其間今語兩國兵交不罪来使國語富辰引言襄王十三年鄭人伐滑王使遊孫伯請滑鄭人執之王怒將以翟伐鄭富辰諫曰不可人有言曰云云周文公之詩曰兄弟閲於墻外禦其侮兄弟讒䦧侮人百里單襄公引言晉克楚使郤至告慶於周召桓公與之語至稱三伐召桓公以告單襄公襄公曰人有言曰兵在其頸其郤至之謂乎君子不自稱也非以讓也惡其盖人也求盖人其抑下滋甚故聖人貴讓且諺曰云云郤至歸明年死難兵在其頸獸惡其網民惡其上太子晉引言周靈王二十二年穀洛闘將毁王宮王欲壅之太子晉諫曰不可今吾執政無乃實有所避而滑夫二川之神使至於爭明以妨王宮王而飾之無乃不可乎人有言曰云云又曰無過亂人之門佐雝者嘗焉佐鬬者傷焉今俗語助祭得食助鬪得傷禍不好不能為禍猶財色之禍生於好之伶州鳩引諺景王作大錢鑄大鐘鐘成伶人告龢伶州鳩對曰臣不知其龢也且民所曹好鮮其不濟也其所曹惡鮮其不廢也故諺曰云云今三年之中而害金再興焉懼一之廢也王崩鐘不龢衆心成城衆口鑠金衛彪傒引諺周敬王十年劉文公與萇𢎞欲城成周將合諸矦衛彪傒適周見單穆公曰萇劉其不沒乎諺曰云云后稷勤周十有五世而興幽王亂之十有四世守府之謂多胡可興也從善如登從惡如崩鄭叔詹引諺晉公子重耳過鄭鄭文公不禮叔詹諫弗聽曰若不禮焉則請殺之諺曰云云黍稷無成不能為榮黍不為黍不能蕃膴稷不為稷不能蕃殖所生不疑惟德之基為黍為稷之為成也所生謂種黍得黍種稷得稷唯在所樹言禍福亦猶是也諸稽郢引諺呉伐越越使諸稽郢行成於呉曰夫諺曰云云今天王既封殖越國乂刈亾之雖四方之諸矦則何實以事呉呉許之狐埋之而狐搰之是以無成功越王引諺越將伐呉數問於范蠡范蠡曰未可也王姑待之王曰諺有之云云今歲晚矣子將奈何觥飯不及壺飱盛饌未具不如壺飱之救饑疾也戰國策蘇秦引語秦攻趙蘇秦謂秦王曰今雖得邯鄲非國之長利也語曰戰勝而國危者物不斷也功大而權輕者地不入也又蘇秦說齊閔王曰語曰云云何則後起之籍也今天下之相與也不並㓕有能案兵而後起寄怨而誅不直㣲用兵而寄於義則亡天下可跼足而須也騏驥之衰也駑馬先之孟賁之倦也女子勝之張儀引言張儀說秦王曰夫戰者萬乘之存亾也且臣聞之曰云云言所以舉破天下之從舉趙王韓臣荆魏親齊燕以成霸王之名削株掘根無與禍鄰禍乃不存按國䇿止云臣聞之不云諺語若臣聞之之類載籍頗多但此實似古語耳即此篇前亦有臣聞之曰以亂攻治者亡以邪攻正者亡以逆攻順者亡莊辛引鄙語莊辛謂楚襄王曰君王左州矦右夏矦輦從鄢陵君與壽陵君楚國必亡矣去之趙五月秦果舉鄢郢王使人徴莊辛于趙曰今亊至於此為之柰何對曰臣聞鄙語曰見兎而顧犬未為晚也亡羊而補牢未為遲也牢一作籬楚人引諺楚䇿或謂黄齊曰人皆以謂公不善於富摯諺曰云云今王善富摯而公不善也是不臣也見君之乘下之見杖起之下音户起音去上聲荀卿引語孫子為蘭陵令春申君使人謝孫子孫子去之趙春申君使人請孫子於趙孫子為書謝曰癘人憐王此不恭之語也雖然不可不審察也此為刼弑死亾之主言也註云癘雖惡猶愈于劫弑故反憐王癘人憐王武靈王引諺趙武靈王始出胡服之令羣臣皆諫止王王曰諺云云以書為御者不盡馬之情以古制今者不逹事之變亦見史記孟嘗君引鄙語孟嘗君擇舍人以為武城吏而遺之曰鄙語豈不曰借車者馳之借衣者被之言弗愛也被叶音披蘇秦引鄙語蘇秦為趙合從説韓曰臣聞鄙語云云今大王西面交臂而臣亊秦何以異於牛後乎寧為雞口無為牛後顔氏家訓曰按延篤戰國策音義曰尸雞中之主從牛子也然則口當為尸後當為從俗寫誤也蘇代引諺秦圍宜陽蘇代為公仲謂向壽曰禽困覆車秦楚合復攻韓韓必亾公仲躬率其私徒以闘於秦諺曰云云人皆言楚之多詐也而公必之是自為貴也不如善韓以待之貴其所以貴者貴以貴人所同貴按風雅逸篇亦以禽困覆車為古語國策不云何語也燕王喜引語燕王喜與樂間謀伐趙不可王大怒起六十萬以攻趙燕人大敗樂間入趙王以書謝曰語曰云云諺曰云云仁不輕絶智不輕怨厚者不毀人以自益也仁者不危人以要名也史記史記漢書事屬漢者仍後入漢趙肥義引諺趙主父初以長子長為太子後得呉娃生子何乃立何為王章心不服其弟所立主父又使田不禮相李兌謂肥義曰二人相得必有謀子奚不稱疾母出肥義曰不可昔者主父以王屬義也諺曰云云吾言已在前矣後章與田不禮作亂令召王肥義先入殺之死者復生生者不愧語楚考烈王無子春申君内李園女弟有身進之王生子男立為太子園陰養死士欲殺春申君以滅口朱英謂春申君曰君置臣郎中楚王卒李園必先入臣為君殺李園不聽後王卒李園果先入伏死士刺春申君斬其頭太史公曰語曰云云春申君失李英之謂邪當斷不斷反受其亂商君引語商君曰子觀我治秦也孰與五羖大夫賢趙良曰千羊之皮不如一狐之腋干人之諾諾不如一士之諤諤良請終日正言而無誅可乎商君曰語有之矣云云夫子果肯終日正言鞅之藥也貌言華也至言實也苦言藥也甘言疾也按風雅逸篇但載千羊之皮四句為古語而此語反不載然彼特有似古語耳不云語也今正之張儀引周語張儀傳張儀説魏王曰從人多奮辭而少可信人主與其辨而牽其説豈得無眩哉臣聞之云云故願大王審定計議且賜骸骨歸魏積羽沈舟羣輕折軸衆口鑠金積毁銷骨戰國䇿註周語也漢中山王傳臣聞衆口銷金積毁銷骨叢輕折軸羽翮飛肉云云諺樗里子傳樗里秦惠王異母弟樗里子滑稽多智秦人號曰智囊諺云力則任鄙智則樗里語太史公曰語曰利令智昬平原君貪馮亭邪説使趙陷長平兵四十餘萬衆邯鄲幾亾利令智昬鄙語王翦傳賛引鄙語曰云云白起料敵合變然不能救患于應矦王翦為秦將夷六國然不能輔秦建德以致圽身尺有所短寸有所長蔡澤引語蔡澤入秦説應矦范睢曰語曰云云天地之常數也君之功極矣如是而不退則商君白公呉起大夫種是也吾聞之鑒於水者見面之容鑒於人者知吉與凶應矦因謝病請歸相印日中則移月滿則虧物盛則衰按風雅逸篇不載此語而載鑒於水者四句為語史記止曰吾聞之不云語也且本武王鏡銘韓子太史公曰韓子稱云云信哉是言也范雎蔡澤遊説諸矦至白首無所遇及二人羈旅入秦踵取卿相固强弱之勢異也長袖善舞多財善賈古語鄒陽傳鄒陽者齊人也㳺於梁而介於羊勝公孫詭之間勝等嫉陽惡之孝王孝王怒下之吏將欲殺之陽乃從獄中上書引諺曰云云何則知與不知也白頭如新傾葢如故白上有冇字漢書武帝賢良䇿問引古語漢書或曰云云不云古語也良工不琢東方朔引古語以管窺天以蠡測海以莛撞鐘史記扁鵲曰以管窺天以隙視文後漢書古語人所歌舞天必從之人所咀嚼神必凶之王莾遣更始將軍亷丹討山東辟馮衍為椽衍説丹曰將軍之先為漢信臣新室之興英俊不附今漢内潰人懐漢德人所歌舞天必從之按此本古語而衍引其半管子諷桓公不行其野不違其馬言馬以行野雖不行野亦不可不調習也墻有耳伏宼在側孔子家語相馬以輿相士以居曾子人莫知其子之惡莫知其苖之碩孟子齊人有言雖有智慧不如乘勢雖有鎡基不如待時賈逵曰鎡基耨也吕氏春秋曰耨六寸所以間稼説苑鄒穆公引周諺囊漏貯中文心雕龍作儲中列子楊朱篇引古語生相憐死相捐古語人不㛰宦情欲失半人不衣食君臣道息周諺田父可坐殺晨出夜入自以性之恒啜菽茹藿自以味之極一朝處以軟毛綈薦以梁肉蘭味心痛體煩内熱生病矣莊子野語聞道百以為莫已若河伯古語美成在久惡成不及改衆人重利亷士重名賢士尚志聖人貴精荀子子道篇引古言衣與繆與不女聊與音歟聊音留叶力蚪反言雖衣服我綢繆我而不敬不順則不聊汝也大畧篇引民語欲富乎忍耻矣傾絶矣故舊矣與義分背矣傾絶謂傾身絶命而求也分背如人分背而行也魯定公記古語寧得一把五加不用黄金滿車寧得一把地榆不用明月寳珠臯魚引古語枯魚銜索幾何不蠧索音素古通商君書引語公孫鞅謂秦孝公曰臣聞之疑行無名疑事無功君亟定變法之慮殆猶天下之議語曰愚者暗於未成智者見於未萌鄒子名衍齊人古語截趾適履孰云其愚何與斯人追欲喪軀愼子名到先申韓申韓稱之不聪不明不能為王不瞽不聾不能為公韓非子古諺隰子曰知淵中之魚者不祥趙文子曰周諺有言察見淵魚者不祥智料隱逸者殃為政猶沐也雖有棄髪之費而有長髪之利也按風雅逸篇載諺云奔車之上無仲尼覆舟之下無伯夷此見韓子安危篇非諺也鬼谷子古言權篇古人有言曰云云言者有諱忌也衆口爍金言冇曲故也口可以食不可以言古語今按鬼谷戒蘇秦張儀書云二足下功名赫赫但春華至秋不得久茂夫女愛不極席男歡不畢輪痛哉不云古語也戰國䇿嬖色不敝席寵臣不敝軒女愛不敝席男歡不盡輪魯仲連子漢藝文志冇魯仲連子古諺百足之蟲三斷不蹶墨子云馮公之蟲三斷不僵馮公蟲名僵讀鞠躬之躬魯連子心誠憐白髪𤣥情不怡艶色媸吕覽齊鄙人諺居者無載行者無埋言生不隱謀死不隱忠也載讀作䅔埋叶陵之反鶡冠子楚人居深山以鶡鳥羽為冠中流失船一壺千金船音循釋名船循也循水而行也孔叢子遺諺平原君與子髙飲强子髙酒曰昔有遺諺云云古之聖賢無不能飲也吾子何辭焉子髙曰聖賢以道德兼人未聞以飲食也堯舜千鍾孔子百觚子路嗑嗑尚飲十榼賈誼書容經篇君子重襲小人無由入正人十倍邪辟無由來倍叶平聲劉向别錄古語唇亾而齒寒河水崩其壊在山寒叶胡干反山叶輪旃反風雅逸篇又載劉向列女傳古語云力田不如遇豐年力桑不如見國卿刺繡文不如倚市門此本秋胡謂其妻云云不謂諺也傳止首二句桓譚引諺人之相去如牛九尾風雅逸篇又載云二人同術誰昭誰冥二虎同穴誰死誰生按此本汲冡周書非諺也桓子新論引諺人聞長安樂則出門而西向笑知肉味美則對屠門而大嚼習伏衆神巧者不過習者之門牟子東漢太尉牟融古諺少所見多所怪見槖駝言馬腫背怪叶古潰反劉子劉晝字孔昭古諺深不絶涓泉稚子浴其淵髙不絶丘陵跛羊遊其巔應劭漢官儀引語崔豹古今註曰文武車耳古重較也文官青耳武官赤耳毛萇詩䟽曰重較卿士之車耳仕宦不止車生耳師春晉書云汲冡竹書中師春一篇師春似是造書者姓名古語斧小不勝柯韓嬰詩傳古詩昨日何生今日何成必念歸厚必念治生日愼一日完如金城詩䟽洛諺洛鯉伊魴貴於牛羊齊諺山上斫檀檖榏先殫檖音遂榏音兮檀與檖榏三木相似斫檀不諦得檕迷檕迷尚可得駮馬駮馬亦木名馬音如塗抹之抺檀與檕迷駮馬三木又相似齊語疲馬不渡澠水澠水之流迅疾上黨人調問婦人欲買赭不謂竈下有黄土欲買釵不謂山中自有楛詩正義引語四足之美有麃兩足之美有鷮易緯引古語一夫兩心㧞刺不深躓馬破車惡婦破家春秋緯引古語吐珠於澤誰能不合月麗于畢雨滂沱月麗于箕風揚沙叶桑何反汜勝之書引古語汜勝之成帝時為議郎師古曰劉向别錄云使教田三輔有好田者師之徙為御史土長冒撅陳根可㧞耕者急發見月令註農書四民月令引農語東漢崔寔撰三月昬參星夕杏花盛桑葉白河射角堪夜作犂星沒水生骨月令引里語蜻蛉鳴衣裘成蟋蟀鳴懶婦驚闞駰十三州志闞駰燉煌人沮渠蒙遜同時峴山張蓋雨滂沛齊民要術後魏賈勰撰智如禹湯不如常耕叶居郎反耕而不勞不如作㬥勞去反子欲富黄金覆謂秋鋤麥曳柴壅麥根也夏至後不沒狗但雨多溼槖駝五月及澤父子不相借積籍二音夏至前種麻良候也羸牛劣馬寒食下言其乏食瘦瘠春中必死水經註引諺射的山名逺望狀若射矦土人以驗年之登否的明則米賤的闇則米貴射的白斛米百射的𤣥斛米千蔣子萬機論隋書志魏太尉蔣濟撰猛虎不處卑勢勁鷹不立垂枝抱朴子古人欲逹勤誦經今世圖官勉治生方囘山經引相冡書山川而能語葬飾食無所肺腑而能語醫師色如土文選註引古諺越阡度陌互為主客史炤通鑑䟽引諺足寒傷心民怨傷國妍皮不裹癡骨福至心靈禍来神昧古諺古語載籍通引終身讓車不枉一舍莫三人而迷又曰莫衆而迷惑者知反迷道不逺不斑白語道失白刃交前不顧流矢堂前不糞除郊草不瞻耘一淵不兩蛟又曰一栖不兩雄又曰兩雄不並栖井水無大魚新林無長木林中不賣薪湖上不鬻魚觸露不搯葵日中不煎韭乳犬玃虎伏雞摶狸白璧不可為容容多後福將飛者翼伏將奮者足跼將噬者爪縮將文者且朴中規不宻用墜禍辟鐸以聲自穴膏以明自鑠虎豹之文来射猿狖之㨗来擉上求材臣殘木上求魚臣乾谷遁關不可復亾犴不可再無鄉之社易為黍肉無國之稷易為求福古樂苑卷四十三
