body:
  text: 古樂苑巻四十七明梅鼎祚編襍歌謠辭三國蜀漢諺孔明諺襄陽耆舊傳曰黄彦承髙爽開朗為沔南名士謂孔明曰聞君擇婦身有醜女黄頭黒面才堪相配孔明許即載送之鄉里為之諺曰莫學孔明擇婦正得阿承醜女李鱗甲江表傳曰諸葛亮表都尉李嚴少為郡吏用性深尅茍利其身鄉里為嚴諺曰難可狎李鱗甲諸葛諺晉漢春秋曰諸葛亮卒楊儀整軍而出宣王不逼百姓諺曰死諸葛走生仲逹何隨語華陽國志曰何隨字季業蜀郡郫人也除安漢令蜀亡去官時巴土饑荒所在無榖送吏行乏輙取道側民芋隨以綿繫其處使足所取直民視芋見綿在語曰聞何安漢清廉行過從者無糧必能爾耳持綿追還之終不受因為語曰安漢吏取糧令為之償蜀語華陽國志曰巴西郡二主之世稱美荆楚先漢以來馮車騎范鎮南皆植斯鄉故曰巴有將蜀有相假鬼教華陽國志曰先主薨後雍闓殺益州太守正昻更以蜀郡張裔為太守闓假鬼教曰云云按蜀書云張府君如瓠壺外雖澤而内實粗不足殺令送與吳似不當附語張裔府君如瓠壺殺之不可送與吳魏歌徐州歌晉書曰王祥隱居廬江三十餘年不應州郡之命徐州刺史吕䖍檄為别駕于時冦盜充斥祥率勵兵士頻討破之州界清靜政化大行時人歌之按魏志吕䖍文帝時遷徐州刺史請琅琊王祥為别駕海沂之康實頼王祥邦國不空别駕之功滎陽令歌殷氏世傳曰殷褒為滎陽令廣築學館㑹集朋徒民知禮讓乃歌之云滎陽令有異政修立學校人易性令我子弟耻鬬訟樂府作訟爭行者歌選詩拾遺作魏時童謠歌云見五行志王子年拾遺記曰文帝所愛美人薛靈芸常山人也年十五容貎絶世咸熙中文帝選良家子女以入六宫常山太守習谷以千金寶賂聘之以獻至京師帝以文車十乘迎之道側燒石葉之香未至數十里膏燭之光相續不滅車徒咽路塵起蔽於星月又築土為臺基高三十丈列燭於臺下遠望如列星之墜地又於大道之傍一里一銅表高五尺以誌里數故行者歌曰青槐夾道多塵埃龍樓鳯闕望崔嵬清風細雨襍香來土上出金火照臺此七字是妖辭也銅表誌道是土上出金之義以燭置臺下則火在土下之義漢火德王魏土德王火伏而土興土上出金是魏滅而晉興之兆晉以金王也兠鈴曹子歌晉書曰明帝太和中京師歌兠鈴曹子其唱曰云云此詩妖也其後曹爽見誅曹氏遂廢其奈汝曹何謠明帝景初中童謠宋書五行志曰魏明帝景初中童謠及宣王平遼東歸至白屋當還鎮長安㑹帝篤疾急召之乃乘追鋒車東渡河終翦魏室如童謠之言也阿公阿公駕馬車不意阿公東渡河阿公東還當奈何東晉書作來齊王嘉平中謠宋書五行志曰魏齊王嘉平中謠按朱虎者楚王彪小字也王淩令狐愚聞此謠謀立彪事發淩等伏誅彪賜死白馬素羈西南馳其誰乘者朱虎騎謠言魏略䕶軍總統諸將任主武官選舉前後當此官者不能止貨賂故蔣濟為䕶軍時有謠言欲求牙門當得千匹百人督五百匹諺諺言太祖為魏王中尉崔琰取表草視之與楊訓書曰省表事佳耳時乎時乎㑹當有變時琰本意譏論者好譴呵而不尋情理也有白琰此書傲世怨謗者太祖怒曰諺言云云㑹當有變時意指不遜遂賜琰死生女耳耳非佳語夏侯語魏書曰夏侯淵為將赴急疾常出敵不意故軍中語曰典軍校尉夏侯淵三日五百六日一千詩紀作六十千悞淵從太祖征伐封博昌亭侯軍中語魏略曰太祖使盧洪趙逹撫軍主刺舉軍中語曰不畏曹公但畏盧洪曹公尚可趙逹殺我帳下語江表傳曰典韋容貎魁傑名冠三軍其所持手㦸長幾一尋軍中為之語曰帳下壯士有典君手把雙㦸八十斤魏誌云曹公帳下有典君提一雙㦸八十斤邢子昻語魏志曰邢顒太祖辟為冀州從事時人稱之德行堂堂邢子昻白鶴王子年拾遺記曰曹洪與魏武帝所乘之馬名曰白鶴時人諺曰憑空虛躍曹家白鶴諺傳子曰劉曄仕明皇帝能應變持兩端帝後得其情遂疏焉曄遂發狂憂死諺曰巧詐不如拙誠語魏氏春秋宗室曹冏上書請廣建同姓褒異宗室撰合所聞聚論成敗引語曰百足之蟲至死不僵以扶之者衆也鴻臚語魏略曰韓宣字景然為大鴻臚始南陽曲阜韓暨以宿德在宣前為大鴻臚及宣在官亦稱職故鴻臚中為之語曰大鴻臚小鴻臚前後治行相曷如州中語魏略曰賈洪字叔業馮翊敬危材學最高故衆人為之語曰州中曄曄賈叔業辨論洶洶敬文通一作嚴苞字文通京師語魏書鄧颺字𤣥茂歴遷侍中尚書颺為人好貨前在内職許臧艾授以顯官艾以父妾與颺故京師為之語曰以官易富鄧𤣥茂語任嘏别傳曰嘏樂安博昌人夙智早成故鄉人為之語曰蔣氏翁任氏童楊阿若魏志注曰楊阿若後名豐字伯陽少遊俠常以報仇解怨為事故時人為之號曰東市相斫楊阿若西市相斫楊阿若諺魏武選令曰諺曰云云昔季闓在白馬有受金取婢之罪棄而弗問後以為濟北相以其能故失晨之雞思補更鳴諺曹植令曰諺云云夫相者文德昭將者武功烈相門有相將門有將諺梁祚魏國統曰王昶字文舒戒子書引諺曰云云如不知足則失所欲救寒無若重裘止謗莫如自脩諺王朗貧窶語曰諺曰魯班雖巧不能為乞丏者顔謗書魏略曰李豐字安國為侍中僕射在臺閣常多托疾時臺制滿百日當解禄豐未滿百日蹔起已而復赴如是數歲及太傅宣王久病曹爽攝政豐依違二公間故時人有謗書曰曹爽之勢熱如火太傅父子冷如漿李豐兄弟如遊光其意以為豐雖外示清淨而内圖事機有似遊光謗書魏略曰丁謐外似疎濫而内明慧雖與何晏鄧颺等同列而皆少之唯以聲勢屈於曹爽爽亦敬之言無不從故于時謗書云臺中有三狗二狗啀喍不可當一狗憑黙作蛆囊三狗謂何鄧丁也黙者爽小字也意言三狗皆欲嚙人而謐尤蛆囊也魏志黙作㸃蛆作瘟管輅言華陽國志曰先主進攻漢中至定軍黄忠奪登山魏夏侯淵搦戰忠與法正定計斬淵先是神卜管輅曽言於操曰云云操至是服其言按此本非謠諺而近䜟且有韻故附三八縱横黄猪遇虎定軍之南傷折一股乃建安二十四年己亥正月定軍在沔縣南淵與操為弟兄猶手足也吳歌王世容歌吳録曰王鐔字世容為武城令民服德化宿惡奔迸父老歌之鐔藝文類聚作譚王世容政無雙省徭役盗賊空彭子陽歌吳録曰彭循字子陽毗陵人建國二年海賊丁儀等萬人據吳太守秋君聞循勇謀以守令循與儀相見陳説利害應時散去民歌之曰時歲倉卒賊縱横大㦸强弩不可當賴遇賢令彭子陽謠黄龍中童謠周處風土記曰吳黄龍中童謠後孫權征公孫淵浮海乘舶舶白也行白者君追汝句驪馬孫亮初童謠晉書五行志曰孫亮初童謠按楊子閣者反語石子堈也鉤絡鉤帶也及諸葛恪死果以葦席裹身篾束其腰投之石堈後聽恪故吏收葬求之此堈云云吁汝恪何若若蘆葦單衣篾鉤絡於何相求揚子閣揚晉書作常孫亮初白鼉鳴童謠晉書五行志曰吳孫亮初公安有白鼉鳴童謠按南郡城可長生者有急易以逃也明年諸葛恪敗弟融鎮公安亦見襲融刮金印龜服之而死鼉有鱗介甲兵之象也白鼉鳴龜背平南郡城中可長生守死不去義無成㑹稽謠吳書吳主亮被廢為㑹稽王孫休即位三年㑹稽近謠言云云而亮宫人告亮使巫禱祠有惡言黜為候官侯自殺王亮當還為天子建業謠吳書孫休時張布與丁奉謀於㑹殺孫綝永安元年十二月丁夘建業中謠言云云戊辰獵㑹綝入見殺明㑹有變孫皓初童謠文選補遺作揚州歌晉書五行志曰吳孫皓初童謠按皓尋遷都武昌民泝流供給咸怨毒焉按武昌記曰大帝築城江夏以程普為太守遂欲都鄂州改為武昌郡其民謠曰寜飲建業水不食武昌魚寧歸建業死不向武昌居繇是徙都建業則此又非孫皓初矣寧飲建鄴水不食武昌魚寧還建業死不止武昌居壽春童謠江表傳曰初丹陽刁𤣥使蜀得司馬徽與劉廙論運命歴數事𤣥詐増其文以誑國人曰黄旗紫葢見於東南終有天下者荆揚之君乎又得國中降人言壽春下有童謠云云孫皓聞之喜即載其母妻子及後宫數千人從牛渚陸道西上云青葢入洛陽以順天命吳天子當上孫皓天紀中童謠晉書五行志曰吳孫皓天紀中童謠晉武帝聞之加王濬龍驤將軍及征吳江西衆軍無過者而王濬先定秣陵羊祜别傳曰先時吳童謠云云祜聞之曰此必水軍有功但當思應其名者耳即表濬為龍驤將軍濬小字阿童阿童復阿童銜刀游渡江不畏岸上虎但畏水中龍吳謠吳志曰周瑜少精意於音樂唯三爵之後其有闕誤瑜必知之知之必顧故時人謠云曲有誤周郎顧有一作復諺廣陵諺張勃吳録曰陸稠字伯嬴為廣陵太守姦吏斂手廣陵諺曰解結理煩我國陸君時人語髙僧傳曰孫權已制江左而佛教未行有支謙者本月支人來遊漢境博覽經籍莫不精究遍學異書通六國語其為人細長黒瘦眼多白而睛黄時人為之語曰支郎眼中黄形軀雖細是智囊異小兒言晉書五行志曰孫休永安三年將守質子羣聚嬉戲有異小兒忽來言曰云云又曰我非人熒惑星也言畢上昇仰視若曵一匹練有頃没干寶曰後四年而蜀亡六年而魏廢二十一年而吳平於是九服歸晉魏與吳蜀並戰國三公鋤司馬如之謂也三公鋤司馬如題門語世説新語曰賀邵㑹稽山隂人歴散騎常侍出為吳郡太守初不出門吳中諸强族輕之乃題府門云㑹稽雞不能啼賀聞故出行至門反顧索筆足之云於是至諸屯邸檢校諸顧陸役使官兵及藏逋亡悉以事言上罪者甚衆陸抗時為江陵都督故下請孫皓然後得釋不可啼殺吳兒孫皓時詩妖晉書五行志曰孫皓遣使者祭石印山下妖祠使者因以丹書巖口云云皓聞之曰從大皇帝至朕四世太平之主非朕復誰恣虐踰甚尋以降亡近詩妖也楚九州渚吳九州都揚州士作天子四世治太平矣古樂苑巻四十七
