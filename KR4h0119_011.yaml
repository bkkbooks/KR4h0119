body:
  text: 古樂苑巻十一明梅鼎祚編鼓吹曲辭四宋齊梁隋宋鼓吹鐃歌三首宋書樂志曰鼓吹鐃歌四篇其一篇闕沈約云樂人以音聲相傳訓詁不可復解凡古樂錄皆大字是辭細字是聲聲辭合冩故致然耳上邪曲四解大竭夜烏自云何來堂吾來聲烏奚姑悟姑尊盧聖子黄尊來餭清嬰烏白日為隨來郭吾微令吾應龍夜烏由道何來直子為烏奚如悟姑尊盧雞子聽烏虎行為來明吾微令吾詩則夜烏道祿何來黒洛道烏奚悟如尊爾尊盧起黄華烏伯遼為國日忠兩令吾伯遼夜烏若國何來日忠兩烏奚如悟姑尊盧面道康尊籙龍永烏赫赫福祚夜音㣲令吾晩芝曲九解宋書樂志曰漢曲有逺期疑是也㡬令吾㡬令諸韓亂發正令吾㡬令吾諸韓從聽心令吾若里洛何來韓微令吾尊盧忌盧文盧子路子路為路雞如文盧炯烏諸祚微令吾㡬令諸韓或公隨令吾㡬令吾㡬諸或言隨令吾黒洛何來諸韓微令吾尊盧安成隨來免路路子為吾路奚如文盧炯烏諸祚微令吾㡬令吾㡬諸或言隨令吾此下宋書無㡬令吾諸或言㡬苦黒洛何來諸韓微令吾尊盧公洴隨來免路子子路子為路奚姑文盧炯烏諸祚微令吾艾如張曲三解㡬令吾呼歴舍居執來隨咄武子邪令烏銜鍼相風其右其右㡬令吾呼羣議破葫執來隨吾咄武子邪令烏令烏今􅠱入海相風及後㡬令吾呼無公赫吾執來隨吾咄武子邪令烏無公赫吾婮立諸布始布宋鼓吹鐃歌十五首宋書樂志曰鼓吹鐃歌十五篇何承天晉義熈末私造疑未嘗被於歌也雖有漢曲舊名大抵别増新意故其義與古辭考之多不合云何承天朱路篇朱路揚和鸞翠盖耀金華𤣥牡飾樊纓流旌拂飛霞雄㦸闢曠塗班劒翼高車三軍且莫喧聽我奏鐃歌清鞞驚短簫朗鼓節鳴笳人心惟愷豫兹音亮且和輕風起紅塵渟瀾發㣲波逸韻騰天路穨響結城阿仁聲被八表威震振九遐詹詹介冑士勗哉念皇家思悲公篇思悲公懐衮衣東國何悲公西歸公西歸流二叔幼主既悟偃禾復偃禾復聖志申營都新邑從斯民從斯民德惟明制禮作樂興頌聲興頌聲致嘉祥鳴鳳爰集萬國康萬國康猶弗巳握髪吐餐下羣士惟我君繼伊周親覩盛世復何求雝離篇雍士多離心荆民懐怨情二凶不量德搆難稱其兵王人銜朝命正辭糾不庭上宰宣九伐萬里舉長旌樓船掩江濆駟介飛重英歸德戒後夫賈勇尚先鳴逆徒既不濟愚智亦相傾霜鋒未及染鄢郢忽巳清西川無濳鱗北渚有奔鯨凌威致天府一戰夷三城江漢被美化宇宙歌太平惟我東郡民曽是深推誠戰城南篇戰城南衝黄塵丹旌電烻鼓靁震勍敵猛戎馬殷横陳亘野若屯雲仗大順應三靈義之所感士忘生長劒擊繁弱鳴飛鏑炫晃亂奔星虎騎躍華眊旋朱火延起騰飛煙驍雄斬高旗搴長角浮呌響清天夷羣冦殪逆徒餘黎霑惠詠來蘇奏愷樂歸皇都班爵獻俘邦國娛巫山高篇巫山高三峽峻青壁千尋深谷萬仞崇巖冠靈林冥冥山禽夜響晨猿相和鳴洪波迅澓載逝載停悽悽商旅之客懷苦情在昔陽九皇綱㣲李氏竊命宣武耀靈威蠢爾逆縱復踐亂機王旅薄伐傳首來至京師古之為國惟德是貴力戰而虐民鮮不顚墜矧乃叛戾伊胡能遂咨爾巴子無放肆上陵者篇上陵者相追攀被服纎麗振綺紈㩦童幼升崇巒南望城闕鬱盤桓王公第通衢端高甍華屋列朱軒臨濬谷掇秋蘭士女悠奕映隰原指營丘感牛山爽鳩既沒景君歎詹歲聿逝不還志氣衰沮𤣥鬢斑野莽宿墳土乾顧此纍纍中心酸生必死亦何怨取樂今日展情歡將進酒篇將進酒慶三朝備繁禮薦嘉肴榮枯換霜霧交緩春帶命朋僚車等旗馬齊鑣懷温克樂林濠士失志愠情勞思㫖酒寄遊遨敗德人甘醇醪耽長夜或淫妖興屢舞厲哇謠形傞傞聲號呶首既濡志亦荒性命夭國家亡嗟後生節酣觴匪酒辜孰為殃君馬篇君馬麗且閑揚鑣騰逸姿駿足躡流景高歩追輕飛冉冉六轡柔奕奕金華暉輕霄翼羽葢長風靡淑旂願為范氏驅雝容步中畿豈效詭遇子馳騁趣危機鉛陵策良駟造父為之悲不怨呉坂峻但恨伯樂稀赦彼岐山盗實濟韓原師奈何漢魏主縱情營所私疲民甘藜藿廐馬患盈肥人畜眢厥養蒼生將焉歸芳樹篇芳樹生北庭豐隆正徘徊翠穎陵冬秀紅葩迎春開佳人閒幽室惠心婉以諧蘭芳掩綺幌綠草被長階日夕遊雲際歸禽命同棲皓月盈􅀢景凉風拂中閨哀絃理虚堂要妙清且悽嘯歌流激楚傷此碩人懷梁塵集丹帷微飈揚羅袿豈怨嘉時暮徒惜良願乖有所思篇有所思思昔人曾閔二子善養親和顔色奉昏晨至誠烝烝通明神鄒孟軻為齊卿稱身受祿不貪榮道不用獨擁楹三從既誶禮義明飛鳥集猛獸附功成事畢乃更娶哀我生遘凶旻幼罹荼毒備艱辛慈顔絶見無因長懷永思託丘墳毒郭作酷雉子遊原澤篇雉子遊原澤幼懷耿介心飲啄雖勤苦不願棲園林古有避世士抗志清霄岑浩然寄卜肆揮棹通川隂逍遥風塵外散髪撫鳴琴卿相非所盼何况於千金功名豈不美寵辱亦相尋氷炭結六府憂虞纒胷襟當世須大度量巳不克任三復泉流誡自驚良巳深上邪篇上邪下難正衆枉不可矯音和響必清端影縁直表大化揚仁風齊人猶偃草聖王既巳沒誰能宏至道開春湛柔露代終肅嚴霜承平貴孔孟政弊矦申商孝公明賞罰六世猶克昌李斯肆濫刑秦民所以亡漢宣隆中興魏祖寧三方譬彼鍼與石效疾故稱良行葦非不厚悠悠何詎央琴瑟時未調改弦當更張矧乃治天下此要安可忘臨高臺篇臨高臺望天衢飄然輕舉陵太虚携列子超帝鄉雲衣雨帶椉風翔肅龍駕㑹瑤臺清輝浮景溢蓬萊濟西海濯洧盤佇立雲嶽結幽蘭馳迅風遊炎州願言桑梓思舊遊傾霄葢靡電旌降彼天塗穨窈冥辭仙族歸人羣懷忠抱義奉明君任窮達隨所遭何為逺想令心勞逺期篇逺期千里客肅駕候良辰近命城郭友具爾惟懿親高門啓雙闈長筵列嘉賓中唐儛六佾三廂羅樂人簫管激悲音羽毛揚華文金石響高宇絃歌動梁塵修標多巧捷丸劒亦入神遷善自雅調成化由清均主人垂隆慶羣士樂亡身願我聖明君遐期保萬春石流篇石上流水湔湔其波發源幽岫永歸長河瞻彼逝者歲月其偕子在川上惟以増懷嗟我殷憂載勞寤寐遘此百罹有志不遂行年倐忽長勤是嬰永言沒世悼兹無成幸遇開泰沐浴嘉運緩帶安寢亦又何愠古之為仁自求諸巳虚情遥慕終於徒巳齊隨王鼓吹曲十首齊永明八年謝脁奉鎭西随王教於荆州道中作謝朓元㑹曲以下三曲頌帝功二儀啓昌歴三陽應慶期珪䞇紛成序鞮譯􅀈來思分階赩組練充庭羅翠旗觴流白日下吹謐景雲滋天儀穆藻殿萬㝢壽皇基陽一作朝謐一作溢壽一作慶郊祀曲六宗禋祀岳五畤奠甘泉整蹕遊九闕清簫開八壥鏘鏘玉鑾動溶溶金障旋郊宮光巳屬升柴禮既䖍福響靈之集南岳固斯年靈一作雲鈞天曲高宴顥天臺置酒迎風觀笙鏞禮百神鍾石動雲漢瑤臺琴瑟驚綺席舞衣散威鳳來參差𤣥鶴起凌亂巳慶明庭樂詎慙南風彈臺一作堂琴一作寶起一作至詎慙一作誰想入朝曲以下三曲頌藩德江南佳麗地金陵帝王州逶迤帶綠水迢遞起朱樓飛甍夾馳道垂楊䕃御溝凝笳翼高葢疊鼓送華輈獻納雲臺表功名良可收出藩曲雲枝紫微内分組承明阿飛艎遡極浦旌節去闗河眇眇蒼山色沈沈逺水波鐃音巴渝曲簫管盛唐歌夫君邁遺德江漢仰清和遡一作遊逺一作寒管一作鼓遺一作惟校獵曲凝霜冬十月殺盛凉飇哀原澤曠千里騰騎紛徃來平罝望烟合烈火從風迴殪獸華容浦張樂荆山臺虞人昔有諭明明時戒哉哀一作開紛一作絡從戎曲選旅辭轘轅弭節赴河源日起霜戈照風迴連騎飜紅塵朝夜合黄河萬里昬寥戾清笳囀蕭條邊馬煩自勉輟耕願征役去何言赴一作趨送逺曲北梁辭歡宴南浦送佳人方衢控龍馬平路騁朱輪瓊筵妙舞絶桂席羽觴陳白雲丘陵逺山川時未因一為清吹激潺湲傷别巾登山曲天明開秀崿瀾光媚碧隄風盪飄鶯亂雲華芳樹低暮春春服美遊駕凌丹梯升嶠既小魯登巒且悵齊王孫尚游衍蕙草正萋萋飄鶯亂一作翻鶯亂雲華一作雲行凌一作躡丹一作石汎水曲玉露霑翠葉金風鳴素枝罷遊平樂苑汎鷁昆明池旌旗散容裔簫管吹參差日晚厭遵渚採菱贈清漪百年如流水寸心寧共知露一作霜旌一作羽管一作谷梁鼓吹曲十二首隋書樂志曰梁高祖制鼔吹新歌十二曲沈約木紀謝隋書樂志曰改朱鷺言齊謝梁升也木紀謝火運昌炳南陸耀炎光民去癸鼎歸梁鮫魚出慶雲翔􅀈五帝軼三王德無外化溥將仁蕩蕩義湯湯浸金石達昊蒼横四海被八荒舞干戚垂衣裳對天眷坐巖廊𦙍有錫祚無疆風教逺禮容盛感人神宣舞詠降繁祉延嘉慶火一作炎賢首山改思悲翁言武帝破魏軍於司部肇王迹也賢首山險而峻椉峴憑臨胡陣騁奇謀奮卒徒斷白馬塞飛狐殪日逐殱骨都刃谷蠡馘林胡草既潤原亦塗輪無反幕有烏掃殘孽震戎逋揚凱奏展歡酺詠枤杜旋京吳謀一作謨桐柏山改艾如張言武帝牧司王業彌章也桐柏山淮之首肇基帝跡遂光區有大震邊闗迹殪獯醜農既勸民惟阜穗充庭稼盈畆迨嘉辰􅏪芳糗納寒塲為春酒昭景福介眉壽天斯長地斯久化無極功無朽道亡改上之囘言東昬喪道義師起樊鄧也道亡數極歸永元悠悠兆庻盡含寃沈河莫極皆無安赴海誰授矯龍翰自樊漢仙波流水清且瀾救此倒懸拯塗炭誓師劉旅赫靈斷率兹八百驅十亂登我聖明由多難長夜杳冥忽云旦忱威改擁離言破加湖元勲建也忱威授律命蒼兕言薄加湖灌秋水迴瀾瀄汨汎増雉爭河投岸掬盈指犯刃嬰戈洞流矢資此威烈齊文軌兕一作鬼威一作盛漢東流改戰城南言義師克魯山城也漢東流江之汭逆徒蜂聚旌旗紛蔽仰震威靈椉高騁銳至仁解網窮鳥入懷因此龍躍言登泰階鶴樓峻改巫山高言平郢城兵威無敵也鶴樓峻連翠微因巖設險池永歸脣亡齒懼薄言震耀靈威凶衆稽顙天不能違金湯無所用功烈長巍巍昬主恣淫慝改上陵言東昬政亂武帝起義平九江姑熟大破朱雀伐罪弔民也昬主恣淫慝皆曰自昌盛上仁矜億兆誓師為請命既齊丹浦戰又符甲子辰龕難伐有罪伐罪弔斯民悠悠億萬姓於此覩陽春石首局改將進酒言義師平京城仍廢昬定大事也石首局北墉墐新堞嚴東壘峻共表裏遥相鎮矢未飛鼓方振競銜璧竝輿櫬酒池擾象廊震同伐謀兼善陳闢應和掃煨燼翦庶惡靡餘𦙍期運集改有所思言武帝膺籙受禪德盛化逺也期運集惟皇膺寶符龍躍清漢渚鳳起方城隅謳歌共適夏獄訟兩違朱二儀啓嘉祚千載猶旦暮舞蹈流帝功金玉昭王度膺一作應方一作南於穆改芳樹言大梁闡運君臣和樂休祚方逺也於穆君臣君臣和以肅闗王道定天保樂均靈囿宴同在鎬前庭懸鼓鍾左右列笙鏞纓佩俯仰有則備禮容翔振鷺騁羣龍隆周何足擬逺與唐比蹤前庭一作庭前偹一作脩惟大梁改上邪言梁德廣運仁化洽也惟大梁開運受籙膺圖君八極冠帶被五都四海並和㑹排闕欵塞無異塗膺一作應圖一作天君八極一作冠八極一本無冠字隋凱樂歌辭三首述帝德於穆我后睿哲欽明膺天之命載育羣生開元創歴邁德垂聲朝宗萬㝢祇事百靈煥乎皇道昭哉帝則惠政滂流仁風四塞淮海未賓江湖背德運籌必勝濯征斯克八荒霧巻四表雲褰雄圖盛略邁後光前寰區巳泰福祚方延長歌凱樂天子萬年述諸軍用命帝德逺覃天維宏布功高雲天聲隆韶濩惟彼海隅未從王度皇赫斯怒元戎啓路桓桓猛將赳赳英謨攻如燎髪戰似摧枯救兹塗炭克彼妖逋塵清兩越氣靜三吳鯨鯢巳夷封疆在闢班馬蕭蕭歸旌奕奕雲臺表效司勲紀績業並山河道固金石述天下太平阪泉軒德丹浦堯勲始實以武終乃以文嘉樂聖主大哉為君出師命將廓定重氛書軌既并干戈是戢宏風設教政成人立禮樂聿興衣裳載緝風雲自美嘉祥爰集皇皇聖政穆穆神猷牢籠虞夏度越姬劉日月比耀天地同休永清四海長帝九州古樂苑巻十一
