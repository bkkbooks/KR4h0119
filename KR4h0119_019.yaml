body:
  text: 古樂苑卷十九明梅鼎祚編相和歌辭瑟調曲古今樂録曰王僧虔技録瑟調曲有善哉行隴西行折楊栁行西門行東門行東西門行却東西門行順東西門行飲馬行上留田行新成安樂宫行婦病行孤子生行放歌行大牆上蒿行野田黃爵行釣竿行臨髙臺行長安城西行武舍之中行鴈門太守行豔歌何嘗行豔歌福鍾行豔歌雙鴻行煌煌京洛行帝王所居行門有車馬客行牆上難用趨行日重光行蜀道難行棹歌行有所思行蒲坂行採梨橘行白楊行胡無人行青龍行公無渡河行荀氏録所載十五曲傳者九曲武帝朝日自惜古公文帝朝遊上山明帝赫赫我祖古辭來日並善哉古辭羅敷豔歌行是也其六曲今不傳五嶽善哉行武帝鴻鴈却東西門行長安長安城西行雙鴻福鍾並豔歌行牆上牆上難用趨行是也其器有笙笛節琴瑟筝琵琶七種歌弦六部張永録云未歌之前有七種弦又在弄後晉宋齊止四器也善哉行六解宋書樂志作古辭詩紀云或以為曹子建詩按子建擬善哉行為日苦短云當來日大難則此非子建作矣古辭來日大難口燥唇乾今日相樂皆當喜歡一解經歷名山芝草翻翻仙人王喬奉藥一丸二解自惜袖短內手知寒慙無靈輒以報趙宣三解月沒參橫北斗闌干親交在門飢不及餐四解歡日尚少戚日苦多以何忘憂彈筝酒歌五解淮南八公要道不煩參駕六龍遊戲雲端六解魏右一曲晉樂所奏同前二首魏武帝古公亶甫積德垂仁思𢎞一道哲王於豳一解太伯仲雍王德之仁行施百世斷髮文身二解伯夷叔齊古之遺賢讓國不用餓殂首山三解智哉山甫相彼宣王何用杜伯纍我聖皇四解齊桓之霸賴得仲父後任豎刁蟲流出户五解晏子平仲積德兼仁與世沈德未必思命六解仲尼之世王國為君隨制飲酒揚波使官七解自惜身薄祜夙賤罹孤苦既無三徙教不聞過庭語一解其窮如抽裂自以思所怙雖懷一介志是時其能與二解守窮者貧賤惋歎淚如雨泣涕於悲夫乞活安能覩三解我願於天窮琅琊傾側左雖欲竭忠誠欣公歸其楚四解快人由為歎抱情不得敘顯行天教人誰知莫不緒五解我願何時隨此歎亦難處今我將何照於光曜釋銜不如雨六解樂右二曲魏晉所奏同前四首朝日一首初學記載第一解題云於講堂作朝遊一首藝文題云銅雀園詩宋書無有美一首文帝上山采薇薄暮苦飢溪谷多風霜露霑衣一解野雉羣雊猿猴相追還望故鄉鬱何壘壘二解髙山有崖林木有枝憂來無方人莫之知三解人生若寄多憂何為今我不樂嵗月其馳四解湯湯川流中有行舟隨波轉薄有似客遊五解䇿我良馬被我輕裘載馳載驅聊以忘憂六解日嵗一作其一作如有美一人婉如清揚妍姿巧笑和媚心腸知音識曲善為樂方哀絃微妙清氣含芳流鄭激楚度宫中商感心動耳綺麗難忘離鳥夕宿在彼中洲延頸鼓翼悲鳴相求眷然顧之使我心愁嗟爾昔人何以忘憂朝日樂相樂酣飲不知醉悲絃激新聲長笛吐清氣一解弦歌感人腸四座皆歡悅寥寥髙堂上涼風入我室二解持滿如不盈有德者能卒君子多苦心所愁不但一三解慊慊下白屋吐握不可失衆賔飽滿歸主人苦不悉四解比翼翔雲漢羅者安所羇沖靜得自然榮華何足為五解朝遊髙臺觀夕宴華池隂大酋奉甘醪狩人獻嘉禽一解齊倡發東無秦筝奏西音有客從南來為我彈清琴二解五音紛繁會拊者激微吟淫魚乘波聽踴躍自浮沈三解飛鳥翻翻舞悲鳴集北林樂極哀情來憀亮摧肝心四解清角豈不妙德薄所不任大哉子野言弭弦且自禁五解右四曲魏晉樂所奏同前二首明帝我徂我征伐彼蠻虜練師簡卒爰正其旅一解輕舟竟川初鴻依浦桓桓猛毅如羆如虎二解發炮若雷吐氣成雨旄旍指麾進退應矩三解百馬齊轡御由造父休休六軍咸同斯武四解兼塗星邁亮兹行阻行行日逺西背京許五解遊弗淹旬遂屇揚土奔寇震懼莫敢當御六解虎臣列將怫鬱充怒淮泗肅清奮揚微所七解運德耀威惟鎮惟撫反斾言歸告入皇祖八解亡六解下有云吳實豎子蜀則虜假氣遊魂魚鳥為伍赫赫大魏王師徂征冒暑討亂振耀威靈一解泛舟黃河隨波潺湲通渠回越行路綿綿二解綵旄蔽日旌旒翳天淫魚瀺灂遊嬉深淵三解唯塘泊從如流不為單握揚楚心惆悵歌採薇心綿綿在淮肥願君速捷蚤旋歸四解右二曲魏晉樂所奏嬉前曲羆一作貅成一作如告入一作斾入後曲一作戲泊一作洎捷一作節同前宋謝靈運暘谷躍升虞淵引落景曜東隅晼晚西薄三春燠敷九秋蕭索涼來溫謝寒往暑却居德斯頤積善嬉謔隂灌陽叢凋華墮萼歡去易慘悲至難鑠擊節當歌對酒當酌鄙哉愚人戚戚懷瘼善哉達士滔滔處樂擊節郭本作激涕同前集雜體詩云擬魏文遊宴姑從郭本收入梁江淹置酒坐飛閣逍遙臨華池神飈自逺至左右芙蓉披緑竹夾清水秋蘭被幽崖月出照園中冠佩相追隨客從南楚來為我吹參差淵魚猶伏浦聽者未云罷髙文一何綺小儒安足為肅肅廣殿隂雀聲愁北林衆賔還城邑何用慰我心我一作吾當來日大難曹植擬善哉行為日苦短魏陳思王植日苦短樂有餘乃置玉樽辦東厨廣情故心相於闔門置酒和樂欣欣遊馬後來轅車解輪今日同堂出門異鄉别易會難各盡杯觴長笛吐清氣出魏文帝善哉行辭陳周𢎞讓商聲傳後出龍吟鬱前吐情斷山陽舍氣咽平陽塢胡騎爭北歸偏知别鄉苦羈旅情易傷零淚如交雨同前賀徹胡關氛霧侵羌笛吐清音韻切山陽曲聲悲隴上吟栁折城邉樹梅舒嶺外林方知出塞虜不憚武溪深隴西行通典云秦置隴西郡以居隴坻之西為名按此篇前後不屬一曰步出夏門行樂録無夏門行而夏門後四句與隴西首同豈邪徑過空廬合為樂甚獨殊為一曲好婦別為一曲邪今附列二首于後辭義明備頗為得之王僧虔技録曰隴西行歌武帝碣石文帝夏門二篇古辭天上何所有歷歷種白榆桂樹夾道生青龍對道隅鳳凰鳴啾啾一母將九雛顧視世間人為樂甚獨殊好婦出迎客顔色正敷愈伸腰再拜跪問客平安不請客北堂上坐客氈氍毹清白各異樽酒上正華疏酌酒持與客客言主人持却略再拜跪然後持一杯談笑未及竟左顧敇中厨促令辦粗飯慎莫使稽留廢禮送客出盈盈府中趨送客亦不逺足不過門樞取婦得如此齊薑亦不如健婦持門户亦勝一丈夫此篇出諸集不入樂志邪徑過空廬好人常獨居卒得神仙道上與天相扶過謁王父母乃在太山隅離天四五里道逢赤松俱攬轡為我御將我上天遊天上何所有歷歷種白榆桂樹夾道生青龍對道隅鳳皇鳴啾啾一母將九雛顧視世間人為樂甚獨殊好婦出迎客顔色正敷愈伸腰再拜跪問客平安不請客北堂上坐客氈氍毹清白各異樽酒上正華疏酌酒持與客客言主人持却略再拜跪然後持一杯談笑未及竟左顧敕中厨促令辦粗飯慎莫使稽留廢禮送客出盈盈府中趨送客亦不逺足不過門樞取婦得如此齊薑亦不如健婦持門户亦勝一丈夫同前晉陸機我靜如鏡民動如煙事以形兆應以象懸豈曰無才世鮮興賢同前宋謝靈運昔在老子志理成篇柱小傾大綆短絶泉鳥之栖遊林檀是間韶樂牢膳豈伊攸便胡為乖枉從表方圓耿耿僚志慊慊丘園善歌以詠言理成篇志一作至同前謝惠連運有榮枯道有舒屈潛保黃裳顯服朱黻誰能守靜棄華辭榮窮谷是處考槃是營千金不回百代傳名厥包者柚忘憂者萱何為有用自乖中原實摘柯摧葉殞條煩同前三首後二首一作泛舟橫大江按篇中各云隴西且其辭義絶與大江無預簡文自有滄波白日暉一篇此二篇郭本列隴西行為是梁簡文帝邉秋胡馬肥雲中驚寇入勇氣時無侣輕兵救邉急沙平不見虜嶂嶮還相及出塞豈成歌經川未遑汲烏孫塗更阻康居路猶澀月暈抱龍城星流照馬邑長安路逺書不還寧知征人獨佇立時一作特嶮一作轉隴西四戰地羽檄嵗時聞護羌擁漢節校尉立元勳石門留鐵騎氷城息夜軍洗兵行驟雨送陳出黃雲沙長無止泊水脈屢縈分當思勒彛鼎無用想羅裙悠悠懸斾旌知向隴西行減竈驅前馬銜枚進後兵沙飛朝似幕雲起夜疑城回山時阻路絶水極稽程往年郅支服今嵗單于平方觀凱樂盛飛蓋滿西京同前庾肩吾借問隴西行何當驅馬征草合前迷路雲濃後暗城寄語幽閨妾羅袖勿空縈步出夏門行古辭邪徑過空廬好人常獨居卒得神仙道上與天相扶過謁王父母乃在太山隅離天四五里道逢赤松俱攬轡為我御將我上天遊天上何所有歷歷種白榆桂樹夾道生青龍對伏趺同前四解本集作步出東西門行一曰碣石篇樂志曰碣石魏武帝辭晉以為碣石舞其歌四章一曰觀滄海二曰冬十月三曰土不同四曰龜雖夀與此並同但曲前無豔爾魏武帝雲行雨步超越九江之皋臨觀異同心意懷遊豫不知當復何從經過至我碣石心惆悵我東海雲行至此為豔東臨碣石以觀滄海水何淡淡山島竦峙樹木叢生百草豐茂秋風蕭瑟洪波踴起日月之行若出其中星漢燦爛若出其裏幸甚至哉歌以詠志觀滄海一解孟冬十月北風徘徊天氣肅清繁霜霏霏鵾雞晨鳴鴻鴈南飛鷙鳥潛藏熊羆窟棲錢鎛停置農收積場逆旅正設以通賈商幸甚至哉歌以詠志冬十月二解鄉土不同河朔隆寒流澌浮漂舟船行難錐不入地蘴藾深奧水竭不流氷堅可蹈士隱者貧勇俠輕非心常歎怨戚戚多悲幸甚至哉歌以詠志河朔寒三解神龜雖夀猶有竟時騰蛇乘霧終為土灰老驥伏櫪志在千里烈士暮年壯心不已盈縮之期不但在天養怡之福可得永年幸甚至哉歌以詠志龜雖夀四解同前二解一曰隴西行步出夏門東登首陽山嗟哉夷叔仲尼稱賢君子退讓小人爭先惟斯二子於今稱傳林鍾受謝節改時遷日月不居誰得久存善哉殊復善弦歌樂情一解商風夕起悲彼秋蟬變形易色隨風東西乃眷西顧雲霧相連丹霞蔽日彩虹帶天弱水潺潺葉落翩翩孤禽失羣悲鳴其間善哉殊復善悲鳴在其間二解朝遊清泠日暮嗟歸蹙迫日暮烏鵲南飛繞樹三匝何枝可依卒逢風雨樹折枝摧雄來驚雌雌獨愁棲夜失羣侣悲鳴徘徊芃芃荆棘葛生綿綿感彼風人惆悵自憐月盈則沖華不再繁古來之説嗟哉一言朝遊至嗟歸為豔蹙迫下為趨右一曲魏晉樂所奏林鍾受謝節改時遷日月不居誰得久存商風夕起悲彼秋蟬變形易色隨風東西乃眷西顧雲霧相連丹霞蔽日彩虹帶天谷水潺潺葉落翩翩孤禽失羣悲鳴其間朝遊清泠日暮嗟歸蹙迫日暮烏鵲南飛繞樹三匝何枝可依卒逢風雨樹折枝摧雄來驚雌雌獨愁棲夜失羣侣悲鳴徘徊芃芃荆棘葛生綿綿感彼風人惆悵自憐月盈則沖華不再繁古來之説嗟哉一言右一曲疑是前篇本辭丹霞蔽日行魏文帝丹霞蔽日彩虹垂天谷水潺潺木落翩翩孤禽失羣悲鳴雲間月盈則沖華不再繁古來有之嗟我何言明帝步出夏門行八句與此同同前陳思王植紂為昏亂虐殘忠正周室何隆一門三聖牧野致功天亦革命漢祖之興階秦之衰雖有南面王道陵夷炎光再幽忽滅無遺虐殘忠正一作殘忠虐正折楊栁行四解栁古今樂録曰王僧虔技録云折楊行歌文帝西山古默默二篇今不歌古辭默默施行違厥罰隨事來妹喜殺龍逢桀放於鳴條一解祖伊言不用紂頭懸白旄指鹿用為馬胡亥以喪軀二解夫差臨命絶乃云負子胥戎王納女樂以亡其由余璧馬禍及虢二國俱為墟二解三夫成市虎慈母投杼趨卞和之刖足接輿歸草廬四解奏右一曲魏晉樂所宋書作大曲同前四解西山一何髙髙髙殊無極上有兩仙僮不飲亦不食與我一丸藥光耀有五色一解服藥四五日身體生羽翼輕舉乘浮雲倐忽行萬億流覽觀四海茫茫非所識二解彭祖稱七百悠悠安可原老聃適西戎于今竟不還王喬假虛辭赤松垂空言三解達人識真偽愚夫好妄傳追念往古事憒憒千萬端百家多迂怪聖道我所觀四解曲右一魏晉樂所奏同前晉陸機邈矣垂天景壯哉奮地雷豐隆豈久響華光但西隤日落似有竟時逝恆若催仰悲朗月運坐觀琁蓋回盛門無再入衰房莫苦開人生固已短出處鮮為諧慷慨惟昔人興此千載懷升龍悲絶處葛藟變條枚寤寐豈虛歎曽是感與摧弭意無足歎願言有餘哀豐隆一作隆隆華光一作華華同前二首宋謝靈運鬱鬱河邉樹青青野田草舍我故鄉客將適萬里道妻妾牽衣袂抆淚沾懷抱還拊幼童子顧託兄與嫂辭訣未及終嚴駕一何早負笮引文舟飢渴常不飽誰令爾貧賤咨嗟何所道騷屑出穴風揮霍見日雪颼颼無久搖皎皎幾時潔未覺泮春氷已復謝秋節空對尺素遷獨視寸隂滅否桑未易繫泰茅難重拔桑茅迭生運語默寄前哲西門行古今樂録曰王僧虔技録西門行歌古西門一篇今不傳又有順東西門行為三七言亦傷時顧隂有類於此古辭出西門步念之今日不作樂當待何時一解夫為樂為樂當及時何能坐愁怫鬱當復待來兹二解飲醇酒炙肥牛請呼心所歡可用解愁憂三解人生不滿百常懷千嵗憂晝短苦夜長何不秉燭逰四解自非仙人王子喬計會夀命難與期自非仙人王子喬計會夀命難與期五解人夀非金石年命安可期貪財愛惜費但為後世嗤六解曲右一晉樂所奏待乘兹宋書無待字苦宋書作而出西門步念之今日不作樂當待何時逮為樂逮為樂當及時何能愁怫鬱當復待來兹釀美酒炙肥牛請呼心所歡可用解憂愁人生不滿百常懷千嵗憂晝短苦夜長何不秉燭遊遊行去去如雲除弊車羸馬為自儲右一曲本辭東門行古今樂録曰王僧虔技録云東門行歌古東門一篇今不歌古辭出東門不顧歸來入門悵欲悲盎中無斗儲還視桁上無懸衣一解拔劒出門去兒女牽衣啼他家但願富貴賤妾與君共餔糜二解共餔糜上用倉浪天故下為黃口小兒今時清廉難犯教言君復自愛莫為非三解今時清廉難犯教言君復自愛莫為非行吾去為遲平慎行望君歸四解樂右一曲晉所奏出東門不顧歸來入門悵欲悲盎中無斗米儲還視架上無懸衣拔劒東門去舍中兒母牽衣啼他家但願富貴賤妾與君共餔糜上用倉浪天故下當用此黃口兒今非咄行吾去為遲白髮時下難久居右一曲本辭同前選詩外編作遊春篇晉張駿勾芒御春正衡紀運玉瓊明庶起祥風和氣翕來征慶雲蔭八極甘雨潤四坰昊天降靈澤朝日耀華精嘉苖布原野百卉敷時榮鳩鵲與鶖黃間關相和鳴芙蓉覆靈沼香花揚芳馨春遊誠可樂感此白日傾休否有終極落葉思本莖臨川悲逝者節變動中情鶖一作鶯芙蓉一作菉萍同前宋鮑照傷禽惡弦驚倦客惡離聲離聲斷客情賔御皆涕零涕零心斷絶將去復還訣一息不相知何況異鄉別遙遙征駕逺杳杳白日晚居人掩閨卧行子夜中飯野風吹草木行子心腸斷食梅常苦酸衣葛常苦寒絲竹徒滿座憂人不解顔長歌欲自慰彌起長恨端白一作落草集作秋東西門行古今樂録曰王僧虔技録云東西門行今不歌梁劉孝威廣津寒欲歇聨檣密纜收天髙匝近岫江闊少方舟餞淚留神眷離欷切私儔佇變齊兒俗當傳楚獻囚徒然頒並命秪而心思如抽却東西門行古今樂録曰王僧虔技録云却東西門行荀録所載武帝鴻鴈一篇今不傳傅玄鴻鴈生塞北行出此魏武帝鴻鴈出塞北乃在無人鄉舉翅萬餘里行止自成行冬節食南稻春日復北翔田中有轉蓬隨風逺飄揚長與故根絶萬嵗不相當奈何此征夫安得去四方戎馬不解鞍鎧甲不離傍冉冉老將至何時返故鄉神龍藏深泉猛獸步髙岡狐死歸首丘故鄉安可忘右一曲魏晉樂所奏同前晉傅玄和樂惟有舞應節不失機退似前龍婉進如翔鸞飛回目流神光傾亞有餘姿疑闕同前宋謝惠連慷慨發相思惆悵戀音徽四節競闌侯六龍引穨機人生隨時變遷化焉可祈百年難必保千慮盈懷之闕誤同前梁沈約驅馬城西阿遙眺想京闕望極煙原盡地逺山河沒搖裝非短晨還歌豈明發修服悵邉羇瞻途眇鄉謁馳蓋轉徂龍回星引奔月樂去哀鏡滿悲來壯心歇嵗華委徂貌年霜移暮髮辰物久侵晏征思坐淪越清氛掩行夢憂原蕩瀛渤一念起關山千里顧丘窟鏡疑作境晏一作尋鴻鴈生塞北行晉傳玄鳳皇逺生海西及時崑山岡五德存羽儀和鳴定宫商百鳥並侍左右鼓翼騰華光上熙遊雲日間千嵗時來翔孰若彼龍與龜曳尾泥中藏非雲雨則不升冬伏春乃驤退哀此秋蘭草根絶隨化揚靈氣一何憂美萬里馳芬芳常恐物微易歇一朝見棄忘順東西門行古今樂録曰王僧虔技録云順東西門行今不歌晉陸機出西門望天庭陽谷既虛崦嵫盈感朝露悲人生逝者若斯安得停桑樞戒蟋蟀鳴我今不樂嵗聿征逮未暮及時平置酒髙堂宴友生激朗笛彈哀筝取樂今日盡歡情同前宋謝靈運出西門眺雲間揮斤扶木墮虞泉信道人鑒徂川思樂暫捨誓不旋閔九九傷牛山宿心載違徒昔言競落運務穨年招命儕好相追牽酌芳酤奏繁弦惜寸隂情固然墜一作墜同前謝惠連哀朝菌閔穨力遷化常然焉肯息及壯齒遇世直酌酪華堂集親識舒情盡歡遣悽惻古樂苑卷十九
