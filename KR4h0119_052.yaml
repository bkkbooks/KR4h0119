body:
  text: 古樂苑卷五十二眀梅鼎祚編鬼歌曲辭謡語附鬼歌詩者斯為志怪述異耳彼其取精已多遊魂為變著於聲響覃及歌吟㝢宙大矣抑豈必盡誣誕哉今亦摘録以庶夫存而不論焉紫玉歌搜神記曰吳王夫差小女名玉悅童子韓重欲嫁之不得乃結氣而死重遊學歸往弔之玉形見於墓側顧重延頸而歌曰南山有鳥北山張羅意欲從君讒言孔多悲結成疹沒命黃壚命之不造寃如之何羽族之長名為鳯皇一日失雄三年感傷雖有衆鳥不為匹雙故見鄙姿逢君輝光身逺心近何曾暫忘意欲一作志願命一作身見去聲近一作邇曽一作當郭長生吹笛歌幽眀録曰永嘉中太山民巢氏先為相縣令居在晉陵家婢採薪忽有一人追隨婢還家不使人見與婢宴飲輒吹笛而歌歌云閒夜寂巳深長笛亮且鳴若欲知我者姓郭字長生王敬伯宛轉歌晉書曰王敬伯㑹稽餘姚人為衛佐休假還鄉過吳維舟渚中升亭而宿是夜月華露輕敬伯鼓琴感劉惠眀亡女告敬伯就體如平生敬伯撫琴而歌女乃和之低露下深幕埀月照孤琴空絃益霄淚誰憐此夜心歌宛轉情復哀願為煙與霧氛氲同共懷亦見續齊諧記巳載前琴歌中無王敬伯前歌女歌小異今復載此青溪小姑歌二首吳均續齊諧記曰㑹稽趙文韶宋元嘉中為東扶侍廨在青溪中橋秋夜步月悵焉思歸乃倚門唱烏飛曲忽有青衣年十五六許詣門曰女郎聞歌聲有悅人者逐月遊戲故遣相問文韶都不之疑遂邀暫過須㬰女郎至年可十八九許容色絶妙謂文韶曰聞君善歌能為作一曲否文韶即為歌草生磐石下聲甚清美女郎顧青衣取箜篌鼓之泠泠似楚曲又令侍婢歌繁霜自脫金簮叩箜篌和之婢乃歌曰云云留連宴寢將旦别去以金簮遺文韶文韶亦贈以銀碗及琉璃匕眀日于青溪廟中得之乃知昨所見青溪神女也按干寶搜神記曰廣陵蔣子文嘗為秣陵尉因擊賊傷而死吳孫權時封中都矦立廟鍾山異苑曰青溪小姑蔣矦第三妹也日暮風吹葉落依枝丹心寸意愁君末知歌闋夜巳久繁霜侵曉幕何意空相守坐待繁霜落廬山夫人女婉撫琴歌祖台志怪曰建康小吏曹著見廬山夫人夫人命女婉與著相見婉見著欣悅命婢瓊林取琴出婉撫琴歌曰云云歌畢婉便還去登廬山兮鬱嵳峩晞陽風兮拂紫霞招若人兮濯靈波欣良運兮暢雲柯彈鳴琴兮樂莫過雲龍㑹兮樂太和陳阿登彈琴歌幽眀録曰句章人至東野還暮不至門見路傍有小屋燈火因投寄止宿有一小女不欲與丈夫共宿呼鄰家女自伴夜共彈琴箜􅔃至曉此人謝去問其姓字女不答彈琴而歌曰云云眀至東郭外有賣食母在市中此人寄坐因說昨所見母聞驚曰是我女近死葬于郭外連綿葛上藤一緩復一絙欲知我名姓姓陳名阿登陵欣歌異苑曰建康陵欣景平中死于揚州作部尅辰當葬作部督夢欣云今為獄公姥祖夕有期莫由自反勞君解謝令得放遣督不信夜後又夢言辭轉切因歌一曲云督覺為謝從此便絶生時世上人死作獄中鬼不得還墳墓死沒有餘罪聶包鬼歌劉叔敬異苑曰臨川聶包死數年忽詣南豐相沈道襲共飲其歌笑甚有倫次每歌云花盈盈正聞行當歸不聞死復生鬼仙歌謡出異苑登阿儂孔雀樓遙聞鳯皇鼓下我鄒山頭髣佛見梁魯燉煌父老夢語晉書曰凉後主歆字士業嗣父盛為凉公領凉州牧護羌校尉士業立而宋受禪聞沮渠䝉遜南伐禿髮耨檀士業率步騎三萬攻張掖與䝉遜距戰為䝉遜所害先是有燉煌父老令狐熾夢白頭公衣帢而謂熾曰云云言訖忽不見士業小字桐椎至是而亡南風動吹長木胡桐椎不中轂窗呼祁孔賓晉書曰祁嘉字孔賔酒泉人少清貧好學年二十餘夜窗中有聲呼曰云云旦而逃去西至燉煌依學官誦書遂博通經傳精究大義西逰海渚教授門生張重華徴為儒林祭酒在朝卿士郡縣守令受業者二十餘人竟以夀終祁孔賓祁孔賔隱去來隱去來修飾人世甚苦不可諧所得未毛銖所喪如山崖相輪鈴音晉書曰劉曜自攻洛陽石勒將救之羣下咸諫以為不可勒以訪佛圗澄澄曰相輪鈴音云云此偈語也支秀軍也替戾岡出也僕谷劉曜胡位也劬秃當捉也此言軍出捉得曜也勒遂赴洛距曜生擒之秀支替戾岡僕谷劬秃當鬼謡異苑曰句章吳平門前忽生一株青桐樹上有謡歌之聲平惡而砍殺平隨軍北虜首尾三載死桐歘自還立于故根上又聞樹巔空中歌曰云云平尋歸如鬼謡死樹今更青吳平尋當歸適聞殺此樹巳復有光輝鐵臼歌顔之推寃魂志桃李花嚴霜當奈何桃李子嚴霜落巳犬妖歌述異記曰嘉興縣朱休之有一弟宋元嘉中兄弟對坐家有一犬來向休之蹲遍視二人遂搖頭而笑曰云云其家驚懼斬犬榜首路側至來嵗梅花時兄弟相鬬弟奮戰傷兄官收治並被囚繫經嵗得免至夏舉家時疾母及兄弟皆死言我不能歌聽我歌梅花今年故復可奈汝明年何鳥妖詩南史曰陳之將亡有鳥一足集其殿庭以胔畫地成文曰云云解者以為獨足蓋指後主獨行無衆茂草言荒穢也隋承火運草得火而後灰及後主至長安館于都水臺所謂上髙臺當水開者其言皆驗獨足上髙臺茂草變為灰欲知我家處朱門當水開古樂苑卷五十二
