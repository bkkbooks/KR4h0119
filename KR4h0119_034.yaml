body:
  text: 古樂苑卷三十四明梅鼎祚編雜曲歌辭魏吳劉勳妻藝文云代劉勳妻王氏雜詩二首玉臺作王宋自作通志佳麗四十七曲有劉勳妻王宋者平虜將軍劉勳妻也入門三十餘年後勳悅山陽司馬氏女以宋無子出之還于道中作詩二首魏文帝翩翩牀前帳張以蔽光輝昔將爾同去今將爾同歸緘藏篋笥裏當復何時披張一作可誰言去婦薄去婦情更重千里不唾井況乃昔所奉逺望未為遙踟蹰不得並種瓜篇一作春遊曲玉臺題云樂府郭本同魏明帝種瓜東井上冉冉自踰垣與君新為婚瓜葛相結連寄託不肖軀有如倚太山兔絲無根株蔓延自登緣萍藻託清流常恐身不全被蒙丘山惠賤妾執拳拳天日照知之想君亦俱然堂上行見太平御覽魏明帝武夫懷勇毅勒馬於中原干戈森若林長劒奮無前闕同前按鮑照集題云代堂上歌行凡照樂府並有代字蓋擬作也則此多為擬魏明帝矣宋鮑照四座且莫喧聽我堂上歌昔仕京洛時髙門臨長河出入重宫裏結友曹與何車馬相馳逐賔朋好容華陽春孟春月朝光散流霞輕步逐芳風言笑弄丹葩暉暉朱顔􅋳紛紛織女梭滿堂皆美人目成對湘娥雖謝侍君間明粧帶綺羅筝笛更彈吹髙唱好相和萬曲不關情一曲動情多欲知情厚薄更聽此聲過莫一作勿情一作心齊瑟行歌録曰名都美女白馬並齊瑟行也曹植名都篇曰名都多妖女美女篇曰美女妖且間白馬篇曰白馬飾金羈皆以首句名篇猶豔歌羅敷行有日出東西隅篇豫章行有鴛鴦篇是也名都篇名都者邯鄲臨淄之類也以刺時人騎射之妙遊騁之樂而無憂國之心也按陳禇玠鬬雞東郊道出此魏陳思王植名都多妖女京洛出少年寶劒直千金被服光且鮮鬬雞東郊道走馬長楸間馳騁未能半雙兔過我前攬弓捷鳴鏑長驅上南山左挽因右發一縱兩禽連餘巧未及展仰手接飛鳶觀者咸稱善衆工歸我妍歸來宴平樂美酒斗十千膾鯉臇胎蝦炮鱉炙熊蹯鳴儔嘯匹旅列坐竟長筵連翩擊掬攘巧捷惟萬端白日西南馳光景不可攀雲散還城邑清晨復來還光一作麗東郊一作長安長驅上南山一作驅上彼南山巧一作功鬬雞東郊道陳禇玠春郊鬬雞侣捧敵兩逢迎妬羣排袖出帶勇向場驚錦毛侵距散芥羽雜塵生還同戰勝罷耿介寄前鳴妬羣一作詭羣美女篇美女者以喻君子有美行願得明君而事之若不遇時雖見徴求終不屈也魏陳思王植美女妖且間採桑岐路間柔條紛冉冉葉落何翩翩攘袖見素手皓腕約金環頭上金爵叉腰佩翠琅玕明珠交玉體珊瑚間木難羅衣何飄颻輕裾隨風還顧盻遺光采長嘯氣若蘭行徒用息駕休者以忘餐借問女安居乃在城南端青樓臨大路髙門結重關容華耀朝日誰不希令顔媒氏何所營玉帛不時安佳人慕髙義求賢良獨難衆人徒嗷嗷安知彼所觀盛年處房室中夜起長歎飄颻一作飄飄安居一作何居同前晉傅玄美人一何麗顔若芙蓉花一顧亂人國再顧亂人家未亂猶可奈何闕誤同前梁簡文帝佳麗盡關情風流最有名約黃能效月裁金巧作星粉光勝玉靚衫薄擬蟬輕蜜態隨流臉嬌歌逐軟聲朱顔半巳醉微笑隱香屏同前蕭子顯邯鄲暫停舞巴姬請罷弦佳人淇洧出豔趙復傾燕繁穠既為李照水亦成蓮朝酤成都酒暝數河間錢餘光幸許借蘭膏空自煎邯鄲一作章丹同前二首北齊魏收楚襄遊夢去陳思朝洛歸參差結旌斾掩靄對驂騑變化看臺曲駭散屬川沂仍令我神女俄聞要虙妃照梁何足豔升霞反奮飛可言不可見言是復言非句闕我帝更朝衣擅寵無論賤入愛不嫌微智瓊非俗物羅敷本自稀居然陋西子定可比南威新吳何為誤舊鄭果難依甘言誠易汚得失定因機無憎藥英妬心賞易侵違同前隋盧思道京洛多妖豔餘香愛物華俱臨鄧渠水共採鄴園花時搖五明扇聊駐七香車情踈看笑淺嬌深盼欲邪微津染長黛新溜濕輕紗莫言人未解隨君獨問家鄧渠一作梁墱白馬篇白馬者見乘白馬而為此曲言人當及時立事盡力為國不可貪私也魏陳思王植白馬飾金羈連翩西北馳借問誰家子幽并遊俠兒少小去鄉邑揚聲沙漠垂宿昔秉良弓楛矢何參差控弦破左的右發摧月支仰手接飛猱俯身散馬蹄狡捷過猿猴勇剽若豹螭邊城多警急胡虜數遷移羽檄從北來厲馬登高堤長驅蹈胸奴左顧陵鮮卑寄身鋒刃端性命安可懷父母且不顧何言子與妻名編壯士籍不得中顧私捐軀赴國難視死忽如歸聲一作名胡虜一作虜騎編一作在寄一作棄同前宋袁淑劒騎何翩翩長安五陵間秦地天下樞八方輳才賢荆魏多壯士宛洛富少年意氣深自負肯事郡邑權籍籍關外來車徒傾國鄽五侯競書幣羣公亟為言義分明於霜信行直如弦交歡池陽下留宴汾隂堧一朝許人諾何能坐相捐彯節去函谷投佩出甘泉嗟此務逺圖心為四海懸但營身意遂豈校耳目前俠烈良有聞古來共知然負一作許同前鮑照白馬騂角弓鳴鞭乘北風要途問邊急雜虜入雲中閉壁自往夏清野徑還冬僑裝多闕絶旅服少裁縫埋身守漢境沈命對胡封薄暮塞雲起飛沙被逺松含悲望兩都楚歌登四墉丈夫設計誤懷恨逐邊戎棄别中國愛要冀胡馬功去來今何道卑賤生所鍾但令塞上兒知我獨為雄境一作節棄一作罷同前齊孔稚圭驥子局且鳴鐵陳與雲平漢家嫖姚將馳突胸奴庭少年鬬猛氣怒髮為君征雄戟摩白日長劒斷流星早出飛狐塞晚泊樓煩城虜騎四山合胡塵千里驚嘶笳振地響吹角拂天聲左碎呼韓陳右破休屠兵橫行絶漠表飲馬瀚海清隴樹枯無色沙草不當青勒石燕然道凱歌長安亭縣官知我健四海誰不傾但使強胡滅何須甲第成當令丈夫志獨為上古英清一作汀同前梁沈約白馬紫金鞍停鑣過上蘭寄言狹斜子詎知隴道難赤坂途三折龍堆路九盤氷生肌裏冷風起骨中寒功名志所急日暮不遑餐長驅入右地輕舉出樓蘭直去巳垂涕寧可望長安匪期定逺封無羡輕車官唯見恩義重豈覺衣裳單本持軀命答幸遇聲名完同前王僧孺千里生冀北玉鞘黃金勒散蹄去無已搖頭意相得豪氣發西山雄風擅東國飛鞚出秦隴長驅繞岷僰承謨若有神稟算良不惑瀄汨河水黃參差嶂雲黑安能對兒女垂帷弄毫墨兼弱不稱雄後得方為特此心亦何已君恩良未塞不許跨天山何由報皇德同前徐悱研蹄飾鏤鞍飛鞚度河干少年本上郡遨遊入露寒劒琢荆山玉彈把隋珠丸聞有邊烽急飛候至長安然諾竊自許捐軀諒不難占兵出細栁轉戰向樓蘭雄名盛李霍壯氣勇彭韓能令石飲羽復使髮衝冠要功非汗馬報效乃鋒端日沒塞雲起風悲胡地寒西征馘小月北去腦烏丸歸報明天子燕然今復刋今一作石同前文苑英華作煬帝樂府作孔稚圭詩紀云按詩中多敘征遼之事當以英華為正稚圭别有一篇隋煬帝白馬金具裝橫行遼水傍問是誰家子宿衛羽林郎文犀六屬鎧寶劒七星光山虛弓響徹地迥角聲長宛河推勇氣隴蜀擅威強輪臺受降虜髙闕翦名王射熊入飛觀校獵下長楊英名欺衛霍智䇿蔑平良島夷時失禮卉服犯邊疆徵兵集薊北輕騎出漁陽集軍隨日暈挑戰逐星芒陳移龍勢動營開虎翼張衝冠入死地攘臂越金湯塵飛戰鼓急風交征斾揚轉鬬平華地追奔掃帶方本持身許國況復武功彰會令千載後流譽滿旗常具一作具集一作離同前王胄白馬黃金鞍蹀躞栁城前問此何鄉客長安惡少年結髮從戎事馳名振朔邊良弓控繁弱利劒揮龍泉披林扼雕虎仰手接飛鳶前年破沙漠昔嵗取祁連折衝摧右校搴旗殪左賢虒彌還謝力慶忌本推儇海外平遐險來庭識負褰三韓勞薄伐六事指幽燕良家選河右猛將征西山浮雲屯羽騎蔽日引長旃自矜有餘勇應募忽爭先王師已得俊夷首失求全鼓行徇玉檢乘勝蕩朝鮮志勇期功立寧憚微軀捐不羡山河賞唯希竹素傳鞍一作鞭泉一作淵虒彌一作昆彌失求一作諒失同前辛德源任俠重芳辰相從兢逐春金羈絡赭汗紫縷應紅塵寶劍提三尺雕弓韜六鈞鳴珂蹀細栁飛蓋出宜春遙見浮光發懸知上頭人紫縷應紅塵一作紫陌映紅塵提一作橫光一作雲當牆欲髙行魏陳思王植龍欲升天須浮雲人之仕進待中人衆口可以鑠金讒言三至慈母不親憒憒俗間不辨偽真願欲披心自説陳君門以九重道逺河無津當欲遊南山行魏陳思王植東海廣且深由卑下百川五嶽雖髙大不逆垢與塵良木不十圍洪條無所因長者能博愛天下寄其身大匠無棄材船車用不均錐刀各異能何所獨却前嘉善而矜愚大聖亦同然仁者各夀考四坐咸萬年當事君行魏陳思王植人生有所貴尚出門各異情朱紫更相奪色雅鄭異音聲好惡隨所愛憎追舉逐虛名百心可事一君巧詐寧拙誠虛一作聲當車已駕行魏陳思王植歡坐玉殿會諸貴客侍者行觴主人離席顧視東西廂絲竹與鞞鐸不醉無歸來明燈以繼夕桂之樹行魏陳思王植桂之樹桂之樹桂生一何麗佳揚朱華而翠葉流芳布天涯上有棲鸞下有盤螭桂之樹得道之真人咸來會講仙教而服食日精要道甚省不煩淡泊無為自然乘蹻萬里之外去留隨意所欲存高高上際於衆外下下乃窮極地天苦思行魏陳思王植緑蘿緣玉樹光耀粲相暉下有兩真人舉翅翻髙飛我心何踊躍思欲攀雲追鬱鬱西嶽顛石室青蔥與天連中有耆年一隱士鬚髮皆皓然策杖從吾遊教我要忘言升天行二首樂府解題曰曹植又有上仙籙與神遊五遊龍欲升天等篇皆傷人世不永俗情險艱當求神仙翺翔六合之外與飛龍仙人逺遊篇前緩聲歌同意魏陳思王植乘蹻追術士逺之蓬萊山靈液飛素波蘭桂上參天玄豹遊其下翔鵾戲其顛乘風忽登舉倣佛見衆仙拂一作徨扶桑之所出乃在朝陽溪中心陵蒼昊布葉蓋天涯日出登東幹既夕沒西枝願得紆陽轡回日使東馳同前宋鮑照家世宅關輔勝帶宦王城備聞十帝事委曲兩都情倦見物興衰驟覩俗屯平翩翻類回掌恍惚似朝榮窮塗悔計短晚志愛長生從師入逺嶽結友事仙靈五芝發金記九籥隱丹經風餐委松宿雲卧恣天行冠霞登綵閣解玉飲椒庭暫遊越萬里近别數千齡鳳臺無還駕簫管有遺聲何當與爾曹啄腐共吞腥翩翻一作翩翩愛一作重芝一作圖飲一作隱近一作少當一作時同前梁劉孝勝堯攀已徒説湯捫亦妄陳欲訪青雲侣正遇丹丘人少翁俱仕漢韓終苦入秦汾隂觀化鼎瀛洲宴羽人廣成參日月方朔問星辰驚祠伐楚樹射藥戰江神閶闔皆曾倚太一豈難親趙簡猶聞樂周儲固上賔秦皇多忌害元朔少寬仁終無良有以非關德不鄰同前隋盧思道尋師得道訣輕舉厭人羣玉山候王母珠庭謁老君煎為返魂藥刻作長生文飛䇿乘流電雕軒曳彩雲玄洲望不極赤野眺無垠金樓旦􅑬嵼玉樹曉氛氲擁琴遙可望吹笙逺詎聞不覺蜉蝣子死葬何紛紛彩作白死葬作生死同前題云英才言聚賦得升天行釋慧靜馭風過閬苑控鶴下瀛洲欲採三芝秀先從千仞遊駕鳳吟虛管乘槎泛淺流頽齡一已駐方驗大椿秋豔歌魏陳思王植出自薊北門遙望胡地桑枝枝自相值葉葉自相當闕太平御覽作桑枝自相值桑葉自相當出自薊此門行曹植豔歌行出自薊北門遙望胡地桑枝枝自相值葉葉自相當樂府解題曰出自薊北門行其致與從軍行同而兼言燕薊風物及突騎勇悍之狀若鮑照羽檄起邊庭備敘征戰苦辛之意通典曰燕本秦上谷郡薊即漁陽郡皆在遼西漢書曰薊故燕國也宋鮑照羽檄起邊亭烽火入咸陽徵騎屯廣武分兵救朔方嚴秋筋竿徑虜陳精且強天子按劒怒使者遙相望鴈行緣石徑魚貫度飛梁簫鼓流漢思旌甲被胡霜疾風衝塞起沙礫自飄揚馬毛縮如蝟角弓不可張時危見臣節世亂識忠良投軀報明主身死為國殤騎一作師思當作颸同前陳徐陵薊北聊長望黃昏心獨愁燕山對古剎代郡隱城樓屢戰橋恆斷長氷塹不流天雲如地陳漢月帶胡秋漬土泥函谷挼繩縛涼州平生燕頷相會自得封侯山一作然隱一作倚同前周庾信薊門還北望役役盡傷情關山連漢月隴水向秦城笳寒蘆葉脆弓凍紵弦鳴梅林能止渴復姓可防兵將軍朝挑戰都護夜巡營燕山猶有石須勒幾人名朝挑一作連轉苦熱行魏陳思王植行遊到日南經厯交趾鄉苦熱但暴露越夷水中藏闕同前曹植苦熱行行遊到日南經厯交址鄉苦熱但暴露越夷水中藏樂府解題曰苦熱行備言流金爍石火山炎海之艱難也若鮑照赤坂橫西阻火山赫南威言南方瘴癘之地盡節征伐而賞之而太薄也宋鮑照赤坂橫西阻火山赫南威身熱頭且痛鳥墮魂來歸湯泉發雲潭焦煙起石磯日月有恆昏雨露未嘗晞丹蛇踰百尺玄蜂盈十圍含沙射流影吹蠱痛行暉瘴氣晝熏體菵露夜霑衣飢猿莫下食晨禽不敢飛毒涇尚多死渡瀘寧具腓生軀蹈死地昌志登禍機戈船榮既薄伏波賞亦微爵輕君尚惜士重安可希吹蠱一作吹鼓誤痛一作病登一作髙同前梁簡文帝六龍騖不息三伏啓炎陽寢興煩几案俯仰倦幃牀滂沱汗似鑠微靡風如湯洄池愧玉浪蘭殿非含霜細簾時半卷輕幌乍橫張雲斜花影沒日落荷心香願見洪崖井詎憐河朔觴同前題云苦熱此與下姑從郭本按傅玄亦有苦熱詩原未録任昉旭旦煙雲卷烈景入東軒傾光望轉蕙斜日照西垣既卷焦梧葉復傾葵藿根重簟無冷氣挾石似懷溫霡霂類珠綴喘嚇狀雷奔同前題云苦熱何遜昔聞草木焦今覩沙石爛曀曀風愈靜曈曈日漸旰習靜閟衣巾讀書煩几案卧思清露浥坐待明星燦蝙蝠戶間飛蠛蠓窗中亂會無河朔飲室有臨淄汗遺金自不拾惡木寧無幹願以三伏晨催促九秋換覩一作窺閟一作悶同前題云和樂儀同苦熱姑從郭本周庾信火井沈熒散炎洲髙焰通鞭石未成雨鳴鳶不起風思為鸞翼扇願備明光宫臨淄迎子禮中散就安豐美酒含蘭氣甘瓜開蜜筒寂寥人事屏還得隱牆東妾薄命二首樂府解題曰妾薄命曹植云日月既逝西藏蓋恨燕私之歡不久梁簡文帝名都多麗質傷良人不返王嬙逺聘盧姬嫁遲也魏陳思王植攜玉手喜同車北上雲閣飛除釣臺蹇産清虛池塘觀沼可娛仰泛龍舟緑波俯擢神草枝柯想彼宓妃洛河退詠漢女湘娥觀一作靈日月既逝西藏更會蘭室洞房華燈步障舒光皎若日出扶桑促樽合坐行觴主人起舞􅀢盤能者冗觸别端騰觚飛爵闌干同量等色齊顔任意交屬所歡朱顔發外形蘭袖隨禮容極情妙舞仙仙體輕裳解履遺絶纓俯仰笑喧無呈覽持佳人玉顔齊舉金爵翠盤手形羅袖良難腕弱不勝珠環坐者歎息舒顔御巾裛粉君傍中有霍納都梁雞舌五味雜香進者何人齊薑恩重愛深難忘召延親好宴私但歌杯來何遲客賦既醉言歸主人稱露未晞日月既逝一作日既逝矣華燈步障舒光玉臺作花燭步障輝煌樽一作酒妙一作屢裳解一作解裳舉玉臺作接同前名都多麗質本自恃容姿蕩子行未至秋胡無定期玉貌歇紅臉長嚬串翠眉奩鏡迷朝色縫針脆故絲本異搖舟咎何關竊席疑生離誰拊背溘死詎來遲王嬙貌本絶踉蹌入氈帷盧姬嫁日晚非復少年時轉山猶可遂烏白望難追妾心徒自苦傍人會見嗤串一作慣追一作期同前劉孝威去年從越障今嵗歿胡庭嚴霜封碣石驚沙暗井陘玉篸久落鬢羅衣長挂屏浴蠶思漆水條桑憶鄭坰寄書朝鮮吏留釧武安亭忽言戎夏隔但念心契冥不見豐城劍千祀復同形同前拾遺作孝威劉孝勝馮薑朝汲逺徐吾夜火窮舊井長逢幕鄰燈欲未通五逐無來聘三娶盡凶終離災陽祿觀就廢昭臺宫乘屯迹雖淑應戚理恆同復傳蘇國婦故愛在房櫳愁眉歇巧黛啼妝落豔紅織書凌竇錦敏誦軼繁弓離劒行當合春牀勿怨空五遊魏陳思王植九州不足步願得凌雲翔逍遙八紘外遊目厯遐荒披我丹霞衣襲我素霓裳華蓋紛暗藹六龍仰天驤曜靈未移景倐忽造昊蒼閶闔啓丹扉雙闕曜朱光徘徊文昌殿登陟太微堂上帝休西櫺羣后集東廂帶我瓊瑤佩潄我沆瀣漿踟蹰玩靈芝徙倚弄華芳王子奉仙藥羡門進竒方服食享遐紀延夀保無疆逺遊篇楚辭逺遊章曰悲時俗之迫厄兮願輕舉而逺遊質菲薄而無因兮焉託乘而上浮王逸云逺遊者屈原之所作也屈原履方直之行不容於世困於讒佞無所告訴乃思與仙人俱遊戲周厯天地無所不至焉周王褒又有輕舉篇亦出於此按秦宓有逺遊一首言客子逺遊之意與此不同未録魏陳思王植逺遊臨四海俯仰觀洪波大魚若曲陵承浪相經過靈鱉戴方丈神嶽儼嵯峨仙人翔其隅玉女戲其阿瓊蕊可療飢仰潄吸雲霞崑崙本吾宅中州非我家將歸謁東父一舉超流沙鼓翼舞時風長嘯激清歌金石固易敝日月同光華齊年與天地萬象安足多輕舉篇周王褒天地能長久神仙夀不窮白玉東華檢方諸西嶽童俄瞻少海北暫别扶桑東俯觀雲似蓋低望月如弓看棋城邑改辭家墟巷空流珠餘舊竈種杏發新叢酒釀瀛洲玉劒鑄昆吾銅誰能攬六博還當訪井公仙人篇樂府廣題曰秦始皇三十六年使博士為仙真人詩遊行天下令樂人歌之曹植仙人篇曰仙人攬六著言人生如寄當養羽翼徘徊九天以從韓終王喬於天衢也陳陸瑜又有仙人攬六著篇蓋出於此郭本以神仙篇附後今從之魏陳思王植仙人攬六著對博太山隅湘娥拊琴瑟秦女吹笙竽玉樽盈桂酒河伯獻神魚四海一何局九州安所如韓終與王喬要我於天衢萬里不足步輕舉凌太虛飛騰踰景雲髙風吹我軀回駕觀紫微與帝合靈符閶闔正嵯峨雙闕萬丈餘玉樹扶道生白虎夾門樞驅風遊四海東過王母廬俯觀五嶽間人生如寄居潛光養羽翼進趨且徐徐不見昔軒轅乘龍出鼎湖徘徊九天下與爾長相須乘一作升仙人覽六著篇陳陸瑜九仙會歡賞六著且娛神戲谷聞餘地銘山憶舊秦避敵情思巧論兵勢重新問取南皮夕還笑拂棊人神仙篇題云遊仙詩應教本非樂府姑從郭本齊王融命駕瑤池側過息嬴女臺長袖何靡靡簫管清且哀璧門涼月舉珠殿秋風回青鳥騖髙羽王母停玉杯舉手暫為别千年將復來側一作隈原共五首郭載其一同前梁戴皓徒聞石為火未見坂停丸暫數盈虛月長隨晝夜瀾辭家試學道逢師得姓韓閬山金靜室蓬丘銀露壇安平醖仙酒渤海轉神丹初飛喜退鳳新學法乘鸞十芒生月腦六焰起星肝流瓊播疑俗信玉類陽官玄都宴晚集紫府事朝看謝手今為别進憐此俗難流一作飛同前英華又有億舜日一首樂府作沈約樂未央陳張正見瀛洲分渤澥閬苑隔虹霓欲識三山路須尋千仞溪石梁雲外立蓬丘霧裏迷年深毁丹竈學久棄青泥葛水留還杖天衢鳴去雞六龍驤首起雲閣萬里一别何寥廓玄都府內駕青牛紫蓋山中乘白鶴尋陽杏花終難朽武陵桃花未曾落已見玉女笑投壺復覩仙童欣六博同甘玉文棗俱飲流霞藥鸞歌鳳舞集天台金闕銀宫相向開西王巳令青鳥去東海還馭赤虬來魏武還車逢漢女荆王因夢識陽臺鳳蓋隨雲聊蔽日霓裳雜雨復乘雷神嶽吹笙遙謝手當知福地有神才同前題云神仙北齊顔之推紅顔恃容色青春矜盛年自言曉書劒不得學神仙風雲落時後嵗月度人前鏡中不相識捫心徒自憐願得金樓要思逢玉鈐篇九龍遊弱水八鳳出飛煙朝遊采瓊實夕宴酌膏泉崢嶸下無地列缺上陵天舉世聊一息中州安足旋同前隋盧思道浮生厭危促名嶽共招攜雲軒遊紫府風駟上丹梯時見遼東鶴屢聽淮南雞玉英持作寶瓊實採成蹊飛䇿揚輕電懸旌耀彩霓瑞銀光似燭靈石髓如泥寥廓鸞山右超越鳳洲西一丸應五色持此救人迷同前魯范王逺尋仙至欒巴訪術回乘空向紫府控鶴下蓬萊霜分白鹿駕日映流霞杯煎金丹未熟醒酒藥初開乍應觀海變誰肯畏年頽升仙篇梁簡文帝少室堪求道明光可學仙丹繒碧林宇緑玉黃金篇雲車了無轍風馬詎須鞭靈桃恆可餌幾回三千年飛龍篇楚辭離騷曰為余駕飛龍兮雜瑤象以為車曹植飛龍篇亦言求仙者乘飛龍而升天與楚辭同意魏陳思王植晨遊泰山雲霧窈窕忽逢二童顔色鮮好乘彼白鹿手翳芝草我知真人長跪問道西登玉堂金樓復道授我仙藥神皇所造教我服食還精補腦夀同金石永世難老堂一作臺鬬雞篇春秋左氏傳曰季郈之雞鬬季氏介其雞郈氏為之金距杜預云搗芥子播其羽也或曰以膠沙播之為介雞鄴都故事曰魏明帝太和中作鬬雞臺趙王石虎亦以芥羽漆砂鬬雞于此故曹植詩云鬬雞東郊道走馬長楸間是也魏陳思王植遊目極妙伎清聽厭宫商主人寂無為衆賔進樂方長筵坐戲客鬬雞觀間房羣雄正翕赫雙翅自飛揚揮羽激清風悍目發朱光觜落輕毛散嚴距往往傷長鳴入青雲扇翼獨翺翔願蒙狸膏助常得擅此場激一作邀悍一作博同前題云鬬雞楨與應瑒疑並陳思王同時作劉楨丹雞被華采雙距如鋒芒願一揚炎威會戰此中唐利爪探玉除瞋目含火光長翹驚風起徑翮正敷張輕舉奮勾喙電擊復還翔同前題云鬬雞應瑒戚戚懷不樂無以釋勞勤兄弟遊戲場命駕迎衆賔二部分曹伍羣雞煥以陳雙距解長􅔗飛踊超敵倫芥羽張金距連戰何繽紛從朝至日夕勝負尚未分專場驅衆敵剛捷逸等羣四坐同休贊賔主懷恱欣博奕非不樂此戲世所珍同前題云鬬雞姑從郭本徐陵庾信亦有鬬雞詩原未録梁簡文帝歡樂良無巳東郊春可遊百花非一色新田多異流龍尾橫津漢車箱起戍樓玉冠初警敵芥羽忽猜儔十日驕既滿九勝勢恆遒脫使田饒見堪能説魯侯同前劉孝威丹雞翠翼張妬敵復專場翅中含芥粉距外耀金芒氣踰上黨烈名貴下韝良祭橋愁魏后食跖忌齊王願賜淮南藥一使雲間翔盤石篇魏陳思王植盤盤山巔石飄颻澗底蓬我本太山人何為客海東蒹葭彌斥土林木無分重坼巖若崩缺湖水何洶洶蚌蛤被濵涯光彩如錦虹髙彼凌雲霄浮氣象螭龍鯨脊若丘陵鬚若山上松呼吸吞船欐澎濞戲中鴻方舟尋髙價珍寶麗以通一舉必千里乘颸舉帆幢經危履險阻未知命所鍾常恐沈黃壚下與黿鱉同南極蒼梧野遊盼窮九江中夜指參辰欲師當定從仰天長太息思想懷故邦乘桴何所志吁嗟我孔公海一作淮吁嗟一作嗟歎驅車篇魏陳思王植驅車撣駑馬東到奉高城神哉彼太山五嶽專其名隆髙貫雲霓嵯峨出太清周流二六候間置十二亭上有涌醴泉玉石揚華英東北望吳野西眺觀日精魂神所繫屬逝者感斯征王者以歸天效厥元功成厯代無不遵禮祀有品程探䇿或長短唯德享利貞封者七十帝軒皇元獨靈餐霞潄沆瀣毛羽被身形發舉蹈虛廓徑廷升窈冥同夀東父年曠代永長生撣一作揮祀一作記種葛篇魏陳思王植種葛南山下葛藟自成隂與君初婚時結髮恩義深歡愛在枕席宿昔同衣衾竊慕棠棣篇好樂如瑟琴行年將晚暮佳人懷異心恩紀曠不接我情遂抑沈出門當何顧徘徊步北林下有交頸獸仰見雙棲禽攀枝長歎息淚下沾羅襟良馬知我悲延頸代我吟昔為同池魚今若商與參往古皆歡遇我獨困於今棄置委天命悠悠安可任若一作為棄婦篇本集不載見玉臺新詠魏陳思王植石榴植前庭緑葉搖縹青丹華灼烈烈璀彩有光榮光榮曄流離可以處淑靈有鳥飛來集拊翼以悲鳴悲鳴夫何為丹華實不成拊心長歎息無子當歸寧有子月經天無子若流星天月相終始流星沒無精棲遲失所宜下與瓦石并憂懷從中來歎息通雞鳴反側不能寐逍遙於前庭踟蹰還入房肅肅帷幕聲搴帷更攝帶撫弦調鳴箏慷慨有餘音要妙悲且清收淚長歎息何以負神靈招搖待霜露何必春夏成晚穫為良實願君且安寧庭靈鳴成寧五韻重用調一作彈結客篇魏陳思王植結客少年場報怨洛北邙闕結客少年場行曹植結客篇結客少年場報怨洛北邙樂府解題曰結客少年場行言輕生重義慷慨以立功名也後漢書曰祭遵嘗為部吏所侵結客殺人廣題曰漢長安少年殺吏受財報仇相與探丸為彈探得赤丸斫武吏探得黑丸殺文吏尹賞為長安令盡捕之長安中為之歌曰何處求子死桓東少年場生時諒不謹枯骨復何葬按結客少年場言少年時結任俠之客為遊樂之場終而無成故作此曲也按齊梁間少年子長安少年行疑並本此今亦附後宋鮑照驄馬金絡頭錦帶佩吳鈎失意杯酒間白刃起相讐追兵一旦至負劒逺行遊去鄉三十載復得還舊丘升髙臨四塞表裏望皇州九衢平若水雙闕似雲浮扶宫羅將相夾道列王侯日中市朝滿車馬若川流擊鐘陳鼎食方駕自相求今我獨何為轗􅀈懷百憂塞一作關衢一作塗同前梁劉孝威少年本六郡遨遊遍五都插腰銅匕首障日錦塗蘇鷙羽裝銀鏑犀膠飾象弧近發連雙兔髙彎落九烏邊城多警急節使滿郊衢居延箭箙盡踈勒井泉枯正蒙都護接何由憚險途千金募惡少一麾擒骨都勇餘聊蹙鞠戰罷戲投壺昔為北方將今為南面孤邦君行負弩縣令且前驅戲一作暫同前周庾信結客少年場春風滿路香歌撩李都尉果擲潘河陽折花遙勸酒就水更移牀今年喜夫壻新拜羽林郎定知劉碧玉偷嫁汝南王同前隋孔紹安結客佩吳鈎橫行度隴頭鴈在弓前落雲從陳後浮吳師驚燧象燕將警奔牛轉蓬飛不息氷河結未流若使三邊定當封萬里侯同前虞世南韓魏多竒節倜儻遺名利共矜然諾心各負縱橫志結友一言重相思千里至緑沈明月弦金絡浮雲轡吹簫入吳市擊築遊燕肆尋源博望侯結客逺相求少年重一顧長驅背隴頭焰焰霜戈動耿耿劒虹浮天山冬夏雪交河南北流雲起龍沙暗木落鴈行秋輕生徇知巳非是為身謀少年子齊王融聞有東方騎遙見上頭人待君送客返桂叉當自陳同前題云詠少年姑從郭本梁吳均董生能巧笑子都信美目百萬市一言千金買相逐不道參差菜誰論窈窕淑願言奉繡被來就越人宿長安少年行題云學古三首此第一首本非樂府姑從郭氏梁何遜長安美少年羽騎暮連翩玉羈瑪瑙勒金絡珊瑚鞭陳雲橫塞起赤日下城圓追兵待都護烽火望祁連虎落夜方寢魚麗曉復前平生不可定空信蒼浪天同前陳沈炯長安好少年驄馬鐵連錢陳王裝腦勒晉后鑄金鞭步搖如飛燕寶劒似舒蓮去來新市側遨遊大道邊道邊一老翁顔鬢如衰蓬自言居漢世少小見豪雄五矦俱拜爵七貴各論功建章通北闕復道度南宫太后居長樂天子出回中玉輦迎飛燕金山賞鄧通一朝復一日忽見朝市空扶桑無復海崑山倒向東少年何暇問頽齡值福終子孫冥滅盡鄉閭復不同淚盡眼方暗脾傷耳自聾杖策尋遺老歌嘯詠悲翁遭隨各有遇非敢訪童蒙日中市朝滿出鮑照前行陳張正見雲閣綺霞生旗亭麗日明塵飛三市路蓋入九重城竹葉當壚滿桃花帶綬輕唯見爭名利安知大隱情壚初學記作杯樂府魏陳思王植墨出青松煙筆出狡兔翰古人感鳥迹文字有改判闕樂府歌魏陳思王植膠漆至堅浸之則離皎皎素絲隨染色移君不我棄讒人所為駕出北郭門行魏阮瑀駕出北郭門馬樊不肯馳下車步踟蹰仰折枯楊枝顧聞丘林中噭噭有悲啼借問啼者出何為乃如斯親母舍我歿後母憎孤兒飢寒無衣食舉動鞭捶施骨消肌肉盡體若枯樹皮藏我空室中父還不能知上冡察故處存亡永别離親母何可見淚下聲正嘶棄我於此間窮厄豈有資傳告後代人以此為明規踟蹰一作躑躅秦女休行左延年辭大略言女休為燕王婦為宗報讐殺人都市雖被囚繫終以赦宥得寬刑戮也晉傅玄云龎氏有烈婦亦言殺人報怨以烈義稱與古辭義同而事異魏左延年步出上西門遙望秦氏廬秦氏有好女自名為女休休年十四五為宗行報讐左執白楊刃右據宛魯矛讐家便東南仆僵秦女休女休西上山上山四五里關吏呵問女休女休前置辭平生為燕王婦於今為詔獄囚平生衣參差當今無領襦明知殺人當死兄言怏怏弟言無道憂女休堅辭為宗報讐死不疑殺人都市中徼我都巷西丞卿羅東向坐女休悽悽曳梏前兩徒夾我持刀刀五尺餘刀未下腫朧擊鼓赦書下廬太平御覽作樓右據宛魯矛作右援宛景矛休年一作始年關吏訶問女休作關吏得女休置一作致羅下一有列字同前此本詠龎氏婦而借秦女休為題一云秦氏有烈婦晉傳玄龎氏有烈婦義聲馳雍涼父母家有重怨仇人暴且強雖有男兄弟志弱不能當烈女念此痛丹心為寸傷外若無意者內潛思無方白日入都市怨家如平常匿劒藏白刃一奮尋身僵身首為之異處伏尸列肆旁肉與土合成泥灑血濺飛梁猛氣上干雲霓仇黨失守為披攘一市稱烈義觀者收淚並慨慷百男何當益不如一女良烈女直造縣門云父不幸遭禍殃今仇身以分裂雖死情益揚殺人當伏法義不茍活隳舊章縣令解印綬令我傷心不忍聽刑部垂頭塞耳令我吏舉不能成烈著希代之績義立無窮之名夫家同受其祚子子孫孫咸享其榮今我作歌吟詠高風激揚壯發悲且清祝衄歌髙士傳魏伐吳有竊問隱士焦先先不應謬歌後魏軍敗人推其意牂羊指吳羖䍽指魏也魏志後二句云本心為當殺牂羊更殺其羖䍽邪魏焦先祝衄祝衄非魚非肉更相追逐本為殺牂羊更殺羖䍽采薪者歌晉書曰籍嘗於蘇門山遇孫登與商略終古及栖神道氣之術登皆不應籍因長嘯而退至半嶺聞有聲若鸞鳳之音響乎巖谷乃登之嘯也遂歸著大人先生傳按傳云大人先生蓋老人也不知姓字先生過神宫而息潄吳泉而行回乎逌而遊覽焉見薪於阜者歎曰汝將焉以是終乎哉薪者曰是終我乎不以是終我乎且聖人無懷何其哀因歎而歌曰日沒云云先生聞之笑曰雖不及大庶免小矣乃歌曰天地云云按魏氏春秋曰阮籍少時遊蘇門山有隱者籍對之長嘯蘇門生莞爾而笑籍既降蘇門生亦嘯若鸞鳳之音籍乃服蘇門生之論作大人先生傳以寄所懷歌曰日沒云云又歌曰天地云云袁淑真隱傳曰蘇門先生嘗行見采薪于阜者先生歎曰汝將以是終乎哀哉薪者曰以是終者我也不以是終者我也因歌二章莫知所終則此二歌皆出採薪今依本傳魏阮籍日沒不周西月出丹淵中陽精蔽不見隂光代為雄亭亭在須臾厭厭將復隆離合雲霧兮往來知飄風富貴俯仰間貧賤何必終留侯起亡虜威武赫荒夷邵平封東陵兮一旦為布衣枝葉托根柢死生同盛衰得志從命升失勢與時隤寒暑代征邁兮變化更相推禍福無常主何憂身無歸推兹由斯負薪又何哀一並無兮字斯下有一闕選詩拾遺作寄懷歌大人先生歌天地解兮六合開星辰霣兮日月頽我騰而上將何懷爾汝歌世説新語曰晉武帝問孫皓聞南人好作爾汝歌頗能為不皓正飲酒因舉觴勸帝曰云云帝悔之吳孫皓昔與汝為鄰今與汝為臣上汝一杯酒令汝壽萬春一作願汝夀千春效孫皓爾汝歌南史曰河東王歆之嘗為南康劉雍相素輕雍後歆之與雍俱與元會並坐雍謂歆之曰卿昔見臣今能見勸一杯酒否歆之因效孫皓歌答之宋王歆之昔為汝作臣今與汝比肩既不勸汝酒亦不願汝年古樂苑卷三十四
